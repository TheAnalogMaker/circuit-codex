# amps/5e6a/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T3.1: BP2                # OT primary, V4 plate end — primary DCR omitted (plate node = B+2)
  T3.2: BP2                # OT primary centre tap, on <B+2> after the choke
  T3.3: BP2                # OT primary, V5 plate end
  T3.4: "0"                # OT secondary hot — secondary DCR folded into ground,
                           # so RNF's speaker end reads as ground at DC; mirrors
                           # the layout net_map anchor on the speaker jack.

symbols:
  # netlist RCHOKE BP1 BP2 110 Ω is the choke's winding resistance, not a
  # discrete resistor: the sheet draws the choke itself as L1.
  RCHOKE: L1

# No schematic_claim: this sheet was redrawn on 2026-09-10 from the A-EE
# drawing, and the claim is the maintainer's to grant again.
