# amps/5e6a/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T3.1: BP1                # OT primary, V4 plate end — primary DCR omitted
  T3.2: BP1                # OT primary centre tap (the <B+1> rail)
  T3.3: BP1                # OT primary, V5 plate end
  T3.4: "0"                # OT secondary hot — secondary DCR folded into ground
                           # (the RNF feedback return); mirrors layout.yaml
                           # net_map anchor SPK: '0'.

symbols:
  # The netlist letters these sections with an A suffix; the sheet draws each as
  # a single un-suffixed triode symbol.
  V2A: V2                  # netlist XV2A P2A G2A K2A -> the sheet's V2
  V3A: V3                  # netlist XV3A PPI GPI KPI -> the sheet's V3
