# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5e6a"
name_style: "Tweed Bassman-style"
family: tweed
era:
  start: 1956
  end: 1957
wattage: 40
tubes: [12AY7, 12AY7, 12AX7, 6L6G, 6L6G, 5U4GA, 5U4GA]
topology:
  rectifier: { kind: tube, type: "5U4GA", count: 2, note: "two rectifier tubes in parallel, each HT lead to one plate of each bottle, into a 16 µF can and then a choke" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: cathode-follower-tb   # the 5F4's split treble/bass network off a cathode follower, with a separate presence control on the driver's cathode
lineage:
  derived_from: []      # 5D6 / plain 5E6 (the "dual-rectifier" 4x10 tweed line this revises) are not yet their own corpus circuits
  influenced: ["5f6"]    # the 5F6 is this circuit's direct revision — see amps/5f6/meta.yaml (reciprocal edge added there)
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL3 plate load, RK2 cathode, CC3 coupler)
sources:
  - desc: "Fender, \"Bass-Man\" Schematic, Model 5E6-A (drawing code A-EE). Supplies every component value, the stage chain and the printed voltage chart. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5e6a.pdf"
  - desc: "Fender, \"Bass-Man\" Layout, Model 5E6-A (drawing code A-EE), page 1. Supplies the order of parts on the board; the socket wiring (the second 12AY7's 100 kΩ plate load across its socket from pin 6 to pin 1, with a pin 7 to pin 1 jumper; the 12AX7's driver plate on pin 1 and cathodyne plate on pin 6; each 6L6G's 1.5 kΩ grid stopper on the socket); the choke's two leads to the +420 V and +410 V capacitors; the tone parts at the controls; and the +70 V printed at the cathodyne's resistor junction. It letters three parts differently from the schematic: one mixer resistor as 250 K, the Treble bleed capacitor's rating as 600 V, and a \"47 MMF\" capacitor across the Treble control that the schematic does not draw. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5e6a.pdf"
  - desc: "Fender, \"Bass-Man\" Schematic, Model 5E6 (same drawing code A-EE as the 5E6-A). Read side by side with the 5E6-A to date the one substantive change. A handwritten note beside the bias-supply resistor reads \"THIS CHANGE TO INCREASE BIAS ON PLATES SO WON'T GET HOT\", with the resistor's value struck through. The 5E6-A prints the new value (3300 Ω) cleanly with no note, so the -A suffix marks that fix. A smaller series resistor ahead of this bias rectifier gives a more negative bias, which fits the note's aim of reducing 6L6G plate dissipation."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5e6.pdf"
  - desc: "Schematic Heaven, Fender Bassman 5E6-A schematic and layout scan. A second archived copy of the same A-EE drawing."
    url: "https://schematicheaven.net/fenderamps/bassman_5e6a_schem.pdf"
  - desc: "Wikipedia, \"Fender Bassman\". Dates the 5E6 and 5E6-A narrow-panel, dual-rectifier 4×10 circuits to 1955–1957, as refinements of the 5D6. This page uses the later part of that range (1956–1957) for the -A revision, because no source gives a clear split between 5E6 and 5E6-A production dates (see the Bassman family page)."
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
verification:
  status: draft   # Rebuilt 2026-09-10 from the A-EE drawing's two pages: the
                  # netlist now carries all seven stages the schematic draws,
                  # and every printed voltage (17 nodes) lands within the chart's
                  # tolerance. The schematic and the board were redrawn with it;
                  # both equivalence gates and the sheet-vs-board gate are clean.
                  # It stays draft for the maintainer's review of the rebuilt
                  # drawings. Two things the drawing does not settle: which input
                  # jack feeds which grid (the layout takes both leads under the
                  # board as a pair), and the choke's resistance (not printed;
                  # the model's 110 Ω is sized to the printed 10 V drop).
added: 2026-08-08
contributors: [TheAnalogMaker]
