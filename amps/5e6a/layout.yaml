# Board layout — redrawn from the published Fender "Bass-Man" Layout, Model
# 5E6-A (A-EE), read at its native 6463 x 3809 on 2026-09-10. Part refs are
# the shared key into bom.yaml; the renderer reads each value and part type from
# there. A legible, schematic-style redraw of the board's principal components in
# the order the drawing shows them, with a lead-by-lead wiring layer — never a
# trace or a dimensioned reproduction.
#
# The drawing's board reads left to right: the bias supply (3300 / 56K / 100 MFD),
# four 16 MFD cans (+420, +410, +410, +335) with the first 10K under them, the
# phase-inverter parts (driver 1500 and the 20K feedback resistor, the cathodyne's
# 1 MEG / 56K / 1500, the two couplers and their 220K leaks, the 56K and 100K
# plate loads, the second 10K), the 8 MFD +275 V can, the gain stage and
# cathode follower (25 MFD, 1500, 100K), the tone network's board parts (220K,
# 0.1 MFD, 250 MMF, 220K), the 10 MEG and the two mixers, and the input stage
# (two 0.02 MFD couplers either side of the two 100K plate loads, 250 MFD, 820).
#
# Socket wiring read off the same page: on the second 12AY7 the 100K plate load
# is soldered across the socket from pin 6 to pin 1 and a jumper takes pin 7 to
# pin 1 (gain stage on pins 1/2/3, follower on 6/7/8); on the 12AX7 the +200 V
# driver plate lands on pin 1 and the +260 V cathodyne plate on pin 6; on the
# input 12AY7 the bright volume's coupler comes from pin 6, and pins 8 and 3 are
# jumpered for the shared cathode. Each 6L6G carries its 1.5 kΩ grid stopper on
# the socket from pin 6, where the coupler and the 220K leak land, to the grid at
# pin 5.
#
# No wiring_claim: this board was redrawn on 2026-09-10 and the claim is the
# maintainer's to grant again.
board:
  rows: 2
  cols: 74
  title: "5E6-A · eyelet board layout"
caption: >-
  Redrawn from the published Fender 5E6-A (A-EE) layout drawing — the principal
  board components in the order the drawing shows them, with their hookup. Two
  5U4GA rectifiers run in parallel, each HT lead to one plate of each bottle,
  into the first 16 µF can at +420 V; the choke is a chassis part whose two leads
  come up through a grommet to that can and to the two +410 V cans, and the
  output transformer's centre tap and both screens take their supply after it.
  Each 6L6G carries its 1.5 kΩ grid stopper on the socket, and the gain stage's
  100 kΩ plate load (RL3) sits across the second 12AY7's socket, as the drawing
  mounts them. The tone network's pot-side parts hang at the controls: the
  0.005 µF at the Bass, the 0.01 µF and the 47 pF at the Treble, the 220 kΩ strung
  from the Bass wiper to the Treble wiper, the 0.1 µF at the Presence and the
  100 pF bright cap at the bright Volume. The two 1 MΩ input grid leaks mount at
  the jacks. The drawing takes both input leads under the board as a pair, so it
  does not show which jack feeds which grid; the one drawn here is the
  schematic's order. The standby, AC and ground switches, the fuse and the two
  0.05 µF bypass caps are chassis parts, off this drawing. The 6.3 V heater chain
  (green twisted pair, power transformer → pilot lamp → the two 6L6G → the 12AX7
  → the two 12AY7) follows the daisy order of the sheet's tube row; the two 5U4GA
  are directly heated from their own 5 V winding. Not a trace or a dimensioned
  reproduction.
source: {desc: 'Fender "Bass-Man" Layout, Model 5E6-A (A-EE), page 1', url: 'https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5e6a.pdf'}

parts:
