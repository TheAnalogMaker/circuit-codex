  - { ref: C14,  a: [0, 2],  b: [0, 3] }    # 100 MFD 25 V; + end (a) to ground, as the schematic letters it
  # --- filter cans and the first dropper ----------------------------------
  - { ref: C9,   a: [0, 5],  b: [0, 6] }    # 16 MFD, +420 V
  - { ref: C10,  a: [0, 7],  b: [0, 8] }    # 16 MFD, +410 V
  - { ref: C11,  a: [0, 9],  b: [0, 10] }   # 16 MFD, +410 V
  - { ref: RD1,  a: [1, 11], b: [1, 12] }   # 10K, +410 -> +335
  - { ref: C12,  a: [0, 12], b: [0, 13] }   # 16 MFD, +335 V
  # --- phase inverter: driver + cathodyne -----------------------------------
  - { ref: RK3,  a: [0, 15], b: [1, 15] }   # 1500, driver cathode -> ground
  - { ref: RNF,  a: [1, 16], b: [1, 17] }   # 20K, driver cathode -> speaker line
  - { ref: RGPI, a: [1, 18], b: [1, 19] }   # 1 MEG, cathodyne grid -> junction
  - { ref: RKB,  a: [0, 21], b: [1, 21] }   # 56K, junction -> ground
  - { ref: RKA,  a: [1, 22], b: [1, 23] }   # 1500, cathodyne cathode -> junction
  - { ref: C6,   a: [0, 24], b: [0, 25] }   # .1 MFD 200 V, cathode -> V5 grid feed
  - { ref: RGL2, a: [1, 25], b: [1, 26] }   # 220K, V5 grid feed <- -42 V
  - { ref: RGL1, a: [1, 27], b: [1, 28] }   # 220K, V4 grid feed <- -42 V
  - { ref: RLA,  a: [1, 29], b: [1, 30] }   # 56K, +335 -> cathodyne plate
  - { ref: C5,   a: [0, 31], b: [0, 32] }   # .1 MFD 400 V, plate -> V4 grid feed
  - { ref: CC3,  a: [0, 33], b: [0, 34] }   # .02 MFD 600 V, driver plate -> cathodyne grid
  - { ref: RLD,  a: [1, 35], b: [1, 36] }   # 100K, +335 -> driver plate
  - { ref: RD2,  a: [1, 37], b: [1, 38] }   # 10K, +335 -> +275
  - { ref: C13,  a: [0, 39], b: [0, 40] }   # 8 MFD, +275 V
  # --- gain stage + cathode follower ------------------------------------------
  - { ref: RK2,  a: [0, 42], b: [1, 42] }   # 1500, gain-stage cathode -> ground
  - { ref: C2,   a: [0, 43], b: [0, 44] }   # 25 MFD 25 V, across RK2
  - { ref: RKCF, a: [0, 46], b: [1, 46] }   # 100K, follower cathode -> ground
  # --- tone network (board side) ----------------------------------------------
  - { ref: RBL,  a: [1, 47], b: [1, 48] }   # 220K, ground -> the bass branch's first node
  - { ref: C3,   a: [0, 49], b: [0, 50] }   # .1 MFD 200 V, follower cathode -> first node
  - { ref: C4,   a: [0, 51], b: [0, 52] }   # 250 MMF, follower cathode -> Treble
  - { ref: RTS,  a: [1, 53], b: [1, 54] }   # 220K, first node -> Bass wiper
  - { ref: RFB,  a: [1, 55], b: [1, 56] }   # 10 MEG, first node -> gain-stage grid
  - { ref: RM1,  a: [1, 57], b: [1, 58] }   # mixer, bright Volume wiper -> gain-stage grid (lettered 250 K on this page)
  - { ref: RM2,  a: [1, 59], b: [1, 60] }   # 270K mixer, normal Volume wiper -> gain-stage grid
  # --- input stage ------------------------------------------------------------
  - { ref: CC1,  a: [0, 61], b: [0, 62] }   # .02 MFD 600 V, V1 pin 6 -> bright Volume
  - { ref: RL1,  a: [1, 63], b: [1, 64] }   # 100K, +275 -> V1 pin 6
  - { ref: RL2,  a: [1, 65], b: [1, 66] }   # 100K, +275 -> V1 pin 1
  - { ref: CC2,  a: [0, 67], b: [0, 68] }   # .02 MFD 600 V, V1 pin 1 -> normal Volume
  - { ref: C1,   a: [0, 69], b: [0, 70] }   # 250 MFD 6 V, across RK1
  - { ref: RK1,  a: [0, 72], b: [1, 72] }   # 820, shared cathode -> ground

