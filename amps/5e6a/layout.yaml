board: {rows: 2, cols: 94, title: 5E6-A · eyelet board layout}
caption: Redrawn from the published Fender 5E6-A (A-EE) layout drawing — the principal board components
  in the order the drawing shows them, with their hookup. This circuit runs two 5U4GA rectifier tubes
  in parallel with no choke, so the plates, screens and OT centre tap all land on one first-filter node
  (three 16 µF cans, C9/C10/C11) rather than the choke-fed screen node most of this corpus's other tweed
  amps carry. Pots (volume ×2, bass, treble, presence) are panel-mounted, off the board, as the sheet
  draws them; the fixed tone-network parts (RBL/RTS/RBS/CBS/RNF/C3/C4/C7/C8) are on the board. The channel-jumper
  cap (CJ1) and each channel's 100 kΩ padding resistor (RP1/RP2) sit between the coupling caps and the
  volume pots, as the published sheet draws them. The board's several chassis-ground returns are drawn as one bare ground bus in
  the house style. The 6.3 V heater chain (green twisted pair, power transformer → pilot lamp → the two
  6L6G → the 12AX7 → the two 12AY7) follows the daisy order of the sheet's tube row; the two 5U4GA rectifiers
  are directly heated from the 5 V winding and off the 6.3 V chain. The power-transformer primary leads
  land on chassis switches, off the board. Not a trace or a dimensioned reproduction.
source: {desc: 'Fender "Bass-Man" Layout, Model 5E6-A (A-EE), page 1', url: 'https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5e6a.pdf'}
