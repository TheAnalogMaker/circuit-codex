net_map:
  anchors: {T3.blue: BP1, T3.brown: BP1, T3.red: BP1, SPK: '0'}
  series_bridge: {RP1: '100k channel-A volume-pot padding resistor — no DC path through it (downstream
      of the DC-blocking CC1 coupler), so it carries no grid current', RP2: 100k channel-B volume-pot
      padding resistor — same}
  netlist_unplaced: {RG3: 'V2 grid return — realised through the two channels'' 1M volume-pot bodies (VR1/VR2)
      and the 270k mixers (RM1/RM2) to ground, plus RFB''s own light plate-tie, not a single discrete
      board resistor'}
