# Parts list — reference designators match netlist.cir where the part is
# DC-modeled. schematic.kicad_sch (drawn 2026-08-08 from a fresh lug-level
# read of the high-resolution Schematic Heaven A-EE scan, cross-checked
# against the El34World copy) now carries every part below with a real ref —
# that pass also corrected two prior mis-readings: the "10 MΩ channel-linking
# resistor... in series with a small mica cap" entry was actually two unrelated
# parts (RFB, a V2 plate-to-grid feedback resistor with nothing to do with the
# input jacks; CJ1, a channel-jumper cap between the two channels' post-coupler
# nodes), and two 100 kΩ padding resistors (RP1/RP2, ahead of each volume pot)
# had not been catalogued at all. The presence/bass/treble ladder's own internal
# wiring is drawn as read this pass but keeps a documented residual uncertainty
# — see schematic.kicad_sch's own annotation and notes.md — short of the
# lug-by-lug confidence amps/5f6/5f6a earned on 2026-08-03.
notes: "Two rectifier tubes (V6/V7) are documented but not DC-modeled — an ideal B+ source stands in for the rectifier+PT, the corpus-wide convention (see netlist.cir header). The tone-stack ladder, the volume-pot bodies and the channel-jumper cap are likewise off netlist.cir's DC path (DC-open or abstracted) even though they now carry real schematic refs."
