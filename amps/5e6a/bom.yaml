  - { ref: L1,  part: "Filter choke",         value: "part number not printed", role: "+420 V → +410 V; the OT centre tap and both screens sit after it" }
  - { ref: C10, part: "Electrolytic capacitor", value: "16 µF · 450 V", role: "Filter, +410 V (first of two cans on this node)" }
  - { ref: C11, part: "Electrolytic capacitor", value: "16 µF · 450 V", role: "Filter, +410 V (second of two cans on this node)" }
  - { ref: RD1, part: "Power resistor",       value: "10 kΩ",         role: "Rail dropper, +410 V → +335 V" }
  - { ref: C12, part: "Electrolytic capacitor", value: "16 µF · 450 V", role: "Filter, +335 V (driver and cathodyne)" }
  - { ref: RD2, part: "Power resistor",       value: "10 kΩ",         role: "Rail dropper, +335 V → +275 V" }
  - { ref: C13, part: "Electrolytic capacitor", value: "8 µF · 450 V", role: "Filter, +275 V (input stage, gain stage, follower)" }
  - { ref: RB1, part: "Carbon comp resistor", value: "3.3 kΩ · ½ W", role: "Bias supply series resistor, the HT winding's bias tap → the rectifier (changed from a higher value between the 5E6 and 5E6-A revisions — see the sources on this page)" }
  - { ref: D1,  part: "Rectifier (bias)",     value: "selenium (silicon diode in modern builds)", role: "Bias supply rectifier, + end toward RB1 and − end on the −42 V node" }
  - { ref: C14, part: "Electrolytic capacitor", value: "100 µF · 25 V", role: "Bias supply filter, −42 V node → ground" }
  - { ref: RB2, part: "Carbon comp resistor", value: "56 kΩ · ½ W",  role: "Bias supply bleeder, −42 V node → ground" }
  # --- tubes ------------------------------------------------------------------
