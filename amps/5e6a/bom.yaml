# Parts list — reference designators match schematic.kicad_sch exactly, and
# netlist.cir where the part is DC-modelled. Read from the A-EE drawing's two
# pages at their native resolution (schematic 6363 x 4071, layout 6463 x 3809),
# 2026-09-10. Where the two pages letter one part differently, the schematic's
# value is entered and the layout's lettering is stated in the role.
notes: "The two rectifier tubes (V6/V7) are not DC-modelled: an ideal B+ source stands in for the rectifier and power transformer, the corpus convention. The volume controls, the tone network's pots and every capacitor inside that network sit off the DC model's path too (DC-open or pot-dependent), though each carries its own designator. The 47 pF across the Treble control (C8) is lettered on the layout page only; the schematic page does not draw it. Parts with no designator are the mains and supply hardware the schematic draws as annotation."
items:
  # --- input stage: two channels, one 12AY7 ---------------------------------
  - { ref: RG1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Bright-channel input grid leak, mounted at the input jack" }
  - { ref: RG2, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Normal-channel input grid leak, mounted at the input jack" }
  - { ref: RL1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1A (bright) plate load" }
  - { ref: RL2, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1B (normal) plate load" }
  - { ref: RK1, part: "Carbon comp resistor", value: "820 Ω · ½ W",  role: "Shared input-stage cathode bias" }
  - { ref: C1,  part: "Electrolytic capacitor", value: "250 µF · 6 V", role: "Shared input-stage cathode bypass" }
  - { ref: CC1, part: "Coupling capacitor",   value: "0.02 µF · 600 V", role: "V1A plate → Bright volume control, hot lug" }
  - { ref: CC2, part: "Coupling capacitor",   value: "0.02 µF · 600 V", role: "V1B plate → Normal volume control, hot lug" }
  - { ref: VR1, part: "Potentiometer (taper not marked on the drawing)", value: "1 MΩ", role: "Bright-channel volume" }
  - { ref: CBR, part: "Mica capacitor",       value: "100 pF",        role: "Bright cap across VR1, hot lug to wiper (printed .0001; the layout page letters 100 MMF inside the pot)" }
  - { ref: VR2, part: "Potentiometer (taper not marked on the drawing)", value: "1 MΩ", role: "Normal-channel volume" }
  - { ref: RM1, part: "Carbon comp resistor", value: "270 kΩ · ½ W", role: "Bright-channel mixer, VR1 wiper → the gain stage's grid. The layout page letters this one 250 K; the schematic prints 270K for both mixers" }
  - { ref: RM2, part: "Carbon comp resistor", value: "270 kΩ · ½ W", role: "Normal-channel mixer, VR2 wiper → the gain stage's grid" }
  # --- second 12AY7: gain stage direct-coupled to a cathode follower --------
  - { ref: RL3, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V2A (gain stage) plate load, from the +275 V rail; the layout mounts it on the socket, pin 6 to pin 1" }
  - { ref: RK2, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V2A cathode bias" }
  - { ref: C2,  part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V2A cathode bypass" }
  - { ref: RKCF, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V2B cathode-follower load, cathode → ground" }
  - { ref: RFB, part: "Carbon comp resistor", value: "10 MΩ · ½ W",  role: "Feedback from the tone network's first node back to V2A's grid" }
  # --- tone network, fed from the follower's cathode ------------------------
  - { ref: C3,  part: "Film capacitor",       value: "0.1 µF · 200 V", role: "Tone network — follower cathode → the bass branch's first node" }
  - { ref: RBL, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Tone network — the bass branch's first node → ground" }
  - { ref: RTS, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Tone network — the bass branch's first node → the Bass control's wiper" }
  - { ref: VR4, part: "Potentiometer (taper not marked on the drawing)", value: "1 MΩ", role: "Bass — wiper on the bass branch; one end lug to ground, the other through CBS to ground" }
  - { ref: CBS, part: "Film capacitor",       value: "0.005 µF · 600 V", role: "Tone network — the Bass control's far end lug → ground (printed .005; the layout letters .005 MFD 600 VOLTS at the pot)" }
  - { ref: RTO, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Tone network — the Bass control's wiper → the Treble control's wiper, which is the driver's grid; strung pot to pot on the layout page" }
  - { ref: C4,  part: "Mica capacitor",       value: "250 pF",        role: "Tone network — follower cathode → one end of the Treble control (printed .00025; the layout letters 250 MMF)" }
  - { ref: VR3, part: "Potentiometer (taper not marked on the drawing)", value: "1 MΩ", role: "Treble — one end fed by C4, the other through C7 to ground, the wiper driving the driver's grid" }
  - { ref: C7,  part: "Film capacitor",       value: "0.01 µF · 400 V", role: "Tone network — the Treble control's far end → ground (printed .01-400; the layout page letters .01 MFD 600 V)" }
  - { ref: C8,  part: "Mica capacitor",       value: "47 pF",         role: "Across the Treble control, wiper to the lug C4 feeds. Lettered 47 MMF on the layout page, at the pot; the schematic page does not draw it" }
  # --- presence and negative feedback, on the driver's cathode --------------
  - { ref: RNF, part: "Carbon comp resistor", value: "20 kΩ · ½ W",  role: "Negative feedback, speaker line → the driver's cathode" }
  - { ref: VR5, part: "Potentiometer (taper not marked on the drawing)", value: "5 kΩ", role: "Presence — one end on the driver's cathode, the wiper through CPR to ground; the far end is open on the schematic and strapped to the wiper on the layout" }
  - { ref: CPR, part: "Film capacitor",       value: "0.1 µF · 200 V", role: "Presence wiper → ground" }
  # --- 12AX7: driver + split-load cathodyne ---------------------------------
  - { ref: RLD, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V3A (driver) plate load, from the +335 V rail" }
  - { ref: RK3, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V3A (driver) cathode bias" }
  - { ref: CC3, part: "Coupling capacitor",   value: "0.02 µF · 600 V", role: "Driver plate → cathodyne grid" }
  - { ref: RLA, part: "Carbon comp resistor", value: "56 kΩ · ½ W",  role: "V3B (cathodyne) plate load, from the +335 V rail" }
  - { ref: RKA, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "Cathodyne cathode, upper leg: cathode pin → the junction the grid leak returns to" }
  - { ref: RKB, part: "Carbon comp resistor", value: "56 kΩ · ½ W",  role: "Cathodyne cathode, lower leg: junction → ground" }
  - { ref: RGPI, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Cathodyne grid leak, returned to the 1.5 kΩ/56 kΩ junction" }
  # --- output stage, fixed bias ---------------------------------------------
  - { ref: C5,  part: "Coupling capacitor",   value: "0.1 µF · 400 V", role: "Cathodyne plate → V4's grid feed" }
  - { ref: C6,  part: "Coupling capacitor",   value: "0.1 µF · 200 V", role: "Cathodyne cathode → V5's grid feed" }
  - { ref: RGL1, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "V4 grid leak from the bias supply, landing where C5 meets R5s" }
  - { ref: RGL2, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "V5 grid leak from the bias supply, landing where C6 meets R6s" }
  - { ref: R5s, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V4 grid stopper, mounted on the socket from pin 6 to the grid at pin 5" }
  - { ref: R6s, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V5 grid stopper, mounted on the socket from pin 6 to the grid at pin 5" }
  # --- supply: two rectifiers, a choke, two droppers ------------------------
