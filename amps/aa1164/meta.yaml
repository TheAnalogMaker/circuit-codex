sources:
  - desc: "Fender, \"Princeton Reverb-Amp AA1164\" (drawing no. D 045427 rev A): sheet 1 of 2, schematic, and sheet 2 of 2, layout. Supplies every component value, the printed voltage chart and the transformer part numbers (TR1-125P1B, 340-0-340 V; TR2-125A10B; TR3-125A20B). The sheet's notice reads \"Voltages read to ground with electronic voltmeter. Values shown + or - 20%. All resistors 1/2 watt 10% tolerance if not specified. All capacitors at least 400 volt rating if not specified.\" The preamp tube is labelled 7025 (an equivalent of the 12AX7). The layout sheet mounts the tone stack's 6.8 kΩ resistor on the Bass pot, grounded to its case. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_reverb_aa1164.pdf"
  - desc: "Fender, AA1164 schematic sheet, archived separately from the two-sheet drawing. A second print of the same supply values and the same voltage chart."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_reverb_aa1164_schem.pdf"
