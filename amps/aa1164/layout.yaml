# Board layout — redrawn from the published Fender AA1164 Princeton Reverb-Amp
# layout sheet. Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them — never a
# trace or a dimensioned reproduction.
#
# The board reads left→right: the power supply, rectifier and output stage at the
# left end, the split-load phase inverter and the reverb/mixer tube in the middle,
# the reverb driver and the preamp at the right — matching the tube row on the
# drawing (5U4GB · 6V6 · 6V6 · 12AX7 tremolo+inverter · 12AX7 reverb+mixer ·
# 12AT7 reverb driver · 7025 preamp).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo oscillator's
# phase-shift network and the negative-bias supply are an excluded annotation
# layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 80
  title: "AA1164 · eyelet board layout"
caption: "Redrawn from the published Fender AA1164 Princeton Reverb-Amp layout sheet — board components in the order the drawing shows them. The tone stack sits at the board's right end where the sheet mounts it (the 250 pF, 0.1 µF and 0.047 µF capacitors and the 100 kΩ slope), with the 6.8 kΩ leg drawn at the bass control, which the sheet grounds through the control's case; the tremolo oscillator's phase-shift network sits mid-board between the phase inverter and the reverb-recovery cathode, with the Speed control's 100 kΩ drawn at that control. The negative-bias supply is a separate small board beside the pilot lamp and is not drawn, and the input grid stoppers hang at the jacks. The supply chain is drawn the way the board carries it: each filter can shares an eyelet with the dropper it feeds, so +420 → 1 kΩ → +400 → 18 kΩ → +320 → 18 kΩ → +240 reads straight across the left end. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6 output tubes → 12AX7 tremolo/inverter → 12AX7 reverb/mixer → 12AT7 reverb driver → 7025 preamp) is routed as the published sheet shows it; the 5U4GB is directly heated from the separate 5 V winding and off the 6.3 V chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Princeton Reverb-Amp AA1164' drawing no. D 045427 rev A, sheet 2 of 2 (layout)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_reverb_aa1164.pdf"

parts:
  # --- power supply (left end): each can shares an eyelet with its dropper ---
  - { ref: CF1, a: [0, 0], b: [1, 0] }     # 20 µF reservoir (+420, OT centre tap)
  - { ref: R1K, a: [0, 0], b: [0, 2] }     # 1 kΩ-1W dropper +420 → +400
  - { ref: CF2, a: [0, 2], b: [1, 2] }     # 20 µF screen / reverb-driver rail (+400)
  - { ref: RD1, a: [0, 2], b: [0, 4] }     # 18 kΩ-1W dropper +400 → +320
  - { ref: CF3, a: [0, 4], b: [1, 4] }     # 20 µF +320 node (nothing else taps it)
  - { ref: RD2, a: [0, 4], b: [0, 6] }     # 18 kΩ-1W dropper +320 → +240
  - { ref: CF4, a: [0, 6], b: [1, 6] }     # 20 µF preamp / phase-inverter rail (+240)
  # --- output stage (6V6 pair V5/V6): couplers + grid leaks, no screen stoppers ---
  - { ref: C1,   a: [0, 12], b: [0, 13] }  # 0.1 µF inverter plate → V5 grid (PPI→G61)
  - { ref: RGL1, a: [0, 13], b: [1, 13] }  # 220k 5% V5 grid leak (G61 → −34 V)
  - { ref: C2,   a: [0, 16], b: [0, 17] }  # 0.1 µF inverter cathode → V6 grid (KPI→G62)
  - { ref: RGL2, a: [0, 17], b: [1, 17] }  # 220k 5% V6 grid leak (G62 → −34 V)
  # --- split-load (cathodyne) phase inverter, V4 ---
  - { ref: RLPI,  a: [0, 18], b: [0, 19] } # 56k plate load (BD→PPI)
  - { ref: RKPI,  a: [0, 22], b: [0, 23] } # 1k cathode resistor (KPI→JPI)
  - { ref: RGPI,  a: [0, 23], b: [0, 24] } # 1M grid leak returned to the junction (JPI→GPI)
  - { ref: RTAIL, a: [0, 23], b: [1, 23] } # 56k cathode load (JPI→0)
  # --- tremolo oscillator (V4, pins 1/2/3): the K-FD layout mounts the whole
  #     group mid-board, between the inverter's cathode resistors and the ground
  #     hub the oscillator and recovery cathodes share. Ladder as both factory
  #     sheets wire it: plate → .02 → Speed node → .01 → node (1M to the
  #     cathode, vibrato pedal) → .01 → grid (1M to ground).
  - { ref: CTO4,  a: [1, 25], b: [1, 26] } # .02 output shunt (ground → trem-out node)
  - { ref: CINT,  a: [0, 25], b: [0, 26] } # .1 from the trem-out node to the Intensity control
  - { ref: RTOUT, a: [1, 27], b: [1, 26] } # 1M output series resistor (plate → trem-out node)
  - { ref: RTOP,  a: [0, 27], b: [1, 27] } # 220k plate load off the +400 rail
  - { ref: CTO1,  a: [0, 28], b: [0, 29] } # .02 plate → Speed node (jumpered from the plate eyelet)
  - { ref: CTO3,  a: [0, 29], b: [0, 30] } # .01 Speed node → middle node
  - { ref: CTO2,  a: [0, 30], b: [1, 30] } # middle node → grid (lettered .01 on both factory sheets)
  - { ref: RTO1,  a: [1, 30], b: [1, 31] } # 1M grid → ground
  - { ref: RTO2,  a: [0, 30], b: [0, 31] } # 1M middle node → oscillator cathode
  - { ref: RKTO,  a: [0, 31], b: [1, 31] } # 3.3k oscillator cathode → ground
  - { ref: CKTO,  a: [0, 32], b: [0, 31] } # 25 µF cathode bypass (ground → cathode)
  # --- reverb recovery (V3, left half) ---
  - { ref: CKR1, a: [0, 34], b: [0, 35] }  # 25 µF cathode bypass (shares KR1)
  - { ref: RKR1, a: [0, 35], b: [1, 35] }  # 1.5k cathode (KR1→0)
  - { ref: RLR1, a: [0, 36], b: [0, 37] }  # 100k plate load (BD→PR1)
  - { ref: CCR1, a: [1, 38], b: [0, 38] }  # .003 recovery plate → Reverb control (foot jumpered from the plate eyelet)
  - { ref: RGR1, a: [0, 39], b: [1, 39] }  # 220k tank-return grid resistor (GR1→0)
  # --- dry / reverb mixer into the driver grid ---
  - { ref: RMIX, a: [0, 42], b: [0, 43] }  # 3.3M dry mixing resistor (→GD1)
  - { ref: CMIX, a: [1, 42], b: [1, 43] }  # 10 pF across the 3.3M (both leads jumpered to its eyelets)
  - { ref: RMR,  a: [0, 43], b: [0, 44] }  # 470k reverb mixing resistor (Reverb wiper→GD1)
  # --- driver / mixer stage (V3, right half) with the feedback loop ---
  - { ref: RLD1, a: [0, 45], b: [0, 46] }  # 100k plate load (BD→PD1)
  - { ref: CC2,  a: [0, 46], b: [1, 46] }  # .02 driver plate → phase-inverter grid
  - { ref: RNFB, a: [1, 47], b: [1, 48] }  # 2.7k speaker feedback onto the 47 Ω junction
  - { ref: CKD1, a: [0, 48], b: [1, 48] }  # 25 µF cathode bypass (KD1→KD1B)
  - { ref: RKD1, a: [0, 49], b: [1, 49] }  # 1.5k cathode (KD1→KD1B)
  - { ref: RKD2, a: [1, 49], b: [1, 50] }  # 47 Ω unbypassed cathode resistor (KD1B→0)
  # --- reverb send + driver (V2, 12AT7 both sections paralleled) ---
  - { ref: CRS,  a: [0, 50], b: [0, 51] }  # 500 pF reverb send coupling (shares GRD)
  - { ref: RGRD, a: [0, 51], b: [1, 51] }  # 1M reverb-driver grid leak (GRD→0)
  - { ref: CKRD, a: [0, 56], b: [0, 57] }  # 25 µF cathode bypass (shares KRD)
  - { ref: RKRD, a: [0, 57], b: [1, 57] }  # 2.2k shared cathode (KRD→0)
  # --- preamp second stage (V1 pins 6/7/8, as the K-FD sheets print it) ---
  - { ref: CC1,  a: [0, 59], b: [0, 58] }  # 0.02 µF output coupling (shares PN2)
  - { ref: RLN2, a: [0, 60], b: [0, 59] }  # 100k plate load (BD→PN2)
  - { ref: CKN2, a: [0, 62], b: [0, 63] }  # 25 µF cathode bypass (shares KN2)
  - { ref: RKN2, a: [0, 63], b: [1, 63] }  # 1.5k cathode (KN2→0)
  # --- preamp input stage (V1 pins 1/2/3: grid 2 on the jacks' red lead) ---
  - { ref: RLN1, a: [0, 68], b: [0, 69] }  # 100k plate load (BD→PN1)
  # --- tone stack (right end, as the layout mounts it): 250 pF and the 100k
  #     slope off the plate eyelet, .047 and .1 standing on the slope node ---
  - { ref: CT,  a: [1, 70], b: [0, 70] }   # 250 pF plate → Treble control
  - { ref: RS,  a: [1, 70], b: [1, 71] }   # 100k slope resistor (plate → slope node)
  - { ref: CB2, a: [1, 71], b: [0, 71] }   # .047 slope node → Bass low end (the 6.8k leg)
  - { ref: CB1, a: [1, 72], b: [0, 72] }   # .1 slope node → Bass wiper / Treble low end
  - { ref: CKN1, a: [0, 77], b: [0, 78] }  # 25 µF cathode bypass (shares KN1)
  - { ref: RKN1, a: [0, 78], b: [1, 78] }  # 1.5k cathode (KN1→0)

