  - { id: V3,  ref: V3,  kind: tube, edge: bottom, at: 41,   label: "V3 · 12AX7 rev / mix" }
  - { id: VRREV, ref: VRREV, kind: pot, edge: top, at: 43,   label: "Reverb" }
