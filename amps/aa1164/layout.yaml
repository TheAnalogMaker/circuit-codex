# Board layout — redrawn from the published Fender AA1164 Princeton Reverb-Amp
# layout sheet. Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them — never a
# trace or a dimensioned reproduction.
#
# The board reads left→right: the power supply, rectifier and output stage at the
# left end, the split-load phase inverter and the reverb/mixer tube in the middle,
# the reverb driver and the preamp at the right — matching the tube row on the
# drawing (5U4GB · 6V6 · 6V6 · 12AX7 tremolo+inverter · 12AX7 reverb+mixer ·
# 12AT7 reverb driver · 7025 preamp).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo oscillator's
# phase-shift network and the negative-bias supply are an excluded annotation
# layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 63
  title: "AA1164 · eyelet board layout"
caption: "Redrawn from the published Fender AA1164 Princeton Reverb-Amp layout sheet — principal board components, in the order the drawing shows them. The tone-stack parts mount on the board on the published sheet (the 250 pF, 0.1 µF and 0.047 µF capacitors and the 100 kΩ slope at its right end, with the 6.8 kΩ leg on the bass pot's case) but are not drawn here — the stack internals are documented schematic-only; the tremolo oscillator's phase-shift network and the negative-bias supply are likewise drawn minimally, and small grid stoppers are omitted. The supply chain is drawn the way the board carries it: each filter can shares an eyelet with the dropper it feeds, so +420 → 1 kΩ → +400 → 18 kΩ → +320 → 18 kΩ → +240 reads straight across the left end. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6 output tubes → 12AX7 tremolo/inverter → 12AX7 reverb/mixer → 12AT7 reverb driver → 7025 preamp) is routed as the published sheet shows it; the 5U4GB is directly heated from the separate 5 V winding and off the 6.3 V chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Princeton Reverb-Amp AA1164' drawing no. D 045427 rev A, sheet 2 of 2 (layout)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_reverb_aa1164.pdf"

parts:
  # --- power supply (left end): each can shares an eyelet with its dropper ---
  - { ref: CF1, a: [0, 0], b: [1, 0] }     # 20 µF reservoir (+420, OT centre tap)
  - { ref: R1K, a: [0, 0], b: [0, 2] }     # 1 kΩ-1W dropper +420 → +400
  - { ref: CF2, a: [0, 2], b: [1, 2] }     # 20 µF screen / reverb-driver rail (+400)
  - { ref: RD1, a: [0, 2], b: [0, 4] }     # 18 kΩ-1W dropper +400 → +320
  - { ref: CF3, a: [0, 4], b: [1, 4] }     # 20 µF +320 node (nothing else taps it)
  - { ref: RD2, a: [0, 4], b: [0, 6] }     # 18 kΩ-1W dropper +320 → +240
  - { ref: CF4, a: [0, 6], b: [1, 6] }     # 20 µF preamp / phase-inverter rail (+240)
  # --- output stage (6V6 pair V5/V6): couplers + grid leaks, no screen stoppers ---
  - { ref: C1,   a: [0, 12], b: [0, 13] }  # 0.1 µF inverter plate → V5 grid (PPI→G61)
  - { ref: RGL1, a: [0, 13], b: [1, 13] }  # 220k 5% V5 grid leak (G61 → −34 V)
  - { ref: C2,   a: [0, 16], b: [0, 17] }  # 0.1 µF inverter cathode → V6 grid (KPI→G62)
  - { ref: RGL2, a: [0, 17], b: [1, 17] }  # 220k 5% V6 grid leak (G62 → −34 V)
  # --- split-load (cathodyne) phase inverter, V4 ---
  - { ref: RLPI,  a: [0, 18], b: [0, 19] } # 56k plate load (BD→PPI)
  - { ref: RKPI,  a: [0, 22], b: [0, 23] } # 1k cathode resistor (KPI→JPI)
  - { ref: RGPI,  a: [0, 23], b: [0, 24] } # 1M grid leak returned to the junction (JPI→GPI)
  - { ref: RTAIL, a: [0, 23], b: [1, 23] } # 56k cathode load (JPI→0)
  # --- reverb recovery (V3, left half) ---
  - { ref: CKR1, a: [0, 25], b: [0, 26] }  # 25 µF cathode bypass (shares KR1)
  - { ref: RKR1, a: [0, 26], b: [1, 26] }  # 1.5k cathode (KR1→0)
  - { ref: RLR1, a: [0, 27], b: [0, 28] }  # 100k plate load (BD→PR1)
  - { ref: RGR1, a: [0, 29], b: [1, 29] }  # 220k tank-return grid resistor (GR1→0)
  # --- dry / reverb mixer into the driver grid ---
  - { ref: RMIX, a: [0, 32], b: [0, 33] }  # 3.3M dry mixing resistor (→GD1)
  - { ref: RMR,  a: [0, 33], b: [0, 34] }  # 470k reverb mixing resistor (Reverb wiper→GD1)
  # --- driver / mixer stage (V3, right half) with the feedback loop ---
  - { ref: RLD1, a: [0, 35], b: [0, 36] }  # 100k plate load (BD→PD1)
  - { ref: RNFB, a: [1, 36], b: [1, 37] }  # 2.7k speaker feedback onto the 47 Ω junction
  - { ref: CKD1, a: [0, 37], b: [1, 37] }  # 25 µF cathode bypass (KD1→KD1B)
  - { ref: RKD1, a: [0, 38], b: [1, 38] }  # 1.5k cathode (KD1→KD1B)
  - { ref: RKD2, a: [1, 38], b: [1, 39] }  # 47 Ω unbypassed cathode resistor (KD1B→0)
  # --- reverb send + driver (V2, 12AT7 both sections paralleled) ---
  - { ref: CRS,  a: [0, 39], b: [0, 40] }  # 500 pF reverb send coupling (shares GRD)
  - { ref: RGRD, a: [0, 40], b: [1, 40] }  # 1M reverb-driver grid leak (GRD→0)
  - { ref: CKRD, a: [0, 45], b: [0, 46] }  # 25 µF cathode bypass (shares KRD)
  - { ref: RKRD, a: [0, 46], b: [1, 46] }  # 2.2k shared cathode (KRD→0)
  # --- preamp second stage (V1, right half) ---
  - { ref: CC1,  a: [0, 48], b: [0, 47] }  # 0.02 µF output coupling (shares PN2)
  - { ref: RLN2, a: [0, 49], b: [0, 48] }  # 100k plate load (BD→PN2)
  - { ref: CKN2, a: [0, 51], b: [0, 52] }  # 25 µF cathode bypass (shares KN2)
  - { ref: RKN2, a: [0, 52], b: [1, 52] }  # 1.5k cathode (KN2→0)
  # --- preamp input stage (V1, left half) ---
  - { ref: RLN1, a: [0, 57], b: [0, 58] }  # 100k plate load (BD→PN1)
  - { ref: CKN1, a: [0, 60], b: [0, 61] }  # 25 µF cathode bypass (shares KN1)
  - { ref: RKN1, a: [0, 61], b: [1, 61] }  # 1.5k cathode (KN1→0)

