# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The netlist omits transformer winding DCR, so each transformer's B+ side sits
  # at its rail node: the push-pull OT primary (both 6V6 plate leads + the centre
  # tap) collapses onto the +420 reservoir node BA, and the reverb-driver plates
  # reach the +400 rail BB through the reverb transformer's RTR3 primary DCR
  # (declared unplaced below), so TR3's B+ lead is anchored to BB. The speaker
  # jack's tip is the OT secondary's hot end, whose DCR the netlist folds into
  # ground — that is where the 2.7 kΩ feedback resistor starts.
  #
  # No excluded_tubes block: unlike ab763, this circuit's tremolo oscillator is
  # not a socket of its own — it is the OTHER half of V4 (pins 1/2/3), whose
  # phase-inverter half (6/7/8) IS modelled, so V4 anchors normally. The
  # oscillator's phase-shift network is drawn where the layout mounts it but has
  # no netlist device, so its leads are enumerated as not DC-checked.
  anchors:
    TR2.red:   BA    # OT primary centre tap → +420 reservoir
    TR2.blue:  BA    # OT primary, V5 plate lead → +420 (winding DCR omitted)
    TR2.brown: BA    # OT primary, V6 plate lead → +420 (winding DCR omitted)
    TR3.red:   BB    # reverb-transformer primary, B+ side → +400
    SPK.tip: "0"     # OT-secondary hot — winding DCR folded into ground (the feedback return)
    VRREV.lug2: "0"  # Reverb wiper — no DC flows in the pot, so the 470 kΩ mixer's far lead sits at the wiper's DC ground (the netlist collapses the control to RMR: GD1→0)
  # DC-transparent parts the netlist omits (no DC grid current): the two 68 kΩ
  # input grid stoppers mount at the jacks, off the eyelet board, so none is
  # placed here.
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out):
  netlist_unplaced:
    RTR3: "reverb transformer TR3 primary DCR (~200 Ω) — the winding, not a discrete board resistor; its B+ lead anchors to BB and its plate lead lands on the paralleled V2 plates (PRD)"
    RGN2: "Volume control VRVOL — the netlist models the second preamp stage's DC grid return as one grid-leak (GN2→0)"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-09-10).
  not_on_board:
    F1: "1 A slo-blo mains fuse — a chassis fuseholder on the layout's mains row, off the board"
    CDEATH: ".047-600 ground-switch capacitor — drawn at the GROUND SWITCH on the layout's mains row, off the board"
    DB1: "bias rectifier diode — drawn in the layout's small bias sub-box (100K 5% → diode → 25+50 cap, 22K), a separate board beside the pilot light, not on the main eyelet board"
    RB1: "100 kΩ 5% bias feed — in the layout's bias sub-box with the diode, not on the main eyelet board"
    RB2: "22 kΩ bias bleeder — in the layout's bias sub-box, not on the main eyelet board"
    CB3: "25 µF · 50 V bias filter — the '25 + 50' can in the layout's bias sub-box, not on the main eyelet board"

# Board-scope rules for the sheet ↔ board gate: parts the sheet draws that
# this board deliberately does not, by designator glob, each with where the
# cited layout drawing mounts them (2026-09-10).
scope:
  not_drawn:
    - { match: "R1[ab]", why: "68 kΩ input grid stoppers — the AA1164 layout hangs both from the Instruments jack lugs beside the 1 MΩ leak, at the jacks and not on the eyelet board" }
    - { match: "RH[12]", why: "100 Ω heater hum-balance pair — drawn at the pilot light on the layout, one from each heater lead to chassis ground, off the board" }
