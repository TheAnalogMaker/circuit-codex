  - { id: V4,  ref: V4,  kind: tube, edge: bottom, at: 21,   label: "V4 · 12AX7 trem / inv" }
  - { id: VRINT, ref: VRINT, kind: pot, edge: top, at: 24,   label: "Intensity" }
