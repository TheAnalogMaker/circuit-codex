# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 79.5] }

# Wiring — read lead-by-lead from the published AA1164 layout sheet. Transformer
# leads carry the drawing's colours. The 6.3 V heater winding is the green pair;
# it feeds the pilot lamp then daisy-chains socket to socket (style: twisted),
# skipping the directly-heated 5U4GB (its filament is on the separate 5 V winding).
runs:
  # === power transformer HT → 5U4GB → reservoir (annotation layer) =============
  - { from: TR1.red1, to: V7.pin4, via: [[1.5, 0.32]] }
  - { from: TR1.red2, to: V7.pin6, via: [[2.7, 0.58]] }
  - { from: TR1.red-yellow, to: [1.45, 1.4], via: [[0.5, 1.25]] }   # HT centre tap → ground
  - { from: V7.pin8, to: CF1.a, color: red, via: [[1.6, 1.2]] }     # B+ out → reservoir

  # === filter-can negatives → ground bus ======================================
  - { from: CF1.b, to: [1.45, 0] }
  - { from: CF2.b, to: [1.45, 2] }
  - { from: CF3.b, to: [1.45, 4] }
  - { from: CF4.b, to: [1.45, 6] }

  # === +400 screen rail: both 6V6 screens tie together (no screen stoppers in
  # this circuit) and one lead runs back to the +400 eyelet at the left end. ====
  - { from: V6.pin4, to: V5.pin4, color: red, via: [[15.4, 2.45], [10.9, 2.45]] }
  - { from: V5.pin4, to: CF2.a, color: red, via: [[10.2, 1.45], [9, 1.2], [9, -0.5], [1.2, -0.5]] }
  - { from: TR3.red, to: CF2.a, color: red, via: [[51.6, 2.86], [3, 2.86], [3, 1.0]] }  # reverb-trans primary → +400

  # === output transformer: centre tap on the reservoir, plates on the 6V6s =====
  - { from: TR2.red, to: CF1.a, color: red, via: [[11.4, 0.4], [9.4, 2.55], [-0.4, 2.55]] }
  - { from: TR2.blue, to: V5.pin3, via: [[12.8, 3.0], [10.5, 3.0]] }
  - { from: TR2.brown, to: V6.pin3, via: [[13.4, 3.08], [15, 3.08]] }
  - { from: TR2.green, to: SPK.tip, via: [[13.4, 1.05]] }
  - { from: SPK.sleeve, to: [1.45, 17.4] }

  # === +240 preamp / inverter rail: backbone along the board ===================
  - { from: CF4.a, to: RLR1.a, via: [[6.5, 1.2], [8, 2.38], [35.6, 2.38]] }
  - { from: RLR1.a, to: RLPI.a, via: [[37, -0.5], [18.6, -0.5]] }
  - { from: RLR1.a, to: RLD1.a, via: [[36.5, 0.5], [36.5, 2.28], [44.5, 2.28]] }
  - { from: RLD1.a, to: RLN2.a, via: [[45.5, 0.5], [45.5, 2.32], [59.5, 2.32]] }
  - { from: RLN2.a, to: RLN1.a, via: [[60.5, 0.5], [60.5, 2.36], [67.5, 2.36]] }

  # === output stage: grids, cathodes, and the −34 V bias line ==================
  - { from: C1.b, to: V5.pin5, via: [[11.9, 1.5]] }
  - { from: C2.b, to: V6.pin5, via: [[16.7, 1.55]] }
  - { from: V5.pin8, to: [1.45, 11.5], via: [[11.4, 1.7]] }
  - { from: V6.pin8, to: [1.45, 14.5], via: [[14.7, 1.5]] }
  - { from: RGL1.b, to: RGL2.b, via: [[13.4, 1.15], [16.6, 1.15]] }   # the two grid leaks meet on the bias line

  # === split-load phase inverter (V4, socket half nearest the board) ===========
  - { from: RLPI.b, to: V4.pin6, via: [[19.7, 1.5]] }
  - { from: V4.pin6, to: C1.a, via: [[21.4, 2.55], [12.4, 2.55]] }
  - { from: V4.pin7, to: RGPI.b, via: [[22.6, 1.85], [24.4, 1.3], [24.4, 0.5]] }
  - { from: V4.pin8, to: RKPI.a, via: [[22.2, 1.9], [22, 0.55]] }
  - { from: V4.pin8, to: C2.a, via: [[21.8, 2.65], [18.6, 2.65], [18.6, 1.3]] }
  - { from: RTAIL.b, to: [1.45, 23] }

  # === tremolo oscillator (V4, pins 1/2/3; not in the DC netlist) ==============
  - { from: VRINT.lug3, to: CINT.a }                                   # Intensity: .1 on one end…
  - { from: VRINT.lug2, to: RGL2.b, via: [[23.6, -0.72], [17.55, -0.72], [17.55, 0.55]] }   # …wiper onto the −34 V grid-leak junction
  - { from: CINT.b, to: CTO4.b }                                       # trem-out node (two eyelets)
  - { from: CTO4.a, to: [1.45, 25] }
  - { from: RTOP.a, to: CF2.a, color: red, via: [[27, -0.64], [1.6, -0.64]] }   # plate load off the +400 rail
  - { from: RTOP.b, to: CTO1.a }                                       # plate eyelet → the ladder's .02
  - { from: RTOP.b, to: V4.pin1, via: [[26.8, 1.18], [19.84, 1.18], [19.84, 2.3]] }
  - { from: CTO2.b, to: V4.pin2, via: [[29.6, 1.25], [19.98, 1.25], [19.98, 2.07]] }
  - { from: RKTO.a, to: V4.pin3, via: [[30.6, 0.5], [30.6, 1.32], [20.12, 1.32], [20.12, 1.93]] }
  - { from: RTO1.b, to: [1.45, 31] }
  - { from: CKTO.a, to: [1.45, 32.4], via: [[32.4, 0.6]] }
  - { from: VRSPD.lug3, to: CTO1.b }                                   # Speed control on the first node
  - { from: VRSPD.lug2, to: VRSPD.lug1, via: [[28.55, -0.76]] }        # rheostat strap
  - { from: VRSPD.lug1, to: RSPD.a, via: [[28.39, -0.7], [30.21, -0.7]] }
  - { from: RSPD.b, to: CKTO.a, via: [[31.6, -0.5]] }                  # 100 kΩ to ground

  # === reverb recovery (V3, left half): plate, grid, cathode ===================
  - { from: RLR1.b, to: CCR1.a }                                       # plate eyelet → the .003's foot
  - { from: CCR1.a, to: V3.pin1, via: [[38.5, 1.6], [39.7, 2.28]] }
  - { from: CCR1.b, to: VRREV.lug3, via: [[38.2, -0.62], [43.31, -0.62]] }   # .003 → Reverb control
  - { from: V3.pin2, to: RGR1.a, via: [[39.6, 1.4]] }
  - { from: V3.pin3, to: RKR1.a, via: [[39.6, 1.75], [35.6, 1.35]] }
  - { from: CKR1.a, to: [1.45, 33.6] }
  - { from: RKR1.b, to: [1.45, 35.4], via: [[35.3, 1.5]] }
  - { from: RGR1.b, to: [1.45, 39.3] }

  # === driver / mixer (V3, right half): plate, mixed grid, split cathode =======
  - { from: RLD1.b, to: V3.pin6, via: [[45.6, 1.5], [42.2, 1.72]] }
  - { from: CC2.b, to: V4.pin7, via: [[46.35, 1.3], [46.35, 2.72], [22.9, 2.72], [22.9, 2.1]] }   # .02 → inverter grid
  - { from: V3.pin7, to: CMIX.b, via: [[42.6, 1.35]] }
  - { from: CMIX.b, to: RMR.a }                                        # 10 pF across the 3.3 MΩ…
  - { from: RMIX.a, to: CMIX.a }                                       # …both leads on its eyelets
  - { from: V3.pin8, to: RKD1.a, via: [[42.6, 1.9], [48.4, 1.4]] }
  - { from: CKD1.a, to: RKD1.a }                       # the two cathode-node eyelets
  - { from: CKD1.b, to: RKD1.b }                       # the 47 Ω junction (KD1B)
  - { from: RKD2.b, to: [1.45, 50.4] }
  - { from: RNFB.a, to: SPK.tip, via: [[45.6, 3.2], [16.2, 3.2], [16.2, 2.02]] }   # speaker → feedback resistor
  - { from: RMR.b, to: VRREV.lug2, via: [[44, -0.6]] }
  - { from: VRREV.lug1, to: [1.45, 40.6], via: [[42.2, 0.2]] }

  # === reverb driver V2 (both sections paralleled) =============================
  # The two intra-socket ties run AROUND the socket's lower flank, on their own
  # concentric lanes. Routed as a single deep waypoint (as they were) each one
  # dropped straight down and came back on itself — a hairpin with no terminus,
  # which reads as a drafting artefact rather than a jumper between two lugs.
  - { from: V2.pin6, to: V2.pin1, via: [[54.122, 1.640], [53.417, 1.686], [52.933, 1.853], [52.858, 2.075]] }   # tie the two plates (PRD)
  - { from: V2.pin1, to: TR3.blue, via: [[52.8, 2.36], [52, 2.36]] }
  - { from: V2.pin7, to: V2.pin2, via: [[55.289, 2.161], [54.889, 2.478], [53.608, 2.573], [52.861, 2.276]] }   # tie the two grids (GRD)
  - { from: V2.pin7, to: RGRD.a, via: [[55.6, 2.0], [55.6, 2.55], [52.6, 2.55], [52.6, 0.5]] }
  - { from: RGRD.b, to: [1.45, 51.2] }
  - { from: V2.pin8, to: RKRD.a, via: [[56.4, 1.9]] }
  - { from: V2.pin3, to: RKRD.a, via: [[54.4, 1.1], [55.6, 0.3]] }
  - { from: CKRD.a, to: [1.45, 55.6] }
  - { from: RKRD.b, to: [1.45, 57.4], via: [[57.2, 1.5]] }
  # reverb tank interconnect (annotation layer)
  - { from: TR3.green, to: JTKI.tip }
  - { from: JTKI.sleeve, to: [1.45, 53.6], via: [[54.9, -0.55], [53.6, -0.3]] }
  - { from: JTKO.tip, to: RGR1.a, via: [[57.2, -0.2], [39.4, -0.2]] }
  - { from: JTKO.sleeve, to: [1.45, 58.4], via: [[58.4, -0.95]] }

  # === dry signal: V1B plate coupler feeds the reverb send AND the mixer =======
  - { from: CC1.b, to: CRS.a, via: [[57.6, -0.52], [50.4, -0.52]] }
  - { from: CRS.a, to: RMIX.a, via: [[49.6, -0.38], [42.4, -0.38]] }

  # === preamp second stage (V1 pins 6/7/8) =====================================
  - { from: RLN2.b, to: V1.pin6, via: [[59.4, 1.6], [66.7, 1.6]] }
