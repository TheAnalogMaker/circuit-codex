# Parts list — read from the published AA1164 Princeton Reverb-Amp drawing.
# Reference designators follow the DC netlist where a part is modeled and are
# descriptive otherwise; every one of them is cross-checked against the redrawn
# schematic (schematic.kicad_sch) by pipeline/validate.py, in both directions.
# Values are the drawing's; the notice sets ½ W / 10% resistors and 400 V
# capacitors unless noted. Transformer types are the drawing's own TR1/TR2/TR3
# labels.
notes: "The drawing shows one jack symbol for the instrument input pair; the chassis carries two. Tube reference designators run from the input end of the chassis (V1 nearest the jacks) — the drawing labels socket types, not V-numbers, and the section split shown here is read off the layout sheet's per-pin voltages. Tremolo-oscillator and reverb-tank interconnect parts are listed, but the oscillator's DC point is excluded from the netlist (see notes.md)."
