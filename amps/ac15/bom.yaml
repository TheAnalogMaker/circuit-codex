# Parts list for the AC15, JMI circuit No. 3 (drawing OA/031, 29-4-60).
# Designators are FUNCTIONAL — the corpus's own, not the factory drawing's. The
# published OA/031 scan does not resolve its reference designators reliably
# enough to reuse them, and asserting a wrong designator would be worse than
# using none; the one factory designator carried over is R22, the 130 Ω output
# cathode resistor, which the Vox history archive names independently in prose.
#
# A designator here means the redrawn schematic asserts that part's connections.
# Parts
# the published scan resolves as VALUES but not as wiring are listed with
# ref "—" (annotation only), the same convention the tweed and Marshall entries
# use for their presence, feedback and mains parts.
notes: "Where the factory drawing and the published redraw give different values for the same part, the FACTORY value is listed and the redraw's modern equivalent noted alongside. Coupling and cathode-bypass capacitor VALUES are open at DC and do not enter the operating-point netlist; they are listed for completeness. Parts belonging to the Vibrato/Tremolo channel are marked — that channel is outside the DC netlist's scope (see notes.md), so its values are read from the drawing but not simulated; the parts of it whose wiring the published scan does not resolve carry no designator and are drawn on the schematic as annotation, not as asserted connections. Asterisked values on the drawing mark the alternate parts for the AC15 Bass; the Normal-voicing values are the ones listed."
