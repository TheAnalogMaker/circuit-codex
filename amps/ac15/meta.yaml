sources:
  - desc: "JMI (Jennings Musical Industries), factory drawing OA/031. The title block reads \"JENNINGS MUSICAL INDUSTRIES LTD. / \"VOX AC.15\" AMPLIFIER CIRCUIT No. 3 / DRAWING FOR WORKS USE ONLY / Scale: N/A / DATE 29-4-60\", with a modifications box noting \"C42 ADDED 7-2-61\" and a deletion. This is the revision documented here: the third AC15 circuit, which made the phase-shifting vibrato part of the amplifier again. Supplies the tube complement (EF86 for the Normal channel, ECC83 phase inverter, ECC83 vibrato/tremolo first stage, ECC82 modulator, ECC83 vibrato oscillator, two EL84, EZ81 rectifier), the component values wherever the published scan resolves them, and the annotated working voltages. One of those, +325 V at the reservoir ahead of the choke, lies outside the part of the amplifier this page models. The mains and output transformers are Haddon parts and the choke is a Radiospares part. Asterisks on the drawing mark the alternative values for the AC15 Bass. Not reproduced here; archived at the Vox AC30 history site."
    url: "https://www.voxac30.org.uk/vox_ac15_third_circuit.html"
  - desc: "Hoffman Amplifiers, published redrawn 1960 AC15 schematic. The cross-reference for legibility. It is a modern redraw, not a factory document, but it resolves every value the OA/031 scan leaves ambiguous, and it agrees with the factory drawing wherever both can be read, including the shared 130 Ω output cathode resistor, the 100 Ω screens, the 47 kΩ phase-inverter tail and the annotated working voltages. Where the two differ, it is only in modern preferred values for the same part: 0.0047 µF against the drawing's 0.005 µF Top Cut capacitor, 47 µF against the drawing's 50 µF cathode capacitor, and 220 pF against the drawing's 250 pF Brilliance capacitor. This page records the factory value."
    url: "https://el34world.com/Hoffman/files/AC15_schematic.png"
  - desc: "Vox AC30 history archive, \"The Vox AC/15 - third circuit, mid 1960 on\". The dating and identity evidence for this revision: OA/031 was drawn on 29 April 1960 and signed off by Dick Denney, alongside the AC30/4 and AC30/6 drawings OA/032 and OA/026 of the same date; production ran from serial numbers around 4060 into the 5000s; the EL84 cathode resistor is named R22 on the drawing and given as 130 Ω, a value chosen in late 1957; the transformers came from Haddon and the choke from Radiospares; and the \"Normal\" and \"Bass\" voicings are marked on the drawing with asterisks."
    url: "https://www.voxac30.org.uk/vox_ac15_third_circuit.html"
  - desc: "Independent published circuit analysis of the vintage Vox AC15. A third reading of the same stage values (EF86 with a 220 kΩ anode load, 1 MΩ screen feed and 2.2 kΩ / 25 µF cathode; long-tailed-pair inverter with 100 kΩ anode loads, a 1.2 kΩ cathode and a 47 kΩ tail; EL84 pair on a shared 130 Ω cathode resistor with 100 Ω screen stoppers) and of the working voltages, agreeing with the factory drawing."
    url: "https://www.ampbooks.com/mobile/classic-circuits/vox-ac15/"
  - desc: "Vox AC30 history archive, \"The Vox AC30/6, black control panels\". The evidence for what happened to the EF86 when the design was scaled up. It documents two AC30/6 circuits. The early one, first drawn on 29 April 1960 (drawing OA/026, the same date as this amp's OA/031), has the EF86 on the Normal channel. In the later circuit, introduced in May 1961 after the list of changes, \"the EF86 is replaced by an ECC83 - one half each for the first stage of the Brilliant and Normal channels\", alongside changes that raised the gain and treble response."
    url: "https://www.voxac30.org.uk/vox_ac30_6_black_panels.html"
  - desc: "Philips/Mullard, EL84 data sheet, January 1969 (\"A.F. Output Pentode\"). The anchor for the site's open (CC0) EL84 tube model and its noval basing: Va = 250 V, Vg2 = 250 V and Vg1 = −7.3 V give Ia = 48 mA, Ig2 = 5.5 mA, S = 11.3 mA/V and µ(g1-g2) = 19."
    url: "https://frank.pocnet.net/sheets/010/e/EL84.pdf"
  - desc: "Philips/Mullard, EF86 data sheet, January 1970 (\"A.F. Pentode\"). The anchor for the site's open (CC0) EF86 tube model and its noval basing: Va = 250 V, Vg2 = 140 V and Vg1 = −2.2 V give Ia = 3.0 mA, Ig2 = 0.6 mA, S = 2.2 mA/V and µ(g1-g2) = 38. Its operating-characteristics table also publishes the exact 220 kΩ / 1 MΩ / 2.2 kΩ audio-amplifier network this amp's Normal channel uses."
    url: "https://frank.pocnet.net/sheets/010/e/EF86.pdf"
  - desc: "Philips, EZ81 data sheet, January 1970 (\"Double Anode Rectifying Tube\"). Supplies the basing and the anode characteristic (fig. 7Z00030-5.26.ha) behind the site's open (CC0) EZ81 tube model. The sheet tabulates no voltage drop per anode, only rows for the whole rectifier, so that model's anchor is read from the published curve and labelled as such."
    url: "https://frank.pocnet.net/sheets/010/e/EZ81.pdf"
verification:
  status: draft   # Two independent reasons, both stated rather than tuned away.
                  # (1) The drawing annotates five working voltages but prints no
                  # tabulated valve-voltage chart, so there is no per-pin reference
                  # and no stated measurement convention to verify against.
                  # (2) The EF86 anode simulates about a quarter low against the
                  # printed +90 V — a v0 single-anchor tube-fit limitation the
                  # 220 kohm anode load amplifies (see voltages.yaml). The phase
                  # inverter lands within 2%, but verified is earned whole.
# Day the circuit landed in the corpus (git history, amps/ac15/) — the feed's
# pubDate for a draft; production builds are shallow clones and cannot ask git.
added: 2026-08-02
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V5: "excluded — the Vibrato/Tremolo channel's two gain stages (both sections), left out with the whole channel: they share one derived supply node with the oscillator, which has no static operating point"
  V6: "excluded — the Vibrato/Tremolo modulator, left out with the whole channel (see V5)"
  V7: "excluded — the Vibrato/Tremolo phase-shift oscillator (one section) and the section that feeds Depth (the other): a running oscillator has no static operating point"
