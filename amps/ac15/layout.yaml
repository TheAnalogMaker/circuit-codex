# Board layout — DERIVED, not read from a factory layout drawing.
#
# JMI published no board-layout drawing for the AC15, and none is cited here.
# What follows is an original arrangement of this circuit's own parts, drawn in
# the house style on the corpus's two-row eyelet grid and ordered along the
# chassis in signal order — power and rectifier at the left, the EL84 output and
# output transformer next, the phase inverter and Top Cut in the middle, the
# Normal channel's EF86 at the right. It is a builder's diagram of THIS circuit,
# not a record of how Jennings Musical Industries dressed its own chassis (which
# used tag strips rather than a single eyelet board). The caption says so.
#
# Part refs are the shared key into bom.yaml; the renderer reads each value and
# part type from there, so the layout and the parts list cannot disagree.
#
# Machine-checked equivalence: the point-to-point wiring below has been verified
# electrically equivalent to netlist.cir by pipeline/verify_layout_nets.py — see
# the net_map block at the foot of this file and docs/layout-schema.md. Heaters,
# the pilot lamp, the PT/rectifier AC side and the three Vibrato/Tremolo valves
# are an excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 58
  title: "AC15 · board layout (derived)"
caption: "A derived layout: JMI published no board-layout drawing for the AC15, so the arrangement below is the Circuit Codex's own — this circuit's parts laid out in signal order along the chassis and drawn on the house eyelet grid, not a record of the factory's tag-strip construction. Every value comes from the parts list, which is read from JMI drawing OA/031. The Vibrato/Tremolo channel is not drawn: its tone, phase-shift, modulator and oscillator networks and their supply dropper mount on that channel's own tag strip at the Depth and Speed controls, so only its three valve sockets and their heaters appear here, with its volume control feeding the phase inverter's second grid. The Brilliance switch and its 250 pF cap, the standby switch and the mains selector are panel-mounted and are not drawn. The 6.3 V heater chain (green twisted pair — mains transformer, pilot lamp, EZ81, the two EL84s, the phase inverter, the three vibrato valves, the EF86) runs in the order a builder would wire it; the EZ81 is indirectly heated and sits on the same 6.3 V winding as the rest. Not a trace or a reproduction of any drawing."
source:
  desc: "JMI drawing OA/031, \"VOX AC.15 amplifier circuit No. 3\" (29-4-60) — layout DERIVED from that circuit drawing; JMI published no board-layout sheet for the AC15 and none was located"
  url: "https://www.voxac30.org.uk/vox_ac15_third_circuit.html"

parts:
  # --- power supply: reservoir, post-choke can, two of the three 22 kΩ droppers
  - { ref: CR1,  a: [0, 1],  b: [1, 1] }    # 16 µF reservoir (+325 V, ahead of the choke)
  - { ref: CR2,  a: [0, 2],  b: [1, 2] }    # 16 µF after the choke — the +315 V rail (BP1)
  - { ref: RD1,  a: [0, 4],  b: [0, 5] }    # 22 kΩ dropper, BP1 → Normal-channel rail
  - { ref: CF1,  a: [0, 5],  b: [1, 5] }    # 8 µF Normal-channel smoothing (shares the BPN eyelet)
  - { ref: RD2,  a: [0, 7],  b: [0, 8] }    # 22 kΩ dropper, BP1 → phase-inverter rail
  - { ref: CF2,  a: [0, 8],  b: [1, 8] }    # 8 µF phase-inverter smoothing (shares the BPPI eyelet)
  # --- output stage: screen stoppers, grid networks, the one shared cathode resistor
  - { ref: RSC1, a: [0, 11], b: [0, 12] }   # 100 Ω V3 screen stopper (BP1 → S3)
  - { ref: RSC2, a: [0, 14], b: [0, 15] }   # 100 Ω V4 screen stopper (BP1 → S4)
  - { ref: CC1,  a: [0, 16], b: [0, 18] }   # 0.01 µF inverter → V3 grid (PPIA → NG3)
  - { ref: RGL1, a: [0, 18], b: [1, 18] }   # 220 kΩ V3 grid leak (shares the NG3 eyelet)
  - { ref: RST1, a: [0, 18], b: [0, 19] }   # 1.5 kΩ V3 grid stopper (NG3 → G3)
  - { ref: CC2,  a: [0, 21], b: [0, 23] }   # 0.01 µF inverter → V4 grid (PPIB → NG4)
  - { ref: RGL2, a: [0, 23], b: [1, 23] }   # 220 kΩ V4 grid leak (shares the NG4 eyelet)
  - { ref: RST2, a: [0, 23], b: [0, 24] }   # 1.5 kΩ V4 grid stopper (NG4 → G4)
  - { ref: R22,  a: [0, 26], b: [1, 26] }   # 130 Ω · 5 W — the pair's ENTIRE bias arrangement
  - { ref: CKO,  a: [0, 27], b: [1, 27] }   # 50 µF cathode bypass across it
  # --- phase inverter: matched anode loads, both grid leaks to the tail junction
  - { ref: RLA,  a: [0, 30], b: [0, 31] }   # 100 kΩ anode load, Normal side
  - { ref: RLB,  a: [0, 32], b: [0, 33] }   # 100 kΩ anode load, Vibrato/Tremolo side
  - { ref: RGA,  a: [0, 35], b: [1, 35] }   # 1 MΩ grid leak → tail junction
  - { ref: RGB,  a: [0, 36], b: [1, 36] }   # 1 MΩ grid leak → tail junction
  - { ref: RTAIL, a: [0, 37], b: [1, 37] }  # 1.2 kΩ shared cathode resistor
  - { ref: RT2,  a: [0, 38], b: [1, 38] }   # 47 kΩ tail, junction → ground
  # --- the two channels' couplers into the inverter's two grids
  - { ref: CIN2, a: [0, 40], b: [0, 42] }   # 0.01 µF Vibrato/Tremolo volume → grid B
  - { ref: CIN1, a: [0, 43], b: [0, 45] }   # 0.01 µF Normal volume → grid A
  # --- Normal channel: the EF86 on Philips' own published application network
  - { ref: RL1,  a: [0, 47], b: [0, 48] }   # 220 kΩ anode load (BPN → PEF)
  - { ref: RS1,  a: [0, 49], b: [0, 50] }   # 1 MΩ screen feed (BPN → SEF)
  - { ref: CS1,  a: [0, 50], b: [1, 50] }   # 0.1 µF screen bypass (shares the SEF eyelet)
  - { ref: RK1,  a: [0, 53], b: [1, 53] }   # 2.2 kΩ cathode bias
  - { ref: CK1,  a: [0, 54], b: [1, 54] }   # 25 µF cathode bypass
  - { ref: CO1,  a: [0, 56], b: [0, 57] }   # 0.01 µF anode → Brilliance switch → volume

