  - { from: V1.pin3, to: RK1.a, via: [[50.30, 1.68], [50.30, 0.42], [52.60, 0.28]] }
  - { from: V1.pin8, to: RK1.a, via: [[53.60, 2.30], [53.60, 0.35], [53.35, 0.20]] }
  - { from: RK1.a, to: CK1.a }
  - { from: RK1.b, to: [1.45, 53] }
  - { from: CK1.b, to: [1.45, 54] }
  - { from: V1.pin2, to: [1.45, 49.7], via: [[50.10, 2.35]] }
  - { from: V1.pin7, to: [1.45, 52.4], via: [[52.70, 1.75]] }
  - { from: JN.tip, to: RGS1.a, via: [[56.86, -1.40], [54.21, -1.40]] }
