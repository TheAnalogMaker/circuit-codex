# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The whole Vibrato/Tremolo channel is outside netlist.cir's scope: its ECC83
  # first stage, ECC82 modulator and ECC83 phase-shift oscillator share one
  # derived supply node, and the oscillator has no static DC operating point, so
  # solving one of the three while the other two are omitted would report a rail
  # no instrument would ever read (see notes.md). Declared here socket by socket
  # so each is an annotation-layer exclusion printed loudly, like the rectifier —
  # an UNdeclared unmodelled signal tube still hard-fails.
  excluded_tubes:
    V5: "ECC83 Vibrato/Tremolo first + second stage — excluded from netlist.cir with the rest of that channel (shared derived supply node; see notes.md). Its 6.3 V heater is on the twisted chain; no signal pin is DC-checked."
    V6: "ECC82 vibrato modulator — excluded from netlist.cir: it works into the phase-shift ladder, which has no static DC operating point. Heater only."
    V7: "ECC83 phase-shift oscillator — a running oscillator has no quiescent operating point to verify (the same treatment amps/ab763 gives its tremolo oscillator). Heater only."
  anchors:
    # The netlist omits output-transformer primary DCR, so both EL84 anode nodes
    # and the primary centre tap collapse onto the +315 V rail.
    T2.blue:  BP1    # OT primary, V3 anode lead
    T2.brown: BP1    # OT primary, V4 anode lead
    T2.red:   BP1    # OT primary centre tap → the rail
    JSPK1: "0"       # speaker jack — OT-secondary DCR folded into ground
  series_bridge:
    RGS1: "33 kΩ input grid stopper at the jack — no DC grid current flows, so the netlist's grid node runs through it"
