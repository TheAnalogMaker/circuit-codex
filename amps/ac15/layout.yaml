# Ground bus — the bare rail just below the bottom eyelet row; the filter,
# cathode, grid-leak and pot grounds all tie to it.
bus:
  - { from: [1.45, -0.4], to: [1.45, 57.4] }

runs:
  # === PT secondary → EZ81 → reservoir → choke → the +315 V rail ==============
  # The four PT pigtails stack ~14 px apart, so each leaves on its own row and
  # drops in its own column before diving — no two read as one wire.
  - { from: T1.red1, to: V8.pin1, via: [[-1.70, 0.169], [-1.70, 2.52], [1.70, 2.52]] }
  - { from: T1.red2, to: V8.pin7, via: [[-1.40, 0.290], [-1.40, 3.05], [3.90, 3.05], [3.90, 2.25]] }
  - { from: T1.red-yellow, to: [1.45, 0.2], via: [[-1.10, 0.410], [-1.10, 1.20], [0.20, 1.20]] }
  - { from: V8.pin3, to: CR1.a, color: red, via: [[1.55, 1.62], [0.42, 1.62], [0.42, 0.34]] }
  - { from: CR1.b, to: [1.45, 1] }
  - { from: CR1.a, to: CH1.hi, via: [[1.30, -0.42], [5.90, -0.42]] }
  - { from: CH1.lo, to: CR2.a, color: red, via: [[6.90, -0.52], [2.30, -0.52]] }
  - { from: CR2.b, to: [1.45, 2] }
  - { from: CF1.b, to: [1.45, 5] }
  - { from: CF2.b, to: [1.45, 8] }

  # === +315 V rail (BP1): filter can, OT centre tap, both screen stoppers, and
  # the two droppers. The backbone rides the top lane at row -0.30; each tap
  # leaves its shared eyelet on its own bearing. ==============================
  - { from: T2.red, to: CR2.a, color: red, via: [[23.42, -0.62], [2.00, -0.62]] }
  - { from: CR2.a, to: RD1.a, color: red, via: [[2.36, -0.30], [3.70, -0.30]] }
  - { from: RD1.a, to: RD2.a, color: red, via: [[4.30, -0.30], [6.70, -0.30]] }
  - { from: RD2.a, to: RSC1.a, color: red, via: [[7.35, -0.30], [10.65, -0.30]] }
  - { from: RSC1.a, to: RSC2.a, color: red, via: [[11.35, 0.28], [13.65, 0.28]] }

  # === channel rails: BPN and BPPI run in the sub-board corridor, each in its
  # own lane, so they clear the output-transformer pigtails and the pot lugs ===
  - { from: RD1.b, to: RL1.a, via: [[5.40, 1.18], [46.60, 1.18]] }
  - { from: RL1.a, to: RS1.a, via: [[47.35, 0.28], [48.65, 0.28]] }
  - { from: RD2.b, to: RLA.a, via: [[8.40, 1.32], [29.60, 1.32]] }
  - { from: RLA.a, to: RLB.a, via: [[30.35, 0.28], [31.65, 0.28]] }

  # === output stage: screens, grids, plates, the shared cathode ===============
  - { from: RSC1.b, to: V3.pin9, via: [[12.60, 0.60], [12.60, 2.60], [12.15, 2.60]] }
  - { from: RSC2.b, to: V4.pin9, via: [[15.40, 0.60], [15.40, 2.62], [20.90, 2.52]] }
  - { from: RST1.b, to: V3.pin2, via: [[18.40, 0.60], [18.40, 2.26], [10.60, 2.26]] }
  - { from: RST2.b, to: V4.pin2, via: [[23.40, 0.55], [23.40, 2.95], [19.00, 2.44]] }
  - { from: RGL1.b, to: [1.45, 18] }
  - { from: RGL2.b, to: [1.45, 23] }
  - { from: V3.pin7, to: T2.blue, via: [[13.10, 1.60], [13.10, -0.44], [23.60, -0.44]] }
  - { from: V4.pin7, to: T2.brown, via: [[21.60, 1.55], [21.60, -0.90], [23.80, -0.90]] }
  - { from: V3.pin3, to: R22.a, via: [[10.30, 1.62], [25.05, 1.62], [25.05, 0.40]] }
  - { from: V4.pin3, to: R22.a, via: [[18.85, 1.70], [18.85, 3.15], [25.40, 3.15], [25.40, 0.45]] }
  - { from: R22.a, to: CKO.a }
  - { from: R22.b, to: [1.45, 26] }
  - { from: CKO.b, to: [1.45, 27] }
  - { from: T2.green, to: JSPK1.tip, via: [[24.19, -0.52], [26.20, -0.52], [26.20, 1.90], [24.30, 1.90]] }
