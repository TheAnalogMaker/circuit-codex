# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6g3"
name_style: "Brown Deluxe-style"
family: other
era:
  start: 1961
  end: 1963
wattage: 15
tubes: [12AX7, 12AX7, 12AX7, 6V6GT, 6V6GT, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: single-knob
lineage:
  derived_from: ["5e3"]    # the tweed Deluxe this circuit replaces
  influenced: ["ab763"]    # the blackface Deluxe Reverb inherits its fixed bias + LTP inverter
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Deluxe\" Model 6G3 schematic and layout (drawing code I-FA). Supplies every component value, the printed voltage chart and the transformer part numbers (TR1-125P2A, 333-0-333 V AC; TR2-125A1A). The sheet's notice: values ±20%, voltages read to ground with an electronic voltmeter, all resistors ½ W 10% and all capacitors at least 400 V unless marked. The drawing labels the first tube 7025 (an equivalent of the 12AX7). Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_6g3.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Brownface Deluxe\". Supplies the 6G3 production window (1961–1963) and the 15 W nominal rating used here."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-deluxe"
verification:
  status: verified
  date: 2026-08-02
  max_deviation_pct: 5.6   # worst gated node (KPI, the joined inverter cathodes, tol 20%); the tremolo oscillator's own two nodes are documented exclusions (see notes.md), reported not gated
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V2B: "excluded — the tremolo's phase-shift oscillator: a running oscillator has no static operating point; its 220k plate load taps the driven node BP, so nothing downstream moves"
