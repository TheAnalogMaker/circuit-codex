sources:
  - desc: "Fender 'Deluxe' Model 6G3 drawing (I-FA), schematic + layout: every component value AND the printed voltage chart read directly from the published sheet (+375 reservoir / OT centre tap, +365 6V6 plates and screens, +325 phase-inverter rail, +270 preamp rail, +165 channel-input and driver plates, +1.5/+1.4 preamp cathodes, +230/+225 inverter plates with +20 cathodes and +18 tail junction, -26 V fixed bias, +205/+2.0 tremolo oscillator); droppers 1 kOhm-2W / 10k-1W / 27k-1W on 16-16-16-8 uF 450 V cans; input stages 220k plates on a shared 1.5k/25 uF cathode with a .003 shunt across the Normal channel's plate load; driver 100k plate load returning through a 15k with the .01 coupler taken from their junction; LTP inverter 82k/100k 5% plates, 820 Ohm cathode resistor to a 6.8k tail and a 1500 Ohm foot carrying the 56k speaker feedback, 1M grid leaks to the tail junction, .0001 across the plates; 6V6GT pair with grounded cathodes and 220k-5% grid leaks; bias supply 100k-5% + rectifier + 25 uF/50 V + 22k-5%; tremolo is bias-vary, its oscillator injected through a 250k-L Intensity control in the bias line. Notice: values +/-20%, read to ground with an electronic voltmeter, all resistors 1/2 W 10% and all capacitors at least 400 V unless marked. Transformers TR1-125P2A (333-0-333 V AC) and TR2-125A1A. The drawing labels the first bottle 7025 (a 12AX7 alias). Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_6g3.pdf"
  - desc: "Mojotone/Ampwares Fender field guide, 'Brownface Deluxe' — 6G3 production window 1961-1963 and the 15 W nominal rating used here"
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-deluxe"
