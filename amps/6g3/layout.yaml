  - { from: C13.b, to: V5.pin5, via: [[10.6, 1.42], [10.4, 1.66]] }
  - { from: V4.pin8, to: [1.45, 7.0], via: [[7.1, 2.26]] }
  - { from: V5.pin8, to: [1.45, 11.6], via: [[11.4, 2.26]] }

  # === phase inverter: plates, grids, cathodes, tail ======================
  - { from: RLA.b, to: V3.pin1, via: [[5.4, 1.52], [17.5, 1.52], [17.5, 2.62], [19.2, 2.62]] }
