  # === 6.3 V heater chain (green twisted pair) ============================
  # PT green pair → pilot lamp → V4 → V5 → V3 → V2 → V1. The sheet annotates
  # this chain ("to all 6.3 volt heaters") rather than routing it, so the daisy
  # order is the conventional one. The GZ34 takes the 5 V winding and is off
  # this chain. Twisted runs land only on heater pins (octal 2/7, noval 4/5).
  - { from: T1.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V4.pin7, style: twisted, via: [[-1.2, 3.56], [5.4, 3.56]] }
