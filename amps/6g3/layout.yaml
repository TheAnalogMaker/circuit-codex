  - { from: RK3.b, to: [1.45, 44] }
  - { from: C11.b, to: [1.45, 46] }

  # === driver =============================================================
  - { from: RL3.b, to: V2.pin6, via: [[48.6, 1.56], [43.0, 1.56]] }
  - { from: RL3.a, to: RD4.b, via: [[49.5, -0.18], [50.6, -0.18]] }
  - { from: RL3.a, to: C9.a, color: yellow, via: [[48.4, -0.36], [26.4, -0.36]] }
