# Board layout — redrawn from the published Fender 6G3 'Deluxe' layout drawing
# (I-FA), page 1. Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them — never a
# trace or a dimensioned reproduction.
#
# The board reads left→right exactly as the sheet does: the output couplers,
# 6V6 grid leaks and phase-inverter plate loads at the left end, the inverter
# tail next, then the tremolo oscillator, the driver, and the two channel input
# stages at the right — matching the tube row below it
# (GZ34 · 6V6GT · 6V6GT · 12AX7 inverter · 12AX7 driver + tremolo · 7025).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo
# oscillator's own network and the PT / rectifier AC side are an excluded
# annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 76
  title: "6G3 · eyelet board layout"
caption: "Redrawn from the published Fender 6G3 'Deluxe' layout drawing (I-FA), page 1 — principal board components and their hookup, in the order the drawing shows them. Off the board: the tone capacitors, the Speed control's 100 kΩ end resistor and the Intensity control's 0.05 µF mount at their pots, and the bias-supply group is the small sub-board the sheet draws in its own box. The 68 kΩ grid stoppers and the two 1 MΩ input grid leaks mount at the jacks (the chassis carries two jacks per channel; one is drawn per channel). The three dropping resistors sit with the 16-16-16-8 µF filter can in the filter housing rather than on the eyelet board — they are drawn here as off-board stubs so every supply rail stays traceable, and the can itself is not drawn. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6 output tubes → the three small bottles) is drawn in the conventional daisy order: the sheet annotates it \"to all 6.3 volt heaters\" rather than routing it. The GZ34 is off that chain — it takes the 5 V winding. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Deluxe' Model 6G3 drawing (I-FA), page 1 of 2 (layout; page 2 is the schematic redrawn in this amp's schematic.kicad_sch)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_6g3.pdf"

parts:
  # --- output couplers, 6V6 grid leaks, phase-inverter plate loads ---------
  - { ref: RG4, a: [0, 2], b: [1, 2] }      # 220k-5% V4 grid leak (-26 V → G61)
  - { ref: C12, a: [1, 2], b: [1, 5] }      # 0.1 µF PI hot plate → V4 grid
  - { ref: RLA, a: [0, 5], b: [1, 5] }      # 82k-5% hot plate load (B+3 → PPIA)
  - { ref: C15, a: [1, 5], b: [1, 8] }      # 100 pF across the inverter plates
  - { ref: RLB, a: [0, 8], b: [1, 8] }      # 100k-5% cold plate load (B+3 → PPIB)
  - { ref: C13, a: [1, 8], b: [1, 11] }     # 0.1 µF PI cold plate → V5 grid
  - { ref: RG5, a: [0, 11], b: [1, 11] }    # 220k-5% V5 grid leak (-26 V → G62)
  # --- phase-inverter tail --------------------------------------------------
  - { ref: RNFB, a: [0, 14], b: [1, 14] }   # 56k negative feedback from the speaker
  - { ref: RNF1, a: [0, 16], b: [1, 16] }   # 1.5k feedback-node foot to ground
  - { ref: C14, a: [0, 18], b: [1, 18] }    # 0.1 µF / 200 V feedback → cold grid
  - { ref: RT2, a: [0, 18], b: [0, 20] }    # 6.8k tail (feedback node → junction)
  - { ref: RGA, a: [0, 20], b: [1, 20] }    # 1M hot grid leak (JPI → GPIA)
  - { ref: RTAIL, a: [0, 22], b: [1, 22] }  # 820 Ω inverter cathode resistor
  - { ref: RGB, a: [0, 24], b: [1, 24] }    # 1M cold grid leak (JPI → GPIB)
  - { ref: C9, a: [0, 26], b: [1, 26] }     # 0.01 µF driver → inverter hot grid
  # --- tremolo oscillator (the V2 bottle's second half) --------------------
  - { ref: RL4, a: [0, 29], b: [0, 32] }    # 220k oscillator plate load (B+1)
  - { ref: C16, a: [0, 32], b: [1, 32] }    # 0.02 µF phase-shift, plate side
  - { ref: C17, a: [1, 32], b: [1, 35] }    # 0.01 µF phase-shift, middle
  - { ref: R8, a: [0, 35], b: [1, 35] }     # 1M phase-shift return to the cathode
  - { ref: C18, a: [1, 35], b: [1, 38] }    # 0.01 µF phase-shift, grid side
  - { ref: R10, a: [0, 37], b: [0, 40] }    # 220k oscillator output feed
  - { ref: R7, a: [1, 39], b: [1, 42] }     # 1M oscillator grid leak to ground
  - { ref: C19, a: [0, 40], b: [0, 43] }    # 0.1 µF output coupler → Intensity
  - { ref: RK3, a: [0, 44], b: [1, 44] }    # 2.7k oscillator cathode
  - { ref: C11, a: [0, 46], b: [1, 46] }    # 25 µF oscillator cathode bypass
  # --- driver (the V2 bottle's first half) ---------------------------------
  - { ref: RL3, a: [0, 49], b: [1, 49] }    # 100k plate load (J2 → P2A)
  - { ref: RD4, a: [0, 51], b: [1, 51] }    # 15k decoupler (B+4 → J2)
  - { ref: R5, a: [0, 53], b: [1, 53] }     # 220k Normal mixing resistor
  - { ref: R6, a: [0, 55], b: [1, 55] }     # 220k Bright mixing resistor
  - { ref: RK2, a: [0, 57], b: [1, 57] }    # 1.5k driver cathode
  - { ref: C4, a: [0, 59], b: [1, 59] }     # 25 µF driver cathode bypass
  # --- channel input stages (V1 = 7025) ------------------------------------
  - { ref: C2, a: [0, 62], b: [1, 62] }     # 0.02 µF Bright coupler → volume
  - { ref: RL2, a: [0, 64], b: [1, 64] }    # 220k Bright plate load (B+4 → PB1)
  - { ref: RL1, a: [0, 66], b: [1, 66] }    # 220k Normal plate load (B+4 → PN1)
  - { ref: C3, a: [0, 68], b: [1, 68] }     # 0.003 µF treble shunt across RL1
  - { ref: C1, a: [0, 70], b: [1, 70] }     # 0.02 µF Normal coupler → volume
  - { ref: RK1, a: [0, 72], b: [1, 72] }    # 1.5k shared 7025 cathode
  - { ref: C10, a: [0, 74], b: [1, 74] }    # 25 µF shared cathode bypass

