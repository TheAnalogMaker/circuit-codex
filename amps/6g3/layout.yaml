  - { from: V3.pin5, to: V2.pin4, style: twisted, via: [[20.6, 3.60], [41.4, 3.60]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[42.6, 3.60], [67.4, 3.60]] }
  - { from: V1.pin4, to: V1.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The push-pull output transformer: the netlist omits winding DCR, so both
  # 6V6 plate leads and the centre tap collapse onto the reservoir node BP (the
  # chart prints +365 V at the plates against +375 V at the centre tap). The
  # speaker terminal is the negative-feedback return: the OT secondary is a
  # short at DC, so the 56 kΩ feedback resistor's far end reads as ground.
  #
  # No excluded_tubes entry belongs here. The tremolo oscillator is the SECOND
  # half of V2, whose first half is the modelled driver stage, so that socket is
  # anchored by the driver and only the oscillator half's own network is
  # unmodelled — it is enumerated in the unchecked-terminal report rather than
  # hidden behind a socket-level exclusion.
  anchors:
    T2.red: BP        # OT primary centre tap → reservoir node
    T2.blue: BP       # OT primary, V4 plate lead
    T2.brown: BP      # OT primary, V5 plate lead
    SPK.tip: "0"      # OT-secondary DCR folded into ground (the NFB return)
  netlist_unplaced:
    RG1: "1 MΩ Normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2: "1 MΩ Bright-channel input grid leak — mounted at the input jacks"
    RG3: "the driver's DC grid return, modelled as one grid leak (G2A → 0); realised through the two 220 kΩ mixing resistors and the channel volume pots"
