  - { from: R5.b, to: V2.pin7, via: [[52.4, 1.88], [43.6, 1.88]] }
  - { from: RK2.a, to: C4.a, via: [[57.4, -0.14], [58.6, -0.14]] }
  - { from: RK2.a, to: V2.pin8, via: [[56.4, 2.44], [43.4, 2.44]] }
