# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 75.5] }

# Wiring — read lead-by-lead from the published 6G3 layout drawing. Transformer
# leads carry the drawing's colours, as do the Intensity control's two board
# leads (yellow to the bias line, brown from the oscillator). Endpoints
# reference board eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated
# against the basing data — heater pins on the twisted runs), pot lugs, jacks,
# off-board 2-lead parts and transformer leads.
runs:
  # === power transformer → GZ34 → the rail chain (annotation layer) ========
  - { from: T1.red1, to: V6.pin4, via: [[0.9, 0.35], [1.5, 1.30]] }
  - { from: T1.red2, to: V6.pin6, via: [[1.2, 0.58], [2.2, 1.36]] }
  - { from: T1.red-yellow, to: [1.45, 0.4], via: [[0.15, 0.92]] }
  - { from: V6.pin8, to: RD1.a, color: red, via: [[1.0, 2.45], [1.0, -0.55]] }

  # === B+1 (+375 V): reservoir node — OT centre tap and oscillator plate ===
  - { from: RD1.a, to: T2.red, color: red, via: [[2.9, -0.52], [11.9, -0.52], [11.9, 1.30]] }
  - { from: RD1.a, to: RL4.a, color: red, via: [[2.4, -0.76], [28.4, -0.76]] }

  # === B+2 (+365 V): the two 6V6 screens, on one backbone lead ============
  - { from: RD1.b, to: RD2.a, color: red, via: [[3.6, -0.80], [6.0, -0.80]] }
  - { from: RD1.b, to: V4.pin4, color: red, via: [[3.4, -0.32], [1.7, -0.32], [0.75, 0.62], [0.75, 1.66], [5.2, 1.66]] }
  - { from: V4.pin4, to: V5.pin4, color: red, via: [[6.2, 1.62], [9.3, 1.62]] }
  - { from: T2.blue, to: V4.pin3, via: [[13.1, 2.74], [4.6, 2.74], [4.6, 1.90]] }
  - { from: T2.brown, to: V5.pin3, via: [[13.7, 2.96], [8.6, 2.96], [8.6, 1.90]] }
  - { from: T2.green, to: SPK.tip, via: [[14.4, 1.92]] }
  - { from: SPK.sleeve, to: [1.45, 16.9], via: [[16.9, 2.24]] }

  # === B+3 (+325 V): the two inverter plate loads ==========================
  - { from: RD2.b, to: RD3.a, color: red, via: [[7.1, -0.80], [9.5, -0.80]] }
  - { from: RD2.b, to: RLA.a, color: red, via: [[7.2, -0.34], [5.3, -0.34]] }
  - { from: RLA.a, to: RLB.a, color: red, via: [[5.4, -0.12], [7.6, -0.12]] }

  # === B+4 (+270 V): the driver decoupler and both channel plate loads =====
  - { from: RD3.b, to: RD4.a, color: red, via: [[10.9, -0.60], [50.4, -0.60]] }
  - { from: RD4.a, to: RL2.a, color: red, via: [[51.6, -0.42], [63.4, -0.42]] }
  - { from: RL2.a, to: RL1.a, color: red }
  - { from: RL1.a, to: C3.a, color: red }

  # === bias supply: an HT leg → 100k → rectifier → 25 µF / 22k → -26 V ====
  - { from: V6.pin6, to: R11.a, color: red, via: [[3.4, 2.56], [12.5, 2.56], [12.5, -0.56], [14.0, -0.56]] }
  - { from: R11.b, to: D1.a, via: [[15.6, -0.80], [17.4, -0.80]] }
  - { from: D1.b, to: C25.a, via: [[18.6, -0.80], [20.4, -0.80]] }
  - { from: C25.a, to: R12.a, via: [[21.2, -0.86], [23.2, -0.86]] }
  - { from: C25.b, to: [1.45, 27.6], via: [[21.7, -0.54], [27.6, -0.54]] }
  - { from: R12.b, to: [1.45, 28.2], via: [[24.6, -0.68], [28.2, -0.68]] }
  - { from: C25.a, to: VR6.lug1, color: brown, via: [[21.4, -0.50], [28.6, -0.50], [28.6, -0.88]] }

  # === the Intensity control sits in the bias line =========================
  - { from: C19.b, to: VR6.lug3, color: brown, via: [[43.4, -0.30], [30.8, -0.30]] }
  - { from: VR6.lug2, to: C20.a, via: [[30.45, -0.78], [29.0, -0.86], [27.0, -0.86]] }
  - { from: C20.b, to: [1.45, 27.0], via: [[27.3, -0.44], [27.0, 0.45]] }
