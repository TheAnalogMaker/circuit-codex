  - { from: RNF1.b, to: [1.45, 16] }
  - { from: RT2.b, to: RGA.a }
  - { from: RGA.a, to: RTAIL.a, via: [[20.4, -0.18], [21.6, -0.18]] }
  - { from: RTAIL.a, to: RGB.a, via: [[22.4, -0.18], [23.6, -0.18]] }
  - { from: RGA.b, to: V3.pin2, via: [[19.9, 1.60], [18.2, 2.10]] }
  - { from: RGB.b, to: V3.pin7, via: [[23.4, 1.36], [21.2, 1.36]] }
  - { from: RTAIL.b, to: V3.pin8, via: [[22.2, 1.74], [21.8, 2.34]] }
  - { from: RTAIL.b, to: V3.pin3, via: [[21.4, 1.50], [18.4, 1.50], [18.4, 1.92]] }
  - { from: C14.b, to: RGB.b, via: [[18.4, 2.92], [23.4, 2.92]] }
  - { from: RGA.b, to: C9.b, via: [[21.4, 1.70], [21.4, 3.14], [25.6, 3.14]] }

