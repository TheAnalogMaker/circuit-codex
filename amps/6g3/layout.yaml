  - { from: C16.a, to: R10.a, via: [[32.6, -0.12], [36.4, -0.12]] }
  - { from: C16.b, to: VR5.lug2, color: blue, via: [[31.6, 1.30], [43.4, 1.30], [43.4, -0.24], [41.4, -0.24]] }
