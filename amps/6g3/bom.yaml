  - { ref: R2n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Normal input grid stopper (jack 2)" }
  - { ref: RG1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",    role: "Normal input grid leak" }
