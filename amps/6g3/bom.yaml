# Parts list — read from the published 6G3 Deluxe drawing (schematic + layout).
# This amp ships as a draft data core (no schematic.kicad_sch yet), so reference
# designators follow the DC netlist where a part is modeled and are descriptive
# otherwise; they will be reconciled to a schematic when one is drawn. The
# drawing's notice sets ½ W · 10 % resistors and 400 V capacitors unless a part
# is marked otherwise, and every value below is the drawing's.
notes: "The drawing shows both input jacks per channel, each with its own 68 kΩ stopper. The tremolo oscillator's parts are listed in full, but its DC operating point is excluded from the netlist (see notes.md). Parts drawn only as annotations — power transformer, mains cap, fuse, switches, pilot lamp — are listed without designators."
items:
