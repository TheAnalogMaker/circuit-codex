# amps/6g3/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T2.1: BP                 # OT primary, V4 plate end — primary DCR omitted
  T2.2: BP                 # OT primary centre tap
  T2.3: BP                 # OT primary, V5 plate end
  T2.4: "0"                # OT secondary hot — secondary DCR folded into ground
                           # (RNFB's return); mirrors layout net_map SPK.tip: '0'.

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-02 after the drawing went clean against netlist.cir.
schematic_claim: verified

series_bridge:
  # The 1 M input leak hangs from jack 1's tip, jack side of the jack-1 68 k,
  # as I-FA draws it on both channels (schematic page crops 0,900,1060,1990
  # and 0,1950,1060,3040; the layout page mounts it on jack 1); the 68 k
  # carries no DC grid current, so the netlist's RG1 GN1 0 / RG2 GB1 0 run
  # the grid node through it.
  R1n: "68 k Normal jack-1 grid stopper — netlist node GN1 runs through it to the 1 M leak at the jack-1 tip"
  R3n: "68 k Bright jack-1 grid stopper — netlist node GB1 runs through it to the 1 M leak at the jack-1 tip"
