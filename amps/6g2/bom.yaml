  - { ref: RD2, part: "Power resistor",       value: "10 kΩ · 1 W",   role: "Rail dropper +312 V → +280 V (preamp/PI)" }
  - { ref: C11, part: "Electrolytic capacitor", value: "30-450 µF · 450 V", role: "Reservoir filter, +315 V" }
  - { ref: C12, part: "Electrolytic capacitor", value: "30-450 µF · 450 V", role: "Filter, +312 V screen node" }
  - { ref: C13, part: "Electrolytic capacitor", value: "30-450 µF · 450 V", role: "Filter, +280 V preamp/PI node" }
  # --- Bias supply ---
