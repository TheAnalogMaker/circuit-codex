# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6g2"
name_style: "Brown Princeton-style"
family: other
era:
  start: 1961
  end: 1963
wattage: 12
tubes: [7025, 12AX7, 6V6GT, 6V6GT, 5Y3GT]
topology:
  rectifier: { kind: tube, type: "5Y3GT" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: single-knob
lineage:
  derived_from: []   # NOT the 5F2-A: the 5F2-A's own notes.md calls the 6G2 a break
                     # in the line — single-ended cathode bias gives way to a fixed-
                     # bias push-pull pair, a different power stage, not a revision
                     # of the earlier one. No documented single-ended ancestor lands
                     # in this corpus.
  influenced: ["aa964"]   # the blackface Princeton keeps the fixed-bias 6V6 pair,
                          # the cathodyne (56 k plate, small cathode R into a tail,
                          # 1 M leak returned to the tail), and the bias-vary
                          # tremolo almost unchanged
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Princeton\" Model 6G2 schematic and layout (drawing code H-FA). Supplies every component value, the printed voltage chart and the transformer part numbers (TR1 125P1A, TR2 125A10B). The sheet's notice: values ±20%, voltages read to ground with an electronic voltmeter, resistors ½ W 10% and capacitors at least 400 V unless marked. Two readings need care. The +135 V printed at both 7025 plates, on both pages, is disputed: +1.5 V across each 1500 Ω cathode resistor puts the plates nearer +180 V. The cathodyne's cathode resistor is read as printed, 1000 Ω. The high-resolution layout page settles it (its digits match that page's 1000 Ω dropper, not V1A's 1500 Ω); the schematic page is too coarse to decide. With 1000 Ω, the chart's +56.5 V and +55 V cathodyne nodes simulate 11–12% high, inside the sheet's ±20%. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_6g2_schem.pdf"
  - desc: "Fender, \"Princeton\" Model 6G2 layout drawing (drawing code H-FA). Supplies the order of parts on the board, the socket pin numbering for the 5Y3GT, 6V6GT, 12AX7 and 7025 sockets, and the transformer wire colours, read lead by lead from the Internet Archive's high-resolution (800 ppi) capture of this PDF. The power transformer's six leads read, left to right, YELLOW / RED / RED / YELLOW / BLACK / BLACK. The two reds go to the 5Y3GT plates at pins 4 and 6, the two yellows are the rectifier's own 5 V filament winding at pins 2 and 8, and the two blacks run to the fuse and the AC switch as the mains primary. A GREEN and the RED-YELLOW HT centre tap leave the other face tied together to ground, and the second GREEN feeds the pilot light and the arrow \"TO ALL 6.3 VOLT HTRS.\" A lower-resolution copy of this sheet is easy to misread here: an earlier reading of one took the black pair for the rectifier filament. The output transformer runs blue and brown to the 6V6 plates, red to the centre tap and green to the speaker jacks. The sheet confirms the two 6V6GT sockets and the +315 V pin figure against the schematic. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_6g2.pdf"
  - desc: "Fender, \"Princeton-Amp AA964\" schematic (drawing 045419). A cross-reference for the 6G2's cathodyne: the AA964's published values (56 kΩ plate load, 1 kΩ cathode resistor into a 56 kΩ tail, 1 MΩ grid leak returned to that junction) closely match its circuit. Used only to support the 56 kΩ tail-to-ground resistor, read on a faint part of the 6G2 scan, and never to supply a value the 6G2 drawing does not carry."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_AA964_schem.pdf"
  - desc: "Fender, \"Harvard\" Model 5F10 drawing (drawing code F-EF). A second cross-reference for the same cathodyne recipe (56 kΩ plate, a small cathode resistor into a tail, 56 kΩ tail to ground, 1 MΩ leak returned to the tail): a fixed-bias 6V6 Fender design of the same period with the identical phase-inverter circuit."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_harvard_5f10_schem.pdf"
  - desc: "Mojotone, Fender Field Guide, \"Fender Brownface Princeton\". Supplies the production window (1961–1963), the 12 W rating, the push-pull pair of 6V6GT with a phase inverter, the fixed bias and the 5Y3GT rectifier."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-princeton"
verification:
  status: verified
  # Basis: the printed per-pin voltage chart on the published 6G2 (H-FA)
  # drawing, ±20% as the sheet itself states (see voltages.yaml `source`).
  # Nine of the eleven charted nodes are gated. The two 7025 plates print
  # +135 V, which the chart's own +1.5 V cathode figures contradict, and are
  # carried as disputed (voltages.yaml). The two lower rails are predictions
  # of the drawing's own dropper chain rather than inputs to it.
  date: 2026-08-08
  max_deviation_pct: 12.1   # worst gated node (JPI, the cathodyne's 1k/56k tail junction, 12.1%; its cathode KPI 11.0%, tol 20%) since RKA is read as the printed 1000 (V1 audit 2026-10-03); both rails inside 0.5%, the cathodyne plate 4.5%, V1B's cathode 3.9% (the 56k feedback leg is a second path to ground beside its 1.5k) and every other node inside 3%. The tremolo oscillator sharing V2 is a documented exclusion (see notes.md), reported not gated
# Day the circuit landed in the corpus (git history, amps/6g2/).
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V2B: "excluded — the tremolo's phase-shift oscillator: a running oscillator has no static operating point; its 56k plate load taps the driven node BP, so nothing downstream moves"
