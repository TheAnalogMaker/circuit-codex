  - { id: C10, ref: C10, kind: part, edge: top, at: 37, label: "C10" }
  - { id: VR4, ref: VR4, kind: pot, edge: top, at: 40, label: "Intensity" }
  - { id: VR3, ref: VR3, kind: pot, edge: top, at: 44, label: "Speed" }
  - { id: C3, ref: C3, kind: part, edge: top, at: 56, label: "C3" }
  - { id: VR1, ref: VR1, kind: pot, edge: top, at: 58.5, label: "Tone" }
  - { id: VR2, ref: VR2, kind: pot, edge: top, at: 61, label: "Volume" }
  - { id: JB, kind: jack, edge: top, at: 70, label: "Instruments 2" }
  - { id: JA, kind: jack, edge: top, at: 73, label: "Instruments 1" }

# Ground bus — the bare rail just below the bottom eyelet row; cathode,
# filter, grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 74.5] }

# Wiring — read lead-by-lead from the published 6G2 layout drawing where the
# scan resolves it (the rail-dropper chain, the bias supply, the OT lead
# colours) and reconstructed from the circuit's own topology elsewhere (the
# signal path, which the schematic already documents net-for-net). Endpoints
# reference board eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated
# against the basing data — heater pins on the twisted runs), pot lugs,
# jacks, off-board 2-lead parts and transformer leads.
#
# Bottle-to-socket half assignment (V1, V2 each host two netlist instances):
# V1A = unit 1 (pin6 plate / pin7 grid / pin8 cathode), V1B = unit 2 (pin1
# plate / pin2 grid / pin3 cathode). V2A (cathodyne) = unit 1 (pin6/7/8),
# V2B (oscillator, excluded from netlist.cir) = unit 2 (pin1/2/3).
runs:
  # === power transformer -> 5Y3GT -> reservoir (annotation layer) =========
  - { from: T1.red1, to: V5.pin4, via: [[0.8, 0.35], [1.6, 1.30]] }
  - { from: T1.red2, to: V5.pin6, via: [[1.1, 0.58], [2.3, 1.36]] }
  - { from: T1.yellow_ct, to: [1.45, 0.4], via: [[0.15, 0.92]] }
  - { from: T1.black1, to: V5.pin2, via: [[0.3, 0.62], [0.9, 2.10]] }
  - { from: T1.black2, to: V5.pin8, via: [[0.9, 0.95], [2.9, 2.50]] }
  - { from: V5.pin2, to: V5.pin8, via: [[1.4, 2.95], [2.6, 2.95]] }
  - { from: V5.pin8, to: RD1.a, color: red, via: [[3.3, 2.20], [3.3, -0.15]] }

  # === BP/BS/BD rail chain + bias supply — shelf plan =======================
  # Off-board `kind: part`/`kind: pot` terminals on the top edge all sit at a
  # near-fixed height (~y=-0.95 to -0.97 in these row units — see off_pos /
  # part_terminal_pos / pot_lug_pos in render_layouts.py), one row above the
  # board proper; their labels and bodies sit further out still (~y<-1.0).
  # Adjacent-part local hops stay AT that natural terminal height (no detour
  # to fight); every long-haul run that must cross OTHER parts' columns
  # instead uses the otherwise-empty band between the board edge and that
  # terminal row (y -0.15..-0.90), on its own shelf so none of the seven
  # long-haul rails ever runs parallel to another over a shared column range:
  #   -0.15  RD1.a -> T2.red (BP short-haul, x3-13.9)
  #   -0.30  V5.pin8 -> R5.a (bias feed, x1.2-15, wraps the left edge)
  #   -0.45  RD1.a -> RL4.a (BP long-haul, x3.5-33.1)
  #   -0.60  RG4.a -> RG3.a, yellow (x2.5-22)
  #   -0.75  RD2.b -> RL2.a (BD long-haul, x9.5-48.4)
  #   -0.90  R6.a -> VR4.lug1, brown (x22.5-40.6)
  - { from: RD1.a, to: C11.a, color: red, via: [[2.8, -0.50]] }
  - { from: C11.b, to: [1.45, 2.6] }
  - { from: RD1.b, to: C12.a, color: red }
  - { from: C12.b, to: [1.45, 7] }
  - { from: RD1.b, to: RD2.a, color: red, via: [[6.0, -0.82]] }
  - { from: RD2.b, to: C13.a, color: red }
  - { from: C13.b, to: [1.45, 10.7] }
  - { from: RD1.b, to: V3.pin4, color: red, via: [[4.5, 0.20], [1.8, 0.20], [1.8, 1.66], [5.2, 1.66]] }
  - { from: V3.pin4, to: V4.pin4, color: red, via: [[6.2, 1.62], [9.3, 1.62]] }
  - { from: T2.blue, to: V3.pin3, via: [[13.1, 2.74], [4.6, 2.74], [4.6, 1.90]] }
  - { from: T2.brown, to: V4.pin3, via: [[13.7, 2.96], [8.6, 2.96], [8.6, 1.90]] }
  - { from: T2.green, to: SPK.tip, via: [[14.4, 1.92]] }
  - { from: SPK.sleeve, to: [1.45, 16.9], via: [[16.9, 2.24]] }
  - { from: RD2.b, to: RL3.a, color: red, via: [[9.7, 0.20], [5.4, 0.20]] }

  - { from: RD1.a, to: T2.red, color: red, via: [[4.3, -0.15], [13.9, -0.15], [13.9, 1.30]] }
  - { from: RD1.a, to: RL4.a, color: red, via: [[5.4, -0.45], [33.1, -0.45]] }
  - { from: RD2.b, to: RL2.a, color: red, via: [[9.5, -0.75], [48.4, -0.75]] }
  - { from: RL2.a, to: RL1.a, color: red, via: [[48.6, -0.15], [61.4, -0.15]] }

  # === bias supply: an HT leg -> 100k -> rectifier -> 25 uF / 30k -> -35V ===
  # V5.pin8 -> R5.a wraps the board's left edge (x~1.2, the same manoeuvre
  # V5.pin8 -> RD1.a uses) onto its own shelf; the rest are adjacent local
  # hops at the natural terminal height.
  - { from: V5.pin2, to: R5.a, color: red, via: [[3.8, 2.15], [3.8, -0.30], [15.0, -0.30]] }
  - { from: R5.b, to: D1.a }
  - { from: D1.b, to: C14.a }
  - { from: C14.a, to: R6.a, via: [[21.2, -0.85]] }
  - { from: C14.b, to: [1.45, 16.8] }
  - { from: R6.b, to: [1.45, 22.5] }
  - { from: R6.a, to: VR4.lug1, color: brown, via: [[22.5, -0.90], [39.5, -0.90]] }

  # === the Intensity control sits IN the bias line =========================
  - { from: C9.b, to: VR4.lug3, color: brown, via: [[39.4, -0.20], [40.4, -0.20]] }
  - { from: VR4.lug2, to: C10.a, via: [[40.45, -0.35], [39.0, -0.38], [37.0, -0.38]] }
  - { from: C10.b, to: [1.45, 37.0] }
  - { from: VR4.lug2, to: RG4.a, color: yellow, via: [[40.6, -0.60], [22.3, -0.60]] }
  - { from: RG4.a, to: RG3.a, color: yellow, via: [[21.7, -0.60], [2.5, -0.60]] }

  # === output stage: grids and cathodes ====================================
  - { from: C7.a, to: V3.pin5, via: [[3.2, 1.38], [6.4, 1.38]] }
  - { from: C8.b, to: V4.pin5, via: [[19.6, 1.05], [10.9, 1.66]] }
  - { from: V3.pin8, to: [1.45, 6.0], via: [[6.1, 2.26]] }
  - { from: V4.pin8, to: [1.45, 10.6], via: [[10.4, 2.26]] }

  # === cathodyne: plate, grid, cathode, tail — every leg explicit ==========
  # JPI (the tail junction) is row1 throughout (RKA.b/RGPI.b/RKB.b/C8.a), so
  # its own local bus stays on a shelf just below row1 (y~1.15) — clear of
  # the deeper lanes (1.30-2.30) the tube-bound leads use below it.
  - { from: RL3.b, to: V2.pin6, via: [[5.4, 1.05], [17.3, 1.05], [17.3, 2.62], [19.1, 2.62]] }
  - { from: RKA.a, to: V2.pin8, via: [[8.4, 2.30], [22.6, 2.30], [22.6, 2.45]] }
  - { from: RKA.b, to: RGPI.b, via: [[8.6, 1.15], [12.4, 1.15]] }
  - { from: RGPI.b, to: RKB.b, via: [[12.6, 1.15], [15.4, 1.15]] }
  - { from: RGPI.a, to: V2.pin7, via: [[12.4, 1.35], [24.0, 1.35], [24.0, 2.10]] }
  - { from: RKB.a, to: [1.45, 13.0] }
  - { from: RKB.b, to: C8.a, via: [[15.6, 1.15], [19.4, 1.15]] }
  - { from: C6.a, to: RGPI.a, via: [[26.4, -0.20], [12.4, -0.20]] }
  - { from: C6.b, to: RL2.b, via: [[26.6, -0.30], [48.6, -0.30]] }

  # === tremolo oscillator (annotation layer) ================================
  - { from: RL4.b, to: V2.pin1, via: [[33.1, 1.68], [16.5, 1.68], [16.5, 2.55]] }

  # === Speed control (VR3) with its own end resistor R3 ====================
  - { from: VR3.lug2, to: VR3.lug3 }
  - { from: VR3.lug3, to: R3.a, via: [[44.5, -0.62], [44.5, -0.20]] }
  - { from: R3.b, to: [1.45, 44] }

  # === driver ==================================================================
  - { from: RL2.b, to: V1.pin1, via: [[48.6, 1.56], [60.0, 1.56], [60.0, 1.80]] }
  - { from: RK2.a, to: C5.a, via: [[50.4, -0.30], [52.6, -0.30]] }
  - { from: RK2.a, to: V1.pin3, via: [[50.4, 1.66], [63.0, 1.66]] }
  - { from: RK2.b, to: [1.45, 50] }
  - { from: C5.b, to: [1.45, 52] }
  - { from: C4.b, to: V1.pin2, via: [[55.4, -0.20], [63.9, -0.20], [63.9, 1.90]] }

  # === input stage ===============================================================
  - { from: RL1.b, to: V1.pin6, via: [[61.4, 1.82], [64.0, 1.82]] }
  - { from: RL1.b, to: C2.a, via: [[61.6, -0.35], [68.4, -0.35]] }
  - { from: RK1.a, to: C1.a, via: [[63.4, -0.14], [65.6, -0.14]] }
  - { from: RK1.a, to: V1.pin8, via: [[63.4, 1.66], [64.2, 2.24]] }
  - { from: RK1.b, to: [1.45, 63] }
  - { from: C1.b, to: [1.45, 65] }

  # === 68k stoppers + input leak mount at the jacks (not on the board) =====
  - { from: JA.tip, to: V1.pin7, via: [[73.0, -0.20], [73.2, 0.55], [65.1, 2.28]] }
  - { from: JB.tip, to: V1.pin7, via: [[70.0, -0.20], [63.6, 2.28]] }

  # === Tone/Volume network: read from the schematic (mounted at the pots) =
  # C3/C10/VR1-4 are all off-board (natural terminal height ~y=-0.9..-0.97,
  # same band discussed above), so adjacent-item hops here stay direct.
  - { from: C2.b, to: VR2.lug3, via: [[65.0, -0.55]] }
  - { from: VR2.lug3, to: C3.a, via: [[63.0, -1.05], [56.0, -1.05]] }
  - { from: C3.b, to: VR1.lug1 }
  - { from: VR1.lug1, to: VR1.lug2 }
  - { from: VR1.lug3, to: [1.45, 58.5] }
  - { from: VR2.lug1, to: [1.45, 59.8] }
  - { from: VR2.lug2, to: C4.a, via: [[59.2, -0.42]] }

  # === 6.3 V heater chain (green twisted pair) ================================
  # PT green pair → pilot lamp → V3 → V4 → V2 → V1. The 5Y3GT rectifier takes
  # its own 5 V winding and is off this chain. Twisted runs land only on
  # heater pins (octal 2/7, noval 4/5, with 9 the noval centre tap).
  - { from: T1.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V3.pin2, style: twisted, via: [[-1.2, 3.56], [5.0, 3.56]] }
  - { from: V3.pin7, to: V4.pin2, style: twisted, via: [[6.9, 3.56], [9.0, 3.56]] }
  - { from: V4.pin7, to: V2.pin4, style: twisted, via: [[10.9, 3.60], [19.4, 3.60]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[20.6, 3.60], [63.4, 3.60]] }
  - { from: V1.pin5, to: V1.pin9, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC
# netlist (netlist.cir) for pipeline/verify_layout_nets.py. See
# docs/layout-schema.md. No excluded_tubes entry belongs here: V2 hosts both
# the modelled cathodyne (V2A) and the excluded tremolo oscillator (V2B), so
# the socket is anchored by the cathodyne half and only the oscillator's own
# network is unmodelled — enumerated in the unchecked-terminal report rather
# than hidden behind a socket-level exclusion, the same treatment amps/6g3
# gives its own driver+oscillator bottle.
net_map:
  anchors:
    T2.red: BP        # OT primary centre tap -> reservoir node
    T2.blue: BP        # OT primary, V3 plate lead
    T2.brown: BP       # OT primary, V4 plate lead
    SPK.tip: "0"       # OT-secondary DCR folded into ground (no NFB on this drawing)
  netlist_unplaced:
    RG1: "1 MΩ input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2: "V1B's nominal 1 MΩ grid return — no discrete part on the drawing; the grid returns to ground at the Volume pot's own ground lug (see notes.md)"
