# Board layout — redrawn from the published Fender "Princeton" Model 6G2
# layout drawing (H-FA). Part refs are the shared key into bom.yaml; the
# renderer reads each value and part type from there. A legible, schematic-
# style redraw of the board's principal components in the order the drawing
# shows them — never a trace or a dimensioned reproduction.
#
# The board reads left→right matching the sheet's own tube row order —
# output-stage/cathodyne parts at the left end, the resolved tremolo-
# oscillator bits and the Speed end resistor next, then the driver (V1B) and
# the input stage (V1A) at the right — matching the tube row below it
# (5Y3GT · 6V6GT · 6V6GT · 12AX7 inverter+oscillator · 7025 driver+input),
# same convention amps/6g3 established.
#
# What the sheet resolves clearly and what it does not: the sheet's own
# small sub-boxes for the rail-dropper chain (+315→+312→+280 V, matching
# netlist.cir's RD1/RD2 exactly) and the bias supply (100k-5%/rectifier/
# 25µF/30k-5%) are read off it directly and drawn as off-board stubs, the
# same treatment amps/6g3 gives its own filter housing and bias sub-board.
# The PT's four-wire HT group (the sheet letters it "yellow/red/red/yellow")
# is not fully resolved lead-by-lead from this scan; the topology it draws —
# two HT legs to the 5Y3GT's plates, a centre tap returning to ground — is
# the standard, unambiguous configuration for this rectifier family, so that
# is what is drawn, with the PT leads coloured "red" (the two HT legs, the
# dominant, legible colour on the sheet) and "black" (the rectifier's own
# filament winding, per the sheet's own callout); the ambiguous second
# "yellow" pair is not asserted onto specific terminals.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo
# oscillator's own network and the PT / rectifier AC side are an excluded
# annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 75
  title: "6G2 · eyelet board layout"
caption: "Redrawn from the published Fender \"Princeton\" Model 6G2 layout drawing (H-FA) — principal board components and their hookup, in the order the drawing shows them. Off the board: the two 68 kΩ input grid stoppers and the 1 MΩ input grid leak mount at the jacks (the sheet's own \"Instruments\" jacks carry a resistor right at the lug); the Tone cut cap and the Intensity wiper-to-ground cap mount at their own pots; the rail-dropper chain (RD1/RD2 + the three filter caps) and the bias-supply group (R5/D1/C14/R6) each sit in the sheet's own small sub-boxes rather than on the eyelet strip, drawn here as off-board stubs so every rail stays traceable. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6 output tubes → the 12AX7 → the 7025; the 5Y3GT rectifier is directly heated and sits on its own 5 V winding, off this chain) is drawn in the conventional daisy order the sheet's own \"to all 6.3 volt htrs\" arrow implies rather than routes. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender \"Princeton\" Model 6G2 layout drawing (H-FA) — title block reads \"FENDER 'PRINCETON' LAYOUT MODEL 6G2 H-FA\", matching the schematic's own H-FA drawing number; verified against a fresh copy of the source PDF"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_6g2.pdf"

parts:
  # --- V3 grid stopper, cathodyne plate coupler + load -------------------
  - { ref: RG3, a: [0, 2], b: [1, 2] }        # 1.5k V3 grid stopper (-35V.a -> G61.b)
  - { ref: C7, a: [1, 2], b: [1, 5] }         # 0.1 uF PI plate(.b) -> V3 grid(.a, shares RG3.b)
  - { ref: RL3, a: [0, 5], b: [1, 5] }        # 56k cathodyne plate load (BD.a -> PPI.b, shares C7.b)
  # --- cathodyne cathode / tail network — every leg wired explicitly -----
  - { ref: RKA, a: [0, 8], b: [1, 8] }        # 1.5k cathode resistor: K(.a) -> JPI(.b)
  - { ref: RGPI, a: [0, 12], b: [1, 12] }     # 1M grid leak: GPI(.a) -> JPI(.b)
  - { ref: RKB, a: [0, 15], b: [1, 15] }      # 56k tail-to-ground: GND(.a) -> JPI(.b)
  # --- tail coupler + V4 grid stopper -------------------------------------
  - { ref: C8, a: [1, 19], b: [1, 22] }       # 0.1 uF: JPI(.a) -> V4 grid(.b) — both row1
  - { ref: RG4, a: [0, 22], b: [1, 22] }      # 1.5k V4 grid stopper: -35V(.a) -> grid(.b, shares C8.b)
  # --- driver -> cathodyne coupler ----------------------------------------
  - { ref: C6, a: [0, 26], b: [1, 26] }       # 0.02 uF: GPI(.a) -> V1B plate tap(.b)
  # --- tremolo oscillator: the resolved plate-load / output-feed bits ----
  - { ref: RL4, a: [0, 30], b: [0, 33] }      # 56k oscillator plate load (V2B plate -> BP)
  - { ref: R4, a: [0, 33], b: [0, 36] }       # 220k oscillator output feed
  - { ref: C9, a: [0, 36], b: [0, 39] }       # 0.1 uF output coupler -> Intensity
  # --- Speed control's own end resistor -----------------------------------
  - { ref: R3, a: [0, 44], b: [1, 44] }       # 100k Speed-control end resistor
  # --- driver (V1B) ---------------------------------------------------------
  - { ref: RL2, a: [0, 48], b: [1, 48] }      # 100k plate load (BD -> PB)
  - { ref: RK2, a: [0, 50], b: [1, 50] }      # 1.5k cathode resistor
  - { ref: C5, a: [0, 52], b: [1, 52] }       # 25 uF cathode bypass
  - { ref: C4, a: [0, 55], b: [1, 55] }       # 0.02 uF Volume wiper -> V1B grid
  # --- input stage (V1A) -----------------------------------------------------
  - { ref: RL1, a: [0, 61], b: [1, 61] }      # 100k plate load (BD -> PA)
  - { ref: RK1, a: [0, 63], b: [1, 63] }      # 1.5k cathode resistor
  - { ref: C1, a: [0, 65], b: [1, 65] }       # 25 uF cathode bypass
  - { ref: C2, a: [0, 68], b: [1, 68] }       # 0.02 uF V1A plate -> Tone/Volume network

offboard:
  # --- chassis iron and the tube row, left to right as the sheet draws it -
  - { id: T1, ref: T1, kind: xfmr, edge: left, at: 0.4, label: "Power trans" }
  - { id: PL1, kind: part, glyph: lamp, edge: left, at: 1.6, label: "Pilot lamp" }
  - { id: V5, ref: V5, kind: tube, edge: bottom, at: 2, label: "V5 · 5Y3GT" }
  - { id: V3, ref: V3, kind: tube, edge: bottom, at: 6, label: "V3 · 6V6GT" }
  - { id: V4, ref: V4, kind: tube, edge: bottom, at: 10, label: "V4 · 6V6GT" }
  - { id: T2, ref: T2, kind: xfmr, edge: bottom, at: 13.5, label: "Output trans" }
  - { id: SPK, kind: jack, edge: bottom, at: 16.5, label: "Spkr" }
