  - { id: C13, ref: C13, kind: part, edge: top, at: 12, label: "C13" }
  # --- bias supply: sits in the sheet's own small sub-box --------------------
  - { id: R5, ref: R5, kind: part, edge: top, at: 15, label: "R5" }
  - { id: D1, ref: D1, kind: part, edge: top, at: 17.5, label: "D1" }
