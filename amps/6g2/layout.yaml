  - { id: V1, ref: V1, kind: tube, edge: bottom, at: 64, label: "V1 · 7025 driver+input" }
  # --- rail-dropper chain: sits in the sheet's own small sub-box. Ordered to
  #     match the rail topology itself (BP · C11 -> RD1 -> BS · C12 -> RD2 ->
