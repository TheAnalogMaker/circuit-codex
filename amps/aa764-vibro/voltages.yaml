# Printed voltage chart read directly from the published Fender "VIBRO-CHAMP
# AA764" drawing (schematic sheet I-FD; the layout sheet repeats the same
# tube-pin values). The drawing's notice: "Voltages read to ground with
# electronic voltmeter. Values shown + or - 20%." Tube pins therefore get
# 20%; the supply rails get a tighter internal target.
#
# The reservoir node BP1 is DRIVEN at its printed +355 V and every node below
# it is solved (see netlist.cir). The 6V6 plate is not listed: with the output
# transformer primary DCR omitted it is the same node as BP1, so its printed
# +342 V would compare against the driven value rather than a solved one. The
# gap between the printed +355 V reservoir and the printed +342 V plate is the
# 125A35A primary winding resistance, a figure the drawing does not print —
# same convention as amps/aa764.
#
# The tremolo bottle (V4, excluded — see netlist.cir and notes.md) draws
# from BP2, the +340 V node between the two droppers: its oscillator through
# a 470 kΩ plate load, its cathode follower's plate directly. With it left
# out, BP2 and BP3 carry about 2.9 mA less than the real circuit, so both
# rails read a few volts above the chart.
#
# The follower's cathode also reaches V1B's cathode (K1B) through 68 kΩ and
# the Intensity control, DC-coupled. How much of its current lands on K1B
# depends on the Intensity setting, which the drawing does not state, so K1B
# and the plate above it (P1B) are reported for reference, not gated — see
# their notes.
source: "Fender 'VIBRO-CHAMP AA764' drawing (I-FD), printed chart: +355 V (reservoir / OT primary feed), +340 V (6V6 screen pin 4), +342 V (6V6 plate, unlabeled pin near +340 V), +21 V (6V6 cathode, pin 8, printed on both the schematic and the layout page), +320 V (preamp rail), +205 V / +1.6 V (12AX7 first stage plate and cathode), +200 V / +1.5 V (12AX7 second stage plate and cathode — the tremolo's Intensity control lands on that cathode), +170 V / +1.6 V and +340 V / +175 V (tremolo oscillator, excluded)"
nodes:
  BP2: { chart: 340, tol_pct: 8,  note: "6V6 screen node, after the 1 kΩ · 1 W dropper (R14) — also the tremolo bottle's supply (the oscillator's 470 kΩ load and the cathode follower's plate), off-model" }
  BP3: { chart: 320, tol_pct: 8,  note: "preamp plate rail, after the 10 kΩ · 1 W dropper (R15)" }
  P1A: { chart: 205, tol_pct: 20, note: "12AX7 first-stage plate, chart pin 1" }
  K1A: { chart: 1.6, tol_pct: 20, note: "12AX7 first-stage cathode over 1.5 kΩ, chart pin 3" }
  P1B: { chart: null, note: "12AX7 second-stage plate, chart pin 6, printed +200 V. For reference, not gated: its cathode carries the tremolo's DC injection (see K1B), which moves this plate from 213 V to 323 V across the Intensity control's travel" }
  K1B: { chart: null, note: "12AX7 second-stage cathode, chart pin 8, printed +1.5 V — 1.5 kΩ down to the 47 Ω/2.7 kΩ feedback divider. For reference, not gated: the Intensity control's far end lands here with no capacitor, so the tremolo's cathode follower (+175 V printed) drives current into this node through 68 kΩ and whatever part of the 25 kΩ element lies between the wiper and this end. Held at +175 V, the follower takes K1B from 1.65 V (wiper at the grounded end) to 3.87 V (wiper at this end); the drawing does not state the setting" }
  K2:  { chart: 21, tol_pct: 20, note: "6V6GT cathode over 470 Ω · 1 W, chart pin 8 — +21 V on both the schematic and the layout page" }
