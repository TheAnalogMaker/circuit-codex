# Board layout — the audio path (R1-R15, VR1-3, C1-C11, V1-V3, T1-T2) reuses
# amps/aa764's board order and point-to-point wiring VERBATIM: notes.md and
# bom.yaml document this circuit's audio path as component-for-component
# identical to amps/aa764 (same designators, same values, same topology), so
# the same board arrangement — read from the real Fender "Champ-Amp AA764"
# layout drawing for that entry — is the honest redraw here too, rather than
# inventing a second, unverifiable arrangement for an identical circuit. Part
# refs are the shared key into bom.yaml; the renderer reads each value and
# part type from there. A legible, schematic-style redraw — never a trace or
# a dimensioned reproduction.
#
# What is ADDED for the "VIBRO-CHAMP AA764" drawing is the tremolo: its
# network on the board where the factory layout page mounts it, between the
# 6V6 cathode and the feedback divider (the 68k, the .02/.01/.01 ladder, both
# 1 MΩs, the 4.7k and the 25 µF), and as off-board stubs the Vibrato Pedal
# jack (J1), the Intensity and Speed controls (R27, R24, with the Speed
# control's 100k, R25, riding on its pot) and the tremolo tube (V4). The
# board's audio-path columns from the feedback divider rightward sit five
# columns further right than amps/aa764's to make room. Only the 470k plate
# load (R22), soldered across V4's own socket, is not drawn. V4 is a running
# oscillator with no static DC operating point (notes.md) and is DECLARED
# EXCLUDED below; its heater pins extend the same single-ended daisy chain
# amps/aa764 uses.
#
# The board reads left→right exactly as amps/aa764 does: the supply droppers
# and filter sections at the left end, then the 6V6 cathode network, the
# negative-feedback divider and the 12AX7 driver cathode, the coupling cap and
# the two 100 kΩ plate loads, the treble/bass tone-stack capacitors, and
# finally the input stoppers and the first-stage cathode network at the right
# — matching the tube row (5Y3GT · 6V6GT · 12AX7, left to right). The added
# tremolo network sits between the 6V6 cathode network and the feedback
# divider, as on the factory board, with the Vibrato Pedal jack and the
# Intensity/Speed pots (in the front panel's own order) along the top edge
# above it and the oscillator tube along the bottom edge beneath it.
#
# Two documented redraw conventions carried over from amps/aa764, both stated
# so nothing is implied that the sheet does not show:
#  * The published sheet returns the board's grounds to chassis lugs at three
#    points (open arrows). They are drawn here as the house ground bus running
#    below the bottom eyelet row — the same net, one rail.
#  * The three 20 µF · 450 V filter sections are a chassis-mounted can on the
#    sheet, its three leads landing on the rail nodes drawn here; they are drawn
#    in the board row, beneath the droppers they filter, for legibility.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp, the PT/rectifier AC side,
# and the excluded tremolo oscillator V4 are an annotation layer (not modelled
# in netlist.cir).
wiring_claim: verified

heaters:
  - id: h63
    volts: 6.3
    winding: "6.3 V secondary — the transformer's green pair"
    grounded_leg: return
    source: >-
      Fender "VIBRO-CHAMP-AMP AA764" layout page (I-FD), read from the Internet
      Archive's capture of the el34world PDF at its native 6480 x 4058 (708 ppi);
      both 12AX7 socket circles were fitted to the drawn rim in pixels (coverage
      1.00 and 0.97) and their pin bearings measured, rather than read by eye. At
      the transformer one GREEN lead and the RED-YELLOW HT centre tap meet at a
      solder point and go to a ground arrow; the other GREEN runs up to the pilot
      light, whose far terminal goes to a ground triangle and whose fed terminal
      carries the arrow "TO ALL 6.3V. HEATERS". At both 12AX7 sockets a short bow
      outside the rim ties pins 4 and 5 together (2386 px of ink at V1, 2065 px at
      the tremolo bottle V4, nothing else leaving either pin) and pin 9 carries a
      lead to a ground triangle — the 6.3 V parallel grouping. At the 6V6GT pin 7
      takes the lead to a ground triangle and heater pin 2 is a bare terminal,
      the fed leg the arrow stands in for.
    sockets:
      V1: { feed: [4, 5], return: [9] }
      V4: { feed: [4, 5], return: [9] }
      V2: { feed: [2], return: [7] }
  - id: h5
    volts: 5.0
    winding: "5 V rectifier-filament secondary — the transformer's yellow pair"
    grounded_leg: none
    source: >-
      Same sheet: the two YELLOW leads land on the 5Y3GT's pins 2 and 8, one
      approaching each flank of the socket, with the "+355V" RED lead leaving pin
      8 beside the second yellow; nothing joins pins 2 and 8. The filament is the
      cathode and carries the rectified B+, so neither leg is grounded.
    sockets:
      V3: { feed: [2], return: [8] }

board:
  rows: 2
  cols: 55
  title: "AA764-VIBRO · eyelet board layout"
# The heaters here are single-ended rather than a twisted pair, so they earn no
# automatic "6.3 V heaters — twisted pair" legend entry. Name the green run in
# the drawing's own colour legend instead, so the SVG is self-describing when it
# is read on its own (it is served standalone at /layouts/aa764-vibro.svg).
wire_legend:
  heater: "green — 6.3 V heaters (single-ended; one leg grounded at the transformer)"

caption: "The audio path (input stoppers, both 12AX7 gain stages, the treble-bass tone stack, the negative-feedback divider and the 6V6GT output stage) reuses amps/aa764's board order and wiring verbatim — the two entries' audio paths are component-for-component identical (notes.md), so the same redrawn arrangement, read from the published Fender 'Champ-Amp AA764' layout drawing (I-FD), is the honest redraw here too. Added for the Vibro Champ: the tremolo network, on the board between the 6V6 cathode and the feedback divider where the factory layout page mounts it — the follower's 68 kΩ, the .02/.01/.01 phase-shift ladder (which the factory stacks in one column on two intermediate solder points, folded here over the two eyelet rows), the 1 MΩ grid leak, the 1 MΩ from the pedal node to the cathode, and the 4.7 kΩ and 25 µF at the cathode — with the Vibrato Pedal jack (J1) and the Intensity (R27) and Speed (R24) controls above it, the Speed control's 100 kΩ (R25) on its pot, and the tremolo tube (V4) beneath; the audio path from the feedback divider rightward is shifted five columns right of amps/aa764's to make room. The 470 kΩ plate load, soldered across V4's socket, is not drawn. V4 has no static DC operating point and is excluded from the simulated circuit; its 6.3 V heater pins are wired, extending the single-ended daisy chain (one green transformer lead grounded, the other feeding the pilot lamp and every heater in turn: 12AX7 V1 pins 4+5 strapped, centre tap at pin 9 to ground; 6V6GT V2 pin 2 fed, pin 7 to ground; 12AX7 V4 pins 4+5 strapped, centre tap at pin 9 to ground). The board's chassis-ground returns are drawn as one ground bus, and the three 20 µF filter sections — a chassis can on the sheet — are drawn in the board row beneath the droppers they filter. The 1 MΩ grid leak sits at the input jack and the 15 kΩ bass leg at the Bass control, as the sheet shows them. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'VIBRO-CHAMP AA764' drawing (I-FD), schematic + layout sheets"
  url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_vibro_champ_aa764.pdf"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; column shared across rows = vertical leg).
# Identical to amps/aa764/layout.yaml — see the header note above.
# Electrolytic lead declarations: see docs/electrolytic-polarity.md for the
# source crop register and the unresolved DC checks. a/b name actual terminals.
parts:
  # --- supply droppers (row 0) over their filter sections (row 1) -----------
  - { ref: R15, a: [0, 1],  b: [0, 4] }    # 10 kΩ 1 W dropper, B+2 → B+3
  - { ref: R14, a: [0, 4],  b: [0, 7] }    # 1 kΩ 1 W dropper, B+1 → B+2
  # Polarity: DC sign (source read; no legible printed capacitor + used); lead C10.a: BP3 = +326.9 V (op-points); lead C10.b: 0 = +0.0 V (ground); more-positive lead is C10.a.
  - { ref: C10, a: [1, 1],  b: [1, 2] , plus: a }    # 20 µF filter, B+3 (preamp rail)
  # Polarity: DC sign (source read; no legible printed capacitor + used); lead C9.a: BP2 = +349.1 V (op-points); lead C9.b: 0 = +0.0 V (ground); more-positive lead is C9.a.
  - { ref: C9,  a: [1, 4],  b: [1, 5] , plus: a }    # 20 µF filter, B+2 (screen rail)
  # Polarity: DC sign (source read; no legible printed capacitor + used); lead C8.a: BP1 = +355.0 V (ideal source VBP1); lead C8.b: 0 = +0.0 V (ground); more-positive lead is C8.a.
  - { ref: C8,  a: [1, 7],  b: [1, 8] , plus: a }    # 20 µF filter, B+1 (reservoir)
  # --- 6V6GT output stage ---------------------------------------------------
  - { ref: R13, a: [0, 11], b: [1, 11] }   # 470 Ω 1 W cathode bias
  # Polarity: printed '+' on the cited source; lead C7.a: K2 = +22.2 V (op-points); lead C7.b: 0 = +0.0 V (ground); more-positive lead is C7.a.
  - { ref: C7,  a: [0, 13], b: [1, 13] , plus: a }   # 25 µF cathode bypass
  # --- tremolo oscillator network (V4), between the 6V6 cathode and the
  # feedback divider, where the factory board mounts it (Vibro-Champ AA764
  # layout, I-FD, crop (3300,2450)-(4150,3150)): the follower's 68k alone in
  # its own column; the .02/.01/.01 phase-shift ladder, which the factory
  # stacks in one column on two intermediate solder points, folded here into
  # a zig-zag over the two eyelet rows (plate -> Speed node -> pedal node ->
  # grid); the 1M grid leak to its own ground eyelet; the 25-25 standing
  # between the cathode and ground with the 4700 beside it; and the second
  # 1M from the pedal node to the cathode.
  - { ref: R26, a: [0, 14.6], b: [1, 14.6] } # 68 kΩ: Intensity wiper (a) -> V4B cathode (b)
  - { ref: C16, a: [1, 16], b: [0, 16] }     # .02 µF: V4A plate (a) -> Speed node (b)
  - { ref: C15, a: [0, 16], b: [0, 18] }     # .01 µF: Speed node -> pedal node
  - { ref: C17, a: [0, 18], b: [1, 18] }     # .01 µF: pedal node -> V4A grid
  - { ref: R21, a: [1, 18], b: [1, 20] }     # 1 MΩ grid leak, grid -> ground eyelet
  - { ref: R20, a: [0, 18], b: [0, 20] }     # 1 MΩ: pedal node -> V4A cathode
  # Polarity: printed '+' on the cited source (the 25-25's '+' on its cathode lead); lead C18.a: V4A cathode, which has no simulated volts (V4 is excluded from netlist.cir); lead C18.b: 0 (ground).
  - { ref: C18, a: [0, 20], b: [1, 20] , plus: a }   # 25 µF V4A cathode bypass, cathode (a) over ground (b)
  - { ref: R23, a: [0, 21.4], b: [1, 21.4] } # 4.7 kΩ V4A cathode resistor (a tied to the cathode eyelet)
  # --- negative-feedback divider + 12AX7 driver cathode ---------------------
  - { ref: R11, a: [0, 23], b: [1, 23] }   # 2.7 kΩ feedback, speaker → KFB
  - { ref: R9,  a: [0, 25], b: [1, 25] }   # 1.5 kΩ V1B cathode, down to KFB
  # Polarity: printed '+' on the cited source; source '+' at C5.b; DC check remains undecided (C5.a: on KFB, which has no simulated volts).
  - { ref: C5,  a: [0, 27], b: [1, 27] , plus: b }   # 25 µF, bypasses the 1.5 kΩ only
  - { ref: R10, a: [0, 29], b: [1, 29] }   # 47 Ω feedback-divider leg
  # --- coupling into the 6V6 grid, and the two 100 kΩ plate loads -----------
  - { ref: R12, a: [0, 32], b: [0, 34] }   # 220 kΩ 6V6 grid leak
  - { ref: C6,  a: [0, 34], b: [1, 34] }   # 0.02 µF coupler (shares the grid eyelet)
  - { ref: R8,  a: [1, 34], b: [1, 36] }   # 100 kΩ V1B plate load, up to B+3
  - { ref: R4,  a: [1, 36], b: [1, 38] }   # 100 kΩ V1A plate load (shares the B+3 eyelet)
  # --- treble/bass tone stack ----------------------------------------------
  - { ref: C2,  a: [0, 38], b: [1, 38] }   # 250 pF treble cap (shares the V1A plate eyelet)
  - { ref: R6,  a: [1, 38], b: [1, 40] }   # 100 kΩ slope resistor
  - { ref: C4,  a: [0, 40], b: [1, 40] }   # 0.047 µF (shares the slope-node eyelet)
  - { ref: C3,  a: [0, 42], b: [1, 42] }   # 0.1 µF, its lower lead reaching the slope node
  # --- input stoppers and first-stage cathode ------------------------------
  - { ref: R2,  a: [0, 45], b: [1, 45] }   # 68 kΩ stopper, jack 2 (low)
  - { ref: R1,  a: [0, 47], b: [1, 47] }   # 68 kΩ stopper, jack 1 (high)
  - { ref: R5,  a: [0, 50], b: [1, 50] }   # 1.5 kΩ V1A cathode bias
  # Polarity: printed '+' on the cited source; lead C1.a: K1A = +1.7 V (op-points); lead C1.b: 0 = +0.0 V (ground); more-positive lead is C1.a.
  - { ref: C1,  a: [0, 52], b: [1, 52] , plus: a }   # 25 µF cathode bypass

# Off-board items drawn as labelled stubs around the board. Tubes, output
# transformer and speaker jack along the bottom, the controls and input jacks
# up top, the power transformer and pilot lamp at the left — the same
# positions amps/aa764 uses (see the header note above). Added for this entry:
# the Vibrato Pedal jack + its 1 MΩ and the Speed/Intensity controls, in the
# board's otherwise-empty top-left margin (cols 0-27, clear of the Bass control
# at 28), and the oscillator tube along the bottom edge beneath them (cols
# 15.5-43.5 is clear between the 6V6 and V1). The audio-path input jacks are
# renamed JIN1/JIN2 here (amps/aa764 uses the bare ids J1/J2) because this
# entry's own bom.yaml already assigns J1 to the Vibrato Pedal jack.
offboard:
  - { id: T1,   ref: T1, kind: xfmr, edge: left,   at: 0.45, label: "Power trans" }
  - { id: PL1,  kind: part, glyph: lamp, edge: left, at: -0.9, label: "Pilot lamp" }
  # --- tremolo hardware, added for this entry (top-left margin) ------------
  - { id: J1,   ref: J1, kind: jack, edge: top, at: 14,   label: "Vibrato Pedal" }
  - { id: R27,  ref: R27, kind: pot, edge: top, at: 18.5, label: "Intensity" }
  - { id: R25,  ref: R25, kind: part, edge: top, at: 21.6, label: "Speed leg" }   # 100k on the Speed pot, lug 1 -> chassis
  - { id: R24,  ref: R24, kind: pot, edge: top, at: 23.5, label: "Speed" }
  - { id: V4,   ref: V4, kind: tube, edge: bottom, at: 19.5, label: "V4 · 12AX7 trem" }
  # --- audio path, identical positions to amps/aa764 ------------------------
  - { id: V3,   ref: V3, kind: tube, edge: bottom, at: 2.5,  label: "V3 · 5Y3GT" }
  - { id: T2,   ref: T2, kind: xfmr, edge: bottom, at: 8.5,  label: "Output trans" }
  - { id: SPK,  kind: jack, edge: bottom, at: 11.5, label: "Spkr jack" }
  - { id: V2,   ref: V2, kind: tube, edge: bottom, at: 15,   label: "V2 · 6V6GT" }
  - { id: VR3,  ref: VR3, kind: pot, edge: top,    at: 33,   label: "Bass" }
  - { id: R7,   ref: R7, kind: part, edge: top,    at: 35.4, label: "R7" }
  - { id: VR2,  ref: VR2, kind: pot, edge: top,    at: 37.5, label: "Treble" }
  - { id: VR1,  ref: VR1, kind: pot, edge: top,    at: 42,   label: "Volume" }
  - { id: JIN2, kind: jack, edge: top, at: 45.5, label: "In 2" }
  - { id: JIN1, kind: jack, edge: top, at: 48,   label: "In 1" }
  - { id: R3,   ref: R3, kind: part, edge: top,   at: 52.6, label: "R3" }
  - { id: V1,   ref: V1, kind: tube, edge: bottom, at: 49,  label: "V1 · 12AX7" }

# Ground bus — the bare rail running the length of the board just below the
# bottom eyelet row; filter, cathode, grid-leak, control and heater-return
# grounds all tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 54.7] }

# Wiring — the audio path is read lead-by-lead from the published AA764
# layout drawing and is identical to amps/aa764's runs (see the header note).
# Added for this entry: the tremolo network, its pots and pedal jack, and the
# heater daisy chain extended to V4. The transformer leads carry the colours
# marked on that sheet: the power transformer's two reds (315-0-315 V) with
# the red/yellow centre tap, the two yellows of the 5 V rectifier winding, and
# the two greens of the 6.3 V heater winding (one grounded, one feeding the
# pilot lamp and every heater in turn). The output transformer's plate lead is
# marked BLUE and its secondary leads BLACK (ground) and YELLOW (speaker); the
# control leads to the board are marked BROWN, BLUE and WHITE. Endpoints
# reference board eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated
# against reference/tubes basing), pot lugs, jacks, off-board 2-lead parts
# (R3.a/R7.a/R25.a/PL1.a) and transformer leads.
runs:
  # === power transformer secondary → 5Y3GT rectifier (annotation layer) =====
  # The seven secondary leads leave the transformer straight out, each in its own
  # lane, before turning — no two read as one wire and no lead passes close to a
  # neighbour's pigtail.
  - { from: T1.red1, to: V3.pin4, via: [[-1.35, 0.26], [-0.6, 0.5]] }        # HT plate 1
  - { from: T1.red2, to: V3.pin6, via: [[-1.25, 0.324], [-0.2, 1]] }        # HT plate 2
  - { from: T1.red-yellow, to: [1.45, 0.15], via: [[-1.45, 0.387], [-1, 0.95]] }  # HT centre tap → ground
  - { from: T1.yellow1, to: V3.pin2, via: [[-1.5, 0.45], [-1.5, 1.62]] }     # 5 V rectifier filament
  - { from: T1.yellow2, to: V3.pin8, via: [[-1.15, 0.513], [-0.75, 2.35]] }     # 5 V filament / B+ out
  - { from: V3.pin8, to: C8.a, color: red, via: [[4.6, 2.35], [6.95, 1.72]] }  # +355 V → reservoir

  # === filtered rails: three 20 µF sections split by the 1 kΩ and 10 kΩ =====
  - { from: C8.a, to: R14.b, via: [[7.42, 0.72]] }       # reservoir → B+1 eyelet
  - { from: C9.a, to: R14.a, via: [[3.58, 0.72]] }       # screen section → B+2 eyelet
  - { from: C10.a, to: R15.a, via: [[0.58, 0.72]] }      # preamp section → B+3 eyelet
  - { from: C8.b, to: [1.45, 8] }                        # filter negatives → ground bus
  - { from: C9.b, to: [1.45, 5] }
  - { from: C10.b, to: [1.45, 2] }

  # === output transformer, speaker jack and the 6V6GT ======================
  - { from: T2.red, to: C8.a, color: red, via: [[6.3, 1.35]] }                 # OT primary → B+1
  - { from: T2.blue, to: V2.pin3, color: blue, via: [[9, 2.9], [12.9, 2.9], [13.3, 1.6]] }  # OT primary → 6V6 plate
  - { from: T2.black, to: [1.45, 9.6], via: [[9.3, 1.78]] }                    # OT secondary common → ground
  - { from: T2.yellow, to: SPK, color: yellow, via: [[9.9, 2.35]] }            # OT secondary → speaker
  - { from: V2.pin4, to: C9.a, via: [[14.2, 1.55], [4.4, 1.55]] }             # screen → B+2
  - { from: V2.pin8, to: R13.a, via: [[16.3, 2.2], [16.3, 1.98], [12.6, 2.1]] }           # cathode → 470 Ω
  - { from: R13.b, to: [1.45, 11] }                                             # 470 Ω → ground bus
  - { from: C7.a, to: R13.a, via: [[12.1, -0.32]] }                            # bypass across the 470 Ω
  - { from: C7.b, to: [1.45, 13] }
  - { from: V2.pin5, to: R12.b, via: [[16.6, 1.36], [32.9, 1.36], [33.1, 0.72]] }           # grid → 220 kΩ / coupler eyelet
  - { from: R12.a, to: [1.45, 31.6], via: [[31.6, 0.55]] }                     # 220 kΩ grid leak → ground

  # === negative-feedback divider and the 12AX7 driver cathode ==============
  - { from: R11.b, to: SPK, via: [[23, 2.52], [12.3, 2.52]] }   # 2.7 kΩ feedback → speaker jack
  - { from: R11.a, to: R9.a }                                       # KFB tie (the drawing's jumper)
  - { from: C5.a, to: R9.a, via: [[26.6, -0.3]] }                 # 25 µF across the 1.5 kΩ
  - { from: C5.b, to: R9.b, via: [[26.6, 1.2]] }
  - { from: R10.a, to: R9.a, via: [[28.6, -0.8], [25, -0.8]] }   # 47 Ω onto the KFB node, from above
  - { from: R10.b, to: [1.45, 29] }                                 # 47 Ω → ground bus
  - { from: V1.pin8, to: R9.b, via: [[50.6, 2.62], [24.85, 2.62]] }   # V1B cathode → 1.5 kΩ (deep lane)

  # === 12AX7 driver plate, coupler and the +320 V rail =====================
  - { from: V1.pin6, to: C6.b, via: [[50.3, 1.58], [34.6, 1.58]] }   # V1B plate → coupler / plate load
  - { from: R8.b, to: C10.a, via: [[36.6, 1.32], [36.6, 3.2], [1.2, 3.2], [1.2, 1.32]] }  # +320 V rail → the plate loads
  - { from: V1.pin1, to: R4.b, via: [[47.6, 2.32], [38.4, 2.32]] }   # V1A plate → 100 kΩ / 250 pF / slope

  # === tone stack: the control leads the sheet marks BROWN, BLUE, WHITE ====
  # Every pot lug is approached square-on so no lead reads as landing on its
  # neighbour: the lugs sit only 11 px apart. The layout wires the Bass control
  # as a rheostat: its wiper takes the 0.1 µF lead and the arc to the Treble
  # control's lower lug, its lower lug the 0.047 µF lead and the 15 kΩ to
  # ground, and its upper lug is left bare. This redraw straps that bare
  # lug to the wiper, as the schematic draws the tie (no change to the circuit).
  # The two lower tone-cap leads reach the slope-node eyelet as one solder point
  # — the sheet curves the 0.047 µF lead across to it, this redraw seats that
  # cap on the eyelet and runs the 0.1 µF lead across instead. Same node either way.
  - { from: C2.a, to: VR2.lug1, color: white, via: [[38, -0.45], [37.19, -0.45]] }  # 250 pF → Treble
  - { from: C3.a, to: VR3.lug2, color: blue, via: [[43.8, -0.42], [43.8, -1.5], [33, -1.5]] }   # 0.1 µF → Bass wiper
  - { from: VR3.lug1, to: VR3.lug2 }                                                   # bass wiper strapped to its upper end (the factory leaves that lug bare)
  - { from: C3.b, to: R6.b }                                                           # 0.1 µF lower lead → slope node
  - { from: C4.a, to: VR3.lug3, color: brown, via: [[39.8, -0.52], [33.31, -0.52]] }  # 0.047 µF → Bass, lower end
  - { from: R7.a, to: VR3.lug3, via: [[34.3, -1.1], [33.31, -1.36]] }                # 15 kΩ bass leg, from above
  - { from: R7.b, to: [1.45, 31.2], via: [[35.79, -0.36], [31.2, -0.36]] }            # 15 kΩ → ground bus
  - { from: VR3.lug2, to: VR2.lug3, via: [[33, -0.7], [37.81, -0.7]] }            # bass wiper → treble lower lug
  - { from: VR2.lug2, to: VR1.lug1, via: [[37.5, -0.62], [41.69, -0.62]] }            # treble wiper → volume top
  - { from: VR1.lug3, to: [1.45, 44.3], via: [[42.31, -0.78], [44.3, -0.78]] }        # volume ground
  - { from: VR1.lug2, to: V1.pin7, via: [[42, -1.2], [51.6, -1.2], [51.6, 1.62]] }  # volume wiper → V1B grid

  # === input jacks, stoppers and the 1 MΩ grid leak ========================
  - { from: JIN2, to: R2.a, via: [[44.8, -1.02], [45, -0.42]] }
  - { from: JIN1, to: R1.a, via: [[47.3, -1.02], [47, -0.42]] }
  - { from: R2.b, to: R1.b }                                        # the two stoppers meet
  - { from: R1.b, to: V1.pin2, via: [[47.6, 1.4]] }               # → V1A grid
  - { from: R3.a, to: JIN1, via: [[52.21, -1.44], [48.4, -1.44]] }  # 1 MΩ grid leak at jack 1
  - { from: R3.b, to: [1.45, 54.3], via: [[54.3, -0.5]] }        # grid leak → ground bus

  # === 12AX7 first-stage cathode ==========================================
  - { from: V1.pin3, to: R5.a, via: [[47.9, 1.28], [49.6, 0.3]] }  # V1A cathode → 1.5 kΩ
  - { from: R5.b, to: [1.45, 50] }
  - { from: C1.a, to: R5.a, via: [[51.4, 0.3]] }                    # bypass across the 1.5 kΩ
  - { from: C1.b, to: [1.45, 52] }

  # === tremolo: Intensity, Speed, the pedal jack and V4 =====================
  # Read from the Vibro-Champ AA764 layout page (I-FD): pots, crop
  # (2820,1700)-(3450,2200); board, crop (3300,2450)-(4150,3150). Intensity:
  # left lug to chassis, wiper down to the 68k, right lug down to V1B's
  # cathode (the 1.5 kΩ). Speed: the 100k from its left lug to chassis, that
  # lug strapped to the wiper, the right lug down to the ladder's Speed node.
  # The pedal jack's tip is the ladder's pedal node.
  - { from: R27.lug2, to: R26.a, via: [[18.5, -0.55], [14.6, -0.55]] }                     # Intensity wiper -> 68k
  - { from: R27.lug1, to: [1.45, 15.3], via: [[18.2, -0.7], [15.3, -0.7]] }              # Intensity left lug -> chassis
  - { from: R27.lug3, to: R9.b, via: [[18.8, -0.45], [24.4, -0.45], [24.4, 1]] }       # Intensity right lug -> V1B cathode (K1B)
  - { from: R25.b, to: R24.lug1, via: [[22.602, -0.712]] }                                                            # 100k on the pot: left lug ...
  - { from: R25.a, to: [1.45, 22.2], via: [[21.2, -0.62], [22.2, -0.62]] }                 # ... -> chassis
  - { from: R24.lug1, to: R24.lug2, via: [[23.37, -0.74], [23.45, -0.91]] }                  # Speed: left lug strapped to the wiper
  - { from: R24.lug3, to: C15.a, via: [[23.8, -0.3], [16, -0.3]] }                     # Speed right lug -> Speed node
  - { from: J1.tip, to: R20.a, via: [[14.4, -0.18], [18, -0.18]] }                       # pedal tip -> pedal node
  - { from: C16.a, to: V4.pin1, via: [[16, 1.3], [17.8, 2.3]] }                      # ladder foot -> V4A plate (strapped to V4B grid)
  - { from: V4.pin1, to: V4.pin7 }                                                           # V4A plate tied to V4B grid at the socket, as the layout draws 1-7
  - { from: C17.b, to: V4.pin2, via: [[18, 1.3], [17.7, 2.35]] }                      # ladder top -> V4A grid
  - { from: R20.b, to: R23.a, via: [[20, -0.2], [21.4, -0.2]] }                        # cathode eyelet -> 4.7k
  - { from: R23.b, to: [1.45, 21.4] }
  - { from: R21.b, to: [1.45, 20] }                                                          # grid-leak / bypass ground eyelet
  - { from: V4.pin3, to: R23.a, via: [[18.4, 1.62], [20.7, 1.62], [20.7, 0]] }        # V4A cathode -> cathode eyelet
  - { from: V4.pin8, to: R26.b, via: [[14.6, 1.7]] }                                       # V4B cathode -> 68k
  - { from: J1.sleeve, to: [1.45, 12.6], via: [[12.6, -0.7]] }

  # === 6.3 V heaters — single-ended, one leg grounded (annotation layer) ====
  # The sheet grounds one green transformer lead and runs the other to the pilot
  # lamp and on to every heater in turn (V1, V2, then V4, the added oscillator
  # tube), so this is not a twisted pair: every socket gets a green feed and a
  # grounded return. V4 is a declared exclusion (net_map.excluded_tubes): its
  # signal pins are wired as the layout draws them, but no DC check reaches them.
  - { from: T1.green1, to: [1.45, -0.35], style: heater, via: [[-0.85, 0.577], [-0.85, 1.3]] }   # grounded 6.3 V leg
  - { from: T1.green2, to: PL1.a, style: heater, via: [[-1.65, 0.64], [-1.65, -0.55]] }
  - { from: PL1.b, to: [1.45, -0.45], style: heater, via: [[-2.05, -0.779], [-2.05, 0.05], [-0.55, 0.05]] }   # pilot lamp return → ground
  - { from: PL1.a, to: V2.pin2, style: heater, via: [[-1.3, -1.1], [10.2, -1.1], [10.2, 3.65], [13.6, 3.65]] }
  - { from: V2.pin2, to: V1.pin4, style: heater, via: [[13.45, 3.42], [47.95, 3.42]] }
  - { from: V1.pin4, to: V1.pin5, style: heater, via: [[48.3, 1.5]] }             # 12AX7 pins 4+5 strapped for 6.3 V
  - { from: V2.pin7, to: [1.45, 16.85], style: heater, via: [[15.207, 1.769], [16.85, 1.95]] }                      # 6V6 heater return → ground
  - { from: V1.pin9, to: [1.45, 49.9], style: heater, via: [[49.9, 1.52]] }                      # 12AX7 heater centre tap → ground
  - { from: V1.pin5, to: V4.pin4, style: heater, via: [[48.4, 3.65], [18.9, 3.27]] }   # daisy chain continues to V4
  - { from: V4.pin4, to: V4.pin5, style: heater, via: [[19.5, 1.5]] }             # 12AX7 pins 4+5 strapped for 6.3 V
  - { from: V4.pin9, to: [1.45, 21.1], style: heater, via: [[21.1, 2.32]] }                      # 12AX7 heater centre tap → ground

# net_map — the reviewable data layer that reconciles the drawn wiring with the
# DC-operating-point netlist (netlist.cir) for pipeline/verify_layout_nets.py.
# Every entry records a documented abstraction the netlist makes, so the
# equivalence check never has to guess in code. See docs/layout-schema.md.
# Identical to amps/aa764's anchors/series_bridge/netlist_unplaced (the audio
# path is the same circuit); adds excluded_tubes for V4, the tremolo
# oscillator this entry alone carries.
net_map:
  # Terminals the netlist gives no discrete node to reach on their own — anchored
  # to the netlist node they belong to. Two leads anchored to the SAME node
  # declare a DC bridge the netlist collapses (here: the output-transformer
  # primary, whose winding resistance the netlist omits, so the 6V6 plate node
  # IS B+1 — the gap the chart prints between them is that resistance).
  anchors:
    T2.blue: BP1     # OT primary, plate lead — netlist omits the primary DCR
    T2.red:  BP1     # OT primary, B+ lead
    SPK: "0"         # speaker jack — the netlist folds the OT-secondary DCR (~0 Ω)
                     #   into ground, so the feedback return (R11) reads as ground at DC
  # DC-transparent series parts the netlist omits (no DC grid current → zero
  # drop): their two leads are shorted so the netlist node runs through them.
  series_bridge:
    R1: "68 kΩ input grid stopper, jack 1 — omitted from netlist (grid == input node at DC)"
    R2: "68 kΩ input grid stopper, jack 2 — omitted from netlist (grid == input node at DC)"
  # Netlist elements with no discrete board part — reported in coverage, never a
  # failure (their nodes still have to check out).
  netlist_unplaced:
    RVOL: "1 MΩ volume pot VR1 — the netlist models the pot as V1B's grid-leak return (G1B → 0); its wiper→grid tie is verified at the grid net"
  # A tube socket the DC netlist legitimately omits — a tremolo/vibrato
  # oscillator is a running phase-shift oscillator with no static operating
  # point, so it cannot be a quiescent stage the equivalence check verifies
  # (see amps/ab763, whose netlist.cir excludes its own V5 for exactly this
  # reason). V4's heater pins are still validated onto heater pins by the
  # wiring above; no signal pin is DC-checked.
  excluded_tubes:
    V4: "12AX7 tremolo (both sections) — a phase-shift oscillator and a cathode follower into the Intensity control, with no static DC operating point (excluded from netlist.cir; see notes.md)"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-10-02).
  not_on_board:
    C11: "0.047 µF · 600 V line cap — the Vibro-Champ AA764 layout (I-FD, read at 6600 × 5100) draws it ('.047-600V') from the 1 A slo-blo fuse holder's lug to a chassis ground arrow, in the mains wiring and not on the eyelet board"
    R22: "470 kΩ V4A plate load — the layout letters '470K' inside the tremolo 12AX7's socket outline, soldered across the socket from pin 1 to pin 6 (the +340 V plate of the follower section): at the socket, not on the eyelet board"
