# Parts list — reference designators match schematic.kicad_sch (once drawn) and
# netlist.cir where a part is modelled. The drawing assigns no component
# designators; numbering is Circuit Codex's own, following the schematic left
# to right, top row (audio path) before bottom row (tremolo). vendor_url fields
# land with the Phase-1 BOM work.
notes: "The audio path (R1-R15, VR1-VR3, C1-C11, V1-V3, T1-T2) duplicates the plain Champ's AA764 drawing part-for-part — same values, same roles — because the Vibro Champ drawing is the plain Champ's circuit plus a tremolo oscillator ahead of the same output stage; only the printed rail voltages differ (see Sources). One channel across two input jacks (high/low), each with its own 68 kΩ stopper sharing the 1 MΩ leak. V1B's 1.5 kΩ cathode resistor does not go straight to ground: it lands on a 47 Ω leg that carries the 2.7 kΩ negative-feedback return from the speaker jack, and its 25 µF can bypasses only the 1.5 kΩ. Both transformer part numbers are printed on the drawing (TR1 125P1B, TR2 125A35A) — the same parts the Champ's sheet prints, though this sheet's own HT winding reads 315-0-315 V against the Champ's printed 320-0-320 V for the identical 125P1B — the Champ entry's parts list records the same transformer printing different figures across drawings. This list numbers them T1 and T2, the archive's convention where a drawing prints no designators of its own. — The tremolo oscillator (V4, both sections) is a dedicated bottle, not shared with an audio-path stage (contrast the 6G3, whose oscillator is the second half of its driver tube). Its parts are listed in full below, but its DC operating point is excluded from the simulated deck (see the circuit story): it is a running phase-shift oscillator with no static quiescent point. C16's exact value (the phase-shift feedback network's coupling capacitor, plate to Speed control) could not be read with full confidence at the available scan resolution; C15 is recorded with the value legible on both the schematic and layout sheets, and the network is described qualitatively in the circuit story rather than over-specified."
