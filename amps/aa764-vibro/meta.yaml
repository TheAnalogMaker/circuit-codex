sources:
  - desc: "Fender 'VIBRO-CHAMP AA764' drawing (I-FD), schematic + layout sheets: every component value AND the printed voltage chart read directly from the published sheet. The audio path duplicates amps/aa764 component-for-component — two 68 kΩ input stoppers on a 1 MΩ leak; 12AX7 stages (100 kΩ plate loads, 1.5 kΩ/25 µF cathodes); treble-bass tone stack (250 pF, 100 kΩ slope, 0.1 µF and 0.047 µF, 250 kΩ treble and bass pots, 15 kΩ to ground) ahead of a 1 MΩ volume; 47 Ω/2.7 kΩ negative-feedback divider under the second cathode; 0.02 µF coupling into a 6V6GT with a 220 kΩ grid leak and a 470 Ω · 1 W cathode (25 µF bypass); rails +355/+340/+320 on three 20 µF · 450 V cans split by 1 kΩ · 1 W and 10 kΩ · 1 W; 5Y3GT rectifier off a 315-0-315 V AC winding; transformers TR1 125P1B and TR2 125A35A, the same part numbers aa764 prints. What is added is a second, dedicated 12AX7 (both sections) forming a bias-vary tremolo oscillator ahead of the same output stage: a phase-shift stage (Vibrato Pedal jack with a normalling footswitch, two 1 MΩ grid-circuit resistors, a .01 µF coupling cap, 470 kΩ plate load off the B+3 rail to +170 V, 4.7 kΩ/25 µF cathode to +1.6 V) tuned by a 3 MΩ-RA Speed control (with a 100 kΩ fixed leg), feeding a second, cathode-follower-wired section (plate tied directly to the B+2 rail at +340 V, 68 kΩ cathode to +175 V) whose cathode drives a 25 kΩ-RA Intensity control that injects the oscillator's signal into the amp. Also printed: +342 V / +340 V at the 6V6 plate/screen pins and +2 V at its grid pin (pin 6) — the drawing prints no 6V6 cathode figure. Notice: values ±20%, read to ground with an electronic voltmeter, all resistors 1/2 W 10% and all capacitors at least 400 V unless marked. Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_vibro_champ_aa764.pdf"
  - desc: "Mojotone/Ampwares Fender field guide, 'Blackface Vibro Champ' — schematic designation AA764, production 1964-1967, cathode-biased 6V6GT/5Y3GT, single 8-inch Oxford 8EV speaker, front panel Input/Volume/Treble/Bass/Speed/Intensity. Cited here for the production window and panel-control names; the field guide's own '6 W' figure is a rounded marketing number and this entry keeps the 5 W the corpus already uses for the shared AA764 output stage (see amps/aa764 and history/families/champ.yaml)"
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-vibro-champ"
verification:
  status: draft   # Two reasons, stated rather than left implicit.
                  # (1) The tremolo oscillator V4 — the one thing that makes
                  # this circuit not the plain AA764 — is EXCLUDED from the
                  # netlist. A running phase-shift oscillator has no static
                  # quiescent point to gate, the same category of exclusion
                  # amps/ab763 makes for its own V5. Its four printed chart
                  # pins (+170/+1.6 first section, +340/+175 second) are read
                  # off the sheet and recorded, not modelled. Leaving it out
                  # also means the BP3 preamp rail carries less current here
                  # than the real circuit did; both audio-path plates it feeds
                  # still land inside the drawing's own ±20% (see notes.md).
                  # (2) Maintainer sign-off, which AGENTS.md rule 4 reserves to
                  # a human. Every gate runs and passes locally: six gated
                  # nodes, worst 13.7% on a ±20% convention, both layout styles
                  # and the social card rendered, and the drawn wiring proved
                  # electrically equivalent to netlist.cir.
