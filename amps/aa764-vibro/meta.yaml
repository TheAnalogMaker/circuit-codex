sources:
  - desc: "Fender 'VIBRO-CHAMP AA764' drawing (I-FD), schematic + layout sheets: every component value AND the printed voltage chart read directly from the published sheet. The audio path duplicates the plain Champ's AA764 drawing component-for-component — two 68 kΩ input stoppers on a 1 MΩ leak; 12AX7 stages (100 kΩ plate loads, 1.5 kΩ/25 µF cathodes); treble-bass tone stack (250 pF, 100 kΩ slope, 0.1 µF and 0.047 µF, 250 kΩ treble and bass pots, 15 kΩ to ground) ahead of a 1 MΩ volume; 47 Ω/2.7 kΩ negative-feedback divider under the second cathode; 0.02 µF coupling into a 6V6GT with a 220 kΩ grid leak and a 470 Ω · 1 W cathode (25 µF bypass); rails +355/+340/+320 on three 20 µF · 450 V cans split by 1 kΩ · 1 W and 10 kΩ · 1 W; 5Y3GT rectifier off a 315-0-315 V AC winding; transformers TR1 125P1B and TR2 125A35A, the same part numbers aa764 prints. What is added is a second, dedicated 12AX7 (both sections) for the tremolo: a phase-shift oscillator on pins 1-3 (470 kΩ plate load off the B+2 node to +170 V; ladder plate -> .02 -> a Speed node that a 3 MΩ-RA Speed control with a 100 kΩ fixed leg returns to ground -> .01 -> the pedal node, carrying the Vibrato Pedal jack and a 1 MΩ to the cathode -> .01 -> the grid, 1 MΩ to ground; 4.7 kΩ/25 µF cathode to +1.6 V), direct-coupled into a cathode follower on pins 6-8 (plate tied directly to the B+2 node at +340 V, cathode +175 V) whose cathode feeds a 25 kΩ-RA Intensity control's wiper through 68 kΩ; one end of that pot is grounded and the other goes straight to the second 12AX7 stage's cathode (+1.5 V), with no capacitor in the path. Also printed: +342 V / +340 V at the 6V6 plate/screen pins and +21 V at its cathode (pin 8); the grid carries no figure. Notice: values ±20%, read to ground with an electronic voltmeter, all resistors 1/2 W 10% and all capacitors at least 400 V unless marked. Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_vibro_champ_aa764.pdf"
  - desc: "Mojotone/Ampwares Fender field guide, 'Blackface Vibro Champ' — schematic designation AA764, production 1964-1967, cathode-biased 6V6GT/5Y3GT, single 8-inch Oxford 8EV speaker, front panel Input/Volume/Treble/Bass/Speed/Intensity. Cited here for the production window and panel-control names; the field guide's own '6 W' figure is a rounded marketing number and this entry keeps the 5 W the corpus already uses for the shared AA764 output stage (see the AA764 Champ entry and the Champ family history)"
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-vibro-champ"
verification:
  status: draft   # Two reasons, stated rather than left implicit.
                  # (1) The tremolo oscillator V4 — the one thing that makes
                  # this circuit not the plain AA764 — is EXCLUDED from the
                  # netlist. A running phase-shift oscillator has no static
                  # quiescent point to gate, the same category of exclusion
                  # amps/ab763 makes for its own V5. Its four printed chart
                  # pins (+170/+1.6 first section, +340/+175 second) are read
                  # off the sheet and recorded, not modelled. Its follower
                  # also drives V1B's cathode through the Intensity control,
                  # DC-coupled, by an amount the unstated control setting
                  # decides, so V1B's printed +1.5/+200 V are reported for
                  # reference rather than gated (see notes.md).
                  # (2) Maintainer sign-off, which AGENTS.md rule 4 reserves to
                  # a human. Every gate runs and passes locally: five gated
                  # nodes, worst 5.9% on a ±20% convention, both layout styles
                  # and the social card rendered, and the drawn wiring proved
                  # electrically equivalent to netlist.cir.
