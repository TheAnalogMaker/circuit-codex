sources:
  - desc: "Fender, \"VIBRO-CHAMP AA764\" schematic and layout sheets (drawing code I-FD). Supplies every component value, the printed voltage chart, the 315-0-315 V AC power winding and the transformer part numbers (TR1 125P1B, TR2 125A35A, the same numbers the Champ AA764 prints). The audio path matches the Champ AA764 drawing component for component; what it adds is a second 12AX7, both halves, for the tremolo. The 6V6's plate, screen and cathode carry printed voltages (+342 V, +340 V, +21 V), but its grid carries none. The sheet's notice: values ±20%, read to ground with an electronic voltmeter, all resistors ½ W 10% and all capacitors at least 400 V unless marked. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_vibro_champ_aa764.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Blackface Vibro Champ\". Supplies the schematic designation (AA764), production from 1964 to 1967, the cathode-biased 6V6GT and 5Y3GT, the single 8-inch Oxford 8EV speaker, and the front-panel controls (Input, Volume, Treble, Bass, Speed, Intensity). Cited here for the production window and control names. The guide's \"6 W\" is a rounded marketing figure; this page keeps the 5 W used for the shared AA764 output stage (see the AA764 Champ page and the Champ family history)."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-vibro-champ"
verification:
  status: draft   # Two reasons, stated rather than left implicit.
                  # (1) The tremolo oscillator V4 — the one thing that makes
                  # this circuit not the plain AA764 — is EXCLUDED from the
                  # netlist. A running phase-shift oscillator has no static
                  # quiescent point to gate, the same category of exclusion
                  # amps/ab763 makes for its own V5. Its four printed chart
                  # pins (+170/+1.6 first section, +340/+175 second) are read
                  # off the sheet and recorded, not modelled. Its follower
                  # also drives V1B's cathode through the Intensity control,
                  # DC-coupled, by an amount the unstated control setting
                  # decides, so V1B's printed +1.5/+200 V are reported for
                  # reference rather than gated (see notes.md).
                  # (2) Maintainer sign-off, which AGENTS.md rule 4 reserves to
                  # a human. Every gate runs and passes locally: five gated
                  # nodes, worst 5.9% on a ±20% convention, both layout styles
                  # and the social card rendered, and the drawn wiring proved
                  # electrically equivalent to netlist.cir.
added: 2026-08-30
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V4: "excluded — the vibrato bottle: a running RC phase-shift oscillator (V4A) and the cathode-follower buffer into Intensity (V4B); neither has a static operating point"
