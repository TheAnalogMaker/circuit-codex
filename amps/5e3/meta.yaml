# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5e3"
name_style: "Tweed Deluxe-style"
family: tweed
era:
  start: 1955
  end: 1960
wattage: 15   # Ampwares/Mojotone field guide, narrow-panel Tweed Deluxe
              # (the wide-panel 5D3 that precedes it is the 12 W entry)
