    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_5e3.pdf"
  - desc: "Rob Robinette, \"How the 5E3 Deluxe Works\". Supplies published DC measurements, used to check this circuit in place of a factory voltage chart: B+ 370/295/250 V, stage drops of 110, 83 and 47 V, and 19 V at the 6V6 cathode."
    url: "https://robrobinette.com/How_The_5E3_Deluxe_Works.htm"
  - desc: "Fender, \"Deluxe\" 5E3 layout drawing (drawing code F-EE), page 1. Supplies the order of parts on the eyelet board for the board-layout drawing on this page. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_5e3.pdf"
