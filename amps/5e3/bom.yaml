# Parts list — reference designators match schematic.kicad_sch exactly.
notes: "Each channel has two input jacks, each through its own 68 kΩ into the grid, with the channel's 1 MΩ leak from jack 1's tip to ground, as F-EE draws it on both pages; the jacks themselves and their normalling contacts are not listed. Dropper wattages are not marked on the drawing."
