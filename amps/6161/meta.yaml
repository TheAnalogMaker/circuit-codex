sources:
  - desc: "Valco, factory drawing titled \"Valco Model 6161\", with the title set vertically along the sheet's left edge. This is the revision documented here. Supplies the tube complement (three 12AX7 for the two channels, the paraphase phase inverter, and the tremolo oscillator with its cathode-follower output; two 6973; a 5Y3-GT), the component values, and the part numbers of the power transformer (E-3693A), the output transformer (340-6) and the two 10-inch speakers (550-3). The drawing prints no voltages of any kind. Not reproduced here; archived in EL34World's Valco schematic library."
    url: "https://el34world.com/charts/Schematics/files/Valco/Valco_6161.pdf"
  - desc: "ClassicTubeAmps.com, redrawn schematic captioned \"Supro 1624T\" and signed \"Drawn by Ryan@ClassicTubeAmps.com\", archived at EL34World. The cross-reference for legibility and a second, corroborating reading. The 1624T is the Supro-badged sibling of this chassis. The two drawings agree part for part on the supply chain (20 µF, 1 kΩ 1 W, 10 µF, 15 kΩ, 10 µF), the shared 250 Ω output cathode resistor and its 35 µF bypass, the 270 kΩ/12 kΩ paraphase divider with the 470 kΩ leak on the other output grid, and the inverter cathodes (2.2 kΩ bypassed, 3.9 kΩ unbypassed). Where the redraw's lettering is ambiguous, this page records the factory value: the redraw prints the output cathode resistor as \"250K 7W\", the Valco drawing plainly gives 250 Ω, and a published measurement (below) confirms it with 24 V across it."
    url: "https://el34world.com/charts/Schematics/files/Supro/Supro_1624t_schematic_263.pdf"
  - desc: "The Amp Garage, measurements on a 1965 Supro 1624T posted by Stevem (17 August 2022). The only voltage reference for this page, since the drawing prints none. Reported: HT secondary 336 V AC per leg unloaded and 323 V loaded at idle; \"6973 plate=369\", \"6973 screen=350\", \"6973 grid resistor =250 ohm, idle voltage 24\"; preamp readings by socket of 212 V/2.36 V and 118 V/0.980 V on one tube, 132 V/1.12 V and 173 V/1.6 V on another, and 286 V/2.4 V and 219 V/0.680 V on the third; and 16 W RMS into 8 Ω at clipping, 19.6 W peak. Used as measurements, not as a factory chart; see the operating-point table."
    url: "https://ampgarage.com/forum/viewtopic.php?t=35643"
  - desc: "Cream City Music, dealer listing for a 1960 Gretsch 6161 Electromatic Twin. The earliest dated example this page can cite for the drawing's tube complement: \"5Y3, 6973 (2), 12AX7 (3)\", rated \"14 Watts\", with controls \"Volume, Tremolo, Tone\", and a note that ClassicTone was \"the original OEM transformer manufacturer for Valco/Gretsch in the 50s and 60s\". The Gretsch-badged 6161 is this Valco chassis; the 14 W figure is the period rating recorded here as the amp's output."
    url: "https://www.creamcitymusic.com/vintage-gretsch-6161-electromatic-twin-14w-1x12-tube-combo-amp-1960/"
  - desc: "Steel Guitar Forum, service thread on a 1957 Gretsch 6161. Shows that the 6161 model number covers more than one circuit, and names the inverter independently. That amp is described as \"2 6V6's on the output, 2 6SQ7 triodes (preamp and tremolo) and a 12AX7\" phase inverter, with \"later versions\" using 6973 output tubes. The poster calls the inverter \"paraphase\", which matches the drawing documented here. Its 6V6 pair sits on a 330 Ω cathode resistor dropping 21 V at idle: the same single shared bias resistor at a different value."
    url: "https://bb.steelguitarforum.com/viewtopic.php?t=354380"
  - desc: "Wikipedia, \"Valco\". The maker history behind this page's era range and the Supro/Valco line history. Valco was founded in 1940 by Victor Smith, Al Frost and Louis Dopyera, formerly of the National Dobro Company; the name combines their initials with an abbreviation for company. It built instruments and amplifiers under the Supro, Airline, National and Oahu names and also \"produced amplifiers under contract for Gretsch, Harmony, and Kay\". In 1967 it merged with the Kay Musical Instrument Company, and the merged company folded the following year."
    url: "https://en.wikipedia.org/wiki/Valco"
  - desc: "RCA, 6973 data sheet (dated 10-60), \"Beam Power Tube\" (9-pin miniature). The anchor for the site's open (CC0) 6973 tube model, and the ratings that shape this output stage: Va = 250 V, Vg2 = 250 V and Vg1 = −15 V give Ia = 46 mA, Ig2 = 3.5 mA and gm = 4800 µmho. Design maximums are 12 W plate dissipation, 2 W screen dissipation and 330 V on the screen, with a separate 410 V limit that applies only when the screens are tapped on the output-transformer primary, which this circuit does not do. See the 6973 tube page and the site's tube-model method."
    url: "https://frank.pocnet.net/sheets/049/6/6973.pdf"
verification:
  status: draft   # Two reasons, both stated rather than tuned away.
                  # (1) The drawing prints NO voltages — no chart, not even
                  # annotated working voltages — so there is no factory
                  # reference to verify against at all. The figures used are
                  # measurements published on a surviving sibling amplifier,
                  # cited as such, and only the two nodes that are unambiguous
                  # in somebody else's socket numbering are compared.
                  # (2) The tremolo oscillator is excluded and its plate load
                  # taps a DERIVED node, so the B1 rail and everything under it
                  # reads a few volts high by construction (see voltages.yaml).
                  # Both gated nodes land inside ±20 % — but verified is earned
                  # whole, and against a chart this drawing does not carry.
# Day the circuit landed in the corpus (git history, amps/6161/) — the feed's
# pubDate for a draft; production builds are shallow clones and cannot ask git.
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V3A: "excluded — the tremolo's phase-shift oscillator: a running oscillator shifted by grid-leak detection has no static operating point; its missing plate current reads B1 and every node below it a few volts high, so those nodes are informational"
