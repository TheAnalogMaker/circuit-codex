# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6161"
name_style: "Valco 6161-style"
family: other
era:
  # The drawing is UNDATED — no date, no revision box, no drawing number beyond
  # the model in the title block. 1960 is the earliest year this entry can cite
  # for an example carrying THIS complement (3×12AX7 / 2×6973 / 5Y3-GT); 1968 is
  # the year Valco folded, so it is the latest year the circuit could have been
  # built. The bracket is an outer bound, not a production record, and the
  # 6161 model number outlived more than one circuit inside it (see notes.md).
  start: 1960
  end: 1968
wattage: 14
