  - { ref: RK1, part: "Carbon comp resistor", value: "2.2 kΩ · ½ W", role: "Channel 1 cathode bias — UNBYPASSED, no can on this channel" }
  - { ref: CV1, part: "Coupling capacitor", value: "0.005 µF", role: "Channel 1 plate → volume coupler" }
  # --- V1B, channel 2 (the tremolo-modulated one) ---
