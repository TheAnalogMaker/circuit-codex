  - { ref: CF3, part: "Electrolytic capacitor", value: "10 µF · 450 V", role: "B1 rail smoothing" }
  - { ref: "—", part: "Speaker", value: "10 in · 550-3 (×2)", role: "Two 10-inch speakers (annotation only)" }
