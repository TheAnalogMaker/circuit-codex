# Parts list for the Valco 6161, read from the factory drawing whose title block
# reads "Valco Model 6161".
#
# Designators are FUNCTIONAL — the corpus's own. The drawing numbers its BOTTLES
# V1 to V6 and those numbers ARE carried over; it prints no reference designators
# for any passive part, so there are none to reuse and none are invented.
#
# A designator here means the SCHEMATIC draws that part: schematic.kicad_sch and
# this list are cross-checked both ways by pipeline/validate.py, so neither can
# carry a part the other does not. What the DC netlist asserts is a narrower set,
# stated in netlist.cir's own SCOPE block — the tremolo oscillator's operating
# point and the abstracted control networks are drawn here but not simulated.
# Parts the drawing resolves as values whose wiring this entry does not draw at
# all — the mains side beyond the transformer, the jacks, the speakers — carry
# ref "—" (annotation only), the same convention the tweed, Marshall and Vox
# entries use.
notes: "Capacitor values are open at DC and do not enter the operating-point netlist; they are listed for completeness, and the ones whose BOTH leads land on a named DC node are modelled anyway so the push-pull phase and the decoupling placement are fixed in the data. Wattages are the drawing's where it prints them (1000-1W, 250-7W) and the era's implied ½ W elsewhere; the drawing marks no tolerances. The output cathode resistor is the part to get right: a published redraw of the Supro-badged sibling letters it '250K 7W', the factory drawing gives it as 250, and a published measurement reads 24 V across it at idle — 250 Ω is the value, and 250 kΩ would bias the pair off."
items:
  # --- bottles ---
  - { ref: V1, part: "Tube", value: "12AX7", role: "Both preamp channels, one triode each" }
  - { ref: V2, part: "Tube", value: "12AX7", role: "Paraphase phase inverter, both triodes" }
  - { ref: V3, part: "Tube", value: "12AX7", role: "Tremolo — phase-shift oscillator (V3A, excluded from the netlist) and cathode-follower output (V3B)" }
  - { ref: V4, part: "Tube", value: "6973", role: "Output beam power tube" }
  - { ref: V5, part: "Tube", value: "6973", role: "Output beam power tube" }
  - { ref: V6, part: "Rectifier tube", value: "5Y3GT", role: "Full-wave rectifier" }
  # --- iron ---
  - { ref: T1, part: "Power transformer", value: "Valco E-3693A", role: "Mains transformer — centre-tapped HT winding (grounded), 5 V rectifier winding, 6.3 V heater winding. The drawing prints the part number and no winding voltages" }
  - { ref: T2, part: "Output transformer", value: "Valco 340-6", role: "Output transformer, centre-tapped primary; the centre tap is the reservoir node" }
  # --- inputs, both channels ---
  - { ref: "—", part: "Jack socket", value: "1/4 in", role: "Channel 1 input, panel-marked Treble" }
  - { ref: "—", part: "Jack socket", value: "1/4 in", role: "Channel 1 input, panel-marked Bass" }
  - { ref: "—", part: "Jack socket", value: "1/4 in", role: "Channel 2 input, panel-marked Treble" }
  - { ref: "—", part: "Jack socket", value: "1/4 in", role: "Channel 2 input, panel-marked Bass" }
  - { ref: CIN1, part: "Coupling capacitor", value: "0.005 µF", role: "Channel 1 Treble-jack input coupler — mounts at the jacks" }
  - { ref: CIN2, part: "Coupling capacitor", value: "0.005 µF", role: "Channel 2 Treble-jack input coupler — mounts at the jacks" }
  - { ref: RMX1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel 1 Bass-jack mixing resistor — mounts at the jacks" }
  - { ref: RMX2, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel 2 Bass-jack mixing resistor — mounts at the jacks" }
