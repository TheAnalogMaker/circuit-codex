  - { ref: RL2, part: "Carbon comp resistor", value: "270 kΩ · ½ W", role: "Channel 2 plate load" }
  - { ref: RGS1, part: "Carbon comp resistor", value: "2.2 kΩ · ½ W", role: "Channel 2 grid stopper" }
  - { ref: RG2, part: "Carbon comp resistor", value: "470 kΩ · ½ W", role: "Channel 2 grid leak" }
