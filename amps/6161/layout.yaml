# Board layout — DERIVED, not read from a factory layout drawing.
#
# Valco published no board-layout drawing for this chassis and none was located:
# what the factory issued is the circuit drawing whose title block reads "Valco
# Model 6161", cited below and in meta.yaml. The arrangement here is therefore
# the Circuit Codex's own — this circuit's parts laid out in signal order along
# the chassis on the house two-row eyelet grid, ordered to match the valve row
# beneath it (5Y3-GT · 6973 · 6973 · 12AX7 inverter · 12AX7 tremolo · 12AX7
# preamp). It is a builder's diagram of THIS circuit, not a record of how Valco
# dressed its own chassis, which was wired on terminal strips. The caption says
# so and `board.title` carries "(derived)".
#
# Part refs are the shared key into bom.yaml; the renderer reads each value and
# part type from there, so the layout and the parts list cannot disagree.
#
# Machine-checked equivalence: the point-to-point wiring below has been verified
# electrically equivalent to netlist.cir by pipeline/verify_layout_nets.py — see
# the net_map block at the foot of this file and docs/layout-schema.md. Heaters,
# the pilot lamp and the PT / rectifier AC side are an excluded annotation layer
# (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 122
  title: "6161 · board layout (derived)"
caption: "A derived layout: Valco published no board-layout drawing for this chassis, so the arrangement below is the Circuit Codex's own — this circuit's parts laid out in signal order along the chassis and drawn on the house eyelet grid, not a record of the factory's terminal-strip construction. Every value comes from the parts list, which is read from the drawing whose title block reads \"Valco Model 6161\". Parts drawn off the board: the two 500 pF bright caps mount across the volume controls, the input couplers and the Bass-jack mixing resistors at the input jacks, and the tremolo on/off switch and the footswitch jack on the chassis. The pilot is a neon on the MAINS side of the power transformer, not a 6.3 V bulb on the heater chain, so it is drawn as the panel item it is and carries no lead here: one side goes to the primary's cold end and the other to the line-reverse switch, and that whole side of the circuit is outside this drawing's scope. The 6.3 V heater chain (twisted pair, transformer → the two 6973s → the inverter → the tremolo valve → the preamp valve) is likewise derived: with no layout sheet its daisy order is the physical socket order and the twisted-pair green is the house heater idiom, not a sourced wire colour — as is every other lead here, which is why all hookup and transformer leads are drawn in the neutral tone and the transformer pigtails are lettered by function. The 5Y3-GT is directly heated and takes the 5 V winding, off that chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Valco factory drawing, title block \"Valco Model 6161\" — layout DERIVED from that circuit drawing; Valco published no board-layout sheet for this chassis and none was located"
  url: "https://el34world.com/charts/Schematics/files/Valco/Valco_6161.pdf"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; shared column across rows = vertical leg).
# Two leads in one eyelet are one solder point — used deliberately below, e.g.
# the supply chain's droppers and cans meeting at their shared rail eyelets.
parts:
  # --- power supply: reservoir -> 1 kΩ -> screen node -> 15 kΩ -> B1 --------
  - { ref: CF1, a: [0, 1],  b: [1, 1] }     # 20 µF reservoir (BP1)
  - { ref: RD1, a: [0, 1],  b: [0, 4] }     # 1 kΩ · 1 W, BP1 -> screen node
  - { ref: CF2, a: [0, 4],  b: [1, 4] }     # 10 µF screen-node can (BP2)
  - { ref: RD2, a: [0, 4],  b: [0, 7] }     # 15 kΩ, BP2 -> B1
  - { ref: CF3, a: [0, 7],  b: [1, 7] }     # 10 µF B1 can
  # --- output stage: the shared cathode resistor, grid leaks, couplers ------
  - { ref: RKO, a: [0, 11], b: [1, 11] }    # 250 Ω · 7 W — the pair's ENTIRE bias
  - { ref: CKO, a: [0, 13], b: [1, 13] }    # 35 µF across it
  - { ref: RL4, a: [0, 16], b: [0, 18] }    # 270 kΩ inverted-side plate load (B1 -> PPIB)
  - { ref: CC2, a: [0, 18], b: [0, 20] }    # 0.01 µF PPIB -> V4 grid
  - { ref: RGL2, a: [0, 20], b: [1, 20] }   # 470 kΩ V4 grid leak
  - { ref: RL3, a: [0, 23], b: [0, 25] }    # 270 kΩ driver plate load (B1 -> PPIA)
  - { ref: CC1, a: [0, 25], b: [0, 27] }    # 0.01 µF PPIA -> V5 grid
  - { ref: RPA, a: [0, 27], b: [1, 27] }    # 270 kΩ paraphase divider, upper leg
  - { ref: RPB, a: [1, 27], b: [1, 29] }    # 12 kΩ divider foot -> ground
  # --- paraphase inverter cathodes and the driver grid leak ----------------
  - { ref: RK3, a: [0, 31], b: [1, 31] }    # 2.2 kΩ driver cathode
  - { ref: CK3, a: [0, 33], b: [1, 33] }    # 0.05 µF driver cathode bypass
  - { ref: RK4, a: [0, 35], b: [1, 35] }    # 3.9 kΩ inverted-side cathode, UNBYPASSED
  - { ref: RG3, a: [0, 37], b: [1, 37] }    # 1 MΩ driver grid leak
  # --- tremolo oscillator (V3A) and its Speed control ----------------------
  - { ref: RTO1, a: [0, 40], b: [0, 42] }   # 270 kΩ oscillator plate load (taps B1)
  - { ref: CTO1, a: [0, 42], b: [0, 44] }   # 0.03 µF phase-shift, plate end
  - { ref: RSPD, a: [0, 44], b: [0, 46] }   # 100 kΩ Speed end resistor
  - { ref: CTO2, a: [0, 48], b: [0, 50] }   # 0.02 µF phase-shift, middle
  - { ref: RTOR1, a: [0, 50], b: [1, 50] }  # 1 MΩ ladder return
  - { ref: CTO3, a: [0, 50], b: [0, 52] }   # 0.01 µF phase-shift, grid end
  - { ref: RTOR2, a: [0, 52], b: [1, 52] }  # 1.5 MΩ ladder return
  - { ref: RTOG, a: [0, 52], b: [0, 54] }   # 2.2 kΩ oscillator grid stopper
  - { ref: RTOK, a: [0, 56], b: [1, 56] }   # 1 kΩ oscillator cathode
  - { ref: CTOUT, a: [0, 58], b: [0, 60] }  # 0.01 µF oscillator output coupler
  - { ref: RTOUT, a: [0, 60], b: [0, 62] }  # 1 MΩ series ahead of the footswitch
  # --- Intensity network and the tremolo follower's grid -------------------
  - { ref: RTI1, a: [0, 65], b: [0, 67] }   # 1 MΩ, first leg after the footswitch
  - { ref: CTI1, a: [0, 67], b: [1, 67] }   # 0.05 µF shunt
  - { ref: RTI2, a: [0, 67], b: [0, 69] }   # 1.5 MΩ, second leg
  - { ref: RTI, a: [0, 69], b: [1, 69] }    # 270 kΩ follower grid return
  - { ref: CTI2, a: [0, 71], b: [1, 71] }   # 0.05 µF across it
  - { ref: RGS2, a: [0, 71], b: [0, 73] }   # 2.2 kΩ follower grid stopper
  # --- summing node and the amplifier's only tone control ------------------
  - { ref: CPI, a: [0, 76], b: [0, 78] }    # 300 pF mixer -> inverter driver grid
  - { ref: CT1, a: [0, 78], b: [1, 78] }    # 500 pF fixed treble shunt
  - { ref: CT2, a: [0, 78], b: [0, 80] }    # 0.005 µF into the Tone control
  - { ref: RM1, a: [0, 82], b: [0, 84] }    # 270 kΩ channel 1 mixing resistor
  - { ref: RM2, a: [0, 86], b: [0, 88] }    # 270 kΩ channel 2 mixing resistor
  # --- channel 1 (V1A — the drawing's pins 1/2/3) --------------------------
  - { ref: RD3, a: [0, 90], b: [0, 92] }    # 100 kΩ supply dropper, B1 -> BC1
  - { ref: CF4, a: [0, 92], b: [1, 92] }    # 0.05 µF channel-1 decoupling
  - { ref: RL1, a: [0, 92], b: [0, 94] }    # 270 kΩ channel 1 plate load
  - { ref: CV1, a: [0, 94], b: [0, 96] }    # 0.005 µF plate -> volume
  - { ref: RK1, a: [0, 98], b: [1, 98] }    # 2.2 kΩ cathode, UNBYPASSED
  - { ref: RG1, a: [0, 100], b: [1, 100] }  # 470 kΩ channel 1 grid leak
  # --- channel 2 (V1B — the tremolo-modulated channel) ---------------------
  - { ref: RD4, a: [0, 104], b: [0, 106] }  # 100 kΩ supply dropper, B1 -> BC2
  - { ref: CF5, a: [0, 106], b: [1, 106] }  # 0.05 µF channel-2 decoupling
  - { ref: RL2, a: [0, 106], b: [0, 108] }  # 270 kΩ channel 2 plate load
  - { ref: CP2, a: [0, 108], b: [1, 108] }  # 500 pF plate-to-ground cut
  - { ref: CI1, a: [0, 108], b: [0, 110] }  # 0.005 µF interstage coupler, first
  - { ref: RI1, a: [0, 110], b: [1, 110] }  # 270 kΩ interstage shunt
  - { ref: CI2, a: [0, 110], b: [0, 112] }  # 0.005 µF interstage coupler, second
  - { ref: RK2, a: [0, 114], b: [1, 114] }  # 1.5 kΩ cathode — SHARED with the follower
  - { ref: CK2, a: [0, 116], b: [1, 116] }  # 35 µF cathode bypass
  - { ref: RG2, a: [0, 118], b: [1, 118] }  # 470 kΩ channel 2 grid leak
  - { ref: RGS1, a: [0, 118], b: [0, 120] } # 2.2 kΩ channel 2 grid stopper

