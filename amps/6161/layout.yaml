  - { from: SW1.b, to: JFT.tip, via: [[61.3, -1.25], [64.3, -1.25]] }
  - { from: JFT.tip, to: RTI1.a, via: [[65.6, -0.32]] }
  - { from: JFT.sleeve, to: [1.45, 64.2], via: [[64.2, -0.55]] }

  # === Intensity network -> the tremolo follower (V3B, pins 1/2/3) =========
  - { from: CTI1.b, to: [1.45, 67] }
  - { from: RTI.a, to: CTI2.a, via: [[69.5, -0.52], [70.5, -0.52]] }
  - { from: RTI.b, to: [1.45, 69] }
  - { from: CTI2.b, to: [1.45, 71] }
  - { from: RGS2.b, to: V3.pin2, via: [[73.8, 1.15], [64.0, 1.15], [64.0, 3.20], [55.8, 3.20]] }
  # the tremolo itself: the follower's cathode lands on channel 2's cathode node
  - { from: V3.pin3, to: RK2.a, via: [[54.4, 2.98], [54.4, 3.80], [115.4, 3.80], [115.4, 1.92]] }

  # === summing node, tone control, volume controls =========================
  - { from: CPI.a, to: RG3.a, via: [[75.5, -1.68], [36.5, -1.68]] }
  - { from: CT1.b, to: [1.45, 78] }
  - { from: CT2.b, to: VR3.lug1, via: [[80.5, -0.32]] }
