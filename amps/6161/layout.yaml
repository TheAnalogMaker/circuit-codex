  - { from: V2.pin5, to: V3.pin4, style: twisted, via: [[34.0, 4.20], [57.4, 4.20]] }
  - { from: V3.pin5, to: V1.pin4, style: twisted, via: [[59.0, 4.20], [100.4, 4.20]] }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # No excluded_tubes block belongs here, and the reason is worth stating: this
  # circuit's tremolo oscillator is not a socket of its own. It is the FIRST half
  # of V3, whose SECOND half — the cathode follower — is modelled in netlist.cir
  # (it is DC-coupled to channel 2's cathode and cannot be left out), so V3
  # anchors normally through that half, exactly as the 6G3's V2 and the AA1164's
  # V4 do. The oscillator half's own network is drawn on the board and is
  # reported terminal by terminal in the unchecked-terminal enumeration rather
  # than hidden behind a socket-level exclusion. The only declared-excluded
  # bottle is V6, the rectifier, which the checker excludes by rule.
  anchors:
    # The netlist omits output-transformer primary DCR, so both 6973 plate leads
    # and the primary centre tap collapse onto the reservoir node BP1 — which is
    # what makes the centre tap and the plate node one node in netlist.cir.
    T2.ct: BP1        # OT primary centre tap -> reservoir
    T2.pa: BP1     # OT primary, V4 plate lead (winding DCR omitted)
    T2.pb: BP1     # OT primary, V5 plate lead (winding DCR omitted)
