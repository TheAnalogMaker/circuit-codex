  - { from: VR2.lug1, to: [1.45, 87.4], via: [[87.4, -0.55]] }

  # === channel 1 ===========================================================
  - { from: CF4.b, to: [1.45, 92] }
  - { from: CV1.b, to: VR1.lug3, via: [[96.3, -1.68], [84.6, -1.68]] }
