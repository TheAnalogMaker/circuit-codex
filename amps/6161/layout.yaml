  - { from: RM2.a, to: CT1.a, via: [[85.5, -1.25], [77.3, -1.25]] }
  - { from: RM1.b, to: VR1.lug2, via: [[84.4, -0.32]] }
  - { from: RM2.b, to: VR2.lug2, via: [[88.4, -0.32]] }
