  - { from: JC2B.tip, to: RG2.a, via: [[116.6, -0.72], [118.5, -0.72]] }
  - { from: JC2T.sleeve, to: [1.45, 112.4], via: [[112.4, -0.55]] }
  - { from: JC2B.sleeve, to: [1.45, 118.4], via: [[118.4, -0.55]] }

  # === 6.3 V heater chain (twisted pair) ==================================
  # Derived, like the rest of this drawing: with no layout sheet the daisy order
  # is the physical socket order. The 5Y3-GT is directly heated and takes the
  # 5 V winding (drawn above), so it is off this chain; the pilot is a neon on
  # the mains side, so it is off it too. Twisted runs land only on heater pins
