# Ground bus — the bare rail just below the bottom eyelet row; filter, cathode,
# grid-leak, pot and jack grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 121.5] }

runs:
  # === power transformer -> 5Y3-GT -> the reservoir ========================
  # Each pigtail leaves along its own row and drops in its own vertical lane, so
  # no two transformer leads read as one. Every lead is lettered by function: with
  # no factory layout sheet this drawing asserts no wire colours.
  - { from: T1.ha, to: V6.pin4, via: [[-1.55, 0.274], [-1.55, 2.42], [3.0, 2.42]] }
  - { from: T1.hb, to: V6.pin6, via: [[-1.35, 0.337], [-1.35, 2.95], [5.4, 2.95]] }
  - { from: T1.ct, to: [1.45, -0.25], via: [[-1.15, 0.400], [-1.15, 1.22], [-0.25, 1.22]] }
  - { from: T1.ra, to: V6.pin8, via: [[-0.95, 0.463], [-0.95, 3.25], [4.7, 3.25]] }
  - { from: T1.rb, to: V6.pin2, via: [[-0.75, 0.526], [-0.75, 3.58], [3.3, 3.58]] }
  - { from: V6.pin8, to: CF1.a, via: [[4.6, 2.12], [1.8, 1.85]] }

  # === BP1: reservoir, output-transformer centre tap =======================
  - { from: CF1.a, to: T2.ct, via: [[0.35, 1.35], [0.35, 2.80], [24.89, 2.80]] }

  # === BP2: the 6973 screens, on their own supply node =====================
  - { from: CF2.a, to: V4.pin1, via: [[4.7, -1.25], [10.2, -1.25], [10.2, 2.38]] }
  - { from: V4.pin1, to: V5.pin1, via: [[12.95, 2.62], [19.5, 2.62]] }
  # grid No.2 and grid No.1 each come out on TWO pins on a 6973 (1/8 and 3/6);
  # the drawing wires both lugs, as a builder does at the socket.
  - { from: V4.pin1, to: V4.pin8, via: [[12.25, 2.38], [13.85, 2.38]] }
  - { from: V5.pin1, to: V5.pin8, via: [[19.25, 2.38], [20.85, 2.38]] }
  - { from: V4.pin3, to: V4.pin6, via: [[11.9, 1.50], [13.9, 1.50]] }
  - { from: V5.pin3, to: V5.pin6, via: [[18.7, 1.50], [20.9, 1.50]] }

  # === B1: the preamp and inverter rail, tapped along the board ============
  - { from: CF3.a, to: RL4.a, via: [[7.5, -1.42], [15.5, -1.42]] }
  - { from: RL4.a, to: RL3.a, via: [[16.5, -1.42], [22.5, -1.42]] }
  - { from: RL3.a, to: RTO1.a, via: [[23.5, -1.42], [39.5, -1.42]] }
  - { from: RTO1.a, to: RD3.a, via: [[40.5, -1.42], [89.5, -1.42]] }
  - { from: RD3.a, to: RD4.a, via: [[90.5, -1.42], [103.5, -1.42]] }
  - { from: RTO1.a, to: V3.pin1, via: [[39.6, 1.35], [39.6, 3.52], [55.0, 3.52], [55.0, 2.72]] }

  # === output stage: grids, cathodes, screens, plates ======================
  - { from: RGL2.a, to: V4.pin3, via: [[20.8, 1.15], [12.7, 1.15]] }
  - { from: RPA.a, to: V5.pin3, via: [[26.4, 1.32], [19.2, 1.32]] }
  - { from: V4.pin7, to: RKO.a, via: [[14.9, 2.28]] }
  - { from: V5.pin7, to: CKO.a, via: [[23.0, 1.72], [14.6, 1.72]] }
  - { from: RKO.a, to: CKO.a, via: [[11.5, -0.52], [12.5, -0.52]] }
  - { from: CF1.b, to: [1.45, 1] }
  - { from: CF2.b, to: [1.45, 4] }
  - { from: CF3.b, to: [1.45, 7] }
  - { from: RKO.b, to: [1.45, 11] }
  - { from: CKO.b, to: [1.45, 13] }
  - { from: RGL2.b, to: [1.45, 20] }
  - { from: RPB.b, to: [1.45, 29] }
  - { from: V4.pin9, to: T2.pa, via: [[12.4, 3.05], [25.19, 3.05]] }
  - { from: V5.pin9, to: T2.pb, via: [[19.6, 3.32], [25.5, 3.32]] }
  - { from: T2.sa, to: SPK.tip, via: [[25.81, 2.05], [30.1, 2.05]] }
  - { from: T2.sb, to: SPK.sleeve, via: [[26.11, 2.36], [30.9, 2.36]] }
  - { from: SPK.sleeve, to: [1.45, 32.0], via: [[32.0, 2.15]] }

  # === paraphase inverter =================================================
  - { from: RL3.b, to: V2.pin1, via: [[25.6, 1.15], [29.4, 2.30]] }
  - { from: RL4.b, to: V2.pin6, via: [[18.5, -0.90], [34.8, -0.90], [34.8, 1.90]] }
  - { from: RPB.a, to: V2.pin7, via: [[27.8, 1.32], [33.4, 1.32]] }
