  - { from: RTOK.a, to: V3.pin8, via: [[56.6, 2.45], [63.2, 2.45]] }
  - { from: RTOK.b, to: [1.45, 56] }
  - { from: RTO1.b, to: CTOUT.a, via: [[42.5, -0.72], [57.5, -0.72]] }
