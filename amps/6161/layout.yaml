  - { from: RG3.b, to: [1.45, 37] }

  # === tremolo oscillator (V3A — the drawing's pins 6/7/8) =================
  - { from: RTO1.b, to: V3.pin6, via: [[42.8, 2.92], [61.6, 2.92], [61.6, 1.82]] }
