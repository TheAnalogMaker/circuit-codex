# amps/5e1/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  # netlist: XV2 BP2 BP2 G2 K2 — plate and screen both on BP2, and primary DCR
  # is omitted, so the plate end and the B+ end of the primary are one node.
  T1.1: BP2                # OT primary, V2 plate end
  T1.2: BP2                # OT primary, B+ end (the <B+2> rail)
  T1.3: "0"                # OT secondary hot — secondary DCR folded into ground;
                           # R11 (22 k NFB, speaker -> V1B cathode) returns here
                           # and the netlist has it R11 K1B 0.

symbols:
  # netlist RCHOKE BP1 BP2 350 Ω is the filter choke's winding DCR, not a
  # discrete resistor: the sheet draws the choke itself as L1. (layout.yaml
  # calls RCHOKE netlist_unplaced because it is not a board part; on the sheet
  # it IS drawn, so it binds to the symbol instead.)
  RCHOKE: L1

series_bridge:
  # The 1 M input leak (R3) hangs from jack 1's tip, jack side of R1, as both
  # H-EE pages draw it; R1 carries no DC grid current, so the netlist's
  # R3 G1A 0 runs G1A through it.
  R1: "68 k jack-1 grid stopper — netlist node G1A runs through it to the 1 M leak at the jack-1 tip"

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-02 after the drawing went clean against netlist.cir.
schematic_claim: verified
