# Parts list — reference designators match schematic.kicad_sch exactly.
notes: "The schematic draws one jack per channel (the chassis has four). Output tubes are drawn '6L6G' on the C-EG sheet; Fender shipped the tweed Super with 5881s (interchangeable 6L6-family) and the 5881 SPICE model stands in for simulation. The tone network is capacitor-isolated and omitted from the DC netlist (the phase-inverter grid's DC path through it is modelled as a single leak resistor). The negative-feedback resistor, the presence pot and its 0.1 µF bleed cap are chassis wiring rather than board wiring, but the drawing carries all three, so they carry designators (RNF, VR6, C17) and are drawn on the schematic. Parts drawn only as annotations (bright cap, line caps, power transformer) are listed without designators."
