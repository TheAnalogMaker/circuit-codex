# Printed voltage chart read directly from the published 5F4 (C-EG) drawing
# (2026-07-18). Fender's printed convention: values ±20%, electronic voltmeter.
# Rails get 8% tolerance; tube pins 20%.
#
# The rails, 12AY7 front end, the whole phase-inverter section (driver +
# split-load cathodyne, re-read from the published sheet 2026-08-03), and the
# 6L6 fixed-bias supply all reproduce within tolerance. Three printed values
# remain disputed: the 2026-07-18 12AX7 calibration study
# (reference/studies/12ax7-calibration) showed the chart's V2A pair (and the
# cathode-follower value it direct-couples to) is physically impossible for a
# 12AX7. The five phase-inverter values, once read as the driver + cathodyne
# the sheet draws rather than a long-tailed pair, are self-consistent and
# gate cleanly — the earlier "mutually inconsistent" dispute was an artifact
# of forcing a different circuit onto the printed chart.
source: "Fender 5F4 (C-EG) drawing, printed voltages: rails +415/+410/+332/+280, bias -40; 12AY7 plates +140, cathode +2.2; V2A plate +140, cathode +2.2, cathode-follower +140; PI driver plate +213 with +1.7 cathode; cathodyne plate +270, cathode +55, 1.5k/56k junction +53.3"
nodes:
  BP2:  { chart: 410, tol_pct: 8, note: "screens node after the choke (DCR estimated at 130 Ω)" }
  BP3:  { chart: 332, tol_pct: 8, note: "PI supply node after the first 10 kΩ dropper" }
  BP4:  { chart: 280, tol_pct: 8, note: "preamp node after the second 10 kΩ dropper" }
  PAY1: { chart: 140, tol_pct: 20, note: "12AY7 plate (channel 1)" }
  PAY2: { chart: 140, tol_pct: 20, note: "12AY7 plate (channel 2)" }
  KAY:  { chart: 2.2, tol_pct: 20, note: "shared 12AY7 cathode, 820 Ω" }
  P2A:
    chart: 140
    tol_pct: 20
    disputed: true
    dispute_note: "The printed pair (140 V plate, 2.2 V cathode) is physically impossible for a 12AX7: 2.2 V across 1.5 kΩ implies 1.47 mA, which at Vg ≈ −2.2 V requires roughly 280 V plate-to-cathode — twice the printed value. Philips' measured resistance-coupled tables and simulation both put the self-consistent point near 190 V."
  K2A:
    chart: 2.2
    tol_pct: 20
    disputed: true
    dispute_note: "Half of the physically-impossible printed pair on V2A — see P2A."
  KCF:
    chart: 140
    tol_pct: 20
    disputed: true
    dispute_note: "Direct-coupled to V2A's plate, so it inherits the disputed printed 140 V; simulation follows the self-consistent operating point near 190 V."
  PPIA: { chart: 213, tol_pct: 20, note: "V3A (driver) plate, 100 kΩ load — consistent with the printed +1.7 V cathode: ≈1.2 mA through both" }
  KPIA: { chart: 1.7, tol_pct: 20, note: "V3A cathode, 1.5 kΩ (printed beside the tube; the NFB/presence network landing here is DC-neutral to within a few percent)" }
  PPIB: { chart: 270, tol_pct: 20, note: "V3B (cathodyne) plate, 56 kΩ load" }
  KPI:  { chart: 55, tol_pct: 20, note: "V3B cathode, 1.5 kΩ above the 56 kΩ leg — the printed 55/53.3 pair implies the same ≈1 mA the plate figure does" }
  JPI:  { chart: 53.3, tol_pct: 20, note: "1.5 kΩ/56 kΩ junction — the cathodyne grid's DC reference through the 1 MΩ leak" }
  G51:  { chart: -40, tol_pct: 8, note: "6L6G fixed bias via 220k from the -40 V supply" }
