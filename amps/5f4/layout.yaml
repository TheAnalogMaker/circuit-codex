# Board layout — redrawn from the published Fender 'Super-Amp' 5F4 layout
# drawing (C-EG), page 1 of the same PDF as the schematic. Part refs are the
# shared key into bom.yaml; the renderer reads each value and part type from
# there. A legible, schematic-style redraw of the board's principal components
# in the order the drawing shows them, with a lead-by-lead wiring layer — never
# a trace or a dimensioned reproduction.
#
# The 5F4 shares the 5F6-A Bassman's board format: the diagram reads
# left->right — bias/power supply and the fixed-bias 6L6G output support at the
# left, the driver + split-load cathodyne phase inverter and the split
# treble/bass tone network in the centre, the 12AX7 gain stage and 12AY7 input
# pair at the right — matching the tube row on the drawing
# (5U4G · 6L6G · 6L6G · 12AX7 · 12AX7 · 12AY7).
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the PT/rectifier AC
# side, the bias-supply selenium network, and the OT-secondary / NFB / presence
# network are an excluded annotation layer (not modelled in netlist.cir; the
# 56 k NFB parallels the driver's 1.5 k cathode with ~56.5 k at DC — a stated
# -2.5% shift, see the netlist header).
# Re-earned 2026-07-19 under the HARDENED equivalence gate and re-wired
# 2026-08-03 to the tone network + driver/cathodyne inverter the C-EG sheet
# draws: all six 12AY7/12AX7 preamp+PI sections and both 6L6G outputs anchor by
# basing (0 UNANCHORED), the couplers (C8/C9/C10) and grid stoppers (R5s/R6s)
# are checked as real parts, and the twisted heater runs are validated.
wiring_claim: verified

board:
  rows: 2
  cols: 49
  title: "5F4 · eyelet board layout"
caption: "Redrawn from the published Fender 5F4 'Super-Amp' layout drawing (C-EG), page 1 — principal board components and their hookup, in the order the drawing shows them. The chassis has four input jacks (two per channel); the drawing's four 68 kΩ grid stoppers collapse to the two the schematic/BOM model (R1s, R2s), and the two 1 MΩ input grid leaks (RG1, RG2) mount at the channel jacks as the sheet shows. The tone network is wired as the sheet draws it: the 250 pF treble cap, 0.1 µF bass coupler and its 220 kΩ leak sit on the board; the 0.01 µF (C6) hangs at the treble pot and the 0.005 µF (C7) at the bass pot, whose other end lug is grounded to its case; the bass branch lands on the bass pot's WIPER, and the second 220 kΩ (RSR) is strung pot-to-pot from the bass wiper to the treble wiper, whose lead alone carries the output to the phase inverter. The presence pot and the 56 kΩ negative-feedback resistor both land at the driver's cathode: they are chassis wiring rather than board wiring, so they are drawn at the chassis edge — the feedback resistor as a discrete part, because a bare lead from the speaker jack to that cathode would draw a short the amplifier does not have. The 0.1 µF on the presence wiper is drawn at the chassis edge beside the pot. The 100 pF bright cap and the two AC-line caps are chassis parts too and are left off this drawing; the schematic carries them. The power-transformer primary (black) lands on chassis switches, off the board; the 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6L6G output tubes → 12AX7 phase inverter → 12AX7 → 12AY7) is routed as the published sheet shows it, and the directly-heated 5U4G rectifier runs off the 5 V winding, not the 6.3 V chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Super-Amp' Model 5F4 layout drawing (C-EG), page 1"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_5f4.pdf"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; shared column across the rows = a vertical
# leg — a cathode resistor or bypass can to the ground bus).
parts:
  # --- bias supply + main filter cans + rail droppers (power end, left) -------
  - { ref: C15,  a: [0, 0],  b: [0, 2] }    # 8 µF bias-supply filter (drawn "100/25" on the sheet)
  - { ref: RB1,  a: [1, 0],  b: [1, 1] }    # 6.8k bias series (from selenium rect)
  - { ref: RB2,  a: [1, 2],  b: [1, 3] }    # 56k bias bleeder
  - { ref: C11,  a: [0, 3],  b: [0, 5] }    # 16 µF filter, B+1 (+415, output plates / OT CT)
  - { ref: C12,  a: [0, 6],  b: [0, 8] }    # 16 µF filter, B+2 (+410, screens)
  - { ref: C13,  a: [0, 9],  b: [0, 11] }   # 16 µF filter, B+3 (+332, PI)
  - { ref: RD1,  a: [1, 4],  b: [1, 5] }    # 10k dropper B+2->B+3
  - { ref: RD2,  a: [1, 6],  b: [1, 7] }    # 10k dropper B+3->B+4
  # --- 6L6G output support: grid leaks (from -40 V) + 1.5k grid stoppers ------
  - { ref: RGL1, a: [1, 8],  b: [1, 9] }    # 220k V4 grid leak
  - { ref: R5s,  a: [1, 10], b: [1, 11] }   # 1.5k V4 grid stopper
  - { ref: RGL2, a: [1, 12], b: [1, 13] }   # 220k V5 grid leak
  - { ref: R6s,  a: [1, 14], b: [1, 15] }   # 1.5k V5 grid stopper
  # --- cathodyne -> 6L6G grid couplers ---------------------------------------
  - { ref: C9,   a: [0, 16], b: [0, 18] }   # 0.1 µF cathodyne PLATE -> V4 grid
  - { ref: C10,  a: [0, 19], b: [0, 21] }   # 0.1 µF cathodyne CATHODE -> V5 grid
  # --- phase inverter: driver (V3A) + split-load cathodyne (V3B) --------------
  - { ref: RLA,  a: [1, 16], b: [1, 17] }   # 100k driver plate load (V3A)
  - { ref: RLB,  a: [1, 18], b: [1, 19] }   # 56k cathodyne plate load (V3B)
  - { ref: RK3,  a: [1, 20], b: [1, 21] }   # 1.5k driver cathode bias (NFB/presence land here)
  - { ref: RGB,  a: [1, 22], b: [1, 23] }   # 1M cathodyne grid leak -> 1.5k/56k junction
  - { ref: RKA, a: [0, 24], b: [1, 24] }  # 1.5k cathodyne cathode -> junction (vertical)
  - { ref: RKB,  a: [1, 25], b: [1, 26] }   # 56k junction -> ground
  # --- split tone network (board half) + driver->cathodyne coupler ------------
  - { ref: C16,  a: [0, 22], b: [0, 23] }   # 0.1 µF bass-branch coupler (node A -> node B)
  - { ref: C8,   a: [0, 25], b: [0, 27] }   # 0.02 µF driver plate -> cathodyne grid
  - { ref: RSL,  a: [1, 27], b: [1, 28] }   # 100k bass-branch series (node B -> the bass pot's wiper)
  - { ref: C5,   a: [0, 28], b: [0, 29] }   # 250 pF treble cap (shares the CF-output eyelet with RKCF)
  - { ref: RKCF, a: [0, 29], b: [1, 29] }   # 100k cathode-follower load (vertical)
  - { ref: RF1,  a: [1, 30], b: [1, 31] }   # 4.7M V2A grid reference / feedback from node B
  - { ref: RSH,  a: [0, 31], b: [0, 32] }   # 220k bass-branch leak (node B -> ground)
  # --- channel mixers + V2 gain stage / cathode follower ---------------------
  - { ref: C4,   a: [0, 34], b: [0, 33] }   # 25 µF V2A cathode bypass (shares the cathode eyelet with RK2)
  - { ref: RM1,  a: [1, 32], b: [1, 33] }   # 270k channel-1 mixer
  - { ref: RK2,  a: [0, 34], b: [1, 34] }   # 1.5k V2A cathode (vertical)
  - { ref: C14,  a: [0, 35], b: [0, 37] }   # 8 µF filter, B+4 (+280, preamp)
  - { ref: RM2,  a: [1, 35], b: [1, 36] }   # 270k channel-2 mixer
  - { ref: RL3,  a: [1, 37], b: [1, 38] }   # 100k V2A plate load
  # --- 12AY7 input pair (right end) ------------------------------------------
  - { ref: C1,   a: [0, 38], b: [0, 40] }   # 0.02 µF V1A -> channel-1 volume
  - { ref: RL1,  a: [1, 39], b: [1, 40] }   # 100k V1A plate load
  - { ref: C2,   a: [0, 41], b: [0, 43] }   # 0.02 µF V1B -> channel-2 volume
  - { ref: RL2,  a: [1, 41], b: [1, 42] }   # 100k V1B plate load
  - { ref: R1s,  a: [1, 44], b: [1, 45] }   # 68k channel-1 grid stopper
  - { ref: RK1,  a: [0, 46], b: [1, 46] }   # 820 Ω shared 12AY7 cathode (vertical)
  - { ref: C3,   a: [0, 47], b: [0, 48] }   # 25 µF 12AY7 cathode bypass
  - { ref: R2s,  a: [1, 47], b: [1, 48] }   # 68k channel-2 grid stopper

# Off-board items drawn as labelled stubs around the board, in the drawing's
# positions: tubes along the bottom, the pots and input jacks up top,
# transformers and choke to either side.
offboard:
  - { id: PT,  kind: xfmr,  edge: left,   at: 0.2, label: "Power trans" }
  - { id: L1,  ref: L1, kind: choke, edge: left, at: 1.5, label: "Choke" }
  - { id: PL1, kind: part, glyph: lamp, edge: left, at: 2.7, label: "Pilot lamp" }
  - { id: V6,  ref: V6, kind: tube, edge: bottom, at: 2.5,  label: "V6 · 5U4G" }
  - { id: V4,  ref: V4, kind: tube, edge: bottom, at: 6.5,  label: "V4 · 6L6G" }
  - { id: V5,  ref: V5, kind: tube, edge: bottom, at: 10.5, label: "V5 · 6L6G" }
  - { id: SPK, kind: jack, edge: bottom, at: 15, label: "Spkr jacks" }
  # 56 kΩ negative-feedback resistor. Chassis wiring, not board wiring, but a
  # bare lead from the speaker jack to the driver's cathode would draw a short
  # that is not there — so it is drawn as the discrete 2-lead off-board part it
  # is, the same way the 5F6-A sheet's own 27 kΩ return is drawn.
  - { id: RNF, ref: RNF, kind: part, edge: bottom, at: 17.6, label: "NFB" }
  - { id: V3,  ref: V3, kind: tube, edge: bottom, at: 20,   label: "V3 · 12AX7 (PI)" }
  - { id: V2,  ref: V2, kind: tube, edge: bottom, at: 33,   label: "V2 · 12AX7" }
  - { id: V1,  ref: V1, kind: tube, edge: bottom, at: 44,   label: "V1 · 12AY7" }
  # Bias-supply rectifier. It had been narrated in prose ("a chassis part
  # feeding RB1 off the board") and left undrawn, so RB1's outer eyelet was
  # the one node on the sheet with no joint on it — a resistor with an end
  # going nowhere. It is drawn now, as the 5F10 and 6G3 sheets draw theirs.
  # Band at b: schematic.kicad_sch wires HT_B to the DIODE_SS anode pin and
  # the 6.8 k (RB1) to its cathode. The HT winding is symmetric and the
  # schematic names only "HT_B" for its tap, so the drawing takes the nearer
  # of the two red HT leads; which end carries the tap is not a circuit claim.
  - { id: D1, ref: D1, kind: part, edge: top, at: 0.5, label: "D1", cathode: b }
  - { id: VR6, ref: VR6, kind: pot, edge: top, at: 4,  label: "Presence" }
  - { id: C17, ref: C17, kind: part, edge: top, at: 6.4, label: "C17" }
  - { id: C7,  ref: C7, kind: part, edge: top, at: 21.8, label: "C7" }
  - { id: VR4, ref: VR4, kind: pot, edge: top, at: 24, label: "Bass" }
  - { id: RSR, ref: RSR, kind: part, edge: top, at: 26, label: "RSR" }
  - { id: VR3, ref: VR3, kind: pot, edge: top, at: 28, label: "Treble" }
  - { id: C6,  ref: C6, kind: part, edge: top, at: 30.2, label: "C6" }
  - { id: VR1, ref: VR1, kind: pot, edge: top, at: 39, label: "Volume · 1" }
  - { id: VR2, ref: VR2, kind: pot, edge: top, at: 43, label: "Volume · 2" }
  - { id: JI,  kind: jack, edge: top, at: 46, label: "Ch 1 in" }
  - { id: JM,  kind: jack, edge: top, at: 48, label: "Ch 2 in" }
  # RG1 / RG2 (1 MΩ input grid leaks) mount at the channel jacks per the drawing —
  # generic 2-lead off-board parts (kind: part): RGn.a → the channel input node,
  # RGn.b → ground, using the renderer's 2-terminal support.
  - { id: RG1, ref: RG1, kind: part, edge: top, at: 45.2, label: "RG1" }
  - { id: RG2, ref: RG2, kind: part, edge: top, at: 48.9, label: "RG2" }
  - { id: T3,  ref: T3, kind: xfmr, edge: right, at: 0.5, label: "Output trans" }

# Ground bus — the bare tinned rail running the length of the board just below
# the bottom eyelet row; the filter, cathode, bias-bleeder, and pot grounds all
# tie to it.
bus:
  - { from: [1.45, -0.4], to: [1.45, 48.4] }

# Wiring — read lead-by-lead from the published 5F4 layout drawing (C-EG). The
# transformer leads carry the colours marked on that drawing: the PT secondary
# (RED/RED HT plates, YELLOW/YELLOW 5 V filament, RED-YELLOW HT centre tap) to
# the 5U4G, and the output-transformer primary (V4 plate BROWN, V5 plate BLUE,
# centre tap RED to B+1). The PT primary (BLACK) lands on the chassis switches,
# off the board, so it is not drawn. The 6.3 V heater winding is the GREEN pair
# (the sheet shows plain green/green — no centre tap on this transformer); it
# feeds the pilot lamp and then daisy-chains socket to socket in physical order
# (rendered as a green twisted pair, style: twisted). The directly-heated 5U4G
# runs off the 5 V winding and is not on the 6.3 V chain. The two 1 MΩ input
# grid leaks (RG1, RG2) mount at the channel jacks as generic 2-lead off-board
# parts (kind: part). The bias-supply selenium rectifier is a chassis part
# feeding RB1 off the board. Endpoints reference board eyelets (REF.a/REF.b),
# tube socket pins (Vn.pinN, validated against reference/tubes basing — heater
# pins on the twisted runs), pot lugs (VRn.lugN), jacks, off-board 2-lead parts
# (RG1.a/RG1.b, PL1.a/PL1.b), choke/transformer leads (by colour). `via`
# waypoints are [col, row]; row<0 routes above the board, row>1 below it.
runs:
  # --- power transformer secondary -> 5U4G rectifier (marked colours) --------
  - { from: PT.red1, to: V6.pin4, via: [[2.1, 0.5], [2.5, 1.7]] }
  - { from: PT.red2, to: V6.pin6, via: [[2, 0.85], [3.6, 1.62]] }
  - { from: PT.red-yellow, to: [1.45, 2], via: [[-1.858, 0.223]] }
  - { from: PT.yellow1, to: V6.pin2, via: [[0.892, 0.7], [0.518, 2.5], [1.8, 2.75]] }
  - { from: PT.yellow2, to: V6.pin8, via: [[2.7, 0.55], [2.7, 2.3]] }
  - { from: V6.pin8, to: C11.a, color: red, via: [[4.35, 2.68], [4.35, 0.4]] }

  # --- filtered B+ rail: choke, then two 10k droppers ------------------------
  - { from: C11.a, to: L1.hi }
  - { from: L1.lo, to: C12.a, via: [[1, 0.888]] }
  - { from: C12.a, to: RD1.a }
  - { from: RD1.b, to: C13.a, via: [[7.2, 0.42]] }
  - { from: C13.a, to: RD2.a, via: [[7.6, 0.78]] }
  - { from: RD2.b, to: C14.a, via: [[7, 0.5], [34.5, 0.5]] }
  - { from: C11.b, to: [1.45, 4.7], via: [[4.75, 1.1]] }
  - { from: C12.b, to: [1.45, 7.7], via: [[7.6, 1.1]] }
  - { from: C13.b, to: [1.45, 10.7], via: [[10.6, 1]] }
  - { from: C14.b, to: [1.45, 36.7], via: [[36.7, 1.1]] }

  # --- bias supply: selenium rect (off-board) -> RB1 -> -40 V ----------------
  - { from: D1.a, to: PT.red2, via: [[0.1, -0.62], [-0.5, -0.2]] }
  - { from: D1.b, to: RB1.b, via: [[0.95, -0.35]] }
  - { from: RB1.a, to: C15.a }
  - { from: C15.b, to: [1.45, 0.5], via: [[0.615, 1.1]] }
  # bows below RB1.b — that eyelet now carries the selenium cathode, and a
  # run passing straight over a live joint reads as landing on it
  - { from: RB2.a, to: RB1.a, via: [[1, 1.19]] }
  - { from: RB2.b, to: [1.45, 3] }
  - { from: RGL1.b, to: RB1.a, via: [[9, 1.62], [1.2, 1.62]] }
  - { from: RGL2.b, to: RB1.a, via: [[12.312, 1.52], [-0.4, 1.54], [-0.4, 1]] }

  # --- 6L6G output: grids, screens, plates, cathodes, OT ---------------------
  # OT primary / B+ / plate leads run in a harness band below the sockets.
  - { from: C9.b, to: R5s.a, via: [[18, 0.42], [11, 0.42]] }
  - { from: R5s.b, to: V4.pin5, via: [[10.35, 1.18], [6.4, 1.18]] }
  - { from: RGL1.a, to: V4.pin5, via: [[8, 2.1], [5.4, 2.1]] }
  - { from: C10.b, to: R6s.a, via: [[21, 0.62], [15, 0.62]] }
  - { from: R6s.b, to: V5.pin5, via: [[14.5, 2.28], [11.6, 2.28]] }
  - { from: RGL2.a, to: V5.pin5, via: [[12, 2.1], [9.4, 2.1]] }
  - { from: V4.pin4, to: C12.a, via: [[5.7, 1.5]] }
  - { from: V5.pin4, to: C12.a, via: [[7.4, 1.75], [6.3, 0.5]] }
  - { from: V4.pin3, to: T3.brown, via: [[4.5, 2.68], [49.1, 2.68], [49.1, 0.31]] }
  - { from: V5.pin3, to: T3.blue, via: [[9, 2.85], [49.4, 2.85], [49.4, 0.41]] }
  - { from: T3.red, to: C11.a, color: red, via: [[49.7, 0.52], [49.7, 2.5], [3.4, 2.5], [3.4, 0.4]] }
  - { from: V4.pin8, to: [1.45, 6.9], via: [[7.147, 2.75]] }
  - { from: V5.pin8, to: [1.45, 10.9], via: [[11.11, 2.75]] }
  - { from: T3.sec1, to: SPK, via: [[48.5, 0.63], [48.5, 3.05], [15.8, 3.05], [15.05, 1.9]] }
  - { from: T3.sec2, to: SPK, via: [[48.8, 0.74], [48.8, 3.2], [17.3, 3.2], [16.5, 1.8]] }
  - { from: SPK, to: RNF.a, via: [[15.269, 2.55], [17, 2.55]] }
  - { from: RNF.b, to: RK3.a, via: [[18.2, 2.7], [18.2, 3.35], [20.16, 3.35], [19.9, 1.35]] }

  # --- phase inverter: driver (V3A) + split-load cathodyne (V3B) -------------
  - { from: RLA.a, to: C13.a, via: [[16, 0.55], [9, 0.55]] }
  - { from: RLA.b, to: V3.pin1, via: [[17, 1.6], [20, 1.6]] }
  - { from: RLB.a, to: C13.a, via: [[18, 0.8], [9.6, 0.8]] }
  - { from: RLB.b, to: V3.pin6, via: [[19, 1.72], [20.4, 1.72]] }
  - { from: V3.pin1, to: C8.a, via: [[19.5, 1.65], [24.7, 1.75], [24.7, 0.45]] }
  - { from: V3.pin6, to: C9.a, via: [[20.633, 1.818], [16.203, 1.778], [16.345, 0.55]] }
  - { from: C8.b, to: V3.pin7, via: [[26.648, 1.3], [20.8, 1.3], [20.8, 2]] }
  - { from: RGB.a, to: V3.pin7, via: [[22, 1.9], [20, 1.9]] }
  - { from: V3.pin3, to: RK3.a, via: [[20, 1.68], [19.6, 1.68], [19.6, 1.05]] }
  - { from: RK3.b, to: [1.45, 20.3], via: [[20.3, 1.15]] }
  - { from: V3.pin8, to: RKA.a, via: [[21, 2.35], [24.3, 2.35], [24.3, 0.55]] }
  - { from: C10.a, to: RKA.a, via: [[19, -0.35], [24, -0.35]] }
  - { from: RKA.b, to: RKB.a }
  - { from: RGB.b, to: RKB.a, via: [[23, 1.62], [24.3, 1.62]] }
  - { from: RKB.b, to: [1.45, 26] }

  # --- V2A gain stage + V2B cathode follower ---------------------------------
  - { from: RL3.a, to: C14.a }
  - { from: RL3.b, to: V2.pin6, via: [[37, 1.542], [34.566, 1.5]] }
  - { from: V2.pin6, to: V2.pin2, via: [[33.2, 2.4], [32.4, 2.4]] }
  - { from: V2.pin1, to: C14.a, via: [[33, 1.65], [35.76, 1.65]] }
  - { from: V2.pin8, to: RK2.a, via: [[34.5, 2.3], [34.2, 2.3], [34.2, 0.35]] }
  - { from: RK2.b, to: [1.45, 34.4] }
  # C4's + lead shares RK2's top eyelet (an eyelet is one solder point)
  - { from: C4.b, to: [1.45, 33.8], via: [[33.5, 0.6]] }
  - { from: RF1.b, to: V2.pin7, via: [[31.5, 2], [33, 2]] }

  # --- split treble/bass tone network, as the C-EG sheet wires it -------------
  # (250 pF + 0.1 coupler + 220k leak on the board; 0.01 at the treble pot and
  # 0.005 at the bass pot; the bass pot's other end lug grounded to its case;
  # the branch injected at the bass WIPER; RSR 220k strung bass wiper -> treble
  # wiper; the treble wiper's lead alone carries the output to the PI grid.)
  - { from: V2.pin3, to: RKCF.a, via: [[32, 1.6], [29.4, 1.5]] }
  - { from: RKCF.b, to: [1.45, 28.6] }
  - { from: C5.a, to: VR3.lug3, via: [[28.35, -0.55]] }
  - { from: VR3.lug1, to: C6.a, via: [[27.69, -1.2], [29.9, -1.2]] }
  - { from: C6.b, to: [1.45, 30.6], via: [[30.55, -0.6]] }
  - { from: C16.b, to: RKCF.a, via: [[23.4, -0.5], [28.5, -0.5]] }
  - { from: C16.a, to: RSL.a, via: [[21.6, 1.25], [26.5, 1.25]] }
  - { from: RSL.a, to: RF1.a, via: [[27.6, 1.3], [29.6, 1.3]] }
  - { from: RSH.a, to: RF1.a, via: [[30.6, 0.5]] }
  - { from: RSH.b, to: [1.45, 31.5], via: [[32.5, 0.5], [31.5, 0.85]] }
  - { from: RSL.b, to: VR4.lug2, via: [[26, 0.861], [24, -0.3]] }
  - { from: RSR.a, to: VR4.lug2, via: [[25.7, -0.75], [24.35, -0.75]] }
