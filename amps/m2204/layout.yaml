# Board layout — DERIVED FROM THE SCHEMATIC. No factory Marshall model 2204
# layout drawing was located, and the 2204 was not a hand-wired board amp at all:
# both 2204 STD sheets note "PCB: JM80", a printed board shared with other models
# of the era. What follows is therefore not a record of factory construction but
# this circuit's parts laid out in signal order along the chassis and drawn on the
# house eyelet grid, reconstructed from schematic.kicad_sch / netlist.cir (the
# electrical authority). Part refs are the shared key into bom.yaml; the renderer
# reads each value and part type from there. Never a trace or a dimensioned
# reproduction.
#
# Board reads left->right along the chassis, in the same order as the model 1987
# it descends from: the negative-bias supply, silicon rectifier, reservoir, choke
# filter and dropper chain at the left; the two EL34 outputs and their grid
# couplers next; the long-tailed-pair phase inverter and the feedback network in
# the centre; the tone-stack slope and cathode-follower load, then V2, then the
# cascaded V1b and V1a at the right.
board:
  rows: 2
  cols: 105
  title: "Model 2204 · board layout (derived)"
caption: "A derived layout: Marshall published no board-layout drawing for the model 2204, and the amplifier is not a hand-wired board amp — both 2204 STD sheets note the JM80 printed board. The arrangement below is the Circuit Codex's own, laying this circuit's parts out in signal order along the chassis on the house eyelet grid, with the board order and point-to-point wiring reconstructed from schematic.kicad_sch / netlist.cir. From the phase inverter rightwards it follows the model 1987's order, the circuit the two heads share. All hookup leads are drawn in the neutral tone: with no layout sheet, no lead colours are asserted for the board wiring. Parts drawn off the board here: the tone-stack capacitors (C10 470 pF, C11 and C12 0.022 µF) mount at the tone controls; the peaking capacitors across the preamp volume (C4 470 pF, C5 0.001 µF) mount at that control; the presence capacitor (C17 0.1 µF) mounts at the presence control; the 68 kΩ grid stopper (R3) and 1 MΩ grid leak (R2) sit at the input jacks; the panel link the drawing carries in the R14 position runs from the treble wiper to the master volume; the D.I. network (R35 2.2 kΩ, R36 100 Ω, R37 560 Ω) sits at its own jack; and the fuses, the mains and standby switches and the two selector switches are chassis hardware. The three dual 50 µF + 50 µF cans are each drawn as one body between the rail they filter and the ground bus; C21's second section filters the input-stage rail on the far side of R8, as the drawing's dual can straddles that dropper. The drawing carries an undesignated indicator lamp across the mains primary — not on the heater chain — and it is drawn here across the mains inlet, with the fuse, switch and voltage selector between them left undrawn along with the rest of the mains hardware. The 6.3 V heater chain (green twisted pair, mains transformer, the two EL34 outputs, the ECC83 phase inverter, the ECC83 third stage and follower, the ECC83 input pair) is likewise derived: with no layout sheet its daisy order is the physical socket order and the twisted-pair green is the house heater idiom, not a sourced wire colour. The winding's own centre tap is earthed on the drawing rather than run to the sockets, so it is not drawn. Not a trace or a dimensioned reproduction."
source:
  desc: "Marshall model 2204 STD factory drawing, sheets 2204PRE.DGM (iss 4, 19-5-88) and 2204PWR.DGM (iss 2, 18-6-89) — layout derived from these schematics; no factory layout drawing located, and the circuit is built on the JM80 printed board"
  url: "https://www.drtube.com/schematics/marshall/2204pwrm.gif"

# Wiring proven electrically equivalent to the netlist by
# pipeline/verify_layout_nets.py (see the net_map block at the foot of this file).
# All three ECC83 dual-triodes (V1 input pair, V2 third stage + follower, V3 phase
# inverter) and the two EL34 outputs anchor by basing (0 UNANCHORED). The
# PI-plate -> EL34-grid couplers (C14/C16), the grid-to-grid compensation cap
# (C18), the V1a cathode bypass (C1) and C15 from the inverter's cold grid to the
# feedback node are modelled in netlist.cir, so the push-pull phase and the
# inter-stage routing are machine-checked, not trusted.
wiring_claim: verified

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; shared column across rows = vertical leg).
parts:
  # --- negative-bias supply (HT tap -> R30 -> D1 -> C20 -> R27 -> bias node) ---
  - { ref: R30, a: [1, 1],  b: [1, 2] }     # 220k bias series, off the HT winding
  # D1's cathode faces the winding through R30: the rail it feeds is NEGATIVE, so
  # the diode is turned the other way from the HT rectifier. Read from
  # schematic.kicad_sch (the D1 symbol placed at rot 180 in the bias row).
  - { ref: D1,  a: [1, 4],  b: [1, 5], cathode: a }
  - { ref: C20, a: [0, 4],  b: [0, 6] }     # 10 µF raw bias reservoir
  - { ref: R27, a: [1, 7],  b: [1, 8] }     # 15k into the bias node
  - { ref: C19, a: [0, 8],  b: [0, 10] }     # 10 µF bias-node filter
  - { ref: R26, a: [1, 10], b: [1, 11] }    # 56k upper leg of the bias divider
  # --- silicon HT rectifier + reservoir (B+1) ---------------------------------
  - { ref: D3,  a: [1, 13], b: [1, 14], cathode: b }
  - { ref: D2,  a: [1, 15], b: [1, 16], cathode: b }
  - { ref: D5,  a: [0, 13], b: [0, 14], cathode: b }
  - { ref: D4,  a: [0, 15], b: [0, 16], cathode: b }
  - { ref: C23, a: [0, 18], b: [0, 20] }    # 50+50 µF reservoir, B+1
  # --- choke output + rail droppers -------------------------------------------
  - { ref: C22, a: [0, 22], b: [0, 24] }    # 50+50 µF screen-node filter, B+2
  - { ref: R29, a: [1, 24], b: [1, 25] }    # 10k dropper B+2 -> B+3 (rail X)
  - { ref: C21, a: [0, 26], b: [0, 28] }    # 50+50 µF preamp-rail filter, B+3
  - { ref: R8,  a: [1, 28], b: [1, 29] }    # 10k dropper B+3 -> B+4 (input rail)
  # --- EL34 output support -----------------------------------------------------
  - { ref: R24, a: [1, 32], b: [1, 33] }    # 220k V4 grid leak -> bias line
  - { ref: C14, a: [0, 32], b: [0, 34] }    # 0.022 µF PI(A) -> V4 grid coupler
  - { ref: R31, a: [1, 35], b: [1, 36] }    # 5.6k V4 grid stopper
  - { ref: R33, a: [0, 36], b: [0, 37] }    # 1.5k V4 screen resistor
  - { ref: C18, a: [0, 39], b: [0, 41] }    # 47 pF across the two output grids
  - { ref: R25, a: [1, 42], b: [1, 43] }    # 220k V5 grid leak -> bias line
  - { ref: C16, a: [0, 43], b: [0, 45] }    # 0.022 µF PI(B) -> V5 grid coupler
  - { ref: R32, a: [1, 46], b: [1, 47] }    # 5.6k V5 grid stopper
  - { ref: R34, a: [0, 47], b: [0, 48] }    # 1.5k V5 screen resistor
  # --- long-tailed-pair phase inverter + feedback network ----------------------
  - { ref: C9,  a: [0, 51], b: [0, 53] }    # 0.022 µF master volume -> PI(A) grid
  - { ref: R18, a: [1, 52], b: [1, 53] }    # 82k PI(A) plate load (the driven side)
  - { ref: R21, a: [1, 54], b: [1, 55] }    # 100k PI(B) plate load
  - { ref: R17, a: [1, 57], b: [1, 58] }    # 1M PI(A) grid leak -> tail junction
  - { ref: R19, a: [1, 59], b: [1, 60] }    # 1M PI(B) grid leak -> tail junction
  - { ref: R16, a: [0, 62], b: [1, 62] }    # 470 shared cathode (vertical)
  - { ref: R20, a: [1, 63], b: [1, 64] }    # 10k tail -> feedback node
  - { ref: C15, a: [0, 64], b: [0, 66] }    # 0.1 µF PI(B) grid -> feedback node
  - { ref: R23, a: [1, 66], b: [1, 67] }    # 4.7k feedback node -> ground
  - { ref: R22, a: [1, 68], b: [1, 69] }    # 100k negative feedback from the speaker
  # --- tone-stack slope + cathode-follower load --------------------------------
  - { ref: R15, a: [1, 71], b: [1, 72] }    # 33k tone-stack slope
  - { ref: R13, a: [0, 74], b: [1, 74], value_nudge: [-40, 0] }  # 100k cathode-follower load (vertical)
  # --- V2 third gain stage ------------------------------------------------------
  - { ref: R9,  a: [0, 76], b: [1, 76] }    # 820 V2a cathode, unbypassed (vertical)
  - { ref: R12, a: [1, 78], b: [1, 79] }    # 100k V2a plate load
  # --- V1b cascaded second stage + the divider ahead of V2 ---------------------
  - { ref: C7,  a: [0, 80], b: [0, 82] }    # 0.022 µF V1b plate -> divider
  - { ref: C8,  a: [0, 83], b: [0, 84] }    # 470 pF across the divider's series arm
  - { ref: R10, a: [1, 83], b: [1, 84] }    # 470k divider, series arm
  - { ref: R11, a: [0, 86], b: [1, 86] }    # 470k divider shunt / V2a grid return
  - { ref: R7,  a: [1, 88], b: [1, 89] }    # 100k V1b plate load
  - { ref: R6,  a: [0, 90], b: [1, 90] }    # 10k V1b cathode, unbypassed (vertical)
  # --- V1a input stage + the preamp-volume feed --------------------------------
  - { ref: C3,  a: [0, 92], b: [0, 94] }    # 0.022 µF V1a plate -> preamp volume
  - { ref: R5,  a: [1, 92], b: [1, 93] }    # 470k peaking arm into the volume
  - { ref: R4,  a: [1, 95], b: [1, 96] }    # 100k V1a plate load
  - { ref: C2,  a: [0, 96], b: [0, 98] }    # 100 pF across the V1a triode
  - { ref: R1,  a: [0, 99], b: [1, 99] }    # 2.7k V1a cathode (vertical)
  - { ref: C1,  a: [0, 101], b: [0, 103] }  # 0.68 µF V1a cathode bypass

