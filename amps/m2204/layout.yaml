# net_map — the reviewable data layer reconciling the drawn wiring with the DC
# netlist for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The two EL34 plates and the OT primary centre tap co-anchor to B+1: the
  # netlist omits the OT primary DCR, and on this circuit the centre tap is taken
  # ahead of the choke, so both plate nodes and the tap collapse to the reservoir.
  # The output-transformer secondary is folded into ground the same way — the
  # negative-feedback resistor returns from it and reads as ground at DC.
  anchors:
    T2.pa: BP1
    T2.pb: BP1
    T2.ct: BP1
    T2.sa: "0"
    T2.sb: "0"
  # Netlist elements realised off the board or by a control — reported in
  # coverage, never a failure.
  netlist_unplaced:
    RCHOKE: "filter choke T3, chassis-mounted; the netlist models only its DC resistance"
    R2: "V1a grid leak — 1 MΩ mounted at the input jacks, off the board"
    RGV1: "V1b grid return — realised through the 1 MΩ preamp volume VR1, not a discrete board resistor"
