sources:
  - desc: "Marshall, model 2204 factory drawing, sheet 1 of 2. The title block reads \"2204 STD / Preamp\", Jim Marshall Products Ltd., Bletchley, Milton Keynes, England; file 2204PRE.DGM; issue 4, dated 19-5-88, drawn CPV. The note block reads \"PCB: JM80. V1,2: ECC83.\". Supplies every preamp value, with each part's reference designator. On this sheet V1b is a cascaded second stage, fed from the preamp volume's wiper, not a second channel. The drawing prints no valve-voltage chart. Not reproduced here; archived at Dr. Tube."
    url: "https://www.drtube.com/schematics/marshall/2204prem.gif"
  - desc: "Marshall, model 2204 factory drawing, sheet 2 of 2. The title block reads \"2204 STD / Output Stage & PSU\", Jim Marshall Products Ltd., Bletchley, Milton Keynes, England; file 2204PWR.DGM; issue 1 dated 19-5-88 and issue 2 dated 18-6-89, both drawn CPV. Supplies every value in the phase inverter, output stage and power supply, with reference designators, including the HT fuse marked \"T500mA\", the output transformer 789-139 with 16/8/4 Ω taps, and the mains transformer 1202-324 with 240/220/120 V selection. The drawing prints no valve-voltage chart. Not reproduced here; archived at Dr. Tube."
    url: "https://www.drtube.com/schematics/marshall/2204pwrm.gif"
  - desc: "thetubestore, the same two 2204 STD sheets mirrored as one two-page PDF. Used to read the drawing at a higher resolution than the GIF scans allow. The title blocks, issues and dates are identical; it is not an independent drawing of the circuit."
    url: "https://www.thetubestore.com/lib/thetubestore/schematics/Marshall/Marshall-50W-2204S-Schematic.pdf"
  - desc: "Marshall, specification sheet \"2204 50W MASTER VOLUME LEAD AMP / 2104 50W MASTER VOLUME LEAD AMP\" (dated 11/81). Supplies the tube complement (V1, V2, V3 ECC83/12AX7; output tubes V4 and V5 \"6550 for USA (EL34, KT77 elsewhere)\"); the power output (over 50 W RMS at clipping into 4, 8 or 16 Ω, at 3 % average distortion); the input sensitivity; the tone-control ranges; and the power-supply requirements (120/220/240 V AC, 175 W maximum, HT fuse \"T500mA\"). It is the source for the EL34 complement documented here being the non-US fitting."
    url: "https://www.drtube.com/schematics/marshall/2204specs.gif"
  - desc: "Marshall, model 2204 factory drawing titled \"50W MASTER MODEL / MODEL NO. 2204\" (dated 11/11/76, drawn FJK), Jim Marshall Products Ltd. for Unicord Incorporated, 75 Frost Street, Westbury NY. The earlier revision, and a different circuit from the one documented here: its V1 is a two-channel parallel input pair mixed through 100 kΩ resistors (an 820 Ω / 330 µF and a 2.7 kΩ / 0.68 µF cathode, exactly the 1987 front end) rather than the cascaded V1a-to-V1b chain, and its legend reads \"V4-5 6550\". Cited to establish which revision this page documents, and as the only Marshall-printed voltage figures found for any 2204 (400 V at the output plates, 87 V at the phase-inverter plates, 205 V and 150 V at V1, 39 V at the inverter cathode, −63 V bias). Those figures belong to that other revision at US mains voltage, so they are not used as a chart here."
    url: "https://www.drtube.com/schematics/marshall/2204u.gif"
  - desc: "Wikipedia, \"Marshall Amplification\". Supplies the late-1975 introduction of the Master Volume series with the 100 W 2203, followed by the 50 W 2204 in 1976; the change that connects the input stages in series rather than in parallel and turns the second channel's volume into a master volume, which reached the 2204 in early 1977; and the late-1980 repackaging of the 2203 and 2204 as the JCM800 series."
    url: "https://en.wikipedia.org/wiki/Marshall_Amplification"
  - desc: "Mullard/Philips, EL34 data sheet, January 1969 (\"A.F. Output Pentode\"). The anchor for the site's open (CC0) EL34 tube model: Va = 250 V, Vg2 = 250 V and Vg1 = −13.5 V give Ia = 100 mA, Ig2 = 14.9 mA, gm = 12.5 mA/V and µ(g1-g2) = 11."
    url: "https://frank.pocnet.net/sheets/010/e/EL34.pdf"
verification:
  status: draft   # both 2204 STD sheets print component values only — no valve-
                  # voltage chart — and no publishable measured reference for this
                  # revision was found. The EL34 v0 model is also far outside its
                  # 250 V anchor at this rail. Verified must be earned.
