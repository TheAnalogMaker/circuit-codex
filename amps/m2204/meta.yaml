# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "m2204"
name_style: "Master Volume lead 50-style"
family: british
era:
  start: 1977
  end: 1989
wattage: 50
tubes: [ECC83, ECC83, ECC83, EL34, EL34]
topology:
  rectifier: { kind: solid-state, type: "silicon bridge" }
