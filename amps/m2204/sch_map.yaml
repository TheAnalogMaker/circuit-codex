# amps/m2204/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T2.1: BP1                # OT primary, V4 plate end — primary DCR omitted
  T2.2: BP1                # OT primary centre tap (the <B+1> rail)
  T2.3: BP1                # OT primary, V5 plate end
  T2.4: "0"                # OT secondary hot — secondary DCR folded into ground
                           # (R22's feedback return); mirrors layout net_map
                           # T2.sa: '0'.
  T2.5: "0"                # OT secondary cold — same winding, same node;
                           # mirrors layout net_map T2.sb: '0'.

series_bridge:
  # 68 k input grid stopper: no DC grid current, so netlist node G1A runs
  # through it. Not a board part, so layout.yaml has no reason to name it.
  R3: "68 k V1a input grid stopper — netlist node G1A runs through it"

symbols:
  # netlist RCHOKE BP1 BP2 50 Ω is the filter choke's winding DCR, not a
  # discrete resistor: the sheet draws the choke itself as T3. (layout.yaml
  # calls RCHOKE netlist_unplaced because it is not a board part; on the sheet
  # it IS drawn, so it binds to the symbol instead.)
  RCHOKE: T3

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-02 after the drawing went clean against netlist.cir.
schematic_claim: verified
