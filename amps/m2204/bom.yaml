# Parts list — read from the two sheets of the Marshall 2204 STD factory drawing
# (2204PRE.DGM iss 4, 19-5-88; 2204PWR.DGM iss 2, 18-6-89). This is the 50 W
# master-volume lead head: one cascaded channel with High and Low inputs, preamp
# volume and master volume, 3x ECC83 + 2x EL34, silicon bridge rectifier.
# Designators are the drawing's own (R1…R37, C1…C23, VR1…VR6, RV1, D1…D5, T1…T3,
# J1…J5, F1/F2, S1/S2, SEL1/SEL2, MS1) rather than invented ones.
notes: "The drawing prints component values with no wattage or voltage rating except where noted (R8 and R29 are marked 1 W), so ratings are not asserted here. Cathode-bypass and coupling capacitor VALUES are open at DC and do not enter the operating-point netlist; they are listed for completeness. Designators C6, C13 and R28 appear nowhere on either 2204 STD sheet — the JM80 board these sheets document is shared with other models, and unused positions are simply absent from this drawing; they are not omitted here by oversight."
items:
