  - { ref: C1,  part: "Electrolytic capacitor", value: "0.68 µF", role: "V1a cathode bypass" }
  - { ref: C2,  part: "Ceramic capacitor", value: "100 pF", role: "Across V1a, plate to cathode — high-frequency shunt" }
