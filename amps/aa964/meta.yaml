# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "aa964"
name_style: "Blackface Princeton-style"
family: blackface
era:
  start: 1964
  end: 1968
wattage: 12
tubes: [12AX7, 12AX7, 6V6GT, 6V6GT, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: tb
lineage:
  derived_from: ["6g2"]   # the brownface Princeton: same fixed-bias 6V6 pair,
                          # same cathodyne (56 k plate, small cathode R into a
                          # tail, 1 M leak returned to the tail), same bias-vary
                          # tremolo — refined here with a GZ34 in place of the
                          # 5Y3GT and a dedicated 220k-5% output grid leak
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Princeton-Amp AA964\" schematic (drawing 045419). Supplies every component value, the printed voltage chart and the transformer part numbers (TR1 125P1B, 340-0-340 V; TR2 125A10B). The sheet's notice: values ±20%, read to ground with an electronic voltmeter, resistors ½ W 10% and capacitors 400 V unless marked. The preamp tube is labelled 7025 (an equivalent of the 12AX7). Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_AA964_schem.pdf"
  - desc: "Fender, \"Princeton-Amp AA964\" layout drawing (drawing code L-FD). Supplies the order of parts on the board; the multi-section filter can on the chassis (four 20 µF 450 V sections at +420, +415, +370 and +290 V, with one 18 kΩ 1 W dropper mounted at the can); the wire colours (power transformer red and red-yellow for the HT winding, yellow for the 5 V rectifier filament, green and green-yellow for the 6.3 V heaters; output transformer brown and blue to the 6V6 plates, red centre tap, green and black to the speaker jacks; blue to the vibrato-pedal jack); and the socket pin numbering. It prints +370 V at a filter node the schematic leaves unlabelled. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_AA964_layout.pdf"
  - desc: "Wikipedia, \"Fender Princeton\". Supplies the commonly cited 12 W rating of the push-pull 6V6 Princeton; the drawing prints no output power."
    url: "https://en.wikipedia.org/wiki/Fender_Princeton"
verification:
  status: verified
  date: 2026-08-02
  max_deviation_pct: 5.5   # worst gated node (PPI, the cathodyne plate, tol 20%); rails inside 2.4%. The tremolo oscillator sharing V2 is a documented exclusion (see notes.md), reported not gated
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V2A: "excluded — the tremolo's phase-shift oscillator: a running oscillator has no static operating point; its 220k plate load returns to the driven rail BA"
