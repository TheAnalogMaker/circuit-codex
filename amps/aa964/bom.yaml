  - { ref: RTO2, part: "Carbon comp resistor", value: "1 MΩ · ½ W",   role: "Phase-shift resistor, grid to ground" }
  - { ref: VRSPD, part: "Reverse-audio potentiometer", value: "3 MΩ-RA", role: "Speed" }
  - { ref: RSPD, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Speed-network series resistor to ground" }
