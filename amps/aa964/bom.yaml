# Parts list — read from the published Princeton-Amp AA964 schematic (drawing
# 045419). Reference designators follow the DC netlist where a part is modelled
# and are descriptive otherwise; every one of them is cross-checked against the
# redrawn schematic (schematic.kicad_sch) by pipeline/validate.py, in both
# directions. Values are the drawing's; its notice sets ½ W · 10 % resistors and
# 400 V capacitors unless marked otherwise.
notes: "The drawing shows two input jacks sharing one grid leak. The tremolo oscillator's parts are listed in full, but its DC operating point is excluded from the simulation for the reason given in the circuit notes below. Tube designators V1–V5 are this archive's, not the drawing's — Fender numbered the sockets on the tube chart, not the schematic; the TR1/TR2 transformer labels are the drawing's own. The 125P1B is the power transformer Fender shared across the Champ, the Princeton and the Princeton Reverb, and the HT winding is not annotated the same way on every sheet: this drawing prints 340-0-340 V, as does the Princeton Reverb AA1164, while the Champ AA764 sheet prints 320-0-320 V for the same part number. Each entry records the figure its own drawing prints."
items:
  # --- Input and first stage (V1A) ---
  - { ref: R1n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Input grid stopper (jack 1)" }
  - { ref: R2n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Input grid stopper (jack 2)" }
  - { ref: RG1A, part: "Carbon comp resistor", value: "1 MΩ · ½ W",   role: "Input grid leak" }
  - { ref: RL1A, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1A plate load" }
  - { ref: RK1A, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V1A cathode bias" }
  - { ref: CK1A, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V1A cathode bypass" }
  # --- Tone stack and volume ---
  - { ref: CT,  part: "Mica capacitor",       value: "250 pF",        role: "Treble cap, plate to treble pot" }
  - { ref: RS,  part: "Carbon comp resistor", value: "100 kΩ · ½ W",  role: "Tone-stack slope resistor" }
  - { ref: CB1, part: "Coupling capacitor",   value: "0.1 µF",        role: "Tone-stack bass coupling" }
  - { ref: CB2, part: "Coupling capacitor",   value: "0.047 µF",      role: "Tone-stack bass cap" }
  - { ref: RBL, part: "Carbon comp resistor", value: "6.8 kΩ · ½ W",  role: "Tone-stack bleed resistor" }
  - { ref: VRT, part: "Audio-taper potentiometer", value: "250 kΩ-A", role: "Treble" }
  - { ref: VRB, part: "Audio-taper potentiometer", value: "250 kΩ-A", role: "Bass" }
  - { ref: VRV, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Volume" }
  # --- Second stage (V1B) and the feedback loop ---
  - { ref: RL1B, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1B plate load" }
  - { ref: RK1B, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V1B cathode bias" }
  - { ref: CK1B, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V1B cathode bypass" }
  - { ref: R47, part: "Carbon comp resistor",  value: "47 Ω · ½ W",   role: "V1B cathode tail — the feedback injection point" }
  - { ref: RNFB, part: "Carbon comp resistor", value: "2.7 kΩ · ½ W", role: "Negative feedback, speaker to the 47 Ω tail" }
  # --- Cathodyne phase inverter (V2B) ---
  - { ref: CC1, part: "Coupling capacitor",   value: "0.022 µF",      role: "V1B plate → inverter grid" }
  - { ref: RGPI, part: "Carbon comp resistor", value: "1 MΩ · ½ W",   role: "Inverter grid leak, returned to the tail junction" }
