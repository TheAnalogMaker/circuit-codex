  - { ref: C1,  part: "Coupling capacitor",   value: "0.1 µF · 400 V", role: "Inverter plate → V3 grid" }
  - { ref: C2,  part: "Coupling capacitor",   value: "0.1 µF · 400 V", role: "Inverter cathode → V4 grid" }
  # --- Tremolo oscillator (V2A) — DC point excluded (see notes.md) ---
