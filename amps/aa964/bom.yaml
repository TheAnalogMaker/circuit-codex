  - { ref: CKTO, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "Oscillator cathode bypass" }
  - { ref: CTO1, part: "Film capacitor",      value: "0.02 µF",       role: "Phase-shift cap, plate to the first network node" }
  - { ref: CTO2, part: "Film capacitor",      value: "0.01 µF",       role: "Phase-shift cap, second section" }
  - { ref: CTO3, part: "Film capacitor",      value: "0.01 µF",       role: "Phase-shift cap, third section (to grid)" }
