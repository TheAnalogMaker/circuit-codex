  - { ref: CTOUT2, part: "Coupling capacitor", value: "0.1 µF",       role: "Oscillator output coupling into the intensity control" }
  - { ref: VRINT, part: "Linear potentiometer", value: "250 kΩ-L",    role: "Intensity — taps the bias line" }
  - { ref: JVIB, part: "Jack",               value: "single-pole footswitch", role: "Vibrato pedal — shorts the oscillator grid to ground" }
