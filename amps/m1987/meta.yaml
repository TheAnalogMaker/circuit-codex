sources:
  - desc: "Unicord, Marshall model 1987 factory drawing 70-19-11 (July 1970). Unicord Inc., of Westbury NY, was Marshall's US importer. The title block reads \"MARSHALL 1987\". Supplies the tube complement (three ECC83, V1–V3; two EL34, V4 and V5; a silicon full-wave rectifier and no rectifier tube), every component value, an HT of about 490 V, and the universal mains taps (110/120/200/225/245 V). The drawing annotates two alternative values: V2A's 820 Ω cathode resistor is marked \"(1k)\", and the 47 kΩ feedback resistor has a 100 kΩ variant. The drawing prints no valve-voltage chart. Not reproduced here; archived at Dr. Tube."
    url: "https://www.drtube.com/schematics/marshall/1987u.gif"
  - desc: "Joe Piazza, \"Model 1987 (plexi)\" schematic redraw (1/15/97). A cross-reference. It independently confirms the circuit and the unusual 2.7 kΩ V1B cathode resistor. It differs from the factory drawing on the V1B and V2A cathode bypass capacitors, printing 68 µF where the Unicord drawing reads 0.68 µF; this page uses the factory value. The bypass value is open at DC, so it does not affect the operating point either way."
    url: "https://www.drtube.com/schematics/marshall/1987pljp.gif"
  - desc: "Mullard/Philips, EL34 data sheet, January 1969 (\"A.F. Output Pentode\"). The anchor for the site's open (CC0) EL34 tube model and its octal basing (socket 5903/13): Va = 250 V, Vg2 = 250 V and Vg1 = −13.5 V give Ia = 100 mA, Ig2 = 14.9 mA, gm = 12.5 mA/V and µ(g1-g2) = 11."
    url: "https://frank.pocnet.net/sheets/010/e/EL34.pdf"
verification:
