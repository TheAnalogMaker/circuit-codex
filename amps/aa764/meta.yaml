  - desc: "Fender, \"Champ Amp AA764\" schematic and layout sheets (drawing code I-FD). Supplies every component value, the printed voltage chart, the 320-0-320 V power winding and the transformer part numbers (TR1 125P1B, TR2 125A35A). The sheet's notice: values ±20%, read to ground with an electronic voltmeter. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_AA764_schem.pdf"
  - desc: "Fender, \"Champ-Amp AA764\" layout drawing (drawing code I-FD), the companion sheet to the schematic. Supplies the order of the board's parts and every point-to-point lead, including the 1 MΩ leak mounted on the chassis at input jack 1 and the 15 kΩ leg at the Bass control. It also gives the wire colours: power transformer reds and red/yellow, the 5 V yellows, and the two greens of the 6.3 V winding (one grounded); the output transformer's blue plate lead with a black and yellow secondary; and the brown, blue and white control leads. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_AA764_layout.pdf"
