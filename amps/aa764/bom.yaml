# BOM work.
notes: "One channel across two input jacks (high/low), each with its own 68 kΩ stopper sharing the 1 MΩ leak. V1B's 1.5 kΩ cathode resistor does not go straight to ground: it lands on a 47 Ω leg that carries the 2.7 kΩ negative-feedback return from the speaker jack, and its 25 µF can bypasses only the 1.5 kΩ. Both transformer part numbers are printed on the drawing, which labels them TR1 (125P1B) and TR2 (125A35A); the output transformer's impedance ratio is not. This list numbers them T1 and T2, the archive's convention where a drawing prints no designators of its own: T1 the power transformer, T2 the output transformer. The 125P1B is the power transformer Fender shared across the Champ, the Princeton and the Princeton Reverb, and the HT winding is not annotated the same way on every sheet: this drawing prints 320-0-320 V, while the Princeton AA964 and Princeton Reverb AA1164 sheets print 340-0-340 V for the same part number. Each entry records the figure its own drawing prints."
