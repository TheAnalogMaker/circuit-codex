# Board layout — no factory eyelet-board layout sheet is cited for the Super
# Reverb in this corpus (only the circuit drawing, meta.yaml sources), so this
# arrangement is DERIVED from that schematic rather than read off a published
# layout drawing — board.title carries "(derived)" per docs/layout-schema.md.
# Part refs are the shared key into bom.yaml; the renderer reads each value
# and part type from there. A legible, schematic-style redraw of the board's
# principal netlist-modelled components, in signal-path order — never a trace
# or a dimensioned reproduction of any factory drawing.
#
# The board reads left→right: power supply / rectifier / output at the left
# end, the phase inverter and reverb-driver tubes in the middle, the tremolo
# oscillator (offboard only — see caption), reverb recovery / mix driver, then
# the vibrato and normal preamp stages at the right — mirroring the tube row
# amps/ab763 and amps/ab763-twin both draw for this platform (GZ34 · 6L6GC ·
# 6L6GC · 12AT7 PI · 12AT7 reverb driver · 12AX7 tremolo · 12AX7 mix/recovery
# · 12AX7 vibrato · 12AX7 normal).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo
# oscillator (V5, no static DC point), and the PT/rectifier AC side are an
# excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 68
  title: "AB763 Super Reverb-style · eyelet board layout (derived)"
caption: "Derived from the published SUPER-REVERB-AMP AB763 schematic (meta.yaml) — no factory eyelet-board layout sheet is cited for this circuit, so the board order below follows the circuit's own signal path, matching the tube row amps/ab763 and amps/ab763-twin draw for the same platform. Both channels' tone-stack parts (slope resistors, treble/bass/middle caps and pots, bright caps and switches), the reverb-mix resistors, the tremolo-oscillator network, and the bias-supply parts are documented schematic-only and not placed here, matching amps/ab763's own convention for this platform; small grid stoppers on the output pair ARE drawn, since this drawing carries them and amps/ab763's 6V6GT stage does not. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6L6GC output tubes → 12AT7 PI → 12AT7 reverb driver → 12AX7 tremolo → the two 12AX7 mix/recovery and vibrato/normal preamp tubes) is routed in the same daisy order the sibling entries use; the GZ34 rectifier is indirectly heated from the 5 V winding and off the 6.3 V chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'SUPER-REVERB-AMP AB763' schematic (drawing code C-FD, cited in meta.yaml) — layout DERIVED from that circuit drawing; no factory board-layout sheet for this circuit was located"
  url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_super_reverb_ab763_schematic.pdf"

parts:
  # --- power supply (left end): reservoir, bleeders, filter caps, droppers ---
  - { ref: C10, a: [0, 0], b: [1, 0] }     # 70µF x2 reservoir (post-standby, feeds the choke)
  - { ref: RBL1, a: [0, 1], b: [1, 1] }    # 220k-1W reservoir bleeder
  - { ref: RBL2, a: [0, 2], b: [1, 2] }    # 220k-1W reservoir bleeder
  - { ref: C11, a: [0, 3], b: [1, 3] }     # 20µF filter, node [B] = BP1 (post-choke)
  - { ref: RD1, a: [0, 4], b: [0, 5] }     # 1k-1W dropper BP1→BC
  - { ref: C12, a: [0, 6], b: [1, 6] }     # 20µF filter, node [C] = BC
  - { ref: RD2, a: [0, 7], b: [0, 8] }     # 4.7k-1W dropper BC→BD (chart's own last dropper; no further filter cap)
  # --- output stage (6L6GC pair V7/V8), each with its own grid stopper ---
  - { ref: RS1, a: [0, 11], b: [0, 12] }   # 470Ω-1W V7 screen stopper (BP1→S61)
  - { ref: C1,  a: [0, 13], b: [0, 14] }   # 0.1µF PI hot plate → V7 grid line (PPIA→GB1)
  - { ref: RGL1, a: [0, 14], b: [1, 14] }  # 220k V7 grid leak (GB1→ -52V), shares GB1 eyelet
  - { ref: RST1, a: [0, 14], b: [0, 15] }  # 1.5k V7 grid stopper (GB1→G61), shares GB1 eyelet
  - { ref: RS2, a: [0, 17], b: [0, 18] }   # 470Ω-1W V8 screen stopper (BP1→S62)
  - { ref: C2,  a: [0, 19], b: [0, 20] }   # 0.1µF PI cold plate → V8 grid line (PPIB→GB2)
  - { ref: RGL2, a: [0, 20], b: [1, 20] }  # 220k V8 grid leak (GB2→ -52V), shares GB2 eyelet
  - { ref: RST2, a: [0, 20], b: [0, 21] }  # 1.5k V8 grid stopper (GB2→G62), shares GB2 eyelet
  # --- long-tailed-pair phase inverter (V6 12AT7) ---
  - { ref: RLPA, a: [0, 23], b: [0, 24] }  # 82k-5% hot plate load (BC→PPIA)
  - { ref: RLPB, a: [0, 25], b: [0, 26] }  # 100k-5% cold plate load (BC→PPIB)
  - { ref: RGPA, a: [0, 27], b: [1, 27] }  # 1M hot grid leak (GPIA→JPI)
  - { ref: RGPB, a: [0, 28], b: [1, 28] }  # 1M cold grid leak (GPIB→JPI)
  - { ref: RTAIL, a: [1, 24], b: [1, 25] } # 470Ω tail (KPI→JPI)
  - { ref: RT2,  a: [0, 29], b: [1, 29] }  # 22k tail junction → ground (JPI→0)
  # --- reverb driver (V4 12AT7, both sections paralleled) ---
  - { ref: RGRD, a: [0, 30], b: [1, 30] }  # 1M grid leak (GRD→0)
  - { ref: CKRD, a: [0, 31], b: [0, 32] }  # 25µF cathode bypass (shares KRD eyelet)
  - { ref: RKRD, a: [0, 32], b: [1, 32] }  # 2.2k shared cathode (KRD→0)
  # --- reverb recovery (V3b half) ---
  - { ref: RLR1, a: [0, 43], b: [0, 44] }  # 100k plate load (BD→PR1)
  - { ref: CKR1, a: [0, 45], b: [0, 46] }  # 25µF cathode bypass (shares KR1)
  - { ref: RKR1, a: [0, 46], b: [1, 46] }  # 820Ω cathode (KR1→0)
  # --- mix driver (V3a half) ---
  - { ref: RGD1, a: [1, 47], b: [1, 48] }  # 3.3M grid leak (GD1→0)
  - { ref: RLD1, a: [0, 48], b: [0, 49] }  # 100k plate load (BD→PD1)
  - { ref: CKD1, a: [0, 50], b: [0, 51] }  # 25µF cathode bypass (shares KD1)
  - { ref: RKD1, a: [0, 51], b: [1, 51] }  # 820Ω cathode (KD1→0)
  # --- vibrato channel input (V2a half) ---
  - { ref: RLV1, a: [0, 53], b: [0, 54] }  # 100k plate load (BD→PV1)
  - { ref: CKV1, a: [0, 55], b: [0, 56] }  # 25µF cathode bypass (shares KV1)
  - { ref: RKV1, a: [0, 56], b: [1, 56] }  # 1.5k cathode (KV1→0)
  # --- vibrato channel 2nd stage (V2b half) ---
  - { ref: RLV2, a: [0, 58], b: [0, 59] }  # 100k plate load (BD→PV2)
  - { ref: CKV2, a: [0, 60], b: [0, 61] }  # 25µF cathode bypass (shares KV2)
  - { ref: RKV2, a: [0, 61], b: [1, 61] }  # 820Ω cathode (KV2→0)
  # --- normal channel input (V1a half) ---
  - { ref: RLN1, a: [0, 63], b: [0, 64] }  # 100k plate load (BD→PN1)
  - { ref: CKN1, a: [0, 65], b: [0, 66] }  # 25µF cathode bypass (shares KN1)
  - { ref: RKN1, a: [0, 66], b: [1, 66] }  # 1.5k cathode (KN1→0)

