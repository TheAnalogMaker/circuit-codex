# Board layout — redrawn from the published Fender "SUPER REVERB-AMP AB763"
# LAYOUT drawing (C-FD), cited in meta.yaml. Read from Schematic Heaven's
# 300 ppi scan of that sheet (3299 × 2551, the fourth page of its Super Reverb
# AB763 file), cross-checked against the EL34World capture (2182 × 1394). Part
# refs are the shared key into bom.yaml; the renderer reads each value and part
# type from there. A legible, schematic-style redraw of the board's components
# in the order the drawing shows them — never a trace or a dimensioned
# reproduction.
#
# The board reads left→right along the chassis, above the socket row the sheet
# draws beneath it (GZ34 · 6L6GC · 6L6GC · 12AT7 PI · 12AX7 tremolo · 7025
# recovery+mix · 12AT7 reverb driver · 7025 vibrato · 7025 normal): the rail
# eyelets at the left end, the output couplers, grid leaks and phase-inverter
# plate loads, the PI's feedback and grid network with the mixing node, the
# tremolo phase-shift parts, the recovery/mix stage with its reverb-mix parts,
# the reverb driver and the shared [A] cathode, then each channel's plate
# loads, tone-stack caps and slope resistor. The sheet's parts hang from ground
# eyelets in the top row down to the stage nodes in the bottom row; this redraw
# stands each stage node in the top row and returns the ground end to the bus
# (the house convention), so the order along the board is the sheet's and the
# nets are the sheet's.
#
# Socket pins were read off the sheet's socket drawings, lead by lead:
#   V6 (12AT7 PI): the .001-fed grid is pin 2 and its plate pin 1 carries the
#     82K; the .1-200-fed grid is pin 7 and its plate pin 6 carries the 100K;
#     cathodes 3 and 8 strapped to the 470.
#   V3 (7025): recovery plate pin 1 (+270 V, the .003 eyelet), recovery grid
#     pin 2 (to the reverb input jack); mix plate pin 6 (the .1 eyelet), mix
#     grid pin 7 (from the 470K/220K node); cathodes 3 and 8 on [E].
#   V4 (12AT7 driver): plates 1-6, grids 2-7, cathodes 3-8 strapped; the
#     reverb transformer's BLUE lead to pin 6.
#   V5 (12AX7 tremolo): oscillator plate 1 (+280 V), grid 2, cathode 3
#     (+2.5 V); lamp-driver grid 7 is the phase-shift node between the two .01s.
#   V1/V2 (7025): input stage on 1/2/3 (slope-resistor plate on pin 1), second
#     stage on 6/7/8 (the .047 / .02 plate on pin 6), cathode 8 on [A].
#   6L6GC: BROWN to the left valve's plate, BLUE to the right valve's; each
#     socket carries its own 470 Ω · 1 W (pin 6 tie → screen pin 4) and 1.5 kΩ
#     (pin 1 tie → grid pin 5), drawn here beside the socket.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo
# oscillator (V5, no static DC point), and the PT/rectifier AC side are an
# excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 67
  title: "AB763 Super Reverb-style · eyelet board layout"

# The heater circuits this drawing establishes against the amplifier's own
# sheet — the 5 V rectifier filament only. The source for it is the
# SUPER-REVERB-AMP AB763 schematic, which draws the 5 V winding as an explicit
# two-terminal secondary landing on the rectifier while it only ARROWS the
# 6.3 V chain, "TO ALL 6.3V HEATERS AND PILOT LIGHT". The 6.3 V daisy below
# therefore stays undeclared and the drawing keeps its "not established"
# markers for it.
# This is a READ PENDING, not a missing drawing: the C-FD layout page for this
# circuit is published and is cited in meta.yaml — it is the source for the
# part order and the socket leads read above — but the copy read for this board
# does not resolve the 6.3 V legs socket by socket. Replace this key with a
# full `heaters:` declaration once a copy that does is read.
heaters_pending: >-
  The C-FD layout page for the Super Reverb AB763 is published and is this
  board's source for its part order and socket leads, but the copy read
  (3299 x 2551, cross-checked against a 2182 x 1394 capture) does not resolve
  the 6.3 V heater legs socket by socket, and the circuit drawing only arrows
  the chain "TO ALL 6.3V HEATERS AND PILOT LIGHT". A copy of the layout page
  carrying those legs legibly is what clears these sockets. The 5 V rectifier
  circuit is declared from the circuit drawing, which draws that winding.

heaters:
  - id: h5
    volts: 5.0
    winding: "5 V rectifier-filament secondary"
    grounded_leg: none
    source: >-
      SUPER-REVERB-AMP AB763 schematic (C-FD): TR1's topmost secondary is a
      two-terminal winding whose ends are the GZ34's two heater connections,
      with +465 V taken from the end carrying the cathode (the 470 Ω 1 W bias
      tap leaves the same node). The GZ34's cathode is strapped to the heater
      at pin 8 inside the envelope — Mullard letters that pin "h,k", GE prints
      "Pin 8 — Heater and Cathode" — so the winding lands on pins 2 and 8, the
      B+ leaves on 8, and neither leg is grounded because the winding floats at
      B+ with the cathode. The sibling Deluxe Reverb's own layout page (C-FD)
      letters exactly this pair YELLOW to pins 2 and 8, which is how the
      platform is built; the pin identities here rest on the valve's datasheet
      and this amplifier's own schematic, not on that sibling sheet.
    sockets:
      V9: { feed: [2], return: [8] }   # GZ34 — 5 V across the two heater pins, B+ out of 8
caption: "Redrawn from the published Fender 'SUPER REVERB-AMP AB763' layout drawing (C-FD) — the board's components in the order the drawing shows them, above the socket row it draws beneath the board: GZ34 · two 6L6GC · 12AT7 phase inverter · 12AX7 tremolo · 7025 reverb recovery and mix · 12AT7 reverb driver · vibrato 7025 · normal 7025. Both channels' tone stacks, the reverb send and reverb-mix parts, the tremolo's phase-shift parts and the phase inverter's input and feedback parts are drawn where the sheet mounts them, and the controls sit in the control row above the board in the sheet's order. Each output valve's 470 Ω · 1 W screen resistor and 1.5 kΩ grid stopper are drawn beside its socket, where the sheet mounts them. Not on the board, as the sheet shows: the filter cans, reservoir bleeders, rail droppers and choke in the chassis; the bias rectifier and filter in the bias sub-box, and the 27 kΩ bias leg on the bias control; the 100 kΩ speed resistor on the Speed control and the 6.8 kΩ bleed on the Normal Bass control; the bright capacitors at their switches; the 68 kΩ stoppers and 1 MΩ leaks at the input jacks; the 220 kΩ recovery grid leak at the reverb jacks; and the tremolo's neon-and-photoresistor optocoupler, which is not drawn. The feedback node's 100 Ω to ground, the second 220 kΩ into the phase inverter's mixing node and the whole tremolo group are drawn where the sheet mounts them: the oscillator's 220 kΩ plate load and .02 / .01 / .01 ladder, the two 1 MΩ and the 2.2 MΩ from the bias supply meeting at the footswitch junction, and the lamp driver's 10 MΩ, neon feed resistor, cathode resistor and bypass capacitor. The GZ34's own 5 V filament winding is drawn as the schematic shows it — a two-terminal secondary landing on the rectifier's heater pins 2 and 8, the B+ leaving pin 8 beside it (the rectifier is indirectly heated, but its cathode is strapped to the heater inside the envelope). The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6L6GC output tubes → 12AT7 PI → 12AT7 reverb driver → 12AX7 tremolo → the two 12AX7 mix/recovery and vibrato/normal preamp tubes) is drawn in the daisy order the sibling entries use and is NOT established here: the sheet arrows it \"TO ALL 6.3 VOLT HEATERS\". Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'SUPER REVERB-AMP AB763' LAYOUT drawing (C-FD, Fender Electric Instrument Company, Fullerton) — read from Schematic Heaven's 300 ppi scan (3299 × 2551), cross-checked against the EL34World capture (2182 × 1394)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_reverb_ab763_layout.pdf"

# Electrolytic lead declarations: see docs/electrolytic-polarity.md for the
# source crop register and the unresolved DC checks. a/b name actual terminals.
parts:
  # --- output couplers, bias grid leaks and PI plate loads (the sheet's first
  #     group, right of the rail eyelets). The sheet stands the two .1s at the
  #     outer columns with the 220K/5% leaks and the 100K/82K loads fanning
  #     between them to a bias node and a +450 V node.
  - { ref: C2,   a: [1, 3], b: [0, 3] }    # .1 PI pin-6 plate → grid line GB2
  - { ref: RLPB, a: [0, 4], b: [1, 4] }    # 100k 5% plate load (BC → PPIB), sheet: to PI pin 6
  - { ref: RGL2, a: [1, 5], b: [0, 5] }    # 220k 5% grid leak (−52 V → GB2)
  - { ref: RGL1, a: [1, 6], b: [0, 6] }    # 220k 5% grid leak (−52 V → GB1)
  - { ref: RLPA, a: [0, 7], b: [1, 7] }    # 82k 5% plate load (BC → PPIA), sheet: to PI pin 1
  - { ref: C1,   a: [1, 8], b: [0, 8] }    # .1 PI pin-1 plate → grid line GB1
  # --- phase inverter: feedback node, grid leaks, tail, input coupling ------
  - { ref: RNFB, a: [1, 9], b: [0, 9] }    # 820 feedback from the speaker → node F
  - { ref: CPIB, a: [0, 10], b: [1, 10] }  # .1-200 node F → PI pin-7 grid
  - { ref: RGPB, a: [0, 11], b: [1, 11] }  # 1M tail junction → pin-7 grid
  - { ref: RT2,  a: [0, 11], b: [0, 10] }  # 22k tail, tail junction → node F (the drawing lands the tail on the feedback node)
  # --- mixing corner, as the layout page draws it: the Normal .047's 220K from
  #     boxed X and the mix driver's 220K from boxed Y meet at the node the .001
  #     leaves for the pin-2 grid; the feedback node's 100 stands beside them --
  - { ref: RMIXV, a: [0, 17], b: [0, 16] }  # 220k mix-driver output (boxed Y, the .1's far side) → mixing node
  - { ref: RFB1, a: [0, 18], b: [1, 18] }  # 100 node F → ground (the layout's '100' along the board's top edge)
  # --- tremolo (V5 12AX7), as the layout page mounts it: the lamp driver's
  #     100k || 25 cathode, the 10M and the neon feed 100k under the optocoupler's
  #     eyelets (the optocoupler itself is not drawn), the +460 V eyelet, the
  #     220k plate load, the .02 / .01 / .01 ladder, the two 1M and the 2.2M
  #     meeting at the footswitch junction, then the oscillator's 2700 || 25 ------
  - { ref: RKTO2, a: [0, 19], b: [1, 19] }  # 100k lamp-driver cathode (pin 8) → ground
  # Polarity: printed '+' on the cited source; source '+' at CKTO2.a; DC check remains undecided (CKTO2.a: reaches only ground, through RKTO2).
  - { ref: CKTO2, a: [0, 20], b: [1, 20] , plus: a }  # 25 µF lamp-driver cathode bypass
  - { ref: RTO10, a: [0, 21], b: [1, 21] }  # 10M lamp-driver plate (pin 6, the lamp's first lead) → +460 V
  - { ref: RLAMP, a: [0, 22], b: [1, 22] }  # 100k the neon lamp's second lead → +460 V
  - { ref: RTO2,  a: [1, 22], b: [1, 25] }  # 220k +460 V → oscillator plate (pin 1)
  - { ref: CTO1,  a: [1, 25], b: [0, 25] }  # .02 oscillator plate → Speed node
  - { ref: CTO2,  a: [0, 25], b: [0, 26] }  # .01 Speed node → lamp-driver grid node (pin 7)
  - { ref: CTO3,  a: [0, 26], b: [1, 26] }  # .01 lamp-driver grid node → oscillator grid (pin 2)
  - { ref: RTOG1, a: [0, 26], b: [0, 27] }  # 1M lamp-driver grid node → footswitch junction
  - { ref: RTOG2, a: [1, 26], b: [1, 27] }  # 1M oscillator grid → footswitch junction
  - { ref: RTOG3, a: [0, 28], b: [0, 27] }  # 2.2M bias filter node (the 10K-L's end lug) → footswitch junction
  # Polarity: printed '+' on the cited source; source '+' at CKTO1.a; DC check remains undecided (CKTO1.a: reaches only ground, through RKTO1).
  - { ref: CKTO1, a: [0, 29], b: [1, 29] , plus: a }  # 25 µF oscillator cathode bypass
  - { ref: RKTO1, a: [0, 30], b: [1, 30] }  # 2700 oscillator cathode (pin 3) → ground
  - { ref: RTAIL, a: [1, 13], b: [0, 13] } # 470 cathodes → tail junction
  - { ref: RGPA, a: [1, 14], b: [0, 14] }  # 1M tail junction → pin-2 grid
  - { ref: RMD1, a: [0, 15], b: [0, 16] }  # 220k Normal-channel .047 (boxed X) → mixing node
  - { ref: CPIA, a: [0, 16], b: [1, 16] }  # .001 mixing node → pin-2 grid
  # --- tremolo oscillator: plate load and phase-shift ladder -----------------
  # --- recovery/mix stage: tremolo cathode, [E], reverb mix, couplers, loads --
  # Polarity: printed '+' on the cited source; lead CKE.a: KE = +2.2 V (op-points); lead CKE.b: 0 = +0.0 V (ground); more-positive lead is CKE.a.
  - { ref: CKE,  a: [0, 31], b: [1, 31] , plus: a }  # 25 µF bypass, SHARED [E] cathode
  - { ref: RKE,  a: [0, 32], b: [1, 32] }  # 820 cathode SHARED by recovery + mix driver
  - { ref: RMR,  a: [0, 33], b: [0, 34] }  # 470k Reverb-control wiper → mix grid node
  - { ref: RMR2, a: [0, 34], b: [1, 34] }  # 220k mix grid node → ground
  - { ref: RGD1, a: [0, 35], b: [1, 35] }  # 3.3M mix grid ← boxed Z (the dry node), in parallel with the 10 pF, as the sheet draws it
  - { ref: CBD1, a: [0, 35], b: [0, 36] }  # 10 pF mix grid node ← boxed Z, in parallel with the 3.3M
  - { ref: CCD1, a: [1, 37], b: [0, 37] }  # mix plate coupler → tremolo node (Intensity top)
  - { ref: RLD1, a: [0, 38], b: [1, 38] }  # 100k mix plate load (BD → PD1)
  - { ref: RLR1, a: [0, 39], b: [1, 39] }  # 100k recovery plate load (BD → PR1)
  - { ref: CCR1, a: [1, 40], b: [0, 40] }  # .003 recovery plate → Reverb control top
  # --- reverb driver cathode, shared [A], driver grid, reverb send -----------
  # Polarity: printed '+' on the cited source; lead CKRD.a: KRD = +9.1 V (op-points); lead CKRD.b: 0 = +0.0 V (ground); more-positive lead is CKRD.a.
  - { ref: CKRD, a: [0, 41], b: [1, 41] , plus: a }  # 25 µF reverb-driver cathode bypass
  - { ref: RKRD, a: [0, 42], b: [1, 42] }  # 2200 reverb-driver cathode
  # Polarity: printed '+' on the cited source; lead CKA.a: KA = +2.2 V (op-points); lead CKA.b: 0 = +0.0 V (ground); more-positive lead is CKA.a.
  - { ref: CKA,  a: [0, 43], b: [1, 43] , plus: a }  # 25 µF bypass, SHARED [A] cathode
  - { ref: RKA,  a: [0, 44], b: [1, 44] }  # 820 cathode SHARED by both second stages
  - { ref: RGRD, a: [0, 45], b: [1, 45] }  # 1M reverb-driver grid leak
  - { ref: CRS,  a: [0, 46], b: [0, 47] }  # 500 pF driver grids ← the dry node (boxed Z), after the .02
  - { ref: CCV2, a: [1, 47], b: [0, 47] }  # .02 Vibrato 2nd-stage plate → boxed Z
  # --- vibrato channel: plate loads, treble cap, slope resistor, stack caps ---
  - { ref: RLV2, a: [0, 48], b: [1, 48] }  # 100k 2nd-stage plate load (BD → PV2)
  - { ref: RLV1, a: [0, 49], b: [1, 49] }  # 100k input plate load (BD → PV1)
  - { ref: CTV,  a: [1, 50], b: [0, 50] }  # 250 pF input plate → Treble top
  - { ref: RSV,  a: [1, 50], b: [1, 53] }  # 100k slope resistor
  - { ref: CBV2, a: [1, 53], b: [0, 53] }  # .022 slope node → Middle
  - { ref: CBV,  a: [1, 54], b: [0, 54] }  # .1 slope node → Bass
  # --- the two input-stage cathodes on one ground column ----------------------
  # Polarity: printed '+' on the cited source; lead CKV1.a: KV1 = +2.1 V (op-points); lead CKV1.b: 0 = +0.0 V (ground); more-positive lead is CKV1.a.
  - { ref: CKV1, a: [0, 55], b: [1, 55] , plus: a }  # 25 µF Vibrato input cathode bypass
  - { ref: RKV1, a: [0, 56], b: [1, 56] }  # 1500 Vibrato input cathode
  # Polarity: printed '+' on the cited source; lead CKN1.a: KN1 = +2.1 V (op-points); lead CKN1.b: 0 = +0.0 V (ground); more-positive lead is CKN1.a.
  - { ref: CKN1, a: [0, 57], b: [1, 57] , plus: a }  # 25 µF Normal input cathode bypass
  - { ref: RKN1, a: [0, 58], b: [1, 58] }  # 1500 Normal input cathode
  # --- normal channel: output coupler, plate loads, treble cap, stack --------
  - { ref: CCN2, a: [1, 59], b: [0, 59] }  # .047 2nd-stage plate → boxed X (the 220k at the mixing node)
  - { ref: RLN2, a: [0, 60], b: [1, 60] }  # 100k 2nd-stage plate load (BD → PN2)
  - { ref: RLN1, a: [0, 61], b: [1, 61] }  # 100k input plate load (BD → PN1)
  - { ref: CTN,  a: [1, 62], b: [0, 62] }  # 250 pF input plate → Treble top
  - { ref: RSN,  a: [1, 62], b: [1, 65] }  # 100k slope resistor
  - { ref: CBN2, a: [1, 65], b: [0, 65] }  # .022 slope node → Bass bottom (the 6800 on the pot)
  - { ref: CBN,  a: [1, 66], b: [0, 66] }  # .1 slope node → Bass top / Treble bottom

