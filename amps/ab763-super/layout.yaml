# Ground bus — the bare rail just below the bottom eyelet row; cathode,
# grid-leak and control grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 62.5] }

# Wiring — read lead-by-lead from the published layout drawing, with the
# schematic settling topology where a lead runs under the board (dashed on the
# sheet) or across a boxed-letter link ([D], [X], [Y], [Z]). Transformer leads
# carry the drawing's colours.
runs:
  # === power transformer HT → GZ34 rectifier (annotation layer) =============
  # The two YELLOW leads are the 5 V rectifier-filament winding. The GZ34 is
  # indirectly heated but its cathode is strapped to the heater at pin 8, so the
  # winding lands on pins 2 and 8 and the B+ lead leaves pin 8 beside it.
  - { from: T1.red1, to: V9.pin4, via: [[1.5, 0.32]] }
  - { from: T1.red2, to: V9.pin6, via: [[2.7, 0.58]] }
  - { from: T1.red-yellow, to: [1.45, 1.4], via: [[0.5, 1.25]] }
  - { from: T1.yellow1, to: V9.pin2, via: [[0.55, 1.45], [1.1, 2.15]] }
  - { from: T1.yellow2, to: V9.pin8, via: [[-0.15, 1.85], [0.5, 2.68], [3.1, 2.68]] }
  - { from: V9.pin8, to: [0, 0], color: red, via: [[1.6, 1.2]] }

  # === rails: +465 V → choke → +460 V [B] → droppers → +450 V [C], +410 V [D]
  - { from: [0, 0], to: T2.1, color: red }
  - { from: T2.2, to: [0, 1], color: red, via: [[0.534, -0.538]] }
  - { from: [0, 1], to: RD1.a, color: red, via: [[1, -0.62], [8.8, -0.62]] }
  - { from: T3.red, to: [0, 1], color: red, via: [[3.4, -0.45], [1.3, -0.45]] }
  - { from: RD1.b, to: RD2.a }
  - { from: RD1.b, to: RLPB.a, via: [[9.6, -0.48], [4.6, -0.48]] }
  - { from: RLPB.a, to: RLPA.a, via: [[4, -0.28], [7, -0.28]] }
  - { from: RD2.b, to: RLD1.a, color: red, via: [[11.8, -0.52], [34, -0.52]] }
  - { from: RLD1.a, to: RLR1.a }
  - { from: RLR1.a, to: RLV2.a, color: red, via: [[35, -0.52], [44, -0.52]] }
  - { from: RLV2.a, to: RLV1.a }
  - { from: RLV1.a, to: RLN2.a, color: red, via: [[45, -0.52], [56, -0.52]] }
  - { from: RLN2.a, to: RLN1.a }
  # +460 V [B] to the screens, the tremolo plate load and the reverb transformer
  - { from: [0, 1], to: RS1.a, color: red, via: [[1.4, 0.611], [1.169, 1.62], [3.6, 1.62]] }
  - { from: RS1.a, to: RS2.a, color: red, via: [[4.2, 1.6], [8.7, 1.6]] }
  - { from: RS2.a, to: RTO2.a, color: red, via: [[9.3, 1.6], [17.084, 1.62]] }
  - { from: RTO2.a, to: T4.red, color: red, via: [[18.4, 1.28], [30.668, 1.138], [44.83, 1.38]] }

  # === output stage: grid lines, socket-mounted stoppers and screens ========
  - { from: RLPB.b, to: C2.a }
  - { from: C2.b, to: RGL2.b, via: [[3, -0.14], [5, -0.14]] }
  - { from: RGL2.a, to: RGL1.a }
  - { from: RGL1.b, to: C1.b, via: [[6, -0.14], [8, -0.14]] }
  - { from: RLPA.b, to: C1.a }
  - { from: RGL2.a, to: VRBIAS.lug2, via: [[5.5, 0.85], [5.5, -0.6], [5, -0.75]] }
  - { from: RGL1.b, to: RST1.b, via: [[6.5, 0.3], [6.5, 1.3], [8.09, 1.3]] }
  - { from: C2.b, to: RST2.b, via: [[3.5, 0.3], [3.5, 1.2], [13.36, 1.2]] }
  - { from: RST1.a, to: V7.pin5 }
  - { from: RST2.a, to: V8.pin5 }
  - { from: RS1.b, to: V7.pin4 }
  - { from: RS2.b, to: V8.pin4 }
  - { from: V7.pin8, to: [1.45, 6.7], via: [[6.7, 1.8]] }
  - { from: V8.pin8, to: [1.45, 11.8], via: [[11.8, 1.8]] }
  - { from: T3.brown, to: V7.pin3, via: [[2.739, -0.228], [2.577, 0.919], [3.3, 1.3], [5, 1.3], [5.2, 1.7]] }
  - { from: T3.blue, to: V8.pin3, via: [[3.7, -0.56], [9.5, -0.56], [9.5, 1.7]] }
  - { from: T3.green, to: SPK.tip, via: [[4, -0.4], [17.4, -0.4], [17.4, 1.9]] }
