# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The tremolo oscillator tube is a running phase-shift oscillator with no
  # static DC operating point (excluded from netlist.cir — see notes.md), so
  # it cannot be a quiescent stage the equivalence check verifies. Declared
  # here so its socket is an annotation-layer exclusion (printed loudly, like
  # the rectifier), never a silently-dropped tube: an UNdeclared unmodelled
  # signal tube still hard-fails.
  excluded_tubes:
    V5: "12AX7 tremolo oscillator — a phase-shift oscillator with no static DC operating point (excluded from netlist.cir). Its phase-shift parts are drawn on the board as the layout sheet mounts them; no signal pin is DC-checked. Its 6.3 V heater is on the twisted chain."
  anchors:
    T3.red:   BP1    # OT primary centre tap → BP1
    T3.blue:  BP1    # OT primary, V8 plate lead → BP1
    T3.brown: BP1    # OT primary, V7 plate lead → BP1
    T4.red:   BP1    # reverb-transformer primary, B+ side → BP1 (feeds V4 via the primary DCR, RTR4)
    SPK.tip: "0"     # speaker jack — OT-secondary DCR folded into ground (NFB return reads as ground at DC)
  # DC-transparent parts the netlist omits (no discrete board resistor here):
  netlist_unplaced:
    RTR4: "reverb transformer T4 primary DCR (~200Ω) — the winding, not a discrete board resistor; its BP1 lead anchors above and its plate lead lands on the paralleled V4 plates (PRD)"
    RGN1: "1M normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV1: "1M vibrato-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV2: "vibrato volume pot VRVV — the netlist models its DC grid return as one grid-leak (GV2→0); the pot itself is off-board (top edge)"
    RGN2: "normal volume pot VRVN — the netlist models its DC grid return as one grid-leak (GN2→0); the pot itself is off-board (top edge)"
    RGRV: "reverb-recovery grid return (bom ref RGR1) — the layout sheet mounts this 220 kΩ at the reverb jacks, not on the eyelet board"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate).
  not_on_board:
    RTO1: "100 kΩ speed-network series resistor — the Super Reverb AB763 layout letters '100K' inside the Speed 3.0M-RA pot's outline: mounted at the pot, not on the eyelet board"
    RSLN: "6.8 kΩ normal-channel bleed — the Super Reverb AB763 layout letters '6800' inside the Normal channel's Bass 250K-A pot outline: mounted on the pot, not on the eyelet board"
    DBIAS: "bias rectifier diode — the Super Reverb AB763 layout draws it in the small bias sub-box (470-1W → diode → 25|50 cap) beside the pilot light, not on the main eyelet board"
    RBIAS: "470 Ω bias feed — the '470-1W' in the Super Reverb AB763 layout's bias sub-box, not on the main eyelet board"
    CBIAS: "bias filter — the '25|50' can in the Super Reverb AB763 layout's bias sub-box, not on the main eyelet board"
    RGR1: "220 kΩ reverb-recovery grid leak — the Super Reverb AB763 layout draws it at the reverb jacks, from the recovery-grid lead to a ground lug, not on the eyelet board"
    RBIAS2: "27 kΩ bias-divider leg — the Super Reverb AB763 layout letters '27K' inside the 10K-L bias control's outline, from one end of that control to its ground tab, and the schematic draws the same leg with the control's wiper as the −52 V line: a resistor mounted on the control, not on the eyelet board (the layout carries no 27K in its tremolo)"

# Board-scope rules for the sheet ↔ board gate: parts the sheet draws that
# this board deliberately does not, by designator glob, each with where the
# cited layout drawing mounts them.
scope:
  not_drawn:
    - { match: "CBR[NV]", why: "120 pF bright caps — the Super Reverb AB763 layout letters '120PF' at each channel's BRIGHT switch: at the switch, not on the eyelet board" }
    - { match: "R[12][nv]", why: "68 kΩ input grid stoppers — the Super Reverb AB763 layout hangs a 68K pair from each channel's jacks beside the 1 MΩ leak: at the jacks, not on the eyelet board" }
    - { match: "C1[0-3]", why: "the filter cans (the 70 µF series pair and the two 20 µF · 525 V) — not on the eyelet board and not drawn anywhere on the Super Reverb AB763 layout sheet: its rail eyelets at the board's left end run by leads to chassis holes" }
    - { match: "RBL[12]", why: "220 kΩ · 1 W reservoir balancing resistors — not on the eyelet board and not drawn anywhere on the Super Reverb AB763 layout sheet, like the series filter pair they belong with" }
