# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak, and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 66.5] }

# Wiring — read lead-by-lead in netlist node order (no factory layout drawing
# to read from — see caption). Transformer leads carry the drawing's colours.
# The 6.3 V heater winding is the green pair; it feeds the pilot lamp then
# daisy-chains socket to socket (style: twisted), skipping the indirectly
# 5V-heated GZ34. Endpoints reference board eyelets (REF.a/REF.b), tube socket
# pins (Vn.pinN, validated against the basing data — heater pins on the
# twisted runs), pot lugs, jacks, off-board 2-lead parts, and transformer
# leads.
runs:
  # === power transformer HT → GZ34 rectifier → reservoir (annotation layer) ===
  - { from: T1.red1, to: V9.pin4, via: [[1.5, 0.32]] }
  - { from: T1.red2, to: V9.pin6, via: [[2.7, 0.58]] }
  - { from: T1.red-yellow, to: [1.45, 1.4], via: [[0.5, 1.25]] }  # HT centre tap → ground
  - { from: V9.pin8, to: C10.a, color: red, via: [[1.6, 1.2]] }   # B+ out → reservoir

  # === reservoir bleeders + choke → BP1 (node [B], post-choke) ================
  - { from: C10.a, to: RBL1.a }
  - { from: RBL1.a, to: RBL2.a }
  - { from: RBL2.a, to: T2.1, color: red, via: [[2.4, 0.4], [3.3, 0.4]] }
  - { from: T2.2, to: C11.a, color: red, via: [[2.6, 0.25], [4.5, 0.25]] }
  - { from: C11.a, to: RD1.a }
  - { from: RD1.b, to: C12.a }
  - { from: C12.a, to: RD2.a }

  # === BP1 net: plates, screens, reverb driver, tremolo osc plate load ========
  # T4 chains through T3 rather than diving to C11.a independently, so only two
  # distinct deep lanes (RS1.a's own, and this chain's) ever reach the cap —
  # each at its own row, well clear of the BC/BD deep lanes below.
  - { from: T4.red, to: C11.a, color: red, via: [[32.9, 4.9], [4.6, 4.9], [4.6, 1.0]] }   # reverb-trans primary → BP1, own deep lane (independent — not chained)
  - { from: T3.red, to: C11.a, color: red, via: [[17.4, 4.3], [5.6, 4.3], [5.6, 1.0]] }   # OT centre tap → BP1, own deep lane (independent — not chained)
  - { from: T3.red, to: RS1.a, color: red, via: [[15.0, 0.75], [11.9, 0.75]] }              # OT centre tap → screen node, shallow lane, well clear of the above
  - { from: RS2.a, to: RS1.a, color: red, via: [[18, 0.5], [10.5, 0.5]] }                 # screen backbone
  - { from: RS1.a, to: C11.a, color: red, via: [[11.5, 3.0], [3.4, 3.0], [3.4, 1.0]] }    # screen node → BP1
  - { from: T3.blue, to: V7.pin3, via: [[15, 3.2], [12.5, 3.2]] }    # OT primary → V7 plate
  - { from: T3.brown, to: V8.pin3, via: [[20.6, 3.35], [17.6, 3.35]] }
  - { from: T3.green, to: SPK.tip, via: [[16.2, 0.85]] }
  - { from: SPK.sleeve, to: [1.45, 21.4] }                           # (NFB return reads as ground at DC)

  # === BC net (node [C]): PI plate loads, reverb-driver plate feed =============
  - { from: C12.a, to: RLPA.a, via: [[8.5, 2.4], [22.6, 2.4]] }        # BC filter → PI hot plate load, clear of C12.b's own column
  - { from: RLPA.a, to: RLPB.a, via: [[23.5, 0.4], [24.5, 0.4]] }        # backbone hop
  - { from: RLPB.a, to: RD2.a, via: [[25.5, 0.9], [9.6, 0.9]] }          # BC backbone → dropper input (own lane, clear of the screen backbone at 0.5)

  # === BD net (node [D]): every 100k preamp plate load =========================
  - { from: RD2.b, to: RLR1.a, via: [[9.8, 0.6], [9.8, 4.2], [43.4, 4.2]] }   # BD dropper → reverb-recovery plate load (own deep lane, well clear of every tube's pin ring above it)
  - { from: RLR1.a, to: RLD1.a, via: [[44.5, 0.4], [47.5, 0.4]] }             # backbone hop
  - { from: RLD1.a, to: RLV1.a, via: [[49.5, 2.28], [53.4, 2.28]] }           # → vibrato-input plate load
  - { from: RLV1.a, to: RLV2.a, via: [[54.5, 0.4], [57.5, 0.4]] }             # backbone hop
  - { from: RLV2.a, to: RLN1.a, via: [[59.5, 2.28], [63.4, 2.28]] }           # → normal-input plate load

  # === -52V bias rail: the two 6L6GC grid leaks tie together, fed off the ======
  # bias-supply pot's wiper (the rectifier/filter feeding it is off-board, an
  # annotation layer like the PT+rectifier+reservoir front end — VBIAS is an
  # ideal source in netlist.cir, same treatment as BP1).
  - { from: RGL1.b, to: RGL2.b, via: [[14.4, 1.15], [20.6, 1.15]] }
  - { from: RGL1.b, to: VRBIAS.lug2, via: [[14.4, -0.5], [9.3, -0.5]] }

  # === filter-can negatives → ground bus ========================================
  - { from: C10.b, to: [1.45, 0] }
  - { from: C11.b, to: [1.45, 3] }
  - { from: C12.b, to: [1.45, 6] }

  # === output stage: 6L6GC screens, grids (GB1/GB2 → stoppers), cathodes =======
  - { from: RS1.b, to: V7.pin4, via: [[11.9, 1.62]] }               # screen stopper → V7 screen
  - { from: RS2.b, to: V8.pin4, via: [[17.9, 1.62]] }               # screen stopper → V8 screen
  - { from: C1.b, to: RST1.a }                                      # coupler + grid leak + stopper share GB1
  - { from: C2.b, to: RST2.a }                                      # coupler + grid leak + stopper share GB2
  - { from: RST1.b, to: V7.pin5, via: [[14.9, 1.5]] }               # stopper → V7 grid (G61)
  - { from: RST2.b, to: V8.pin5, via: [[20.9, 1.5]] }               # stopper → V8 grid (G62)
  - { from: V7.pin8, to: [1.45, 12.5], via: [[12.4, 1.7]] }         # V7 cathode → ground
  - { from: V8.pin8, to: [1.45, 18.5], via: [[18.4, 1.7]] }         # V8 cathode → ground

  # === phase inverter: plates→couplers, cathodes→tail, grid leaks→junction =====
  # The four signal pins each get their own row (1.3/1.6/1.9/2.2), well spread,
  # so none of the four short approaches reads as parallel to a neighbour.
  - { from: RLPA.b, to: V6.pin6, via: [[24.7, 1.3]] }               # hot plate load → V6 plate (PPIA)
  - { from: V6.pin6, to: C1.a, via: [[25.0, 2.7], [9.5, 2.7], [9.5, 0.6]] } # PPIA → hot coupler (own deep lane, final approach well clear of V7's cathode drop)
  - { from: RLPB.b, to: V6.pin1, via: [[25.3, 1.6]] }               # cold plate load → V6 plate (PPIB)
  - { from: V6.pin1, to: C2.a, via: [[23.6, 3.6], [16.0, 3.6], [16.0, 0.6]] } # PPIB → cold coupler (own deep lane, final approach well clear of V8's cathode drop)
  - { from: RGPA.a, to: V6.pin7, via: [[28.4, 1.75]] }
  - { from: RGPB.a, to: V6.pin2, via: [[27.4, 2.2]] }               # cold grid leak → V6 grid (GPIB)
  - { from: V6.pin8, to: RTAIL.a, via: [[25.4, 2.6], [23.5, 2.6], [23.5, 1.5]] } # V6 cathode(u1) → tail (KPI)
  - { from: V6.pin3, to: RTAIL.a, via: [[24.3, 1.85]] }             # V6 cathode(u2) → tail (KPI)
  - { from: RTAIL.b, to: RT2.a, via: [[25.4, 1.4], [26.5, 1.1]] }   # tail → junction (JPI)
  - { from: RGPA.b, to: RT2.a, via: [[28.0, 1.55]] }                # hot grid leak → junction
  - { from: RGPB.b, to: RT2.a, via: [[33.5, 2.0], [31.5, 1.5]] }    # cold grid leak → junction, clear of RGPA's approach to pin7
  - { from: RT2.b, to: [1.45, 29] }                                 # tail 22k → ground

  # === reverb driver V4 (paralleled): plates, grids, cathodes ==================
  - { from: V4.pin6, to: V4.pin1, via: [[31.3, 2.7]] }              # tie the two plates (PRD)
  - { from: V4.pin1, to: T4.blue, via: [[32.6, 2.36], [33.0, 2.36]] } # plates → reverb-trans primary (PRD)
  - { from: V4.pin7, to: V4.pin2, via: [[31.5, 2.5], [31.5, 3.2]] }
  - { from: V4.pin7, to: RGRD.a, via: [[32.0, 2.0], [30.7, 1.4]] }  # grids → 1M leak
  - { from: RGRD.b, to: [1.45, 30.2] }                              # grid leak → ground
  - { from: V4.pin8, to: RKRD.a, via: [[35.0, 2.0]] }               # cathode(u1) → 2.2k
  - { from: V4.pin3, to: RKRD.a, via: [[31.2, 1.4]] }               # cathode(u2) → 2.2k
  - { from: CKRD.a, to: [1.45, 31] }                                # bypass → ground
  - { from: RKRD.b, to: [1.45, 32.4], via: [[32.2, 1.5]] }          # 2.2k → ground
  - { from: T4.green, to: [1.45, 35.4] }                            # reverb-trans secondary → tank (annotation)

  # === reverb recovery V3b (unit2 of V3): plate, grid, cathode =================
  # V3's socket splits its two triode halves left/right (pins 1/2/3 face the
  # LOW-column side, 6/7/8 the HIGH-column side — reference/tubes/12ax7.yaml
  # basing). Reverb recovery's own board parts (RLR1/CKR1/RKR1) sit at the
  # LOWER columns, so it takes unit 2 (pins 1/2/3) — the side that actually
  # faces them — rather than sweeping wires across the socket to the far side.
  - { from: RLR1.b, to: V3.pin1, via: [[43.5, 3.4], [45.2, 3.4]] }  # plate load → V3 plate (PR1), approaches from below (pin1's own side)
  - { from: V3.pin2, to: VRREV.lug2, via: [[44.5, 0.7], [45.9, -0.5]] } # recovery grid ← reverb pot wiper (leaves level with pin2, then up)
  - { from: V3.pin3, to: RKR1.a, via: [[47.5, 1.9]] }               # cathode → 820Ω (KR1)
  - { from: CKR1.a, to: [1.45, 45] }                                # bypass → ground
  - { from: RKR1.b, to: [1.45, 46], via: [[46.3, 1.5]] }            # 820Ω → ground

  # === mix driver V3a (unit1 of V3): plate, grid, cathode ======================
  # Its own board parts (RGD1/RLD1/CKD1/RKD1) sit at the HIGHER columns, so it
  # takes unit 1 (pins 6/7/8) — the side facing them.
  - { from: RLD1.b, to: V3.pin6, via: [[49.9, 1.0]] }               # plate load → V3 plate (PD1), stays above (pin6's own side)
  - { from: RGD1.a, to: V3.pin7, via: [[52, 1.3]] }                 # 3.3M grid leak → V3 grid (GD1), routed clear of pin1/2/3
  - { from: RGD1.b, to: [1.45, 48] }                                # grid leak → ground
  - { from: V3.pin8, to: RKD1.a, via: [[50.6, 2.8]] }               # cathode → 820Ω (KD1), single clean dip
  - { from: CKD1.a, to: [1.45, 50] }                                # bypass → ground
  - { from: RKD1.b, to: [1.45, 53], via: [[53, 1.4]] }              # 820Ω → ground

  # === vibrato input V2a (unit2 of V2): plate, grid, cathode ====================
  # Same left/right socket split as V3 above: V2a's own board parts (RLV1/
  # RKV1/CKV1) sit at the LOWER columns, so it takes unit 2 (pins 1/2/3).
  - { from: RLV1.b, to: V2.pin1, via: [[53.5, 3.4], [55.2, 3.4]] }  # plate load → V2 plate (PV1), approaches from below (pin1's own side)
  - { from: JV.tip, to: V2.pin2, via: [[53.0, -0.6], [52.0, 1.6], [52.0, 2.02]] } # jack → V2a grid (GV1), level final approach clear of pin3
  - { from: V2.pin3, to: RKV1.a, via: [[53.3, 2.35]] }              # cathode → 1.5k (KV1)
  - { from: CKV1.a, to: [1.45, 55] }
  - { from: RKV1.b, to: [1.45, 56] }                                # 1.5k → ground

  # === vibrato 2nd stage V2b (unit1 of V2): plate, grid, cathode ================
  # Its own board parts (RLV2/RKV2/CKV2) sit at the HIGHER columns, so it
  # takes unit 1 (pins 6/7/8) — the side facing them.
  - { from: RLV2.b, to: V2.pin6, via: [[59.9, 1.6]] }               # plate load → V2 plate (PV2)
  - { from: VRVV.lug2, to: V2.pin7, via: [[57, -0.55], [57.5, -0.55], [57.0, 1.6]] }
  - { from: V2.pin8, to: RKV2.a, via: [[58.0, 2.9], [58.0, 0.6]] }  # cathode → 820Ω (KV2), avoids RKV2.b's own column
  - { from: CKV2.a, to: [1.45, 60] }
  - { from: RKV2.b, to: [1.45, 63], via: [[63, 1.4]] }              # 820Ω → ground

  # === normal input V1a (unit1 of V1): plate, grid, cathode =====================
  - { from: RLN1.b, to: V1.pin6, via: [[64.9, 1.3]] }               # plate load → V1 plate (PN1)
  - { from: JN.tip, to: V1.pin7, via: [[67.0, -0.6], [65.5, -0.6]] } # jack → V1a grid (GN1)
  - { from: V1.pin8, to: RKN1.a, via: [[63.5, 1.9]] }               # cathode → 1.5k (KN1), avoids RKN1.b's own column
  - { from: CKN1.a, to: [1.45, 64.5] }                              # bypass → ground
  - { from: RKN1.b, to: [1.45, 66.3], via: [[66.3, 1.4]] }          # 1.5k → ground

  # === pot grounds (island controls) ============================================
  - { from: VRVN.lug1, to: [1.45, 63] }
  - { from: VRVV.lug1, to: [1.45, 55.6] }
  - { from: VRREV.lug1, to: [1.45, 44.6] }

  # === 6.3 V heater chain (green twisted pair) ===================================
  # PT green pair → pilot lamp → V7 → V8 → V6 → V4 → V5 → V3 → V2 → V1, in the
  # same daisy order amps/ab763 and amps/ab763-twin both use for this platform
  # (the GZ34 is indirectly 5V-heated, off this chain).
  - { from: T1.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V7.pin7, style: twisted, via: [[-1.2, 3.6], [12, 3.6]] }
  - { from: V7.pin2, to: V8.pin7, style: twisted, via: [[12, 3.6], [17, 3.6]] }
  - { from: V8.pin2, to: V6.pin4, style: twisted, via: [[17, 3.62], [25, 3.62]] }
  - { from: V6.pin5, to: V4.pin4, style: twisted, via: [[25, 3.62], [31, 3.62]] }
  - { from: V4.pin5, to: V5.pin4, style: twisted, via: [[31, 3.64], [38, 3.64]] }
  - { from: V5.pin5, to: V3.pin4, style: twisted, via: [[38, 3.64], [48, 3.64]] }
  - { from: V3.pin5, to: V2.pin4, style: twisted, via: [[48, 3.64], [58, 3.64]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[58, 3.64], [65, 3.64]] }
  - { from: V1.pin4, to: V1.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The tremolo oscillator tube is a running phase-shift oscillator with no
  # static DC operating point (excluded from netlist.cir — see notes.md), so
  # it cannot be a quiescent stage the equivalence check verifies. Declared
  # here so its socket is an annotation-layer exclusion (printed loudly, like
  # the rectifier), never a silently-dropped tube: an UNdeclared unmodelled
  # signal tube still hard-fails.
  excluded_tubes:
    V5: "12AX7 tremolo oscillator — a phase-shift oscillator with no static DC operating point (excluded from netlist.cir; its own network mounts at the Speed/Intensity pots, off the eyelet board). Its 6.3 V heater is on the twisted chain; no signal pin is DC-checked."
  anchors:
    T3.red:   BP1    # OT primary centre tap → BP1
    T3.blue:  BP1    # OT primary, V7 plate lead → BP1
    T3.brown: BP1    # OT primary, V8 plate lead → BP1
    T4.red:   BP1    # reverb-transformer primary, B+ side → BP1 (feeds V4 via the primary DCR, RTR4)
    SPK: "0"         # speaker jack — OT-secondary DCR folded into ground (NFB return reads as ground at DC)
  # DC-transparent parts the netlist omits (no discrete board resistor here):
  netlist_unplaced:
    RTR4: "reverb transformer T4 primary DCR (~200Ω) — the winding, not a discrete board resistor; its BP1 lead anchors above and its plate lead lands on the paralleled V4 plates (PRD)"
    RGN1: "1M normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV1: "1M vibrato-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV2: "vibrato volume pot VRVV — the netlist models its DC grid return as one grid-leak (GV2→0); the pot itself is off-board (top edge)"
    RGRV: "reverb-recovery grid return (bom ref RGR1) — mounted off-board at the tank return, not a discrete board part in this derived layout"
