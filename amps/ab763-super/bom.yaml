  - { ref: CBD1, part: "Mica capacitor",      value: "10 pF",          role: "V3a grid bright cap" }
  - { ref: RMD1, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Mix-driver to PI grid resistor" }
