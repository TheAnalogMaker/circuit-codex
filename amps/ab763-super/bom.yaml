# Parts list — read from the published SUPER-REVERB-AMP AB763 drawing.
# Reference designators follow the DC netlist where a part is modeled and are
# descriptive otherwise. Values are the drawing's; the notice sets 1/2 W / 10%
# resistors and 400 V caps unless noted.
notes: "The drawing shows one jack per channel input pair; the chassis carries two per channel. The tremolo tube's parts (both halves of V5: the phase-shift oscillator and the neon-lamp driver) and the reverb-tank interconnect parts are listed, but neither tremolo half has a static DC point, so V5 is excluded from the netlist (see the circuit story). The Normal channel's tone stack is the fixed two-knob ladder (6.8 kΩ bleed); the Vibrato channel's third pot is a genuine 10 kΩ Middle control wired in place of that bleed resistor, not a shared component — the two stacks are asymmetric, read as printed. Two cathode networks are shared, and each is listed once, under the boxed letter the drawing gives it: RKA/CKA carry both second stages (Normal and Vibrato), RKE/CKE both the mix driver and the reverb recovery. Neither the Normal second stage nor the mix driver has a cathode resistor of its own."
