  - { ref: RGD1, part: "Carbon comp resistor", value: "3.3 MΩ · ½ W", role: "V3a grid leak (tremolo shunt node)" }
  - { ref: RKD1, part: "Carbon comp resistor", value: "820 Ω · ½ W",  role: "V3a cathode bias" }
