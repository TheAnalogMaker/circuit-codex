# Parts list — read from the published SUPER-REVERB-AMP AB763 drawing.
# Reference designators follow the DC netlist where a part is modeled and are
# descriptive otherwise. Values are the drawing's; the notice sets 1/2 W / 10%
# resistors and 400 V caps unless noted.
notes: "The drawing shows one jack per channel input pair; the chassis carries two per channel. Tremolo-oscillator and reverb-tank interconnect parts are listed but the oscillator's DC point is excluded from the netlist (see notes.md). The Normal channel's tone stack is the fixed two-knob ladder (6.8 kΩ bleed); the Vibrato channel's third pot is a genuine Middle control wired in place of that bleed resistor, not a shared component — the two stacks are asymmetric, read as printed."
items:
  # --- Normal channel input (V1a) ---
  - { ref: R1n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Normal input grid stopper (jack 1)" }
  - { ref: R2n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Normal input grid stopper (jack 2)" }
  - { ref: RGN1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Normal input grid leak" }
  - { ref: RLN1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1a plate load" }
  - { ref: RKN1, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V1a cathode bias" }
  - { ref: CKN1, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V1a cathode bypass" }
  # --- Normal tone stack (fixed two-knob: Treble + Bass, no Middle) ---
  - { ref: CTN, part: "Mica capacitor",       value: "250 pF",         role: "Normal treble cap" }
  - { ref: VRTN, part: "Potentiometer",       value: "250 kΩ-A",       role: "Normal treble" }
  - { ref: RSN, part: "Carbon comp resistor", value: "100 kΩ · ½ W",   role: "Normal tone-stack slope resistor" }
  - { ref: CBN, part: "Coupling capacitor",   value: "0.1 µF",         role: "Normal tone-stack bass cap, slope node to the bass pot" }
  - { ref: VRBN, part: "Potentiometer",       value: "250 kΩ-A",       role: "Normal bass" }
  - { ref: CBN2, part: "Coupling capacitor",  value: "0.022 µF",       role: "Normal tone-stack middle-leg cap, slope node to the bleed resistor" }
  - { ref: RSLN, part: "Carbon comp resistor", value: "6.8 kΩ · ½ W",  role: "Normal tone-stack bleed resistor (fixed — no Middle pot on this channel)" }
  - { ref: VRVN, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Normal volume" }
  - { ref: CBRN, part: "Mica capacitor",      value: "120 pF",         role: "Normal bright cap, across the volume pot" }
  - { ref: SWBN, part: "Switch (ganged w/ VRVN)", value: "Bright",     role: "Normal bright switch" }
  # --- Vibrato channel input (V2a) + 2nd stage (V2b) ---
  - { ref: R1v, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Vibrato input grid stopper (jack 1)" }
  - { ref: R2v, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Vibrato input grid stopper (jack 2)" }
  - { ref: RGV1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Vibrato input grid leak" }
  - { ref: RLV1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V2a plate load" }
  - { ref: RKV1, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V2a cathode bias" }
  - { ref: CKV1, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V2a cathode bypass" }
  # --- Vibrato tone stack (three-knob: Treble + Middle + Bass) ---
  - { ref: CTV, part: "Mica capacitor",       value: "250 pF",         role: "Vibrato treble cap" }
  - { ref: VRTV, part: "Potentiometer",       value: "250 kΩ-A",       role: "Vibrato treble" }
  - { ref: RSV, part: "Carbon comp resistor", value: "100 kΩ · ½ W",   role: "Vibrato tone-stack slope resistor" }
  - { ref: CBV, part: "Coupling capacitor",   value: "0.1 µF",         role: "Vibrato tone-stack bass cap, slope node to the bass pot" }
  - { ref: VRBV, part: "Potentiometer",       value: "250 kΩ-A",       role: "Vibrato bass" }
  - { ref: CBV2, part: "Coupling capacitor",  value: "0.022 µF",       role: "Vibrato tone-stack middle-leg cap, slope node to the Middle pot" }
  - { ref: VRMV, part: "Potentiometer",       value: "250 kΩ-A",       role: "Vibrato middle — replaces the Normal channel's fixed bleed resistor" }
  - { ref: VRVV, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Vibrato volume" }
  - { ref: CBRV, part: "Mica capacitor",      value: "120 pF",         role: "Vibrato bright cap, across the volume pot" }
  - { ref: SWBV, part: "Switch (ganged w/ VRVV)", value: "Bright",     role: "Vibrato bright switch" }
  - { ref: RLV2, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V2b (vibrato 2nd stage) plate load" }
  - { ref: RKV2, part: "Carbon comp resistor", value: "820 Ω · ½ W",  role: "V2b cathode bias (drawing box [A])" }
