  - { ref: RKTO1, part: "Carbon comp resistor", value: "2.7 kΩ · ½ W", role: "Tremolo oscillator cathode (1st half)" }
  - { ref: RINT, part: "Carbon comp resistor", value: "27 kΩ · ½ W",  role: "Tremolo intensity series" }
  - { ref: CTO1, part: "Film capacitor",      value: "0.01 µF",        role: "Tremolo phase-shift cap" }
  - { ref: CTO2, part: "Film capacitor",      value: "0.01 µF",        role: "Tremolo phase-shift cap" }
  - { ref: CKTO1, part: "Electrolytic capacitor", value: "25 µF",      role: "Tremolo oscillator cathode bypass (1st half)" }
