  - { ref: RTO1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Speed-network fixed resistor" }
  - { ref: RTO2, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Tremolo oscillator plate load (1st half)" }
