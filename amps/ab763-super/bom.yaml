  - { ref: CKRD, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "Reverb-driver cathode bypass" }
  - { ref: T4,  part: "Reverb transformer",   value: "Fender 125A20B", role: "Reverb driver → tank input" }
  - { ref: RGR1, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Reverb-recovery grid resistor (tank output)" }
  - { ref: RLR1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V3b (reverb recovery) plate load" }
  - { ref: RKR1, part: "Carbon comp resistor", value: "820 Ω · ½ W",  role: "V3b cathode bias" }
  - { ref: CKR1, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V3b cathode bypass" }
  - { ref: CCR1, part: "Coupling capacitor",  value: "0.003 µF",       role: "Reverb-recovery output coupling" }
  - { ref: VRREV, part: "Linear potentiometer", value: "100 kΩ-L",     role: "Reverb level" }
  - { ref: RMR, part: "Carbon comp resistor", value: "470 kΩ · ½ W",  role: "Reverb mix resistor" }
  - { ref: RMR2, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Reverb-pot ground-leg / mix reference resistor" }
  # --- Mix driver (V3a) ---
