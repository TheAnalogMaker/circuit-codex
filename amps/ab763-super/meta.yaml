# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ab763-super"
name_style: "Blackface Super Reverb-style"
family: blackface
era:
  start: 1964   # the AB763 revision's own window, matching the sibling AB763
  end: 1967     # Deluxe Reverb (amps/ab763) and Twin Reverb (amps/ab763-twin)
                # entries — AA763 (1963) is the drawing's own predecessor.
wattage: 40
tubes: [12AX7, 12AX7, 12AX7, 12AT7, 12AX7, 12AT7, 6L6GC, 6L6GC, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: long-tailed-pair
  # This chassis carries one of each: the Normal channel's middle leg is a fixed
  # 6.8 k bleed to ground (a treble/bass stack), while the Vibrato channel's is a
  # real 10 kOhm-A Middle pot (a full FMV stack, the same value the Twin fits).
  # The field takes one value, so it names the Vibrato channel — the one with the
  # reverb and the tremolo, and the one a player means by "a Super Reverb". Filed
  # as `tb` until 2026-09-09, which contradicted this amp's own parts list; see
  # notes.md, "Two tone stacks on one chassis".
  tone_stack: fmv
lineage:
  derived_from: ["6g4"]   # the brown Super: fixed bias, GZ34, 2x6L6GC, 40 W (history/families/super.yaml)
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, MODEL \"SUPER-REVERB-AMP AB763\" SCHEMATIC (drawing code C-FD; the title block runs \"SUPER-REVERB-AMPAB763\" together). Supplies every component value, the printed voltage chart and the transformer table (TR1-125P5D, or 125P5DX for export, power; TR2-125C1A choke; TR3-125A9A output; TR4-125A20B reverb, the same reverb transformer the Deluxe Reverb and Twin Reverb pages cite). How some readings are taken: the output transformer's centre tap reads +465 V, 5 V above the +460 V plates, and the two are treated as one rail, as with the Deluxe Reverb's +415/+420 V pair. The two printed droppers (1 kΩ 1 W to +450 V and 4.7 kΩ 1 W to +410 V) are modelled, so their simulated voltages check the chart. The sheet prints +2.1 V at both ends of cathode box [A]: the box joins the Normal and Vibrato second stages, and the one 820 Ω / 25 µF network drawn at the Vibrato stage serves both. Box [E] works the same way for the mix driver and the reverb recovery (+2.0 V; the network is drawn at the recovery stage). The reverb transformer's supply lead is lettered +460 V (node [B]), not [C]. The −52 V bias is adjustable, set by a 10 kΩ linear pot. The sheet's notice reads \"VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER VALUES SHOWN + OR - 20%\", \"ALL RESISTORS 1/2 WATT 10% TOLERANCE IF NOT SPECIFIED\" and \"ALL CAPACITORS AT LEAST 400 VOLT RATING IF NOT SPECIFIED\". The preamp tubes are labelled 7025 (an equivalent of the 12AX7; see the 12AX7 reference page); the tremolo oscillator is labelled plain 12AX7. Two details set this drawing apart from the Deluxe and Twin Reverb. First, the Normal channel keeps the two-knob tone stack with its fixed 6.8 kΩ bleed resistor, while the Vibrato channel puts a real Middle pot, marked 10K-A on both the schematic and the layout's panel row, in place of that resistor. Second, each 6L6GC grid has its own 1500 Ω stopper between the 0.1 µF coupling capacitor and the pin, as well as the 220 kΩ 5% bias leak; the Deluxe Reverb's 6V6GT stage draws no such resistor. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_super_reverb_ab763_schematic.pdf"
  - desc: "Fender, \"SUPER REVERB-AMP AB763\" LAYOUT (drawing code C-FD), Fender Electric Instrument Company, Fullerton. Supplies the eyelet-board layout: the order of the board's parts, the tube sockets below the board and the control row above it, and each socket's leads pin by pin. Read from Schematic Heaven's 300 ppi scan (the fourth page of its Super Reverb AB763 file) and checked against the lower-resolution EL34World capture. Not reproduced here."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_reverb_ab763_layout.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Fender Blackface Super Reverb\". Supplies the production window (1963–1967, as the AA763 and then the AB763), the 40 W factory rating, the two 6L6GC output tubes, the GZ34 rectifier, fixed bias with an adjustment pot, the four 10-inch speakers (Jensen C10R, Oxford 10L6 or CTS), and the reverb and tremolo. Used here for the power rating and speakers, which the schematic does not print; every component value and voltage on this page comes from the schematic."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-super-reverb"
verification:
  status: draft   # Maintainer sign-off, which AGENTS.md rule 4 reserves to a
                  # human, is the only thing outstanding. All twenty gated
                  # nodes now land: both derived rails reproduce their printed
                  # values through the drawing's own droppers to within half a
                  # percent, and the widest miss left is the phase inverter at
                  # 11% on a ±20% sheet. The artifact set is complete
                  # (schematic, both layout styles, social card) and both the
                  # drawn board and the drawn sheet are proved equivalent to
                  # netlist.cir. The tremolo oscillator V5 is excluded — a
                  # running phase-shift oscillator has no static operating
                  # point — and it taps a driven node, so excluding it moves no
                  # gated value.
                  #
                  # Until 2026-09-09 this entry published a claim that the
                  # printed chart was internally impossible at three cathode
                  # nodes. It was not: the model behind that claim omitted the
                  # Normal channel's second triode and gave three stages a
                  # cathode resistor each where the drawing's boxed [A] and [E]
                  # connections put two triodes on one. Corrected here and in
                  # notes.md; the chart closes on itself.
added: 2026-08-30
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V5: "excluded — the tremolo bottle: a running phase-shift oscillator (one section, printed +280 V plate / +2.5 V cathode) and the neon-lamp driver it swings (the other, printed +390 V plate / +170 V cathode). The sheet prints a pair at BOTH sections, and all four are averages a meter reads while the oscillator swings, so neither section has a static operating point"
