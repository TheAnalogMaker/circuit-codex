# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ab763-super"
name_style: "Blackface Super Reverb-style"
family: blackface
era:
  start: 1964   # the AB763 revision's own window, matching the sibling AB763
  end: 1967     # Deluxe Reverb (amps/ab763) and Twin Reverb (amps/ab763-twin)
                # entries — AA763 (1963) is the drawing's own predecessor.
wattage: 40
tubes: [12AX7, 12AX7, 12AX7, 12AT7, 12AX7, 12AT7, 6L6GC, 6L6GC, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: long-tailed-pair
  # This chassis carries one of each: the Normal channel's middle leg is a fixed
  # 6.8 k bleed to ground (a treble/bass stack), while the Vibrato channel's is a
  # real 10 kOhm-A Middle pot (a full FMV stack, the same value the Twin fits).
  # The field takes one value, so it names the Vibrato channel — the one with the
  # reverb and the tremolo, and the one a player means by "a Super Reverb". Filed
  # as `tb` until 2026-09-09, which contradicted this amp's own parts list; see
  # notes.md, "Two tone stacks on one chassis".
  tone_stack: fmv
lineage:
  derived_from: ["6g4"]   # the brown Super: fixed bias, GZ34, 2x6L6GC, 40 W (history/families/super.yaml)
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender 'SUPER-REVERB-AMP AB763' schematic (title block: FENDER MODEL \"SUPER-REVERB-AMPAB763\" SCHEMATIC, drawing code C-FD). Every component value AND the printed voltage chart read directly from the sheet. Rails: +460 V (6L6GC plates; OT centre tap reads +465 V, 5 V above the plate reading, OT primary DCR omitted — merged to one rail exactly as the Deluxe Reverb's own +415/+420 pair is), +460 V screens (via 470 Ω-1W stoppers), +450 V (phase-inverter plates and reverb-driver plate, node [C] — reached from +460 V through a printed 1 kΩ-1W dropper, RD1, modelled so its simulated value is a check on the chart), +410 V (Normal input, Normal 2nd stage, Vibrato input, Vibrato 2nd stage, mix driver and reverb-recovery plate rail, node [D] — reached from +450 V through a printed 4.7 kΩ-1W dropper, RD2, likewise modelled). Stage readings: +270 V / +2.1 V (Normal and Vibrato input stages, 100 kΩ plate / 1.5 kΩ cathode); +270 V for each second stage's plate, over 100 kΩ, with +2.1 V printed at BOTH ends of cathode box [A] — the box is a connection between the Normal and Vibrato second stages, and the one 820 Ω / 25 µF network it names is drawn at the Vibrato stage and carries both triodes; +270 V for the mix driver and the reverb recovery, over 100 kΩ each, with +2.0 V printed at both ends of cathode box [E], one 820 Ω / 25 µF drawn at the recovery stage and carrying both; +450 V / +8.4 V (reverb-driver 12AT7, both sections paralleled, 2.2 kΩ shared cathode, fed from the +460 V rail at node [B] through the reverb transformer TR4 primary — the primary's B+ lead is lettered +460 V on the sheet, not [C]); +230 V (both phase-inverter plates, 82 kΩ hot / 100 kΩ cold at 5%), +106 V / +104.5 V (PI joined cathodes / tail junction, 470 Ω to the junction, 22 kΩ to ground); -52 V fixed bias (adjustable — a 10 kΩ-L pot on the rectified tap, not a fixed divider). Notice printed on the sheet: 'VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER VALUES SHOWN + OR - 20%', 'ALL RESISTORS 1/2 WATT 10% TOLERANCE IF NOT SPECIFIED', 'ALL CAPACITORS AT LEAST 400 VOLT RATING IF NOT SPECIFIED'. The preamp bottles are labelled 7025 (a 12AX7 alias — see the 12AX7 reference page); the tremolo oscillator is labelled plain 12AX7. Export-model transformer table printed on the sheet: TR1-125P5D (125P5DX export) power, TR2-125C1A choke, TR3-125A9A output, TR4-125A20B reverb — the same reverb-transformer part number the Deluxe Reverb and Twin Reverb entries cite. Two structural details distinguish this drawing from its Deluxe/Twin Reverb siblings, both read directly off the sheet: (1) the Normal channel keeps the two-knob tone stack (fixed 6.8 kΩ bleed resistor, no third pot) while the Vibrato channel's third position is a genuine Middle potentiometer, marked 10K-A on both the schematic and the panel row of the layout sheet, wired in place of that bleed resistor — an asymmetric stack, not a shared one; (2) each 6L6GC control grid carries its own 1500 Ω series stopper between the 0.1 µF coupling cap and the tube pin, in addition to the 220 kΩ·5% bias leak — a resistor the Deluxe Reverb's 6V6GT stage does not draw. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_super_reverb_ab763_schematic.pdf"
  - desc: "Fender 'SUPER REVERB-AMP AB763' LAYOUT drawing (drawing code C-FD, Fender Electric Instrument Company, Fullerton) — the eyelet-board layout: the order the board's parts stand in, the valve sockets beneath the board and the control row above it, and each socket's leads pin by pin. Read from Schematic Heaven's 300 ppi scan of the sheet (3299 × 2551, the fourth page of its Super Reverb AB763 file) and cross-checked against the EL34World capture (2182 × 1394). Not reproduced here."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_reverb_ab763_layout.pdf"
  - desc: "Mojotone/Ampwares Fender field guide, 'Fender Blackface Super Reverb' — production window 1963-1967 under AA763 then AB763, 40 W factory rating, two 6L6GC output tubes, GZ34 rectifier, fixed bias with an adjustable pot, four 10-inch speakers (Jensen C10R / Oxford 10L6 / CTS variants), reverb and tremolo. Used here for the wattage and speaker-complement facts the schematic itself does not print; every component value and voltage above is read from the schematic, not this page."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-super-reverb"
verification:
  status: draft   # Maintainer sign-off, which AGENTS.md rule 4 reserves to a
                  # human, is the only thing outstanding. All twenty gated
                  # nodes now land: both derived rails reproduce their printed
                  # values through the drawing's own droppers to within half a
                  # percent, and the widest miss left is the phase inverter at
                  # 11% on a ±20% sheet. The artifact set is complete
                  # (schematic, both layout styles, social card) and both the
                  # drawn board and the drawn sheet are proved equivalent to
                  # netlist.cir. The tremolo oscillator V5 is excluded — a
                  # running phase-shift oscillator has no static operating
                  # point — and it taps a driven node, so excluding it moves no
                  # gated value.
                  #
                  # Until 2026-09-09 this entry published a claim that the
                  # printed chart was internally impossible at three cathode
                  # nodes. It was not: the model behind that claim omitted the
                  # Normal channel's second triode and gave three stages a
                  # cathode resistor each where the drawing's boxed [A] and [E]
                  # connections put two triodes on one. Corrected here and in
                  # notes.md; the chart closes on itself.
added: 2026-08-30
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V5: "excluded — the tremolo bottle: a running phase-shift oscillator (one section) and the neon-lamp driver it swings (the other, whose printed +390 / +170 are averages a meter reads); neither has a static operating point"
