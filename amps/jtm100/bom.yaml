# Parts list — reference designators match schematic.kicad_sch exactly.
notes: >-
  This is the plain (non-tremolo) head read off the factory sheet for the tremolo
  version, the same relationship the corpus's jtm45 entry has with its drawing:
  the sheet's V2 tremolo valve, its transistor, and the depth network that shunts
  the V3A grid node are omitted, so the valve numbering follows the drawing and
  skips V2 (V1 input pair, V3 second stage + cathode follower, V4 phase inverter,
  V5-V8 the KT66 quartet). The schematic draws one jack per channel; the chassis
  carries four. Capacitor working voltages are NOT given: this drawing prints
  none for the signal-path parts, and the corpus does not invent ratings. The
  drawing's own footnote — "all resistors are half watt unless otherwise stated"
  — supplies the wattage for every resistor the sheet does not letter, including
  the 8.2 kOhm dropper. The factory sheet numbers almost nothing, so every
  designator here is the corpus's own; the only parts left without one are those
  no drawing in this entry places: the power transformer, the two mains/HT fuses
  and the capacitor paralleling the channel II mixer, whose value the archived
  scan does not render.
