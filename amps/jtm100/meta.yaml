# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "jtm100"
name_style: "British 100-watt lead-style"
family: british
era:
  start: 1965
  end: 1966
wattage: 100
tubes: [ECC83, ECC83, ECC83, KT66, KT66, KT66, KT66]
topology:
  rectifier: { kind: solid-state, type: "silicon diode bank" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: cathode-follower-fmv
lineage:
  derived_from: ["jtm45"]   # the 45-watt head with the output section doubled: 2xKT66 + GZ34 -> 4xKT66 + silicon
  influenced: ["m1959"]     # the cataloged Super Lead that replaced the KT66 quartet with EL34s
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Marshall, factory drawing titled \"BASIC SCHEMATIC FOR MARSHALL 100 WATT SUPER TREM AMP / TYPE 1959T\". Its title block carries no drawing number and no date; the schematic archive that publishes it files it under JTM100 and dates the sheet 1966. Supplies the tube complement (four ECC83, V1–V4, and four KT66, V5–V8, with no rectifier tube: the HT is rectified by two arms of three series silicon diodes, \"DIODES IS107\", behind a standby switch, with a 1 A slow-blow fuse in the HT centre-tap return and a 2 A slow-blow fuse in the mains lead) and every component value, except one: the capacitor across the second 270 kΩ mixing resistor has a value that is not legible on the archived scan. It also gives the choke (\"20H CH1\"), universal mains of 110/250 V, and T1's secondary leads, lettered blue \"100 V LINE\", white \"16 ohm\", yellow \"8 ohm\" and orange \"common\". Not reproduced here; archived at Dr. Tube."
    url: "https://www.drtube.com/schematics/marshall/1959t-66.gif"
  - desc: "Marshall, the same drawing's printed \"VALVE VOLTAGE CHART\". The measurement basis for the operating-point table. Its footnote reads \"ALL RESISTORS ARE HALF WATT UNLESS OTHERWISE STATED. ALL VOLTAGES MEASURED TO CHASSIS UNDER NO SIGNAL CONDITIONS WITH AN AVO MODEL 8 Mk II. METER SENSITIVITY 20,000 ohm/V.\" Rows: V1 pins 1/2/3 and 6/7/8 read 285 / 0 / 2 and 285 / 0 / 2; V2 (the tremolo tube, absent from this head) reads 175 / 0 / 1.5, with its second triode struck through; V3 reads 225 / 0 / 1.4 and 400 / 225 / 225; V4 reads 310 / \"+\" / 52 and 300 / \"+\" / 52, with the phase-inverter grids marked only as positive; V5–V8 pins 3/4 read 560 / 559 each, but the pin 5 control-grid cell is a hand-lettered range that the archived scan does not show legibly. The schematic also circles node voltages: 560 at the reservoir, 559 at the screen node, 470 at the phase-inverter rail, 390 at the preamp rail, 16 at the top of the presence pot, and 65/66 at the negative bias filter."
    url: "https://www.drtube.com/schematics/marshall/1959t-66.gif"
  - desc: "Dr. Tube schematic archive, Marshall / JTM100 index. The naming and dating frame for this circuit. It records that the first 100 W amps (1965) used two 50 W output transformers before a single 100 W part; that the 100 W Lead and Bass heads carried left-over JTM45 panels into 1966 (hence \"JTM45/100\"), while the 100 W PA models carried JTM100 panels; that the JTM100s were the first Marshalls with solid-state rectifiers; and that early JTM100s had KT66s and later ones EL34s. It is also the source that files the drawing above under JTM100 and dates it 1966."
    url: "https://www.drtube.com/marshall-jtm100/"
  - desc: "GEC / M-O Valve Co., KT66 data sheet (Issue 4, April 1963). The anchor for the site's open (CC0) KT66 tube model: Va = 250 V, Vg2 = 250 V and Vg1 = −15 V give Ia = 85 mA and gm = 7 mA/V; screen current Ig2 = 2.5 mA at the Class AB1 push-pull tetrode point (Vg2 = 300 V, Vg1 = −27 V); µ(g1-g2) = 9.5, from the triode-connection gm × ra. The circuit story measures the simulated idle current at this circuit's 560 V rail against the sheet's 25 W plate-dissipation rating."
    url: "https://frank.pocnet.net/sheets/084/k/KT66_GEC.pdf"
  - desc: "Wikipedia, \"Marshall Amplification\". Supplies the 100 W heads as a special order from players who wanted more than 45 W on stage, the 1965 introduction of the 100 W Super Lead under catalog number 1959, and the later, cost-driven move from KT66 to EL34 output tubes that ends the circuit documented here."
    url: "https://en.wikipedia.org/wiki/Marshall_Amplification"
verification:
  status: draft   # the drawing prints a full valve-voltage chart and every gated
                  # node lands inside the era's printed tolerances (worst 8.0%),
                  # and the drawn board wiring is proved equivalent to the netlist
                  # (layout.yaml carries wiring_claim: verified). What still stands
                  # between that and a verified operating point is the output
                  # stage: the v0 anchor-point KT66 model idles the quartet at
                  # ~72 mA per valve on this 560 V rail — 40 W against the KT66's
                  # 25 W rating, an artifact of running a 250 V anchor fit at 2.2x
                  # its anchor voltage. See notes.md. Verified is earned, not
                  # granted.
