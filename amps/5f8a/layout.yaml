# net_map — the reviewable data layer reconciling the drawn wiring with the DC
# netlist for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # Terminals the netlist gives no discrete node to reach on their own. On this
  # circuit each primary end carries TWO paralleled bottles: the netlist omits
  # the OT primary DCR, so both plate nodes and the centre tap collapse to B+1.
  anchors:
    T3.blue:  BP1    # V4 + V5 plates -> OT primary end A
    T3.brown: BP1    # V6 + V7 plates -> OT primary end B
    T3.red:   BP1    # OT primary centre tap -> B+1
    SPK: "0"         # speaker jack — OT-secondary DCR folded into ground (the NFB return reads as ground at DC)
    # The drawing does NOT tie the 10 kΩ tail's foot straight to the chassis: it
    # runs the foot to the presence pot's hot lug, and the pot's cold lug to
    # ground, with the 56 kΩ feedback resistor landing on the same foot. The DC
    # model collapses that whole return to ground (netlist.cir: RT2 JPI 0 10k),
    # which the printed chart supports — +27 V at the junction is 2.7 mA in
    # 10 kΩ, the same current the two plate drops imply, so the foot is sitting
    # at about zero. Anchoring the pot's hot lug to node 0 states that
    # collapse here rather than misdrawing the board to suit the model.
    VR6.lug3: "0"
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out).
  # DC-transparent parts the netlist omits: the grid draws no current, so the
  # netlist node runs straight through each input stopper. This is what lets the
  # 1 MΩ leak sit on jack 1's tip — behind its own 68 kΩ, as the sheet wires it —
  # while the netlist models it on the grid node.
  series_bridge:
    R1s: "68 kΩ input grid stopper (bright, jack 1) — no DC grid current, so the grid node runs through it"
    R2s: "68 kΩ input grid stopper (bright, jack 2) — as above"
    R3s: "68 kΩ input grid stopper (normal, jack 1) — as above"
    R4s: "68 kΩ input grid stopper (normal, jack 2) — as above"
  netlist_unplaced:
    RCHOKE: "filter choke L1 is a chassis part on this sheet (B+1 -> B+2); the netlist models its ~130 Ω DCR as RCHOKE"
    RG3:  "V2A grid return — realised through the volume pots (VR1/VR2) and the 270k channel mixers to ground, not a discrete board resistor"
    RKCF: "V2B cathode-follower 100 kΩ load — omitted from this redraw for legibility, as on the 5F6-A page; its node is carried here by the RSL.a feed"
