# Parts list — reference designators match schematic.kicad_sch exactly.
notes: "The sheet's own note reads: all resistors are ½ W 10% unless otherwise marked, so a wattage appears below only where the drawing letters one (470 Ω 1 W screens; 1 W on both rail droppers) and a tolerance only where it letters one (5% on the two phase-inverter plate loads). The drawing shows two jacks on each channel and this schematic draws both, with all four 68 kΩ stoppers. The presence pot and its 0.1 µF wiper cap are chassis wiring, and the negative-feedback resistor mounts on the eyelet board beside the tail's 10 kΩ, as the factory layout places it; all three carry designators (RNF, VR6, C16) and are drawn. The 100 pF bright cap mounts on the bright volume pot's own lugs, inside the tone/volume network the DC model abstracts, so it is listed without a designator and annotated on the schematic rather than drawn."
