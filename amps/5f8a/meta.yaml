sources:
  - desc: "Fender, \"Twin-Amp\" Model 5F8-A schematic (drawing code I-EG). Supplies every component value and the transformer and choke part numbers (power transformer 7993, 300-0-300 V AC; choke 14684; output transformer 45268). This copy is a low-resolution scan, about 100 ppi at sheet size. Every component value is legible on it, but the voltage-chart digits are not, so no voltage on this page comes from it; see the third source. Not reproduced here; archived at Schematic Heaven."
    url: "https://schematicheaven.net/fenderamps/twin_5f8a_schem.pdf"
  - desc: "Fender, \"Twin-Amp\" Model 5F8-A layout drawing (drawing code I-EG), page 2 of the same sheet. Supplies the order of parts on the eyelet board and the wiring (which eyelet each lead leaves and where it lands on the sockets, pots, jacks and transformers); the pot tapers (5 kΩ linear presence, 25 kΩ linear middle, 1 MΩ audio bass, 250 kΩ linear treble, 1 MΩ audio volumes, with the 100 pF bright capacitor mounted on the bright volume pot); the marked transformer lead colours; and the sheet's note that all resistors are ½ W 10% unless marked, which is where the 1 W rating of both rail droppers is read. That drawing is redrawn from the published facts, never traced. It is the same low-resolution copy as the schematic above: part order and lead routing are legible on it, and no voltage was read from it."
    url: "https://schematicheaven.net/fenderamps/twin_5f8a_schem.pdf"
  - desc: "EL34World, the same Fender \"Twin-Amp\" 5F8-A schematic and layout (drawing code I-EG), as captured by the Internet Archive at 693 ppi. That is about 4.2 times the linear resolution of the Schematic Heaven copy. Every voltage on this page (the four rails, the bias line and all eleven tube-pin figures in the operating-point table) was read from this capture and from no other copy. The coarser copy cannot resolve those digits: read from it, the two figures either side of the choke come out as +375/+377 V where this capture prints +395/+397 V, and the phase-inverter cathode as +22.5 V where this capture prints +28.5 V. The circuit supports the sharper reading: that cathode has to sit above the +27 V tail junction, because its current reaches the junction through the 470 Ω resistor."
    url: "https://web.archive.org/web/2020id_/https://el34world.com/charts/Schematics/files/Fender/Fender_twin_5f8a.pdf"
  - desc: "Wikipedia, \"Fender Twin\". Supplies the production span and the power rating, neither of which the drawing prints. The Twin was changed in 1957 to four 5881 power tubes with a long-tailed-pair phase inverter, raising its output to 80 W, and the 5F8-A was released in 1958 and built into early 1960."
    url: "https://en.wikipedia.org/wiki/Fender_Twin"
