sources:
  - desc: "Fender, \"Super-Amp\" Schematic, Model 5E4-A* (drawing code G-EE), with its matching \"Super-Amp\" Layout sheet (same code). Supplies every component value and every printed voltage; the plate voltages of the 12AY7 channels, the driver and the cathodyne (+125, +190 and +245 V) appear on the layout sheet only. The schematic prints Fender's notice \"VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER / VALUES SHOWN + OR - 20%\" and a boxed footnote, \"*NOTE — (A) WAS 22 K OHMS\". The (A) marks the bias-supply series resistor, now drawn as 18 kΩ. The layout sheet is footed \"* SEE NOTE ON REVERSE SIDE\". Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_5e4a.pdf"
  - desc: "Copies circulating under a plain \"5E4\" label: thetubestore's \"Fender-Super-5E4-G-EE-Schematic.pdf\" and two separately hosted copies of \"Super-5E4-Schematic.pdf\" (one linked from a maker's field guide, one from a repair shop). On inspection they are this same G-EE drawing with the \"-A\" and its \"(A) WAS 22 K OHMS\" footnote edited out of the title block. They carry the same drawing code, the same 6V6GT output pair, the same selenium bias supply and the same printed voltages. No separate drawing for a plain 5E4 (6L6G output, no selenium bias cell) was found, so this circuit is filed under the name its own title block prints. See the circuit story on this page and the Super line's history."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_5e4a.pdf"
  - desc: "General Electric, \"6V6-GT\" data sheet ET-T914 (March 1955), \"Characteristics and Typical Operation\". Supplies the 6V6GT average characteristics behind the site's open (CC0) 6V6GT tube model, used for this amp's output pair: Va = 250 V, Vg2 = 250 V and Vg1 = −12.5 V give Ia = 45 mA, Ig2 = 4.5 mA and gm = 4100 µmho. The model's stated anchor is RCA's Receiving Tube Manual RC-19 (1959), a printed book with no archived scan. This GE sheet prints the same values, so it is the copy a reader can open and check. The RCA 6V6GT sheet in the same archive is a \"same as the 6V6GTA except\" page and carries none of these figures."
    url: "https://frank.pocnet.net/sheets/093/6/6V6GT.pdf"
  - desc: "RCA, 12AY7 data. The data-sheet anchor for the site's open (CC0) 12AY7 tube model, used for this amp's two front-end tubes."
    url: "https://frank.pocnet.net/sheets/049/1/12AY7.pdf"
verification:
  status: verified
  date: 2026-08-08
  max_deviation_pct: 8.7   # worst gated node (KAY, the shared 12AY7 input cathode: simulated 2.1 V against the schematic sheet's printed 1.9 V, tol 20%); next are PAY1/PAY2 and PPIA at 8.0% (135.0 V against a printed 125 V; 205.2 V against a printed 190 V), and every rail lands within 5% of its printed value. Was 10.0 until the 2026-10-03 V1 audit moved the output-transformer centre tap to the choke's output, as both pages draw it
