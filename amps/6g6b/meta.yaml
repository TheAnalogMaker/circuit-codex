# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6g6b"
name_style: "Blonde Bassman-style"
family: other
era:
  start: 1963
  end: 1964
wattage: 50
tubes: [7025, 7025, 7025, 7025, 5881, 5881]
topology:
  rectifier: { kind: solid-state }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: per-channel-tb   # each channel carries its own Bass+Treble+Volume network (no Middle) between two gain stages; the Bass channel's own Treble control sits in V3's signal path, between that channel's later two stages
lineage:
  derived_from: []              # the 6G6 piggyback line replaced the tweed 5F6-A in the
                                # Bassman catalog but is circuit-wise unrelated
                                # (two-channel piggyback topology, solid-state
                                # rectifier) — see history/families/bassman.yaml, which
                                # documents that succession without claiming a circuit edge
  influenced: ["aa864-bassman"] # the blackface head that took the name in 1964 carries
                                # this circuit's two-channel Bass/Normal split, its
                                # solid-state rectifier and its long-tailed-pair inverter
                                # forward. Reciprocal of amps/aa864-bassman's derived_from.
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Bassman\" Model 6G6-B drawing (drawing code E-FB), two pages (board layout and schematic). Supplies every component value and the printed voltage chart, read lug by lug from a 750 dpi copy, and the transformer part numbers (TR1-125P7A power, TR2-125C1A choke, TR3-125A13A output). The output transformer's centre tap takes the lead printed \"+430 V.\"; the +428 V printed at the plate leads reflects the primary's own resistance. The sheet's notice reads \"Voltages read to ground with electronic voltmeter, values shown + or - 20%\", \"All resistors 1/2 W-10% tolerance if not specified\" and \"All capacitors at least 400 volt rating if not specified.\" Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_6g6b.pdf"
  - desc: "Wikipedia, \"Fender Bassman\". Supplies the 6G6-B production window and the circuit's lineage: 6G6 (late 1960, GZ34 tube rectifier), then 6G6-A (early 1961, solid-state rectifier, 2×12 cabinet), then 6G6-B (circuit changes carried through 1963). The blonde piggyback Bassman line ran from 1960 to 1964 and was replaced by the blackface AA864 piggyback head in 1964."
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
verification:
  status: draft   # Two blockers left: one gated node outside the chart's own
                  # tolerance (below), and the maintainer's sign-off.
                  # The two chart disagreements that held this entry open —
                  # V1B's cathode (sim 3.2 V vs a printed figure read as
                  # "13.6 V") and V2A's cathode (1.2 V vs 1.9 V) — were both
                  # OUR reading, not the print. A lug-level re-read of the
                  # E-FB schematic page at 750 dpi shows V1B is a cathode
                  # follower (plate straight on the +230 V lane, grid direct-
                  # coupled to V1A's plate, 100 kΩ cathode load) whose printed
                  # figure is +136 V — the mark between the 3 and the 6 is the
                  # +230 V lane's own wire crossing the lettering — and that
                  # V2A's 100 kΩ plate load climbs to the +355 V lane, the
                  # sheet's third "+230 V." being V2A's PLATE, not a rail.
                  # With the circuit the sheet actually draws, every gated
                  # node but one lands inside the chart's own ±20%: V1A's
                  # cathode reads 20.1%, a tenth of a percent outside, off a
                  # +230 V lane that is derived and sits 2.8% high.
                  # The drawing corroborates itself twice over — 136 V over
                  # 100 kΩ is the 1.36 mA that makes the 56 kΩ rail dropper
                  # arrive at +230 V, and 125 V over V2A's 100 kΩ is the
                  # 1.25 mA its printed 1.9 V over 1500 Ω implies.
                  # REMAINING BLOCKERS: that one node, and maintainer
                  # sign-off, which CONTRIBUTING.md reserves to a human.
                  # The artifact set is complete: the board layout is drawn
                  # from the E-FB layout page, both renders and the social
                  # card are present, and
                  # the drawn wiring is proved electrically equivalent to
                  # netlist.cir.
