# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6g6b"
name_style: "Blonde Bassman-style"
family: other
era:
  start: 1963
  end: 1964
wattage: 50
tubes: [7025, 7025, 7025, 7025, 5881, 5881]
topology:
  rectifier: { kind: solid-state }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: per-channel-tb   # each channel carries its own Bass+Treble+Volume network (no Middle) between two gain stages; the Bass channel's own Treble control sits in the shared driver bottle's signal path
lineage:
  derived_from: []              # the 6G6 piggyback line replaced the tweed 5F6-A in the
                                # Bassman catalog but is circuit-wise unrelated
                                # (two-channel piggyback topology, solid-state
                                # rectifier) — see history/families/bassman.yaml, which
                                # documents that succession without claiming a circuit edge
  influenced: ["aa864-bassman"] # the blackface head that took the name in 1964 carries
                                # this circuit's two-channel Bass/Normal split, its
                                # solid-state rectifier and its long-tailed-pair inverter
                                # forward. Reciprocal of amps/aa864-bassman's derived_from.
sources:
  - desc: "Fender 'Bassman' Model 6G6-B drawing (E-FB), two pages (board layout + schematic): every component value AND the printed voltage chart read directly from the published sheet. Two full channels (Bass, Normal), each a 7025 bottle of two stages with its own Bass/Treble/Volume network between them (Bass ch.: 68k/68k input stoppers, 1M leak, 2700 Ω cathode, 220k plate, +135/+1.1 V; then 100k unbypassed-cathode recovery stage, +13.6 V, feeding a 1M/.00025/47k/.25/.25 network into a 25k-L Bass pot, an 820 Ω foot and a 250k-L Volume pot. Normal ch.: 1500 Ω cathode, 100k plate off +230 V feeding a .00025/47k-analog network with a 350k-70k-tap Treble pot and a 250k-A Bass pot, into a second 2700 Ω-cathode/220k-plate stage off +355 V at +190/+1.8 V, then a 1M-A Volume pot and a 470k mixing resistor). Both channels' Volume outputs mix at a shared driver bottle's first grid (100k plate off +230 V, +150 V both sections, 1500 Ω/+1.3 V cathode chart-read on the second section); the Bass channel's own 250k-A Treble control (its front-panel group reads Bass 25k-L / Treble 250k-A / Volume 250k-L) sits between the bottle's two sections rather than beside its other two pots, then a 470k/.0005 uF coupler into the phase inverter: 82k (hot) / 100k (cold) 5% plates off a +410 V rail, printed +300/+280 V, both 1M grid leaks to the tail junction, an 820 Ω shared-cathode resistor printed +30.0 V (cathodes) / +28.0 V (tail junction) either side of it. Fixed-bias 5881 pair: 220k leaks from -54 V, 470 Ω 1W screens off +430 V, plates direct on +428 V. Solid-state full-wave rectifier (two 3-diode series legs off a centre-tapped HT winding) — no rectifier tube. Bias supply: small silicon diode + 1k 1W-5% off an AC tap, 4700 Ω/1W + choke (TR2, 125C1A) filtering, 27k-5% bleeder, 25/50 uF dual can, -54 V. Transformers TR1-125P7A (power), TR2-125C1A (choke), TR3-125A13A (output). Notice printed on the sheet: 'Voltages read to ground with electronic voltmeter, values shown + or - 20%'; 'All resistors 1/2 W-10% tolerance if not specified'; 'All capacitors at least 400 volt rating if not specified.' Two internal nodes (V1B's own plate-load resistor; the driver bottle's first-section cathode) were not legible on the rendered drawing and are modelled as engineering estimates, flagged inline in netlist.cir/voltages.yaml rather than asserted as read. Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_6g6b.pdf"
  - desc: "Wikipedia, 'Fender Bassman' — 6G6-B production window and circuit lineage: 6G6 (late 1960, GZ34 tube rectifier) -> 6G6-A (early 1961, solid-state rectifier, 2x12 cabinet) -> 6G6-B (circuit changes carried through 1963); the blonde/piggyback Bassman line ran 1960-1964, superseded by the blackface AA864 piggyback head in 1964"
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
