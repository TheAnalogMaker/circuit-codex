# Parts list — reference designators match the netlist where a part is
# modelled there. The Bass/Treble/Volume tone networks and the driver's
# Treble control ARE drawn on the schematic (redrawn from the published
# E-FB schematic page, verified against its own title block) but are NOT
# modelled in netlist.cir (an abstracted control island, same convention as
# every other amp in the corpus); their parts carry schematic-only refs.
notes: "Two full 4-pin input jacks per channel (2/1, hi/lo) share one 68 kΩ-per-jack, 1 MΩ-leak grid network, same convention as the tweed amps. Values keyed to the E-FB drawing, re-read from the source PDF at 800 dpi for the schematic pass. Two engineering estimates remain, both explicitly noted below: V1B's own plate load (mirrored from V1A) and the V1A->V1B interstage coupling cap (a conventional value; not itself legible on the available scan). Cathode-bypass electrolytics that the drawing shows as a shared dual-section can are drawn here as one equivalent cap per stage, valued as the chart prints the pair."
items:
  # --- Bass channel input + V1A/V1B
  - { ref: R1s, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Bass ch. jack 2 stopper" }
  - { ref: R2s, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Bass ch. jack 1 stopper" }
  - { ref: RG1A, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "Bass ch. input grid leak" }
  - { ref: RL1A, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "V1A plate load, off the shared +230 V rail" }
  - { ref: RK1A, part: "Carbon comp resistor", value: "2,700 Ω · ½ W", role: "V1A cathode bias" }
  - { ref: CK1A, part: "Electrolytic capacitor", value: "25 µF (dual-can pair)", role: "V1A cathode bypass" }
  - { ref: C0, part: "Film capacitor", value: "0.1 µF (estimate)", role: "V1A -> V1B interstage coupling — a plain DC-blocking cap is circuit-necessary here (V1A's plate reads +135 V, V1B's grid must return near 0 V through RG1B); its printed value was not legible on the available scan, so 0.1 µF is drawn as the corpus's usual preamp coupling value, not asserted as read" }
  - { ref: RG1B, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "V1B grid leak, returned to ground" }
  - { ref: RL1B, part: "Carbon comp resistor", value: "220 kΩ · ½ W (estimate)", role: "V1B plate load — not legible on the rendered drawing; mirrored from V1A" }
  - { ref: RK1B, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1B cathode bias, unbypassed" }
  - { ref: CTN1, part: "Mica capacitor", value: "250 pF (.00025 µF)", role: "Bass ch. tone network: treble-bleed branch, off V1B's plate" }
  - { ref: RTN1, part: "Carbon comp resistor", value: "47 kΩ · ½ W", role: "Bass ch. tone network: treble-bleed branch slope, in series with CTN1" }
  - { ref: RTN2, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "Bass ch. tone network: bass-leg resistor, off V1B's plate in parallel with the CTN1/RTN1 branch" }
  - { ref: CTN2, part: "Film capacitor", value: "0.25 µF", role: "Bass ch. tone network: bass-leg bridging cap (upper)" }
  - { ref: CTN3, part: "Film capacitor", value: "0.25 µF", role: "Bass ch. tone network: bass-leg bridging cap (lower)" }
  - { ref: RTN3, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "Bass ch. tone network: dropper, paralleled by the Bass pot" }
  - { ref: VR1, part: "Linear potentiometer (rheostat)", value: "25 kΩ-L", role: "Bass ch. Bass control, in parallel with RTN3" }
  - { ref: RBF, part: "Carbon comp resistor", value: "820 Ω · ½ W", role: "Bass ch. tone-network foot, to ground" }
  - { ref: VR2, part: "Linear potentiometer", value: "250 kΩ-L", role: "Bass ch. Volume control; wiper feeds the shared driver stage (V3A grid)" }

