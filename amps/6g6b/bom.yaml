# Parts list — reference designators match the netlist where a part is
# modelled there. The Bass/Treble/Volume tone networks and the driver's
# Treble control ARE drawn on the schematic (redrawn from the published
# E-FB schematic page, verified against its own title block) but are NOT
# modelled in netlist.cir (an abstracted control island, same convention as
# every other amp in the corpus); their parts carry schematic-only refs.
notes: "Two full 4-pin input jacks per channel (2/1, hi/lo) share one 68 kΩ-per-jack, 1 MΩ-leak grid network, same convention as the tweed amps. Values keyed to the E-FB drawing, re-read from the source PDF at 750 dpi lug by lug. Every value in the signal and supply path is read from the sheet. V1B is a cathode follower, so it has no plate-load resistor, no interstage coupling cap and no grid leak of its own (an earlier pass invented all three and is corrected here), and the phase-inverter tail's foot is lettered in full (6.8 kΩ, 4.7 kΩ, the 56 kΩ speaker feedback and the Presence pot across the foot). The only parts still marked (estimate) are three grid leaks the sheet does not draw as discrete resistors — RG2B, RG3A and RG3B stand in for a DC return the volume pots and mixing resistors above them already provide, and no stage's operating point turns on their value. Cathode-bypass electrolytics that the drawing shows as a shared dual-section can are drawn here as one equivalent cap per stage, valued as the chart prints the pair."
