# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # OT primary DCR omitted (matches every other amp in the corpus): both 5881
  # plates and the primary centre tap sit at the same driven node, BP428.
  anchors:
    T3.pri_a: BP428
    T3.pri_b: BP428
    T3.ct:    BP428
    SPK: "0"          # speaker jack — OT-secondary DCR folded into ground (NFB return)
    RL2B.b: BP355     # rail not traced to a shared derivation on the available scan (single consumer; see netlist.cir header)
    RS5.a: BP430      # screen rail — not traced to a shared board dropper on the available scan (two consumers, chained to each other only)
    RGL5.b: NBIAS     # bias-supply island (DB1/RB1/RB2/C13) is its own abstracted, unmodelled network — not wired into this anchor (see netlist_unplaced below)
  netlist_unplaced:
    R1s: "Bass ch. jack-2 stopper — chassis-mounted at the jacks, ahead of RG1A; no DC grid current so it moves no operating point"
    R2s: "Bass ch. jack-1 stopper — as R1s"
    R3s: "Normal ch. jack-2 stopper — as R1s"
    R4s: "Normal ch. jack-1 stopper — as R1s"
    RTN1: "Bass ch. tone-network treble-bleed slope — control-network island, not modelled in netlist.cir"
    RTN2: "Bass ch. tone-network bass-leg resistor — control-network island"
    RTN3: "Bass ch. tone-network dropper, paralleled by VR1 — control-network island"
    RBF: "Bass ch. tone-network foot — control-network island"
    RTN4: "Normal ch. tone-network foot — control-network island"
    CTN1: "Bass ch. tone-network treble-bleed cap — control-network island"
    CTN2: "Bass ch. tone-network bridging cap — control-network island"
    CTN3: "Bass ch. tone-network bridging cap — control-network island"
    CTN4: "Normal ch. tone-network treble cap — control-network island"
    CTN5: "Normal ch. tone-network bass-leg cap — control-network island"
    CTN6: "Normal ch. tone-network foot bypass — control-network island"
    CDR1: "V3A -> Bass ch. Treble coupling cap — control-network island, DC-open"
    C0: "V1A -> V1B interstage coupler (estimate) — DC-open, moves no operating point"
