# Board layout — redrawn from the published Fender "Bassman" Model 6G6-B (E-FB)
# layout drawing, page 1 (board.rows/cols follow the drawing's own terminal
# strip). Part refs are the shared key into bom.yaml; the renderer reads each
# value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them — never a
# trace or a dimensioned reproduction.
#
# The board reads left->right exactly as the drawing's tube row does: the
# bias supply and the silicon bridge/reservoir at the left, the dropper chain
# next, the two 5881 output tubes, the phase-inverter 7025, the Normal-channel
# 7025 pair, the shared-driver 7025 pair (with the Bass channel's own Treble
# pot in its signal path), and the Bass-channel 7025 pair at the right end —
# matching the drawing's front-panel groups (Presence/Normal pots at the left
# of the panel, Bass-channel Bass/Treble/Volume at the right).
board:
  rows: 2
  cols: 186
  title: "6G6-B · eyelet board layout"
caption: "Redrawn from the published Fender 'Bassman' Model 6G6-B (E-FB) layout drawing — principal board components, in the order the drawing shows them. Each channel's Bass/Treble/Volume tone network mounts on the board on the published sheet and is drawn here in full (the Bass channel's own Treble control sits in the shared driver bottle's own signal path, per the front-panel silkscreen order). The 6.3 V heater chain (green twisted pair, PT -> pilot lamp -> the two 5881 outputs -> the phase-inverter 7025 -> the Normal-channel 7025 -> the driver 7025 -> the Bass-channel 7025) is routed in the drawing's own socket order. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Bassman' Model 6G6-B drawing (E-FB), board-layout page"
  url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_6g6b.pdf"

# Wiring proven electrically equivalent to netlist.cir by
# pipeline/verify_layout_nets.py (PASS — see net_map at the foot of this file
# for the anchors/netlist_unplaced reconciliation). All six tube bottles
# (V1-V6) anchor to their sockets by id with zero UNANCHORED; the four 12AX7
# grid/plate/cathode triples and the two 5881 plate/screen/grid/cathode sets
# match the netlist node-for-node. meta.yaml's own verification.status stays
# draft (the DC-operating-point-vs-chart pass is a separate gate — see
# meta.yaml/notes.md); this wiring_claim covers only drawing<->netlist
# equivalence, which is what pipeline/verify_layout_nets.py hard-gates.
wiring_claim: verified

parts:
  # --- bias supply (far left) -------------------------------------------------
  - { ref: DB1, a: [1, 0], b: [1, 1] }      # bias rectifier diode, off the AC tap
  - { ref: RB1, a: [1, 2], b: [1, 3] }      # 1k 1W series
  - { ref: C13, a: [0, 3], b: [1, 3] }      # 25/50 uF dual can, shares RB1.b eyelet
  - { ref: RB2, a: [1, 4], b: [1, 5] }      # 27k 1W bleeder

  # --- silicon HT bridge + reservoir (B+1) ------------------------------------
  - { ref: DR1, a: [1, 8],  b: [1, 9] }     # leg A upper
  - { ref: DR2, a: [1, 9],  b: [1, 10] }    # leg A middle
  - { ref: DR3, a: [1, 10], b: [1, 11] }    # leg A lower -> B+1
  - { ref: DR4, a: [1, 13], b: [1, 14] }    # leg B upper
  - { ref: DR5, a: [1, 14], b: [1, 15] }    # leg B middle
  - { ref: DR6, a: [1, 15], b: [1, 16] }    # leg B lower -> B+1
  - { ref: C10, a: [0, 17], b: [1, 17] }    # 20 uF, first B+ node

  # --- dropper chain: 4.7k -> choke -> 20uF -> 27k -> 20uF(dual) -------------
  - { ref: RD1, a: [1, 20], b: [1, 21] }    # 4.7k 1W, before the choke
  - { ref: L1,  a: [0, 24], b: [0, 26] }    # choke TR2, 125C1A (axial, top row)
  - { ref: C11, a: [0, 28], b: [1, 28] }    # 20 uF, post-choke (BP428)
  - { ref: RD2, a: [1, 30], b: [1, 31] }    # 27k 1W, preamp/driver tap
  - { ref: C12, a: [0, 33], b: [1, 33] }    # 20 uF dual, driver/preamp taps (BP410)

  # --- output pair support (V5 upper phase / V6 lower phase) -----------------
  - { ref: C2,   a: [0, 37], b: [0, 39] }   # 0.1 uF V4A plate -> V5 grid
  - { ref: RGL5, a: [0, 39], b: [1, 39] }   # 220k V5 grid leak -> -BIAS, shares eyelet
  - { ref: RS5,  a: [1, 41], b: [1, 42] }   # 470 1W V5 screen stopper
  - { ref: C3,   a: [0, 44], b: [0, 46] }   # 0.1 uF V4B plate -> V6 grid
  - { ref: RGL6, a: [0, 46], b: [1, 46] }   # 220k V6 grid leak -> -BIAS, shares eyelet
  - { ref: RS6,  a: [1, 48], b: [1, 49] }   # 470 1W V6 screen stopper

  # --- long-tailed-pair phase inverter (V4A/V4B) ------------------------------
  - { ref: C1,   a: [0, 52], b: [0, 54] }   # 500 pF driver -> V4A grid
  - { ref: RL4A, a: [0, 56], b: [0, 57] }   # 82k 5% V4A plate load
  - { ref: RL4B, a: [0, 58], b: [0, 59] }   # 100k 5% V4B plate load
  - { ref: RG4A, a: [0, 60], b: [1, 60] }   # 1M V4A grid leak -> tail junction
  - { ref: RG4B, a: [0, 61], b: [1, 61] }   # 1M V4B grid leak -> tail junction
  - { ref: RTAIL, a: [1, 64], b: [1, 66] }  # 820 shared cathode (a=JPI hub, b=KPI near V4)
  - { ref: RFOOT, a: [1, 62], b: [1, 64] }  # 10k (estimate) tail -> ground, b shares RTAIL.a (JPI)

  # --- shared driver (V3A/V3B) + Bass channel's own Treble control -----------
  - { ref: RG3A, a: [0, 70], b: [1, 70] }   # 1M (estimate) V3A grid leak — mix node
  - { ref: RL3A, a: [0, 71], b: [0, 72] }   # 100k V3A plate load
  - { ref: RK3A, a: [1, 71], b: [1, 72] }   # 1500 (estimate) V3A cathode
  - { ref: CDR1, a: [0, 74], b: [0, 76] }   # 0.1 uF V3A plate -> Bass ch. Treble
  - { ref: RG3B, a: [0, 79], b: [1, 79] }   # 1M (estimate) V3B grid leak
  - { ref: RL3B, a: [0, 80], b: [0, 81] }   # 100k V3B plate load
  - { ref: RK3B, a: [1, 80], b: [1, 81] }   # 1500 V3B cathode
  - { ref: RM2,  a: [0, 83], b: [0, 84] }   # 470k V3B -> PI mixing/coupling

  # --- Normal channel: V2A input, tone network, V2B recovery -----------------
  - { ref: R3s,  a: [1, 88], b: [1, 89] }   # 68k jack 2 stopper
  - { ref: R4s,  a: [1, 90], b: [1, 91] }   # 68k jack 1 stopper
  - { ref: RG2A, a: [0, 87], b: [1, 87] }   # 1M input grid leak
  - { ref: RL2A, a: [0, 92], b: [0, 93] }   # 100k V2A plate load
  - { ref: RK2A, a: [1, 93], b: [1, 94] }   # 1500 V2A cathode
  - { ref: CK2A, a: [0, 94], b: [0, 95] }   # 25 uF bypass, shares RK2A.b eyelet (col)
  - { ref: CTN4, a: [0, 97], b: [0, 99] }   # 250 pF treble branch, off V2A plate
  - { ref: CTN5, a: [1, 97], b: [1, 101] }  # 0.05 uF bass-leg branch, off V2A plate, shares RTN4.a eyelet
  - { ref: RTN4, a: [1, 101], b: [1, 102] } # 6800 tone-network foot
  - { ref: CTN6, a: [0, 101], b: [0, 102] } # 0.005 uF foot bypass
  - { ref: RG2B, a: [0, 106], b: [1, 106] } # 1M (estimate) V2B grid leak
  - { ref: RL2B, a: [0, 107], b: [0, 108] } # 220k V2B plate load, off +355 V
  - { ref: RK2B, a: [1, 107], b: [1, 108] } # 2700 V2B cathode
  - { ref: CK2B, a: [0, 109], b: [0, 110] } # 25 uF bypass, shares RK2B.b eyelet (col)
  - { ref: RM1,  a: [0, 112], b: [0, 113] } # 470k Normal ch. mixer -> mix node

  # --- shared driver's Bass-ch. Treble + Normal Bass/Treble/Volume pots are
  # off-board (see below); the following are the Bass channel's own network --
  - { ref: R1s,  a: [1, 156], b: [1, 157] } # 68k jack 2 stopper
  - { ref: R2s,  a: [1, 158], b: [1, 159] } # 68k jack 1 stopper
  - { ref: RG1A, a: [0, 155], b: [1, 155] } # 1M input grid leak
  - { ref: RL1A, a: [0, 160], b: [0, 161] } # 220k V1A plate load
  - { ref: RK1A, a: [1, 160], b: [1, 161] } # 2700 V1A cathode
  - { ref: CK1A, a: [0, 162], b: [0, 163] } # 25 uF bypass, shares RK1A.b eyelet (col)
  - { ref: C0,   a: [0, 165], b: [0, 167] } # 0.1 uF (estimate) interstage coupler
  - { ref: RG1B, a: [0, 167], b: [1, 167] } # 1M V1B grid leak, shares C0.b eyelet
  - { ref: RL1B, a: [0, 168], b: [0, 169] } # 220k (estimate) V1B plate load
  - { ref: RK1B, a: [1, 169], b: [1, 170] } # 100k V1B cathode, unbypassed
  - { ref: CTN1, a: [0, 172], b: [0, 174] } # 250 pF treble-bleed branch, off V1B plate
  - { ref: RTN1, a: [0, 174], b: [0, 176] } # 47k treble-bleed slope, shares CTN1.b eyelet
  - { ref: RTN2, a: [1, 172], b: [1, 174] } # 1M bass-leg branch, off V1B plate
  - { ref: CTN2, a: [1, 174], b: [1, 176] } # 0.25 uF bridging cap, shares RTN2.b eyelet
  - { ref: CTN3, a: [0, 176], b: [0, 178] } # 0.25 uF bridging cap, shares RTN1.b eyelet
  - { ref: RTN3, a: [0, 178], b: [1, 178] } # 10k dropper, paralleled by VR1, shares CTN3.b eyelet
  - { ref: RBF,  a: [1, 178], b: [1, 179] } # 820 tone-network foot -> ground, shares RTN3.b eyelet

