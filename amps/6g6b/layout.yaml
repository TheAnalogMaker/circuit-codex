  - { id: V5,  ref: V5, kind: tube, edge: bottom, at: 42,  label: "V5 · 5881" }
  - { id: V6,  ref: V6, kind: tube, edge: bottom, at: 49,  label: "V6 · 5881" }
  - { id: T3,  ref: T3, kind: xfmr, edge: bottom, at: 56,  label: "Output trans" }
