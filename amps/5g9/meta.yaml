# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5g9"
name_style: "Tweed Tremolux-style"
family: tweed
era:
  start: 1957
  end: 1960
wattage: 18
tubes: [12AY7, 12AX7, 12AX7, 6V6GT, 6V6GT, 5U4GB]
topology:
  rectifier: { kind: tube, type: "5U4GB" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: single-knob
# No lineage edge is drawn. The sheet's own note says late 5E9-A models are
# similar, and the corpus carries no 5E9-A entry to point at; the preamp's
# resemblance to the 5E3 is a resemblance, not a documented derivation. The
# chronological chain lives in history/families/tremolux.yaml, where it belongs.
conventions:
  designators: functional   # role codes: RD1 dropper, RL1 plate load, CK1 cathode bypass
  notation: us
sources:
  - desc: "Fender, \"Tremolux\" Model 5G9 drawing (drawing code B-EI), two pages; in this copy page 1 is the layout and page 2 the schematic. Supplies every component value and every printed voltage recorded here. All were read from this copy, a high-resolution scan (about 700–780 ppi) of EL34World's PDF, reached through the Wayback Machine. A first pass from the lower-resolution copy cited below misread the tremolo oscillator's cathode resistor. The sheet prints the notice \"Voltages read to ground with electronic voltmeter. Values shown + or - 20%\" and the notes \"Late 5E9-A models are similar to this model\" and \"All resistors are 1/2 watt, 10%, unless specified\". Its transformer block reads \"POWER TRANS. 8160\", \"CHOKE 14684\" and \"OUTPUT TRANS. 108\", with the HT winding lettered 300 V AC each side of the centre tap. Not reproduced here."
    url: "https://web.archive.org/web/20150316142123/http://el34world.com/charts/Schematics/files/fender/Fender_TREMOLUX_5G9.pdf"
  - desc: "Schematic Heaven, the same Fender 5G9 drawing (drawing code B-EI), page 1 schematic and page 2 layout. Cited because it is the copy a reader can fetch today. It is the lower-resolution copy (page images of 1064 × 775 and 1494 × 976 pixels), too coarse to tell two of the chart's digits apart. No value on this page rests on it."
    url: "https://schematicheaven.net/fenderamps/tremolux_5g9_schem.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Fender Narrow Panel Tweed Tremolux\". Supplies the line's span, 1955–1960, at 18 W with tremolo; its schematics, listed as 5E9 (1955), 5E9-A (1955–56) and 5G9 (1957–60); a 12AY7 preamp and two 6V6GT throughout; and the 5G9 alone on fixed, non-adjustable bias with a 5U4GB rectifier. The production window and the 18 W rating here come from this page; the circuit facts come from the drawing."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-narrow-panel-tweed-tremolux"
verification:
  status: draft
added: 2026-09-09
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V3: "excluded — the tremolo bottle: a running phase-shift oscillator (V3A) and the cathode follower direct-coupled to its swinging plate (V3B); neither has a static operating point, and the netlist header states the ~2 mA the pair would draw"
