# Parts list — read from the published 5G9 Tremolux drawing (page 1 schematic,
# page 2 layout; both carry the same values). Reference designators follow the
# DC netlist where a part is modelled and are descriptive otherwise; every one
# of them is cross-checked against the redrawn schematic (schematic.kicad_sch)
# by pipeline/validate.py, in both directions. The drawing's notice sets
# ½ W · 10 % resistors unless a part is marked otherwise, and every value below
# is the drawing's own.
notes: "The chassis carries two Inst. and two Mic. jacks, each channel's pair on its own two 68 kΩ stoppers over one 1 MΩ leak. The rectifier is lettered 5U4GB, as the drawing prints it; models/5u4g.inc is a 5U4G/5U4GA/5U4GB class approximation and nothing in netlist.cir instantiates it (see the netlist header). The tremolo bottle's parts are listed in full, but neither half's DC operating point is in the netlist (see notes.md). Parts drawn only as annotations — mains cap, fuse, power switch, pilot lamp, jacks — are listed without designators. The transformers are numbered T1 (power) and T2 (output) under the archive's convention; the drawing letters them only by factory number, 8160 and 108, with the choke 14684."
items:
  # --- Inst. channel input (V1A) ---
  - { ref: R1n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Inst. input grid stopper (jack 1)" }
  - { ref: R2n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Inst. input grid stopper (jack 2)" }
  - { ref: RG1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",    role: "Inst. input grid leak" }
  - { ref: RL1, part: "Carbon comp resistor", value: "100 kΩ · ½ W",  role: "V1A plate load" }
  # --- Mic. channel input (V1B) ---
  - { ref: R3n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Mic. input grid stopper (jack 1)" }
  - { ref: R4n, part: "Carbon comp resistor", value: "68 kΩ · ½ W",   role: "Mic. input grid stopper (jack 2)" }
  - { ref: RG2, part: "Carbon comp resistor", value: "1 MΩ · ½ W",    role: "Mic. input grid leak" }
  - { ref: RL2, part: "Carbon comp resistor", value: "100 kΩ · ½ W",  role: "V1B plate load" }
  # --- Shared V1 cathode ---
  - { ref: RK1, part: "Carbon comp resistor", value: "820 Ω · ½ W",   role: "Shared V1A/V1B cathode bias" }
  - { ref: CK1, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "Shared V1A/V1B cathode bypass" }
  # --- Volume and tone controls ---
  - { ref: C1,  part: "Coupling capacitor",   value: "0.1 µF · 400 V", role: "V1A plate → the Inst. volume control's WIPER" }
  - { ref: C2,  part: "Coupling capacitor",   value: "0.1 µF · 400 V", role: "V1B plate → the Mic. volume control's WIPER" }
  - { ref: VR1, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Inst. volume — signal on the wiper, one end grounded, the other on the mixing node" }
  - { ref: VR2, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Mic. volume — wired the same way" }
  - { ref: VR3, part: "Audio-taper potentiometer", value: "1 MΩ-A",   role: "Tone — its wiper feeds the mixing node" }
  - { ref: C3,  part: "Mica capacitor",       value: "500 pF",        role: "Inst. coupler node → the tone control's hot end. The sheet letters it .0005-400, so the drawing does give it a 400 V rating; house units carry sub-nanofarad parts in picofarads and without a working voltage" }
  - { ref: C4,  part: "Film capacitor",       value: "0.005 µF · 400 V", role: "Tone control's cold end → ground" }
  - { ref: C5,  part: "Coupling capacitor",   value: "0.02 µF · 400 V", role: "Mixing node → phase-inverter hot grid" }
  # --- V2 long-tailed-pair phase inverter ---
