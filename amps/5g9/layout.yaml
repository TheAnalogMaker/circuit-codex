  - { from: CK3.b, to: [1.45, 63] }
  - { from: RK4.a, to: V3.pin8, via: [[65.889, -0.164], [65.889, 2.6], [58.8, 2.6]] }
  - { from: RK4.b, to: [1.45, 65] }
