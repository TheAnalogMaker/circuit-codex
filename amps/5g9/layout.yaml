# Board layout — redrawn from the published Fender 5G9 'Tremolux' drawing
# (B-EI), page 2, which is a factory LAYOUT sheet in its own right. Part refs
# are the shared key into bom.yaml; the renderer reads each value and part type
# from there. A legible, schematic-style redraw of the board's principal
# components in the order the drawing shows them — never a trace or a
# dimensioned reproduction.
#
# The board reads left→right as the sheet's does: the bias divider and its two
# 8 µF cans with the 10 kΩ · 1 W dropper at the left end, then the output
# stage's screen resistors, grid leaks and couplers, then the phase inverter,
# then the tremolo, and the two channel input stages at the right — matching the
# tube row below it (5U4GB · 6V6GT · 6V6GT · 12AX7 inverter · 12AX7 tremolo ·
# 12AY7). The panel controls are drawn beside the parts they serve rather than
# in the sheet's own left-to-right knob order (Depth · Speed · Tone · Inst. Vol.
# · Mic. Vol.), so their leads stay readable — the house practice on every
# layout in this corpus.
#
# Machine-checked equivalence: the point-to-point wiring drawn below is checked
# electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo bottle's
# own network and the PT / rectifier AC side are an excluded annotation layer
# (not in netlist.cir).

board:
  rows: 2
  cols: 90
  title: "5G9 · eyelet board layout"
caption: "Redrawn from the published Fender 5G9 'Tremolux' drawing (B-EI), page 2 — the factory layout sheet — showing the principal board components and their hookup in the order that drawing shows them. Off the board: the four 20 µF · 500 V filter cans sit in the condenser box on the back of the chassis and the bias rectifier in its own small housing, both drawn here as stubs so every supply rail stays traceable; the tone capacitors and the Speed control's 100 kΩ end resistor mount at their pots. The four 68 kΩ grid stoppers sit on the board's right end, one pair per channel, each pair running from that channel's two jacks to one eyelet that feeds the 12AY7 grid; only the two 1 MΩ input grid leaks mount at the jacks. The bias rectifier takes a lead of its own from the power transformer — the tap between an HT end and the centre tap — straight to its \"+\" terminal. In the tremolo bottle the oscillator sits on pins 1–3 and the cathode follower on pins 6–8, with the 100 kΩ plate load between the two plates and the follower's grid strapped to the oscillator's plate. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6GT output tubes → the three small bottles) is drawn in the conventional daisy order: the sheet annotates it \"to all 6.3 volt heaters and pilot light\" rather than routing it. The 5U4GB is off that chain — it takes the 5 V winding. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Tremolux' Model 5G9 drawing (B-EI) — the factory LAYOUT page (page 1 of the el34world copy; the schematic page is the one redrawn in this amp's schematic.kicad_sch). This board order is read from that layout page, not derived from the schematic. Read at its native 6518 x 4128 raster (701 ppi) via the Wayback Machine, el34world.com being unreachable"
  url: "https://web.archive.org/web/20150316142123/http://el34world.com/charts/Schematics/files/fender/Fender_TREMOLUX_5G9.pdf"

parts:
  # --- bias divider, its filter cans, and the rail dropper -----------------
  - { ref: R11, a: [0, 1], b: [1, 1] }      # 82k, −69 V → −28 V
  - { ref: C13, a: [0, 3], b: [1, 3] }      # 8 µF · 150 V on the −69 V node
  - { ref: R12, a: [0, 5], b: [1, 5] }      # 56k, −28 V → ground
  - { ref: C14, a: [0, 7], b: [1, 7] }      # 8 µF · 150 V on the −28 V line
  - { ref: RD1, a: [0, 10], b: [0, 13] }    # 10k · 1 W, +368 V → +310 V
  # --- output stage: screen resistors, grid leaks, couplers ----------------
  - { ref: RS1, a: [0, 16], b: [1, 16] }    # 470 Ω · 1 W V4 screen
  - { ref: RS2, a: [0, 18], b: [1, 18] }    # 470 Ω · 1 W V5 screen
  - { ref: RG4, a: [0, 21], b: [1, 21] }    # 220k V4 grid leak (Depth wiper → G61)
  - { ref: C7, a: [1, 21], b: [1, 24] }     # 0.02 µF PI hot plate → V4 grid
  - { ref: RG5, a: [0, 26], b: [1, 26] }    # 220k V5 grid leak
  - { ref: C8, a: [1, 26], b: [1, 29] }     # 0.02 µF PI cold plate → V5 grid
  # --- phase inverter -----------------------------------------------------
  - { ref: RLA, a: [0, 32], b: [1, 32] }    # 82k-5% hot plate load (+310 → PPIA)
  - { ref: RLB, a: [0, 34], b: [1, 34] }    # 100k-5% cold plate load (+310 → PPIB)
  - { ref: C5, a: [0, 37], b: [1, 37] }     # 0.02 µF mixing node → hot grid
  - { ref: RGA, a: [0, 39], b: [1, 39] }    # 1M hot grid leak (GPIA → JPI)
  - { ref: RTAIL, a: [0, 41], b: [1, 41] }  # 470 Ω inverter cathode resistor
  - { ref: RT2, a: [0, 43], b: [1, 43] }    # 10k tail resistor (JPI → ground)
  - { ref: RGB, a: [0, 45], b: [1, 45] }    # 1M cold grid leak (GPIB → JPI)
  - { ref: C6, a: [0, 47], b: [1, 47] }     # 0.1 µF / 200 V cold grid → ground
  # --- tremolo: oscillator, then the cathode follower ---------------------
  - { ref: RL3, a: [0, 50], b: [1, 50] }    # 100k oscillator plate load (+368)
  - { ref: C9, a: [1, 50], b: [1, 53] }     # 0.03 µF phase-shift, plate side
  - { ref: C10, a: [1, 53], b: [1, 56] }    # 0.01 µF phase-shift, middle
  - { ref: R8, a: [0, 56], b: [1, 56] }     # 1M phase-shift return to the cathode
  - { ref: C11, a: [1, 56], b: [1, 59] }    # 0.01 µF phase-shift, grid side
  - { ref: R7, a: [0, 59], b: [1, 59] }     # 1M oscillator grid leak to ground
  - { ref: RK3, a: [0, 61], b: [1, 61] }    # 1.5k oscillator cathode
  - { ref: CK3, a: [0, 63], b: [1, 63] }    # 25 µF oscillator cathode bypass
  - { ref: RK4, a: [0, 65], b: [1, 65] }    # 220k cathode-follower cathode load
  - { ref: C12, a: [0, 65], b: [0, 68] }    # 0.1 µF follower output coupler
  - { ref: R10, a: [0, 68], b: [0, 71] }    # 1M feed into the Depth control
  # --- channel input stages (V1 = 12AY7) ----------------------------------
  - { ref: RL1, a: [0, 74], b: [1, 74] }    # 100k Inst. plate load (+310 → PAY1)
  - { ref: C1, a: [1, 74], b: [1, 77] }     # 0.1 µF Inst. plate → volume WIPER
  - { ref: RL2, a: [0, 79], b: [1, 79] }    # 100k Mic. plate load (+310 → PAY2)
  - { ref: C2, a: [1, 79], b: [1, 82] }     # 0.1 µF Mic. plate → volume WIPER
  # --- the four 68k grid stoppers. B-EI (6518 x 4128) puts them on the board's
  # right end, not at the jacks: a pair per channel, each pair running from
  # that channel's two jacks to one eyelet that feeds the 12AY7 grid, in the
  # order .1 (Inst.) coupler, the Inst. pair, .1 (Mic.) coupler, the Mic. pair,
  # then the 820 / 25 cathode pair. Only the two 1 MΩ leaks sit on the jacks.
  - { ref: R1n, a: [0, 75], b: [0, 76] }    # 68k, Inst. jack 1 → Inst. grid eyelet
  - { ref: R2n, a: [0, 77], b: [0, 76] }    # 68k, Inst. jack 2 → the same eyelet
  - { ref: R3n, a: [0, 80], b: [0, 81] }    # 68k, Mic. jack 1 → Mic. grid eyelet
  - { ref: R4n, a: [0, 82], b: [0, 81] }    # 68k, Mic. jack 2 → the same eyelet
  - { ref: RK1, a: [0, 85], b: [1, 85] }    # 820 Ω shared 12AY7 cathode
  - { ref: CK1, a: [0, 87], b: [1, 87] }    # 25 µF shared cathode bypass

offboard:
  # --- chassis iron, the rectifier housing and the filter can box ----------
  - { id: T1, ref: T1, kind: xfmr, edge: left, at: 0.45, label: "Power trans" }
  - { id: PL1, kind: part, glyph: lamp, edge: left, at: 2.6, label: "Pilot lamp" }
  # Bias rectifier in its own small housing. Band at a: a takes the transformer
  # tap and is the terminal B-EI letters "+" (the cathode, which faces the
  # winding in a negative supply); its "-" terminal feeds the -69 V node.
  - { id: D1, ref: D1, kind: part, edge: top, at: 1.6, label: "D1", cathode: a }
  - { id: L1, ref: L1, kind: choke, edge: top, at: 9.6, label: "Choke" }
  - { id: C15, ref: C15, kind: part, edge: top, at: 5.2, label: "C15" }
  - { id: C16, ref: C16, kind: part, edge: top, at: 8.4, label: "C16" }
  - { id: C17, ref: C17, kind: part, edge: top, at: 11.6, label: "C17" }
  - { id: C18, ref: C18, kind: part, edge: top, at: 14.8, label: "C18" }
  # --- the tube row and the output iron ------------------------------------
  - { id: V6, ref: V6, kind: tube, edge: bottom, at: 4, label: "V6 · 5U4GB" }
  - { id: V4, ref: V4, kind: tube, edge: bottom, at: 9, label: "V4 · 6V6GT" }
  - { id: V5, ref: V5, kind: tube, edge: bottom, at: 14, label: "V5 · 6V6GT" }
  - { id: T2, ref: T2, kind: xfmr, edge: bottom, at: 19, label: "Output trans" }
  - { id: SPK, kind: jack, edge: bottom, at: 23.5, label: "Spkr" }
  - { id: V2, ref: V2, kind: tube, edge: bottom, at: 40, label: "V2 · 12AX7 inverter", label_nudge: [0, 26] }
  - { id: JTR, kind: jack, edge: bottom, at: 47.5, label: "Tremolo pedal" }
  - { id: V3, ref: V3, kind: tube, edge: bottom, at: 58, label: "V3 · 12AX7 tremolo" }
  - { id: V1, ref: V1, kind: tube, edge: bottom, at: 83, label: "V1 · 12AY7", label_nudge: [0, 26] }
  # --- front-panel controls and jacks --------------------------------------
  - { id: VR5, ref: VR5, kind: pot, edge: top, at: 23.5, label: "Depth" }
  - { id: VR4, ref: VR4, kind: pot, edge: top, at: 54, label: "Speed" }
  - { id: R9, ref: R9, kind: part, edge: top, at: 58, label: "R9" }
  - { id: VR3, ref: VR3, kind: pot, edge: top, at: 68, label: "Tone" }
  - { id: C3, ref: C3, kind: part, edge: top, at: 71.5, label: "C3" }
  - { id: C4, ref: C4, kind: part, edge: top, at: 74.6, label: "C4" }
  - { id: VR1, ref: VR1, kind: pot, edge: top, at: 78, label: "Inst. volume" }
  - { id: VR2, ref: VR2, kind: pot, edge: top, at: 82, label: "Mic. volume" }
  # both jacks of each channel, as B-EI draws them (jack 1 above jack 2)
  - { id: JI, kind: jack, edge: top, at: 84.4, label: "Inst. 1" }
  - { id: JI2, kind: jack, edge: top, at: 85.9, label: "Inst. 2" }
  - { id: JM, kind: jack, edge: top, at: 87.4, label: "Mic. 1" }
  - { id: JM2, kind: jack, edge: top, at: 88.9, label: "Mic. 2" }

# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 89.5] }

# Wiring — the hookup the two pages of the drawing describe between them, drawn
# lead by lead. Endpoints reference board eyelets (REF.a/REF.b), tube socket
# pins (Vn.pinN, validated against the basing data — heater pins on the twisted
# runs), pot lugs, jacks, off-board 2-lead parts and transformer / choke leads.
runs:
  # === power transformer -> 5U4GB -> the rail chain (annotation layer) ======
  - { from: T1.red1, to: V6.pin4, via: [[2.556, 0.267], [2.556, 2.612], [3.753, 2.612]] }
  - { from: T1.red2, to: V6.pin6, via: [[1.944, 0.388], [1.944, 1.647], [4.625, 1.647]] }
  - { from: T1.red-yellow, to: [1.45, 0.4], via: [[0.15, 0.95]] }
  - { from: V6.pin8, to: C15.a, color: red, via: [[4.464, 2.888], [10.333, 2.888], [10.333, -1.319], [4.811, -1.319]] }
  # === B+1 (+370 V): the reservoir cans, the OT centre tap, the choke ======
  - { from: C15.a, to: C16.a, color: red, via: [[5.389, -1.181], [8.011, -1.181]] }
  - { from: C15.a, to: L1.hi, color: red, via: [[5.083, -0.681], [9.406, -0.681]] }
  - { from: C16.a, to: T2.red, color: red, via: [[8.011, -0.474], [20.056, -0.474], [20.056, 1.509], [18.417, 1.509]] }
  # === B+2 (+368 V): post-choke — screens, the dropper, the tremolo bottle ==
  - { from: L1.lo, to: C17.a, color: red, via: [[9.794, -0.612], [11.211, -0.612]] }
  - { from: C17.a, to: RD1.a, color: red, via: [[10.611, -0.405], [10, -0.405]] }
  - { from: RD1.a, to: RS1.a, color: red, via: [[11.167, -0.267], [16, -0.267]] }
  - { from: RS1.a, to: RS2.a, color: red }
  - { from: RS2.a, to: RL3.a, color: red, via: [[18, -0.164], [50, -0.164]] }
  - { from: RL3.a, to: V3.pin6, via: [[49.222, -0.405], [60.611, -0.405], [60.611, 2.2], [58.526, 2.251]] }
  # === B+3 (+310 V): the inverter plate loads and both channel plate loads ==
  - { from: RD1.b, to: C18.a, color: red, via: [[13, -0.06], [14.411, -0.06]] }
  - { from: RD1.b, to: RLA.a, color: red, via: [[13.944, -0.129], [32, -0.129]] }
  - { from: RLA.a, to: RLB.a, color: red }
  - { from: RLB.a, to: RL1.a, color: red, via: [[34, -0.129], [74, -0.129]] }
  - { from: RL1.a, to: RL2.a, color: red, via: [[74.3, -0.12], [78.7, -0.12]] }
  # --- the four condenser-box cans return to the ground bus ---
  - { from: C15.b, to: [1.45, 5.9], via: [[5.589, -0.612], [5.9, -0.612]] }
  - { from: C16.b, to: [1.45, 11], via: [[8.789, -0.543], [11, -0.543]] }
  - { from: C17.b, to: [1.45, 12.2], via: [[11.989, -0.543], [12.2, -0.543]] }
  - { from: C18.b, to: [1.45, 15.4], via: [[15.189, -0.543], [15.4, -0.543]] }
  # === bias supply: the bias tap -> rectifier -> 8 uF -> 82k / 56k -> -28 V ===
  # B-EI draws a lead of its own from the transformer straight to SEL. RECT.
  # "+", unlettered; it is named here by its place on the winding (the tap
  # between an HT end and the centre tap, the schematic's HT_TAP), not by a
  # guessed colour.
  - { from: T1.ht_tap, to: D1.a, via: [[-1.472, 0.357], [-1.472, -1.043], [1.211, -1.043]] }
  - { from: D1.b, to: R11.a, via: [[1.989, -0.75], [1, -0.75]] }
  - { from: R11.a, to: C13.a }
  - { from: C13.b, to: [1.45, 3] }
  - { from: R11.b, to: R12.a, via: [[2.444, 1.181], [2.444, -0.112], [5, -0.112]] }
  - { from: R12.a, to: C14.a }
  - { from: R12.b, to: [1.45, 5] }
  - { from: C14.b, to: [1.45, 7] }
  # === the Depth control sits in the bias line ==========================
  - { from: C14.a, to: VR5.lug1, color: yellow, via: [[7.556, -0.336], [23.194, -0.336]] }
  - { from: R10.b, to: VR5.lug3, color: brown, via: [[71.722, -0.302], [23.806, -0.302]] }
  - { from: VR5.lug2, to: RG4.a, color: yellow, via: [[23.5, -0.612], [21, -0.612]] }
  - { from: RG4.a, to: RG5.a, color: yellow }
  # === output stage: screens, grids, plates, cathodes ====================
  - { from: RS1.b, to: V4.pin4, via: [[16, 1.233], [8.753, 1.233]] }
  - { from: RS2.b, to: V5.pin4, via: [[18, 1.302], [13.753, 1.302]] }
  - { from: RG4.b, to: V4.pin5, via: [[21, 1.371], [9.247, 1.371]] }
  - { from: RG5.b, to: V5.pin5, via: [[26, 1.095], [14.247, 1.095]] }
  - { from: V4.pin8, to: [1.45, 9.463] }
  - { from: V5.pin8, to: [1.45, 14.463] }
  - { from: T2.blue, to: V4.pin3, via: [[18.806, 2.241], [7.278, 2.241]] }
  - { from: T2.brown, to: V5.pin3, via: [[19.194, 2.379], [12.278, 2.379]] }
  - { from: T2.green, to: SPK.tip, via: [[19.583, 1.81], [23.361, 1.81]] }
  - { from: SPK.sleeve, to: [1.45, 23.9], via: [[23.639, 1.81], [23.9, 1.81]] }
  # === phase inverter: plates, grids, cathodes, tail =====================
  - { from: RLA.b, to: C7.b, via: [[32, 1.198], [24, 1.198]] }
  - { from: RLA.b, to: V2.pin6, via: [[32.833, 1.267], [40.625, 1.267]] }
  - { from: RLB.b, to: C8.b, via: [[34, 1.336], [29, 1.336]] }
  - { from: RLB.b, to: V2.pin1, via: [[34.833, 1.388], [37.833, 1.388], [37.833, 2.328], [39.536, 2.328]] }
  - { from: C5.b, to: RGA.a, via: [[37, 1.147], [38, 1.147], [38, -0.06], [39, -0.06]] }
  - { from: RGA.a, to: V2.pin7, via: [[40.056, -0.06], [42.278, -0.06], [42.278, 2.198]] }
  - { from: RGA.b, to: RTAIL.b }
  - { from: RTAIL.b, to: RT2.a, via: [[41.722, 1.147], [43.944, 1.147], [43.944, -0.06], [43, -0.06]] }
  - { from: RT2.a, to: RGB.b }
  - { from: RT2.b, to: [1.45, 43] }
  - { from: RTAIL.a, to: V2.pin8, via: [[40.333, -0.267], [38.5, -0.267], [38.5, 2.802], [40.464, 2.802]] }
  - { from: V2.pin8, to: V2.pin3, via: [[39.5, 2.612], [38.111, 2.612], [38.111, 2.371]] }
  - { from: RGB.a, to: C6.a }
  - { from: RGB.a, to: V2.pin2, via: [[42.43, -0.682], [35.889, -0.095], [35.889, 2.716], [39.029, 2.716]] }
  - { from: C6.b, to: [1.45, 47] }
  # === tremolo oscillator and its cathode follower (annotation layer) =====
  # B-EI (6518 x 4128): the oscillator sits on pins 1/2/3 and the cathode
  # follower on 6/7/8. The 100K is drawn across the socket from pin 6 (the
  # follower plate, on +368 V) to pin 1 (the oscillator plate), and a strap
  # runs from pin 7 (the follower grid) to pin 1 — the direct coupling the
  # circuit is built around, which the board had left out.
  - { from: RL3.b, to: V3.pin1, via: [[50.889, 1.147], [56.9, 1.147], [56.9, 2.6]] }
  - { from: V3.pin7, to: V3.pin1, via: [[59.784, 2.576], [59.2, 2.95], [57.07, 2.95]] }
  - { from: C9.b, to: VR4.lug1, color: blue, via: [[53, -0.474], [53.694, -0.474]] }
