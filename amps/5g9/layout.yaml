  - { from: JI2.tip, to: R2n.a, via: [[85.9, -0.64], [77.3, -0.64]] }
  - { from: R1n.b, to: V1.pin7, via: [[76.3, 0.35], [78, 0.5], [78, 2.02], [84.4, 2.343], [84.4, 2.35]] }
  - { from: JM.tip, to: R3n.a, via: [[87.4, -0.3], [80.3, -0.3]] }
  - { from: JM2.tip, to: R4n.a, via: [[88.9, -0.4], [82.3, -0.4]] }
  - { from: R3n.b, to: V1.pin2, via: [[81.3, 0.35], [83.77, 0.5], [83.6, 1.12], [81.8, 1.92], [81.8, 2.6]] }
  # === volume and tone controls =========================================
  # Each coupler lands on its pot's WIPER; one end of each volume pot is
  # grounded and the other joins the shared mixing node, which the tone
  # control's wiper also sits on and which feeds C5.
  - { from: C1.b, to: VR1.lug2, via: [[77.5, 0.55], [77.5, -0.3], [78, -0.3]] }
  - { from: C3.a, to: C1.b, via: [[70.611, -0.681], [70.611, 1.095], [77, 1.095]] }
  - { from: C2.b, to: VR2.lug2, via: [[82.5, 0.55], [82.5, -0.4]] }
  - { from: VR1.lug1, to: [1.45, 76.6], via: [[77.694, -0.474], [76.6, -0.474]] }
  - { from: VR2.lug1, to: [1.45, 80.8], via: [[81.694, -0.543], [80.8, -0.458]] }
  - { from: VR1.lug3, to: VR2.lug3, via: [[78.306, -0.405], [82.306, -0.405]] }
  - { from: VR1.lug3, to: C5.a, via: [[78.806, -0.336], [36.995, -0.339]] }
  - { from: VR3.lug2, to: C5.a, via: [[67.556, -0.216], [36.167, -0.216], [36.167, 0]] }
  - { from: VR3.lug3, to: C3.b, via: [[68.306, -0.75], [71.889, -0.75]] }
  - { from: VR3.lug1, to: C4.a, via: [[67.694, -0.474], [74.211, -0.474]] }
  - { from: C4.b, to: [1.45, 75.6], via: [[74.989, -0.582], [75.6, -0.543]] }
  # === 6.3 V heater chain (green twisted pair) ===========================
  # PT green pair -> pilot lamp -> V4 -> V5 -> V2 -> V3 -> V1. The sheet
  # annotates this chain ("to all 6.3 volt heaters and pilot light") rather
  # than routing it, so the daisy order is the conventional one. The 5U4GB
  # takes the 5 V winding and is off this chain. Twisted runs land only on
  # heater pins (octal 2/7, noval 4/5).
  - { from: T1.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V4.pin2, style: twisted, via: [[-2.556, 3.181], [8.289, 3.181]] }
  - { from: V4.pin7, to: V5.pin2, style: twisted, via: [[9.711, 3.129], [13.289, 3.129]] }
  - { from: V5.pin7, to: V2.pin4, style: twisted, via: [[14.711, 3.181], [39.753, 3.181]] }
  - { from: V2.pin5, to: V3.pin4, style: twisted, via: [[40.247, 3.129], [57.753, 3.129]] }
  - { from: V3.pin5, to: V1.pin4, style: twisted, via: [[58.247, 3.181], [82.753, 3.181]] }
  - { from: V1.pin4, to: V1.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  excluded_tubes:
    V3: "12AX7 tremolo — a phase-shift oscillator direct-coupled to a cathode follower. Neither half has a static DC operating point (both excluded from netlist.cir); the oscillator's plate load and the follower's cathode resistor are drawn on the board and its Speed network mounts at the pot. Its 6.3 V heater is on the twisted chain; no signal pin is DC-checked."
  # The push-pull output transformer: the netlist omits winding DCR, so both
  # 6V6 plate leads and the centre tap collapse onto the reservoir node BP.
  # The speaker jack: OT-secondary DCR is likewise omitted, and this circuit
  # takes no feedback off the secondary, so the winding reads as ground at DC.
  #
  # The Depth control's two lower terminals are ONE node. Its cold end is the
  # −28 V line the 82k/56k divider makes, and its wiper feeds the joined 220 kΩ
  # output grid leaks; the output grids draw no grid current, so no DC flows
  # through the pot and netlist.cir returns both leaks straight to NBIAS. Same
  # claim as sch_map.yaml's series_bridge on VR5.
  anchors:
    T2.red: BP        # OT primary centre tap → reservoir node
    T2.blue: BP       # OT primary, V4 plate lead
    T2.brown: BP      # OT primary, V5 plate lead
    SPK.tip: "0"      # OT-secondary DCR folded into ground
    VR5.lug1: NBIAS   # Depth cold end — the −28 V bias line itself
    VR5.lug2: NBIAS   # Depth wiper — the same node at DC (no grid current)
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out):
  netlist_unplaced:
    RCHOKE: "filter choke DCR (an estimate, 130 Ω BP→BS — see the netlist header) — realised as the off-board chassis choke L1 (leads hi/lo, kind: choke), not a board 2-lead part; its two rails are anchored independently (BP by the reservoir can and the OT centre tap, BS by the screen resistors and RD1)"
    RG1: "1 MΩ Inst.-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2: "1 MΩ Mic.-channel input grid leak — mounted at the input jacks"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-09-10).
  not_on_board:
    L1: "filter choke — a chassis part the 5G9 layout (B-EI, read at 6518 × 4128) does not draw: the +370 V and +368 V leads (lettered BLACK, BLACK) leave the board's lower-left corner through a chassis grommet to it. On this board it is only the off-board choke stub (kind: choke, leads hi/lo), which the sheet ↔ board gate has no two-lead vocabulary for"
  # Sheet terminal -> board terminal: the sheet numbers the transformer's bias
  # tap as T1 pin 6 (label HT_TAP); the board names that lead by its place on
  # the winding, since B-EI letters no colour on it.
  leads:
    T1.6: T1.ht_tap
