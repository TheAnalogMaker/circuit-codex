sources:
  - desc: "Fender 'Champ-Amp' Model 5C1 drawing (F-DH), schematic + layout sheets: every component value read directly from the published sheet — dual 75 kΩ input-jack resistors summed into a single 0.02 µF·600 V coupling cap; 6SJ7 grid-leak (contact) bias, no cathode resistor, 5 MΩ leak to ground; 2 MΩ screen dropper with a 0.05 µF·600 V bypass; 250 kΩ plate load; 0.02 µF·600 V interstage coupling into a 1 MΩ volume control; 6V6 grid off the pot wiper, cathode-biased on a shared 500 Ω/25 µF·25 V network. Power supply a two-resistor RC filter across three 8 µF·450 V cans, no choke: the reservoir feeds the 6V6 plate (via the OT primary) through a 500 Ω dropper, and a second 25 kΩ dropper off THAT node supplies a third rail shared by the 6V6 screen and the whole 6SJ7 plate/screen circuit — the screen is drawn off the far side of the 25 kΩ from its own plate, not off the plate's own node. The layout sheet's printed voltage chart (NOTICE: 'voltages read to ground with electronic volt meter, values shown +or-20%') gives +340 V at the reservoir, +320 V at the 6V6 plate node, +260 V at the shared 6V6-screen/6SJ7 node, +130 V at the 6SJ7 plate, and +14 V at the 6V6 cathode. The drawing prints no transformer or output-transformer part numbers. Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_5c1_schem.pdf"
  - desc: "Wikipedia, Fender Champ — wide-panel 5C1 dating (1953-1955) and its place in the Champion-to-Champ transition"
    url: "https://en.wikipedia.org/wiki/Fender_Champ"
