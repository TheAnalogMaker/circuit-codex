sources:
  - desc: "Fender, \"Champ-Amp\" Model 5C1 schematic and layout sheets (drawing code F-DH). Supplies every component value and the voltage chart printed on the layout sheet, under Fender's notice \"voltages read to ground with electronic volt meter, values shown +or-20%\". The +280 V lettered at the 6V6 screen is the node the screen shares with the 6SJ7 stage: the screen is fed from the far side of the 25 kΩ dropper, not from its own plate's node. The drawing prints no power or output transformer part numbers. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_5c1_schem.pdf"
  - desc: "Wikipedia, \"Fender Champ\". Dates the wide-panel 5C1 to 1953–1955 and places it in the change from the Champion to the Champ."
    url: "https://en.wikipedia.org/wiki/Fender_Champ"
  - desc: "Fender, \"Champ-Amp Layout, Model 5C1\" (drawing code F-DH), page 2 of the same PDF. Supplies the part order and point-to-point wiring for the board-layout diagram on this page. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_5c1_schem.pdf"
