# Board layout — redrawn from the published Fender "Champ-Amp Layout, Model
# 5C1" drawing (F-DH), page 2 of the same PDF as the schematic (page 1). Part
# refs are the shared key into bom.yaml; the renderer reads each value and
# part type from there. A legible, schematic-style redraw of the board's
# principal components in the order the drawing shows them — never a trace or
# a dimensioned reproduction.
#
# The board reads left->right exactly as the drawing's tube row does: 6SJ7 ·
# 6V6GT · 5Y3GT (preamp first, rectifier last) — the OPPOSITE reading order
# from every later Champ in this corpus (5E1/5F1 read rectifier-first), which
# is itself a small, honest fingerprint of how early this circuit sits in the
# line. The drawing's own dashed horizontal line divides eyelet-board parts
# (above) from chassis-mounted hardware (below): both 75 kΩ input resistors
# (R1/R2) are drawn wired directly at the two input jacks, below that line —
# unlike every later Champ's grid-leak, which the corpus otherwise draws
# on-board for traceability, these really are off-board here, so they are
# modelled as `kind: part` stubs at the jacks, matching the drawing. The 5 MΩ
# grid leak (R3), by contrast, sits ON the main board right at the 6SJ7
# socket in the source drawing, not at the jacks — the opposite placement
# from 5E1's R3 — and is drawn on-board here for the same reason.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, and the PT/
# rectifier AC side are an excluded annotation layer (not modelled in
# netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 28
  title: "5C1 · eyelet board layout"
caption: "Redrawn from the published Fender 'Champ-Amp Layout, Model 5C1' drawing (F-DH), page 2 — principal board components and point-to-point wiring, in the order and connections the drawing shows: 6SJ7 preamp stage, then 6V6GT output, then the resistor-dropped B+ chain and filter cans, then 5Y3GT rectifier — the reverse of the rectifier-first order every later Champ in this corpus reads. Filter and bypass electrolytics are drawn axially in the house style (the sheet stands most of them vertically, ground at the top). The 75 kΩ input resistors (R1, R2) are chassis-mounted directly at the input jacks on the source drawing, below its own dashed board/chassis divider — drawn here as off-board stubs at the jacks, not on the main board. The grid leak R3 (5 MΩ), by contrast, sits on the main board at the 6SJ7 socket in the source drawing and is drawn on-board here. The 6SJ7's suppressor grid (pin 3) is strapped directly to its cathode (pin 5) at the socket, per reference/tubes/6sj7.yaml basing — both already grounded in this contact-biased stage, so the strap lands on the same net either way. Transformer-lead colours (5Y3 red/yellow/red-yellow, OT blue/red) are marked as on the drawing; the OT secondary and the power transformer's black primary/AC-line/fuse/switch wiring remain unmarked or omitted, matching the corpus convention (neither is modelled elsewhere in this amp's data). The 6.3 V heater chain (green twisted pair) is routed PT -> pilot lamp -> 6V6 -> 6SJ7, the corpus's standard daisy order — the source schematic marks this winding only with a single directional note ('TO ALL 6.3 VOLT FILAMENTS, no explicit per-socket path drawn), so the specific daisy order is a documented convention, not a fact read off the sheet. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Champ-Amp Layout, Model 5C1' drawing (F-DH), page 2 of the same PDF as the schematic — board component order and wiring read directly from the published sheet"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_champ_5c1_schem.pdf"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; column shared across rows = vertical leg).
parts:
  # 6SJ7 preamp stage (leftmost, matching the drawing's tube row)
  - { ref: R3,  a: [0, 0],  b: [1, 0] }    # 5 Meg grid leak (vertical leg to ground)
  - { ref: C1,  a: [0, 1],  b: [0, 3] }    # 0.02 uF input coupling cap
  - { ref: R5,  a: [1, 4],  b: [1, 5] }    # 250k plate load
  - { ref: C3,  a: [0, 6],  b: [0, 8] }    # 0.02 uF plate -> volume pot coupler
  - { ref: C2,  a: [0, 9],  b: [1, 9] }    # 0.05 uF screen bypass (vertical leg)
  - { ref: R4,  a: [1, 10], b: [1, 11] }   # 2 Meg screen dropper
  # 6V6GT output stage
  - { ref: R6,  a: [0, 12], b: [1, 12] }   # 500 ohm cathode (vertical leg)
  - { ref: C4,  a: [0, 13], b: [0, 15] }   # 25 uF cathode bypass
  # B+ chain: two resistor droppers (no choke on this pre-5E1 circuit) + filters
  - { ref: R7,  a: [1, 16], b: [1, 17] }   # 500 ohm dropper B+1->B+2
  - { ref: R8,  a: [1, 18], b: [1, 19] }   # 25k dropper B+2->B+3
  - { ref: C5,  a: [0, 20], b: [0, 21] }   # 8 uF filter, B+1 (reservoir)
  - { ref: C6,  a: [0, 22], b: [0, 23] }   # 8 uF filter, B+2
  - { ref: C7,  a: [0, 24], b: [0, 25] }   # 8 uF filter, B+3

# Off-board items drawn as labelled stubs around the board, in the drawing's
# positions: the two input jacks and their chassis-mounted 75k resistors at
# the left (below the board proper), tubes along the bottom in the drawing's
# own left-to-right order, the volume pot and output transformer/speaker jack
# up top, the power transformer at the right where every coloured lead in the
# drawing visibly converges.
offboard:
  - { id: J1,  kind: jack, edge: bottom, at: -4.6, label: "In 1" }
  - { id: R1,  ref: R1, kind: part, edge: bottom, at: -3.6, label: "R1" }
  - { id: J2,  kind: jack, edge: bottom, at: -2.3, label: "In 2" }
  - { id: R2,  ref: R2, kind: part, edge: bottom, at: -1.3, label: "R2" }
  - { id: V1,  ref: V1, kind: tube, edge: bottom, at: 2,    label: "V1 · 6SJ7" }
  - { id: VR1, ref: VR1, kind: pot, edge: top,    at: 7,    label: "Volume" }
  - { id: V2,  ref: V2, kind: tube, edge: bottom, at: 12.5, label: "V2 · 6V6GT" }
  - { id: PL1, kind: part, glyph: lamp, edge: bottom, at: 19, label: "Pilot lamp" }
  - { id: T1,  ref: T1, kind: xfmr, edge: top,    at: 16,   label: "Output trans" }
  - { id: SPK, kind: jack, edge: top, at: 25,   label: "Spkr jack" }
  - { id: V3,  ref: V3, kind: tube, edge: bottom, at: 24.5, label: "V3 · 5Y3GT" }
  - { id: PT,  kind: xfmr, edge: right, at: 1.0, label: "Power trans" }

# Ground bus — the bare-wire rail running the length of the board just below
# the bottom eyelet row; cathode, filter, grid-leak, and pot grounds all tie
# to it. Extended left past column 0 to reach the chassis-mounted jack
# resistors' ground returns.
bus:
  - { from: [1.45, -5.4], to: [1.45, 27.4] }

# Wiring — read lead-by-lead from the published 5C1 layout drawing (F-DH,
# page 2). The power-transformer secondary leads carry the colours marked on
# the drawing (RED HT plates, YELLOW 5 V rectifier filament, RED-YELLOW HT
# centre tap); the output transformer's plate lead is marked BLUE and its B+
# lead RED. The 6.3 V heater winding is the green pair; the source schematic
# marks it only "TO ALL 6.3 VOLT FILAMENTS" with no per-socket path drawn, so
# it is routed here in the corpus's standard daisy order (green twisted pair,
# style: twisted) — pilot lamp -> 6V6 -> 6SJ7 (the 5Y3GT rectifier is directly
# heated off its own 5 V winding, so it is not on this chain). The PT primary
# (black) and the AC-line/fuse/switch wiring remain omitted — neither is
# modeled elsewhere in this amp's data, matching schematic.kicad_sch's own
# "heaters and PT primary omitted" note. Endpoints reference board eyelets
# (REF.a/REF.b), tube socket pins (Vn.pinN, validated against reference/tubes
# basing — heater pins on the twisted runs), pot lugs, jacks, off-board
# 2-lead parts (R1.a/R1.b), and transformer leads by colour name.
runs:
  # --- input jacks + their own 75k shunt resistors, summed at C1 ------------
  # J1/R1/J2/R2 are all bottom-edge off-board items (below the board, ~row 2);
  # each jack lands on its own resistor's live terminal, which fans up to the
  # coupling cap in its own lane so the two feeds never run parallel.
  - { from: J1, to: R1.a }
  - { from: R1.b, to: [1.45, -3.9] }
  - { from: R1.a, to: C1.a, via: [[-2, 1.55]] }
  - { from: J2, to: R2.a }
  - { from: R2.b, to: [1.45, -1.6] }
  - { from: R2.a, to: C1.a, via: [[-0.5, 1.25]] }

  # --- V1 6SJ7 preamp stage --------------------------------------------------
  - { from: C1.b, to: R3.a, via: [[1.5, -0.35]] }        # coupler -> grid leak (bows above row0, clear of C1's own leads)
  - { from: R3.a, to: V1.pin4, via: [[0.4, 1.2]] }       # grid leak -> V1 grid
  - { from: R3.b, to: [1.45, 0] }                        # grid leak -> ground bus
  - { from: V1.pin8, to: R5.a, via: [[2.4, 1.6]] }       # V1 plate -> 250k load
  - { from: R5.a, to: C3.a }                             # plate node -> coupler
  - { from: R5.b, to: C7.a, via: [[5.5, 1.55], [23.4, 1.55]] }    # plate load -> B+3 (deep lane, own row, approaches from the left)
  - { from: V1.pin6, to: R4.a, via: [[2.6, 1.75], [10.4, 1.75]] } # screen -> 2Meg dropper (own lane)
  - { from: R4.a, to: C2.a, via: [[10, -0.3], [9, -0.3]] }        # screen node -> bypass tap (bows above row1)
  - { from: R4.b, to: R8.b, via: [[11.4, 1.7], [18.3, 1.7]] }     # dropper -> B+3 (lands at the nearer R8.b eyelet, own lane)
  - { from: C2.b, to: [1.45, 9] }                        # screen bypass -> ground bus
  - { from: V1.pin5, to: [1.45, 1.8], via: [[2.4, 1.86]] }  # cathode -> ground bus (contact bias, no resistor)
  - { from: V1.pin3, to: V1.pin5 }                       # suppressor (g3) strapped to cathode at the socket

  # --- volume pot: coupler -> top lug, wiper -> V2 grid, bottom lug grounded
  - { from: C3.b, to: VR1.lug3, via: [[8.6, -0.5]] }
  - { from: VR1.lug1, to: [1.45, 7], via: [[7, 0.3]] }
  - { from: VR1.lug2, to: V2.pin5, via: [[8, -0.45], [12.5, -0.45]] }

  # --- V2 6V6GT output stage --------------------------------------------------
  - { from: V2.pin3, to: T1.blue, via: [[12.5, 2.3], [15.3, 2.3], [15.3, 0.35]] }  # plate -> OT primary (blue; rise column clear of R7)
  - { from: T1.red, to: C6.a, via: [[16, -0.6], [17.5, -0.6], [17.5, 2.6], [22, 2.6]] }  # OT primary -> B+2 (red; drops clear of the sec pigtail before moving right, then threads the R7/R8 gap)
  - { from: V2.pin4, to: C7.a, via: [[12.25, 2.35], [24.6, 2.35]] }  # screen -> B+3 (own deep lane, drops clear of pin5 before heading right, approaches C7.a from the right — shares the 6SJ7 preamp rail, not its own plate node)
  - { from: V2.pin8, to: R6.a, via: [[13.5, 1.95], [13.5, 0.2], [12, 0.2]] }  # cathode -> 500 ohm (swings right and rises clear of the VR1 wiper lead and pin5, approaches R6.a along row0 rather than up through R6's own column)
  - { from: R6.b, to: [1.45, 12] }                       # 500 ohm -> ground bus
  - { from: C4.a, to: R6.a }                             # cathode bypass across 500 ohm
  - { from: C4.b, to: [1.45, 13.7] }

  # --- B+ chain: reservoir, two resistor droppers, filters -------------------
  - { from: V3.pin8, to: C5.a, via: [[24.4, 2.15], [20.5, 2.15]] }  # 5Y3 B+ out -> reservoir (own deep lane)
  - { from: C5.b, to: [1.45, 21] }
  - { from: C5.a, to: R7.a }                             # B+1 -> 500 ohm dropper
  - { from: R7.b, to: C6.a }                              # -> B+2
  - { from: C6.b, to: [1.45, 23] }
  - { from: C6.a, to: R8.a, via: [[22, -0.3], [18, -0.3]] }  # B+2 -> 25k dropper (bows above row1)
  - { from: R8.b, to: C7.a }                             # -> B+3
  - { from: C7.b, to: [1.45, 25] }

  # --- power transformer -> 5Y3GT rectifier (marked colours) -----------------
  - { from: PT.red1, to: V3.pin4, via: [[25.7, 0.2]] }
  - { from: PT.red2, to: V3.pin6, via: [[26.1, 0.5]] }
  - { from: PT.red-yellow, to: [1.45, 25.2], via: [[26.8, 0.9], [26.8, 1.45]] }  # HT centre tap -> ground bus (own column, straight down before cutting left)
  - { from: PT.yellow1, to: V3.pin2, via: [[25.9, 1.3]] }
  - { from: PT.yellow2, to: V3.pin8, via: [[26.3, 1.65]] }

  # --- output transformer secondary -> speaker jack ---------------------------
  - { from: T1.sec, to: SPK, via: [[19.5, -0.9], [25, -0.9]] }
  - { from: SPK, to: [1.45, 2], via: [[25.6, -1.0], [2, -1.0]] }  # speaker return -> ground bus (own lane the length of the board, clear of the right corner's congestion)

  # --- 6.3 V heater chain (green twisted pair) --------------------------------
  # PT green pair -> pilot lamp -> 6V6 -> 6SJ7, corpus daisy order (the 5Y3GT
  # rectifier is directly heated off the 5 V winding, so it is not on this
  # chain). Twisted runs land only on heater pins (6V6 octal 2/7, 6SJ7 octal
  # 2/7); routed in a deep lane below the output harness.
  - { from: PT.green, to: PL1.a, style: twisted, via: [[26, 2.4], [19, 2.4]] }
  - { from: PL1.b, to: V2.pin7, style: twisted, via: [[19, 2.5], [12.5, 2.5]] }
  - { from: V2.pin2, to: V1.pin7, style: twisted, via: [[12.5, 2.55], [2, 2.55]] }
  - { from: V1.pin7, to: V1.pin2, style: twisted }       # close the pair at the last socket

# net_map — the reviewable data layer that reconciles the drawn wiring with the
# DC-operating-point netlist (netlist.cir) for pipeline/verify_layout_nets.py.
# Every entry records a documented abstraction the netlist makes, so the
# equivalence check never has to guess in code. See docs/layout-schema.md.
net_map:
  # Terminals the netlist gives no discrete node to reach on their own —
  # anchored to the netlist node they belong to. Both leads anchored to the
  # SAME node declare the DC bridge the netlist collapses: the output-
  # transformer primary DCR is omitted, so the 6V6 plate node == BP2.
  anchors:
    T1.blue: BP2   # OT primary, plate lead — netlist omits OT primary DCR (plate node = BP2)
    T1.red:  BP2   # OT primary, B+ lead — already on the board's B+2 net; anchor makes the bridge explicit
  # Netlist elements with no discrete board part — reported in coverage, never
  # a failure (their nodes still have to check out).
  netlist_unplaced:
    RVOL: "1 MΩ volume pot VR1 — netlist models the pot as a grid-leak (G2 -> 0); its wiper->grid tie is verified at the grid net"
