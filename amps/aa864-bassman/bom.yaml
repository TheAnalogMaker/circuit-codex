# Parts list — read from the published "BASSMAN-AMP AA864" drawing (H-FD).
# Reference designators follow the DC netlist where a part is modeled and are
# descriptive otherwise; every one of them is cross-checked against the redrawn
# schematic (schematic.kicad_sch) by pipeline/validate.py, in both directions.
# Values are the drawing's; the notice sets ½ W / 10% resistors and 400 V caps
# unless noted.
notes: "The drawing shows one jack pair per channel; the chassis carries two jacks per channel. Three 7025 bottles supply six triode sections and the circuit uses five — the Bass channel takes three stages and the Normal channel two — so one section is unused; the sheet does not say which bottle carries it. The tone stacks differ between channels: the Normal channel draws the blackface two-knob ladder (100 kΩ slope + 250 pF off the plate, 0.1 µF to the treble-lug/bass node, bass rheostat over the 0.047 µF / 6.8 kΩ foot), while the Bass channel draws the same ladder with a 250 kΩ resistor above a 50 kΩ treble pot, a 10 kΩ bass pot, three 0.1 µF caps off the slope node instead of the Normal channel's 0.1 / 0.047 pair, and a Deep switch that parallels the third of them into the grounded foot."
