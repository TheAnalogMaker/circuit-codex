# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  anchors:
    # The push-pull output transformer: the netlist omits winding DCR, so both
    # 6L6GC plate leads and the centre tap collapse onto the driven +422 V node.
    TR3.red:   BPL
    TR3.brown: BPL
    TR3.blue:  BPL
    # The 125C1A choke: both of its ends are printed, so the netlist drives the
    # screen rail directly and the choke's own DCR is not modelled.
    TR2.screen: BSC
    # The bias supply is replaced by an ideal -44 V source; the adjust pot's
    # wiper is the line the two 220 kOhm grid leaks return to.
    VRBIAS.lug2: NBIAS
  netlist_unplaced:
    RGB1: "1 MΩ Bass-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGN1: "1 MΩ Normal input grid leak — mounted at the input jacks, not on the eyelet board"
    RGB2: "Bass-channel second-stage grid return — realised through the 250 kΩ volume control, not a discrete board resistor (GB2→0)"
    RGN2: "Normal second-stage grid return — realised through the 1 MΩ volume control, not a discrete board resistor (GN2→0)"
