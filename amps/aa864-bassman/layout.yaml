# Board layout — redrawn from the published Fender AA864 layout drawing. Part
# refs are the shared key into bom.yaml; the renderer reads each value and part
# type from there. A legible, schematic-style redraw of the board's principal
# components in the order the drawing shows them — never a trace or a
# dimensioned reproduction.
#
# The board reads left→right in the order the sheet lays it out: the supply
# corner (the reservoir's balancing pair and the two rail droppers, at the
# +422 / +420 / +410 eyelets the sheet letters), then the output stage's
# couplers, grid leaks and stoppers, then the phase inverter with its tail,
# feedback and mix resistors, then the Normal channel, the Bass-channel driver,
# and finally the Bass Instrument channel with its three-capacitor ladder at the
# far right — matching the socket row on the drawing
# (6L6GC · 6L6GC · 12AT7 · 7025 · 7025 · 7025).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, and the PT /
# rectifier / bias AC side are an excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 101
  title: "AA864 · eyelet board layout"
caption: "Redrawn from the published Fender AA864 Bassman-Amp layout drawing — the principal board components, in the order the drawing shows them, with the point-to-point wiring drawn to the circuit sheet and machine-verified equivalent to the simulated netlist. The five filter cans, the whole negative-bias supply, the mains switches and fuse, the two 470 Ω · 1 W screen stoppers and the six rectifier diodes are chassis-mounted at their own terminals and are drawn as off-board parts; the 68 kΩ input stoppers and the two 1 MΩ grid leaks mount at the input jacks; the tone, volume, Deep and Bright networks reach their pots. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6L6GC output tubes → the 12AT7 → the three 7025s) is drawn in the standard socket order — the sheet marks the pair only as \"to all heaters and pilot light\" and does not draw the daisy chain. Not a trace or a dimensioned reproduction."
source:
  # The drawing's identity, not the reading of it: this string prints across the
  # bottom of both published figures, where AGENTS.md's editorial voice applies.
  desc: "Fender 'Bassman-Amp' Model AA864 layout drawing (H-FD), title block \"FENDER MODEL 'BASSMAN-AMP AA864' LAYOUT P/B\", Fender Electric Instrument Company, Fullerton, California, U.S.A."
  url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_aa864_layout.pdf"

parts:
  # --- supply corner: reservoir balancing pair, then the two rail droppers ---
  - { ref: RBL1, a: [0, 1], b: [1, 1] }    # 220k-1W across the upper 70 µF can
  - { ref: RBL2, a: [1, 1], b: [1, 3] }    # 220k-1W across the lower can, to ground
  - { ref: RD1,  a: [0, 5], b: [0, 7] }    # 1k-1W   +420 screen rail → +410 (BSC→BPI)
  - { ref: RD2,  a: [0, 7], b: [0, 9] }    # 4.7k-1W +410 → the preamp rail (BPI→BPR)
  # --- output stage: inverter couplers, grid leaks onto the −44 V line, stoppers
  - { ref: C1,   a: [0, 12], b: [0, 14] }  # 0.1 µF PI hot plate → V5 grid (PPA→GG1)
  - { ref: RGL1, a: [0, 14], b: [1, 14] }  # 220k-5% V5 grid leak (GG1→ −44 V)
  - { ref: RGS1, a: [0, 14], b: [0, 16] }  # 1.5k V5 grid stopper (GG1→G61)
  - { ref: C2,   a: [0, 18], b: [0, 20] }  # 0.1 µF PI cold plate → V6 grid (PPB→GG2)
  - { ref: RGL2, a: [0, 20], b: [1, 20] }  # 220k-5% V6 grid leak (GG2→ −44 V)
  - { ref: RGS2, a: [0, 20], b: [0, 22] }  # 1.5k V6 grid stopper (GG2→G62)
  # --- phase inverter: plate loads, mix pair, tail, feedback ---
  - { ref: RLPA, a: [0, 25], b: [0, 27] }  # 82k-5%  BPI → hot plate (PPA)
  - { ref: RLPB, a: [1, 25], b: [1, 27] }  # 100k-5% BPI → cold plate (PPB)
  - { ref: RMXB, a: [1, 28], b: [1, 30] }  # 220k Bass-channel mix resistor → NMIX
  - { ref: RMXN, a: [1, 30], b: [1, 32] }  # 220k Normal mix resistor, shares NMIX
  - { ref: CPI,  a: [1, 30], b: [0, 30] }  # 500 pF NMIX → hot grid (GPA)
  - { ref: RGPA, a: [0, 30], b: [0, 32] }  # 1M hot grid leak, returned to the tail (JPI)
  - { ref: RTAIL, a: [1, 34], b: [0, 34] } # 470 Ω joined cathodes (KPI) → tail junction
  - { ref: RGPB, a: [0, 38], b: [0, 36] }  # 1M cold grid leak (GPB→JPI)
  - { ref: CPIB, a: [0, 38], b: [1, 38] }  # 0.1 µF · 200 V feedback node → cold grid
  - { ref: RT2,  a: [1, 36], b: [1, 38] }  # 22k tail: junction → feedback node (NFB)
  - { ref: RNF,  a: [1, 39], b: [1, 40] }  # 100 Ω feedback node → ground
  - { ref: RNFB, a: [0, 40], b: [0, 42] }  # 820 Ω negative feedback, speaker → NFB
  # --- Normal channel: cathode pairs, plate loads, tone ladder ---
  - { ref: CKN1, a: [0, 46], b: [1, 46] }  # 25 µF V2a cathode bypass
  - { ref: RKN1, a: [0, 48], b: [1, 48] }  # 1.5k V2a cathode bias
  - { ref: RLN1, a: [0, 50], b: [0, 52] }  # 100k V2a plate load (PN1→BPR)
  - { ref: RLN2, a: [0, 52], b: [0, 54] }  # 100k V2b plate load, shares the BPR eyelet
  - { ref: CTN,  a: [1, 50], b: [1, 51] }  # 250 pF treble cap off the V2a plate
  - { ref: RSN,  a: [1, 52], b: [1, 53] }  # 100k slope resistor
  - { ref: CBN,  a: [1, 54], b: [1, 55] }  # 0.1 µF slope node → treble-lug/bass junction
  - { ref: CBN2, a: [1, 56], b: [1, 57] }  # 0.047 µF slope node → the bass-pot foot
  - { ref: RSLN, a: [1, 58], b: [1, 59] }  # 6.8k bleed, foot → ground
  - { ref: RKN2, a: [0, 60], b: [1, 60] }  # 1.5k V2b cathode bias
  - { ref: CKN2, a: [0, 62], b: [1, 62] }  # 25 µF V2b cathode bypass
  # --- Bass-channel driver (V3b) ---
  - { ref: RLB3, a: [0, 65], b: [0, 67] }  # 100k driver plate load (PB3→BPR)
  - { ref: CLB3, a: [1, 65], b: [1, 67] }  # 0.005 µF straight across RLB3
  - { ref: RKB3, a: [0, 69], b: [1, 69] }  # 1.5k driver cathode, no bypass can
  # --- Bass Instrument channel ---
  - { ref: CCB2, a: [0, 72], b: [0, 73] }  # 0.1 µF V1b plate → driver grid divider
  - { ref: RDV1, a: [0, 73], b: [1, 73] }  # 220k divider, series leg (NDIV→GB3)
  - { ref: RDV2, a: [1, 74], b: [1, 75] }  # 220k divider, shunt leg (GB3→0)
  - { ref: CDV,  a: [0, 75], b: [1, 75] }  # 0.001 µF across RDV2
  - { ref: RKB2, a: [0, 77], b: [1, 77] }  # 1.5k V1b cathode bias
  - { ref: CKB2, a: [0, 79], b: [1, 79] }  # 25 µF V1b cathode bypass
  - { ref: RLB2, a: [0, 81], b: [0, 83] }  # 100k V1b plate load (PB2→BPR)
  - { ref: RLB1, a: [0, 83], b: [0, 85] }  # 100k V1a plate load, shares the BPR eyelet
  - { ref: RKB1, a: [0, 87], b: [1, 87] }  # 1.5k V1a cathode bias
  - { ref: CKB1, a: [0, 89], b: [1, 89] }  # 25 µF V1a cathode bypass
  - { ref: CTB,  a: [1, 91], b: [1, 92] }  # 250 pF treble cap off the V1a plate
  - { ref: RTB,  a: [1, 93], b: [1, 94] }  # 250k above the 50k treble pot
  - { ref: RSB1, a: [1, 96], b: [1, 97] }  # 100k slope resistor
  - { ref: CBB1, a: [0, 96], b: [0, 97] }  # 0.1 µF slope node → treble-lug/bass junction
  - { ref: CBB2, a: [1, 98], b: [1, 99] }  # 0.1 µF slope node → the grounded foot
  - { ref: CBB3, a: [0, 98], b: [0, 99] }  # 0.1 µF Deep cap, switched in parallel

