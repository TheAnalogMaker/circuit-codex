# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# bleed, divider and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 100.5] }

runs:
  # === PT → rectifier strings → reservoir (annotation layer) ==================
  - { from: TR1.red1, to: D1.a, via: [[-0.6, -0.55], [0.2, -0.9]] }
  - { from: D1.b, to: D2.a, via: [[1.5, -1.15]] }
  - { from: D2.b, to: D3.a, via: [[2.9, -1.15]] }
  - { from: D3.b, to: C10.a, color: red, via: [[2.4, -0.35], [2.4, 3.9], [0.15, 3.9], [0.5, 2.8]] }
  - { from: TR1.red2, to: D4.a, via: [[1.732, 0.095], [0.95, -2.9], [5.8, -2.9], [4.85, -1.3]] }
  - { from: D4.b, to: D5.a }
  - { from: D5.b, to: D6.a, via: [[7.1, -0.9]] }
  - { from: D6.b, to: C10.a, color: red, via: [[10.2, -1.4], [10.2, 4.25], [2.35, 4.25], [1.6, 3.021]] }
  - { from: TR1.red-yellow, to: [1.45, 0.2], via: [[-0.65, 0.5]] }
  # === reservoir pair, balancing resistors, standby, choke ===================
  - { from: C10.a, to: RBL1.a, color: red }
  - { from: RBL1.b, to: C11.a, via: [[2.175, 1.75], [3.4, 1.628], [3.978, 2.65], [3.2, 2.7]] }
  - { from: C10.b, to: RBL1.b, via: [[1.35, 1.65], [1.35, 1.55]] }
  - { from: RBL2.b, to: [1.45, 3] }
  - { from: C11.b, to: [1.45, 2.2] }
  - { from: C10.a, to: SWSTBY, color: red, via: [[1.05, 1.7], [11.35, 1.7], [11.35, 1.97]] }
  - { from: SWSTBY, to: TR2.plate, color: red, via: [[12.6, 2.45], [12.6, -1.3], [10.6, -1.3]] }
  - { from: TR2.screen, to: RD1.a, color: red, via: [[11.15, -2.4], [3.2, -2.4], [4.6, -0.6]] }
  - { from: RD1.a, to: C12.a, via: [[5.4, 0.15], [4.029, 2.3], [5, 2.65]] }
  - { from: C12.b, to: [1.45, 5.6] }
  - { from: RD1.b, to: C13.a, via: [[7, 2.4], [6.6, 2.4]] }
  - { from: C13.b, to: [1.45, 7.9] }
  - { from: RD2.b, to: C14.a, via: [[8.55, 0.55], [8.55, 0.9]] }
  - { from: C14.b, to: [1.45, 9.9] }
  # === +420 screen rail out to the two 6L6GC screen stoppers ================
  - { from: RD1.a, to: RS1.a, color: red, via: [[4.3, 1.05], [4.3, 4.4], [14.1, 4.4]] }
  - { from: RS1.b, to: V5.pin4, via: [[15, 2.55], [17.563, 1.666]] }
  - { from: RD1.a, to: RS2.a, color: red, via: [[7.089, 2.1], [9.2, 5.6], [22.6, 5.6]] }
  - { from: RS2.b, to: V6.pin4, via: [[23.5, 2.15], [25.2, 1.35], [26.063, 1.666]] }
  # === +410 rail onto the inverter plate loads ==============================
  - { from: RD2.a, to: RLPA.a, color: red, via: [[7, -0.6], [24.6, -0.6]] }
  - { from: RLPA.a, to: RLPB.a }
  # === +380 preamp rail, the long run down the board ======================
  - { from: RD2.b, to: RLN1.b, color: red, via: [[9.4, -0.4], [49.4, -0.4]] }
  - { from: RLN1.b, to: RLB3.b, color: red, via: [[52.4, -0.25], [66.6, -0.25]] }
  - { from: RLB3.b, to: RLB1.a, color: red, via: [[67.4, -0.25], [82.6, -0.25]] }
  # === output transformer, speakers, and the 820 Ω feedback take-off ========
  - { from: TR3.red, to: C10.a, color: red, via: [[15.56, 0.15], [16.9, 7.3], [0.85, 7.3], [0.92, 2]] }
  - { from: TR3.brown, to: V5.pin3, via: [[16.55, 0.85], [17.35, 1.4], [17.894, 1.84]] }
  - { from: TR3.blue, to: V6.pin3, via: [[17.45, 0.35], [25.9, 0.35], [26.394, 1.84]] }
  - { from: TR3.green, to: SPK.tip, via: [[17.99, 0.4], [21.9, 0.95], [21.9, 5.85], [30.2, 5.85], [31.15, 2.6]] }
  - { from: TR3.black, to: SPK.sleeve, via: [[18.6, -0.7], [22.9, -0.7], [22.9, 6.3], [32.7, 6.3]] }
  - { from: SPK.sleeve, to: [1.45, 32.8] }
  - { from: SPK.tip, to: JEXT.tip, via: [[31.9, 3.75], [35.15, 3.75]] }
  - { from: JEXT.sleeve, to: [1.45, 37.6], via: [[36.3, 2.85], [37.6, 2.85]] }
  - { from: RNFB.b, to: SPK.tip, via: [[42.4, 4.75], [29.469, 4.75], [30.9, 2.35]] }
  - { from: RNFB.a, to: RT2.b, via: [[40.4, -1.5], [36.4, -1.5], [37.6, 0.85]] }
  # === output tubes: grids, cathodes, and the −44 V bias line ===============
  - { from: RGS1.b, to: V5.pin5, via: [[16.4, 0.9], [18.437, 1.666]] }
  - { from: RGS2.b, to: V6.pin5, via: [[22.4, 0.75], [25.9, 0.9], [26.937, 1.666]] }
  - { from: V5.pin8, to: [1.45, 17.2], via: [[18.9, 2.55], [17.2, 2.55]] }
  - { from: V6.pin8, to: [1.45, 25.8], via: [[27.4, 2.55], [25.8, 2.55]] }
  - { from: RGL1.b, to: RGL2.b, via: [[14, 1.3], [20, 1.3]] }
  - { from: RGL2.b, to: VRBIAS.lug2, via: [[19.24, 1.45], [23.4, 6.15], [36.6, 6.15], [36.6, -0.2], [35.5, -0.62]] }
  # === phase inverter ======================================================
  - { from: RLPA.b, to: V4.pin1, via: [[25.6, 0.5], [24.9, 3.5], [37.2, 3.5], [39.25, 2.36]] }
  - { from: RLPA.b, to: C1.a, via: [[27.6, -2.35], [12.4, -2.35], [12, -0.6]] }
  - { from: RLPB.b, to: V4.pin6, via: [[27.6, 1.3], [43.4, 1.2], [40.75, 1.716]] }
  - { from: RLPB.b, to: C2.a, via: [[28.9, 1.15], [30.4, -1.75], [17.4, -1.75], [18, -0.5]] }
  - { from: CPI.b, to: V4.pin2, via: [[30, 2.9], [38.783, 2.16]] }
  - { from: RGPA.b, to: RTAIL.b, via: [[32.4, 0.55], [34, 0.35]] }
  - { from: RGPA.b, to: RGPB.b, via: [[33.536, -2.573], [36.032, -2.6]] }
  - { from: RTAIL.a, to: V4.pin3, via: [[33.6, 1.15], [37.4, 1.5], [38.783, 1.916]] }
  - { from: RTAIL.a, to: V4.pin8, via: [[34.5, 2.65], [42.3, 2.65], [41.217, 2.16]] }
  - { from: CPIB.b, to: RT2.b, via: [[38.35, 1.35]] }
  - { from: CPIB.a, to: V4.pin7, via: [[38.752, 2.7], [44.6, 2.7], [41.217, 1.916]] }
  - { from: RT2.a, to: RGPB.b }
  - { from: RNF.a, to: RT2.b, via: [[39.9, 0.5], [38.9, -0.15], [38.1, 0.615]] }
  - { from: RNF.b, to: [1.45, 40] }
