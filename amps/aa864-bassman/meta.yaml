# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "aa864-bassman"
name_style: "Blackface Bassman-style"
family: blackface
era:
  start: 1964
  end: 1965
wattage: 50
tubes: [7025, 7025, 7025, 12AT7, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "silicon, 3 diodes per phase" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: tb
lineage:
  derived_from: ["6g6b"]   # the blonde piggyback it replaced: the AA864 carries the
                           # 6G6-B's two-channel Bass/Normal split, its solid-state
                           # rectifier and its long-tailed-pair inverter onto the
                           # blackface chassis, then redesigns the preamp for bass duty.
                           # Reciprocal of amps/6g6b's influenced.
  influenced: ["ab165"]    # the next revision letter on the same chassis; reciprocal
                           # of amps/ab165's derived_from.
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, MODEL \"BASSMAN-AMP AA864\" P/B (drawing code H-FD), Fender Electric Instrument Co., Fullerton, California. Supplies every component value, the whole printed voltage chart and the transformer table (TR1 125P7D, or 125P7DX on the export model; TR2 125C1A choke; TR3 125A13A output). The chart prints the preamp rail as +340 V, but the layout sheet marks the same node +380 V; see the operating-point table. The sheet's notice reads \"Voltages read to ground with electronic voltmeter. Values shown + or − 20%. All resistors 1/2 watt, 10% tolerance if not specified. All capacitors at least 400 volt rating if not specified.\" Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_aa864.pdf"
  - desc: "Fender, MODEL \"BASSMAN-AMP AA864\" LAYOUT P/B (drawing code H-FD), Fender Electric Instrument Company, Fullerton, California, U.S.A., with the same two notices as the circuit sheet. Supplies the order of parts on the board, the chassis positions of the six sockets (6L6GC · 6L6GC · 12AT7 · 7025 · 7025 · 7025), the two control clusters and their part numbers, and the colours of the transformer leads. It prints +380 V at the preamp-rail eyelet, where the circuit sheet prints +340 V. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_aa864_layout.pdf"
  - desc: "Wikipedia, \"Fender Bassman\". Dates the AA864 to 1964 as the first blackface Bassman, a 50 W piggyback head over a separate cabinet, replaced by the AB165 around 1965. The drawing prints no power rating, so the 50 W figure comes from here and from this site's Bassman family history, not from the sheet."
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
verification:
  status: verified  # Maintainer (GM) sign-off 2026-08-13, in-session. The
                    # printed AA864 chart is read whole and gated: 18 nodes,
                    # 0 failures, worst 11.6% (PPB, the inverter's cold plate)
                    # against the sheet's own +/-20%; solved rails inside 0.2%.
                    # The one printed-figure conflict (the circuit sheet's +340
                    # vs the layout sheet's +380 at the preamp rail) is
                    # documented in the BPR node note and worked through, with
                    # the arithmetic, in the circuit story — the entry carries
                    # the figure that closes.
  date: 2026-08-13
  max_deviation_pct: 11.6
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V3A: "unused — the H-FD layout page wires V3 pins 6, 7 and 8 only; pins 1, 2 and 3 are bare, and the schematic draws only V3B, the bass channel's third stage"
