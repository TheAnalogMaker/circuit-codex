# Board layout — redrawn from the published Fender 'Pro-Amp' 5E5-A layout
# drawing (J-EE), page 2 of the same PDF as the schematic. Part refs are the
# shared key into bom.yaml; the renderer reads each value and part type from
# there. A legible, schematic-style redraw of the board's principal
# components in the order the drawing shows them, with a lead-by-lead wiring
# layer — never a trace or a dimensioned reproduction.
#
# The published sheet reads left->right: bias supply, the three 16 uF cans
# and the fixed-bias 6L6GB output support at the left, the driver + split-load
# cathodyne phase inverter in the centre, then the follower-fed tone network,
# the second 12AY7 (gain stage + cathode follower) and the 12AY7 input pair at
# the right —
# matching the tube row the drawing prints (5U4GA · 6L6GB · 6L6GB · 12AX7 ·
# 12AY7 · 12AY7) and the panel row (PRESENCE · BASS · TREBLE · INST.VOL ·
# MIC.VOL). The board-part ORDER below follows that reading; individual
# eyelet coordinates are this entry's own placement of that sequence (the
# published sheet's eyelet grid is not re-digitised point-by-point), so treat
# column numbers as an honest redraw of the part sequence, not a traced
# position.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the PT/rectifier
# AC side, the bias-supply selenium network, the Treble/Bass pots and their
# pot-mounted caps, and the negative-feedback resistor (netlist.cir's
# documented, honest exclusions — see notes.md) are drawn but not net-checked;
# the Presence control and its 0.1 uF, and the Instrument volume's bright cap,
# are panel parts declared under net_map.not_on_board.
wiring_claim: verified

board:
  rows: 2
  cols: 53
  title: "5E5-A · eyelet board layout"
caption: "Redrawn from the published Fender 5E5-A 'Pro-Amp' layout drawing (J-EE), page 2 — principal board components and their hookup, in the order the drawing shows them: the bias supply and the three 16 µF cans at the power end, the output support and the driver/cathodyne phase inverter, then the tone network, the second 12AY7 and the input pair. The second 12AY7 is a gain stage on socket pins 1-2-3 DC-coupled into a cathode follower on 6-7-8: the drawing strings the gain stage's 100 kΩ plate load across the socket from pin 6 (the follower's plate, on the +250 V line) to pin 1, strapped to pin 7; it is drawn here on the board beside the stage. The follower's cathode eyelet carries its 100 kΩ load, the 250 pF treble cap and the 0.1 µF bass coupler; the bass branch's 220 kΩ leak, 100 kΩ series resistor and the 5 MΩ return to the mixing node share the coupler's far eyelet. The 0.005 µF and 0.01 µF hang at the Bass and Treble pots, and the second 220 kΩ is strung from the bass branch to the Treble wiper, whose lead carries the output to the driver's grid (pin 2). The 100 kΩ negative-feedback resistor stands under the driver's cathode resistor, its upper end on the driver's cathode and its lower lead to the speaker. The chassis has four input jacks (two per channel); the drawing's four 68 kΩ grid stoppers collapse to the two the schematic/BOM model (R1s, R2s), and the two 1 MΩ input grid leaks (RG1, RG2) mount at the channel jacks as generic off-board parts. The Presence pot with its 0.1 µF and the Instrument volume's 100 pF bright cap mount in the control row, off the board. The negative-bias supply takes the power transformer's own bias tap — the red-blue lead — onto the 10 kΩ, which feeds the selenium rectifier beside the board; the rectifier's other terminal is the −32 V line, where the 100 µF can and the 56 kΩ bleeder sit. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Pro-Amp' Model 5E5-A layout drawing (J-EE), page 2 of the schematic PDF"
  url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is
# drawn between them (same row = axial part; shared column across the rows =
# a vertical leg — a cathode resistor or bypass can to the ground bus).
parts:
  # --- bias supply + main filter cans + rail droppers (power end, left) ----
  - { ref: C13, a: [0, 0], b: [0, 2] }    # 100 uF bias-supply filter
  - { ref: RB1, a: [1, 0], b: [1, 1] }    # 10k bias series (bias tap -> selenium rect)
  - { ref: RB2, a: [1, 2], b: [1, 3] }    # 56k bias bleeder across the -32 V node
  - { ref: C17,   a: [0, 3], b: [0, 5] }    # 16 uF filter, B+1 (+390 V: rectifier output + OT centre tap)
  - { ref: C10,   a: [0, 6], b: [0, 8] }    # 16 uF filter, B+2 (+385 V, screens)
  - { ref: C11,   a: [0, 9], b: [0, 11] }   # 16 uF filter, B+3 (+300 V, driver/PI)
  - { ref: RD1,    a: [1, 5], b: [1, 6] }    # 10k dropper B+2->B+3
  - { ref: RD2,    a: [1, 7], b: [1, 8] }    # 10k dropper B+3->B+4
  # --- 6L6GB output support: grid leaks (from -32 V) + 1.5k grid stoppers --
  - { ref: RGL1,   a: [1, 9],  b: [1, 10] }  # 220k V4 grid leak
  - { ref: R5s,    a: [1, 11], b: [1, 12] }  # 1.5k V4 grid stopper
  - { ref: RGL2,   a: [1, 13], b: [1, 14] }  # 220k V5 grid leak
  - { ref: R6s,    a: [1, 15], b: [1, 16] }  # 1.5k V5 grid stopper
  # --- cathodyne -> 6L6GB grid couplers ------------------------------------
  - { ref: C2,     a: [0, 12], b: [0, 14] }  # 0.1 uF cathodyne PLATE -> V4 grid
  - { ref: C3,     a: [0, 15], b: [0, 17] }  # 0.1 uF cathodyne CATHODE -> V5 grid
  # --- phase inverter: driver (V3A) + split-load cathodyne (V3B) ----------
  - { ref: RL4,    a: [1, 17], b: [1, 18] }  # 100k driver plate load (V3A)
  - { ref: RL5,    a: [1, 19], b: [1, 20] }  # 56k cathodyne plate load (V3B)
  - { ref: RK3,    a: [1, 21], b: [1, 22] }  # 1.5k driver cathode bias (the 100k NFB lands on this eyelet too)
  - { ref: RGPI,   a: [1, 23], b: [1, 24] }  # 1M cathodyne grid leak -> 1.5k/56k junction
  - { ref: RKA,    a: [0, 25], b: [1, 25] }  # 1.5k cathodyne cathode -> junction (vertical)
  - { ref: RKB,    a: [1, 26], b: [1, 27] }  # 56k junction -> ground
  # --- driver -> cathodyne coupler -----------------------------------------
  - { ref: C1,     a: [0, 26], b: [0, 28] }  # 0.02 uF driver plate -> cathodyne grid
  # --- negative feedback. The J-EE layout (1506 x 864, the only copy) stands
  # a 100K under the driver's 1500, its upper end on the driver's cathode
  # eyelet (lettered +1.6 V) and its lower lead through a grommet to the
  # speaker; the J-EE schematic runs the same feedback line into the +1.6 V
  # cathode node, the 5K Presence (wiper through .1-200 to ground) hanging on
  # that line at the panel, as schematic.kicad_sch now draws it.
  - { ref: RNF, a: [0, 20], b: [0, 21] }   # 100k NFB: speaker (a) -> the driver's cathode (b)
  # --- tone network off the follower's cathode (the 5F4's split circuit) --
  # TB, the bass branch, is the eyelet pair [0,30]/[0,31] (+ [1,31]); KCF, the
  # follower's cathode, is [0,33] (+ [1,33]); B+4 is [0,35] (+ [1,35]).
  - { ref: RSL,  a: [0, 30], b: [0, 29] }   # 100k bass-branch series: TB -> the Bass pot's wiper
  - { ref: RSH,  a: [0, 30], b: [1, 30] }   # 220k bass-branch leak: TB -> ground (vertical)
  - { ref: C14,  a: [0, 33], b: [0, 31] }   # 0.1 uF bass-branch coupler: KCF -> TB
  - { ref: C8,   a: [0, 33], b: [0, 34] }   # 250 pF treble cap: KCF -> the Treble pot's end lug
  - { ref: C12,  a: [0, 35], b: [0, 37] }   # 8 uF filter, B+4 (+250 V, preamp)
  - { ref: RF1,  a: [1, 31], b: [1, 32] }   # 5M: TB -> the mixing node (V2A's grid reference)
  - { ref: RKCF, a: [1, 33], b: [1, 34] }   # 100k cathode-follower load: KCF -> ground
  # --- V2 (12AY7): gain stage on pins 1-2-3, cathode follower on 6-7-8 -----
  - { ref: RL3,  a: [1, 35], b: [1, 36] }   # 100k V2A plate load: B+4 -> pin 1 (the drawing strings it across the socket, pin 6 -> pin 1)
  - { ref: RK2,    a: [0, 38], b: [1, 38] }  # 1.5k V2 cathode (vertical)
  - { ref: C4b,    a: [0, 39], b: [0, 40] }  # 25 uF V2 cathode bypass
  # --- channel mixers -------------------------------------------------------
  - { ref: RMX1,   a: [1, 39], b: [1, 40] }  # 270k instrument-channel mixer
  - { ref: RMX2,   a: [1, 41], b: [1, 42] }  # 270k mic-channel mixer
  # --- V1 12AY7 input pair (right end) --------------------------------------
  - { ref: C5,   a: [0, 41], b: [0, 43] }  # 0.02 uF V1A -> instrument volume
  - { ref: RL1,    a: [1, 43], b: [1, 44] }  # 100k V1A plate load
  - { ref: C6,   a: [0, 44], b: [0, 46] }  # 0.02 uF V1B -> mic volume
  - { ref: RL2,    a: [1, 45], b: [1, 46] }  # 100k V1B plate load
  - { ref: R1s,    a: [1, 48], b: [1, 49] }  # 68k instrument-channel grid stopper
  - { ref: RK1,    a: [0, 47], b: [1, 47], nudge: [-4, 14] }  # 820 ohm shared 12AY7 cathode (vertical)
  - { ref: C4,     a: [0, 48], b: [0, 49] }  # 25+25 uF 12AY7 cathode bypass can
  - { ref: R2s,    a: [1, 50], b: [1, 51] }  # 68k mic-channel grid stopper

# Off-board items drawn as labelled stubs around the board, in the drawing's
# positions: tubes along the bottom, the pots and input jacks up top,
# transformers/choke to either side.
offboard:
  - { id: PT,   kind: xfmr,  edge: left,   at: 0.2, label: "Power trans" }
  - { id: RCHOKE, ref: RCHOKE, kind: choke, edge: left, at: 1.5, label: "Choke" }
  - { id: PL1,  kind: part, glyph: lamp, edge: left, at: 2.7, label: "Pilot lamp" }
  - { id: V6,   ref: V6, kind: tube, edge: bottom, at: 2.5,  label: "V6 · 5U4GA" }
  - { id: V4,   ref: V4, kind: tube, edge: bottom, at: 7,    label: "V4 · 6L6GB" }
  - { id: V5,   ref: V5, kind: tube, edge: bottom, at: 11.5, label: "V5 · 6L6GB" }
  - { id: SPK,  kind: jack, edge: bottom, at: 16, label: "Spkr jacks" }
  - { id: V3,   ref: V3, kind: tube, edge: bottom, at: 21.5, label: "V3 · 12AX7 (PI)" }
  - { id: V2,   ref: V2, kind: tube, edge: bottom, at: 36.5, label: "V2 · 12AY7" }
  - { id: V1,   ref: V1, kind: tube, edge: bottom, at: 47,   label: "V1 · 12AY7" }
  # Bias-supply selenium rectifier, a chassis part beside the board. The J-EE
  # layout feeds it from the transformer's own bias tap: RED-BLUE onto the
  # 10K's lower eyelet, the 10K's upper eyelet to the rectifier's "+", its "-"
  # to the -32 V eyelet under the 56K. Band at b: b is the terminal the layout
  # letters "+" (the cathode, which faces the winding in a negative supply).
  - { id: D1,   ref: D1, kind: part, edge: top, at: 0.5, label: "D1", cathode: b }
  # The control row reads PRESENCE · BASS · TREBLE · INST.VOL · MIC.VOL. The
  # Presence pot and its 0.1 uF are declared under net_map.not_on_board; the
  # 0.005 uF and 0.01 uF hang at the Bass and Treble pots, and the second
  # 220k (RSR) is strung pot-side between the bass branch and the Treble wiper.
  - { id: VR3,  ref: VR3, kind: pot, edge: top, at: 29.6, label: "Bass" }
  - { id: C15,  ref: C15, kind: part, edge: top, at: 31.0, label: "C15" }
  - { id: RSR,  ref: RSR, kind: part, edge: top, at: 32.7, label: "RSR" }
  - { id: VR4,  ref: VR4, kind: pot, edge: top, at: 34.4, label: "Treble" }
  - { id: C7,   ref: C7, kind: part, edge: top, at: 36.7, label: "C7" }
  - { id: VR1,  ref: VR1, kind: pot, edge: top, at: 42.5, label: "Volume · Inst" }
  - { id: VR2,  ref: VR2, kind: pot, edge: top, at: 45.5, label: "Volume · Mic" }
  - { id: JI,   kind: jack, edge: top, at: 47.5, label: "Inst in" }
  - { id: JM,   kind: jack, edge: top, at: 50.2, label: "Mic in" }
  # RG1 / RG2 (1 MΩ input grid leaks) mount at the channel jacks per the
  # sheet — generic 2-lead off-board parts (kind: part).
  - { id: RG1,  ref: RG1, kind: part, edge: top, at: 46.7, label: "RG1" }
  - { id: RG2,  ref: RG2, kind: part, edge: top, at: 50.9, label: "RG2" }
  - { id: T2,   ref: T2, kind: xfmr, edge: right, at: 0.5, label: "Output trans" }

# Ground bus — the bare tinned rail running the length of the board just
# below the bottom eyelet row.
bus:
  - { from: [1.45, -0.4], to: [1.45, 50.4] }

# Wiring — read lead-by-lead from the published 5E5-A layout drawing (J-EE),
# following the same conventions this corpus's other Fender-family layouts
# use (5f4, 5f6a): the PT secondary colours feed the 5U4GA (red/red HT,
# yellow/yellow 5 V filament), the output-transformer primary carries its
# marked colours to B+1, the PT primary (black) lands on the chassis
# switches (off the board, not drawn), and the 6.3 V heater winding (green)
# daisy-chains the pilot lamp then socket to socket in physical order
# (style: twisted). Endpoints reference board eyelets (REF.a/REF.b), tube
# socket pins (Vn.pinN, validated against reference/tubes basing — heater
# pins on the twisted runs), pot lugs (VRn.lugN), jacks, off-board 2-lead
# parts, and choke/transformer leads (by colour). `via` waypoints are
# [col, row]; row<0 routes above the board, row>1 below it.
runs:
  # --- power transformer secondary -> 5U4GA rectifier (marked colours) -----
  - { from: PT.red1, to: V6.pin4, via: [[2.1, 0.5], [2.5, 1.7]] }
  - { from: PT.red2, to: V6.pin6, via: [[2.05, 0.85], [3.48, 1.51]] }
  - { from: PT.red-yellow, to: [1.45, 2], via: [[1.2, 1.15]] }
  - { from: PT.yellow1, to: V6.pin2, via: [[0.853, 0.7], [0.62, 2.5], [1.83, 2.75]] }
  - { from: PT.yellow2, to: V6.pin8, via: [[2.7, 0.55], [2.7, 2.3]] }

  # --- B+1: the rectifier output lands on the first 16 uF can (C17) and feeds
  # the choke input; the choke's OUTPUT is BP2 and gets the second can (C10).
  # The OT centre tap (BP1, per net_map) reaches the same rectifier-output
  # point by a long return along the bottom margin.
  - { from: V6.pin8, to: RCHOKE.hi, color: red, via: [[4.35, 2.68], [1.5, 2.68]] }
  - { from: V6.pin8, to: C17.a, color: red, via: [[3.55, 2.3], [3.55, 0.45], [3.2, 0.3]] }
  - { from: T2.red, to: V6.pin8, color: red, via: [[49.7, 0.245], [49.7, 3.7], [0.7, 3.7], [0.548, 2.85]] }
  - { from: RCHOKE.lo, to: C10.a, via: [[1.859, 0.767], [5.7, 0.72]] }

  # --- filtered rail: BP2 filter, two rail droppers, BP3/BP4 filters -------
  - { from: C10.a, to: RD1.a, via: [[5.52, 0.06]] }
  - { from: RD1.b, to: C11.a, via: [[6.4, 0.5], [8.7, 0.5]] }
  - { from: C11.a, to: RD2.a }
  - { from: RD2.b, to: C12.a, via: [[8.3, 0.4], [34.6, 0.4]] }
  - { from: C13.b, to: [1.45, 0.5], via: [[1.637, 0.816]] }
  - { from: C17.b, to: [1.45, 4.4], via: [[4.4, 0.6]] }
  - { from: C10.b, to: [1.45, 8.5], via: [[8.5, 0.6]] }
  - { from: C11.b, to: [1.45, 11.2], via: [[11.2, 1]] }

  # --- bias supply: PT bias tap (red-blue) -> 10k -> selenium rect -> -32 V ---
  - { from: PT.red-blue, to: RB1.a, via: [[-0.35, 1]] }
  - { from: D1.b, to: RB1.b, via: [[0.95, -0.35]] }
  - { from: D1.a, to: C13.a }
  - { from: RB2.a, to: C13.a, via: [[1.6, 0.5]] }
  - { from: RB2.b, to: [1.45, 3] }
  - { from: RGL1.b, to: RB2.a, via: [[9.36, 1.52], [2.3, 1.555]] }
  - { from: RGL2.b, to: RB2.a, via: [[13.4, 1.7], [3.03, 1.7]] }

  # --- 6L6GB output: grids, screens, plates, cathodes, OT -------------------
  - { from: C2.b, to: R5s.a, via: [[13.7, 0.42]] }
  - { from: R5s.b, to: V4.pin5, via: [[12.35, 1.18], [7.278, 1.18]] }
  - { from: RGL1.a, to: V4.pin5, via: [[9.4, 2.3], [6.4, 2.3]] }
  - { from: C3.b, to: R6s.a, via: [[16.5, 0.62]] }
  - { from: R6s.b, to: V5.pin5, via: [[15.5, 2.5], [12.6, 2.5]] }
  - { from: RGL2.a, to: V5.pin5, via: [[13.32, 1.115], [9.6, 1.05]] }
  - { from: V4.pin4, to: C10.a, via: [[6.6, 0.8], [6.3, 0.35]] }
  - { from: V5.pin4, to: C10.a, via: [[9.5, 1.62], [7.35, 1.62], [7.35, 0.75], [6.45, 0.25]] }
  - { from: V4.pin3, to: T2.brown, via: [[5.5, 2.68], [51.3, 2.68], [51.3, 0.86], [49.1, 0.31]] }
  - { from: V5.pin3, to: T2.blue, via: [[10, 2.85], [51.6, 2.85], [51.6, 0.41], [49.4, 0.41], [50.761, 0.875]] }
  - { from: V4.pin8, to: [1.45, 7.9], via: [[7.9, 2.75], [9.326, 2.549]] }
  - { from: V5.pin8, to: [1.45, 11.9], via: [[12.069, 2.75], [13.356, 2.033]] }
  - { from: T2.sec1, to: SPK, via: [[48.2, 0.63], [48.2, 3.05], [16, 3.05], [16.55, 1.9]] }
  - { from: T2.sec2, to: SPK, via: [[48.8, 0.74], [48.8, 3.25], [18.3, 3.25], [18.3, 1.8]] }

  # --- phase inverter: driver (V3A) + split-load cathodyne (V3B) -----------
  - { from: RL4.a, to: C11.a, via: [[17, 0.55], [9.6, 0.55]] }
  - { from: RL4.b, to: V3.pin1, via: [[18, 1.6], [21, 1.6]] }
  - { from: RL5.a, to: C11.a, via: [[19, -0.3], [9.3, -0.3]] }
  - { from: RL5.b, to: V3.pin6, via: [[20, 1.72], [21.4, 1.72]] }
  - { from: V3.pin1, to: C1.a, via: [[21.3, 1.75], [25.7, 1.7], [25.7, 0.45]] }
  - { from: V3.pin6, to: C2.a, via: [[21.8, 1.85], [13.2, 1.85], [13.3, 0.55]] }
  - { from: C1.b, to: V3.pin7, via: [[27.8, 1.3], [22.4, 1.3], [22.4, 2]] }
  - { from: RGPI.a, to: V3.pin7, via: [[23, 2.3], [21, 2.3]] }
  - { from: V3.pin3, to: RK3.a, via: [[21.7, 1.2], [22.08, 1.2], [22.032, 1.03]] }
  - { from: RK3.b, to: [1.45, 22.2], via: [[22.2, 1.15]] }
  - { from: V3.pin8, to: RKA.a, via: [[22, 3.3], [25.3, 3.3], [25.3, 0.55]] }
  - { from: C3.a, to: RKA.a, via: [[20, -0.35], [25, -0.35]] }
  - { from: RKA.b, to: RKB.a }
  - { from: RGPI.b, to: RKB.a, via: [[24, 1.62], [25.3, 1.62]] }
  - { from: RKB.b, to: [1.45, 27] }

  # --- negative feedback: speaker -> 100k -> the driver's cathode ---------
  - { from: RNF.a, to: SPK, via: [[20.5, 0.5], [20.5, 1.75], [17.499, 2]] }
  - { from: RNF.b, to: RK3.a }

  # --- tone network off the follower's cathode ---------------------------
  - { from: V2.pin8, to: RKCF.a, via: [[37.55, 2.25], [37.55, 1.62], [33.3, 1.62]] } # follower cathode -> KCF
  - { from: RKCF.a, to: C14.a }                    # KCF, lower eyelet -> upper
  - { from: RKCF.b, to: [1.45, 34.2] }
  - { from: RSH.a, to: C14.b }                     # TB eyelets joined along the row
  - { from: C14.b, to: RF1.a }                     # TB, upper -> lower
  - { from: RSH.b, to: [1.45, 30.2] }
  - { from: C8.b, to: VR4.lug1 }                   # 250 pF -> Treble end lug
  - { from: VR4.lug3, to: C7.a }                   # Treble cold end -> 0.01 at the pot
  - { from: C7.b, to: C12.b }                      # 0.01 -> ground (the 8 uF can's ground eyelet)
  - { from: RSL.b, to: VR3.lug2 }                  # 100k -> the Bass pot's WIPER
  - { from: VR3.lug3, to: C15.a }                  # Bass far end -> 0.005 at the pot
  - { from: C15.b, to: RSH.b, via: [[31.196, -0.5], [30.5, 0.5]] }  # 0.005 -> ground
  - { from: VR3.lug1, to: [1.45, 28.6], via: [[29.1, -0.5], [28.6, -0.2]] }  # Bass end lug grounded
  - { from: RSR.a, to: RSL.b, via: [[32.3, -0.45], [29.3, -0.203]] }        # 220k from the bass wiper node...
  - { from: RSR.b, to: VR4.lug2, via: [[33.3, -0.75], [34.4, -0.62]] }     # ...to the Treble wiper
  # The Treble wiper is the network's output: the driver's grid, V3 pin 2.
  - { from: RSR.b, to: V3.pin2, via: [[32.95, -0.5], [22.7, -0.5], [22.7, 2.5], [20.6, 2.5]] }

  # --- V2 (12AY7): V2A gain stage on pins 1-2-3, V2B follower on 6-7-8 -----
  - { from: C12.a, to: RL3.a }                     # B+4, upper -> lower
  - { from: RL3.b, to: V2.pin1, via: [[35.4, 1.7], [35.5, 2.35]] }      # plate load -> V2A plate
  - { from: V2.pin7, to: V2.pin1, via: [[37.58, 2.297], [36.56, 2.45]] }   # V2A plate -> V2B grid (DC-coupled strap)
