# net_map — the reviewable data layer reconciling the drawn wiring with the
# DC-operating-point netlist (netlist.cir) for pipeline/verify_layout_nets.py.
# See docs/layout-schema.md.
net_map:
  # Terminals the netlist gives no discrete node to reach on their own —
  # co-anchoring the OT-primary leads to BP1 declares the DC bridge the
  # netlist collapses (OT primary DCR omitted).
  anchors:
    T2.brown: BP1
    T2.blue:  BP1
    T2.red:   BP1
  # DC-transparent series parts the netlist omits (no DC grid current -> zero
  # drop): the 12AY7 grids draw none, so each 68k stopper == its input node.
  series_bridge:
    R1s: "68k instrument-channel grid stopper — omitted from netlist (12AY7 V1A grid == input node at DC)"
    R2s: "68k mic-channel grid stopper — omitted from netlist (12AY7 V1B grid == input node at DC)"
  # Netlist elements with no discrete board 2-lead part — reported in
  # coverage, never a failure.
  netlist_unplaced:
    RCHOKE: "filter choke DCR (110 ohm BP1->BP2) — realised as the off-board chassis choke (kind: choke), not a board 2-lead part; its two rails are anchored independently (BP1 by the 6L6GB plates, BP2 by the screens/RD1)"
  # RNF is drawn (parts[] + runs[] above) but absent from every net_map key:
  # it is not in netlist.cir (at DC it only parallels the driver's 1.5k
  # through the output secondary, under 1% — see notes.md), so the
  # equivalence check neither anchors nor bridges it. The pots and their
  # pot-mounted caps (VR3/VR4, C7/C15) and the treble cap's pot end are
  # likewise outside the DC model: drawn, not net-checked.
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-09-10).
  not_on_board:
    VR5: "Presence control, 5 kΩ — a panel pot in the control row of the 5E5-A layout (J-EE, 1506 × 864, the only copy), not on the eyelet board; the layout's control-row wiring for it is not drawn on this board (see the caption)"
    C9: "0.1 µF · 200 V presence capacitor — the layout draws it beside the Presence 5 kΩ pot in the control row, its lower lead to chassis ground, not on the eyelet board"
    C16: "100 pF bright cap — the layout draws it on the Instrument volume itself, across the pot's lugs in the control row, not on the eyelet board"
  # Sheet terminal -> board terminal: the sheet numbers the transformer's bias
  # tap as T1 pin 6 (label HT_TAP); the J-EE layout letters its lead RED-BLUE.
  # ... and takes the feedback resistor's speaker end off a label, SPKR, that
  # is this board's speaker jack SPK.
  leads:
    T1.6: PT.red-blue
    "<SPKR>": SPK
