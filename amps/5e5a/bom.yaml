# Parts list — reference designators match netlist.cir and schematic.kicad_sch,
# so pipeline/validate.py cross-checks the two in both directions.
notes: "The schematic draws two input jacks per channel (mic 1/2, instrument
  1/2), each pair sharing that channel's grid path; this list carries one
  representative grid stopper + leak per channel, matching the simplification
  this corpus's own 5e3 BOM already documents for the identical real-chassis
  detail. Dropper and V2 wattages are not marked on the drawing."
