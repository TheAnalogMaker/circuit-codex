# Parts list — reference designators match netlist.cir and schematic.kicad_sch,
# so pipeline/validate.py cross-checks the two in both directions.
notes: "The schematic draws two input jacks per channel (1 and 2), each pair sharing that channel's grid path; this list carries one representative grid stopper + leak per channel, matching the simplification this corpus's own 5e3 BOM already documents for the identical real-chassis detail. The interstage coupler C1 is the one part the schematic page leaves unlettered: the layout page prints 0.02 µF · 600 V on the coupler whose eyelet carries the driver plate's +190 V. Dropper wattages are not marked on the drawing. Parts on the mains side of the power transformer (fuse, switches, AC-line caps) are listed without designators."
