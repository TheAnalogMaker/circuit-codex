# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5e5a"
name_style: "Tweed Pro-style"
family: tweed
era:
  start: 1956
  end: 1960
wattage: 30   # Mojotone's dedicated 5E5-A kit page: "Approximately 20-30 watts";
              # the field-guide's TV/wide-panel Pro pages cite lower/differing
              # figures for the EARLIER 5A5-5D5 circuits (see history/families/pro.yaml)
tubes: [12AY7, 12AY7, 12AX7, 6L6GB, 6L6GB, 5U4GA]
topology:
  rectifier: { kind: tube, type: "5U4GA" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: james
lineage:
  derived_from: []   # the 5E5 (cathode-biased, no NFB) is the direct ancestor —
                      # edge added when that circuit lands; see history/families/pro.yaml
  influenced: ["6g5"] # the brown 6G5 replaces this circuit in 1960 (reciprocal of
                      # amps/6g5's derived_from: ["5e5a"])
sources:
  - desc: "Fender 'Pro-Amp' Model 5E5-A schematic (J-EE): component values read
      directly from the published drawing where legible, plus the printed
      voltage chart embedded on the sheet itself (Fender's own convention:
      'VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER, VALUES SHOWN +/- 20%')
      — rails +390/+385/+300/+250, bias -32 V; V1 (12AY7, mic+instrument
      channels) shared 820 ohm/dual-25uF cathode at +1.9 V, 100k plates at
      +130 V; V3 (12AX7) driver cathode +1.4 V, split-load cathodyne cathode
      +58 V over the 1.5k/56k junction at +56.5 V; two 68k stoppers and a 1M
      leak per channel, 0.02uF couplers, 1M INST/MIC VOL pots, 270k mixers,
      1M BASS and TREBLE pots with a 5k PRESENCE pot, 56k cathodyne plate load,
      1M grid leak returned to the cathodyne junction, 220k output grid leaks,
      0.1uF cathodyne-to-output couplers. Some rail-dropper and V2 (second
      12AY7 stage) values were not confidently legible in this copy and are
      carried at this corpus's standard values for the identical role elsewhere
      in the tweed lineup (5e3, 5f4) rather than guessed digit-by-digit — see
      notes.md. Not reproduced here; archived at Schematic Heaven"
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Fender 'Pro-Amp' Model 5E5-A layout drawing (J-EE), same sheet set —
      corroborates the tube complement (5U4GA, 2x6L6GB, 12AX7, 2x12AY7), the
      BASS/TREBLE (1M) and PRESENCE (5K) pot values, and the two-input-per-channel
      MIC/INST front panel. Cited for the board-facts it carries, not
      for a layout.yaml (none is authored in this delivery)"
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Same Fender 'Pro-Amp' Model 5E5-A schematic+layout sheet set
      (J-EE), re-fetched and read at 300 dpi during the drawings session
      (2026-08-08) — title block re-verified against the data-core session's
      citation above ('FENDER PRO-AMP SCHEMATIC/LAYOUT MODEL 5E5-A', J-EE).
      Sharper than the compressed copy the data-core session had: V2's own
      plate/cathode voltages (+130/+1.9, previously left informational) and
      the driver's cathode (+1.6, previously misread +1.4) are now
      confidently legible and gated in voltages.yaml. Also newly legible: a
      100k resistor across V2's own plate/grid and a 5 MEG resistor from
      V2's grid to the driver's grid (bom.yaml RFB1/RBLEED, annotation only —
      modelled as plain DC resistors they collapse V2's chart-matched
      operating point, so at least one leg likely sits behind a coupling cap
      this scan doesn't resolve); and the negative-feedback + Presence tap
      confirmed landing on the driver's GRID (not the cathode, as the
      data-core session's 5F4-analogy guess had it). Used to author
      schematic.kicad_sch. Not reproduced here; archived at
      Schematic Heaven"
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Mojotone Fender Field Guide, 'Fender Narrow Panel Tweed Pro' — 5E5
      (1955)/5E5-A (1956-1960) dating, full tube complement (12AY7 mic/instrument,
      half-12AX7 phase inverter split-load, 6L6GB or 5881 output, 5U4GA
      rectifier), fixed/nonadjustable bias with a selenium bias rectifier, and
      the 5E5-A's reintroduced NFB loop with a Presence control (the 5E5 had
      removed feedback entirely) — cross-reference for the schematic reading"
    url: "https://mojotone.com/blogs/fender-field-guide/fender-narrow-panel-tweed-pro"
