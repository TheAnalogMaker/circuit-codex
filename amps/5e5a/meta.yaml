# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5e5a"
name_style: "Tweed Pro-style"
family: tweed
era:
  start: 1956
  end: 1960
wattage: 30   # Mojotone's dedicated 5E5-A kit page: "Approximately 20-30 watts";
              # the field-guide's TV/wide-panel Pro pages cite lower/differing
              # figures for the EARLIER 5A5-5D5 circuits (see history/families/pro.yaml)
tubes: [12AY7, 12AY7, 12AX7, 6L6GB, 6L6GB, 5U4GA]
topology:
  rectifier: { kind: tube, type: "5U4GA" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: cathode-follower-tb   # the 5F4's split Treble/Bass network, fed from V2B's cathode
lineage:
  derived_from: []   # the 5E5 (cathode-biased, no NFB) is the direct ancestor —
                      # edge added when that circuit lands; see history/families/pro.yaml
  influenced: ["6g5"] # the brown 6G5 replaces this circuit in 1960 (reciprocal of
                      # amps/6g5's derived_from: ["5e5a"])
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Pro-Amp\" Model 5E5-A schematic (drawing code J-EE). Supplies the component values and the voltage chart printed on the sheet, under Fender's notice \"VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER, VALUES SHOWN +/- 20%\". Every value printed on the schematic is legible in this copy. Not reproduced here; archived at Schematic Heaven."
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Fender, \"Pro-Amp\" Model 5E5-A layout drawing (drawing code J-EE), from the same sheet set. Confirms the tube complement (5U4GA, two 6L6GB, 12AX7, two 12AY7), the Bass and Treble (1 MΩ) and Presence (5 kΩ) pot values, and the two-input MIC/INST front panel. It letters the interstage coupler that the schematic leaves blank (\"0.02 MFD 600 VOLTS\") and prints plate voltages the schematic omits (V1 +125 V, driver +190 V, cathodyne +245 V). It shows which socket pins each stage uses: V2's gain stage on pins 1-2-3 with its 100 kΩ plate load across pins 6 and 1, the follower on 6-7-8; V3's driver on 1-2-3 and the cathodyne on 6-7-8. The board drawing on this page is redrawn from it."
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Mojotone, Fender Field Guide, \"Fender Narrow Panel Tweed Pro\". Supplies the 5E5 (1955) and 5E5-A (1956–1960) dating; the tube complement (12AY7 mic and instrument stages, half a 12AX7 as a split-load phase inverter, 6L6GB or 5881 output, 5U4GA rectifier); the fixed, non-adjustable bias with a selenium bias rectifier; and the 5E5-A's return of the negative-feedback loop with a Presence control (the 5E5 had removed feedback entirely). A cross-reference for the schematic reading."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-narrow-panel-tweed-pro"
verification:
