# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5e5a"
name_style: "Tweed Pro-style"
family: tweed
era:
  start: 1956
  end: 1960
wattage: 30   # Mojotone's dedicated 5E5-A kit page: "Approximately 20-30 watts";
              # the field-guide's TV/wide-panel Pro pages cite lower/differing
              # figures for the EARLIER 5A5-5D5 circuits (see history/families/pro.yaml)
tubes: [12AY7, 12AY7, 12AX7, 6L6GB, 6L6GB, 5U4GA]
topology:
  rectifier: { kind: tube, type: "5U4GA" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: cathode-follower-tb   # the 5F4's split Treble/Bass network, fed from V2B's cathode
lineage:
  derived_from: []   # the 5E5 (cathode-biased, no NFB) is the direct ancestor —
                      # edge added when that circuit lands; see history/families/pro.yaml
  influenced: ["6g5"] # the brown 6G5 replaces this circuit in 1960 (reciprocal of
                      # amps/6g5's derived_from: ["5e5a"])
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender 'Pro-Amp' Model 5E5-A schematic (J-EE): component values read
      directly from the published drawing, plus the printed voltage chart
      embedded on the sheet itself (Fender's own convention: 'VOLTAGES READ TO
      GROUND WITH ELECTRONIC VOLTMETER, VALUES SHOWN +/- 20%') — rails
      +390/+385/+300/+250, bias -32 V; V1 (12AY7, mic+instrument channels)
      shared 820 ohm/dual-25uF cathode at +1.9 V, 100k plates; V2 (12AY7) with
      both sections used, a gain stage (1500 ohm/25uF cathode at +1.9 V, 100k
      plate load) DC-coupled into a cathode follower (100k cathode load,
      +130 V); V3 (12AX7) driver cathode +1.6 V, split-load cathodyne cathode
      +58 V over the 1.5k/56k junction at +56.5 V; two 68k stoppers and a 1M
      leak per channel, 0.02uF couplers, 1M INST/MIC VOL pots with a .0001
      bright cap on INST only, 270k mixers, a 5 MEG from V2's grid to the tone
      network's bass branch, the follower-fed Treble/Bass network (250 pF into
      a 1M Treble pot with .01 to ground; .1 coupler, 220k leak, 100k into a
      1M Bass pot's wiper with .005 on its far end, 220k to the driver grid),
      a 5K PRESENCE pot and 100k feedback resistor on the driver's cathode,
      56k cathodyne plate, 1M grid leak returned to the cathodyne junction,
      220k output grid leaks, 0.1uF cathodyne-to-output couplers, two 10K rail
      droppers, 16-450 filters at +390/+385/+300 and 8-450 at +250. The PDF
      carries the page as one 1506 x 864 image, and every component value is
      legible at that resolution. Not reproduced here; archived at Schematic
      Heaven"
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Fender 'Pro-Amp' Model 5E5-A layout drawing (J-EE), same sheet set —
      corroborates the tube complement (5U4GA, 2x6L6GB, 12AX7, 2x12AY7), the
      BASS/TREBLE (1M) and PRESENCE (5K) pot values, and the two-input-per-channel
      MIC/INST front panel; letters the interstage coupler the schematic leaves
      blank (0.02 MFD 600 VOLTS) and prints the plate voltages the schematic
      omits (V1 +125 V, driver +190 V, cathodyne +245 V); shows the socket pins
      each stage uses (V2's gain stage on 1-2-3 with its 100k plate load across
      pins 6 and 1, the follower on 6-7-8; V3's driver on 1-2-3, the cathodyne
      on 6-7-8); and is the source the board drawing is redrawn from"
    url: "https://schematicheaven.net/fenderamps/pro_5e5a_schem.pdf"
  - desc: "Mojotone Fender Field Guide, 'Fender Narrow Panel Tweed Pro' — 5E5
      (1955)/5E5-A (1956-1960) dating, full tube complement (12AY7 mic/instrument,
      half-12AX7 phase inverter split-load, 6L6GB or 5881 output, 5U4GA
      rectifier), fixed/nonadjustable bias with a selenium bias rectifier, and
      the 5E5-A's reintroduced NFB loop with a Presence control (the 5E5 had
      removed feedback entirely) — cross-reference for the schematic reading"
    url: "https://mojotone.com/blogs/fender-field-guide/fender-narrow-panel-tweed-pro"
verification:
  status: draft   # One reason, stated rather than tuned away.
                  # The board drawing predates the 2026-09-10 reading of the
                  # second stage: it still draws V2 as a single triode on socket
                  # pins 6-7-8 with the tone network off its plate, and it lacks
                  # the follower's load, the bass branch, the 5 MEG return and
                  # the feedback resistor, all of which the J-EE layout page
                  # places on the eyelet board. The netlist, chart and schematic
                  # are otherwise complete: every component value is legible,
                  # 15/15 printed nodes simulate within tolerance, and the sheet
                  # is proved equivalent to netlist.cir. Estimated, because no
                  # page letters them: the choke DCR and the OT primary.
                  # WORK ITEM: redraw the board from the layout page, then
                  # re-run this verification.
