# Printed voltage chart read directly from the published 5E5-A (J-EE)
# schematic — embedded on the sheet itself rather than tabulated separately,
# under Fender's own printed convention: "VOLTAGES READ TO GROUND WITH
# ELECTRONIC VOLTMETER, VALUES SHOWN + OR - 20%". Rails get a tighter 10%
# house tolerance (this corpus's convention on 5e3/5f4); tube pins keep
# Fender's own 20%.
#
# Re-read 2026-08-08 from a 300 dpi capture of the same schematicheaven.net
# PDF (title block re-verified: "FENDER PRO-AMP SCHEMATIC MODEL 5E5-A J-EE"),
# sharper than the compressed copy the data-core session had. Two corrections
# against that session's reading: V2's own plate (+130 V) and cathode (+1.9 V)
# — same printed figures as V1's, previously left informational — are now
# confidently legible and gated below; the driver's cathode reads +1.6 V, not
# +1.4 V (the digit was mis-read against the compressed scan). The netlist's
# simulated K3A (1.6 V, unchanged) now lands on the chart exactly instead of
# 11.6% off — corroborating evidence for the re-read digit, not just the sharper
# scan alone. See notes.md for the two newly-legible annotation-layer
# resistors (RFB1, RBLEED) this same re-read found.
source: "Fender 5E5-A (J-EE) schematic, printed voltages: rails +390/+385/+300/+250, bias -32; V1 (12AY7) shared cathode +1.9, plates +130 (both channels, symmetric load); V2 (12AY7) own cathode +1.9, own plate +130 (same printed figures as V1, re-read 2026-08-08); V3B (12AX7 cathodyne) cathode +58 over the 1.5k/56k junction at +56.5; V3A (12AX7 driver) cathode +1.6 (re-read 2026-08-08, was +1.4)"
nodes:
  BP2: { chart: 385, tol_pct: 10, note: "screens node (after the choke, DCR estimated at 110 R)" }
  BP3: { chart: 300, tol_pct: 10, note: "driver/PI supply node (after the first rail dropper)" }
  BP4: { chart: 250, tol_pct: 10, note: "preamp supply node (after the second rail dropper)" }
  PAY1: { chart: 130, tol_pct: 20, note: "V1A (mic channel) plate" }
  PAY2: { chart: 130, tol_pct: 20, note: "V1B (instrument channel) plate — same printed figure, symmetric 100k load" }
  KAY: { chart: 1.9, tol_pct: 20, note: "V1 shared 820 R cathode (both triodes)" }
  P2: { chart: 130, tol_pct: 20, note: "V2 (second 12AY7 stage) plate — same printed figure as V1's plates; re-read 2026-08-08 from a sharper scan (was informational)" }
  K2: { chart: 1.9, tol_pct: 20, note: "V2 cathode — same printed figure as V1's shared cathode; re-read 2026-08-08 from a sharper scan (was informational). V2's own cathode resistor is a different, still-not-confidently-legible value from V1's 820R (V2 runs one triode, not two sharing the load), so the matching voltage is a coincidence of the design point, not a shared component" }
  G3A: { chart: null, note: "informational — driver grid, DC-referenced through the abstracted James tone network's leak to ground" }
  K3A: { chart: 1.6, tol_pct: 20, note: "V3A (12AX7 driver) cathode, 1.5 kOhm — re-read 2026-08-08 as +1.6 V (was misread +1.4 V); the netlist's simulated 1.6 V now matches exactly" }
  P3A: { chart: null, note: "informational — driver plate; not confidently legible in this copy" }
  PPI: { chart: null, note: "informational — cathodyne plate; not confidently legible in this copy" }
  KPI: { chart: 58, tol_pct: 20, note: "V3B (cathodyne) cathode, 1.5 kOhm above the 56 kOhm leg" }
  JPI: { chart: 56.5, tol_pct: 20, note: "1.5 kOhm/56 kOhm junction — the cathodyne grid's DC reference through the 1 MOhm leak; the printed 58/56.5 pair implies ~1 mA through both legs, consistent with a 12AX7 cathodyne at this bias" }
  G61: { chart: -32, tol_pct: 10, note: "6L6GB fixed bias via 220k from the -32 V supply (zero grid current, so this equals the bias rail exactly)" }
