sources:
  - desc: "Fender, \"Princeton\" Model 5F2-A layout and schematic sheets (drawing code K-EG). Supplies every component value and the transformer part numbers (power 66079, output 265). The drawing prints no voltage chart. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_5f2a.pdf"
  - desc: "Rob Robinette, \"How Amps Work\" (a walkthrough of the tweed 5F1 6V6 single-ended circuit). Supplies published DC measurements, used to check this circuit in place of a factory voltage chart: B+ 360/325/250 V, about 19 V across the 6V6's 470 Ω cathode resistor, 12AX7 plates near 170 V and cathodes near 1.5 V. The 5F2-A's DC path is the same as this circuit's, because its tone control is capacitor-coupled."
    url: "https://robrobinette.com/How_Amps_Work.htm"
  - desc: "Fender, \"Princeton\" Model 5F2-A layout drawing (drawing code K-EG), page 1. Supplies the order of parts on the eyelet board and the socket, pot and jack wiring for the board-layout drawing on this page. The 5Y3GT and 6V6GT pin numbers are read from the sheet. The 12AX7 socket is drawn with plain dots, so its pins follow Fender's usual layout (A on 6-7-8, B on 1-2-3). R3, R7 and R12 stand at a jack or socket lug and the tone capacitors C3 and C4 sit at the pots, so they are wired but not drawn as board parts, as on the sheet. The sheet does not draw the output transformer as its own symbol either. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_princeton_5f2a.pdf"
