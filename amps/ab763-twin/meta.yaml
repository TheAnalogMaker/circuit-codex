# Circuit Codex metadata — schema: docs/schema.md (v1)
# Model-qualified id: Fender put the AB763 designation on more than one drawing.
# The corpus's bare `ab763` is the Deluxe Reverb; this is the Twin Reverb sheet.
id: "ab763-twin"
name_style: "Blackface Twin Reverb-style"
family: blackface
era:
  start: 1963
  end: 1967
wattage: 85
# Socket order as the layout sheet places them, reading from the preamp end:
# Normal channel, Vibrato channel, reverb driver, reverb recovery + mix driver,
# tremolo, phase inverter, then the output quartet. The drawing letters the
# preamp bottles 7025 (a 12AX7 alias) except the tremolo, which it letters 12AX7.
tubes: [12AX7, 12AX7, 12AT7, 12AX7, 12AX7, 12AT7, 6L6GC, 6L6GC, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "silicon full-wave" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: fmv
lineage:
  derived_from: []   # the blonde 6G8-A Twin is the direct ancestor (four bottles,
                     # fixed bias, solid-state rectifier, long-tailed pair) — the
                     # edge lands when that circuit does; see history/families/twin.yaml
  influenced: []     # amps/ab763 is this circuit's SIBLING, not its parent: the same
                     # 1963 blackface platform on a Deluxe chassis. The relationship is
                     # documented in notes.md and in the two family files, and is
                     # deliberately not drawn as a derivation arrow
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"TWIN REVERB-AMP AB763\" schematic and layout sheets (drawing code C-FD). Supplies every component value, the printed voltage chart, the 340-0-340 V power winding and the transformer part numbers (TR1 125P34A, TR2 125C1A, TR3 125A29A, TR4 125A20B). The drawing's boxed node [A] means both channels' second stages share one 820 Ω / 25 µF cathode network; boxed node [E] does the same for the reverb recovery and the mix driver. The sheet's notice: values ±20%, read to ground with an electronic voltmeter; all resistors ½ W 10% and all capacitors at least 400 V unless specified. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_twin_reverb_ab763.pdf"
  - desc: "Fender, \"TWIN REVERB-AMP AB763\" LAYOUT (drawing code C-FD), Fender Musical Instruments, Fullerton. The board layout on this page is redrawn from this sheet. It supplies the socket row, left to right (four 6L6GC, the 12AT7 phase inverter, the 12AX7 tremolo, the 7025 reverb recovery and mix, the 12AT7 reverb driver, the 7025 vibrato and the 7025 normal channel); the order of parts on the eyelet board; the control row (Intensity, Speed, Reverb, then the Vibrato channel's Bass, Middle, Treble and Volume with its Bright switch and two jacks, then the Normal channel's Bass, Middle, Treble and Volume with its Bright switch and two jacks); the pilot lamp and the heater run marked \"TO ALL 6.3 VOLT HEATERS\"; the transformer lead colours (green heater pair, red 340 V AC pair, red-yellow centre tap, red-blue 48 V AC bias tap, black primary; blue and brown output-transformer plate leads, green speaker lead); the bias board on the chassis (470 Ω 1 W, rectifier, 25 µF 50 V, and a 10 kΩ linear balance control to −52 V); and the 1500 Ω grid stoppers and 470 Ω 1 W screen resistors mounted on the four 6L6GC sockets. The sheet's notice reads \"all resistors 1/2 watt 10% tolerance if not specified\" and \"all capacitors at least 400 volt rating if not specified\", with voltages ±20%. Not reproduced here."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_twin_reverb_ab763_layout.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Blackface Twin Reverb\". Supplies the production window (1963–1967), the 85 W rating, four 6L6GC, the 7025 preamp tubes, fixed bias with an adjustment pot, the solid-state rectifier and two 12-inch speakers at 4 Ω; and the controls: Normal and Vibrato channels each with Bright switch, Volume, Treble, Middle and Bass, plus Reverb, Speed and Intensity."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-blackface-twin-reverb"
  - desc: "RCA, 6L6-GC data sheet (DATA 1, dated 8-60). Supplies the tabulated Class A1 characteristics for the site's open (CC0) 6L6GC tube model, built only from published data (Va = 250 V, Vg2 = 250 V and Vg1 = −14 V give Ia = 72 mA, Ig2 = 5 mA and gm = 6000 µmho), the interelectrode capacitances, the 7AC basing, and the design-maximum ratings (30 W plate dissipation, 500 V plate, 450 V screen). The amplification factor of 8 (grid 1 to grid 2) comes from RCA's Receiving Tube Manual RC-19; this sheet prints none."
    url: "https://frank.pocnet.net/sheets/049/6/6L6GC.pdf"
verification:
  status: verified
  # Basis: the full voltage chart printed on the published "TWIN REVERB-AMP
  # AB763" (C-FD) drawing, ±20% as the sheet itself states (see voltages.yaml
  # `source`). Two printed supply nodes are driven and the two lower rails are
  # solved through the drawing's own droppers, so the printed rail chain is a
  # checked claim rather than an input. All twenty nodes gated, 0 failures,
  # nothing disputed. The redrawn schematic and both board-layout drawings are
  # present, the BOM<->schematic cross-check passes both ways, and the drawn
  # point-to-point wiring is proved electrically equivalent to netlist.cir
  # (layout.yaml: wiring_claim: verified).
  date: 2026-08-08
  max_deviation_pct: 14.9   # worst gated node (PV2, the vibrato channel's second-stage plate, tol 20%) — one end of a shared 820 Ohm cathode the chart prints two different plate voltages against, so the gap is the chart's own asymmetry, not a modelling one; both solved rails land inside 1%. The tremolo tube, both halves, is a documented exclusion (see notes.md), reported not gated
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V5: "excluded — the tremolo bottle: a running phase-shift oscillator and the neon-lamp driver inside the optocoupler; neither has a static operating point, and both tap the driven node BB"
