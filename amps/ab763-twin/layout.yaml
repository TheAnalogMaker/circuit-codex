# Board layout — redrawn from the published Fender "TWIN REVERB-AMP AB763" LAYOUT
# drawing (C-FD), whose title block is cited in meta.yaml. Part refs are the
# shared key into bom.yaml; the renderer reads each value and part type from
# there. A legible, schematic-style redraw of the board's components in the order
# the drawing shows them — never a trace or a dimensioned reproduction.
#
# The board reads left→right along the chassis, matching the socket row the sheet
# draws beneath it: the four 6L6GC outputs with their own grid stoppers and screen
# resistors and the speaker jacks at the left, then the long-tailed-pair phase
# inverter and its feedback network, the channel mixer, the tremolo oscillator and
# lamp driver, the reverb recovery and reverb/dry mix driver, the reverb driver and
# its transformer, the vibrato channel and finally the normal channel at the right
# (6L6GC · 6L6GC · 6L6GC · 6L6GC · 12AT7 PI · 12AX7 tremolo · 7025 recovery+mix ·
# 12AT7 reverb driver · 7025 vibrato · 7025 normal).
#
# Read 2026-09-10 off the only located copy of the layout sheet (el34world's PDF,
# a 2157 × 1397 JPEG at 200 ppi; the Wayback Machine's capture is byte-identical,
# and Schematic Heaven carries the schematic only), with the 6138 × 4384 schematic
# of the same drawing settling topology where the layout's ink is hard to follow.
# Within each valve's group the parts run in the order that suits this drawing's
# socket (pins 1–3 on the left, 6–8 on the right) — mirrored against the factory
# sheet, whose sockets are drawn rotated — exactly as the recovery/mix, vibrato and
# normal groups here always have; the groups themselves follow the sheet's order.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo oscillator, the
# rectifier and the PT AC side are an excluded annotation layer (not in
# netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 114
  title: "AB763 (Twin Reverb) · eyelet board layout"
caption: "Redrawn from the published Fender 'TWIN REVERB-AMP AB763' layout drawing — the board's components, in the order the drawing shows them, above the socket row the sheet draws beneath the board. Deviations from the sheet, stated plainly: it mounts each output valve's 1.5 kΩ grid stopper and 470 Ω · 1 W screen resistor at the valve socket itself, and the reverb recovery's 220 kΩ grid leak at the reverb jacks, and this drawing puts all of them on the board beside the valve each serves, so that every lead stays traceable; and the 3.3 MΩ in the vibrato channel's dry path is drawn from the mix driver's grid to ground, where the simulation returns that grid, while the sheet runs it, with the 10 pF across it, from the vibrato channel's 0.02 µF output to that grid, whose return to ground is the 220 kΩ beside it. Both channels' tone stacks, the channel mixer, the reverb send and reverb-mix network and the tremolo's oscillator and lamp driver sit on the board as the drawing places them, and the pots are wired as the schematic draws them: each bass pot's wiper strapped to its top, each middle pot's wiper strapped to its top with its other end grounded, the treble wiper alone carrying the output to the volume control. The optocoupler — a neon lamp and a photocell sealed in one body — mounts on the board across four eyelets and is not drawn: the lamp's two leads land on the 10 MΩ and 100 kΩ eyelets beside it, the photocell's on the eyelet wired to the Intensity wiper and the one wired to ground. The two rail droppers sit in the chassis with the filter cans, and the bias balance control in the chassis beside the bias supply, off the control row, as the sheet shows them. Not drawn here: the 120 pF bright caps at the Bright switches, the 68 kΩ input stoppers and 1 MΩ grid leaks at the input jacks, the reverb and footswitch jacks, and the silicon rectifier, reservoir and bias supply in the chassis — all of them documented on the schematic instead. Two 820 Ω / 25 µF cathode networks are SHARED between stages, exactly as the drawing shows: one between the two channels' second stages, one between the reverb recovery and the mix driver. The 6.3 V heater chain (green twisted pair, transformer → pilot lamp → the four 6L6GC outputs → the 12AT7 phase inverter → the 12AX7 tremolo → the 7025 recovery/mix → the 12AT7 reverb driver → the vibrato 7025 → the normal 7025) is routed as the sheet's 'TO ALL 6.3 VOLT HEATERS' run shows it; this amplifier has no rectifier tube. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'TWIN REVERB-AMP AB763' LAYOUT drawing (C-FD, Fender Musical Instruments, Fullerton)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_twin_reverb_ab763_layout.pdf"

parts:
