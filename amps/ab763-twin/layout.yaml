  #     board directly above the socket each serves, plus one coupler and one
  #     grid leak per phase -----------------------------------------------------
  - { ref: RSC1, a: [0, 2],  b: [0, 3] }    # 470Ω·1W V7 screen resistor
  - { ref: RST1, a: [1, 3],  b: [1, 4] }    # 1.5k V7 grid stopper
  - { ref: RGL1, a: [0, 5],  b: [1, 5] }    # 220k 5% grid leak for the V7/V8 pair
  - { ref: C1,   a: [1, 7],  b: [1, 5] }    # 0.1 µF PI hot plate → the V7/V8 grid line
  - { ref: RSC2, a: [0, 7],  b: [0, 8] }    # 470Ω·1W V8 screen resistor
  - { ref: RST2, a: [1, 8],  b: [1, 9] }    # 1.5k V8 grid stopper
  - { ref: RSC3, a: [0, 12], b: [0, 13] }   # 470Ω·1W V9 screen resistor
  - { ref: RST3, a: [1, 13], b: [1, 14] }   # 1.5k V9 grid stopper
  - { ref: RGL2, a: [0, 15], b: [1, 15] }   # 220k 5% grid leak for the V9/V10 pair
  - { ref: C2,   a: [1, 17], b: [1, 15] }   # 0.1 µF PI cold plate → the V9/V10 grid line
  - { ref: RSC4, a: [0, 17], b: [0, 18] }   # 470Ω·1W V10 screen resistor
  - { ref: RST4, a: [1, 18], b: [1, 19] }   # 1.5k V10 grid stopper
  # --- negative-feedback divider + phase-inverter tail ------------------------
  - { ref: RFB2, a: [0, 21], b: [0, 22] }   # 820Ω from the OT secondary → feedback node
  - { ref: RFB1, a: [0, 22], b: [1, 22] }   # 100Ω feedback divider leg → ground
  - { ref: RT22, a: [0, 22], b: [0, 24] }   # 22k feedback node → tail junction (shares NFB)
  - { ref: RTAIL, a: [0, 24], b: [1, 24] }  # 470Ω tail junction (JPI) → joined cathodes
  # .1-200 standing at the feedback node, as the layout stands it beside the
  # 820 and the 100: top to the feedback node, foot to the cold grid
  - { ref: CPIB, a: [0, 26], b: [1, 26] }   # 0.1 µF · 200 V feedback node → PI cold grid
  - { ref: RLPA, a: [0, 27], b: [0, 28] }   # 82k 5% hot plate load (BC → PPIA)
  - { ref: RLPB, a: [0, 29], b: [0, 30] }   # 100k 5% cold plate load (BC → PPIB)
  - { ref: RGPA, a: [0, 31], b: [1, 31] }   # 1M hot grid leak, returned to the tail junction
  - { ref: RGPB, a: [0, 32], b: [1, 32] }   # 1M cold grid leak, returned to the tail junction
  # --- channel mixer, as the layout places it beside the PI: jumper X (normal
  #     .047) → 220k, jumper Y (mix driver .1) → 220k, the junction → .001 down
  #     to the hot grid ---------------------------------------------------------
  - { ref: RMIXN, a: [0, 34], b: [0, 35] }  # 220k normal-channel mixing resistor (X → mixer node)
  - { ref: CPIA,  a: [0, 35], b: [1, 35] }  # .001 mixer node → PI hot grid
  - { ref: RMIXV, a: [0, 36], b: [0, 35] }  # 220k vibrato-channel mixing resistor (Y → mixer node)
  # --- tremolo (V5 12AX7): oscillator on pins 1/2/3 and lamp driver on 6/7/8, as
  #     the layout's socket shows them (pin 1 to the .02 / 220K eyelet, the +2.0 V
  #     lead on pin 3). Phase-shift chain P –.02– B –.01– A –.01– G along the
  #     bottom row; the 1M from A and the 1M from G meet at L, and the 2.2M runs
  #     from L to the raw negative bias supply (the schematic's line to the bias
  #     rectifier; the layout's white lead from the bias sub-box) ---------------
  - { ref: CKTO1, a: [0, 38], b: [0, 39] }  # 25 µF oscillator cathode bypass
  - { ref: RKTO1, a: [0, 39], b: [1, 39] }  # 2.7k oscillator cathode
  - { ref: RTOG3, a: [0, 41], b: [0, 42] }  # 2.2M raw bias → L
  - { ref: RTOG2, a: [1, 42], b: [0, 42] }  # 1M G (oscillator grid) → L
  - { ref: RTOG1, a: [1, 43], b: [0, 43] }  # 1M A → L
  - { ref: CTO2,  a: [1, 43], b: [1, 42] }  # .01 A → G
  - { ref: CTO1,  a: [1, 44], b: [1, 43] }  # .01 B → A
  - { ref: CTO3,  a: [1, 45], b: [1, 44] }  # .02 P (oscillator plate) → B
  - { ref: RTO1,  a: [1, 47], b: [1, 45] }  # 220k +458 V → oscillator plate
  - { ref: RLAMP, a: [0, 47], b: [1, 47] }  # 100k neon lamp's second lead → +458 V
  - { ref: RTO10, a: [0, 48], b: [1, 48] }  # 10M lamp-driver plate (lamp's first lead) → +458 V
  - { ref: RKTO2, a: [0, 50], b: [1, 50] }  # 100k lamp-driver cathode
  - { ref: CKTO2, a: [0, 51], b: [0, 50] }  # 25 µF lamp-driver cathode bypass
  # --- reverb recovery (V4 pins 1/2/3) + reverb/dry mix driver (6/7/8), as the
  #     layout's 7025 socket shows them: recovery plate +275 V on pin 1, the
  #     REVERB OUTPUT jack on pin 2, driver plate +280 V on pin 6 ---------------
  - { ref: RGR1, a: [0, 54], b: [1, 54] }   # 220k recovery grid leak (the sheet: at the reverb jacks)
  - { ref: RLR1, a: [0, 56], b: [0, 57] }   # 100k recovery plate load (BD → PR1)
  - { ref: CCR1, a: [0, 57], b: [0, 58] }   # .003 recovery plate → Reverb control top
  - { ref: CKE,  a: [0, 59], b: [0, 60] }   # 25 µF bypass for the SHARED [E] cathode
  - { ref: RKE,  a: [0, 60], b: [1, 60] }   # 820Ω cathode SHARED by recovery + mix driver
  # the mix-driver grid node, a hub as on the layout: 220k to ground, the 470k
  # from the Reverb wiper, the 3.3M, and the 10 pF from the vibrato .02 output
  - { ref: RTOG4, a: [1, 63], b: [1, 62] }  # 220k mix-driver grid → ground
  - { ref: RMR,   a: [0, 63], b: [1, 63] }  # 470k Reverb wiper → mix-driver grid
  # netlist.cir models the 3.3M as this grid's leak to ground (RGD1 GD1 0), so it
  # is drawn there; the sheet runs it, with the 10 pF, from the .02 output to the grid
  - { ref: RGD1,  a: [1, 63], b: [1, 64] }  # 3.3M mix-driver grid → ground (netlist)
  - { ref: CBD1,  a: [0, 65], b: [1, 65] }  # 10 pF vibrato .02 output → mix-driver grid
  - { ref: RLD1, a: [0, 66], b: [0, 67] }   # 100k mix-driver plate load (BD → PD1)
  - { ref: CCD1, a: [0, 67], b: [0, 68] }   # .1 mix-driver plate → jumper Y (mixer + Intensity)
  # --- reverb driver (V3 12AT7, both sections paralleled) ---------------------
  - { ref: RGRD, a: [0, 70], b: [1, 70] }   # 1M grid leak for the paralleled grids
  - { ref: CKRD, a: [0, 71], b: [0, 72] }   # 25 µF cathode bypass (shares KRD)
  - { ref: RKRD, a: [0, 72], b: [1, 72] }   # 2.2k shared cathode
  # the reverb send and the vibrato coupler share one node, as the layout stands
  # them in one column: driver grid –500 PF– node –.02– vibrato 2nd plate
  - { ref: CRS,  a: [0, 77], b: [0, 78] }   # 500 pF reverb-driver grid → the vibrato .02 output
  - { ref: CCV2, a: [0, 79], b: [0, 78] }   # .02 vibrato 2nd-stage plate → the same node
  # --- vibrato channel (V2) ---------------------------------------------------
  - { ref: RLV1, a: [0, 81], b: [0, 82] }   # 100k input plate load (BD → PV1)
  # tone stack standing between the rows, slope along the bottom row: .047 and
