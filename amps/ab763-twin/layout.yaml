# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 112.5] }

# Wiring — read lead-by-lead from the published AB763 Twin Reverb layout drawing.
# Transformer leads carry the drawing's colours. The 6.3 V winding is the green
# pair; it feeds the pilot lamp and then daisy-chains socket to socket
# (style: twisted). Endpoints reference board eyelets (REF.a/REF.b), tube socket
# pins (Vn.pinN, validated against the basing data — heater pins on the twisted
# runs), pot lugs, jacks, the off-board pilot lamp and transformer leads.
runs:
  # === +458 V node [B]: the screen resistors chain along a lane between the two
  # eyelet rows, then rise at the right of the output group to the first dropper;
  # the reverb transformer's primary feed and the tremolo's feed join it there. ==
  - { from: RSC1.a, to: RSC2.a, via: [[2.4, 0.42], [6.6, 0.42]] }
  - { from: RSC2.a, to: RSC3.a, via: [[7.4, 0.42], [11.6, 0.42]] }
  - { from: RSC3.a, to: RSC4.a, via: [[12.4, 0.42], [16.6, 0.42]] }
  - { from: RSC4.a, to: RD1.a, color: red, via: [[17.4, 0.28], [20.2, 0.28], [20.2, -2.45], [26.8, -2.45]] }
  - { from: T4.red, to: RD1.a, color: red, via: [[74.2, -2.75], [28.5, -2.75]] }
  - { from: RTO10.b, to: RD1.a, color: red, via: [[48.5, 0.75], [48.5, -2.6], [27.9, -2.6], [26.174, -1.716]] }
  # === +450 V node [C]: dropper to dropper, then the two PI plate loads =======
  - { from: RD1.b, to: RD2.a, via: [[28.4, -0.45], [29.9, -0.45]] }
  - { from: RD2.a, to: RLPB.a, via: [[30.4, -0.25], [29.4, -0.25]] }
  - { from: RLPB.a, to: RLPA.a, via: [[28.6, 0.42], [27.4, 0.42]] }
  # === +410 V node [D]: dropper output → the six preamp plate loads ===========
  - { from: RD2.b, to: RLR1.a, color: red, via: [[31.5, -1.7], [56.2, -1.7]] }
  - { from: RLR1.a, to: RLD1.a, via: [[56.3, -0.3], [65.7, -0.3]] }
  - { from: RLD1.a, to: RLV1.a, via: [[66.4, -0.6], [80.6, -0.6]] }
  - { from: RLV1.a, to: RLV2.a, via: [[81.3, -0.32], [90.7, -0.32]] }
  - { from: RLV2.a, to: RLN1.a, via: [[92.4, -0.6], [97.45, 0.2], [97.6, 0.4]] }
  - { from: RLN1.a, to: RLN2.a, via: [[98.3, -0.32], [107.7, -0.32]] }
  # === -52 V bias line: both grid leaks up to the balance control's wiper =====
  - { from: RGL1.a, to: VRBAL.lug2, via: [[5.4, -0.35], [5.4, -2.05], [35.6, -2.05]] }
  - { from: RGL2.a, to: VRBAL.lug2, via: [[15.4, -0.5], [15.4, -2.28], [37.6, -2.28]] }
  # the raw negative supply (the balance control's top) → the tremolo's 2.2M
  - { from: RTOG3.a, to: VRBAL.lug3, via: [[40.7, -0.45], [35.9, -0.45]] }
  # === output stage: grid line, grid stoppers, screens, cathodes, plates ======
  - { from: RST1.a, to: C1.b, via: [[3.2, 1.28], [4.6, 1.28]] }
  - { from: RST2.a, to: C1.b, via: [[7.8, 1.16], [5.4, 1.16]] }
  - { from: RST3.a, to: C2.b, via: [[13.2, 1.28], [14.6, 1.28]] }
  - { from: RST4.a, to: C2.b, via: [[17.8, 1.16], [15.4, 1.16]] }
  - { from: RST1.b, to: V7.pin5, via: [[4.9, 1.5]] }
  - { from: RST2.b, to: V8.pin5, via: [[9.9, 1.5]] }
  - { from: RST3.b, to: V9.pin5, via: [[14.9, 1.5]] }
  - { from: RST4.b, to: V10.pin5, via: [[19.9, 1.5]] }
  - { from: RSC1.b, to: V7.pin4, via: [[3.9, 1.62]] }
  - { from: RSC2.b, to: V8.pin4, via: [[8.9, 1.62]] }
  - { from: RSC3.b, to: V9.pin4, via: [[13.9, 1.62]] }
  - { from: RSC4.b, to: V10.pin4, via: [[18.9, 1.62]] }
  - { from: V7.pin8, to: [1.45, 4.5], via: [[4.4, 1.72]] }
  - { from: V8.pin8, to: [1.45, 9.5], via: [[9.474, 1.72]] }
  - { from: V9.pin8, to: [1.45, 14.5] }
  - { from: V10.pin8, to: [1.45, 19.5], via: [[19.4, 2.043]] }
