  - { ref: CBV2, a: [0, 83], b: [1, 83] }   # .047 slope foot → Middle top
  - { ref: CBV,  a: [0, 85], b: [1, 85] }   # .1 slope foot → Treble foot / Bass top
  - { ref: CTV,  a: [0, 87], b: [1, 87] }   # 250 pF plate → Treble top
  - { ref: RSV,  a: [1, 87], b: [1, 85] }   # 100k slope, plate → slope foot
  - { ref: CKV1, a: [0, 89], b: [0, 90] }   # 25 µF cathode bypass (shares KV1)
  - { ref: RKV1, a: [0, 90], b: [1, 90] }   # 1.5k input cathode
  - { ref: RLV2, a: [0, 91], b: [0, 92] }   # 100k 2nd-stage plate load (BD → PV2)
  - { ref: CKA,  a: [0, 93], b: [0, 94] }   # 25 µF bypass for the SHARED [A] cathode
  - { ref: RKA,  a: [0, 94], b: [1, 94] }   # 820Ω cathode SHARED by both 2nd stages
  # --- normal channel (V1) ----------------------------------------------------
  - { ref: RLN1, a: [0, 98], b: [0, 99] }   # 100k input plate load (BD → PN1)
  - { ref: CBN2, a: [0, 100], b: [1, 100] }   # .047 slope foot → Middle top
  - { ref: CBN,  a: [0, 102], b: [1, 102] }   # .1 slope foot → Treble foot / Bass top
  - { ref: CTN,  a: [0, 104], b: [1, 104] } # 250 pF plate → Treble top
  - { ref: RSN,  a: [1, 104], b: [1, 102] }  # 100k slope, plate → slope foot
  - { ref: CKN1, a: [0, 106], b: [0, 107] } # 25 µF cathode bypass (shares KN1)
  - { ref: RKN1, a: [0, 107], b: [1, 107] } # 1.5k input cathode
  - { ref: RLN2, a: [0, 108], b: [0, 109] } # 100k 2nd-stage plate load (BD → PN2)
