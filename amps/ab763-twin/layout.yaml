# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The tremolo valve is a running phase-shift oscillator and a neon-lamp driver;
  # neither half has a static DC operating point, so netlist.cir excludes both
  # (see notes.md). Declared here so its socket is an annotation-layer exclusion
  # printed loudly, like a rectifier — never a silently dropped valve. Its 6.3 V
  # heater is still validated onto heater pins by the twisted-run check.
  excluded_tubes:
    V5: "12AX7 tremolo oscillator + neon-lamp driver — no static DC operating point for either half (excluded from netlist.cir); its phase-shift network, lamp driver and the optocoupler's eyelets are drawn on the board. No signal pin is DC-checked."
  anchors:
    T3.blue:  BP1    # OT primary, the hot pair's plate lead → +460 V (winding DCR omitted)
    T3.brown: BP1    # OT primary, the cold pair's plate lead → +460 V
    T4.red:   BB     # reverb-transformer primary, the +458 V side
    VRBAL.lug2: NBIAS  # the bias supply is abstracted; its balance wiper is the −52 V line
    SPK.tip: "0"     # speaker jack — OT-secondary DCR folded into ground
    SPK.sleeve: "0"  # (the feedback return reads as ground at DC)
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out):
  netlist_unplaced:
    RTR4: "reverb transformer T4 primary DCR (~200 Ω) — the winding, not a discrete board resistor; its +458 V lead anchors to BB and its plate lead lands on the paralleled V3 plates (PRD)"
    RGN1: "1 MΩ normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV1: "1 MΩ vibrato-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGN2: "normal volume pot VRVN — the netlist models its DC grid return as one grid leak (GN2 → 0)"
    RGV2: "vibrato volume pot VRVV — the netlist models its DC grid return as one grid leak (GV2 → 0)"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-09-10).
  not_on_board:
    T2: "filter choke — a chassis part the Twin Reverb AB763 layout (C-FD, read at 2157 × 1397) does not draw: the +460 V and +458 V eyelets at the board's left end run by dashed leads to chassis holes. On this board it is only the off-board choke stub (kind: choke), which the sheet ↔ board gate has no two-lead vocabulary for"
    RB2: "27 kΩ bias-divider leg — lettered '27K' inside the 10K-L bias pot's outline on the layout: a resistor mounted on the pot, off the board"
    CDEATH: ".047-600 ground-switch capacitor — drawn at the GROUND SWITCH on the layout's mains row, off the board"
    DBIAS: "bias rectifier diode — drawn in the layout's bias sub-box (470-1W → diode → 50|50 cap) beside the pilot light, not on the main eyelet board"
    RBIAS: "470 Ω · 1 W bias feed — the '470-1W' in the layout's bias sub-box, not on the main eyelet board"
    CB1: "bias filter can — the '50|50' in the layout's bias sub-box, not on the main eyelet board"

# Board-scope rules for the sheet ↔ board gate: parts the sheet draws that
# this board deliberately does not, by designator glob, each with where the
# cited layout drawing mounts them (2026-09-10).
scope:
  not_drawn:
    - { match: "DHT[AB]", why: "the two HT rectifier strings of three silicon diodes — drawn in the layout's sub-box above the bias parts, not on the main eyelet board" }
    - { match: "CBR[NV]", why: "120 pF bright caps — lettered '120 PF' at each channel's BRIGHT switch on the layout, at the switch and not on the eyelet board" }
    - { match: "R[12][nv]", why: "68 kΩ input grid stoppers — the layout hangs a 68K pair from each channel's Normal and Vibrato jacks beside the 1 MΩ leak, at the jacks and not on the eyelet board" }
    - { match: "C1[0-4]", why: "the filter cans (the 70 µF series pair and the three 20 µF · 525 V) — not on the eyelet board and not drawn anywhere on the layout sheet: the rail eyelets at the board's left end run by dashed leads to chassis holes" }
    - { match: "RBAL[12]", why: "220 kΩ · 1 W reservoir balancing resistors — not on the eyelet board and not drawn anywhere on the layout sheet, like the series filter pair they belong with" }
