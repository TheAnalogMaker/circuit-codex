# Board layout — DERIVED, not read from a factory layout drawing.
#
# JMI published no board-layout drawing for the AC30/6, and none is cited here.
# What follows is an original arrangement of this circuit's own parts, drawn in
# the house style on the corpus's two-row eyelet grid and ordered along the
# chassis in signal order — the GZ34 supply at the left, the four EL84s and the
# output transformer next, the long-tailed-pair inverter and the Cut control in
# the middle, the two volume controls and the shared ECC83 first stage at the
# right. It is a builder's diagram of THIS circuit, not a record of how Jennings
# Musical Industries dressed its own chassis (which used tag strips rather than
# a single eyelet board). The caption says so.
#
# Part refs are the FACTORY drawing's designators (OS/065 letters them legibly)
# and the shared key into bom.yaml; the renderer reads each value and part type
# from there, so the layout and the parts list cannot disagree. Note the
# drawing's own — unusual — transformer lettering: T2 is the MAINS transformer
# and T1 the OUTPUT transformer.
#
# Machine-checked equivalence: the point-to-point wiring below has been verified
# electrically equivalent to netlist.cir by pipeline/verify_layout_nets.py — see
# the net_map block at the foot of this file and docs/layout-schema.md. Heaters,
# the mains/rectifier AC side and the three Vibrato/Tremolo valves are an
# excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 99
  title: "AC30/6 · board layout (derived)"
caption: "A derived layout: JMI published no board-layout drawing for the AC30/6, so the arrangement below is the Circuit Codex's own — this circuit's parts laid out in signal order along the chassis and drawn on the house eyelet grid, not a record of the factory's tag-strip construction. Every value comes from the parts list, which is read from JMI drawing OS/065. One ECC83 (V1) serves both the Brilliant and the Normal channel from a single shared cathode network, and both volume controls mix through 220 kΩ resistors into one grid of the phase inverter; the Vibrato/Tremolo volume drives the other. The Vibrato/Tremolo generator is not drawn: its voicing, phase-shift, modulator and oscillator networks are not resolved by the published drawing, so only its three valve sockets and their heaters appear here, with its volume control feeding the inverter's second grid. The mains switch, fuse and voltage selector are panel-mounted and are not drawn, and the drawing shows no pilot lamp. The 6.3 V heater chain (green twisted pair — mains transformer, the four EL84s, the phase inverter, the three vibrato valves, the shared first stage) runs in the order a builder would wire it; the GZ34 sits on its own 5 V winding instead, drawn as the pair of leads onto its filament and cathode pins. Not a trace or a reproduction of any drawing."
source:
  desc: "JMI drawing OS/065, \"VOX A.C.30.36 AMPLIFIER CIRCUIT / NORMAL\" (title-block date 29-4-60, main body as amended to Issue 4 of 11-9-64) — layout DERIVED from that circuit drawing; JMI published no board-layout sheet for the AC30/6 and none was located"
  url: "https://www.voxac30.org.uk/vox_ac30_circuit_diagrams.html"

parts:
  # --- supply: reservoir, post-choke can, the two 22 kΩ rail droppers ----------
  - { ref: C39, a: [0, 1],  b: [1, 1] }    # 16 µF reservoir, ahead of the choke
  - { ref: C40, a: [0, 2],  b: [1, 2] }    # 16 µF after the choke — the +320 V rail (BP1)
  - { ref: R10, a: [0, 4],  b: [0, 5] }    # 22 kΩ dropper, BP1 → front-end anode supply
  - { ref: C4,  a: [0, 5],  b: [1, 5] }    # 8 µF front-end smoothing (shares the BPN eyelet)
  - { ref: R11, a: [0, 7],  b: [0, 8] }    # 22 kΩ dropper, BP1 → phase-inverter supply
  - { ref: C8,  a: [0, 8],  b: [1, 8] }    # 8 µF inverter smoothing (shares the BPPI eyelet)
  # --- the two grid-drive lines out of the inverter ---------------------------
  - { ref: C6,  a: [0, 10], b: [0, 12] }   # 0.15 µF inverter anode A → drive line A
  - { ref: R20, a: [0, 12], b: [1, 12] }   # 220 kΩ drive-line-A return (grid leak, V3 + V5)
  - { ref: C9,  a: [0, 14], b: [0, 16] }   # 0.15 µF inverter anode B → drive line B
  - { ref: R21, a: [0, 16], b: [1, 16] }   # 280 kΩ drive-line-B return — the drawing's asymmetric partner
  # --- the output quartet's ENTIRE bias arrangement: one resistor, one can -----
  - { ref: C11, a: [0, 18], b: [1, 18] }   # 250 µF cathode bypass
  - { ref: R24, a: [0, 19], b: [1, 19] }   # 50 Ω shared cathode resistor, all four EL84s
  # --- output stage: a grid stopper left and a screen stopper right of each valve
  - { ref: R22, a: [0, 21], b: [0, 22] }   # 1.5 kΩ V3 grid stopper (drive line A → G3)
  - { ref: R25, a: [0, 25], b: [0, 26] }   # 100 Ω V3 screen stopper (BP1 → S3)
  - { ref: R27, a: [0, 27], b: [0, 28] }   # 1.5 kΩ V5 grid stopper (drive line A → G5)
  - { ref: R29, a: [0, 31], b: [0, 32] }   # 100 Ω V5 screen stopper (BP1 → S5)
  - { ref: R23, a: [0, 33], b: [0, 34] }   # 1.5 kΩ V4 grid stopper (drive line B → G4)
  - { ref: R26, a: [0, 37], b: [0, 38] }   # 100 Ω V4 screen stopper (BP1 → S4)
  - { ref: R28, a: [0, 39], b: [0, 40] }   # 1.5 kΩ V6 grid stopper (drive line B → G6)
  - { ref: R30, a: [0, 43], b: [0, 44] }   # 100 Ω V6 screen stopper (BP1 → S6)
  # --- phase inverter: matched anode loads, both leaks to the tail junction ----
  - { ref: R18, a: [0, 52], b: [0, 53] }   # 100 kΩ anode load, side A
  - { ref: R19, a: [0, 54], b: [0, 55] }   # 100 kΩ anode load, side B
  - { ref: R8,  a: [0, 57], b: [1, 57] }   # 1 MΩ grid leak, side A → tail junction
  - { ref: R17, a: [0, 58], b: [1, 58] }   # 1 MΩ grid leak, side B → tail junction
  - { ref: R16, a: [0, 59], b: [1, 59] }   # 1.2 kΩ shared cathode resistor
  - { ref: R15, a: [0, 60], b: [1, 60] }   # 47 kΩ tail, junction → ground
  # --- the three channels into the inverter's two grids ------------------------
  - { ref: C7,  a: [0, 62], b: [0, 64] }   # 0.047 µF Vibrato/Tremolo volume → grid B
  - { ref: C5,  a: [0, 65], b: [0, 67] }   # 0.047 µF mixing node → grid A
  - { ref: R7,  a: [0, 69], b: [0, 70] }   # 220 kΩ Normal volume wiper → mixing node
  - { ref: R9,  a: [0, 72], b: [0, 73] }   # 220 kΩ Brilliant volume wiper → mixing node
  # --- V1 ECC83: one half per channel, ONE shared cathode network -------------
  - { ref: C2,  a: [0, 76], b: [0, 78] }   # 0.047 µF Normal anode → Normal volume
  - { ref: C3,  a: [0, 79], b: [0, 81] }   # 500 pF Brilliant anode → Brilliant volume
  - { ref: R6,  a: [0, 83], b: [0, 84] }   # 220 kΩ anode load, Normal side (pin 6)
  - { ref: R5,  a: [0, 85], b: [0, 86] }   # 220 kΩ anode load, Brilliant side (pin 1)
  - { ref: R4,  a: [0, 88], b: [1, 88] }   # 1.5 kΩ SHARED cathode resistor, both channels
  - { ref: C1,  a: [0, 89], b: [1, 89] }   # 25 µF shared cathode bypass
  - { ref: R14, a: [0, 91], b: [1, 91] }   # 1 MΩ Normal input grid leak
  - { ref: R3,  a: [0, 93], b: [1, 93] }   # 1 MΩ Brilliant input grid leak

