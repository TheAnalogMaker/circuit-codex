# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The whole Vibrato/Tremolo channel is outside netlist.cir's scope: its ECC83
  # first stage, ECC82 modulator and ECC83 phase-shift oscillator hang off a
  # dropper chain the published drawing does not resolve back to a named rail,
  # and a running phase-shift oscillator has no static DC operating point.
  # Declared here socket by socket so each is an annotation-layer exclusion
  # printed loudly, like the rectifier — an UNdeclared unmodelled signal tube
  # still hard-fails.
  excluded_tubes:
    V7: "ECC83 Vibrato/Tremolo channel first stage — excluded from netlist.cir with the rest of that channel (unresolved supply dropper; see notes.md). Its 6.3 V heater is on the twisted chain; no signal pin is DC-checked."
    V8: "ECC82 vibrato modulator — excluded from netlist.cir: it works into the phase-shift ladder, which has no static DC operating point. Heater only."
    V9: "ECC83 phase-shift oscillator — a running oscillator has no quiescent operating point to verify (the same treatment amps/ac15 and amps/ab763 give their oscillators). Heater only."
  anchors:
    # The netlist omits output-transformer primary DCR, so all four EL84 anode
    # nodes and the primary centre tap collapse onto the +320 V rail. Note the
    # drawing's lettering: T1 is the OUTPUT transformer, T2 the mains one.
    T1.blue:  BP1    # OT primary, drive-line-A anodes (V3 + V5)
    T1.brown: BP1    # OT primary, drive-line-B anodes (V4 + V6)
    T1.red:   BP1    # OT primary centre tap → the rail
    JSPK1: "0"       # speaker jack — OT-secondary DCR folded into ground
  series_bridge:
    R1:  "68 kΩ input resistor at Brilliant jack 2 — no DC grid current flows, so the netlist's grid node runs through it"
    R2:  "68 kΩ input resistor at Brilliant jack 1 — no DC grid current flows, so the netlist's grid node runs through it"
    R12: "68 kΩ input resistor at Normal jack 2 — no DC grid current flows, so the netlist's grid node runs through it"
    R13: "68 kΩ input resistor at Normal jack 1 — no DC grid current flows, so the netlist's grid node runs through it"
