# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ac30"
name_style: "Vox AC30/6-style"
family: vox
era:
  start: 1961
  end: 1965
wattage: 30
tubes: [ECC83, ECC83, EL84, EL84, EL84, EL84, ECC83, ECC82, ECC83, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: cathode
  phase_inverter: long-tailed-pair
  tone_stack: top-cut
lineage:
  derived_from: ["ac15"]   # the AC15's own ideas at twice the power: cathode-biased
                           # EL84s with no bias supply and no feedback loop, a
                           # long-tailed-pair inverter, and one Top Cut after it.
                           # JMI drew the first AC30/6 sheet on the same day as the
                           # AC15's OA/031; the front end is the one thing that did
                           # not survive the scale-up (see notes.md).
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "JMI (Jennings Musical Industries), factory drawing OS/065. The title block reads \"DRG. Nº OS/065 / THE JENNINGS MUSICAL INDUSTRIES LTD. / \"VOX\" A.C.30.36 AMPLIFIER CIRCUIT / NORMAL / DRAWING FOR WORKS USE ONLY / SCALE:- N/A. DATE 29-4-60. / DRAWN. R.D. TRACED - D.W.U.\". Its MODIFICATIONS box records \"C41 ADDED 7-2-61\"; the main list of changes, dated 8-5-61, (R4 was 2.2 kΩ, R5 was 100 kΩ, R6 was 100 Ω, R7 was 270 kΩ, R9 was 270 kΩ, R38 was 1 MΩ, R39 was 150 kΩ, R40 was 12 kΩ, R68 was 1.5 MΩ, R64 was 1 MΩ, R74 added, C2/C5/C6/C7/C9 changed, C16 deleted, C41 changed); \"ISS.2 14.6.63 M.T. NOTE ADDED\"; \"R74 DELETED / R64 WAS 80Ω / FUSE MOD. / 230V WAS 285V\" at \"ISS.3 11.10.63\", with \"TITLE CHANGED, NORMAL ADDED\"; and \"ISS.4 11-9-64\". This is the revision documented here: the AC30/6 \"Normal\" circuit as the sheet stands after Issue 4, the amplifier after the list of changes, in which one ECC83 replaced the EF86 across the Brilliant and Normal channels. Supplies the component values wherever the published scan resolves them; the power supply and output parts (a GZ34 rectifier off a 280-0-280 V 160 mA secondary, a 10–20 H 100 mA choke, and an output transformer of 4 kΩ anode to anode with 8 Ω and 15 Ω taps); and the annotated working voltages, including \"QUIESCENT 10v / 12.5v AT 30 WATTS\" at the EL84 cathode resistor. The blue \"NEG FEED BACK\" loop drawn across this copy is a later hand addition by a previous owner. It is not part of the circuit and is not modelled. Not reproduced here; archived at the Vox AC30 history site."
    url: "https://www.voxac30.org.uk/vox_ac30_circuit_diagrams.html"
  - desc: "Vox AC30 history archive, \"Vox AC30/6 circuit diagrams (schematics) 1960-1974\". The identity and dating evidence for the sheet. The circuit \"was initially drawn on the 29th April 1960 by Dick Denney (RD) and traced ... by Derek Underdown (DWU)\". At least six versions of the AC30/6 \"Normal\" diagram exist: one of 1960 with no list of changes, one of late 1961 or early 1962, two of mid 1963 (one numbered A/026), and two of September 1964 (OS/065 and A/026). \"The latest date generally given on sheets numbered as OS/065 ... is 11th September 1964\". The page gives the issue history as first change 7 February 1960, main list of changes 8 May 1961, Issue 2 14 June 1963, Issue 3 11 October 1963 and Issue 4 11 September 1964, and says \"11th Sept. 1964 is the date on or after which the modifications were incorporated in the main circuit\". It also notes that this copy's values \"are good and legible, except in one instance, which has been supplied in red\", and that \"Someone has added a potential negative feedback loop!\""
    url: "https://www.voxac30.org.uk/vox_ac30_circuit_diagrams.html"
  - desc: "Vox AC30 history archive, \"The Vox AC30/6, black control panels\". Supplies what separates this circuit from the AC30/4 and the AC15: the EF86 replaced by an ECC83, \"one half each for the first stage of the Brilliant and Normal channel\"; a single treble \"cut\" control instead of per-channel tone controls; and the added Brilliant channel. The changes in the May 1961 list served \"to lift the gain of the amplifier (Brilliant channel in particular) and to enhance its treble response\". The transformers are by Haddon Transformers Ltd of South Ruislip and the choke by Radiospares, as on the AC15."
    url: "https://www.voxac30.org.uk/vox_ac30_6_black_panels.html"
  - desc: "EL34World's Vox folder, a five-sheet set of later Vox factory and service schematics (AC30 Reverb 1978, AC30 Silver Jubilee, AC30 S.S. Red, AC30 Top Boost Reissue 1994, AC30 Twin Reverb with modifications). The cross-reference for legibility. None is a period JMI sheet, so no value here comes from them. The Silver Jubilee sheet carries the same inverter and output section part for part (100 kΩ anode loads R58 and R63, a 1.2 kΩ shared cathode, a 47 kΩ tail and 1 MΩ leaks, a 250 kΩ log CUT in series with 47 nF across the inverter outputs, four EL84s on 1.5 kΩ grid stoppers and 100 Ω screen stoppers, and a shared cathode resistor bypassed by 250 µF 25 V). It settles the one character OS/065 leaves ambiguous: the AC30/6's R19, whose multiplier on the OS/065 copy reads like an ohm sign, is 100 kΩ. The AC30 Twin Reverb sheet independently shows the 5AR4/GZ34 rectifier and the 4 kΩ anode-to-anode output transformer."
    url: "https://el34world.com/charts/Schematics/files/Vox/Vox_ac30.pdf"
  - desc: "Independent published circuit analysis of a later Vox AC30 output stage. A third reading of the arrangement on this page: four EL84s in parallel push-pull, cathode-biased on one shared resistor with no bias supply, a DC grid bias of about −10 V and a 4 kΩ plate-to-plate output transformer; and of the shared first stage, a 220 kΩ anode load with a 1.5 kΩ shared cathode resistor, 25 µF bypass and about −1.6 V of bias. Both figures agree with the annotations on OS/065."
    url: "https://www.ampbooks.com/mobile/classic-circuits/vox-ac30/"
  - desc: "Wikipedia, \"Vox AC30\". Supplies the AC30/6's three channels, and Vox swapping \"the Normal channel's EF86 preamp valve for the more common ECC83 (12AX7)\" because of microphony at higher volume. It notes that the AC30/4 and AC30/6 schematics were \"both originally dated April 29, 1960\"."
    url: "https://en.wikipedia.org/wiki/Vox_AC30"
  - desc: "Philips/Mullard, EL84 data sheet, January 1969 (\"A.F. Output Pentode\"). The data-sheet anchor for the site's open (CC0) EL84 tube model, used for this amp's four output tubes: Va = 250 V, Vg2 = 250 V and Vg1 = −7.3 V give Ia = 48 mA, Ig2 = 5.5 mA, S = 11.3 mA/V and µ(g1-g2) = 19."
    url: "https://frank.pocnet.net/sheets/010/e/EL84.pdf"
  - desc: "RCA, 12AX7-A data sheet (October 1960), \"Characteristics, Class A1 Amplifier\". A readable copy of the 12AX7 average characteristics behind the site's open (CC0) 12AX7 tube model, used for this amp's first stage and phase inverter: Va = 250 V and Vg = −2 V give 1.2 mA at 1600 µmho; a second point, Va = 100 V and Vg = −1 V, gives 0.5 mA; µ = 100. The model's stated anchor is RCA's Receiving Tube Manual RC-19 (1959), a printed book with no archived scan. This RCA sheet prints the same two points, so it is the copy a reader can open and check."
    url: "https://frank.pocnet.net/sheets/049/1/12AX7A.pdf"
verification:
  status: draft   # The operating point agrees closely — every gated node lands
                  # within 11% of its printed figure and most within 2% — but the
                  # sheet annotates working voltages beside the circuit rather
                  # than printing a tabulated valve-voltage chart, and states no
                  # measurement convention, so there is no per-pin reference to
                  # verify against. The same reason the sibling AC15 is a draft.
                  # See voltages.yaml and notes.md.
                  # The artifact set is complete and is not the bar here: the
                  # schematic is redrawn and round-trips, and the board layout
                  # is drawn (a DERIVED board — JMI published no AC30/6 layout
                  # sheet, and the caption says so), both renders and the social
                  # card present, with the drawn wiring proved electrically
                  # equivalent to netlist.cir.
                  # WORK ITEM: revisit whether the sheet's annotated working
                  # voltages are a strong enough per-pin reference to verify
                  # against at all.
# Day the circuit landed in the corpus (git history, amps/ac30/) — the feed's
# pubDate for a draft; production builds are shallow clones and cannot ask git.
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V7: "excluded — the Vibrato/Tremolo channel's first stage, left out with the whole channel: its dropper chain does not resolve back to a named rail on the available scan"
  V8: "excluded — the Vibrato/Tremolo modulator, left out with the whole channel (see V7)"
  V9: "excluded — the Vibrato/Tremolo phase-shift oscillator: a running oscillator has no static operating point"
