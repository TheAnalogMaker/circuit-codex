  - { ref: V5, part: "Power tube", value: "EL84", role: "Push-pull output, side A (parallel with V3)" }
  - { ref: V4, part: "Power tube", value: "EL84", role: "Push-pull output, side B (lower)" }
  - { ref: V6, part: "Power tube", value: "EL84", role: "Push-pull output, side B (parallel with V4)" }
  - { ref: V7, part: "Preamp tube", value: "ECC83 (12AX7)", role: "Vibrato/Tremolo channel first stage" }
  - { ref: V8, part: "Preamp tube", value: "ECC82 (12AU7)", role: "Vibrato/Tremolo modulator" }
  - { ref: V9, part: "Preamp tube", value: "ECC83 (12AX7)", role: "Vibrato/Tremolo phase-shift oscillator" }
  - { ref: V10, part: "Rectifier tube", value: "GZ34 (5AR4)", role: "Full-wave rectifier" }
  # --- power supply, transformers, hardware ---
  - { ref: T2, part: "Power transformer", value: "HT secondary 280-0-280 V at 160 mA · 6.3 V, 6 A heater winding · 5 V, 2 A rectifier winding · primary taps 115/160/205/225/245 V", role: "Mains/HT transformer (Haddon)" }
  - { ref: T1, part: "Output transformer", value: "4 kΩ anode-to-anode primary · 8 Ω / 15 Ω secondary taps", role: "Output transformer (Haddon)" }
