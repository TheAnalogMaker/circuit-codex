sources:
  - desc: "Marshall, factory drawing \"Basic schematic for Marshall trem amps, types 1961, 1962, 1987/T\". Supplies every legible component value and the printed valve-voltage chart for the core head, without the tremolo. Several readings need care. V1A's plate load is printed \"1■0K\", with an illegible middle digit; this page keeps 100 kΩ, because the chart's equal plate voltages rule out 180 kΩ. The phase inverter's plate-to-plate capacitor, the series resistor in the bias feed and a shunt at the grid-line node are illegible, and one electrolytic in the bias supply is unvalued. The KT66 grids have no stoppers: the drawing's only 33K is in the tremolo network. The grid-line bubble \"10 5V\" is disputed and the chart's KT66 grid cell is illegible, so this page's −50 V bias is assumed, not read. Not reproduced here; archived at Dr. Tube."
    url: "https://www.drtube.com/schematics/marshall/jtm45tr.gif"
  - desc: "GEC / M-O Valve Co., KT66 data sheet (Issue 4, April 1963). The anchor for the site's open (CC0) KT66 tube model: Va = 250 V, Vg2 = 250 V and Vg1 = −15 V give Ia = 85 mA and gm = 7 mA/V; screen current Ig2 = 2.5 mA at the Class AB1 push-pull tetrode point (Vg2 = 300 V, Vg1 = −27 V); µ(g1-g2) = 9.5, from the triode-connection gm × ra."
    url: "https://frank.pocnet.net/sheets/084/k/KT66_GEC.pdf"
verification:
  status: verified
  date: 2026-07-18
  max_deviation_pct: 6.5   # worst gated node: V3A plate (cathode-follower grid)
