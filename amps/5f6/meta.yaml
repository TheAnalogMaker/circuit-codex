sources:
  - desc: "Fender, \"Bassman\" Model 5F6 schematic (drawing code F-EG). Supplies every component value, the printed voltage chart and the transformer and choke part numbers (power transformer 8087, choke 14684, output transformer 45249). Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6.pdf"
  - desc: "Fender, \"Bassman\" Model 5F6-A drawing (drawing code I-EG). Read side by side with the 5F6 to establish what the later revision changed: a GZ34 in place of the 83, 470 Ω 1 W screen resistors in place of 100 Ω, no output grid stoppers, and the presence control moved from the tone stack's ground leg to the foot of the phase-inverter tail. Both drawings print the same rails, transformers and preamp values."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6a.pdf"
  - desc: "Fender, \"Bassman\" Model 5F6 layout drawing (drawing code F-EG), page 1. Supplies the order of parts on the eyelet board and the wiring: which eyelet each lead leaves and where it lands on the sockets, pots, jacks and transformers, including the tone-pot hookup. It also gives the marked lead colours: power transformer red and red-yellow for the HT winding, yellow for the 5 V rectifier filament, red-blue for the bias tap, green and green-yellow for the heaters; output transformer blue and brown to the plates, red centre tap, black and green secondary. The same sheet marks both rail droppers 1 W and mounts the 1.5 kΩ output grid stoppers, the 100 Ω screen resistors and the 100 kΩ V2A plate load on the tube sockets rather than the board. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6.pdf"
  - desc: "RCA, type 83 data sheet (dated 7-63). Supplies the mercury-vapour rectifier's characteristics and ratings, and the figures the site's open (CC0) 83 tube model is fitted to: a tube voltage drop of about 15 V, 225 mA rated DC output, 1 A peak per plate, 1550 V peak inverse, a condensed-mercury temperature of 20–60 °C, and a 5.0 V, 3.0 A filament."
    url: "https://frank.pocnet.net/sheets/049/8/83.pdf"
  - desc: "General Electric, type 83 data sheet ET-T464 (dated 2-47). Confirms the RCA figures and states the design intent behind them: the tube supplies DC current at nearly constant voltage despite fairly wide changes in output current."
    url: "https://frank.pocnet.net/sheets/093/8/83.pdf"
  - desc: "Wikipedia, \"Fender Bassman\". Dates the 5F6 to July 1957, as the revision built around a single 83 mercury-vapour rectifier with a new three-knob tone stack, replaced during 1958 by the 5F6-A, which changed the rectifier to a GZ34 and modified the presence circuit. Neither drawing prints a power rating. The 40 W figure here is the 5F6-A's, carried across because the two circuits share the power transformer (8087), choke (14684), output transformer (45249), 5881 pair, printed rails and printed bias voltage."
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
verification:
  status: verified
  date: 2026-08-02
  max_deviation_pct: 9.6   # worst gated node (the 12AY7 plates, tol 20%); the two phase-inverter grid figures are disputed and excluded from gating, arithmetic given in notes.md — same treatment as 5f4 and jtm45
