# Board layout — redrawn from the published Fender 'Bassman' 5F6 layout drawing
# (F-EG). Part refs are the shared key into bom.yaml; the renderer reads each
# value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them, with a
# lead-by-lead wiring layer — never a trace or a dimensioned reproduction.
#
# The diagram reads left→right in the order of the drawing's own tube row
# (83 · 5881 · 5881 · 12AX7 · 12AX7 · 12AY7): the bias supply and B+ rail at the
# left, then the fixed-bias 5881 output support, the long-tailed-pair phase
# inverter, the cathode-follower tone stack, the 12AX7 driver, and the 12AY7
# input pair at the right.
board:
  rows: 2
  cols: 54
  title: "5F6 · eyelet board layout"
caption: "Redrawn from the published Fender 5F6 layout drawing (F-EG) — the principal board components in the order the drawing shows them, with their hookup. Parts the sheet mounts on the tube sockets rather than the board are drawn where they sit: the 1.5 kΩ output grid stoppers and 100 Ω screen resistors at the 5881 sockets, and the 100 kΩ V2A plate load across the 12AX7 socket, between the plate pin and the cathode-follower plate pin that already carries +325 V. The 1 MΩ input grid leaks sit at their input jacks and the 0.1 µF presence capacitor at the presence pot, as the sheet draws them. Only the first jack of each channel is shown; the chassis carries four, each second jack adding another 68 kΩ grid stopper onto the same grid. The three 20 µF plate, screen and phase-inverter filter capacitors are in the chassis filter pan, not on the board — the sheet feeds the +432 V and +430 V eyelets from there through a chassis grommet — so only the 8 µF preamp filter appears here. The board's several chassis-ground returns are drawn as one bare ground bus in the house style. The 6.3 V heater chain (green twisted pair, power transformer → pilot lamp → the 5881 pair → the two 12AX7s → the 12AY7) follows the daisy order of the sheet's pin-by-pin heater marks, with the winding centre tap grounded at the chassis; the 83 is directly heated from the 5 V winding and off the 6.3 V chain. The power-transformer primary leads land on chassis switches, off the board. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Bassman' Model 5F6 layout drawing (F-EG), page 1"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6.pdf"

# Wiring proven electrically equivalent to the verified netlist by
# pipeline/verify_layout_nets.py (see the net_map block at the foot of this file)
# under the hardened gate: all six preamp/PI sections and both 5881 outputs
# anchor by basing (0 UNANCHORED), and the PI-plate→output-grid couplers
# (C8/C9), the output grid stoppers (RGS1/RGS2) and the screen resistors
# (RS1/RS2) are checked as real parts, so a coupler on the wrong grid or a
# crossed phase-inverter output would fail. Twisted heater runs are validated
# onto heater pins.
wiring_claim: verified

parts:
  # --- bias supply (selenium rectifier, 15k/56k, two 8 µF/150 V) -----------
  - { ref: C19,  a: [0, 0],  b: [0, 2] }    # 8 µF reservoir, rectifier side
  - { ref: RB1,  a: [1, 0],  b: [1, 1], value_nudge: [-12, 12] }   # 15k bias series
  - { ref: RB2,  a: [1, 2],  b: [1, 3], value_nudge: [-12, 12] }   # 56k bias bleeder
  - { ref: C20,  a: [0, 3],  b: [0, 5] }    # 8 µF filter on the −48 V line
  # --- B+ rail: droppers and the preamp filter ----------------------------
  - { ref: RD1,  a: [1, 9],  b: [1, 10] }   # 4.7k 1 W, B+2 → B+3
  - { ref: RD2,  a: [1, 11], b: [1, 12] }   # 10k 1 W, B+3 → B+4
  - { ref: C18,  a: [0, 12], b: [0, 14] }   # 8 µF · 450 V preamp filter (B+4)
  # --- 5881 output: PI couplers and grid leaks -----------------------------
  - { ref: C9,   a: [0, 15], b: [0, 17] }   # 0.1 µF, V3B (100k) plate → V5 grid
  - { ref: RGL2, a: [1, 15], b: [1, 16] }   # 220k V5 grid leak, from −48 V
  - { ref: C8,   a: [0, 18], b: [0, 20] }   # 0.1 µF, V3A (82k) plate → V4 grid
  - { ref: RGL1, a: [1, 17], b: [1, 18] }   # 220k V4 grid leak, from −48 V
  # --- negative feedback ---------------------------------------------------
  - { ref: RNF,  a: [1, 19], b: [1, 20] }   # 27k, speaker → tone-stack ground leg
  # --- long-tailed-pair phase inverter -------------------------------------
  - { ref: RLA,  a: [1, 21], b: [1, 22] }   # 82k 5% PI plate load (V3A)
  - { ref: C12,  a: [0, 22], b: [0, 24] }   # 47 pF across the two PI plates
  - { ref: RLB,  a: [1, 23], b: [1, 24] }   # 100k 5% PI plate load (V3B)
  - { ref: RGA,  a: [1, 25], b: [1, 26] }   # 1M PI grid leak (V3A) → tail junction
  - { ref: C10,  a: [0, 25], b: [0, 27] }   # 0.02 µF, treble wiper → V3A grid
  - { ref: RGB,  a: [1, 27], b: [1, 28] }   # 1M PI grid leak (V3B) → tail junction
  - { ref: C11,  a: [0, 28], b: [0, 30] }   # 0.1 µF · 200 V, V3B grid to ground
  - { ref: RTAIL, a: [0, 31], b: [1, 31] }  # 470 Ω PI tail (vertical)
  - { ref: RT2,  a: [1, 32], b: [1, 33] }   # 10k tail junction → ground
  # --- cathode-follower FMV tone stack -------------------------------------
  - { ref: C6,   a: [0, 33], b: [0, 35] }   # 0.02 µF, slope → treble/bass node
  - { ref: RSL,  a: [1, 34], b: [1, 35] }   # 56k tone-stack slope
  - { ref: C7,   a: [0, 36], b: [0, 38] }   # 0.02 µF, slope → middle wiper
  - { ref: RKCF, a: [1, 36], b: [1, 37] }   # 100k cathode-follower load
  - { ref: C5,   a: [0, 39], b: [0, 41], nudge: [-22, 0] }   # 250 pF mica, CF output → treble
  # --- channel mixers into the V2A grid ------------------------------------
  - { ref: RM1,  a: [1, 38], b: [1, 39] }   # 270k bright-channel mixer
  - { ref: RM2,  a: [1, 40], b: [1, 41] }   # 270k normal-channel mixer
  # --- V2A cathode ---------------------------------------------------------
  - { ref: RK2,  a: [0, 42], b: [1, 42], value_nudge: [0, 15] }    # 820 Ω V2A cathode (vertical)
  - { ref: C4,   a: [0, 43], b: [0, 44] }   # 25 µF V2A cathode bypass
  # --- 12AY7 input pair (right end) ----------------------------------------
  - { ref: R1s,  a: [1, 43], b: [1, 44] }   # 68k bright-channel grid stopper
  - { ref: C1,   a: [0, 45], b: [0, 47] }   # 0.02 µF, V1A → bright volume
  - { ref: RL1,  a: [1, 45], b: [1, 46], value_nudge: [-14, 12] }  # 100k V1A plate load
  - { ref: R2s,  a: [1, 47], b: [1, 48], value_nudge: [-26, 16] }  # 68k normal-channel grid stopper
  - { ref: C2,   a: [0, 48], b: [0, 50] }   # 0.02 µF, V1B → normal volume
  - { ref: RL2,  a: [1, 49], b: [1, 50] }   # 100k V1B plate load
  - { ref: RK1,  a: [0, 51], b: [1, 51] }   # 820 Ω shared 12AY7 cathode (vertical)
  - { ref: C3,   a: [0, 52], b: [0, 53] }   # 250 µF 12AY7 cathode bypass

