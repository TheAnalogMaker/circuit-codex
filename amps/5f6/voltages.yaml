# Printed voltage chart read directly from the published 5F6 (F-EG) drawing
# (2026-08-02). Fender's printed convention: values ±20%, electronic voltmeter.
# Rails get 8% (the choke DCR is estimated); tube pins 20%.
#
# Two printed values are disputed. The drawing gives both phase-inverter grids
# (+22 V and +23 V) as well as the tail junction they return to (+32.5 V) — but
# the same drawing shows each grid reaching that junction through a 1 MΩ leak
# and nothing else, so with no grid current every grid must sit AT the junction
# potential. See the notes on GPIA/GPIB for the arithmetic.
source: "Fender 5F6 (F-EG) drawing, printed voltages: rails +432/+430/+385/+325, bias -48; 12AY7 plates +150, cathode +2.5; V2A plate +180, cathode +1.2, cathode follower +180; PI grids +22/+23, cathodes +34, tail junction +32.5, PI plates +235/+230"
nodes:
  BP2:  { chart: 430, tol_pct: 8, note: "screens node after the choke (DCR estimated at 130 Ω)" }
  BP3:  { chart: 385, tol_pct: 8, note: "PI supply node after the 4.7 kΩ dropper" }
  BP4:  { chart: 325, tol_pct: 8, note: "preamp node after the 10 kΩ dropper" }
  PAY1: { chart: 150, tol_pct: 20, note: "12AY7 plate (bright channel), printed pin value" }
  PAY2: { chart: 150, tol_pct: 20, note: "12AY7 plate (normal channel)" }
  KAY:  { chart: 2.5, tol_pct: 20, note: "shared 12AY7 cathode, 820 Ω" }
  P2A:  { chart: 180, tol_pct: 20, note: "V2A plate = cathode-follower grid (direct-coupled)" }
  K2A:  { chart: 1.2, tol_pct: 20, note: "V2A cathode, 820 Ω with a 25 µF bypass" }
  KCF:  { chart: 180, tol_pct: 20, note: "cathode-follower output, printed +180" }
  PPIA: { chart: 235, tol_pct: 20, note: "PI plate, 82k 5% side" }
  PPIB: { chart: 230, tol_pct: 20, note: "PI plate, 100k 5% side" }
  KPI:  { chart: 34, tol_pct: 20, note: "PI cathodes above the 470 Ω tail resistor" }
  JPI:  { chart: 32.5, tol_pct: 20, note: "tail junction (grid-leak return), above the 10 kΩ to ground" }
  GPIA:
    chart: 22
    tol_pct: 20
    disputed: true
    dispute_note: "The chart contradicts its own topology. This grid reaches the tail junction through a 1 MΩ leak and has no other DC path, so with no grid current it must sit at the junction's own printed +32.5 V. The printed 22 V is 68% of that — the fraction a 1 MΩ source reads into a meter of roughly 2 MΩ input resistance (22 = 32.5 × 2.1/3.1), which is a 20,000 Ω/V moving-coil voltmeter on its 100 V range rather than the electronic voltmeter the drawing's notice specifies. Simulation follows the topology."
  GPIB:
    chart: 23
    tol_pct: 20
    disputed: true
    dispute_note: "The other half of the same contradiction — see GPIA. Printed 23 V against the same +32.5 V junction is 71%, the same ≈2 MΩ meter loading on the second 1 MΩ leak."
  S51:  { chart: null, note: "informational — 5881 screen after its 100 Ω resistor" }
  G51:  { chart: -48, tol_pct: 8, note: "fixed bias via a 220 kΩ leak and a 1.5 kΩ grid stopper from the −48 V supply" }
