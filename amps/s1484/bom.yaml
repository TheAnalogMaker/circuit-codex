  - { ref: R39, part: "Carbon comp resistor", value: "100 kΩ · ½ W · 20%", role: "V4A plate load" }
  - { ref: C16, part: "Film capacitor", value: "0.01 µF · 600 V", role: "V4A plate into V5's grid" }
  - { ref: R40, part: "Carbon comp resistor", value: "560 kΩ · ½ W · 20%", role: "V4B grid series resistor" }
  - { ref: R41, part: "Carbon comp resistor", value: "68 kΩ · ½ W · 20%", role: "V4B grid to the ground bus, the bottom of that divider" }
  - { ref: R42, part: "Carbon comp resistor", value: "10 kΩ · ½ W · 20%", role: "V4B cathode bias, unbypassed" }
  - { ref: R43, part: "Carbon comp resistor", value: "1 MΩ · ½ W · 20%", role: "V5 grid leak. The drawing letters an unplaceable 55 V beside it — see voltages.yaml and notes.md" }
