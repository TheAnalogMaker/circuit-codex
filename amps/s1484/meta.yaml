# Circuit Codex metadata — schema: docs/schema.md (v1)
#
# ID NOTE. This corpus names circuit-number-first, and the designation this
# drawing carries in its own title block is a CHASSIS number — "SILVERTONE CHASSIS
# 185.11040" — whose dot no id may contain (docs/schema.md: a designation is
# lowercase letters and digits, no separators). The id is therefore the model
# number the same manual page names in its own box ("USED IN MODEL 1484"),
# prefixed to keep it a designation token rather than a bare number. The chassis
# number is recorded in the sources below and in notes.md, and it, not the id, is
# what a reader should match against a chassis plate.
id: "s1484"
name_style: "Silvertone Twin Twelve-style"
family: other
era:
  # The drawing itself carries no date and no revision box. 1963 and 1967 are the
  # introduction and withdrawal years published for the model by the Silvertone
  # archive cited below; the manual page carries "V1-D63", which reads as a
  # December 1963 print code but is not asserted here as one. A dated example
  # inside the bracket is cited too (pot codes 1965).
  start: 1963
  end: 1967
wattage: 60
tubes: [12AX7, 12AX7, 6CG7, 12AX7, 6CG7, 12AX7, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "1N3194 ×4 (capacitor multiplier) + 1N3754 (bias)" }
  bias: fixed
  phase_inverter: cathodyne
  tone_stack: per-channel-tb   # each channel carries its own Bass + Treble + Volume network between V1 and V2; there is no shared tone stack and no middle control
lineage:
  derived_from: []   # no documented derivation from another circuit in this corpus
  influenced: []
conventions:
  designators: sequential   # the sheet letters R1…R61, C1…C31, D1…D5 and V1…V8, and the factory parts list is indexed by the same numbers
  notation: us
sources:
  - desc: "Silvertone, factory drawing titled \"SCHEMATIC DIAGRAM OF SILVERTONE CHASSIS 185.11040\", with the title set along the bottom edge of the sheet. This is the revision documented here. Three notes sit beside the title block: \"1. VALUES OF CAPACITORS IN MFD. 2. ALL RESISTORS ARE ½ WATT UNLESS OTHERWISE NOTED. 3. VOLTAGES MEASURED FROM POINTS INDICATED TO CHASSIS WITH 20,000 OHM/VOLT METER.\" A TUBE LAYOUT panel across the top gives the complement by socket: V1 12AX7, V2 12AX7, V3 \"6CG7 or 6FQ7\", V4 12AX7, V5 \"6CG7 or 6FQ7\", V6 12AX7, V7 6L6GC, V8 6L6GC, with the C25 filter can and the reverb pan drawn in place. Supplies the circuit and its printed voltages, which are lettered on the nodes rather than tabulated: 480 V at the top of the supply stack, 475 V at both 6L6GC plates, 340 V at their screens, −36 V bias, and the preamp figures recorded in the operating-point table on this page. Not reproduced here; archived at Schematic Heaven."
    url: "https://schematicheaven.net/bargainbin/silvertone1484.pdf"
  - desc: "Sears, \"Owner's Manual — Service Data and Repair Parts List for Silvertone Musical Instrument Amplifier Model No. 1484\", in the corrected reproduction published by the Silvertone archive. It has four pages: the cover; the Division 57 technical-manual page headed \"CHASSIS NO. 185.11040\" and boxed \"USED IN MODEL 1484\" (part no. 1484MV1, sheet code V1-D63); the operating instructions; and a redrawn schematic with the same title block. The technical-manual page is the factory parts list and the authority for every tolerance and voltage rating in the parts list on this page: all resistors 20% and ½ W unless noted; the capacitor working voltages; the multi-section can as \"5-10-20 mfd., 450 v.\"; and the named assemblies (T1 DD-50 power transformer, T2 O50 output transformer, CH1 L480 choke, CS55 spring reverberation unit, 306-2H light-operated tremolo unit, FS-2 dual foot switch, SW1 \"part of control R37\", and two 12-H8 12-inch 8 Ω speakers). The operating page describes the two channels: channel one has \"Two Inputs and three controls\"; \"CHANNEL TWO . . . contains both Reverberation and Tremolo\". The reproduction's author states that schematic errors in the original were corrected, so its schematic is a redraw. Where it and the factory scan differ, this page records the factory sheet; the one difference is C12 (see the circuit story)."
    url: "https://www.silvertoneworld.net/schematics/Sears_Silvertone_1484_Twin_Twelve_REPRODUCTION_Manual.pdf"
  - desc: "Silvertone archive, model page for the 1484. The source of this page's era range and the chassis identification: the model 1484 Twin Twelve, introduced in 1963 and retired in 1967, with chassis #11040 named as the common revision. The reproduction manual above is published from that page."
    url: "https://www.silvertoneworld.net/amplifiers/1484/1484_schematic.html"
  - desc: "Chicago Music Exchange, dealer listing of a surviving example. A dated point inside the era range and an independent reading of the tube complement: \"6FQ7 (x2), 12AX7 (x4), 6L6 (x2)\", a 2×12 cabinet, and \"Pot codes date to 1965\". The listing is titled \"60-Watt\", the period retail rating this page records as the amp's output. The drawing prints no output-power figure of any kind; its only power number is the mains draw, \"117 VAC 60 CYCLES 100 WATT 1 AMP\"."
    url: "https://www.chicagomusicexchange.com/products/silvertone-model-1484-twin-twelve-60-watt-2x12-piggyback-1226495"
  - desc: "RCA, 6CG7 data sheet (DATA 1, dated 8-59), \"Medium-Mu Twin Triode\", 9-pin miniature. The anchor for the site's open (CC0) 6CG7 tube model, and the ratings that bound both 6CG7 sockets here: Va = 250 V and Vg = −8 V give Ia = 9 mA, gm = 2600 µmho, rp = 7700 Ω and µ = 20; a second column, Va = 90 V and Vg = 0 V, gives 10 mA and 3000 µmho. Design maximums are 330 V plate, 4 W per plate and 22 mA cathode, with a 1 MΩ grid-circuit limit for fixed-bias operation that the inverter's own grid return sits exactly on. Basing 9AJ, with pin 9 an internal shield. See the 6CG7 reference page for the model and its method."
    url: "http://www.tubebooks.org/tubedata/hb-3/receiving_tubes_part_1/6CG7.PDF"
verification:
  status: draft   # Four reasons, all stated rather than tuned away.
                  # (1) The netlist does NOT derive this amplifier from its rail.
                  # It cannot: the supply is a stacked capacitor multiplier whose
                  # intermediate rails the sheet never labels, and the node that
                  # feeds every preamp plate load carries no printed figure. The
                  # preamp plates are therefore driven at their own printed values
                  # and only the cathodes are derived — a narrower claim than a
                  # verified circuit makes. See netlist.cir's SCOPE block.
                  # (2) One gated node misses: V3A's cathode simulates 3.17 V
                  # against the printed 4 V, −20.7% on a ±20% convention.
                  # (3) The drawing prints a 55 V that belongs to no node it
                  # touches; it is carried unplaced, not assigned (voltages.yaml).
                  # (4) The reverb pair (V4, V5) and the tremolo bottle (V6) are
                  # drawn in bom.yaml but out of the netlist's scope entirely.
# Day the circuit landed in the corpus (git history, amps/s1484/) — the feed's
# pubDate for a draft; production builds are shallow clones and cannot ask git.
added: 2026-08-30
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V4: "excluded — the reverb recovery bottle: the drawing prints no plate voltage this entry can place on V4's second half (the unplaced 55 V in the voltage table)"
  V5: "excluded — the 6CG7 reverb driver, left out with the recovery bottle for the same reason (see V4)"
  V6: "excluded — the tremolo's phase-shift oscillator and its neon/photocell modulator (306-2H): a running oscillator has no static operating point"
