  - { id: V1,  ref: V1, kind: tube, edge: bottom, at: 51,  label: "V1 · 12AX7 (7025) ch.1 input" }
  # Channel-1 controls, with the tone parts the sheet mounts at each pot drawn
  # beside it (kind: part): 47MM at the Volume, 250MM + 100K at the Treble,
