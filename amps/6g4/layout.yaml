# net_map — reviewable reconciliation of the drawn wiring with the DC
# netlist (netlist.cir) for pipeline/verify_layout_nets.py. See
# docs/layout-schema.md.
net_map:
  # The push-pull output transformer: the netlist omits winding DCR, so both
  # 6L6GC plate leads and the primary centre tap collapse onto the reservoir
  # node BP1 (the chart prints +456 V at both). The speaker terminal is the
  # negative-feedback return: the OT secondary is a short at DC, so the
  # 10 kΩ feedback resistor's far end reads as ground.
  #
  # No excluded_tubes entry belongs here. The tremolo oscillator is the
  # SECOND half of V2, whose first half (V2A) is the modelled channel-1
  # recovery stage, so that socket is anchored by V2A and only the
  # oscillator half's own network is unmodelled — it is enumerated in the
  # unchecked-terminal report rather than hidden behind a socket-level
  # exclusion (the identical situation, and the identical call, as 6G3's own
  # driver+oscillator bottle — see amps/6g3/layout.yaml's net_map).
  anchors:
    T2.red:   BP1
    T2.blue:  BP1
    T2.brown: BP1
    SPK.tip:  "0"
  # RT2's far end (netlist: "RT2 JPI 0 6800", straight to ground) is drawn
  # reaching true ground through RPF (1.5k) rather than a direct wire — the
  # published circuit's own foot-resistor-to-ground, per meta.yaml's source
  # note. That is a declared DC SIMPLIFICATION, not a claim that the foot is
  # DC-neutral: the tail's whole current flows through RPF, and RNFB's return
  # through the OT secondary is a second DC path to ground on the same node.
  # Only the VRPRES branch is genuinely AC-only, because CPRES blocks DC.
  series_bridge:
    RPF: "1.5k presence/feedback foot resistor, PI tail foot -> ground. The published 6G4 sheet draws it straight down to ground with the 5k-L Presence pot and its .1 uF cap paralleling it, and the 10k feedback resistor landing on the same node. netlist.cir folds RPF into ground and models the tail as RT2 JPI 0 6800 — a declared DC simplification: the real DC foot is 1500 in parallel with RNFB's return through the OT secondary (~1.3k), and no gated node depends on it (voltages.yaml reads KPI and JPI as informational, chart: null). Same abstraction 6g5 declares for its own RPRES in sch_map.yaml."
  netlist_unplaced:
    RG1I: "1 MΩ channel-1 input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2I: "1 MΩ channel-2 input grid leak — mounted at the input jacks"
    RG1D: "channel-1 recovery-stage grid return, modelled as one grid leak (G1D -> 0); realised through the Volume pot VRV1, whose wiper is drawn to the grid and whose cold lug is drawn to ground — a pot, so not a netlist device"
    RG2D: "channel-2 recovery-stage grid return, modelled as one grid leak (G2D -> 0); realised through the Volume pot VRV2, as RG1D"
