  - { id: CBR1, ref: CBR1, kind: part, edge: top, at: 45.6, label: "Ch.1 bright" }
  - { id: VRV1, ref: VRV1, kind: pot, edge: top, at: 47, label: "Ch.1 volume" }
  - { id: CT1,  ref: CT1,  kind: part, edge: top, at: 48.5, label: "Ch.1 treble cap" }
  - { id: VRT1, ref: VRT1, kind: pot, edge: top, at: 50, label: "Ch.1 treble" }
  - { id: RS1T, ref: RS1T, kind: part, edge: top, at: 51.5, label: "Ch.1 slope" }
  - { id: VRB1, ref: VRB1, kind: pot, edge: top, at: 53, label: "Ch.1 bass" }
  - { id: CB1T, ref: CB1T, kind: part, edge: top, at: 54.4, label: "Ch.1 bass cap" }
  - { id: J1,  kind: jack, edge: top, at: 55.6, label: "Ch.1 in" }
  - { id: RSL1, ref: RSL1, kind: part, edge: top, at: 56.8, label: "Ch.1 bass foot" }
  - { id: V4,  ref: V4, kind: tube, edge: bottom, at: 62,  label: "V4 · 12AX7 (7025) ch.2 recovery" }
  - { id: V3,  ref: V3, kind: tube, edge: bottom, at: 69,  label: "V3 · 12AX7 (7025) ch.2 input" }
  - { id: CBR2, ref: CBR2, kind: part, edge: top, at: 62.6, label: "Ch.2 bright" }
  - { id: VRV2, ref: VRV2, kind: pot, edge: top, at: 64, label: "Ch.2 volume" }
  - { id: CT2,  ref: CT2,  kind: part, edge: top, at: 65.5, label: "Ch.2 treble cap" }
  - { id: VRT2, ref: VRT2, kind: pot, edge: top, at: 67, label: "Ch.2 treble" }
  - { id: RS2T, ref: RS2T, kind: part, edge: top, at: 68.5, label: "Ch.2 slope" }
  - { id: VRB2, ref: VRB2, kind: pot, edge: top, at: 70, label: "Ch.2 bass" }
  - { id: CB2T, ref: CB2T, kind: part, edge: top, at: 71.4, label: "Ch.2 bass cap" }
  - { id: J2,  kind: jack, edge: top, at: 72.6, label: "Ch.2 in" }
  - { id: RSL2, ref: RSL2, kind: part, edge: top, at: 73.8, label: "Ch.2 bass foot" }

# Ground bus — the bare rail just below the bottom eyelet row; cathode,
# filter, grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 79] }

# Wiring — read from the published 6G4 layout drawing where legible;
# transformer leads carry the drawing's colours. Endpoints reference board
# eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated against the
# basing data), pot lugs, jacks, off-board 2-lead parts and transformer
# leads. Pin numbers: 6L6GC (V7/V8) plate=3, screen=4, grid=5,
# cathode=8, heaters=2/7 (reference/tubes/6l6gc.yaml); GZ34 (V9) plate
# unit1=4, unit2=6, cathode(B+)=8, heater=2 (reference/tubes/gz34.yaml);
# 12AX7 (V1-V5) unit1 plate=6/grid=7/cathode=8, unit2 plate=1/grid=2/
# cathode=3, heaters=4/5 (reference/tubes/12ax7.yaml).
runs:
  # === power transformer -> GZ34 -> reservoir (annotation layer) ==========
  # The two YELLOW leads are the 5 V rectifier-filament winding. The GZ34 is
  # indirectly heated but its cathode is strapped to the heater at pin 8, so the
  # winding lands on pins 2 and 8 and the B+ lead leaves pin 8 beside it. Until
  # 2026-09-09 neither was drawn and this socket carried one run — a rectifier
  # with no filament supply. See the `heaters:` block at the head of the file.
  - { from: T1.red1, to: V9.pin4, via: [[1, 0.32]] }
  - { from: T1.red2, to: V9.pin6, via: [[2, 0.58]] }
  - { from: T1.red-yellow, to: [1.45, 0.2], via: [[-0.3, 0.9]] }
  - { from: T1.yellow1, to: V9.pin2, via: [[0.35, 1.25], [0.5, 2.05]] }
  - { from: T1.yellow2, to: V9.pin8, via: [[0.05, 1.55], [0.15, 2.62], [2.5, 2.62]] }
  - { from: V9.pin8, to: C10.a, color: red, via: [[1.4, 2.3], [33, 2.3], [33.5, 0.3]] }

  # === BP1 (+456V): 6L6GC plates and screens, PI dropper, OT centre tap ====
  - { from: C10.a, to: RS1.a, color: red, via: [[34.5, -0.55], [2.5, -0.55], [2.5, -0.1]] }
  - { from: RS1.a, to: RD1.a, color: red, via: [[2.6, -0.85], [30.5, -0.85]] }
  - { from: RS1.a, to: RS2.a, color: red, via: [[4.5, -1.2], [13.5, -1.2]] }
  - { from: T2.red, to: C10.a, color: red, via: [[16.4, 0.6], [35, 0.6], [34.5, 0.05]] }
  - { from: T2.blue, to: V7.pin3, via: [[15.9, 0.3], [15.4, 2.6], [4.7, 2.6]] }
  - { from: T2.brown, to: V8.pin3, via: [[16.9, 0.3], [16.7, 2.7], [11.4, 2.7]] }
  - { from: T2.green, to: SPK.tip, via: [[16.4, 0.3], [14.86, 1.75]] }
  - { from: SPK.sleeve, to: [1.45, 29.5], via: [[15.14, 2.8], [29.5, 2.8]] }
  - { from: RS1.b, to: V7.pin4, via: [[3.9, 0.9], [4.6, 1.35]] }
  - { from: RS2.b, to: V8.pin4, via: [[13.9, 0.9], [14.6, 1.35]] }

  # === PI supply: RD1 (BP1 -> BC) -> the two plate loads (fan clear of RS2)
  - { from: RD1.b, to: RLPA.a, color: red, via: [[32.5, -0.4], [5.4, -0.4]] }
  # Lane moved out to -1.35 (2026-09-09) so it clears the Presence cap's
  # chassis terminals, which sit on the -1.0 lane at the top edge.
  - { from: RD1.b, to: RLPB.a, color: red, via: [[32.6, -1.35], [8.4, -1.35]] }

  # === output stage: grids/couplers ==========================================
  # C1.a and RGL1.b share the (row1, col0) eyelet — the coupler and the
  # grid-side end of the bias leak both land on V7's grid — so one wire from
  # that shared point to the tube pin suffices; RGL1.a (the OTHER end, row0)
  # is the NBIAS side, wired separately in the bias-supply section below.
  - { from: C1.a, to: V7.pin5, via: [[0.6, 0.55], [4.3, 0.55], [4.6, 1.4]] }
  - { from: V7.pin8, to: [1.45, 4.2], via: [[4.4, 1.7]] }
  # C2.b and RGL2.b share the (row1, col11) eyelet — same idiom for V8's grid.
  - { from: C2.b, to: V8.pin5, via: [[10.6, 1], [10.7, 1], [10.4, 1.4]] }
  - { from: V8.pin8, to: [1.45, 10], via: [[9.8, 2.2]] }

  # === phase inverter: plates (fanned clear of each other) ===================
  - { from: RLPA.b, to: V5.pin1, via: [[5.4, 1.55], [21.5, 1.55]] }
  - { from: C1.b, to: RLPA.b, via: [[3, 0.6], [4, 0.75]] }
  - { from: RLPB.b, to: V5.pin6, via: [[8.4, 3], [28.5, 3], [28.5, -0.3], [26.3, 0.9]] }

  # === phase inverter tail — fanned the same way 6G3's proven RTAIL pattern
  # fans (docs/layout-schema.md) ==============================================
  - { from: RT2.b, to: RGPA.a }
  - { from: RGPA.a, to: RTAIL.a, via: [[23.4, -0.18], [24.6, -0.18]] }
  - { from: RTAIL.a, to: RGPB.a, via: [[25.4, -0.18], [26.6, -0.18]] }
  - { from: RGPA.b, to: V5.pin2, via: [[22.9, 1.6], [21.2, 2.1]] }
  - { from: RGPB.b, to: V5.pin7, via: [[26.4, 1.36], [24.8, 1.36], [24.8, 2.1]] }
  - { from: RTAIL.b, to: V5.pin8, via: [[25.2, 1.74], [24.8, 2.34]] }
  - { from: RTAIL.b, to: V5.pin3, via: [[24.4, 1.5], [21.4, 1.5], [21.4, 1.92]] }
  # Presence/NFB node: RT2.a, RPF.a, RNFB.a and VRPRES's hot lug all join
  # here (row0 eyelets, the "signal-carrying" convention this file uses
  # elsewhere); RPF.b is the ground return (row1, routed to the bus) and
  # VRPRES's other lug reaches the bus only through CPRES — RNFB's OWN row1
  # end instead carries the speaker feed. The earlier draft left this node
  # unterminated (no wire ever reached true ground); fixed here.
  #
  # CPRES is chassis-mounted at the Presence pot, exactly where the published
  # layout page draws it (lettered .1-200 there, beside the 5K-L). Until
  # 2026-09-09 the corpus had no presence cap at all and this run went from
  # the pot's lug straight to the ground bus, which made the control a plain
  # variable resistance across RPF instead of the AC-only branch it is.
  - { from: RT2.a, to: RPF.a, via: [[21.4, -0.2], [19.6, -0.2]] }
  - { from: RPF.a, to: RNFB.a, via: [[19.4, -0.2], [17.6, -0.2]] }
  - { from: RPF.b, to: [1.45, 19] }
  - { from: RNFB.b, to: SPK.tip, via: [[17.4, 1.55], [13.6, 2.15]] }
  - { from: VRPRES.lug1, to: RT2.a, via: [[19, -0.6], [19.4, -0.35]] }
  - { from: VRPRES.lug2, to: CPRES.a, via: [[19.65, -0.75]] }
  - { from: CPRES.b, to: [1.45, 20.3], via: [[20.3, -0.55], [20.3, 1.2]] }

  # === V2 (channel-1 recovery, V2A) -> mixer -> GPIA =========================
  - { from: RL1D.b, to: V2.pin6, via: [[39.4, 1.6]] }
  - { from: CC1D.b, to: RM1.a }
  - { from: RM1.b, to: V5.pin2, via: [[43.4, -2.1], [22.2, -2.1], [22.2, 1.4]] }
  - { from: V2.pin8, to: CK1D.b, via: [[43.5, 2.35], [45.3, 1.5]] }
  - { from: CK1D.a, to: [1.45, 44.6], via: [[44.6, 1.4]] }
  - { from: RK1D.b, to: [1.45, 46.6] }

  # === V1 (channel-1 input) ===================================================
  - { from: RL1I.b, to: V1.pin1, via: [[50.4, 1.6]] }
  - { from: V1.pin3, to: CK1I.b, via: [[51.5, 2.35], [52.127, 1.5]] }
  - { from: CK1I.a, to: [1.45, 51.6], via: [[51.6, 1.4]] }
  - { from: RK1I.b, to: [1.45, 53.6] }
  - { from: J1.tip, to: V1.pin2, via: [[55.715, -0.4], [50.662, 2.044]] }

  # === channel-1 tone network, as the A-FJ sheet mounts it ===================
  # The .05 coupler leaves the plate eyelet for the Treble pot, where the 250MM
  # and the 100K meet it (node T). The 100K's far end is the slope foot: the
