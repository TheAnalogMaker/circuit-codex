net_map:
  anchors:
    T2.blue: BR
    T2.brown: BR
    T2.red: BR
    SPK.tip: '0'
  netlist_unplaced:
    RG1I: 1M channel-1 leak at input 1 — mounted on the jack, as the page draws it
    RG2I: 1M channel-2 leak at input 1 — mounted on the jack
    RG1D: volume pot VRV1, modelled as a grid-leak (G1D -> 0)
    RG2D: volume pot VRV2, modelled as a grid-leak (G2D -> 0)
  not_on_board:
    CH1: chassis choke 125C1A — drawn off the board as a two-lead choke between the reservoir and the post-choke node, a kind the sheet-to-board comparison does not yet read
    CF4: 20 µF can at the post-choke node — in the filter pack, which the page sends the rails to rather than drawing
    CF5: 20 µF can at the phase-inverter supply — in the filter pack
    CF6: 20 µF can at rail A — in the filter pack
    CF7: 20 µF can at the vibrato-pair supply — in the filter pack
    CF8: 20 µF can at the oscillator supply — in the filter pack
    C10: reservoir can — the page lands the GZ34's B+ on the board's +460 V eyelet and sends it on TO FILTER PACK
  leads:
    T1.6: T1.blue-red
