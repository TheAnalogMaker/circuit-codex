# Board layout — redrawn from the published Fender 6G4 'Super-Amp' layout
# drawing (A-FJ), page 2 of the same two-page factory sheet the schematic
# comes from. Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board in the order the layout page shows it — never a trace or a dimensioned
# reproduction.
#
# The A-FJ Super's board is the brown Pro's (amps/6g5) part for part: the
# output couplers and grid leaks at the power end, the phase inverter's plate
# loads and tail, the vibrato pair's network and the two band-splitting
# filters, the oscillator and splitter network, V2's and V1's parts, and the
# four 68k input stoppers at the input end — above the socket row GZ34, V7,
# V8, V5, V4, V3, V2, V1. The page mounts the tone parts at each channel's
# pots, the Speed control's 100k at the Speed pot, the Intensity wiper's
# .05-200 at the Intensity pot, and the 1500 tail-foot resistor and .1-200
# Presence capacitor at the Presence pot; they are drawn there. It sends the
# rails "TO FILTER PACK" rather than drawing the droppers, which ride with the
# 20 uF cans under the chassis; the four droppers are drawn off the board,
# the cans are not. The GZ34's B+ lands on the board's +460 V eyelet and
# goes on through the chassis choke; the reservoir can is in the filter pack.
# The output transformer's red centre-tap lead lands with the GZ34's B+,
# ahead of the choke, as the page draws it: the plates run from +460 V and
# the screens and droppers from the +458 V node after the choke.
# The bias sub-board, which the page boxes beside the power transformer, is
# drawn at the power end next to T1: the blue-red tap into the bias
# rectifier, 8 uF and 10k, then 8 uF and the 56k bleeder on -55 V.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp and the PT /
# rectifier AC side are an excluded annotation layer.
wiring_claim: verified

board:
  rows: 2
  cols: 89
  title: "6G4 · eyelet board layout"

# The bias-tap lead is lettered BLUE-RED on A-FJ, a colour the drawing
# palette has no swatch for, so it draws in the blue the output transformer's
# V7 plate lead also uses. Say so on the swatch, so the two cannot be taken
# for one lead.
wire_legend:
  blue: blue — the output transformer's V7 plate lead, and the bias-tap lead the drawing letters blue-red
heaters:
- id: h5
  volts: 5.0
  winding: 5 V rectifier-filament secondary — the transformer's yellow pair
  grounded_leg: none
  source: 'A-FJ page 2 (layout) fans TR1''s leads to the GZ34 socket, lettering each: YELLOW to pin 2,
    RED to pin 4, RED to pin 6, YELLOW to pin 8, with the B+ lead leaving pin 8 beside the second yellow.
    Page 1 (schematic) draws the same winding as a two-terminal secondary landing on the rectifier''s
    two heater connections, +456 V taken from the end carrying the cathode. The GZ34''s cathode is strapped
    to the heater at pin 8 inside the envelope (Mullard letters that pin "h,k"), so the winding floats
    at B+ and neither leg is grounded. Read on the only copy of this sheet in circulation, 2250 x 1269
    px for the layout page — low for the corpus, but the four lead landings and their colour letterings
    are unambiguous at 4x, and the schematic page''s topology confirms them independently.'
  sockets:
    V9:
      feed:
      - 2
      return:
      - 8
caption: 'Redrawn from the published Fender 6G4 ''Super-Amp'' layout drawing (A-FJ), page 2 of the two-page factory sheet — the eyelet board in the order the page shows it: output couplers and grid leaks at the power end, the phase inverter, the harmonic vibrato''s pair and filters, the oscillator and splitter, the two stages of each channel on V2 and V1, and the 68 kΩ input stoppers at the input end. Parts the page mounts at the controls are drawn there — each channel''s tone network, the Speed control''s 100 kΩ, the Intensity wiper''s 0.05 µF, and the Presence control''s 1.5 kΩ tail-foot resistor and 0.1 µF. The four dropper resistors ride with the filter cans in the filter pack, which the page does not draw; they are shown off the board, the cans are not. The bias sub-board, which the page boxes beside the power transformer, is drawn at the power end next to it: the transformer''s blue-red tap into the bias rectifier, 8 µF and 10 kΩ, then a second 8 µF and the 56 kΩ bleeder on the −55 V line. The output transformer''s red centre-tap lead lands with the GZ34''s B+ ahead of the choke, as the page draws it. The GZ34''s own 5 V filament winding is drawn as the sheet letters it — two yellow transformer leads to the rectifier''s heater pins 2 and 8, the B+ leaving pin 8 beside them. Not a trace or a dimensioned reproduction.'
source:
  desc: "Fender 'Super-Amp' Layout, Model 6G4 (A-FJ), page 2 of the two-page factory sheet (page 1 is the schematic)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_6g4_schem.pdf"

parts:
  # --- bias sub-board (the page boxes it beside the power transformer) --------
  # T1's blue-red tap -> the rectifier's "+" end (the cathode, band at a) ->
  # the 8-150 and the 10k; the 10k's far end is the -55 V line, with the second
  # 8-150 and the 56k bleeder. The page letters each can's "+" on its ground
  # lead, so both cans stand with that lead on top, where the drawings put the
  # mark, and a strap takes the two tops to ground.
  - { ref: DBIAS, a: [1, 0], b: [1, 1], cathode: a }   # bias rectifier, "+" toward the tap
  - { ref: CBIAS, a: [0, 1], b: [1, 1] }     # 8 uF: top (+) to ground, bottom on the rectifier's "-" end
  - { ref: RBIAS2, a: [1, 2], b: [1, 3] }    # 10k, rectifier node -> -55 V
  - { ref: CBIAS2, a: [0, 3], b: [1, 3] }    # 8 uF: top (+) to ground, bottom on -55 V
  - { ref: RBIAS1, a: [1, 4], b: [1, 5] }    # 56k bleeder, -55 V -> ground
