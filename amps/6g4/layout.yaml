# Ground bus — the bare rail just below the bottom eyelet row; cathode,
# filter, grid-leak and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 79] }

# Wiring — read from the published 6G4 layout drawing where legible;
# transformer leads carry the drawing's colours. Endpoints reference board
# eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated against the
# basing data), pot lugs, jacks, off-board 2-lead parts and transformer
# leads. Pin numbers: 5881/6L6GC (V7/V8) plate=3, screen=4, grid=5,
# cathode=8, heaters=2/7 (reference/tubes/5881.yaml); GZ34 (V9) plate
# unit1=4, unit2=6, cathode(B+)=8, heater=2 (reference/tubes/gz34.yaml);
# 12AX7 (V1-V5) unit1 plate=6/grid=7/cathode=8, unit2 plate=1/grid=2/
# cathode=3, heaters=4/5 (reference/tubes/12ax7.yaml).
runs:
  # === power transformer -> GZ34 -> reservoir (annotation layer) ==========
  - { from: T1.red1, to: V9.pin4, via: [[1.0, 0.32]] }
  - { from: T1.red2, to: V9.pin6, via: [[2.0, 0.58]] }
  - { from: T1.red-yellow, to: [1.45, 0.2], via: [[-0.3, 0.9]] }
  - { from: V9.pin8, to: C10.a, color: red, via: [[1.4, 2.3], [33.0, 2.3], [33.5, 0.3]] }

  # === BP1 (+456V): 6L6GC plates and screens, PI dropper, OT centre tap ====
  - { from: C10.a, to: RS1.a, color: red, via: [[34.5, -0.55], [2.5, -0.55], [2.5, -0.1]] }
  - { from: RS1.a, to: RD1.a, color: red, via: [[2.6, -0.85], [30.5, -0.85]] }
  - { from: RS1.a, to: RS2.a, color: red, via: [[4.5, -1.2], [13.5, -1.2]] }
  - { from: T2.red, to: C10.a, color: red, via: [[16.4, 0.6], [35.0, 0.6], [34.5, 0.05]] }
  - { from: T2.blue, to: V7.pin3, via: [[15.9, 0.3], [15.4, 2.6], [4.7, 2.6]] }
  - { from: T2.brown, to: V8.pin3, via: [[16.9, 0.3], [16.7, 2.7], [11.4, 2.7]] }
  - { from: T2.green, to: SPK.tip, via: [[16.4, 0.3], [14.86, 1.75]] }
  - { from: SPK.sleeve, to: [1.45, 29.5], via: [[15.14, 2.8], [29.5, 2.8]] }
  - { from: RS1.b, to: V7.pin4, via: [[3.9, 0.9], [4.6, 1.35]] }
  - { from: RS2.b, to: V8.pin4, via: [[13.9, 0.9], [14.6, 1.35]] }

  # === PI supply: RD1 (BP1 -> BC) -> the two plate loads (fan clear of RS2)
  - { from: RD1.b, to: RLPA.a, color: red, via: [[32.5, -0.4], [5.4, -0.4]] }
  - { from: RD1.b, to: RLPB.a, color: red, via: [[32.6, -1.0], [8.4, -1.0]] }

  # === output stage: grids/couplers ==========================================
  # C1.a and RGL1.b share the (row1, col0) eyelet — the coupler and the
  # grid-side end of the bias leak both land on V7's grid — so one wire from
  # that shared point to the tube pin suffices; RGL1.a (the OTHER end, row0)
  # is the NBIAS side, wired separately in the bias-supply section below.
  - { from: C1.a, to: V7.pin5, via: [[0.6, 0.55], [4.3, 0.55], [4.6, 1.4]] }
  - { from: V7.pin8, to: [1.45, 4.2], via: [[4.4, 1.7]] }
  # C2.b and RGL2.b share the (row1, col11) eyelet — same idiom for V8's grid.
  - { from: C2.b, to: V8.pin5, via: [[10.6, 1.0], [10.7, 1.0], [10.4, 1.4]] }
  - { from: V8.pin8, to: [1.45, 10.0], via: [[9.8, 2.2]] }

  # === phase inverter: plates (fanned clear of each other) ===================
  - { from: RLPA.b, to: V5.pin1, via: [[5.4, 1.55], [21.5, 1.55]] }
  - { from: C1.b, to: RLPA.b, via: [[3.0, 0.6], [4.0, 0.75]] }
  - { from: RLPB.b, to: V5.pin6, via: [[8.4, 3.0], [28.5, 3.0], [28.5, -0.3], [26.3, 0.9]] }

  # === phase inverter tail — fanned the same way 6G3's proven RTAIL pattern
  # fans (docs/layout-schema.md) ==============================================
  - { from: RT2.b, to: RGPA.a }
  - { from: RGPA.a, to: RTAIL.a, via: [[23.4, -0.18], [24.6, -0.18]] }
  - { from: RTAIL.a, to: RGPB.a, via: [[25.4, -0.18], [26.6, -0.18]] }
  - { from: RGPA.b, to: V5.pin2, via: [[22.9, 1.60], [21.2, 2.10]] }
  - { from: RGPB.b, to: V5.pin7, via: [[26.4, 1.36], [24.8, 1.36], [24.8, 2.1]] }
  - { from: RTAIL.b, to: V5.pin8, via: [[25.2, 1.74], [24.8, 2.34]] }
  - { from: RTAIL.b, to: V5.pin3, via: [[24.4, 1.50], [21.4, 1.50], [21.4, 1.92]] }
  # Presence/NFB node: RT2.a, RPF.a, RNFB.a and VRPRES's hot lug all join
  # here (row0 eyelets, the "signal-carrying" convention this file uses
  # elsewhere); RPF.b and VRPRES's other lug are the actual ground return
  # (row1, routed to the bus) — RNFB's OWN row1 end instead carries the
  # speaker feed. The earlier draft left this node unterminated (no wire
  # ever reached true ground); fixed here.
  - { from: RT2.a, to: RPF.a, via: [[21.4, -0.20], [19.6, -0.20]] }
  - { from: RPF.a, to: RNFB.a, via: [[19.4, -0.20], [17.6, -0.20]] }
  - { from: RPF.b, to: [1.45, 19] }
  - { from: RNFB.b, to: SPK.tip, via: [[17.4, 1.55], [13.6, 2.15]] }
  - { from: VRPRES.lug1, to: RT2.a, via: [[19.0, -0.60], [19.4, -0.35]] }
  - { from: VRPRES.lug2, to: [1.45, 19.4], via: [[19.65, -0.55], [19.65, 1.2]] }

  # === V2 (channel-1 recovery, V2A) -> mixer -> GPIA =========================
  - { from: RL1D.b, to: V2.pin6, via: [[39.4, 1.6]] }
  - { from: CC1D.b, to: RM1.a }
  - { from: RM1.b, to: V5.pin2, via: [[43.4, -2.1], [22.2, -2.1], [22.2, 1.4]] }
  - { from: V2.pin8, to: CK1D.b, via: [[43.5, 2.35], [45.3, 1.5]] }
  - { from: CK1D.a, to: [1.45, 44.6], via: [[44.6, 1.4]] }
  - { from: RK1D.b, to: [1.45, 46.6] }

  # === V1 (channel-1 input) ===================================================
  - { from: RL1I.b, to: V1.pin1, via: [[50.4, 1.6]] }
  - { from: V1.pin3, to: CK1I.b, via: [[51.5, 2.35], [52.3, 1.5]] }
  - { from: CK1I.a, to: [1.45, 51.6], via: [[51.6, 1.4]] }
  - { from: RK1I.b, to: [1.45, 53.6] }
  - { from: J1.tip, to: V1.pin2, via: [[54.2, -0.4], [51.3, 1.9]] }

  # === V4 (channel-2 recovery) =================================================
  - { from: RL2D.b, to: V4.pin1, via: [[57.4, 1.6]] }
  - { from: CC2D.b, to: RM2.a }
  - { from: RM2.b, to: V5.pin2, via: [[60.6, -2.4], [29.0, -2.4], [21.8, -2.4], [21.8, 1.85]] }
  - { from: V4.pin3, to: CK2D.b, via: [[58.5, 2.35], [63.3, 1.5]] }
  - { from: CK2D.a, to: [1.45, 62.6], via: [[62.6, 1.4]] }
  - { from: RK2D.b, to: [1.45, 64.6] }

  # === V3 (channel-2 input) ====================================================
  - { from: RL2I.b, to: V3.pin1, via: [[68.4, 1.6]] }
  # RL1I.a and RL2I.a both sit on the undrawn BD rail (both channels' input
  # stages print the same +170 V, one shared source per netlist.cir) — tied
  # directly since no discrete dropping-resistor network is drawn for BD
  # (notes.md: not legible at this scan's resolution).
  - { from: RL1I.a, to: RL2I.a, color: red, via: [[49.0, -3.0], [67.0, -3.0]] }
  - { from: V3.pin3, to: CK2I.b, via: [[69.5, 2.35], [72.3, 1.5]] }
  - { from: CK2I.a, to: [1.45, 72.6], via: [[72.6, 1.4]] }
  - { from: RK2I.b, to: [1.45, 73.6] }
  - { from: J2.tip, to: V3.pin2, via: [[71.2, -0.4], [69.3, 1.9]] }

  # === bias supply: an HT leg -> 56k -> rectifier -> 8uF/10k -> -55V =========
  - { from: V9.pin6, to: RBIAS1.a, via: [[2.2, 2.9], [74.4, 2.9]] }
  - { from: RBIAS1.b, to: DBIAS.a, via: [[75.4, -0.3], [76.4, -0.3]] }
  - { from: DBIAS.b, to: CBIAS.a, via: [[77.4, -0.3], [77.6, -0.15]] }
  - { from: CBIAS.a, to: RBIAS2.a, via: [[77.6, -0.05], [78.4, -0.05]] }
  - { from: CBIAS.b, to: [1.45, 77.6], via: [[77.6, 1.5]] }
  # -55V distribution: RBIAS2.b -> RGL1.a -> RGL2.a (daisy chain), the same
  # pattern 6G3's own RG4.a -> RG5.a bias-rail chain uses.
  - { from: RBIAS2.b, to: RGL1.a, color: yellow, via: [[78.4, -1.6], [1.2, -1.6], [1.2, -0.6], [0.4, -0.3]] }
  - { from: RGL1.a, to: RGL2.a, color: yellow, via: [[0.5, -2.0], [11.4, -2.0]] }

  # === 6.3V heater chain (green twisted pair) ================================
  # PT green pair -> pilot lamp -> V7 -> V8 -> V5 -> V2 -> V1 -> V4 -> V3, the
  # conventional daisy order for the sheet's own "TO ALL HEATERS AND PILOT
  # LIGHT" annotation. The GZ34 is off this chain (5V winding).
  - { from: T1.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V7.pin2, style: twisted, via: [[-1.2, 3.6], [4.0, 3.6]] }
  - { from: V7.pin7, to: V8.pin2, style: twisted, via: [[4.4, 3.62], [10.6, 3.62]] }
  - { from: V8.pin7, to: V5.pin4, style: twisted, via: [[11.4, 3.64], [24.9, 3.64]] }
  - { from: V5.pin5, to: V2.pin4, style: twisted, via: [[25.1, 3.66], [43.9, 3.66]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[44.1, 3.68], [50.9, 3.68]] }
  - { from: V1.pin5, to: V4.pin4, style: twisted, via: [[51.1, 3.7], [61.9, 3.7]] }
  - { from: V4.pin5, to: V3.pin4, style: twisted, via: [[62.1, 3.72], [68.9, 3.72]] }
  - { from: V3.pin4, to: V3.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC
# netlist (netlist.cir) for pipeline/verify_layout_nets.py. See
# docs/layout-schema.md.
net_map:
  # The push-pull output transformer: the netlist omits winding DCR, so both
  # 6L6GC plate leads and the primary centre tap collapse onto the reservoir
  # node BP1 (the chart prints +456 V at both). The speaker terminal is the
  # negative-feedback return: the OT secondary is a short at DC, so the
  # 56 kΩ feedback resistor's far end reads as ground.
  #
  # No excluded_tubes entry belongs here. The tremolo oscillator is the
  # SECOND half of V2, whose first half (V2A) is the modelled channel-1
  # recovery stage, so that socket is anchored by V2A and only the
  # oscillator half's own network is unmodelled — it is enumerated in the
  # unchecked-terminal report rather than hidden behind a socket-level
  # exclusion (the identical situation, and the identical call, as 6G3's own
  # driver+oscillator bottle — see amps/6g3/layout.yaml's net_map).
  anchors:
    T2.red:   BP1
    T2.blue:  BP1
    T2.brown: BP1
    SPK.tip:  "0"
  # RT2's far end (netlist: "RT2 JPI 0 6800", straight to ground) is drawn
  # reaching true ground through RPF (1.5k) rather than a direct wire — the
  # published circuit's own foot-resistor-to-ground, per meta.yaml's source
  # note. RPF carries no DC current (a self-bias/NFB node, no grid current
  # flows there), so it is DC-transparent exactly like a grid stopper.
  series_bridge:
    RPF: "1.5k presence/feedback foot resistor — carries no DC current, so the tail/NFB node it bridges to ground reads as ground exactly as netlist.cir's RT2->0 abstraction models it"
  netlist_unplaced:
    RG1I: "1 MΩ channel-1 input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2I: "1 MΩ channel-2 input grid leak — mounted at the input jacks"
    RG1D: "channel-1 recovery-stage grid return, modelled as one grid leak (G1D -> 0); realised through the tone stack and volume pot VRV1 (off-board, no discrete board resistor)"
    RG2D: "channel-2 recovery-stage grid return, modelled as one grid leak (G2D -> 0); realised through the tone stack and volume pot VRV2"
