# Board layout — redrawn from the published Fender 6G4 'Super-Amp' layout
# drawing (A-FJ), page 2 of the same two-page factory sheet the schematic
# comes from (both pages carry matching printed voltages and the same tube
# row: GZ34, 6L6GC, 6L6GC, then five 7025 sockets). Part refs are the shared
# key into bom.yaml; the renderer reads each value and part type from there.
#
# The board reads left->right: the output pair's grid/screen/coupler parts
# and the phase-inverter (V5) plate loads and tail at the left end (nearest
# the GZ34/6L6GC row the drawing itself places there — the same "power
# first, working back to the inputs" order ab763/6g3 use), then V2
# (channel 1's recovery stage, V2A, sharing its bottle with the tremolo
# oscillator, V2B), then V1 (channel 1's input stage), then V4 (channel 2's
# recovery stage), then V3 (channel 2's input stage). Each channel's tone
# network is drawn where the published sheet mounts it: the .05 coupler on
# the board beside the input-stage plate load, and the 250MM treble cap and
# 100K slope at the Treble pot, the .01 and 10K at the Bass pot, the 47MM
# bright cap at the Volume pot — chassis-mounted parts on the panel row,
# wired lug to lug as the sheet draws them. None of them carries a DC node
# the netlist checks (they are enumerated as the unverified control island).
# The tremolo oscillator's own resistor/cap ladder stays an off-board
# annotation — the same convention ab763's layout uses for its reverb/
# tremolo block.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has
# been verified electrically equivalent to the simulated netlist
# (netlist.cir) by pipeline/verify_layout_nets.py — see the net_map block at
# the foot of this file and docs/layout-schema.md. Heaters, the pilot lamp,
# the tremolo oscillator's own network, the tone-stack ladders, and the
# PT/rectifier AC side are an excluded annotation layer (not in
# netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 82
  title: "6G4 · eyelet board layout"

# The heater circuits this drawing establishes against the amplifier's own
# sheet — the 5 V rectifier filament only. The A-FJ sheet draws that winding
# lead by lead (two YELLOW leads from TR1 to the GZ34 socket) but only ARROWS
# the 6.3 V chain, "TO ALL HEATERS AND PILOT LIGHT", so the 6.3 V daisy below
# stays undeclared and the drawing keeps its "not established" markers for it.
heaters:
  - id: h5
    volts: 5.0
    winding: "5 V rectifier-filament secondary — the transformer's yellow pair"
    grounded_leg: none
    source: >-
      A-FJ page 2 (layout) fans TR1's leads to the GZ34 socket, lettering each:
      YELLOW to pin 2, RED to pin 4, RED to pin 6, YELLOW to pin 8, with the
      B+ lead leaving pin 8 beside the second yellow. Page 1 (schematic) draws
      the same winding as a two-terminal secondary landing on the rectifier's
      two heater connections, +456 V taken from the end carrying the cathode.
      The GZ34's cathode is strapped to the heater at pin 8 inside the envelope
      (Mullard letters that pin "h,k"), so the winding floats at B+ and neither
      leg is grounded. Read on the only copy of this sheet in circulation,
      2250 x 1269 px for the layout page — low for the corpus, but the four
      lead landings and their colour letterings are unambiguous at 4x, and the
      schematic page's topology confirms them independently.
    sockets:
      V9: { feed: [2], return: [8] }   # GZ34 — 5 V across the two heater pins, B+ out of 8
caption: "Redrawn from the published Fender 6G4 'Super-Amp' layout drawing (A-FJ), page 2 of the two-page factory sheet — principal board components and their hookup, in the order the drawing shows them: output/phase-inverter parts nearest the GZ34/6L6GC row, then V2 (channel 1's recovery stage, sharing its bottle with the tremolo oscillator V2B), V1 (channel 1 input), V4 (channel 2 recovery), V3 (channel 2 input). Each channel's tone network is drawn where the sheet mounts it — the 0.05 µF coupler on the board beside the input-stage plate load, the 250 pF and 100 kΩ at the Treble pot, the 0.01 µF and 10 kΩ at the Bass pot, the 47 pF bright capacitor at the Volume pot — none of it carrying a DC node the netlist checks. Off the board: the tremolo oscillator's own resistor/cap ladder and its Intensity feed into the bias line (excluded from netlist.cir — see notes.md; the -55 V bias line itself is drawn reaching the two output grid leaks directly), the input grid stoppers and leaks (mounted at the jacks), and the bias-supply group, drawn as the small sub-board the sheet boxes separately. The GZ34's own 5 V filament winding is drawn as the sheet letters it — two yellow transformer leads to the rectifier's heater pins 2 and 8, the B+ leaving pin 8 beside them (the cathode is strapped to the heater inside the envelope). The 6.3 V heater chain (green twisted pair, PT -> pilot lamp -> the two 6L6GCs -> the five 7025s) is drawn in the conventional daisy order and is NOT established: the sheet's own \"TO ALL HEATERS AND PILOT LIGHT\" annotation implies it rather than routing it. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Super-Amp' Layout, Model 6G4 (A-FJ), page 2 of the two-page factory sheet (page 1 is the schematic)"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_6g4_schem.pdf"

parts:
  # --- output stage (V7) + phase-inverter (V5) hot side ---------------------
  - { ref: RGL1, a: [0, 0], b: [1, 0] }       # 220k-5% V7 grid leak (NBIAS -> G61)
  - { ref: C1,   a: [1, 0], b: [1, 3] }       # 0.05uF PI hot plate -> V7 grid
  - { ref: RS1,  a: [0, 2], b: [0, 3] }       # 470R-1W V7 screen stopper (BP1 -> BS1)
  - { ref: RLPA, a: [0, 5], b: [1, 5] }       # 82k-5% hot plate load (BC -> PPIA)
  - { ref: RLPB, a: [0, 8], b: [1, 8] }       # 100k-5% cold plate load (BC -> PPIB)
  - { ref: C2,   a: [1, 8], b: [1, 11] }      # 0.05uF PI cold plate -> V8 grid
  - { ref: RGL2, a: [0, 11], b: [1, 11] }     # 220k-5% V8 grid leak (NBIAS -> G62)
  - { ref: RS2,  a: [0, 13], b: [0, 14] }     # 470R-1W V8 screen stopper (BP1 -> BS2)
  # --- phase-inverter tail (fans exactly as 6G3's proven RTAIL pattern) -----
  - { ref: RNFB, a: [0, 17], b: [1, 17] }     # 10k negative feedback from the OT secondary hot
  - { ref: RPF,  a: [0, 19], b: [1, 19] }     # 1.5k presence/feedback foot resistor
  - { ref: RT2,  a: [0, 21], b: [0, 23] }     # 6.8k tail (NFB node -> junction)
  - { ref: RGPA, a: [0, 23], b: [1, 23] }     # 1M hot grid leak (JPI -> GPIA)
  - { ref: RTAIL, a: [0, 25], b: [1, 25] }    # 820R-5% inverter cathode resistor
  - { ref: RGPB, a: [0, 27], b: [1, 27] }     # 1M cold grid leak (JPI -> GPIB)
  - { ref: RD1,  a: [0, 30], b: [0, 32] }     # 4.7k-1W PI supply dropper (BP1 -> BC)
  - { ref: C10,  a: [0, 34], b: [1, 34] }     # 20uF HT filter (BP1 reservoir)

  # --- V2 bottle: channel-1 recovery stage (V2A) ----------------------------
  # (Cathode R‖C sits in its own column pair, sharing an eyelet with EACH
  # OTHER — not with the plate load, which is a different node — the same
  # pattern ab763's own CKN1/RKN1 pair uses.)
  - { ref: RL1D, a: [0, 38], b: [0, 39] }     # 100k plate load (BE1 -> P1D)
  - { ref: CC1D, a: [0, 39], b: [0, 41] }     # 0.05uF recovery-plate -> mixer coupler (shares P1D eyelet)
  - { ref: RM1,  a: [0, 41], b: [0, 43] }     # 6.8k channel-1 mixing resistor -> GPIA
  - { ref: CK1D, a: [0, 45], b: [0, 46] }     # 25uF recovery-stage cathode bypass
  - { ref: RK1D, a: [0, 46], b: [1, 46] }     # 820R recovery-stage cathode (shares CK1D's far eyelet)

  # --- V1: channel-1 input stage ---------------------------------------------
  - { ref: RL1I, a: [0, 49], b: [0, 50] }     # 100k plate load (BD -> P1I)
  - { ref: CC1T, a: [0, 50], b: [0, 51] }     # 0.05uF plate -> tone network (shares the P1I eyelet)
  - { ref: CK1I, a: [0, 52], b: [0, 53] }     # 25/25uF input-stage cathode bypass
  - { ref: RK1I, a: [0, 53], b: [1, 53] }     # 1.5k input-stage cathode (shares CK1I's far eyelet)

  # --- V4: channel-2 recovery stage ------------------------------------------
  - { ref: RL2D, a: [0, 56], b: [0, 57] }     # 100k plate load (BE2 -> P2D)
  - { ref: CC2D, a: [0, 57], b: [0, 59] }     # 0.05uF recovery-plate -> mixer coupler (shares P2D eyelet)
  - { ref: RM2,  a: [0, 59], b: [0, 61] }     # 220k channel-2 mixing resistor -> GPIA
  - { ref: CK2D, a: [0, 63], b: [0, 64] }     # 25uF recovery-stage cathode bypass
  - { ref: RK2D, a: [0, 64], b: [1, 64] }     # 820R recovery-stage cathode (shares CK2D's far eyelet)

  # --- V3: channel-2 input stage ----------------------------------------------
  - { ref: RL2I, a: [0, 67], b: [0, 68] }     # 100k plate load (BD -> P2I)
  - { ref: CC2T, a: [0, 68], b: [0, 69] }     # 0.05uF plate -> tone network (shares the P2I eyelet)
  - { ref: CK2I, a: [0, 72], b: [0, 73] }     # 25/25uF input-stage cathode bypass
  - { ref: RK2I, a: [0, 73], b: [1, 73] }     # 1.5k input-stage cathode (shares CK2I's far eyelet)

  # --- bias supply (small sub-board, drawn as off-board stubs) --------------
  - { ref: RBIAS1, a: [0, 74], b: [0, 75] }
  # DBIAS is drawn UNBANDED, deliberately: cathode_side() refuses to guess and
  # the only copy of A-FJ in circulation (2250 x 1269 for the layout page,
  # 2179 x 1437 for the schematic) does not resolve which end of the bias
  # rectifier carries the bar. At 5x the symbol reads as a triangle with its
  # bar on the RIGHT, which is the opposite hand from the 6G3's own I-FA box
  # at 750 ppi — the two circuits are otherwise identical, so one reading is
  # wrong and this scan cannot say which. Needs a better copy of A-FJ (or a
  # 6G4-A/K-FJ cross-read) before a polarity is declared here.
  - { ref: DBIAS,  a: [0, 76], b: [0, 77] }
  - { ref: CBIAS,  a: [0, 77], b: [1, 77] }
  - { ref: RBIAS2, a: [0, 78], b: [1, 78] }

offboard:
  # --- chassis iron and the tube row, in the sheet's own left-to-right order
  - { id: T1,  ref: T1, kind: xfmr, edge: left,   at: 0.4, label: "Power trans" }
  - { id: PL1, kind: part, glyph: lamp, edge: left, at: 1.6, label: "Pilot lamp" }
  - { id: V9,  ref: V9, kind: tube, edge: bottom, at: 1.5, label: "V9 · GZ34" }
  - { id: V7,  ref: V7, kind: tube, edge: bottom, at: 4,   label: "V7 · 6L6GC" }
  - { id: V8,  ref: V8, kind: tube, edge: bottom, at: 11,  label: "V8 · 6L6GC" }
  - { id: T2,  ref: T2, kind: xfmr, edge: top,    at: 16,  label: "Output trans" }
  - { id: SPK, kind: jack, edge: bottom, at: 15,  label: "Spkr" }
  - { id: V5,  ref: V5, kind: tube, edge: bottom, at: 25,  label: "V5 · 12AX7 (7025) PI" }
  - { id: VRPRES, ref: VRPRES, kind: pot, edge: top, at: 19, label: "Presence" }
