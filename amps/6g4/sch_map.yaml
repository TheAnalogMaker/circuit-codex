# amps/6g4/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T2.1: BP1                # OT primary, V7 plate end — primary DCR omitted
  T2.2: BP1                # OT primary centre tap
  T2.3: BP1                # OT primary, V8 plate end
  T2.4: "0"                # OT secondary hot — secondary DCR folded into ground;
                           # mirrors layout net_map SPK.tip: '0'.

series_bridge:
  R1a: "68k grid stopper from channel 1's input 1. The A-FJ sheet puts the
    channel's 1 MΩ leak at the input-1 end of this stopper, not at the grid;
    with no DC grid current the stopper drops nothing, so its two ends are
    the one node netlist.cir calls G1I and models as RG1I G1I 0."
  R1b: "68k grid stopper from channel 2's input 1 — the same arrangement, for
    G2I and RG2I."

