  - { ref: R1a, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-1 input grid stopper (jack 1)" }
  - { ref: R2a, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-1 input grid stopper (jack 2)" }
  - { ref: RG1I, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "Channel-1 input grid leak" }
  - { ref: RL1I, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-1 input-stage plate load" }
  - { ref: RK1I, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "Channel-1 input-stage cathode bias" }
  - { ref: CK1I, part: "Dual electrolytic capacitor", value: "25 µF + 25 µF", role: "Channel-1 input-stage cathode bypass (one section of a dual can)" }
  # --- Channel 1 tone stack + volume ---
  - { ref: CT1, part: "Mica capacitor", value: "250 pF", role: "Channel-1 treble cap (250MM on the drawing)" }
  - { ref: VRT1, part: "Potentiometer", value: "250 kΩ-L", role: "Channel-1 treble" }
  - { ref: RS1T, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-1 tone-stack slope resistor" }
  - { ref: VRB1, part: "Potentiometer", value: "250 kΩ-A", role: "Channel-1 bass" }
  - { ref: RSL1, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "Channel-1 tone-stack bleed resistor" }
  - { ref: VRV1, part: "Potentiometer", value: "500 kΩ-L", role: "Channel-1 volume" }
  # --- Channel 1 recovery/2nd stage ---
  - { ref: RL1D, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-1 recovery-stage plate load" }
  - { ref: RK1D, part: "Carbon comp resistor", value: "820 Ω · ½ W", role: "Channel-1 recovery-stage cathode bias" }
  - { ref: CK1D, part: "Dual electrolytic capacitor", value: "25 µF + 25 µF", role: "Channel-1 recovery-stage cathode bypass" }
  - { ref: CC1D, part: "Coupling capacitor", value: "0.05 µF", role: "Channel-1 recovery-stage output coupling into the mixing network" }
  - { ref: RM1, part: "Carbon comp resistor", value: "6.8 kΩ · ½ W", role: "Channel-1 mixing resistor into the phase-inverter grid" }
  # --- Channel 2 input stage (mirrors channel 1) ---
  - { ref: R1b, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-2 input grid stopper (jack 1)" }
  - { ref: R2b, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-2 input grid stopper (jack 2)" }
