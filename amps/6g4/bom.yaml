  - { ref: RS2T, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-2 tone-stack slope resistor" }
  - { ref: VRB2, part: "Potentiometer", value: "250 kΩ-A", role: "Channel-2 bass" }
  - { ref: RSL2, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "Channel-2 tone-stack bleed resistor" }
  - { ref: VRV2, part: "Potentiometer", value: "500 kΩ-L", role: "Channel-2 volume" }
  # --- Channel 2 recovery/2nd stage ---
  - { ref: RL2D, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-2 recovery-stage plate load" }
  - { ref: RK2D, part: "Carbon comp resistor", value: "820 Ω · ½ W", role: "Channel-2 recovery-stage cathode bias" }
  - { ref: CK2D, part: "Dual electrolytic capacitor", value: "25 µF + 25 µF", role: "Channel-2 recovery-stage cathode bypass" }
  - { ref: CC2D, part: "Coupling capacitor", value: "0.05 µF", role: "Channel-2 recovery-stage output coupling into the mixing network" }
