# Parts list — read from the published 6G4 Super-Amp drawing (schematic +
# companion layout). Reference designators follow the DC netlist where a
# part is modeled and are descriptive otherwise. Values are the drawing's;
# the notice sets 1/2 W resistors and 400 V caps unless noted. The drawing's
# five 7025 sockets are drawn far apart across the sheet (channel 1 input and
# recovery stage, channel 2 input and recovery stage, and the phase inverter)
# each carrying its own "7025" label — this list follows the drawing's own
# per-stage grouping. Which physical bottle holds which pair of triode
# sections is set out in the "Tubes" section below: the oscillator shares
# channel 1's recovery-stage bottle (V2A/V2B), and the phase inverter is V5.
notes: "The oscillator's own resistor/cap network (Speed ladder, Intensity feed) is listed but its DC point is excluded from the netlist — see notes.md. The tone-stack and volume-pot networks between the input and recovery stages carry no DC path in this model and are listed for completeness."
items:
