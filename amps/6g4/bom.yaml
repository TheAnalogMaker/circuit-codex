  - { ref: VRSPD, part: "Reverse-audio potentiometer", value: "4 MΩ-RA", role: "Tremolo speed" }
  - { ref: RTO1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Tremolo phase-shift ladder resistor" }
  - { ref: CTO1, part: "Film capacitor", value: "0.01 µF", role: "Tremolo phase-shift cap" }
  - { ref: CTO2, part: "Film capacitor", value: "0.01 µF", role: "Tremolo phase-shift cap" }
  - { ref: RTOFB, part: "Carbon comp resistor", value: "4.7 MΩ · ½ W", role: "Oscillator feedback resistor" }
  - { ref: CTOFB, part: "Film capacitor", value: "0.005 µF", role: "Oscillator feedback cap" }
  - { ref: VRINT, part: "Reverse-audio potentiometer", value: "10 MΩ-RA", role: "Tremolo intensity" }
  - { ref: RINT, part: "Carbon comp resistor", value: "220 kΩ · ½ W", role: "Intensity series resistor into the bias line" }
  # --- Presence / negative feedback ---
  - { ref: VRPRES, part: "Linear potentiometer", value: "5 kΩ-L", role: "Presence" }
  - { ref: RPF, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "Presence/feedback foot resistor to ground" }
  - { ref: RNFB, part: "Carbon comp resistor", value: "56 kΩ · 1 W", role: "Negative feedback, speaker line → PI tail area (DC-neutral)" }
  # --- Phase inverter (7025 LTP) ---
  - { ref: RD1, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "PI supply dropper, BP1 → BC" }
  - { ref: RLPA, part: "Carbon comp resistor", value: "82 kΩ · ½ W · 5%", role: "PI plate load (hot side)" }
  - { ref: RLPB, part: "Carbon comp resistor", value: "100 kΩ · ½ W · 5%", role: "PI plate load (cold side)" }
  - { ref: RGPA, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "PI grid leak (hot), returned to the tail junction" }
  - { ref: RGPB, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "PI grid leak (cold), returned to the tail junction" }
  - { ref: RTAIL, part: "Carbon comp resistor", value: "820 Ω · ½ W · 5%", role: "PI shared cathode resistor" }
  - { ref: RT2, part: "Carbon comp resistor", value: "6.8 kΩ · ½ W · 5%", role: "PI tail (junction → ground/NFB foot)" }
  - { ref: C1, part: "Coupling capacitor", value: "0.05 µF · 400 V", role: "PI hot plate → V7 grid" }
  - { ref: C2, part: "Coupling capacitor", value: "0.05 µF · 400 V", role: "PI cold plate → V8 grid" }
  # --- Output stage (6L6GC pair) ---
  - { ref: RGL1, part: "Carbon comp resistor", value: "220 kΩ · ½ W · 5%", role: "V7 grid leak, from the -55 V bias line" }
  - { ref: RGL2, part: "Carbon comp resistor", value: "220 kΩ · ½ W · 5%", role: "V8 grid leak, from the -55 V bias line" }
  - { ref: RS1, part: "Wirewound resistor", value: "470 Ω · 1 W", role: "V7 screen resistor" }
  - { ref: RS2, part: "Wirewound resistor", value: "470 Ω · 1 W", role: "V8 screen resistor" }
  - { ref: T2, part: "Output transformer", value: "Fender 45216", role: "Push-pull 6L6GC output" }
  # --- Power supply ---
  - { ref: T1, part: "Power transformer", value: "Fender 8087", role: "HT + heaters + rectifier filament" }
  - { ref: CH1, part: "Filter choke", value: "Fender 125C1A", role: "Reservoir → screen/preamp rail" }
  - { ref: C10, part: "Electrolytic capacitor", value: "20 µF · 600 V", role: "HT filter, lettered 20-600 on the drawing and repeated at several rail nodes (the per-node count is not resolved at this scan's resolution)" }
  # --- Bias supply ---
  - { ref: DBIAS, part: "Rectifier (bias)", value: "silicon diode", role: "Bias-supply rectifier" }
  - { ref: RBIAS1, part: "Carbon comp resistor", value: "56 kΩ · ½ W", role: "Bias-supply series resistor" }
  - { ref: RBIAS2, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "Bias-supply series resistor" }
  - { ref: CBIAS, part: "Electrolytic capacitor", value: "8 µF · 150 V", role: "Bias-supply filter" }
  # --- Tubes ---
  # The published layout page shows exactly FIVE 7025 sockets, matching
  # meta.yaml's 5x 12AX7 tube count. The oscillator therefore cannot have a
  # bottle of its own: it is drawn here as the second section of V2
  # (V2A = channel-1 recovery, V2B = oscillator), the same "driver + tremolo
  # share a bottle" pairing 6G3 uses (amps/6g3/bom.yaml); which of the two
  # channels' recovery stages shares with the oscillator is not separately
  # legible at this scan's resolution, so channel 1 is an editorial choice,
  # not a read fact. The phase inverter is renumbered V6 -> V5 to close the
  # gap this leaves (V1..V5 = the five physical 7025 bottles). Also corrected
  # here and in voltages.yaml: the 6L6GC grid/screen roles above (C1/C2/
  # RGL1/RGL2/RS1/RS2) previously cited "V6"/"V7" for the output pair, an
  # off-by-one left over from an earlier numbering draft — the output pair is
  # V7 (hot)/V8 (cold) per this table, matching netlist.cir's XV7/XV8.
  - { ref: V1, part: "Preamp tube", value: "12AX7 (7025)", role: "Channel-1 input stage" }
  - { ref: V2, part: "Preamp tube", value: "12AX7 (7025)", role: "Channel-1 recovery/2nd stage (V2A) + tremolo oscillator (V2B) — shared bottle, see note above" }
  - { ref: V3, part: "Preamp tube", value: "12AX7 (7025)", role: "Channel-2 input stage" }
  - { ref: V4, part: "Preamp tube", value: "12AX7 (7025)", role: "Channel-2 recovery/2nd stage" }
  - { ref: V5, part: "Preamp/driver tube", value: "12AX7 (7025)", role: "Long-tailed-pair phase inverter (renumbered from V6, see note above)" }
  - { ref: V7, part: "Power tube", value: "6L6GC", role: "Push-pull output (hot side)" }
  - { ref: V8, part: "Power tube", value: "6L6GC", role: "Push-pull output (cold side)" }
  - { ref: V9, part: "Rectifier tube", value: "GZ34", role: "Full-wave rectifier (V9A/V9B)" }
