# Parts list — read from the published 6G4 Super-Amp drawing (schematic +
# companion layout). Reference designators follow the DC netlist where a
# part is modeled and are descriptive otherwise. Values are the drawing's;
# the notice sets 1/2 W resistors and 400 V caps unless noted. Bottles, from
# the layout page's socket row and the voltages printed at each pin: V1 =
# both channels' first stages (cathodes joined), V2 = both channels' second
# stages (cathodes joined), V3 = the vibrato oscillator (pins 1-3) and its
# phase splitter (pins 6-8), V4 = the vibrato pair, V5 = the phase inverter;
# V7/V8 the 6L6GC pair, V9 the GZ34.
notes: "The drawing prints no channel names; channel 1 is the one drawn at the top of the schematic, whose controls sit beside Speed and Intensity on the panel, and it is the only channel that passes through the vibrato and the only one with a bright capacitor. The oscillator's own network (the ladder, the Speed and Intensity controls, the 4.7 MΩ feed and its smoothing capacitors) is listed in full, but the oscillator is excluded from the DC model: a running phase-shift oscillator has no static operating point. The splitter and the vibrato pair are modelled."
items:
  # --- Channel 1 inputs and first stage (V1A) ---
  - { ref: R1a, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-1 grid stopper from input 1" }
  - { ref: R2a, part: "Carbon comp resistor", value: "68 kΩ · ½ W", role: "Channel-1 grid stopper from input 2" }
  - { ref: RG1I, part: "Carbon comp resistor", value: "1 MΩ · ½ W", role: "Channel-1 leak at input 1, to ground (mounted at the jack)" }
  - { ref: RL1I, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1A plate load, off rail A" }
  # --- Channel 1 tone stack + volume (the drawing mounts these at the pots) ---
  - { ref: CC1T, part: "Coupling capacitor", value: "0.05 µF", role: "Channel-1 first-stage plate into the tone network — the stack's coupling capacitor, lettered .05 on the drawing and mounted on the board beside the plate load" }
  - { ref: CT1, part: "Mica capacitor", value: "250 pF", role: "Channel-1 treble cap (250MM on the drawing), stack input to the Treble pot's hot lug; mounts at the Treble pot" }
  - { ref: VRT1, part: "Potentiometer", value: "250 kΩ-L", role: "Channel-1 treble — hot lug on the 250 pF, cold lug on the slope foot, wiper to the Volume pot" }
  - { ref: RS1T, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-1 tone-stack slope resistor, stack input to the slope foot; mounts at the Treble pot" }
  - { ref: VRB1, part: "Potentiometer", value: "250 kΩ-A", role: "Channel-1 bass — a divider from the slope foot to ground: the 0.01 µF across its upper section (hot lug to wiper), the 10 kΩ foot across its lower (wiper to ground)" }
  - { ref: CB1T, part: "Film capacitor", value: "0.01 µF", role: "Channel-1 bass capacitor, slope foot to the Bass pot's wiper; mounts at the Bass pot" }
  - { ref: RSL1, part: "Carbon comp resistor", value: "10 kΩ · ½ W", role: "Channel-1 bass foot resistor, the Bass pot's wiper to ground; mounts at the Bass pot" }
