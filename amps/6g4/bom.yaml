  - { ref: RL2I, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "Channel-2 input-stage plate load" }
  - { ref: RK2I, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "Channel-2 input-stage cathode bias" }
  - { ref: CK2I, part: "Dual electrolytic capacitor", value: "25 µF + 25 µF", role: "Channel-2 input-stage cathode bypass" }
  # --- Channel 2 tone stack + volume ---
  - { ref: CT2, part: "Mica capacitor", value: "250 pF", role: "Channel-2 treble cap" }
