sources:
  - desc: "Fender 'Super-Amp' Schematic, Model 6G4 (A-FJ) — two-page factory sheet: schematic + companion layout, both carrying the same printed voltages, the schematic page native 2179x1437 px and the layout page 2250x1269 px (the PDF embeds them at 72 ppi, so they are the full resolution of this copy). Title block reads 'FENDER \"SUPER-AMP\" SCHEMATIC / MODEL 6G4 / A-FJ'; the companion page 'FENDER \"SUPER-AMP\" LAYOUT / MODEL 6G4 / A-FJ'. Complement read from the drawing: 5x 7025 (a 12AX7 alias — see the 12AX7 reference page), 2x 6L6GC, GZ34 — matching the layout page's tube row (GZ34, 6L6GC, 6L6GC, 7025 x5) exactly, distinguishing this drawing from the later 6G4-A revision (2x 5881, 2x 12AX7 + 3x 7025, K-FJ), also archived at the same source and cross-read to disambiguate the two. The pin voltages lettered at each socket place every section: V1 carries both channels' first stages (+170 V plates, cathodes joined at +1.4 V); V2 both second stages (+160 V at pin 1, +120 V at pin 6, cathodes joined at +1.1 V); V3 the vibrato oscillator (+130 V plate at pin 1, +1.3 V cathode) and its phase splitter (+180 V plate at pin 6, +1.5 V cathode); V4 the vibrato pair (+320 V at pins 1 and 6, cathodes joined at +3.3 V); V5 the phase inverter (+315 V at pin 1, +310 V at pin 6, cathodes +23 V). Ten triode sections, all drawn. Channels: each has two inputs on 68 kOhm stoppers with a 1 Megohm leak at input 1, a first stage (100 kOhm plate), a .05 uF coupler into a Bass/Treble network (100 kOhm slope, 250 uuF treble capacitor into a 250 kOhm-L Treble pot whose cold lug sits on the slope foot, a 250 kOhm-A Bass pot wired as a divider from the slope foot to ground with .01 uF across its upper section and 10 kOhm across its lower) and a 500 kOhm-L Volume pot, then a second stage. Channel 1 (drawn on top) alone carries a 47 uuF bright capacitor from its Volume's hot lug to the wiper; its second stage loads its plate with 100 kOhm and then a 6800 Ohm decoupling resistor to rail A, and takes its output from their junction through .05 uF into the vibrato. Channel 2's second stage is a single 220 kOhm load, its output .05 uF and 1 Megohm into the node where the vibrato recombines. Harmonic vibrato: channel 1's output feeds a low-pass branch (470 kOhm, .005 to ground, .01 to one grid of V4) and a high-pass branch (220 kOhm / 220 kOhm to ground, 250 uuF to the other grid); V4's sections have 100 kOhm plate loads, a shared 4700 Ohm cathode resistor bypassed by 2-25, and their plates recombine through 470 kOhm each. The oscillator is a three-section phase-shift ladder (.02, .01, .01; Speed 4M-RA with 100 kOhm to ground on the first node, 1 Megohm to the cathode and the vibrato-pedal jack on the second, 1 Megohm grid leak), with a 470 kOhm plate load, 4700 / 25-25 cathode and .03 from plate to ground; its output runs through 4.7 Megohm and .005 onto .1-200 and the 10M-L Intensity control, whose wiper (.05-200 to ground) feeds one vibrato grid through 1 Megohm. The splitter's grid is the node both vibrato grids return to through 1 Megohm each; it carries a 1 Megohm leak and .05-200 to ground and .001 from its plate, its plate a 100 kOhm load, .25 to ground and .05 plus 1 Megohm to the other vibrato grid; cathode 1500 / 25-25. Phase inverter: .001 input coupler, 47 uuF across the plates, 82 kOhm / 100 kOhm 5% plate loads, 820 Ohm shared cathode into a 6.8 kOhm tail, both grids on 1 Megohm leaks; the tail foot carries a 1500 Ohm resistor to ground, the .1-200 that grounds the cold grid for signal, a 10 kOhm negative-feedback resistor back to the output transformer's secondary hot, and the 5 kOhm-linear Presence pot (drawn as a rheostat) in series with a 0.1 uF capacitor. The Presence capacitor's rating is read from the companion LAYOUT page, which letters it .1-200 beside the 5K-L pot. Output: two 6L6GC, 220 kOhm 5% grid leaks off a -55 V bias line, 470 Ohm screen stoppers, grounded cathodes, plates printed +456 V. Rails: the GZ34 into two 20-600 reservoir cans, the standby switch, the choke, +458 V after it (the screens, and every dropper); from there 4700 Ohm 1W to +430 V (the inverter's plate loads), then 56 kOhm 1W to +260 V (rail A: all four channel plate loads); and a separate 56 kOhm 1W to +350 V (the vibrato pair), then a further 56 kOhm 1W to +275 V (the oscillator and splitter), each node on its own 20-600 can. The +350 V, +275 V and +260 V figures and the +23 V inverter cathode are lettered on the layout page only. Bias: a bias-tap rectifier, 8-150, 10k, then 8-150 with a 56k bleeder, -55 V. Notice: 'VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER, VALUES SHOWN + OR -' (the layout page states the drawing's usual '+/- 20%'); resistors 1/2 W if not specified, condensers at least 400 V if not specified. Transformers/choke boxed on the schematic: TR1-8087 (power), TR2-45216 (output), CH-125C1A (choke). Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_6g4_schem.pdf"
