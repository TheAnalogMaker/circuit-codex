verification:
  status: draft   # Every rail is derived through a resistor the drawing
                  # letters — only the +460 V and +458 V rails either side
                  # of the choke and the -55 V bias line are driven — and every printed stage voltage is
                  # compared with the model. What keeps this entry draft: the
                  # vibrato oscillator is excluded (it has no static point),
                  # so the +275 V supply it shares with the splitter
                  # simulates about 9% high by the oscillator's own draw; the
                  # +350 V, +275 V, +260 V and +23 V figures are lettered on
                  # the layout page only, of the one scan every archive
                  # mirrors; and `verified` is granted by the maintainer's
                  # review, never by an agent.
