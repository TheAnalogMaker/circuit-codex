sources:
  - desc: "Fender, \"Super-Amp\" Schematic, Model 6G4 (drawing code A-FJ), a two-page factory sheet: the schematic and its companion \"Super-Amp\" Layout, Model 6G4 (same code), both carrying the same printed voltages. Supplies the tube complement, every component value, the printed voltages and the transformer and choke part numbers (TR1-8087 power, TR2-45216 output, CH-125C1A choke). The complement read from the drawing (five 7025, a 12AX7 equivalent; two 6L6GC; a GZ34) matches the layout page's tube row exactly. That separates this drawing from the later 6G4-A revision (two 5881, two 12AX7 and three 7025, code K-FJ), which is archived at the same source and was read alongside it to tell the two apart. The +350 V, +275 V and +260 V rails and the +23 V inverter cathode are lettered on the layout page only, and the Presence capacitor's rating (\".1-200\") is read from the layout page. The sheet's notice reads \"VOLTAGES READ TO GROUND WITH ELECTRONIC VOLTMETER, VALUES SHOWN + OR -\" (the layout page gives the usual \"+/- 20%\"); resistors are ½ W and capacitors at least 400 V unless marked. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_6g4_schem.pdf"
  - desc: "Fender, \"Super-Amp\" Schematic, Model 6G4-A (drawing code K-FJ), the next production revision (two 5881 output tubes; a 12AX7, 12AX7 and three 7025 in the preamp). Used only as a cross-reference, to confirm that the 6G4 on this page is the earlier revision with 6L6GC and all-7025 tubes, and to tell apart two drawings with near-identical titles and layouts. No 6G4 component value comes from it."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_super_6g4a.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Brownface Super\". Supplies the 6G4 (two 6L6GC) and 6G4-A (two 5881) production window, 1960–1963; the 40 W factory rating; the GZ34 rectifier; fixed, non-adjustable bias; vibrato; a two-channel panel with presence; and twin 10-inch speakers. It is also the era and power citation for the Super family page."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-super"
verification:
  status: draft   # Every rail is derived through a resistor the drawing
                  # letters — only the +460 V and +458 V rails either side
                  # of the choke and the -55 V bias line are driven — and every printed stage voltage is
                  # compared with the model. What keeps this entry draft: the
                  # vibrato oscillator is excluded (it has no static point),
                  # so the +275 V supply it shares with the splitter
                  # simulates about 9% high by the oscillator's own draw; the
                  # +350 V, +275 V, +260 V and +23 V figures are lettered on
                  # the layout page only, of the one scan every archive
                  # mirrors; and `verified` is granted by the maintainer's
                  # review, never by an agent.
