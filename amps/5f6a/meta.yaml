# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5f6a"
name_style: "Tweed Bassman-style"
family: tweed
era:
  start: 1958
  end: 1960
wattage: 40
tubes: [12AY7, 12AX7, 12AX7, 5881, 5881, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: cathode-follower-fmv
lineage:
  derived_from: ["5f6"]   # the 5F6 is the direct ancestor; the 5F6-A revised it
  influenced: ["jtm45"]   # Marshall's JTM45 is the KT66 copy of this circuit
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Bassman\" Model 5F6-A schematic (drawing code I-EG). Supplies every component value, the printed voltage chart and the transformer and choke part numbers (power transformer 8087, 325-0-325 V; choke 14684; output transformer 45249). The sheet draws the same tone-stack ladder as the 5F6. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6a.pdf"
  - desc: "Rob Robinette, 5F6A modifications page. A cross-reference. Its \"6.8k stock PI tail\" figure is contradicted by the I-EG drawing, which prints 10 kΩ."
    url: "https://robrobinette.com/5F6A_Modifications.htm"
  - desc: "Fender, \"Bassman\" 5F6-A layout drawing (drawing code I-EG), page 1. Supplies the order of parts on the eyelet board and the wiring: which eyelet each lead leaves and where it lands on the sockets, pots, jacks and transformers. It also gives the marked lead colours: power transformer red, red-yellow and yellow for the HT winding and rectifier filament, red-blue for the bias; output transformer blue and brown to the plates, red centre tap, black and green secondary. The power transformer's primary (black) and 6.3 V heater (green) leads run on the chassis only and are not drawn. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6a.pdf"
verification:
  status: verified
  date: 2026-07-18
  max_deviation_pct: 9.8   # 12AY7 plates vs printed chart (convention is +/-20%); the tail's two printed figures are disputed, not gated
