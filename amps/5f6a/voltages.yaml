# Printed voltage chart read directly from the published 5F6-A (I-EG) drawing
# (2026-07-18). Fender's printed convention: values ±20%, electronic voltmeter.
# Rails get 8% (choke DCR is estimated); tube pins 20%.
#
# Two printed values are disputed: the phase-inverter cathode and tail-junction
# figures fit a 10 kΩ tail returned straight to ground, which is not what the
# drawing shows. See the notes on KPI and JPI for the arithmetic.
source: "Fender 5F6-A (I-EG) drawing, printed voltages: rails +432/+430/+385/+325, bias -48; pins 12AY7 +150/+2.5, V2A +180/+1.2? (printed near cathode), CF +180, PI plates +235/+230, PI cathodes +34, tail junction +32.5"
nodes:
  BP2:  { chart: 430, tol_pct: 8, note: "screens node after choke (DCR estimated at 130 Ω)" }
  BP3:  { chart: 385, tol_pct: 8, note: "PI supply node after 4.7 kΩ" }
  BP4:  { chart: 325, tol_pct: 8, note: "preamp node after the 10 kΩ dropper" }
  PAY1: { chart: 150, tol_pct: 20, note: "12AY7 plate, printed pin value" }
  PAY2: { chart: 150, tol_pct: 20, note: "12AY7 plate (normal channel)" }
  KAY:  { chart: 2.5, tol_pct: 20, note: "shared 12AY7 cathode, 820 Ω" }
  P2A:  { chart: 180, tol_pct: 20, note: "V2A plate = CF grid (direct-coupled)" }
  KCF:  { chart: 180, tol_pct: 20, note: "cathode follower output, printed +180" }
  PPIA: { chart: 235, tol_pct: 20, note: "PI plate, 82k 5% side" }
  PPIB: { chart: 230, tol_pct: 20, note: "PI plate, 100k 5% side" }
  KPI:
    chart: 34
    tol_pct: 20
    disputed: true
    dispute_note: "The printed tail figures fit a tail the drawing does not show. The printed plates (+235 V through 82 kΩ and +230 V through 100 kΩ, both off +385 V) carry 1.83 + 1.55 = 3.38 mA, and 3.38 mA through a 10 kΩ returned straight to ground is 33.8 V at the junction and 35.4 V at these cathodes — the printed +32.5 V and +34 V. But the I-EG schematic and layout both land that 10 kΩ on a node of its own, returned to ground through the 27 kΩ feedback resistor and the 5 kΩ presence pot's track in parallel (4.2 kΩ); at the same 3.38 mA that puts the junction at 48.0 V and these cathodes at 49.6 V. The chart is also, figure for figure, the one the 5F6 (F-EG) prints — rails, bias, every pin, down to the +22/+23 V grids — and the 5F6's 10 kΩ does return to ground. Simulation follows the drawn tail."
  JPI:
    chart: 32.5
    tol_pct: 20
    disputed: true
    dispute_note: "The other half of the same contradiction — see KPI. The printed plates' 3.38 mA through the 10 kΩ alone gives 33.8 V, which fits the printed +32.5 V only if the 10 kΩ returns to ground; through the drawn foot (27 kΩ ∥ 5 kΩ = 4.2 kΩ) the same current puts the junction at 48.0 V."
  PRES: { chart: null, note: "informational — the tail's foot, where the 10 kΩ, the 27 kΩ feedback resistor, the presence pot's track and the V3B grid's 0.1 µF meet; the drawing prints no figure here" }
  S51:  { chart: null, note: "informational — 5881 screen after 470 Ω" }
  G51:  { chart: -48, tol_pct: 8, note: "fixed bias via 220k from the -48 V supply" }
