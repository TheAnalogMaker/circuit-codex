# Board layout — redrawn from the published Fender 'Bassman' 5F6-A layout
# drawing (I-EG). Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them, with a
# lead-by-lead wiring layer — never a trace or a dimensioned reproduction.
#
# This is a big board: the diagram reads left→right — bias/power supply and the
# fixed-bias 5881 output support at the left, the long-tailed-pair phase
# inverter and cathode-follower tone stack in the centre, the 12AX7 driver and
# 12AY7 input pair at the right — matching the tube row on the drawing
# (GZ34 · 5881 · 5881 · 12AX7 · 12AX7 · 12AY7).
board:
  rows: 2
  cols: 43
  title: "5F6-A · eyelet board layout"
caption: "Redrawn from the published Fender 5F6-A layout drawing (I-EG) — principal board components and their hookup, in the order the drawing shows them. The tone-stack capacitors mount on the board, as the factory sheet places them — the two 0.02 µF caps sharing their node-B eyelet with the 56 kΩ slope's lead and the 250 pF mica beside them — and the bias supply’s second 8 µF can (C15b, on the rectifier side of the 15 kΩ) is a chassis part and is not drawn; the pots are wired as the sheet draws: the bass pot a rheostat with its wiper strapped into the treble-lug node, the middle pot's wiper fed from the second 0.02 µF, the treble wiper alone carrying the output. The four-jack input network's 68 kΩ grid stoppers and the cathode-follower's 100 kΩ load are drawn schematically or omitted for legibility; the 1 MΩ input grid leaks (RG1 bright, RG2 normal) are placed at their input jacks. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 5881 outputs → the two 12AX7s → 12AY7 input) is routed as the published sheet shows it, with the green-yellow winding centre tap grounded at the chassis; the GZ34 rectifier is directly heated from the 5 V winding and off the 6.3 V chain. The power-transformer primary leads land on chassis switches, off the board. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Bassman' Model 5F6-A layout drawing (I-EG), page 1"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_5f6a.pdf"

# Wiring proven electrically equivalent to the verified netlist by
# pipeline/verify_layout_nets.py (see the net_map block at the foot of this file).
# Re-earned 2026-07-19 under the HARDENED gate: all six preamp/PI sections and
# both 5881 outputs anchor by basing (0 UNANCHORED), the PI-plate→output-grid
# couplers (C8/C9) are checked as real parts (so a crossed-output or
# coupler-to-wrong-grid fault fails), and the twisted heater runs are validated.
wiring_claim: verified

parts:
  # bias supply + main filter cans + rail droppers (power end, left)
  - { ref: C15,  a: [0, 0],  b: [0, 2] }    # 8 µF bias-supply filter, −48 V line (the second
                                            # can, C15b, sits on the chassis and is not drawn)
  - { ref: RB1,  a: [1, 0],  b: [1, 1] }    # 15k bias series (from selenium rect)
  - { ref: RB2,  a: [1, 2],  b: [1, 3] }    # 56k bias bleeder
  - { ref: C11,  a: [0, 3],  b: [0, 5] }    # 20 µF filter, B+1 (plates)
  - { ref: C12,  a: [0, 6],  b: [0, 8] }    # 20 µF filter, B+2 (screens)
  - { ref: C13,  a: [0, 9],  b: [0, 11] }   # 20 µF filter, B+3 (PI)
  - { ref: C14,  a: [0, 12], b: [0, 14] }   # 8 µF filter, B+4 (preamp)
  - { ref: RD1,  a: [1, 4],  b: [1, 5] }    # 4.7k dropper B+2→B+3
  - { ref: RD2,  a: [1, 6],  b: [1, 7] }    # 10k dropper B+3→B+4
  # 5881 output: grid leaks (from −48 V) + 470 Ω 1W screen resistors
  - { ref: RGL1, a: [1, 8],  b: [1, 9] }    # 220k V4 grid leak
  - { ref: RS1,  a: [1, 10], b: [1, 11] }   # 470 Ω 1W V4 screen
  - { ref: RGL2, a: [1, 12], b: [1, 13] }   # 220k V5 grid leak
  - { ref: RS2,  a: [1, 14], b: [1, 15] }   # 470 Ω 1W V5 screen
  # PI → 5881 grid couplers
  - { ref: C8,   a: [0, 16], b: [0, 18] }   # 0.1 µF PI plate (V3A) → V4 grid
  - { ref: C9,   a: [0, 19], b: [0, 21] }   # 0.1 µF PI plate (V3B) → V5 grid
  # long-tailed-pair phase inverter (82k / 100k 5% plates, 470 Ω + 10k tail)
  - { ref: RLA,  a: [1, 16], b: [1, 17] }   # 82k PI plate load (V3A)
  - { ref: RLB,  a: [1, 18], b: [1, 19] }   # 100k PI plate load (V3B)
  - { ref: RGA,  a: [1, 20], b: [1, 21] }   # 1M PI grid leak (V3A) → tail junction
  - { ref: RGB,  a: [1, 22], b: [1, 23] }   # 1M PI grid leak (V3B) → tail junction
  - { ref: RTAIL, a: [0, 24], b: [1, 24] }  # 470 Ω PI tail (vertical)
  - { ref: RT2,  a: [1, 25], b: [1, 26] }   # 10k tail junction → ground
  # cathode-follower FMV tone stack (slope + caps on the board, per the sheet)
  - { ref: C6,   a: [0, 25], b: [0, 27] }   # 0.02 µF treble wiper → PI grid
  - { ref: RSL,  a: [1, 27], b: [1, 28] }   # 56k tone-stack slope
  - { ref: C5,   a: [0, 28], b: [0, 29] }   # 0.02 µF node B → treble-bottom/bass node
  - { ref: C5b,  a: [0, 30], b: [0, 29] }   # 0.02 µF node B → middle wiper (shares the node-B eyelet with C5)
  - { ref: C4,   a: [0, 31], b: [0, 32] }   # 250 pF mica, node A → treble top
  # channel mixers into V2A grid
  - { ref: RM1,  a: [1, 29], b: [1, 30] }   # 270k bright-channel mixer
  - { ref: RM2,  a: [1, 31], b: [1, 32] }   # 270k normal-channel mixer
  # V2 driver / cathode follower
  - { ref: RK2,  a: [0, 33], b: [1, 33] }   # 820 Ω V2A cathode (vertical)
  - { ref: RL3,  a: [1, 34], b: [1, 35] }   # 100k V2A plate load
  # V1 12AY7 input pair (right end)
  - { ref: C1,   a: [0, 34], b: [0, 36] }   # 0.02 µF V1A → bright volume
  - { ref: RL1,  a: [1, 36], b: [1, 37] }   # 100k V1A plate load
  - { ref: C2,   a: [0, 37], b: [0, 39] }   # 0.02 µF V1B → normal volume
  - { ref: RL2,  a: [1, 38], b: [1, 39] }   # 100k V1B plate load
  - { ref: RK1,  a: [0, 40], b: [1, 40] }   # 820 Ω shared 12AY7 cathode (vertical)
  - { ref: C3,   a: [0, 41], b: [0, 42] }   # 250 µF 12AY7 cathode bypass

offboard:
  - { id: PT,   kind: xfmr, edge: left,  at: 0.2, label: "Power trans" }
  - { id: L1,   ref: L1, kind: choke, edge: left, at: 1.4, label: "Choke" }
  - { id: PL1,  kind: part, glyph: lamp, edge: left, at: 2.5, label: "Pilot lamp" }
  - { id: V6,   ref: V6, kind: tube, edge: bottom, at: 2.5,  label: "V6 · GZ34" }
  - { id: V4,   ref: V4, kind: tube, edge: bottom, at: 6.5,  label: "V4 · 5881" }
  - { id: V5,   ref: V5, kind: tube, edge: bottom, at: 10.5, label: "V5 · 5881" }
  - { id: SPK,  kind: jack, edge: bottom, at: 15, label: "Spkr jacks" }
  # 27 kΩ negative-feedback resistor (annotation only — no board designator):
  # taps the speaker/OT-secondary node and returns to the phase-inverter tail
  # foot. Drawn as a discrete 2-lead off-board part so the wiring reads true — a
  # bare wire here would falsely short the speaker node to the tail junction.
  - { id: RNF, ref: RNF, kind: part, edge: bottom, at: 18.5, label: "NFB" }
  - { id: V3,   ref: V3, kind: tube, edge: bottom, at: 20,   label: "V3 · 12AX7 (PI)" }
  - { id: V2,   ref: V2, kind: tube, edge: bottom, at: 31,   label: "V2 · 12AX7" }
  - { id: V1,   ref: V1, kind: tube, edge: bottom, at: 38,   label: "V1 · 12AY7" }
  - { id: VR6,  ref: VR6, kind: pot, edge: top, at: 4,  label: "Presence" }
  - { id: C16,  ref: C16, kind: part, edge: top, at: 6.4, label: "C16" }
  - { id: VR5,  ref: VR5, kind: pot, edge: top, at: 8,  label: "Middle" }
  - { id: VR4,  ref: VR4, kind: pot, edge: top, at: 12, label: "Bass" }
  - { id: VR3,  ref: VR3, kind: pot, edge: top, at: 16, label: "Treble" }
  - { id: VR1,  ref: VR1, kind: pot, edge: top, at: 23, label: "Vol · bright" }
  - { id: VR2,  ref: VR2, kind: pot, edge: top, at: 28, label: "Vol · normal" }
  - { id: JB,   kind: jack, edge: top, at: 34, label: "Bright in" }
  - { id: JN,   kind: jack, edge: top, at: 40, label: "Normal in" }
  # 1 MΩ input grid leaks (RG1 bright, RG2 normal) are chassis-mounted at the
  # input jacks per the drawing — generic 2-lead off-board parts wired grid → gnd.
  - { id: RG1,  ref: RG1, kind: part, edge: top, at: 35.6, label: "RG1" }
  - { id: RG2,  ref: RG2, kind: part, edge: top, at: 41.0, label: "RG2" }
  - { id: T3,   ref: T3, kind: xfmr, edge: right, at: 0.5, label: "Output trans" }

# Ground bus — the bare tinned rail running the length of the board just below
# the bottom eyelet row; the filter, cathode, bias-bleeder, and pot grounds all
# tie to it.
bus:
  - { from: [1.45, -0.4], to: [1.45, 42.4] }

# Wiring — read lead-by-lead from the published 5F6-A layout drawing (I-EG). The
# transformer leads carry the colours marked on that drawing. The 6.3 V heater
# winding is the green pair; it feeds the pilot lamp and daisy-chains socket to
# socket (rendered as a green twisted pair, style: twisted), with the green-yellow
# winding centre tap grounded at the chassis as the sheet marks it. The PT primary
# (black) leads land on chassis switches, not the board, so they are not drawn.
# Endpoints reference board eyelets (REF.a/REF.b), tube socket pins (Vn.pinN,
# validated against reference/tubes basing — heater pins on the twisted runs),
# pot lugs (VRn.lugN), jacks, off-board 2-lead parts (RG1.a/RG1.b, PL1.a/PL1.b),
# choke/transformer leads (by colour). `via` waypoints are [col, row]; row<0
# routes above the board, row>1 below it.
runs:
  # --- power transformer secondary → GZ34 rectifier (marked colours) ----------
  # The eight PT pigtails stack only ~6 px apart, so the leads spread into a
  # peacock fan at a fan-out column (rows well separated, monotonic in target
  # height) before each drops to its pin/node — no two read as one wire and no
  # descent grazes the tip stacked below it.
  - { from: PT.red-blue, to: RB1.a, via: [[-0.5, -0.25], [0, 0.55]] }
  - { from: PT.red-yellow, to: [1.45, 2], via: [[-0.5, -0.05], [1.9, 1.1]] }
  - { from: PT.red1, to: V6.pin4, via: [[-0.3, 0.2], [2.25, 1.35]] }
  - { from: PT.red2, to: V6.pin6, via: [[-0.3, 0.46], [3.25, 1.15]] }
  - { from: PT.yellow1, to: V6.pin2, via: [[-1.513, 0.23], [-0.287, 0.74], [1.777, 1.694]] }
  - { from: PT.yellow2, to: V6.pin8, via: [[-0.3, 1.02], [3.076, 1.9]] }
  - { from: V6.pin8, to: C11.a, color: red, via: [[3.7, 2.45], [3.5, 0.45]] }

  # --- filtered B+ rail: choke, then 4.7k and 10k droppers -------------------
  - { from: C11.a, to: L1.hi }
  - { from: L1.lo, to: C12.a }
  - { from: C12.a, to: RD1.a }
  - { from: RD1.b, to: C13.a }
  - { from: C13.a, to: RD2.a, via: [[7.8, 0.65]] }
  - { from: RD2.b, to: C14.a }
  # filter negatives → ground bus; drops angled off their eyelet column so they
  # do not run colinear with the resistor leads that share that column.
  - { from: C11.b, to: [1.45, 4.4], via: [[4.4, 0.35]] }
  - { from: C12.b, to: [1.45, 8.6] }
  - { from: C13.b, to: [1.45, 11.3] }
  - { from: C14.b, to: [1.45, 14.6] }

  # --- bias supply: PT red-blue (fanned above) → selenium rectifier → −48 V ---
  - { from: RB1.b, to: C15.a }
  - { from: C15.b, to: [1.45, 1] }
  - { from: RB2.a, to: RB1.b }
  - { from: RB2.b, to: [1.45, 3] }
  # grid leaks return to −48 V (RB1.b) in clear lanes above the tube-pin ring,
  # approaching the shared node from distinct bearings (one from directly below,
  # one from the lower-right) so neither reads as one wire with the other.
  - { from: RGL1.b, to: RB1.b, via: [[9, 1.3], [1, 1.3]] }
  - { from: RGL2.b, to: RB1.b, via: [[13, 1.55], [1.848, 1.55]] }

  # --- 5881 output: screens, grids, plates, cathodes, OT ---------------------
  # The screen + grid pins (pin4 / pin5, the top pins nearest the board) are
  # approached from above in staggered lanes; the second grid feed and the
  # plate/OT leads dive to the deep harness band clear of the pin rings; the
  # cathodes drop straight to the bus. Each shared column is left by a jog.
  - { from: RS1.a, to: C12.a, via: [[10, 0.55], [6, 0.55]] }
  - { from: RS1.b, to: V4.pin4, via: [[10.6, 1.5], [7.63, 1.5]] }
  - { from: RS2.a, to: C12.a, via: [[13.6, 0.42], [6.3, 0.42]] }
  - { from: RS2.b, to: V5.pin4, via: [[13.4, 1.6], [10.25, 1.6]] }
  - { from: C8.b, to: V4.pin5, via: [[17.422, 2.35], [7.442, 2.35]] }
  - { from: RGL1.a, to: V4.pin5, via: [[7.5, 1.66], [6.75, 1.66]] }
  - { from: C9.b, to: V5.pin5, via: [[21.4, 1.3], [21.4, 2.5], [11.8, 2.5]] }
  - { from: RGL2.a, to: V5.pin5, via: [[11.5, 1.66], [10.75, 1.66]] }
  # OT/plate leads reach the T3 pigtails by rising at staggered columns then a
  # short horizontal stub to each pigtail's row, so no two leads read as one wire
  # where they bunch at the transformer.
  - { from: V4.pin3, to: T3.blue, via: [[4.3, 2.7], [43.2, 2.7], [43.2, 0.31]] }
  - { from: V5.pin3, to: T3.brown, via: [[7.7, 2.85], [43, 2.85], [43, 0.41]] }
  - { from: T3.red, to: C11.a, color: red, via: [[43.4, 0.5], [43.4, 2.6], [2.55, 2.6], [2.55, 0.35]] }
  - { from: V4.pin8, to: [1.45, 6.96] }
  - { from: V5.pin8, to: [1.45, 10.96] }
  - { from: T3.black, to: SPK, via: [[43.6, 0.59], [43.6, 3.05], [16.5, 3.05], [16.5, 2]] }
  - { from: T3.green, to: SPK, via: [[43.8, 0.69], [43.8, 3.2], [15, 3.2]] }
  - { from: SPK, to: RNF.a, via: [[15.4, 2.55], [17.9, 2.55]] }
  - { from: RNF.b, to: RT2.a, via: [[19.5, 2.6], [19.5, 3.35], [25, 3.35]] }

  # --- long-tailed-pair phase inverter (V3) ---------------------------------
  # Plate loads reach B+3 (C13.a) from staggered top lanes; the V3 plate, grid
  # and cathode pins and the shared tail/junction nodes (RTAIL.a, RT2.a) are each
  # approached from a distinct bearing so no two feeds read as one wire.
  - { from: RLA.a, to: C13.a, via: [[16.4, 0.58], [9.8, 0.58]] }
  - { from: RLA.b, to: V3.pin1, via: [[17, 2.45], [18.9, 2.45]] }
  - { from: RLB.a, to: C13.a, via: [[18, 0.82], [9, 0.82]] }
  - { from: RLB.b, to: V3.pin6, via: [[19, 1.5], [20.9, 1.5]] }
  - { from: V3.pin1, to: C8.a, via: [[20, 1.64], [16, 1.64], [15.6, 0.4]] }
  - { from: V3.pin6, to: C9.a, via: [[20.9, 1.7], [19.3, 1.7]] }
  - { from: C6.b, to: V3.pin2, via: [[26.6, 1.38], [18.5, 1.38], [18.5, 2.3]] }
  - { from: RGA.a, to: V3.pin2, via: [[20, 2.55], [19.284, 2.55]] }
  - { from: RGB.a, to: V3.pin7, via: [[22, 1.72], [21, 1.72]] }
  - { from: V3.pin3, to: RTAIL.a, via: [[20.039, 1.4], [22.5, 0.6]] }
  - { from: V3.pin8, to: RTAIL.a, via: [[21.472, 1.5], [25.46, 0.58]] }
  - { from: RTAIL.b, to: RT2.a }
  - { from: RGA.b, to: RT2.a, via: [[21, 0.75], [24.7, 0.75]] }
  - { from: RGB.b, to: RT2.a, via: [[23.4, 1.25], [24.7, 1.25]] }
  - { from: RT2.b, to: [1.45, 26] }

  # --- V2A driver + V2B cathode follower -------------------------------------
  # B+4 backbone runs in the top lane nearest the board; the V2 pins and the
  # shared RL3.a / pin6 / pin7 nodes are each approached from a distinct bearing.
  - { from: C14.a, to: RL3.a, via: [[12.525, -0.323], [33.575, -0.33], [33.6, 0.5]] }
  - { from: RL3.b, to: V2.pin6, via: [[35, 1.55], [31.9, 1.55]] }
  - { from: V2.pin6, to: V2.pin2, via: [[31.4, 1.62], [29.6, 1.62], [29.6, 2.3]] }
  - { from: V2.pin1, to: RL3.a, via: [[30.9, 1.95], [30.9, 1.35], [34, 1.35]] }
  - { from: V2.pin8, to: RK2.a, via: [[32.6, 1.6], [32.6, 0.25]] }
  - { from: RK2.b, to: [1.45, 33] }

  # --- cathode-follower FMV tone stack — the ladder the I-EG sheet draws ------
  # (caps on the board; bass wiper strapped into the treble-lug node; middle
  # wiper fed from the second 0.02 µF; output = the treble wiper alone)
  - { from: V2.pin3, to: RSL.a, via: [[29.7, 1.6], [27, 1.6]] }
  - { from: RSL.a, to: C4.a, via: [[27.5, 0.62], [30.6, 0.62]] }
  - { from: C4.b, to: VR3.lug3, via: [[32.3, -0.74], [16.31, -0.74]] }
  - { from: RSL.b, to: C5.b, via: [[28.3, 0.5]] }
  - { from: C5.a, to: VR3.lug1, via: [[29.2, -0.6], [29.2, -1.25], [15.69, -1.25]] }
  - { from: VR3.lug1, to: VR4.lug3, via: [[15.5, -1.05], [12.5, -1.05]] }
  - { from: VR4.lug2, to: VR4.lug3 }
  - { from: C5b.a, to: VR5.lug2, via: [[30.3, -1.15], [8, -1.15]] }
  - { from: VR4.lug1, to: VR5.lug3, via: [[11.4, -1.05], [8.6, -1.05]] }
  - { from: VR3.lug2, to: C6.a, via: [[16, -0.54], [24.6, -0.54], [24.6, 0]] }
  - { from: VR5.lug1, to: [1.45, 7.4] }

  # --- volume controls + channel mixers → V2A grid ---------------------------
  - { from: VR1.lug2, to: RM1.a, via: [[23, -0.58], [27.5, -0.58], [27.5, 0.45], [28.7, 0.45]] }
  - { from: RM1.b, to: V2.pin7, via: [[30, 1.4], [31.69, 1.4]] }
  - { from: VR1.lug1, to: [1.45, 22.4] }
  - { from: VR2.lug2, to: RM2.a, via: [[28.5, -0.7], [28.5, -0.46], [30.5, -0.46], [30.5, 0.5]] }
  - { from: RM2.b, to: V2.pin7, via: [[32.4, 1.6], [32.2, 1.6]] }
  - { from: VR2.lug1, to: [1.45, 28.6], via: [[28.6, -0.55]] }

  # --- 12AY7 input pair (V1): bright + normal channels -----------------------
  # Grids approached from above (pin7) / below (pin2, clear of pin3); plates to
  # loads and couplers, cathodes to the shared RK1.a — each shared node fanned.
  - { from: JB, to: V1.pin7, via: [[34, -0.45], [38.69, -0.45]] }
  - { from: V1.pin6, to: RL1.b, via: [[38.9, 1.62], [37.2, 1.62]] }
  - { from: RL3.a, to: RL1.a, via: [[34.4, 0.5], [35.6, 0.5]] }
  - { from: V1.pin6, to: C1.a, via: [[38, 1.7], [33.4, 1.7], [33.4, 0.3]] }
  - { from: C1.b, to: VR1.lug3, via: [[36, -0.38], [23.566, -0.36]] }
  - { from: JN, to: V1.pin2, via: [[39.925, -0.55], [39.535, -0.104], [39.5, 2.4]] }
  - { from: V1.pin1, to: RL2.b, via: [[37.9, 1.9], [37.9, 1.5], [39, 1.5]] }
  - { from: RL1.a, to: RL2.a, via: [[36.4, 0.4], [38, 0.4]] }
  - { from: V1.pin1, to: C2.a, via: [[37.6, 2], [37.6, 0.3]] }
  - { from: C2.b, to: VR2.lug3, via: [[39, -0.42], [28.31, -0.42]] }
  - { from: V1.pin8, to: RK1.a, via: [[40.4, 2], [40.4, 0.4]] }
  - { from: V1.pin3, to: RK1.a, via: [[38.247, 2.3], [39.4, 2.222], [39.4, 0.35]] }
  - { from: RK1.b, to: [1.45, 40] }
  - { from: C3.a, to: RK1.a }
  - { from: C3.b, to: [1.45, 42] }

  # --- presence control (5k), at the phase-inverter tail foot -----------------
  - { from: VR6.lug3, to: RT2.a, via: [[4, -0.82], [25.5, -0.82]] }
  - { from: VR6.lug1, to: [1.45, 4.8], via: [[4.8, -0.55]] }
  - { from: VR6.lug2, to: C16.a, via: [[4, -1.3], [6, -1.3]] }
  - { from: C16.b, to: [1.45, 6.8], via: [[6.8, -0.5]] }

  # --- input grid leaks (RG1 bright, RG2 normal), at the input jacks ----------
  # 1 MΩ grid-to-ground leaks; RGn.a taps the jack (grid) node, RGn.b returns to
  # the ground bus. They run above the board and drop to the bus at a clear col.
  - { from: RG1.a, to: JB, via: [[35.6, -1.05], [34, -1.05]] }
  - { from: RG1.b, to: [1.45, 35.6], via: [[35.6, -1.2]] }
  - { from: RG2.a, to: JN, via: [[41, -1.05], [40, -1.05]] }
  - { from: RG2.b, to: [1.45, 42.2], via: [[41, -1.2], [42.2, -1.2]] }

  # --- 6.3 V heater chain (green twisted pair) -------------------------------
  # Read from the published 5F6-A sheet (I-EG): the PT green pair feeds the pilot
  # lamp and then daisy-chains socket to socket in the drawing's physical order —
  # the two 5881 outputs, the two 12AX7s, the 12AY7 input. The GZ34 rectifier is
  # directly heated off the 5 V winding, so it is not on this chain. The winding's
  # green-yellow centre tap is grounded at the chassis, as the sheet marks it (no
  # balancing resistors are drawn or in the BOM). Twisted runs land only on heater
  # pins (5881 octal 2/7, noval 4/5), routed in a deep lane below the output
  # harness.
  - { from: PT.green, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V4.pin7, style: twisted, via: [[-1.4, 3.6], [6.5, 3.6]] }
  - { from: V4.pin2, to: V5.pin7, style: twisted, via: [[6.5, 3.62], [10.5, 3.62]] }
  - { from: V5.pin2, to: V3.pin4, style: twisted, via: [[10.5, 3.64], [20, 3.64]] }
  - { from: V3.pin5, to: V2.pin4, style: twisted, via: [[20, 3.6], [31, 3.6]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[31, 3.6], [38, 3.6]] }
  - { from: V1.pin4, to: V1.pin5, style: twisted }
  - { from: PT.green-yellow, to: [1.45, 0.3] }

# net_map — the reviewable data layer reconciling the drawn wiring with the DC
# netlist for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # Terminals the netlist gives no discrete node to reach on their own. The two
  # 5881 plates and the OT primary centre tap all co-anchor to B+1 — the netlist
  # omits the OT primary DCR, so both plate nodes and the CT collapse to B+1.
  anchors:
    T3.blue:  BP1    # V4 5881 plate → OT primary
    T3.brown: BP1    # V5 5881 plate → OT primary
    T3.red:   BP1    # OT primary centre tap → B+1
    SPK: "0"         # speaker jack — OT-secondary DCR folded into ground (the NFB return reads as ground at DC)
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out).
  netlist_unplaced:
    RCHOKE: "filter choke L1 sits on the board (B+1 → B+2); the netlist models its ~130 Ω DCR as RCHOKE"
    RG3:  "V2A grid return — realised through the volume pots (VR1/VR2) and 270k channel mixers to ground, not a discrete board resistor"
    RKCF: "V2B cathode-follower 100 kΩ load — the sheet runs it from the +180 V eyelet across the board; omitted from this redraw, whose CF node is carried by the RSL.a feed"
