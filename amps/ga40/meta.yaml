# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ga40"
name_style: "Gibson GA-40 Les Paul-style"
family: other
era:
  # The drawing is UNDATED — no date, no revision box, no drawing number beyond
  # the model in the title block. The GA-40 model number spans a decade and at
  # least three circuits (see history/families/gibson-ga.yaml); THIS drawing is
  # the 5879 one. The sources cited below date the 5879 + 12AX7 front end from
  # 1956 and put the model in the catalogue until late 1962, and they describe
  # more than one 5879 version. The bracket is an outer bound over those, not a
  # production record: the sheet carries no feature that dates it inside the span.
  start: 1956
  end: 1962
wattage: 15
tubes: [5879, 5879, 6SQ7, 12AX7, 6V6GT, 6V6GT, 5Y3GT]
topology:
  rectifier: { kind: tube, type: "5Y3GT" }
  bias: cathode
  phase_inverter: paraphase
  tone_stack: single-knob
lineage:
  derived_from: []   # no documented derivation from another circuit in this corpus
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RL1 plate load, RS1 screen dropper, CK4 cathode bypass)
  notation: us
sources:
  - desc: "Gibson, factory drawing with the title \"GA-40\" at the upper right and the \"Les Paul\" signature at the lower left. This is the revision documented here. Supplies the tube complement (two 5879 pentodes, one per channel; a 6SQ7 tremolo oscillator; a 12AX7 phase inverter; two 6V6GT; a 5Y3GT), the component values, and a printed VOLTAGE TABLE, transcribed in the operating-point section of this page. Not reproduced here; archived in Schematic Heaven's Gibson library and mirrored at EL34World."
    url: "https://schematicheaven.net/gibsonamps/ga40.pdf"
  - desc: "EL34World, Gibson schematic folder: the same Gibson GA-40 drawing. Byte-identical to the Schematic Heaven copy, and a second archive this page's reading can be checked against."
    url: "https://el34world.com/charts/Schematics/files/Gibson/Gibson_ga40.pdf"
  - desc: "Gibson, factory drawing captioned \"GA40 1954\". The earlier circuit under the same model number, cited only to establish what this page is not; it is a different amplifier. Its tube-location strip letters V1 6SJ7 \"Mic Amp\", V2 6SJ7 \"Instr Amp\", V3 6SJ7 \"Driver\", V4 6SN7 \"Phase Inverter — Tremolo\", V5 and V6 6V6GT \"Output\", V7 6V6GT \"Tremolo\" and V8 5V4G \"Rectifier\". It carries a printed component legend (R1–R39, C1–C20) and the transformer numbers T1 GA-40P and T2 Z3533. It has no 5879 and no 6SQ7, and its tremolo modulator is a third 6V6GT rather than a triode. It is listed with the earlier models on the Gibson GA family page."
    url: "https://schematicheaven.net/gibsonamps/ga40_2.pdf"
  - desc: "Guitar.com, published bench feature on a 1956 GA-40 Les Paul. Confirms the tube complement and supplies the power rating recorded here. It lists \"2x 5879, 2x 6V6, 1x 5Y3\" with a \"6SQ7 triode\" for the tremolo; credits the tremolo circuit to Seth Lover; puts the output at \"approximately 15 watts\" from a cathode-biased 6V6 pair; dates this second-generation model to 1956 and 1957; names the controls as four input jacks with volume, volume, frequency, depth and treble/bass; and describes channel 2 as carrying a filter network of the Vox AC10/AC15 kind, which is the five-section 0.005 µF ladder on the drawing. It also records that Gibson built at least five Les Paul GA-40 variants."
    url: "https://guitar.com/reviews/1956-gibson-ga-40/"
  - desc: "GuitarPlayer, \"Classic Gear: Gibson Les Paul GA-40 Amp\". The model chronology behind this page's era range and the Gibson GA family page. The GA-40 Les Paul debuted in 1952 and \"remained in the catalog until late 1962 or early '63\", when Les Paul's agreement with Gibson ended. The original version carried \"three octal 6SJ7s and one 6SN7\"; the mid-to-late-1950s version is the one with the 5879 pentode preamp."
    url: "https://www.guitarplayer.com/gear/classic-gear-gibson-les-paul-ga-40-amp"
  - desc: "The Amp Garage, service thread on the GA-40 Les Paul schematics. The independent naming of the inverter and the tremolo method reported here. It records that the 1954–1956 amplifiers used 6SJ7 preamp tubes and a 6SN7 phase inverter, while from 1956 they used 5879 preamp tubes and a 12AX7 phase inverter with a cathode-biased 6V6 pair. It calls the inverter an \"old fashioned basic paraphase phase splitter\" and describes the tremolo as working by modulating the B+ and screen voltage of the pentode input tube, which is why channel 2's screen sits so far below channel 1's on the factory chart."
    url: "https://ampgarage.com/forum/viewtopic.php?t=27749"
  - desc: "Greg Cutshaw, published restoration account of a GA-40 Les Paul. The one place the supply capacitors on this page are corroborated. It records the power-supply capacitors as \"20/10/10/10 µF at 450 WVDC\", the original 6SQ7 oscillator tube, a single tone control working from treble to bass, the tone circuit sitting \"between the phase inverter and power amp tubes\", and 15 W RMS output."
    url: "https://www.gregcutshaw.com/Gibson%20GA-40%20Amp/Gibson%20GA-40%20Amp.html"
  - desc: "RCA, \"6SQ7, 6SQ7-GT/G\" data sheet (Dec. 1, 1943), \"Duplex-Diode High-Mu Triode\". Supplies the basing the drawn 6SQ7 socket is wired to, and the reason its heater pins differ from the octal power tube's: \"Basing Designation ... 8Q\", with the printed terminal list (pin 1 metal shell, or base sleeve on the GT/G; 2 triode grid; 3 cathode; 4 and 5 diode plates; 6 triode plate; 7 and 8 heater). Heater 6.3 V, 0.3 A; triode µ = 100; maximum plate voltage 300 V. Neither this sheet nor the Tung-Sol one prints a plate-dissipation rating. Checked against the Tung-Sol 6SQ7 / 6SQ7GT sheet (Dec. 1, 1947). See the 6SQ7 reference page."
    url: "https://frank.pocnet.net/sheets/049/6/6SQ7.pdf"
  - desc: "RCA, 5879 data sheet (Data 1, dated 3-61), \"Sharp-Cutoff Pentode\", 9-pin miniature, \"For Audio-Amplifier Applications Critical as to Microphonics, Leakage Noise, and Hum\". The anchor for the site's open (CC0) 5879 tube model, and the ratings that make it a preamp tube and nothing else: pentode connection, Va = 250 V, Vg2 = 100 V and Vg1 = −3 V give Ia = 1.8 mA, Ig2 = 0.4 mA, gm = 1000 µmho and rp = 2 MΩ; design maximums of 1.25 W plate dissipation, 0.25 W screen input and 330 V plate and screen supply; basing 9AD, with grid 3 \"connected to cathode at socket\". See the 5879 reference page for the model and its method."
    url: "https://frank.pocnet.net/sheets/049/5/5879.pdf"
verification:
  status: draft   # Three reasons, all stated rather than tuned away.
                  # (1) Channel 2 and the whole 6SQ7 tremolo are EXCLUDED from
                  # the netlist: channel 2's screen is fed through the tremolo's
                  # Depth network, and neither that network nor the channel-2
                  # screen dropper resolves on the only published drawing of this
                  # revision. Verified is earned whole.
                  # (2) The three channel-1 nodes the chart prints all land
                  # OUTSIDE the era's ±20% convention (plate −24%, screen +37%,
                  # cathode +23%) — a v0 tube-model residual, not a circuit
                  # disagreement: the chart's own arithmetic reproduces every
                  # resistor this entry reads to within a few percent. See
                  # voltages.yaml and notes.md.
                  # (3) The drawing is undated, so the era bracket is an outer
                  # bound over more than one 5879 revision rather than a
                  # production record.
# Day the circuit landed in the corpus (git history, amps/ga40/) — the feed's
# pubDate for a draft; production builds are shallow clones and cannot ask git.
added: 2026-08-30
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V2: "excluded — channel 2's 5879: its screen is fed through the tremolo's Depth network, and neither that network nor the channel-2 screen dropper resolves on the only published drawing of this revision"
  V3: "excluded — the 6SQ7 tremolo oscillator: a running phase-shift oscillator has no static operating point; its plate load taps a driven rail"
