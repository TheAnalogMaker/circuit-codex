# amps/m1959/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T1.1: BP1                # OT primary, V4/V5 plate end — primary DCR omitted
  T1.2: BP1                # OT primary centre tap (the <B+1> rail)
  T1.3: BP1                # OT primary, V6/V7 plate end
  T1.4: "0"                # OT secondary hot — secondary DCR folded into ground
                           # (RNFB's return); mirrors layout net_map SPK: '0'.

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-02 after the drawing went clean against netlist.cir.
schematic_claim: verified

# Transformer terminals this sheet letters as global labels instead of drawing
# them as transformer pins: the sheet draws no power transformer. Read by
# verify_schematic_nets.py's UNFED RECTIFIER, which never infers a terminal
# from a label's name. When the sheet draws a terminal as a pin, delete its
# line; the gate calls it a STALE DECLARATION until you do.
winding_labels:
  HT_A: ht_a      # an HT winding end; D2 (and D4, the bridge's low side)
  HT_B: ht_b      # the other end; D3 and D5
  BIAS W: bias    # the separate bias winding's hot end: bias rectifier D1
                  # through RBA (the drawing grounds the winding's other end)
