# Parts list — read from the Marshall 1959 factory drawing (Unicord 70-6-11 rev B,
# July 1970). This is the 100 W Super Lead head: two channels (high and low input
# per channel), 3x ECC83 + 4x EL34, silicon bridge rectifier. Designators follow the
# drawing's functional labels (V1/V2/V3 preamp, V4-V7 output) and match the redrawn
# schematic and the board layout; parts drawn only as annotations on the factory
# sheet are listed here without designators.
notes: "Cathode-bypass and coupling capacitor VALUES are open at DC and do not enter the operating-point netlist; they are listed for completeness. Where the drawing prints a second value in parentheses, that is a factory-annotated alternate: the primary value is listed and the alternate is named in the part's role. The HT-winding snubbers, the mains-to-chassis capacitor, the fuses, the standby switch and the pilot lamp are annotations on the factory sheet: the capacitors appear on the schematic without connections, and the rest carry no designator."
