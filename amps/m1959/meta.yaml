sources:
  - desc: "Unicord, Marshall model 1959 factory drawing 70-6-11 rev B (July 1970). Unicord Incorporated, of 75 Frost Street, Westbury NY, a Gulf+Western company, was Marshall's US importer. The title block reads \"MARSHALL 1959\". Supplies the tube complement (three ECC83, V1–V3; four EL34, V4–V7; a silicon bridge rectifier and no rectifier tube), every component value, and the universal mains taps (110/120/200/225/245 V). The drawing annotates two alternative values: V2A's 820 Ω cathode resistor is marked \"(1K)\", and the 47 kΩ feedback resistor is annotated as 100 kΩ. The drawing prints no valve-voltage chart. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Marshall/Marshall_jmp_superlead_100w_1959.pdf"
  - desc: "Marshall, \"MARSHALL 100W. VOLT. CHART\". The published valve-voltage chart issued with the Unicord sheet of the same drawing number and date (70-6-11, July 1970) titled \"MARSHALL 1959 MARK II\", whose ECC83 front end is closely related to the circuit on this page but drives four 6550 output tubes. Its V1, V2 and V3 rows are the chart this page's operating points are checked against. Its output rows (453 V plate, 450 V screen, bias about −51 V, primary current 1.2–1.3 A at 120 V AC) describe the 6550 version and are not claimed for the EL34 version."
    url: "https://el34world.com/charts/Schematics/files/Marshall/Marshall_1959mkii_volt_chrt.pdf"
  - desc: "Marshall, \"100 Watt Amplifier, Type #2, c.1967\", an undated hand-drawn schematic archived with the factory sheets. A cross-reference. It confirms the same circuit at the earlier date (four inputs, 68 kΩ stoppers, 100 kΩ plates, 820 Ω and 2.7 kΩ cathodes, a cathode-follower Treble/Middle/Bass stack, a long-tailed-pair inverter, four output tubes, a silicon bridge) and boxes its own rail figures: 375 V at the phase inverter, 305 V at the second stage and 270 V at the input stage. Its supply is an earlier one: a 20 H choke, an 8.2 kΩ dropper to the phase-inverter rail where the 1970 factory sheet uses 20 kΩ, and a 33 kΩ feed to the bias supply. This page uses the factory sheet."
    url: "https://el34world.com/charts/Schematics/files/Marshall/Marshall_jmp_superlead_100w_1959.pdf"
  - desc: "Mullard/Philips, EL34 data sheet, January 1969 (\"A.F. Output Pentode\"). The anchor for the site's open (CC0) EL34 tube model and its octal basing (socket 5903/13): Va = 250 V, Vg2 = 250 V and Vg1 = −13.5 V give Ia = 100 mA, Ig2 = 14.9 mA, gm = 12.5 mA/V and µ(g1-g2) = 11."
    url: "https://frank.pocnet.net/sheets/010/e/EL34.pdf"
  - desc: "Wikipedia, \"Marshall Amplification\". Supplies the origin of the 100 W heads as a special order from players who wanted more than 45 W on stage; the 1965 introduction of the 100 W Super Lead as Marshall's catalog number 1959; its cost-driven move from KT66 to EL34 output tubes; the 1969 change from the acrylic (\"plexi\") front panel to brushed metal; and the mid-1970s move to printed-circuit construction that closed the era this circuit belongs to."
    url: "https://en.wikipedia.org/wiki/Marshall_Amplification"
