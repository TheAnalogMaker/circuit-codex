# Parts list — read from the published Ampeg B-15N drawing, revision C, part
# 591722 (title block in meta.yaml). Values are the drawing's; its own notice
# sets ½ W 10% composition resistors and 400 V capacitors unless a part is
# marked otherwise, so only the marked ratings are repeated here.
notes: >-
  DESIGNATORS. This sheet letters most of what it draws — R1…R42, C1…C20,
  VR1…VR7, SW1…SW7, J1…J6, V1…V6 and D1 — and those numbers are kept exactly.
  Three groups of parts have no usable factory designator and carry role codes
  instead, which is why the list as a whole reads as a functional one.
  (1) The two printed tone boards. Each is drawn inside a dashed outline with a
  P.E.C. number beside it — the channel-2 board reads 250762-1; the channel-1
  number is smudged on this scan — and six of the parts inside each outline are
  drawn with a value and no designator at all, even though R17/R21 and the two
  pots inside the same outline are lettered. Those twelve get RTA*/CTA* (channel
  1) and RTB*/CTB* (channel 2).
  (2) The driver's 25 µF · 25 V cathode bypass, drawn beside R24 with no number:
  CKD1.
  (3) TWO CAPACITORS THE SHEET LETTERS C19 A SECOND AND THIRD TIME. The drawing
  uses the designator C19 for three different parts: channel 1's 0.01 µF coupler
  into the volume pot, a 10 µF · 100 V electrolytic in the bias supply, and one
  of the two 0.047 µF · 600 V capacitors across the mains switching. C19 is kept
  for the first of them, in reading order across the sheet; the other two are
  listed as CBF2 and CM2, each saying in its role that the factory number is
  C19. A parts list cannot carry one designator three times, and silently
  renumbering a factory sheet would hide a fact a builder holding the drawing
  needs to know.
  (4) THE THREE-SECTION CAN. The sheet rings three 40 µF · 500 V sections in one
  dashed outline and letters the outline C16. Its three sections sit on three
  different nodes — the screen node, the preamp rail and the driver rail — so
  they are listed as C16A, C16B and C16C, each stating its own section's value
  with the packaging in its role, per docs/lettering-conventions.md. One
  designator cannot be carried on three different nodes.
