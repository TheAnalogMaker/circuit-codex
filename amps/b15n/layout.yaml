# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # No excluded_tubes block belongs here. Every signal bottle this circuit
  # carries — V1, V2 and V3's six 6SL7 sections and the two 6L6GCs — is modelled
  # in netlist.cir and anchors normally. The only declared-excluded bottle is
  # V6, the rectifier, which the checker excludes by rule. There is no tremolo
  # oscillator or other free-running stage to exclude here.
  anchors:
    # The netlist omits output-transformer winding DCR, so both 6L6GC plate
    # leads and the primary centre tap collapse onto the reservoir node BP1 —
    # which is what makes the centre tap and the plate node one node there.
    T2.blue: BP1      # OT primary, V5 plate lead
    T2.brown: BP1     # OT primary, V4 plate lead
    T2.red: BP1       # OT primary centre tap -> reservoir
    # The secondary is a DC short to ground, which is why netlist.cir models the
    # 10 kOhm feedback resistor R40 as a leg from the driver cathode to ground.
    T2.green: "0"
    T2.black: "0"
  netlist_unplaced:
    RVR1: "channel 1 volume VR1 — the netlist models its DC grid return as one grid-leak (G1B -> 0); the pot itself is a panel control, not a board part"
    RVR4: "channel 2 volume VR4 — the same, for G2B"
    RG3B: "the driver grid's DC return, lumped at 1 MOhm (G3B -> 0). It is not a discrete resistor anywhere: the return runs back out through both 270 kOhm mixing resistors, each tone board's 120 kOhm link and bass pot, to that board's 22 kOhm foot"
