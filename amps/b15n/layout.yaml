# Board layout — DERIVED, not read from a factory layout drawing.
#
# Ampeg published no board-layout sheet for the B-15N and none was located: both
# published sheets are the same circuit drawing (the engineering issue whose
# title block reads "B-15-N ... PART NO. 591722" revision C, and the
# service-manual sheet headed "MODEL B15N SCHEMATIC DIAGRAM (REV. C)"). The
# arrangement here is therefore the Circuit Codex's own — this circuit's parts
# laid out in signal order along the chassis on the house two-row eyelet grid,
# ordered to match the valve row beneath it (5AR4 · 6L6GC · 6L6GC · 6SL7 driver
# · 6SL7 channel 2 · 6SL7 channel 1). It is a builder's diagram of THIS circuit,
# not a record of how Ampeg dressed its own chassis, which carried two printed
# tone boards and a good deal of terminal-strip work. The caption says so and
# `board.title` carries "(derived)".
#
# Part refs are the shared key into bom.yaml; the renderer reads each value and
# part type from there, so the layout and the parts list cannot disagree.
#
# Machine-checked equivalence: the point-to-point wiring below has been verified
# electrically equivalent to netlist.cir by pipeline/verify_layout_nets.py — see
# the net_map block at the foot of this file and docs/layout-schema.md. Heaters,
# the pilot lamp, the standby switch and the PT / rectifier AC side are an
# excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 188
  title: "B-15N · board layout (derived)"
caption: "A derived layout: Ampeg published no board-layout drawing for this chassis, so the arrangement below is the Circuit Codex's own — this circuit's parts laid out in signal order along the chassis and drawn on the house eyelet grid, not a record of the factory's own construction, which put each channel's Bass and Treble network on its own printed board (P.E.C.). Every value comes from the parts list, which is read from the Ampeg drawing whose title block reads \"B-15-N / U.S. PATENT 3183305\", part 591722, revision C. Transformer lead colours are the drawing's own: PT-108 red HT pair with a red-white centre tap, yellow 5 V rectifier winding, green 6.3 V heater winding; OT-214 blue and brown to the two 6L6GC plates with a red centre tap, and a green/black secondary. The OT secondary's yellow tap, the EXT. SPKR. jack J6 that normals the internal 8 ohm speaker, and the whole mains side beyond the transformer primary (POWER and POLAR. switches, the 3 A and 6 A fuses, the switched AC outlet and its two 0.047 uF capacitors) are outside this drawing. The panel pilot is drawn as the panel item it is and carries no lead here: this circuit puts P.L. straight across the transformer's mains primary, not on the heater chain, and that side of the circuit is out of scope. The 6.3 V heater chain (twisted pair, transformer to the two 6L6GCs, then the driver, then the two channel valves, with the VR7 hum balance across the line at the far end) is likewise derived: with no layout sheet its daisy order is the physical socket order. The 5AR4 is indirectly heated from the 5 V winding, off that chain. Not a trace or a dimensioned reproduction."
source:
  desc: "Ampeg factory schematic, engineering issue, title block \"B-15-N / U.S. PATENT 3183305 / TUBES / 6SL7 - 6SL7 - 6SL7 - 6L6GC - 6L6GC - 5AR4 / -472-\", PART NO. 591722, revision C of 1/22/74 — layout DERIVED from that circuit drawing; Ampeg published no board-layout sheet for this chassis and none was located"
  url: "https://ampeg.com/data/6/0a000509142f661ff65a5784a/application/pdf/"

# Board-mounted parts. a / b are eyelet endpoints [row, col]; the body is drawn
# between them (same row = axial part; shared column across rows = vertical leg).
# Two leads in one eyelet are one solder point — used deliberately below, e.g.
# the supply chain's droppers and cans meeting at their shared rail eyelets and
# each tone board's pot connections.
parts:
  # === power supply: reservoir -> 1 kOhm 10 W -> screen node -> two 22 kOhm ==
  - { ref: C17,  a: [0, 1],  b: [1, 1] }    # 30 uF reservoir (BP1)
  - { ref: R39,  a: [0, 1],  b: [0, 4] }    # 1 kOhm 10 W, BP1 -> screen node
  - { ref: C16A, a: [0, 4],  b: [1, 4] }    # screen-node section of the C16 can
  - { ref: R37,  a: [0, 4],  b: [0, 7] }    # 22 kOhm 1 W, BP2 -> preamp rail
  - { ref: C16B, a: [0, 7],  b: [1, 7] }    # preamp-rail section
  - { ref: R38,  a: [0, 10], b: [0, 13] }   # 22 kOhm 1 W, BP2 -> driver rail
  - { ref: C16C, a: [0, 13], b: [1, 13] }   # driver-rail section
  # === negative-bias supply =================================================
  - { ref: R36,  a: [0, 16], b: [0, 19] }   # 100 kOhm 2 W from the 5AR4 plate
  - { ref: R35,  a: [0, 19], b: [1, 19] }   # 56 kOhm on the rectifier side
  - { ref: D1,   a: [0, 19], b: [0, 22], cathode: a }
  #   ^ cathode read from schematic.kicad_sch: D1's cathode faces R36 and the
  #     5AR4 plate, its anode the bias filter, so it conducts toward the bias
  #     line on the half cycle that plate swings below ground.
  - { ref: R34,  a: [0, 22], b: [1, 22] }   # 47 kOhm on the bias side
  - { ref: C15,  a: [0, 25], b: [1, 25] }   # 10 uF bias filter
  - { ref: R42,  a: [0, 25], b: [0, 28] }   # 10 kOhm between the two cans
  - { ref: CBF2, a: [0, 28], b: [1, 28] }   # 10 uF on the -50 V line itself
  # === output stage: couplers, grid returns, stoppers, load resistor ========
  - { ref: C13,  a: [0, 32], b: [0, 34] }   # 0.022 driver plate -> V5 grid
  - { ref: R30,  a: [0, 34], b: [1, 34] }   # 270 kOhm V5 grid return to -50 V
  - { ref: R33,  a: [0, 34], b: [0, 36] }   # 1 kOhm V5 grid stopper
  - { ref: C14,  a: [0, 38], b: [0, 40] }   # 0.022 inverted plate -> V4 grid
  - { ref: R31,  a: [0, 40], b: [1, 40] }   # 270 kOhm V4 grid return to -50 V
  - { ref: R32,  a: [0, 40], b: [0, 42] }   # 1 kOhm V4 grid stopper
  - { ref: R41,  a: [0, 44], b: [1, 44] }   # 250 Ohm 10 W across the secondary
  # === driver / self-balancing paraphase (V3) ==============================
  - { ref: R26,  a: [0, 50], b: [0, 52] }   # 120 kOhm driver anode load
  - { ref: R25,  a: [0, 54], b: [1, 54] }   # 220 Ohm driver cathode / NFB shunt
  - { ref: R40,  a: [0, 56], b: [0, 58] }   # 10 kOhm global feedback
  - { ref: R27,  a: [0, 60], b: [0, 62] }   # 120 kOhm inverted-side anode load
  - { ref: R24,  a: [0, 64], b: [1, 64] }   # 1 kOhm inverted-side cathode
  - { ref: CKD1, a: [0, 66], b: [1, 66] }   # 25 uF across it
  - { ref: R23,  a: [0, 68], b: [1, 68] }   # 470 kOhm inverted-side grid leak
  - { ref: R28,  a: [0, 70], b: [0, 72] }   # 470 kOhm paraphase divider, upper
  - { ref: R29,  a: [0, 72], b: [0, 74] }   # 510 kOhm paraphase divider, lower
  - { ref: C11,  a: [0, 76], b: [0, 78] }   # 0.022 tap -> the second grid
  # === channel 2 (V2) — base column 84 ======================================
  - { ref: R3,    a: [0, 84], b: [0, 86] }      # BRIGHT jack series resistor
  - { ref: C2,    a: [1, 84], b: [1, 86] }      # bridges it
  - { ref: R4,    a: [0, 88], b: [0, 90] }      # NORMAL jack series resistor
  - { ref: R6,    a: [0, 92], b: [1, 92] }      # input grid leak
  - { ref: R11,   a: [0, 94], b: [0, 96] }     # first anode load
  - { ref: R12,   a: [0, 98], b: [1, 98] }     # first cathode, UNBYPASSED
  - { ref: C5,    a: [0, 100], b: [0, 102] }      # first anode -> the ULTRA network
  - { ref: C6,    a: [0, 102], b: [1, 102] }      # ULTRA LO series capacitor
  - { ref: R13,   a: [1, 102], b: [1, 104], value_nudge: [0, -12] }     # ULTRA LO series resistor; value lifted off the row-2 run
  - { ref: R14,   a: [1, 104], b: [1, 106] }     # shunt leg, shorted out by ULTRA LO
  - { ref: C20,   a: [0, 102], b: [0, 104] }     # into the volume control
  - { ref: C7,    a: [0, 106], b: [0, 108] }      # ULTRA HI bright capacitor
  - { ref: R19,   a: [0, 110], b: [0, 112] }     # second anode load
  - { ref: R20,   a: [0, 114], b: [1, 114] }     # second cathode, UNBYPASSED
  - { ref: C8,    a: [0, 116], b: [0, 118] }      # second anode -> the tone board
  - { ref: CTB3,  a: [0, 118], b: [1, 118] }    # board input -> treble top lug
  - { ref: RTB1,  a: [0, 118], b: [0, 120] }    # board input -> bass top lug
  - { ref: CTB1,  a: [0, 120], b: [1, 120] }    # bass top lug -> wiper
  - { ref: CTB2,  a: [0, 124], b: [1, 124] }    # bass bottom lug -> wiper
  - { ref: RTB2,  a: [0, 124], b: [0, 126] }    # bass foot -> ground
  - { ref: R21,   a: [0, 130], b: [0, 132] }     # link: bass wiper -> treble wiper
  - { ref: R22,   a: [0, 132], b: [0, 134] }     # mixing resistor
  - { ref: CTB4,  a: [1, 130], b: [1, 132] }    # treble foot -> ground
  # === channel 1 (V1) — base column 136, component for component the same ====
  - { ref: R1,    a: [0, 136], b: [0, 138] }      # BRIGHT jack series resistor
  - { ref: C1,    a: [1, 136], b: [1, 138] }      # bridges it
  - { ref: R2,    a: [0, 140], b: [0, 142] }      # NORMAL jack series resistor
  - { ref: R5,    a: [0, 144], b: [1, 144] }      # input grid leak
  - { ref: R7,    a: [0, 146], b: [0, 148] }      # first anode load
  - { ref: R8,    a: [0, 150], b: [1, 150] }      # first cathode, UNBYPASSED
  - { ref: C3,    a: [0, 152], b: [0, 154] }      # first anode -> the ULTRA network
  - { ref: C4,    a: [0, 154], b: [1, 154] }      # ULTRA LO series capacitor
  - { ref: R9,    a: [1, 154], b: [1, 156] }      # ULTRA LO series resistor
  - { ref: R10,   a: [1, 156], b: [1, 158] }     # shunt leg, shorted out by ULTRA LO
  - { ref: C19,   a: [0, 154], b: [0, 156] }     # into the volume control
  - { ref: C9,    a: [0, 158], b: [0, 160] }      # ULTRA HI bright capacitor
  - { ref: R15,   a: [0, 162], b: [0, 164] }     # second anode load
  - { ref: R16,   a: [0, 166], b: [1, 166] }     # second cathode, UNBYPASSED
  - { ref: C10,   a: [0, 168], b: [0, 170] }     # second anode -> the tone board
  - { ref: CTA3,  a: [0, 170], b: [1, 170] }    # board input -> treble top lug
  - { ref: RTA1,  a: [0, 170], b: [0, 172] }    # board input -> bass top lug
  - { ref: CTA1,  a: [0, 172], b: [1, 172] }    # bass top lug -> wiper
  - { ref: CTA2,  a: [0, 176], b: [1, 176] }    # bass bottom lug -> wiper
  - { ref: RTA2,  a: [0, 176], b: [0, 178] }    # bass foot -> ground
  - { ref: R17,   a: [0, 182], b: [0, 184] }     # link: bass wiper -> treble wiper
  - { ref: R18,   a: [0, 184], b: [0, 186] }     # mixing resistor
  - { ref: CTA4,  a: [1, 182], b: [1, 184] }    # treble foot -> ground

