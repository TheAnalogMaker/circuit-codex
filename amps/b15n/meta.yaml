# Circuit Codex metadata — schema: docs/schema.md (v1)
id: b15n
name_style: "Ampeg B-15N Portaflex-style"
family: other
era:
  # Production years of the MODEL, from the published chronology: the B-15N
  # replaced the original B-15 in 1961 and gave way to the B-15NC in 1964.
  # The drawing documented here is REVISION C of 22 January 1974 — the circuit
  # as Ampeg last issued it, a decade after the model left the catalogue, not
  # as the first 1961 chassis left the bench. The bracket is the model's, the
  # values are revision C's, and the difference is stated rather than hidden
  # (see notes.md). The years match history/families/ampeg-portaflex.yaml.
  start: 1961
  end: 1964
wattage: 25
tubes: [6SL7, 6SL7, 6SL7, 6L6GC, 6L6GC, 5AR4]
topology:
  rectifier: { kind: tube, type: "5AR4" }
  bias: fixed              # -50 V line, 270 kΩ grid returns, cathodes to ground
  phase_inverter: paraphase  # self-balancing (floating) paraphase: a 470 kΩ /
                             # 510 kΩ divider strung across the two driver
                             # anodes feeds the second grid through C11
  tone_stack: per-channel-tb # each channel carries its own printed Bass+Treble
                             # board after its second gain stage, ahead of the
                             # 270 kΩ mixing resistor; the Volume sits earlier,
                             # between the two stages. No Middle control
lineage:
  derived_from: []   # no documented circuit ancestor in this corpus
  influenced: []
conventions:
  notation: us
  designators: functional  # the sheet's own R1…R42 / C1…C20 / VR1…VR7 numbers are
                           # kept wherever it letters a part uniquely; role codes
                           # cover the parts it letters NOT AT ALL (both printed
                           # tone boards, the driver cathode bypass) and the two
                           # it letters C19 a second and third time. One role code
                           # makes the whole list read as functional — see bom.yaml
sources:
  - desc: "Ampeg, factory schematic, engineering issue. This is the revision documented here. The title block reads \"B-15-N / U.S. PATENT 3183305 / TUBES / 6SL7 - 6SL7 - 6SL7 - 6L6GC - 6L6GC - 5AR4 / -472-\", with \"BY S.C. | 1268 | PART NO. 591722 | C\" beneath it and a revision block reading \"1/22/74 | C | 591722-2\" over \"B | 591722-1\", plus the Ampeg roundel and \"POST OFFICE BOX 315, LINDEN, NEW JERSEY 07036\". The sheet's notes read \"1 ALL RESISTORS 1/2 W 10% UNLESS OTHERWISE SPECIFIED\", \"2 ALL CAPACITORS IN MFD & 400V UNLESS OTHERWISE SPECIFIED\" and \"3 VOLTAGE READINGS ARE D.C. TAKEN WITH NO SIGNAL INSERTED USING A 20,000 Ω/VOLT METER\". Supplies the component values, the annotated voltages, the transformer part numbers (the OT-214 output transformer, whose handwritten part number beside it is only partly legible on this scan, and the PT-108 power transformer, part 300708-1) and a separate \"F-4\" diode bias supply. Not reproduced here."
    url: "https://ampeg.com/data/6/0a000509142f661ff65a5784a/application/pdf/"
  - desc: "Ampeg, service-manual schematic sheet of the same revision, headed \"MODEL B15N SCHEMATIC DIAGRAM (REV. C)\". The corroborating second reading: the same circuit and the same annotated voltages. The manual's own notes read \"1. Capacitance values are in microfarads, 10%, 400V\", \"2. Resistors are 1/2 W, 10%, composition\", \"3. D.C. voltage readings taken with no signal applied using a 20,000 ohm/volt voltmeter\" and \"4. Actual circuit may vary slightly due to normal production changes\". It adds an A.C. VOLTAGE MEASUREMENTS table taken at \"INPUT: .3V A.C. 400/cps\" for \"OUTPUT: 11V A.C. across 8 ohms load\", with \"Bass and Treble controls at mid-position and ultra hi and ultra lo switches off\". Only the table's first two rows survive the page trim on the published scan: V1 and V2 (6SL7) read 0.65 V on pin 1, 19 V on pin 2, 0.29 V on pin 4 and 6.5 V on pin 5, with pins 7 and 8 marked \"Fil.\". The two sheets agree on every component value and every DC annotation; they differ only at the bias supply, and that difference is described in the circuit story."
    url: "https://ampeg.com/data/6/0a0005091412661ff665e83fe/application/pdf/"
  - desc: "Wikipedia, \"Ampeg Portaflex\". The model chronology behind this page's era range and its 25 W rating: the 1960 B-15 \"was replaced by the B-15N in 1961\", and the line's 1962 update fitted \"a solid-state rectifier called the B-15NB\"."
    url: "https://en.wikipedia.org/wiki/Ampeg_Portaflex"
  - desc: "RCA, 6SL7-GT data sheet (November 5, 1954). The anchor for the site's 6SL7GT tube model, built only from published data, on which this circuit's five triode sections are simulated: Class A1, Va = 250 V and Vg = −2 V give Ia = 2.3 mA, rp = 44 kΩ, gm = 1600 µmho and µ = 70, with 1 W plate dissipation and a 300 V plate limit per unit. The basing is 8BD, which is what makes the drawing's pin numbers readable: pins 1, 2 and 3 are the grid, plate and cathode of unit 2, and pins 4, 5 and 6 the same for unit 1. See the 6SL7GT reference page for the model and its method."
    url: "https://frank.pocnet.net/sheets/049/6/6SL7GT.pdf"
  - desc: "RCA, 6L6-GC data sheet (DATA 1, dated 8-60). The anchor for the site's 6L6GC output-tube model, built only from published data: Class A1, Va = 250 V, Vg2 = 250 V and Vg1 = −14 V give Ia = 72 mA, Ig2 = 5 mA and gm = 6000 µmho, with design maximums of 30 W plate dissipation, 500 V plate and 450 V screen. The 450 V and 445 V this drawing annotates sit inside those limits, which is why the Portaflex could run the supply it does. See the 6L6GC reference page."
    url: "https://frank.pocnet.net/sheets/049/6/6L6GC.pdf"
verification:
  status: draft   # One reason, stated rather than tuned away: the driver
                  # stage's four printed voltages cannot all be true. 3 V across
                  # a 220 Ω cathode resistor is 13.6 mA, six times what a 6SL7
                  # section is rated to pass and 3.2 W into a 1 W plate, and
                  # 2.2 V across the other half's 1 kΩ needs a 489 V rail behind
                  # a 120 kΩ load in an amplifier whose highest node is 450 V.
                  # Those nodes are carried as disputed with their arithmetic
                  # (voltages.yaml), never force-fitted, and one of the two
                  # plate figures beside them lands outside the era's ±20% too.
                  # The eight preamp nodes and the screen node all land inside
                  # the era's ±20%, the schematic and both board-layout styles
                  # are drawn and gated, and the drawn wiring is machine-checked
                  # equivalent to netlist.cir (layout.yaml `wiring_claim`) — but
                  # verified is earned whole, and the human maintainer's
                  # sign-off is what grants it.
added: 2026-08-30
