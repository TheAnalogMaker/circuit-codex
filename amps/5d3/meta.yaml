# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "5d3"
name_style: "Wide-panel Tweed Deluxe-style"
family: tweed
era:
  start: 1954
  end: 1955
wattage: 12
tubes: [12AY7, 12AX7, 6V6GT, 6V6GT, 5Y3GT]
topology:
  rectifier: { kind: tube, type: "5Y3GT" }
  bias: cathode
  phase_inverter: paraphase
  tone_stack: single-knob
lineage:
  derived_from: []   # 5C3 is the direct ancestor — edge added when amps/5c3 lands
  influenced: ["5e3"]   # the narrow-panel 5E3 replaces this circuit's paraphase with a cathodyne
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Deluxe\" Model 5D3 schematic and layout sheets. Supplies every component value. The drawing prints no voltage chart, only Fender's ±20 % measurement notice. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_5d3.pdf"
  - desc: "Fender, \"Deluxe\" Model 5C3 drawing, the wide-panel Deluxe just before the 5D3. Its layout sheet prints a voltage chart (+360 V reservoir, +308 V screens, +280 V preamp, +18 V across the 6V6 cathode resistor). Used only for the supply-rail voltages the 5D3 sheet lacks. The two circuits share the power transformer class, the 5Y3GT rectifier, the 16/16/16 µF filter, both 10 kΩ droppers and the 6V6GT pair on its 250 Ω 5 W cathode resistor; the preamps differ entirely (a 6SC7 pair against a 12AY7 and a 12AX7). Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_5c3.pdf"
  - desc: "Fender, \"Deluxe\" Model 5D3 layout drawing, page 1. Supplies the order of parts on the eyelet board and the lead-by-lead wiring for the board-layout diagram on this page. That drawing is redrawn from the published facts, never traced."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_5d3.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Wide Panel Tweed Deluxe\". Supplies the production window for the wide-panel Deluxe models, the 5D3's one circuit change from the 5C3 (it drops the negative-feedback loop), and an output of 10–14 W for the wide-panel Deluxe, the range the 12 W recorded here falls in. The drawing itself prints no power rating."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-wide-panel-tweed-deluxe"
