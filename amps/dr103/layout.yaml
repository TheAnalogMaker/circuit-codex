# net_map — the reviewable data layer reconciling the drawn wiring with the DC
# netlist for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The four EL34 plates and the output transformer's primary centre tap
  # co-anchor to BP1: the netlist omits the OT primary DCR, so every plate node
  # and the centre tap collapse to the reservoir rail.
  anchors:
    T1.pa: BP1       # V5 + V6 plates -> OT primary, phase A
    T1.pb: BP1       # V7 + V8 plates -> OT primary, phase B
    T1.ct: BP1       # OT primary centre tap -> reservoir rail
    SPK: "0"         # speaker jack — OT-secondary DCR folded into ground (the NFB return)
    # netlist.cir models each 470 kΩ mixing resistor as returning straight to
    # ground (RM1/RM2 = G2B -> 0). On the board each one lands on its volume
    # control's wiper, and the control's track carries it to ground — the DC
    # bridge the netlist collapses. Declared here rather than drawn as a short.
    VR1.lug2: "0"    # Brilliant volume wiper — mixer return, grounded through the track
    VR2.lug2: "0"    # Normal volume wiper — mixer return, grounded through the track
  # Netlist elements realised off the board or by a control — reported in
  # coverage, never a failure (their nodes still have to check out).
  netlist_unplaced:
    RG1: "V1A grid leak — 1 MΩ chassis-mounted at the Brilliant input jacks, off the board"
    RG2: "V1B grid leak — 1 MΩ chassis-mounted at the Normal input jacks, off the board"
    RMV: "V3 driver grid return — realised through the master volume (VR6), which is the only DC path down from that grid, not a discrete board resistor"
