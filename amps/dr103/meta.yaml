sources:
  - desc: "Mark Huss, \"HIWATT / Late 60s Four-Input Preamp / Preamp from DR103 S/N 903\" (drawing rev. 1.0). Supplies every preamp value on this page. It is a published redraw taken from one specific amplifier, not a factory document, and no factory drawing of the four-input DR103 was found. The sheet prints no voltages. Not reproduced here; archived at the MHuss Hiwatt pages."
    url: "https://hiwatt.org/Schematics/DR103sn903pre.pdf"
  - desc: "Mark Huss (with updates from Jukka K.) and Brian Haberman, \"HIWATT DR103 LAYOUT, EARLY 1970'S\" (2007), a published wiring diagram. Supplies the output stage, the supply chain and the controls of the four-input amplifier (four input jacks in Normal and Brilliant pairs; seven controls: Normal Volume, Brilliant Volume, Bass, Treble, Middle, Presence and Master Volume), and a second reading of the preamp. Where it differs from the S/N 903 drawing, it differs in control values: 500 kΩ log volumes and bass, 250 kΩ linear treble and master, and a 100 kΩ linear middle, against the S/N 903 amp's 470 kΩ audio-taper pots and 220 kΩ treble and 22 kΩ middle. That is variation within the era, recorded rather than merged; this page documents the S/N 903 values. Not reproduced here."
    url: "https://hiwatt.org/Layouts/DR103hiwattlayout.pdf"
  - desc: "Biacrown Ltd, Hiwatt DR103 owner's manual (\"THIS MANUAL COVERS MODEL NUMBER DR103\", \"Manufactured in England by the Audio Brothers\"), with three dated factory sheets titled \"HIWATT DR103 POWER SUPPLY CIRCUIT DIAGRAM  Drawn 22/11/94  Issue 3.\", \"HIWATT DR103 PREAMPLIFIER CIRCUIT DIAGRAM  Drawn 19/05/95  Issue 4.  S/No. AB0309 Onwards\" and \"HIWATT DR103 OUTPUT STAGE CIRCUIT DIAGRAM  Drawn 25/04/94  Issue 1.\". These sheets document a later, two-input revision and are not the circuit modelled here: the Issue 4 preamp has one jack per channel, 470 kΩ volumes with a 220 kΩ linear master and a 100 kΩ linear middle, and labels every preamp tube ECC83. They are used for three things only. First, the bias figure \"BIAS (-38V)\" printed on the Issue 3 supply sheet, whose 1 kΩ / 1N5408 / 100 µF / 47 kΩ network is the one the early wiring diagram also shows. Second, the manual's DR103 SPECIFICATION page: \"Valve types: Output valves 4 x matched EL34 (6CA7); Preamp valves V1,V2,V3, 3 x ECC83 (12AX7)(7025); Preamp valve V4 1 x ECC81 (12AT7)(6201)\", \"Output power: 100W RMS (min) into 8 Ohms\", line voltages of 100, 117.5, 225 and 250 V AC, 330 W maximum consumption, and 4, 8 and 16 Ω speaker taps. Third, the two working voltages the Issue 4 sheet annotates: +160 V at the V1 plate, on a 220 kΩ load over the same shared 1.5 kΩ / 100 µF cathode this circuit uses, and +140 V at the second stage. The specification page and the Issue 4 drawing contradict each other on V4: the specification calls it an ECC81, while the drawing letters \"VALVES V1,V2,V3,V4 = ECC83\". The specification, the early wiring diagram and the S/N 903 drawing all agree on ECC81, so this page records ECC81. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Hiwatt/Hiwatt_100w_dr103.pdf"
  - desc: "Hiwatt, hand-drawn factory sheets archived with the DR504. The cross-reference for how far the preamp travelled across the line, and the only published Hiwatt HT figure read for this page. Page 2, headed \"HIWATT PREAMP AND DRIVE\", lists the models it covers (\"DR504 DR405 DR103 DR201 ALL COMBO'S\") and draws the same four-tube preamp and driver documented here. Page 3, headed \"POWER SUPPLY / DR504 SA212 SA112 SA115\" and signed \"HIWATT JULY 79\", prints 460 V at the HT node after the standby switch, the 100 Ω 5 W and 1 kΩ 1 W dropper chain to the second and third HT rails, and \"BIAS -36v\". The DR504 output-stage sheet in the same set names the transformers \"OUTPUT TRANSFORMER PARTRIDGE TG 6556 / TH 7551\" and the mains transformer \"PARTRIDGE TYPE TH 7550\". These are 50 W figures and are not claimed as DR103 values."
    url: "https://el34world.com/charts/Schematics/files/Hiwatt/Hiwatt_50w_dr504.pdf"
  - desc: "Wikipedia, \"Hiwatt\". The maker history behind this circuit. Dave Reeves trained in the Royal Air Force and worked at Mullard, was made redundant in 1966 and founded Hylight in September 1966. He built Sound City-branded amplifiers for Ivor Arbiter's shop, and \"Under the Hiwatt brand, Reeves' customized Sound City L100 amplifiers were renamed the DR103 Custom 100\". The DR201 and DR405 followed at bassist Glenn Cornick's urging. Partridge transformers gave the amplifiers their \"hi-fi\" character. From 1971 Harry Joyce, a certified government wirer, standardised the schematics and capped his output at forty amplifiers a month. Reeves died in 1981, and former employees carried on as Biacrown Ltd until the company folded in 1984."
    url: "https://en.wikipedia.org/wiki/Hiwatt"
  - desc: "Vintage Guitar, \"Ronnie Wood's '69 Hiwatt 100 DR103\". A dated, published example of the four-input DR103 in 1969: the evidence for the start of this page's era range."
    url: "https://www.vintageguitar.com/14871/ronnie-woods-69-hiwatt-100-dr103/"
  - desc: "Mullard/Philips, EL34 data sheet, January 1969 (\"A.F. Output Pentode\"). The anchor for the site's open (CC0) EL34 tube model and its octal basing: Va = 250 V, Vg2 = 250 V and Vg1 = −13.5 V give Ia = 100 mA, Ig2 = 14.9 mA, gm = 12.5 mA/V and µ(g1-g2) = 11."
    url: "https://frank.pocnet.net/sheets/010/e/EL34.pdf"
  - desc: "RCA, 12AT7 data sheet (March 1, 1954). The tabulated Class A1 characteristics behind the site's open (CC0) 12AT7 tube model, built only from published data and used for the ECC81 phase inverter: Va = 250 V with 200 Ω cathode bias gives Ia = 10 mA, gm = 5500 µmho and µ = 60; a second point, Va = 100 V with 270 Ω, gives 3.7 mA and 4000 µmho. Basing 9A."
    url: "https://frank.pocnet.net/sheets/049/1/12AT7.pdf"
  - desc: "RCA, Receiving Tube Manual RC-19 (1959), 12AX7 average characteristics. The two-point anchor for the site's open (CC0) 12AX7 tube model, used for the three ECC83 stages: Va = 250 V and Vg = −2 V give 1.2 mA at 1600 µmho; Va = 100 V and Vg = −1 V give 0.5 mA; µ = 100."
    url: "https://frank.pocnet.net/sheets/093/1/12AX7.pdf"
verification:
  status: draft   # Three independent reasons, each stated rather than tuned away.
                  # (1) NO published valve-voltage chart for this circuit was
                  # found, and no factory drawing of the four-input DR103 either;
                  # the preamp rests on published redraws, so every node in
                  # voltages.yaml carries chart: null and nothing is gated.
                  # (2) No DR103 drawing read here prints an HT figure, so the
                  # supply rail is DRIVEN at a stated assumption (480 V) rather
                  # than a measurement — see netlist.cir.
                  # (3) At the printed -38 V bias the v0 EL34 model returns about
                  # 95 mA per valve, roughly twice what these amplifiers are
                  # actually set to: a single-anchor fit extrapolated to a screen
                  # voltage 87% above its anchor. Reported, not tuned away.
# Day the circuit landed in the corpus (git history, amps/dr103/) — the feed's
