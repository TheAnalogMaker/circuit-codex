# Parts list for the four-input Hiwatt DR103 "Custom 100" — 100 W head, four
# inputs across two channels, 3x ECC83 + 1x ECC81 preamp, 4x EL34 output, silicon
# bridge rectifier. Preamp values are read from the S/N 903 four-input preamp
# drawing; the output stage, the supply and the control complement are read from
# the published early-1970s DR103 wiring diagram; the two transformer part
# numbers are the ones the factory Issue-1 and Issue-3 sheets letter on their own
# drawings. Designators follow the drawings' valve numbering (V1-V4 preamp,
# V5-V8 output) and are the ones netlist.cir uses.
notes: "Coupling and cathode-bypass capacitor VALUES are open at DC; those whose both leads land on named DC nodes are carried in the operating-point netlist so their board placement can be machine-checked, the rest are listed here for completeness only. Two honest caveats live in this list. (1) The S/N 903 drawing and the early-1970s wiring diagram disagree on four control values — the wiring diagram gives 500 kOhm log volumes and bass, 250 kOhm lin treble and master and a 100 kOhm lin middle where the S/N 903 amp carries 470 kOhm-A volumes, bass and master with a 220 kOhm treble and a 22 kOhm middle. The S/N 903 values are listed, because that is the drawing this entry's netlist follows; the variation is real and is recorded in notes.md rather than averaged away. (2) The transformer part numbers TH7549/2 and TH7548/5 are lettered on the factory sheets of 1994-95, which document a later revision of this amplifier; the four-input amplifiers of the Reeves era carried Partridge transformers, whose DR103 part numbers were not read on any drawing consulted here. The mains transformer, fuses, switches, neon, impedance selector and jack sockets are annotations on the drawings and are listed here without designators, as in the sibling entries."
