# Parts list — read from the published Bassman-Amp AB165 (D-FE) drawing.
# Reference designators follow the DC netlist where a part is modeled and are
# descriptive otherwise; once a redrawn schematic lands, pipeline/validate.py
# cross-checks every one of them against it in both directions.
# Values are the drawing's; its notice sets ½ W / 10 % resistors and 400 V caps
# unless marked otherwise.
notes: "The drawing shows one jack symbol per channel input pair; the chassis carries two per channel. The two bias-supply filter cans carry polarity marks but no printed value. The 6L6GC pair is simulated on the 6L6-family 5881 model (reference/tubes/5881.yaml), as amps/5f4 does for its 6L6G."
items:
  # --- Bass channel input (V1a) ---
  - { ref: R1b, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Bass input grid stopper (jack 1)" }
  - { ref: R2b, part: "Carbon comp resistor", value: "68 kΩ · ½ W",  role: "Bass input grid stopper (jack 2)" }
  - { ref: RGB1, part: "Carbon comp resistor", value: "1 MΩ · ½ W",  role: "Bass input grid leak" }
  - { ref: RLB1, part: "Carbon comp resistor", value: "100 kΩ · ½ W", role: "V1a plate load" }
  - { ref: CLB1, part: "Film capacitor",      value: "0.01 µF · 400 V", role: "Treble-cut shunt across the V1a plate load" }
  - { ref: RKB1, part: "Carbon comp resistor", value: "1.5 kΩ · ½ W", role: "V1a cathode bias" }
  - { ref: CKB1, part: "Electrolytic capacitor", value: "25 µF · 25 V", role: "V1a cathode bypass" }
