  - { ref: VRBB, part: "Audio-taper potentiometer", value: "250 kΩ-A", role: "Bass channel Bass" }
  - { ref: CBB2, part: "Coupling capacitor",  value: "0.1 µF",         role: "Bass-channel tone-stack middle-leg cap, slope node to the bass-pot foot" }
  - { ref: RSLB, part: "Carbon comp resistor", value: "8.2 kΩ · ½ W",  role: "Bass-channel tone-stack bleed resistor" }
  - { ref: CDEEP, part: "Coupling capacitor", value: "0.1 µF",         role: "DEEP cap, tone-stack ladder foot to the switch" }
