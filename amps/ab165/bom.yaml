  - { ref: VRTB, part: "Audio-taper potentiometer", value: "250 kΩ-A", role: "Bass channel Treble" }
  - { ref: RSB, part: "Carbon comp resistor", value: "100 kΩ · ½ W",   role: "Bass-channel tone-stack slope resistor" }
