# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ab165"
name_style: "Blackface Bassman-style"
family: blackface
era:
  start: 1965
  end: 1967
wattage: 50
tubes: [12AX7, 12AX7, 12AX7, 12AT7, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "silicon full-wave" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: tb
lineage:
  derived_from: ["aa864-bassman"]  # the revision this one supersedes on the same
                                   # blackface piggyback chassis. Reciprocal of
                                   # amps/aa864-bassman's influenced. The tweed
                                   # Bassman circuits share only the name.
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, MODEL \"BASSMAN-AMP AB165\" schematic (drawing code D-FE). Supplies every component value, the printed voltage chart, the 320-0-320 V power winding and the transformer part numbers (TR1 125P7D, or 125P7DX for export; TR2 125C1A choke; TR3 125A13A output). The bias supply's filter capacitor value (50 µF, 50 V) is lettered only on the layout page. The sheet's notice: values ±20 %, read to ground with an electronic voltmeter; all resistors ½ W 10 % and all capacitors at least 400 V unless specified; and \"when installing new 6L6's reset hum balance for min hum\". Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_ab165.pdf"
  - desc: "Wikipedia, \"Fender Bassman\". Supplies the AB165's dates and its 50 W rating. The AB165 drawing carries no date and prints no power rating. The circuit is placed around 1965 and carried into the early silverface (drip-edge) period, on the 50 W blackface piggyback chassis the AA864 introduced in 1964."
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
  - desc: "Fender, MODEL \"BASSMAN-AMP AB165\" LAYOUT (drawing code D-FE), one page at 200 ppi. Supplies the bias board's single electrolytic capacitor, lettered \"50 | 50\" with + and −, the value the schematic does not print; the 15K resistor and the two 10K legs at the 10K-L BIAS BALANCE control, as the schematic draws them; and the Bass channel's treble capacitor, lettered 330 on the board. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_ab165_layout.pdf"
verification:
  status: verified
  # Basis: the full tabulated voltage chart printed on the published
  # "Bassman-Amp AB165" (D-FE) drawing, ±20% as the sheet itself states (see
  # voltages.yaml `source`). One rail is driven at its printed +425 V and the
  # whole ladder below it is solved through the drawing's own droppers, so the
  # printed rail chain is a checked claim rather than an input. Nineteen nodes
  # gated, 0 failures; two printed plate figures excluded as `disputed` with
  # the arithmetic shown (see voltages.yaml and notes.md) — the same treatment
  # 5f4, 5f6 and jtm45 carry. The redrawn schematic and both board-layout
  # drawings are present and the drawn point-to-point wiring is proved
  # electrically equivalent to netlist.cir (layout.yaml: wiring_claim: verified).
  date: 2026-08-08
  max_deviation_pct: 19.7   # worst gated node (PPIB, the 12AT7 inverter's cold plate, tol 20%; PPIA is 17.0%) — inside the sheet's own convention but with little margin, so re-check this pair after any 12AT7 model refit. Every other gated node is inside 17%, the rails inside 4.4%, and the bias line exact
added: 2026-08-08
contributors: [TheAnalogMaker]

sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V3A: "unused — the D-FE layout page wires V3 pins 6, 7 and 8 only; pins 1, 2 and 3 are bare, and the schematic draws only V3B, the mixer/driver stage"
