sources:
  - desc: "Fender 'Bassman-Amp AB165' drawing (D-FE), title block read directly: 'FENDER MODEL \"BASSMAN-AMP AB165\"'. Every component value AND the printed voltage chart read from the published sheet. Complement three 7025 preamp bottles (a 12AX7 alias), one 12AT7 phase inverter, two 6L6GC, solid-state rectification (three series silicon diodes per leg off a 320-0-320 V winding). Bass and Normal channels each: two 68k input stoppers on a 1M leak, 100k plate load, 1.5k/25-25 cathode; two-knob tone stack (100k slope, 250k-A treble and bass, treble-wiper output) on a 1M-A volume; a second 7025 stage on 100k/1.5k. Bass channel adds a 0.01 uF shunt across its input-stage plate load, a 390 pF treble cap, an 8.2k tone-stack foot and a DEEP switch on a 0.1 uF; Normal channel a 250 pF treble cap, a 0.047 uF middle-leg cap, a 6.8k foot and a BRIGHT switch on 120 pF. Both second-stage plates reach a shared mixing node through 220k each; the mixer/driver 7025 (100k plate, 1.5k cathode, 470k grid leak) is returned to that node through 470k and coupled into it by 0.01 uF. 12AT7 long-tailed pair, both plate loads 100k 5% off +415 with 1M grid leaks to the tail junction, 470 Ohm to a 22k tail bypassed by 0.1-200, and a 220k from EACH plate back to the output plate rail. 6L6GC pair fixed-biased at -45 V through 220k-5% leaks and 1500 Ohm stoppers, 0.022 couplers, 470 Ohm-1W screens, grounded cathodes. 47k + 0.1 uF negative feedback from the speaker line to the inverter's hot grid. Rails +425/+415/+390/+320 on 70-350 (x2, with 220k-1W balancing), 20-525 (x3) and 8-450 cans through 1k-1W, 4.7k-1W and 27k-1W droppers, with the choke between the reservoir and the screen node and a standby switch ahead of it; bias supply 470 Ohm-1W + silicon diode + two unmarked cans + 10k/10k/15k around a 10 kOhm-L BIAS BALANCE control. Transformers TR1 125P7D (125P7DX export), TR2 125C1A choke, TR3 125A13A output. Notice: values +/-20 %, read to ground with an electronic voltmeter; all resistors 1/2 W 10 % and all capacitors at least 400 V unless specified; 'when installing new 6L6's reset hum balance for min hum'. Not reproduced here; archived at EL34World"
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_bassman_ab165.pdf"
  - desc: "Wikipedia, 'Fender Bassman' — the AB165 dates and the 50 W rating. The AB165 drawing itself carries no date and prints no power rating; the circuit is placed c. 1965 and carried into the early silverface (drip-edge) period, on the 50 W blackface piggyback chassis the AA864 introduced in 1964"
    url: "https://en.wikipedia.org/wiki/Fender_Bassman"
verification:
  status: draft   # Not a defect in the chart — the sheet prints a full tabulated
                  # chart, it was read whole, and verify_amps.py gates every
                  # non-disputed node with 0 failures and 0 warnings. Draft for
                  # two procedural reasons and one technical caveat:
                  # (1) Verified is the maintainer's to grant, never an agent's
                  # (AGENTS.md rule 4).
                  # (2) The redrawn schematic and both board-layout drawings
                  # landed after the data core; the layout carries
                  # wiring_claim: verified (its point-to-point wiring is proved
                  # equivalent to netlist.cir), but the circuit's own
                  # verification.status stays the maintainer's to grant.
                  # (3) Worst gated nodes are the two inverter plates at 17.0%
                  # and 19.7% against the sheet's own +/-20% — passing, but with
                  # almost no margin, so a later tube-model refit could tip them.
                  # The two `disputed` nodes are NOT a bar: 5f4, 5f6 and jtm45
                  # each carry disputed nodes and are verified.
