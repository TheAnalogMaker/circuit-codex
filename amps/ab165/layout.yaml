# Board layout — redrawn from the published Fender "Bassman-Amp AB165" layout
# drawing (D-FE). Part refs are the shared key into bom.yaml; the renderer reads
# each value and part type from there. A legible, schematic-style redraw of the
# board's principal components in the order the drawing shows them — never a
# trace or a dimensioned reproduction.
#
# The board reads left→right in the order of the chassis' own tube row
# (6L6GC · 6L6GC · 12AT7 · 7025 · 7025 · 7025): the output-tube grid network and
# the two local-feedback resistors at the left end, the long-tailed-pair phase
# inverter next, then the Normal channel, the mixer/driver, and the Bass
# Instrument channel at the right.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp and the PT / rectifier AC
# side are an excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 56
  title: "AB165 · eyelet board layout"
caption: "Redrawn from the published Fender 'Bassman-Amp AB165' layout drawing — principal board components, in the order the drawing shows them, following the chassis' own tube row. Both channels' tone-stack parts (slope resistors, treble and bass capacitors, bleed legs, the DEEP and BRIGHT capacitors) mount at the controls on the published sheet and are documented schematic-only here; so are the input grid stoppers and grid leaks at the jacks. The 470 Ω screen resistors and 1.5 kΩ grid stoppers are drawn where the sheet mounts them, at the output sockets, and the supply droppers are drawn as the chassis-mounted parts they are, with the filter cans and the rectifier / bias supply drawn minimally — the two 220 kΩ output-grid leaks return to one bias line here, as the simulated netlist models them, rather than to the separate taps either side of the BIAS BALANCE control that the schematic draws. The two 220 kΩ local-feedback resistors ride their own terminal strip on the published sheet and are drawn here on the board. The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6L6GC output tubes → 12AT7 inverter → the three 7025 preamp tubes) is routed as the published sheet shows it; the amplifier is solid-state rectified, so there is no rectifier heater. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Bassman-Amp AB165' layout drawing (D-FE), title block read directly: 'FENDER MODEL \"BASSMAN-AMP AB165\" LAYOUT'"
  url: "https://el34world.com/charts/Schematics/Files/Fender/Fender_bassman_ab165_layout.pdf"

parts:
  # --- output-tube grid network (left end, beside the two 6L6GC sockets) ---
  - { ref: C1,   a: [0, 0],  b: [0, 1] }    # .022 PI hot plate → V5 grid (PPIA→GO1)
  - { ref: RGL1, a: [0, 1],  b: [1, 1] }    # 220k V5 grid leak (GO1→ bias line)
  - { ref: C2,   a: [0, 3],  b: [0, 4] }    # .022 PI cold plate → V6 grid (PPIB→GO2)
  - { ref: RGL2, a: [0, 4],  b: [1, 4] }    # 220k V6 grid leak (GO2→ bias line)
  # --- the AB165 local-feedback pair: each output plate back to its inverter plate
  - { ref: RBSA, a: [0, 6],  b: [0, 7] }    # 220k V5 plate (BP1) → PPIA
  - { ref: RBSB, a: [0, 8],  b: [0, 9] }    # 220k V6 plate (BP1) → PPIB
  # --- negative feedback: speaker line → 47k → 0.1 µF → inverter hot grid ---
  - { ref: RNFB, a: [1, 7],  b: [1, 9] }    # 47k from the speaker line
  - { ref: CNFB, a: [1, 9],  b: [1, 11] }   # 0.1 µF in series (shares the 47k eyelet)
  # --- long-tailed-pair phase inverter (V4 12AT7) ---
  - { ref: RLPA, a: [0, 11], b: [0, 12] }   # 100k 5% hot plate load (BPI→PPIA)
  - { ref: RLPB, a: [0, 13], b: [0, 14] }   # 100k 5% cold plate load (BPI→PPIB)
  - { ref: RTAIL, a: [1, 12], b: [1, 13] }  # 470Ω joined cathodes → tail junction
  - { ref: RGPA, a: [0, 15], b: [1, 15] }   # 1M hot grid leak (GPIA→JPI)
  - { ref: RGPB, a: [0, 17], b: [1, 17] }   # 1M cold grid leak (GPIB→JPI)
  - { ref: RT2,  a: [0, 19], b: [1, 19] }   # 22k tail junction → ground
  - { ref: CPIB, a: [0, 20], b: [1, 20] }   # 0.1-200 cold grid → ground
  # --- Normal channel second stage (V2b) ---
  - { ref: RLN2, a: [0, 22], b: [0, 23] }   # 100k plate load (BD→PN2)
  - { ref: CKN2, a: [0, 24], b: [0, 25] }   # 25 µF cathode bypass (shares KN2)
  - { ref: RKN2, a: [0, 25], b: [1, 25] }   # 1.5k cathode (KN2→0)
  - { ref: RMXN, a: [0, 26], b: [0, 27] }   # 220k mixing resistor (PN2→MIX)
  # --- Normal channel input (V2a) ---
  - { ref: RLN1, a: [0, 29], b: [0, 30] }   # 100k plate load (BC→PN1)
  - { ref: CKN1, a: [0, 31], b: [0, 32] }   # 25 µF cathode bypass (shares KN1)
  - { ref: RKN1, a: [0, 32], b: [1, 32] }   # 1.5k cathode (KN1→0)
  # --- mixer / driver (V3b) ---
  - { ref: RFBM, a: [0, 33], b: [0, 34] }   # 470k driver plate → mixing node
  - { ref: CMIX, a: [0, 35], b: [0, 36] }   # .01 µF mixing node → driver grid
  - { ref: RGM,  a: [0, 36], b: [1, 36] }   # 470k grid leak (GM→0)
  - { ref: RLM,  a: [0, 38], b: [0, 39] }   # 100k plate load (BD→PM)
  - { ref: CKM,  a: [0, 40], b: [0, 41] }   # 25 µF cathode bypass (shares KM)
  - { ref: RKM,  a: [0, 41], b: [1, 41] }   # 1.5k cathode (KM→0)
  - { ref: CPIA, a: [0, 42], b: [0, 43] }   # 0.1 µF driver plate → PI hot grid
  # --- Bass Instrument channel second stage (V1b) ---
  - { ref: RLB2, a: [0, 44], b: [0, 45] }   # 100k plate load (BC→PB2 — see notes.md)
  - { ref: CKB2, a: [0, 46], b: [0, 47] }   # 25 µF cathode bypass (shares KB2)
  - { ref: RKB2, a: [0, 47], b: [1, 47] }   # 1.5k cathode (KB2→0)
  - { ref: RMXB, a: [0, 48], b: [0, 49] }   # 220k mixing resistor (PB2→MIX)
  # --- Bass Instrument channel input (V1a), with the treble-cut shunt ---
  - { ref: RLB1, a: [0, 51], b: [0, 53] }   # 100k plate load (BC→PB1)
  - { ref: CLB1, a: [1, 51], b: [1, 53] }   # .01 µF straight across that plate load
  - { ref: CKB1, a: [0, 54], b: [0, 55] }   # 25 µF cathode bypass (shares KB1)
  - { ref: RKB1, a: [0, 55], b: [1, 55] }   # 1.5k cathode (KB1→0)

