  - { id: SWDEEP, ref: SWDEEP, kind: switch, edge: top, at: 48.2, label: "Deep" }
  - { id: V1,   ref: V1,  kind: tube,  edge: bottom, at: 50,   label: "V1 · 7025 bass" }
