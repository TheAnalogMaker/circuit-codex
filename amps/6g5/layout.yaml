bus:
  - { from: [1.45, -0.5], to: [1.45, 50.5] }

# Wiring — read lead-by-lead from the published layout drawing where the
# board order is legible; the exact eyelet-level routing (via waypoints) is
# this archive's own redrawn idiom, never a trace. Endpoints reference board
# eyelets (REF.a/REF.b), tube socket pins (Vn.pinN, validated against basing),
# pot lugs, jacks, and transformer leads. Wire colours follow this era's
# standard Fender convention (red = B+, blue/brown = OT primary, green =
# heaters/OT secondary) — the scan's own colour print was not confidently
# legible at this resolution (see meta.yaml sources).
runs:
  # === BP1: reservoir/choke (off-board) arrives here; feeds the screen
  # dropper and the OT primary (anchored below). ================================
  - { from: CF4.a, to: RDSCR.a }
  - { from: TR2.red, to: CF4.a, color: red, via: [[9.4, -1.2], [0.4, -1.2]] }
  - { from: TR2.blue, to: V7.pin3, via: [[7.2, -0.5]] }
  - { from: TR2.brown, to: V8.pin3, via: [[10.725, -1.3], [8.9, -1.3], [8.863, -0.2], [8.4, 1.35]] }
  - { from: TR2.green, to: JSPK.tip, via: [[8.5, -1.9], [2.6, -1.9], [2.6, 0.9]] }
  - { from: JSPK.sleeve, to: [1.45, 2.1] }

  # === BP2 (screens): dropper output feeds both output tubes' screens ===========
  - { from: RDSCR.b, to: RSC1.a, via: [[2.6, 0.3], [4.4, 0.3]] }
  - { from: RSC1.a, to: RSC2.a, via: [[5.4, 0.35], [8.4, 0.35]] }
  - { from: CF5.a, to: RDSCR.b }

  # === output stage: screens, grids (G71/G72), cathodes =========================
  - { from: RSC1.b, to: V7.pin4, via: [[5.9, 1.6]] }
  - { from: RSC2.b, to: V8.pin4, via: [[10.57, 1.47]] }
  - { from: C1.b, to: V7.pin5, via: [[7.9, 1.5]] }
  - { from: C2.b, to: V8.pin5, via: [[11.7, 1.55]] }
  - { from: V7.pin8, to: [1.45, 6.3], via: [[6.472, 1.663]] }
  - { from: V8.pin8, to: [1.45, 10.3], via: [[10.5, 1.77]] }
  - { from: RGL1.b, to: RGL2.b, via: [[7.4, 1.15], [11.4, 1.15]] }

  # === PI plates (BP3), grids, cathode tail =====================================
  - { from: C1.a, to: V6.pin6, via: [[7.22, 3.15], [13.3, 3.15]] }
  - { from: RLA.a, to: V6.pin6, via: [[13, 1.62]] }
  - { from: RLA.b, to: RLB.b, via: [[13.5, 0.4], [14.5, 0.4]] }
  - { from: C2.a, to: V6.pin1, via: [[11, 2.65], [14.7, 2.65]] }
  - { from: RLB.a, to: V6.pin1, via: [[15.3, 1.7]] }
  - { from: RGA.a, to: V6.pin7, via: [[16.3, 1.55]] }
  - { from: RGB.a, to: V6.pin2, via: [[17.5, 1.565]] }
  - { from: V6.pin8, to: RTAIL.a, via: [[15.4, 2.35], [12.8, 2.35], [12.8, 1.2]] }
  - { from: V6.pin3, to: RTAIL.a, via: [[14.3, 1.3]] }
  - { from: RTAIL.b, to: RT2.b, via: [[14.5, 1.4], [15.5, 1.3], [17.5, 1.3]] }
  - { from: RGA.b, to: RT2.b, via: [[16.5, 0.7]] }
  - { from: RGB.b, to: RT2.b, via: [[17.6, 2]] }
  - { from: RT2.a, to: [1.45, 19] }

  # === driver (V5), off BDRV ====================================================
  - { from: RL5.a, to: V5.pin6, via: [[19.9, 1.62]] }
  - { from: V5.pin8, to: CK5.a, via: [[20.3, 1.62]] }
  - { from: CK5.a, to: RK5.a }
  - { from: CK5.b, to: [1.45, 21] }
  - { from: RK5.b, to: [1.45, 22] }
  - { from: V5.pin7, to: RG5.a, via: [[19.3, -0.6], [25, -0.6]] }

  # === channel-mixing node: both channels' 2nd-stage plates + driver grid =======
  - { from: RL1B.a, to: CMIX1.a, via: [[30.05, 0.05], [24, 0.3]] }
  - { from: CMIX1.b, to: RG5.a, via: [[24.7, 0.3]] }
  - { from: RL2B.a, to: CMIX2.a, via: [[38.05, -0.05], [22.7, -0.3], [22.7, 1.2]] }
