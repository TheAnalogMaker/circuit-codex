  - { ref: C1,   a: [1, 0], b: [1, 3] }     # .05 PI hot plate -> V7 grid
  - { ref: RSC1, a: [0, 2], b: [0, 3] }     # 470R-1W V7 screen stopper (BP1 -> S71)
  - { ref: RGL2, a: [0, 5], b: [1, 5] }     # 220k-5% V8 grid leak
  - { ref: C2,   a: [1, 5], b: [1, 8] }     # .05 PI cold plate -> V8 grid
  - { ref: RSC2, a: [0, 7], b: [0, 8] }     # 470R-1W V8 screen stopper
  # --- phase inverter (V5): plate loads, 47MM across the plates, tail ---
  - { ref: RLA,  a: [0, 10], b: [1, 10] }   # 82k-5% hot plate load (BC -> PPIA)
  - { ref: CPP,  a: [1, 10], b: [1, 12] }   # 47MM across the plates
  - { ref: RLB,  a: [0, 12], b: [1, 12] }   # 100k-5% cold plate load (BC -> PPIB)
  - { ref: RTAIL, a: [0, 14], b: [1, 14] }  # 820R: tail junction -> joined cathodes
  - { ref: RGA,  a: [0, 15], b: [1, 15] }   # 1M hot grid leak, from the tail junction
  - { ref: RGB,  a: [0, 16], b: [1, 16] }   # 1M cold grid leak, from the tail junction
  - { ref: RT2,  a: [0, 16], b: [0, 18] }   # 6.8k tail: junction -> foot node
  - { ref: RNFB, a: [0, 18], b: [1, 18] }   # 22k feedback: foot node -> OT secondary
  - { ref: CGB,  a: [0, 19], b: [1, 19] }   # .1-200 foot node -> cold grid
  - { ref: CPIN, a: [0, 20], b: [1, 20] }   # .001 recombining node -> hot grid
  # --- vibrato pair (V4): recombining 470ks, plate loads, grid returns, cathode ---
  - { ref: RMV1, a: [0, 22], b: [1, 22] }   # 470k PV1 -> VMIX
  - { ref: RMV2, a: [0, 23], b: [1, 23] }   # 470k PV2 -> VMIX
  - { ref: RLV1, a: [0, 24], b: [1, 24] }   # 100k BV -> PV1 (low band)
  - { ref: RLV2, a: [0, 25], b: [1, 25] }   # 100k BV -> PV2 (high band)
  - { ref: RGV1, a: [0, 26], b: [1, 26] }   # 1M GS -> GV1
  - { ref: RGV2, a: [0, 27], b: [1, 27] }   # 1M GS -> GV2
  - { ref: RKV,  a: [0, 28], b: [1, 28] }   # 4.7k joined cathodes -> ground
  - { ref: CKV,  a: [0, 29], b: [1, 29] }   # 2-25 cathode bypass
  # --- band-splitting filters off channel 1 ---
  - { ref: CV1,  a: [0, 30], b: [1, 30] }   # .01 low-pass node -> GV1
  - { ref: CLP,  a: [0, 31], b: [1, 31] }   # .005 low-pass node -> ground
  - { ref: RLP,  a: [1, 32], b: [0, 32] }   # 470k VIN -> low-pass node
  - { ref: CV2,  a: [0, 33], b: [1, 33] }   # 250MM high-pass node -> GV2
  - { ref: RHP1, a: [1, 34], b: [0, 34] }   # 220k VIN -> high-pass node
  - { ref: RHP2, a: [0, 35], b: [1, 35] }   # 220k high-pass node -> ground
  # --- oscillator (V3A, excluded from the DC model) and its output network ---
  - { ref: RWV,  a: [0, 36], b: [1, 36] }   # 1M Intensity wiper -> GV1
  - { ref: CTX,  a: [0, 37], b: [1, 37] }   # .1-200 Intensity hot end -> ground
  - { ref: CTOF, a: [0, 38], b: [1, 38] }   # .005 feed coupler
  - { ref: RTOF, a: [1, 39], b: [0, 39] }   # 4.7M feed from the oscillator plate
  - { ref: CTOP, a: [0, 40], b: [1, 40] }   # .03 oscillator plate -> ground
  - { ref: RTOP, a: [1, 41], b: [0, 41] }   # 470k BL -> oscillator plate
  - { ref: CTO3, a: [0, 42], b: [1, 42] }   # .02 ladder: plate -> node A
  - { ref: CTO1, a: [1, 43], b: [0, 43] }   # .01 ladder: node A -> node B
  - { ref: RTOG1, a: [0, 44], b: [1, 44] }  # 1M ladder node B -> oscillator cathode
  - { ref: CTO2, a: [0, 45], b: [1, 45] }   # .01 ladder: node B -> oscillator grid
  - { ref: RTOG2, a: [0, 46], b: [1, 46] }  # 1M oscillator grid leak
  - { ref: RTOK, a: [0, 47], b: [1, 47] }   # 4700 oscillator cathode
  - { ref: CTOK, a: [0, 48], b: [1, 48] }   # 25-25 oscillator cathode bypass
  # --- phase splitter (V3B) ---
  - { ref: RLS,  a: [1, 49], b: [0, 49] }   # 100k BL -> splitter plate
  - { ref: CPS,  a: [0, 50], b: [1, 50] }   # .25 splitter plate -> ground
  - { ref: CFS,  a: [0, 51], b: [1, 51] }   # .001 splitter plate -> grid
  - { ref: CGS,  a: [0, 52], b: [1, 52] }   # .05-200 splitter grid -> ground
  - { ref: RGS,  a: [0, 53], b: [1, 53] }   # 1M splitter grid leak
  - { ref: CSV,  a: [0, 54], b: [1, 54] }   # .05 splitter output coupler
  - { ref: RSV,  a: [0, 55], b: [1, 55] }   # 1M splitter output -> GV2
  - { ref: RKS,  a: [0, 56], b: [1, 56] }   # 1500 splitter cathode
  - { ref: CKS,  a: [0, 57], b: [1, 57] }   # 25-25 splitter cathode bypass
  # --- V2: both second stages ---
  - { ref: CC1D, a: [0, 58], b: [1, 58] }   # .05 channel-1 output (N1D -> VIN)
  - { ref: RLD1, a: [0, 59], b: [1, 59] }   # 6.8k rail A -> N1D
  - { ref: RL1B, a: [1, 59], b: [1, 60] }   # 100k N1D -> V2A plate
  - { ref: RL2B, a: [0, 62], b: [1, 62] }   # 220k rail A -> V2B plate
  - { ref: CC2D, a: [1, 62], b: [1, 63] }   # .05 channel-2 output coupler
  - { ref: RM2,  a: [1, 63], b: [0, 63] }   # 1M channel-2 mix -> VMIX
  - { ref: RK2,  a: [0, 65], b: [1, 65] }   # 820 V2 joined cathodes
  - { ref: CK2,  a: [0, 66], b: [1, 66] }   # 25-25
  # --- V1: both first stages ---
  - { ref: RK1,  a: [0, 68], b: [1, 68] }   # 820 V1 joined cathodes
  - { ref: CK1,  a: [0, 69], b: [1, 69] }   # 25-25
  - { ref: RL1A, a: [0, 71], b: [1, 71] }   # 100k rail A -> V1A plate
  - { ref: CC1T, a: [1, 72], b: [0, 72] }   # .05 V1A plate -> channel-1 tone network
  - { ref: RL2A, a: [0, 74], b: [1, 74] }   # 100k rail A -> V1B plate
  - { ref: CC2T, a: [1, 75], b: [0, 75] }   # .05 V1B plate -> channel-2 tone network
  # --- 68k input stoppers ---
  - { ref: R1H,  a: [0, 77], b: [1, 77] }   # channel 1, input 1
  - { ref: R1N,  a: [0, 78], b: [1, 78] }   # channel 1, input 2
  - { ref: R2H,  a: [0, 80], b: [1, 80] }   # channel 2, input 1
  - { ref: R2N,  a: [0, 81], b: [1, 81] }   # channel 2, input 2

