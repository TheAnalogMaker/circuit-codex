# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The push-pull OT primary: the netlist omits winding DCR, so both plate
  # leads and the centre tap collapse to BP1. The speaker jack: OT-secondary
  # DCR is likewise omitted, so the feedback resistor's far end reads as
  # ground at DC.
  anchors:
    TR2.blue: BP1
    TR2.brown: BP1
    TR2.red: BP1
    JSPK.tip: "0"
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out):
  netlist_unplaced:
    RG1A: "1M channel-1 leak at input 1 — mounted on the jack, as the page draws it"
    RG2A: "1M channel-2 leak at input 1 — mounted on the jack"
    RG1B: "volume pot VRV1, modelled as a grid-leak (G1B -> 0)"
    RG2B: "volume pot VRV2, modelled as a grid-leak (G2B -> 0)"
  # Sheet parts this board does not place, each for a reason the page gives.
  not_on_board:
    CF3: "reservoir can — in the filter pack, which the page sends the rails to rather than drawing"
    CF4: "20 µF can at the post-choke node — in the filter pack"
    CF5: "20 µF can at the phase-inverter supply — in the filter pack"
    CF6: "20 µF can at rail A — in the filter pack"
    CF7: "20 µF can at the vibrato-pair supply — in the filter pack"
    CF8: "20 µF can at the oscillator supply — in the filter pack"
    L1: "choke — chassis-mounted iron"
    D1: "HT rectifier — on the page's separate rectifier and bias sub-board"
    D2: "HT rectifier — on the rectifier and bias sub-board"
    D3: "HT rectifier — on the rectifier and bias sub-board"
    D4: "HT rectifier — on the rectifier and bias sub-board"
    D5: "HT rectifier — on the rectifier and bias sub-board"
    D6: "HT rectifier — on the rectifier and bias sub-board"
    DBIAS: "bias rectifier — on the rectifier and bias sub-board"
    CBIAS: "bias filter — on the rectifier and bias sub-board"
    CBIAS2: "bias filter — on the rectifier and bias sub-board"
    RBIAS1: "bias bleeder — on the rectifier and bias sub-board"
    RBIAS2: "bias series resistor — on the rectifier and bias sub-board"
    F1: "mains fuse — chassis-mounted"
