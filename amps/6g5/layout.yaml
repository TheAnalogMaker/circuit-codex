# Board layout — redrawn from the published Fender Pro-Amp Model 6G5 layout
# drawing (A-FJ, page 2 of the archived PDF). Part refs are the shared key
# into bom.yaml; the renderer reads each value and part type from there. A
# legible, schematic-style redraw of the board's principal DC-relevant
# components — never a trace or a dimensioned reproduction.
#
# The board reads left->right: power/output at the left end (screen dropper,
# 6L6GC pair), the phase inverter and driver in the middle, the tremolo
# oscillator (excluded — its own network mounts at the Speed/Intensity pots,
# not drawn on the board, matching this corpus's other photocell-tremolo
# entries), and the two full preamp channels at the right — the same general
# shape the published layout sheet shows (rectifier/output toward the power
# end, preamp row continuing across). The bridge rectifier, reservoir and
# choke mount on their own small sub-board on the real chassis (visible as a
# separate box on the published sheet) and are not drawn on this eyelet
# strip — BP1 is the board's own starting point, matching netlist.cir's own
# treatment of BP1 as driven rather than derived. RD1/RD2 (the 56k/10k
# dropper toward the phase-inverter/driver/preamp supplies) are schematic-only
# for the same reason netlist.cir doesn't model them: their real fan-out
# could not be resolved from the scan (see notes.md), and drawing them tied
# into BP3/BDRV/BD here would assert a physical bridge the DC model
# explicitly does not carry. Each channel's tone network is drawn where the
# published sheet mounts it: the .05 coupler on the board beside the
# first-stage plate load, and the 250MM treble cap and 100K slope at the
# Treble pot, the .01 and 10K at the Bass pot, the 47MM bright cap at the
# Volume pot — chassis-mounted parts on the panel row, wired lug to lug as
# the sheet draws them (none of them carries a DC node the netlist checks).
# The driver's local feedback network stays schematic-only.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo
# oscillator, and the pre-BP1 power supply are an excluded annotation layer.
wiring_claim: verified

board:
  rows: 2
  cols: 51
  title: "6G5 · eyelet board layout"
caption: "Redrawn from the published Fender Pro-Amp Model 6G5 layout drawing — principal DC-relevant board components, in the same left-to-right shape the published sheet shows (power/output toward one end, the preamp row continuing across). The bridge rectifier, reservoir and choke mount on their own small sub-board on the real chassis (a separate box on the published sheet) and are not drawn here; BP1 is this board's own starting point. Each channel's tone network is drawn where the published sheet mounts it — the 0.05 µF coupler on the board beside the first-stage plate load, the 250 pF and 100 kΩ at the Treble pot, the 0.01 µF and 10 kΩ at the Bass pot, the 47 pF bright capacitor at the Volume pot — none of it carrying a DC node the netlist checks. The driver's local feedback network is documented schematic-only. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Pro-Amp' Model 6G5 layout drawing (A-FJ), page 2 of the archived PDF"
  url: "https://schematicheaven.net/fenderamps/pro_6g5_schem.pdf"

parts:
  # --- power / screens (BP1, BP2) ---
  - { ref: CF4, a: [0, 0], b: [1, 0] }      # 20 uF BP1 filter
  - { ref: RDSCR, a: [0, 1], b: [0, 2] }    # 4.7k-1W screen dropper (BP1 -> BP2)
  - { ref: CF5, a: [0, 3], b: [1, 3] }      # 20 uF BP2 filter
  # --- output stage (6L6GC pair V7/V8) ---
  - { ref: RSC1, a: [0, 4], b: [0, 5] }     # 470R-1W V7 screen stopper (BP2 -> S71)
  - { ref: C1,   a: [0, 6], b: [0, 7] }     # .05u PI hot plate -> V7 grid (PPIA -> G71)
  - { ref: RGL1, a: [0, 7], b: [1, 7] }     # 220k-5% V7 grid leak (G71 -> -55V), shares G71 eyelet
  - { ref: RSC2, a: [0, 8], b: [0, 9] }     # 470R-1W V8 screen stopper (BP2 -> S72)
  - { ref: C2,   a: [0, 10], b: [0, 11] }   # .05u PI cold plate -> V8 grid (PPIB -> G72)
  - { ref: RGL2, a: [0, 11], b: [1, 11] }   # 220k-5% V8 grid leak (G72 -> -55V), shares G72 eyelet
  # --- long-tailed-pair phase inverter (V6) ---
  - { ref: RLA, a: [0, 12], b: [0, 13] }    # 82k-5% hot plate load (BP3 -> PPIA)
  - { ref: RLB, a: [0, 14], b: [0, 15] }    # 100k-5% cold plate load (BP3 -> PPIB)
  - { ref: RGA, a: [0, 16], b: [1, 16] }    # 1M hot grid leak (GPIA -> JPI)
  - { ref: RGB, a: [0, 17], b: [1, 17] }    # 1M cold grid leak (GPIB -> JPI)
  - { ref: RTAIL, a: [1, 13], b: [1, 14] }  # 820R shared tail (KPI -> JPI)
  - { ref: RT2, a: [0, 18], b: [1, 18] }    # 6.8k tail junction -> ground (JPI -> 0)
  # --- driver (V5) ---
  - { ref: RL5, a: [0, 19], b: [0, 20] }    # 100k plate load (BDRV -> P5)
  - { ref: CK5, a: [0, 21], b: [1, 21] }    # 25 uF cathode bypass, parallel to RK5 (K5 -> 0)
  - { ref: RK5, a: [0, 22], b: [1, 22] }    # 820R cathode (K5 -> 0)
  # --- channel-mixing node (both channels' 2nd-stage plates + driver grid leak) ---
  - { ref: CMIX1, a: [0, 23], b: [0, 24] }  # .05u P1B -> mixing node
  - { ref: CMIX2, a: [1, 23], b: [1, 24] }  # .05u P2B -> mixing node
  - { ref: RG5, a: [0, 25], b: [1, 25] }    # 1M mixing-node leak (MIXG -> 0), also V5's grid leak
  # --- channel 1 (Normal, V1) ---
  - { ref: RL1A, a: [0, 26], b: [0, 27] }   # 100k plate load, 1st stage (BD -> P1A)
  - { ref: CC1T, a: [0, 26], b: [1, 26] }   # .05 coupler standing at the P1A eyelet, foot -> the tone network
  - { ref: CK1A, a: [0, 28], b: [1, 28] }   # 25+25 uF cathode bypass, parallel to RK1A (K1A -> 0)
  - { ref: RK1A, a: [0, 29], b: [1, 29] }   # 820R cathode (K1A -> 0)
  - { ref: RL1B, a: [0, 30], b: [0, 31] }   # 100k plate load, 2nd stage (BD -> P1B)
  - { ref: CK1B, a: [0, 32], b: [1, 32] }   # 25 uF cathode bypass, informational, parallel to RK1B (K1B -> 0)
  - { ref: RK1B, a: [0, 33], b: [1, 33] }   # 1.5k cathode, informational (K1B -> 0)
  # --- channel 2 (Bright, V2) — mirrors channel 1 ---
  - { ref: RL2A, a: [0, 34], b: [0, 35] }
  - { ref: CC2T, a: [0, 34], b: [1, 34] }   # .05 coupler standing at the P2A eyelet, as CC1T
  - { ref: CK2A, a: [0, 36], b: [1, 36] }
  - { ref: RK2A, a: [0, 37], b: [1, 37] }
  - { ref: RL2B, a: [0, 38], b: [0, 39] }
  - { ref: CK2B, a: [0, 40], b: [1, 40] }
  - { ref: RK2B, a: [0, 41], b: [1, 41] }

