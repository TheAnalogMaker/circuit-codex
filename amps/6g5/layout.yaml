  - { from: VRV1.lug3, to: CBR1.a, via: [[27.35, -0.62], [25.81, -0.62]] }
  - { from: CBR1.b, to: VRV1.lug2, via: [[26.59, -0.5], [26.9, -0.55]] }

  # === Bright-channel tone network, as the A-FJ sheet mounts it ==================
