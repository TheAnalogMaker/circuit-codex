# Ground bus — the bare rail just below the bottom eyelet row.
bus:
  - { from: [1.45, -0.5], to: [1.45, 82.5] }

# Wiring — endpoints are read from the circuit; the eyelet-level routing (via
# waypoints) is this archive's own redrawn idiom, never a trace. Wire colours
# follow this era's standard Fender convention (red = B+, blue/brown = OT
# primary, green = heaters/OT secondary).
runs:
  # === BP1: the post-choke node — screens, the OT centre tap, and the two
  # droppers that start the chain ===========================================
  - { from: TR2.red, to: RSC1.a, color: red, via: [[1.6, -0.3]] }
  - { from: RSC1.a, to: RSC2.a, color: red, via: [[2.4, -0.3], [6.6, -0.3]] }
  - { from: RSC2.a, to: RD1.a, color: red }
  - { from: RD1.a, to: RD3.a, color: red, via: [[7.6, -0.55], [10.01, -0.55]] }
  # === the dropper chain: BC (PI), BA (rail A), BV (vibrato pair), BL (osc) ==
  - { from: RD1.b, to: RD2.a, color: red }
  - { from: RD1.b, to: RLA.a, color: red }
  - { from: RLA.a, to: RLB.a, color: red, via: [[10.4, -0.3], [11.6, -0.3]] }
  - { from: RD2.b, to: RLD1.a, color: red, via: [[9.39, -0.8], [59, -0.8]] }
  - { from: RLD1.a, to: RL2B.a, color: red, via: [[59.4, -0.1], [61.6, -0.1]] }
  - { from: RL2B.a, to: RL1A.a, color: red, via: [[62.4, -0.1], [70.6, -0.1]] }
  - { from: RL1A.a, to: RL2A.a, color: red, via: [[71.4, -0.1], [73.6, -0.1]] }
  - { from: RD3.b, to: RD4.a, color: red }
  - { from: RD3.b, to: RLV1.a, color: red, via: [[10.79, -0.76], [24, -0.76]] }
  - { from: RLV1.a, to: RLV2.a, color: red }
  - { from: RD4.b, to: RTOP.a, color: red, via: [[12.19, -0.72], [40.6, -0.72], [40.6, 1.22]] }
  - { from: RTOP.a, to: RLS.a, color: red, via: [[41.4, 1.22], [48.6, 1.22]] }

  # === output stage ============================================================
  - { from: TR2.blue, to: V7.pin3, via: [[4.5, -0.2], [4.5, 1.785]] }
  - { from: TR2.brown, to: V8.pin3, via: [[9, -0.06], [9, 1.726]] }
  - { from: TR2.green, to: JSPK.tip, via: [[13, -0.15], [13, 1.198]] }
