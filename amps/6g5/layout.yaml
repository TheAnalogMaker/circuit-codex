# Board layout — redrawn from the published Fender Pro-Amp Model 6G5 layout
# drawing (A-FJ, page 2 of the archived PDF). Part refs are the shared key
# into bom.yaml; the renderer reads each value and part type from there. A
# legible, schematic-style redraw of the board in the order the layout page
# shows it — never a trace or a dimensioned reproduction.
#
# The board reads left->right as the page does: the output couplers and grid
# leaks at the power end, the phase inverter's plate loads and tail, then the
# vibrato pair's network (its plate loads and recombining 470ks, the two grid
# returns, the joined cathode pair, and the low- and high-band filters), the
# oscillator and splitter network, V2's and V1's parts, and the four 68k input
# stoppers at the input end — above the socket row V7, V8, V5, V4, V3, V2, V1.
# The page mounts the tone parts at each channel's pots, the Speed control's
# 100k at the Speed pot, the Intensity wiper's .05-200 at the Intensity pot,
# and the 1500 tail-foot resistor and .1-200 Presence capacitor at the
# Presence pot; they are drawn there. It sends the rails "TO FILTER PACK"
# rather than drawing the droppers, which ride with the 20 uF cans in the
# filter pack under the chassis; the four droppers are drawn as off-board
# parts on that side of the board, the cans are not drawn.
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this
# file and docs/layout-schema.md. Heaters, the pilot lamp and the pre-BP1
# power supply are an excluded annotation layer.
wiring_claim: verified

board:
  rows: 2
  cols: 83
  title: "6G5 · eyelet board layout"
caption: "Redrawn from the published Fender Pro-Amp Model 6G5 layout drawing — the eyelet board in the order the page shows it: output couplers and grid leaks at the power end, the phase inverter, the harmonic vibrato's pair and filters, the oscillator and splitter, the two stages of each channel on V2 and V1, and the 68 kΩ input stoppers at the input end. Parts the page mounts at the controls are drawn there — each channel's tone network, the Speed control's 100 kΩ, the Intensity wiper's 0.05 µF, and the Presence control's 1.5 kΩ tail-foot resistor and 0.1 µF. The four dropper resistors ride with the filter cans in the filter pack, which the page does not draw; they are shown off the board, the cans are not. The rectifier and bias sub-board is not drawn. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Pro-Amp' Model 6G5 layout drawing (A-FJ), page 2 of the archived PDF"
  url: "https://schematicheaven.net/fenderamps/pro_6g5_schem.pdf"

parts:
