  - { from: JN2.tip, to: V2.pin7, via: [[46.6, -1.4], [37.4, -1.4]] }
  - { from: V2.pin8, to: CK2A.a, via: [[35.6, 2.5], [35.6, 0.6]] }
  - { from: CK2A.a, to: RK2A.a }
  - { from: CK2A.b, to: [1.45, 35.3] }
  - { from: RK2A.b, to: [1.45, 37] }

  # === channel 2 — 2nd stage =====================================================
  - { from: RL2B.a, to: V2.pin1, via: [[39.4, 2.3]] }
  - { from: VRV2.lug2, to: V2.pin2, via: [[38.8, -0.44], [39.5, -0.12], [39.5, 1.68], [36.2, 1.68], [36.3, 2.07]] }
