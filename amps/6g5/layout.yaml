  - { from: VRT2.lug2, to: VRV2.lug3, via: [[41.4, -0.4], [39.11, -0.4]] }
  - { from: VRV2.lug3, to: CBR2.a, via: [[38.75, -0.62], [37.21, -0.62]] }
  - { from: CBR2.b, to: VRV2.lug2, via: [[37.99, -0.5], [38.3, -0.55]] }

  # === BD backbone: ties channel 1 and channel 2's B+ taps into one node ========
  - { from: RL1B.b, to: RL2A.b, via: [[31.5, 0.4], [34.5, 0.4]] }

  # === vibrato pedal jack — footswitch, DC-inert (V3 fully excluded) ============
  - { from: JVIB.tip, to: [1.45, 49.3] }
  - { from: JVIB.sleeve, to: [1.45, 49.9] }

  # === 6.3 V heater chain (twisted pair) =========================================
  # PT green pair -> pilot lamp -> V7 -> V8 -> V6 -> V5 -> V3 -> V1 -> V2, the
  # board's own left-to-right order. Octal power-tube heater pins 2/7; noval
  # preamp-tube heater pins 4/5 (9 = centre tap, tied off at the last tube).
  - { from: TR1.green1, to: PL1.a, style: twisted }
  - { from: PL1.b, to: V7.pin7, style: twisted, via: [[-1, 3.4], [6, 3.4]] }
  - { from: V7.pin2, to: V8.pin7, style: twisted, via: [[6, 3.4], [10, 3.4]] }
  - { from: V8.pin2, to: V6.pin4, style: twisted, via: [[10, 3.4], [15, 3.4]] }
  - { from: V6.pin5, to: V5.pin4, style: twisted, via: [[15, 3.42], [20.5, 3.42]] }
  - { from: V5.pin5, to: V3.pin4, style: twisted, via: [[20.5, 3.44], [24.5, 3.44]] }
  - { from: V3.pin5, to: V1.pin4, style: twisted, via: [[24.5, 3.46], [29.5, 3.46]] }
  - { from: V1.pin5, to: V2.pin4, style: twisted, via: [[29.5, 3.48], [37.5, 3.48]] }
  - { from: V2.pin4, to: V2.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The tremolo oscillator is a running phase-shift oscillator with no static
  # DC operating point (excluded from netlist.cir — see notes.md), so it
  # cannot be a quiescent stage the equivalence check verifies. Declared here
  # so its socket is an annotation-layer exclusion, printed loudly like a
  # rectifier, never a silently-dropped tube.
  excluded_tubes:
    V3: "7025 tremolo phase-shift oscillator — no static DC operating point (excluded from netlist.cir; its own network mounts at the Speed/Intensity pots, not drawn on the board). Its 6.3 V heater is on the twisted chain; no signal pin is DC-checked."
  # The push-pull OT primary: the netlist omits winding DCR, so both plate
  # leads and the centre tap collapse to BP1. The speaker jack: OT-secondary
  # DCR is likewise omitted, and the NFB path (speaker -> PI tail foot, AC-
  # only) reads as ground at DC.
  anchors:
    TR2.blue: BP1
    TR2.brown: BP1
    TR2.red: BP1
    JSPK: "0"
  # Netlist elements with no discrete same-named board part — reported in
  # coverage, never a failure (their nodes still have to check out):
  netlist_unplaced:
    RG1A: "1M Normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RG2A: "1M Bright-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RG1B: "volume pot VRV1, modelled as a grid-leak (G1B -> 0)"
    RG2B: "volume pot VRV2, modelled as a grid-leak (G2B -> 0)"
