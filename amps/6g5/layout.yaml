  - { from: CK1A.b, to: [1.45, 27.3] }
  - { from: RK1A.b, to: [1.45, 29] }

  # === channel 1 — 2nd stage =====================================================
  - { from: RL1B.a, to: V1.pin1, via: [[31.4, 2.3]] }
  - { from: VRV1.lug2, to: V1.pin2, via: [[27.4, -0.44], [26.7, -0.12], [26.7, 0.9], [28.3, 1.75]] }
