# Printed voltages read directly from the published Fender "Pro-Amp" Model 6G5
# drawing (A-FJ): the schematic page prints the stage pins and three rails, and
# the companion layout page prints the same pins at each socket plus every
# rail the dropper chain produces. The schematic's notice reads "Voltages read
# to ground with electronic voltmeter. Values shown + or -"; the layout page
# completes it as "+ or - 20%". Tube pins therefore get 20%; rails get tighter
# internal targets.
#
# Only BR (+460 V, ahead of the choke, where the output transformer's centre
# tap lands), BP1 (+458 V, after it) and the -55 V bias line are driven.
# Every other node below is solved through resistors the drawing letters.
source: "Fender Pro-Amp Model 6G5 drawing (A-FJ). Schematic page: +460 (after
  the standby switch), +458 (after the choke; screens and droppers), +456 (6L6GC
  plates), +430 (phase-inverter supply), +315/+310 (phase-inverter plates),
  +320/+320 and +3.3 (vibrato pair plates and joined cathodes), +130 and +1.3
  (vibrato oscillator plate and cathode — excluded, reported here only),
  +180 and +1.5 (the oscillator's phase splitter), +170/+1.4 (both first
  stages, cathodes joined), +160 (channel 1 second stage), +120 (channel 2
  second stage), +1.1 (the second stages' joined cathodes), -55 (fixed bias,
  a rotated label beside the output grid leaks). Layout page, in addition:
  +350 (vibrato-pair supply), +275 (oscillator and splitter supply), +260
  (rail A, both channels), +23 (phase-inverter cathodes)."
nodes:
  BC:   { chart: 430, tol_pct: 8, note: "phase-inverter supply, after the 4.7 kΩ · 1 W dropper from the post-choke node — printed on both pages" }
  BA:   { chart: 260, tol_pct: 10, note: "rail A, after a 56 kΩ · 1 W dropper from the +430 V node; it feeds all four channel plate loads. Printed on the layout page only" }
  BV:   { chart: 350, tol_pct: 10, note: "vibrato-pair supply, after a 56 kΩ · 1 W dropper from the post-choke node. Printed on the layout page only. Simulates a few volts high: the oscillator's own draw, which also passes through this dropper, is not modelled (see the next node)" }
  BL:   { chart: 275, tol_pct: 10, note: "supply for the oscillator's 470 kΩ and the splitter's 100 kΩ, after a second 56 kΩ · 1 W dropper. Printed on the layout page only, as a small vertical label; the units digit is the least certain glyph, and the 10% band holds any reading of it. Simulates about 9% high because the oscillator is excluded from the model and its running draw with it — about 0.3 mA on the chart's own +130 V plate reading. With a 0.31 mA sink standing in for it, this node lands at 275 V and the vibrato-pair supply at 346 V" }
  P1A:  { chart: 170, tol_pct: 20, note: "channel-1 first stage plate (V1, 100 kΩ load off rail A)" }
  P2A:  { chart: 170, tol_pct: 20, note: "channel-2 first stage plate (V1's other section, 100 kΩ load off rail A)" }
  K1:   { chart: 1.4, tol_pct: 20, note: "both first stages' joined cathodes over one 820 Ω / 25 µF pair (the drawing's boxed C)" }
  P1B:  { chart: 160, tol_pct: 20, note: "channel-1 second stage plate (V2): 100 kΩ, then a 6.8 kΩ decoupling resistor to rail A, output taken between them" }
  P2B:  { chart: 120, tol_pct: 20, note: "channel-2 second stage plate (V2's other section): a single 220 kΩ load off rail A — the reason it prints lower than channel 1" }
  K2:   { chart: 1.1, tol_pct: 20, note: "both second stages' joined cathodes over one 820 Ω / 25 µF pair (the drawing's boxed D)" }
  PV1:  { chart: 320, tol_pct: 20, note: "vibrato pair, low-band section plate (V4, 100 kΩ load off the vibrato-pair supply)" }
  PV2:  { chart: 320, tol_pct: 20, note: "vibrato pair, high-band section plate" }
  KV:   { chart: 3.3, tol_pct: 20, note: "vibrato pair's joined cathodes over 4.7 kΩ / 25 µF" }
  PS:   { chart: 180, tol_pct: 20, note: "oscillator's phase splitter plate (V3, 100 kΩ load). Reads high with its supply — see BL" }
  KS:   { chart: 1.5, tol_pct: 20, note: "phase splitter cathode over 1.5 kΩ / 25 µF" }
  PPIA: { chart: 315, tol_pct: 20, note: "phase-inverter plate, 82 kΩ (hot) side" }
  PPIB: { chart: 310, tol_pct: 20, note: "phase-inverter plate, 100 kΩ (cold) side" }
  KPI:  { chart: 23, tol_pct: 20, note: "phase-inverter joined cathodes, above the 820 Ω — printed at the socket on the layout page only" }
  JPI:  { chart: null, note: "phase-inverter tail junction (820 Ω / 6.8 kΩ), the grid-leak return — printed on neither page" }
  S71:  { chart: 458, tol_pct: 10, note: "6L6GC (V7) screen after its 470 Ω · 1 W stopper. The drawing prints +458 V at the post-choke node the screens hang from; the model drives that node at the printed +458 V" }
  S72:  { chart: 458, tol_pct: 10, note: "6L6GC (V8) screen after its own 470 Ω · 1 W stopper — same basis as S71" }
  G71:  { chart: -55, tol_pct: 8, note: "6L6GC (V7) grid, fixed bias via 220 kΩ from the -55 V supply" }
  G72:  { chart: -55, tol_pct: 8, note: "6L6GC (V8) grid, fixed bias via 220 kΩ from the -55 V supply" }
