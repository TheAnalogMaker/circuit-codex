# Printed voltage chart read directly from the published Fender "Pro-Amp"
# Model 6G5 drawing (A-FJ). The drawing's notice: "Voltages read to ground with
# electronic voltmeter. Values shown + or -" (the layout sheet separately states
# the era's usual +/-20% convention). Tube pins therefore get 20%; the driven /
# derived rails get tighter targets where the reading is confident.
#
# This entry is DRAFT (see meta.yaml and notes.md): the drawing's exact preamp
# and driver-stage supply topology could not be fully resolved from the scan,
# and one bias-related label (-55 V) is a tight rotated print read with lower
# confidence than the horizontal rail figures. Every node below that carries a
# real chart value is still reported, at wider tolerance where the modelling is
# approximate — draft status means a deviation warns, never fails (see
# pipeline/verify_amps.py); nothing here is hidden, only unproven.
source: "Fender Pro-Amp Model 6G5 drawing (A-FJ), printed voltages: +460 (B+
  reservoir, silicon bridge), +456 (6L6GC plates), +430 (screens), +320 (driver
  plate), +315/+310 (phase-inverter plates), +170/+1.4 (channel first-stage
  plate/cathode, both channels), +160 (channel-1 second-stage plate), +120
  (channel-2 second-stage plate), +120/+1.5 (tremolo oscillator, excluded),
  -55 (fixed bias, read from a rotated vertical label beside the two 220k-5%
  output grid leaks)"
