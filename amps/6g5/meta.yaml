lineage:
  derived_from: ["5e5a"]  # the narrow-panel tweed Pro:
                          # this brown circuit is a direct redesign of it (fixed bias
                          # and the Presence control carry over; the tube rectifier
                          # gives way to silicon, the cathodyne to a long-tailed pair,
                          # and tremolo is added), not an independent design.
                          # Reciprocal of amps/5e5a's influenced: ["6g5"].
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender 'Pro-Amp' Model 6G5 drawing (A-FJ), schematic + layout: component
      values AND the printed voltage chart read directly from the published sheet.
      Rails: +460 V reservoir (silicon bridge, 4 diodes off a single HT secondary,
      no tube rectifier) -> choke -> +456 V (6L6GC plates, OT primary DCR omitted,
      and screens via a shared 4700 Ohm-1W dropper) -> +430 V screens node -> 56k-1W
      + 10k droppers -> phase-inverter/driver supply (+320 V driver plate, +315 V /
      +310 V phase-inverter plates); fixed bias read as -55 V (vertical print beside
      the two 220k-5% output-grid leaks — a tight, hand-lettered rotated label; the
      sheet gives no separate bias test point, so this reading carries a wider
      margin than the horizontally-printed rail values, flagged in notes.md).
      Preamp: two mirrored channels (Normal, Bright), each two 7025 stages -
      first stage 100k plate / 820 Ohm cathode (25+25 uF split bypass) reading
      +170 V / +1.4 V, into a Bass-Treble tone stack and a Volume pot, into a
      second 100k-plate stage reading +160 V (channel 1) / +120 V (channel 2) as
      printed - both channels sum at a shared node ahead of the tremolo optocoupler
      and a driver stage (100k plate, +320 V). Long-tailed-pair inverter: 82k /
      100k 5% plate loads off the +315/+310 V rail, 820 Ohm shared cathode into a
      6.8k tail, with a 56k negative-feedback resistor and a 5k-L Presence pot at
      the tail foot (both AC-only, DC-neutral, omitted from the DC model). Output:
      two 6L6GC, grounded cathodes, 470 Ohm-1W individual screen stoppers, 220k-5%
      fixed-bias grid leaks. Tremolo: ONE 7025 phase-shift oscillator (Speed on a
      4M-RA control, cathode 1500 Ohm/25+25 uF, plate +120 V) driving a lamp/
      photoresistor pair (Intensity control) that shunts the channel-mixing node to
      ground - a running oscillator with no static DC operating point, excluded
      from the netlist exactly as the corpus's other photocell/phase-shift trem
      circuits are (see amps/ab763). This reading is a photocell (optical) tremolo,
      NOT harmonic vibrato — the drawing shows a lamp-and-photoresistor pair wired
      in the audio path, the classic Fender optocoupler circuit, not the phase-
      mixed dual-triode network 'harmonic vibrato' names; a secondary field guide's
      'harmonic vibrato' label for this model is not followed here (hard rule 1:
      read the published drawing, not a secondary description). Notice on the
      sheet: values +/-20% (chart) or +/-20% read to ground with an electronic
      voltmeter; layout sheet separately notes resistors 1/2 W - 10% and capacitors
      >= 400 V unless marked. Not reproduced here; archived at Schematic Heaven.
      Tube count read from the companion published LAYOUT sheet (same A-FJ, page 2
      of the archived PDF), which draws the physical chassis socket row directly:
      five 7025 sockets plus the two 6L6GC. The schematic page, which places each
      triode half where the signal needs it rather than where the socket is, reads
      as more. Each preamp/driver/PI/oscillator function maps to its own socket
      (V1 Normal both stages, V2 Bright both stages, V3 tremolo oscillator, V5
      driver, V6 phase inverter)."
    url: "https://schematicheaven.net/fenderamps/pro_6g5_schem.pdf"
  - desc: "Mojotone/Ampwares Fender field guide, 'Brownface Pro' — 6G5 production
      window 1960-1963, 40 W nominal rating, 1x15\" combo, front-panel control
      layout (Normal In/In/Bass/Treble/Volume, Bright In/In/Bass/Treble/Volume,
      shared Speed/Intensity/Presence). Used here for the wattage and date range
      only; its tube-count/tremolo-type summary is superseded by the direct
      schematic reading above where the two disagree (see note)."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-pro"
verification:
  status: draft   # The artifacts are complete and every gate is green — the
                  # six gated nodes land (worst 15.3%, the driver plate), the
                  # schematic round-trips, and the drawn board wiring is proved
                  # equivalent to netlist.cir. The blocker is the strength of
                  # the chart comparison itself: the drawing's preamp and
                  # driver supply topology could not be resolved from this
                  # scan, so BD, BDRV and BP3 are driven anchors CHOSEN TO FIT
                  # rather than rails derived through read droppers. That
                  # leaves ten of the sixteen printed figures — both channels'
                  # stage plates and cathodes among them — reported
                  # informationally instead of compared, and makes the plate
                  # readings they reproduce circular. The -55 V bias label is
                  # also a rotated print read with lower confidence than the
                  # horizontal rail figures. WORK ITEM: read the dropper chain
                  # off a sharper scan so the preamp rails are derived, then
                  # gate the preamp nodes and re-run this verification.
