# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "6g5"
name_style: "Brown Pro-style"
family: other
era:
  start: 1960
  end: 1963
wattage: 40
tubes: [7025, 7025, 7025, 7025, 7025, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "silicon, three diodes per leg" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: tb
# Valve sections the tube complement supplies that the netlist does not
# instantiate — declare, never infer.
sections:
  V3A: "excluded — vibrato oscillator: a running phase-shift oscillator has no static DC point"
lineage:
  derived_from: ["5e5a"]  # the narrow-panel tweed Pro:
                          # this brown circuit is a direct redesign of it (fixed bias
                          # and the Presence control carry over; the tube rectifier
                          # gives way to silicon, the cathodyne to a long-tailed pair,
                          # and a harmonic vibrato is added), not an independent design.
                          # Reciprocal of amps/5e5a's influenced: ["6g5"].
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL1A plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Pro-Amp\" Model 6G5 schematic and layout (drawing code A-FJ). Supplies the component values and the printed voltages. This copy is the PDF's full resolution. The tube complement (five 7025 and two 6L6GC) is read from the layout page's socket row. The +350 V, +275 V and +260 V rails and the +23 V inverter cathode are lettered on the layout page only, and the Presence capacitor's rating (\".1-200\") is read from the layout sheet, which also draws the 1500 Ω foot resistor. The −55 V fixed bias comes from a small rotated label beside the two output grid leaks, read with a wider margin than the horizontal labels. The sheet's notice: values ±20%, read to ground with an electronic voltmeter; the layout sheet adds that resistors are ½ W 10% and capacitors at least 400 V unless marked. Not reproduced here; archived at Schematic Heaven."
    url: "https://schematicheaven.net/fenderamps/pro_6g5_schem.pdf"
  - desc: "Mojotone/Ampwares, Fender field guide, \"Brownface Pro\". Supplies the 6G5 production window (1960–1963), the 40 W nominal rating, the 1×15-inch combo format, the front-panel layout (Normal In/In/Bass/Treble/Volume, Bright In/In/Bass/Treble/Volume, shared Speed/Intensity/Presence) and the harmonic vibrato. Used here for the power rating and date range; the circuit is read from the drawing above."
    url: "https://mojotone.com/blogs/fender-field-guide/fender-brownface-pro"
verification:
  status: draft   # Every rail is derived through a resistor the drawing
                  # letters — only the +460 V and +458 V rails either side
                  # of the choke and the -55 V bias line are driven — and every printed stage voltage is
                  # compared with the model. What keeps this entry draft: the
                  # vibrato oscillator is excluded (it has no static point),
                  # so the +275 V supply it shares with the splitter
                  # simulates about 9% high by the oscillator's own draw; the
                  # +350 V, +275 V, +260 V and +23 V figures are lettered on
                  # the layout page only; the -55 V bias label is a rotated
                  # print read with lower confidence than the horizontal
                  # ones; and `verified` is granted by the maintainer's
                  # review, never by an agent.
added: 2026-08-08
contributors: [TheAnalogMaker]
