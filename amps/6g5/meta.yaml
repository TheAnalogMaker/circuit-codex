id: "6g5"
name_style: "Brown Pro-style"
family: other
era:
  start: 1960
  end: 1963
wattage: 40
tubes: [7025, 7025, 7025, 7025, 7025, 6L6GC, 6L6GC]
topology:
  rectifier: { kind: solid-state, type: "silicon bridge" }
