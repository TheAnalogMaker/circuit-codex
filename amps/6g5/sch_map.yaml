# amps/6g5/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  TR2.1: BR                # OT primary, V7 plate end — primary DCR omitted
  TR2.2: BR                # OT primary centre tap
  TR2.3: BR                # OT primary, V8 plate end
  TR2.4: "0"               # OT secondary hot — secondary DCR folded into ground
                           # (the RNFB return); mirrors layout
                           # net_map JSPK: '0'.

series_bridge:
  R1H: "68k grid stopper from channel 1's input 1. The A-FJ sheet puts the
    channel's 1 MΩ leak at the input-1 end of this stopper, not at the grid;
    with no DC grid current the stopper drops nothing, so its two ends are
    the one node netlist.cir calls G1A and models as RG1A G1A 0."
  R2H: "68k grid stopper from channel 2's input 1 — the same arrangement, for
    G2A and RG2A."

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-09, after the presence network was redrawn from the factory
# sheet (foot resistor + capacitor-blocked pot branch) and the drawing went
# clean against netlist.cir. This is the drawing check only; the circuit's
# verification.status is a separate claim and remains draft.
schematic_claim: verified
