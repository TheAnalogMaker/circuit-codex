# Parts list — read from the published Fender Pro-Amp Model 6G5 drawing
# (schematic + layout, A-FJ). Reference designators follow netlist.cir where a
# part is modelled; every designator below is cross-checked against the redrawn
# schematic (schematic.kicad_sch) by pipeline/validate.py, in both directions.
# The drawing's notice sets 1/2 W resistors and >=400 V capacitors unless a part
# is marked otherwise (the layout sheet separately gives 10% resistor tolerance).
# Physical tube-socket count: the published layout sheet's own socket row shows
# five 7025s + two 6L6GC, seven tubes in all — see meta.yaml sources. Socket assignment: V1 = Normal channel, both
# stages (V1A/V1B share one bottle); V2 = Bright channel, both stages (V2A/V2B);
# V3 = tremolo oscillator (its own bottle, one section used, DC point excluded
# from netlist.cir — see notes.md); V5 = driver (its own bottle, one section
# used); V6 = phase inverter (V6A/V6B share one bottle). V7/V8 = 6L6GC output.
notes: "The tremolo oscillator's parts are listed in full for the record, but
  its DC operating point is excluded from the netlist (see notes.md) — it is a
  running phase-shift oscillator, not a quiescent stage; its phase-shift ladder
  values (CTO1-3, RTOG1-2) were not confidently resolved from the scan and are
  drawn as a typical example of this circuit family (schematic-only, excluded
  from every DC/electrical gate regardless of their value). The driver stage's
  local feedback network (RFB1/RFB2/RFB3/CFB1, 470k/220k/220k/2500pF) is read
  from the drawing but not modelled in netlist.cir (see meta.yaml sources); its
  exact topology beyond the values themselves is a schematic-only reading. V1B
  and V2B's own cathode components (RK1B/CK1B, RK2B/CK2B) are informational
  placeholders matching what netlist.cir already assumes (see its header) — the
  drawing's own second-stage cathode print was not legible in the scan. The two
  transformers keep the drawing's own designators, TR1 (power) and TR2
  (output)."
items:
