# Parts list — read from the published Fender Pro-Amp Model 6G5 drawing
# (schematic + layout, A-FJ). Reference designators follow netlist.cir where a
# part is modelled; every designator below is cross-checked against the redrawn
# schematic (schematic.kicad_sch) by pipeline/validate.py, in both directions.
# The drawing's notice sets 1/2 W resistors and >=400 V capacitors unless a part
# is marked otherwise (the layout sheet separately gives 10% resistor tolerance).
# Bottles, from the layout page's socket row and the voltages printed at each
# pin: V1 = both channels' first stages (cathodes joined), V2 = both channels'
# second stages (cathodes joined), V3 = the vibrato oscillator (pins 1-3) and
# its phase splitter (pins 6-8), V4 = the vibrato pair, V5 = the phase
# inverter. V7/V8 = 6L6GC output.
notes: "The drawing prints no channel names; channel 1 is the one drawn at
  the top of the schematic, whose controls sit beside Speed and Intensity on
  the panel, and it is the only channel that passes through the vibrato and
  the only one with a bright capacitor. The oscillator's own network (the
  ladder, the Speed and Intensity controls, the 4.7 MΩ feed and its smoothing
  capacitors) is listed in full, but the oscillator is excluded from the DC
  model: a running phase-shift oscillator has no static operating point. The
  splitter and the vibrato pair are modelled. The transformers keep the
  drawing's own designators, TR1 (power) and TR2 (output)."
