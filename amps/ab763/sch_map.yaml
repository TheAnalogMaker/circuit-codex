# amps/ab763/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T3.1: BP1                # OT primary, V7 plate end — primary DCR omitted
  T3.2: BP1                # OT primary centre tap (the <B+1> rail)
  T3.3: BP1                # OT primary, V8 plate end
  T3.4: "0"                # OT secondary hot — secondary DCR folded into ground;
                           # mirrors layout net_map SPK.tip: '0'.
  # netlist.cir models no element for the reservoir->screen choke T2 and hangs
  # the 6V6 screen stoppers RS1/RS2 straight off BP1 (see its header: "The 6V6
  # screens hang off BP1 through their 470 Ohm stoppers"), so the drawn <B+1>
  # and <B+2> rails either side of T2 are one netlist node.
  T2.1: BP1                # choke, reservoir end (the <B+1> rail)
  T2.2: BP1                # choke, screen-rail end (the <B+2> rail)

# (No `symbols:` entry is needed: the sheet letters both Normal-channel stages
# V1A and V1B, matching the netlist's XV1A and XV1B.)

series_bridge:
  # 1.5 k output grid stoppers: the C-FD schematic letters "1500" in each 6V6
  # grid lead, and its layout mounts each one on the socket (pin 5 to the pin-1
  # tie lug), off the eyelet board. No DC grid current, so netlist nodes G61 /
  # G62 run through them and netlist.cir models no element there.
  R7s: "1.5 k V7 grid stopper — netlist node G61 runs through it"
  R8s: "1.5 k V8 grid stopper — netlist node G62 runs through it"

element_pins:
  # netlist RTR4 BP1 PRD 200 is the reverb-transformer primary DCR, not a
  # discrete resistor: it is the T4 primary winding, B+ lead to plate lead.
  RTR4: [T4.2, T4.1]
  # netlist RGN2 GN2 0 1meg is the Normal second stage's DC grid return: the
  # 1M-A volume pot, wiper (V1B's grid) -> track -> its grounded end. No
  # discrete grid leak is drawn on the C-FD sheet.
  RGN2: [VRVN.2, VRVN.3]

# Hard-gated: verify_schematic_nets.py fails CI on any finding for this sheet.
# Claimed 2026-09-02 after the drawing went clean against netlist.cir.
schematic_claim: verified
