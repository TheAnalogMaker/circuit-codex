# amps/ab763/sch_map.yaml — schematic <-> netlist reconciliation.
# Data, never a guess in code: every line below is a claim a reviewer can check
# against this sheet and against netlist.cir. See docs/schematic-nets.md.

anchors:
  T3.1: BP1                # OT primary, V7 plate end — primary DCR omitted
  T3.2: BP1                # OT primary centre tap (the <B+1> rail)
  T3.3: BP1                # OT primary, V8 plate end
  T3.4: "0"                # OT secondary hot — secondary DCR folded into ground;
                           # mirrors layout net_map SPK: '0'.
  # netlist.cir models no element for the reservoir->screen choke T2 and hangs
  # the 6V6 screen stoppers RS1/RS2 straight off BP1 (see its header: "The 6V6
  # screens hang off BP1 through their 470 Ohm stoppers"), so the drawn <B+1>
  # and <B+2> rails either side of T2 are one netlist node.
  T2.1: BP1                # choke, reservoir end (the <B+1> rail)
  T2.2: BP1                # choke, screen-rail end (the <B+2> rail)

# (No `symbols:` entry is needed: the sheet letters the normal-channel input
# stage V1A, matching the netlist's XV1A.)

element_pins:
  # netlist RTR4 BP1 PRD 200 is the reverb-transformer primary DCR, not a
  # discrete resistor: it is the T4 primary winding, B+ lead to plate lead.
  RTR4: [T4.2, T4.1]
