# Ground bus — the bare rail just below the bottom eyelet row; cathode, filter,
# grid-leak, and pot grounds tie to it.
bus:
  - { from: [1.45, -0.5], to: [1.45, 75.5] }

# Wiring — read lead-by-lead from the published AB763 layout drawing. Transformer
# leads carry the drawing's colours. The 6.3 V heater winding is the green pair;
# it feeds the pilot lamp then daisy-chains socket to socket (style: twisted),
# skipping the indirectly-5V-heated GZ34. Endpoints reference board eyelets
# (REF.a/REF.b), tube socket pins (Vn.pinN, validated against the basing data —
# heater pins on the twisted runs), pot lugs, jacks, off-board 2-lead parts
# (PL1.a/PL1.b), and transformer leads.
runs:
  # === power transformer HT → GZ34 rectifier → reservoir (annotation layer) ====
  # The two YELLOW leads are the 5 V rectifier-filament winding. The GZ34 is
  # indirectly heated but its cathode is strapped to the heater at pin 8, so the
  # winding lands on pins 2 and 8 and the B+ lead leaves pin 8 beside it. Until
  # 2026-09-09 neither was drawn and this socket carried one run — a rectifier
  # with no filament supply. See the `heaters:` block at the head of the file.
  - { from: T1.red1, to: V9.pin4, via: [[1.5, 0.32]] }
  - { from: T1.red2, to: V9.pin6, via: [[2.7, 0.58]] }
  - { from: T1.red-yellow, to: [1.45, 1.4], via: [[0.5, 1.25]] }   # HT centre tap → ground (clear of the C10.b drop)
  - { from: T1.yellow1, to: V9.pin2, via: [[0.55, 1.45], [1.1, 2.15]] }
  - { from: T1.yellow2, to: V9.pin8, via: [[-0.15, 1.85], [0.57, 2.68], [3.1, 2.68]] }
  - { from: V9.pin8, to: C10.a, color: red, via: [[1.6, 1.2]] }    # B+ out → reservoir

  # === B+1 net: spread across the reservoir (C10.a) and screen (C11.a) eyelets,
  # tied by the choke. The feeds to C11.a approach the shared eyelet from four
  # fanned bearings (≥18° apart) — from the left (choke), flat from the right
  # (screen node), and two risers in the clear corridor right of the GZ34 and the
  # far-left lane — so no two read as one wire and none grazes a ground drop or a
  # rectifier lead (choke DCR ~0 at DC). ========================================
  - { from: C10.a, to: C11.a }                                      # reservoir ↔ screen node (choke)
  - { from: T3.red, to: C10.a, color: red, via: [[11.4, 0.4], [9.4, 2.55], [-0.51, 2.55]] } # OT centre tap → B+1 (peel left of the blue plate lead, drop left of V7)
  - { from: RS2.a, to: RS1.a, color: red, via: [[14, 0.5], [10.4, 0.5]] }     # screen backbone (flat, above the 6V6 pins)
  - { from: RS1.a, to: C11.a, color: red, via: [[10, 2.5], [4.7, 2.5], [4.7, 0.15], [2.3, 0.15]] } # screen node → B+1 (flat approach from the right)
  - { from: T4.red, to: C11.a, color: red, via: [[35.6, 2.82], [3.6, 2.82], [3.6, 1]] } # reverb-trans primary → B+1 (rise col 3.6, clear corridor)
  - { from: RD1.a, to: C11.a, color: red, via: [[5, 2.86], [0.4, 2.86], [0.4, 1]] }     # B+1 → dropper feed (rise col 0.4, from lower-left)
  - { from: T3.blue, to: V7.pin3, via: [[12.67, 3], [10.5, 3]] }  # OT primary → V7 plate (straight down, then deep-left under the tube)
  - { from: T3.brown, to: V8.pin3, via: [[13.4, 3.08], [15, 3.08]] } # OT primary → V8 plate
  - { from: T3.green, to: SPK.tip, via: [[13.4, 1.05]] }             # OT secondary → speaker
  - { from: SPK.sleeve, to: [1.45, 17.4] }                          # (NFB return reads as ground at DC)

  # === B+3 net: backbone chain along the board. Each long span rides the deep
  # cap-feed band; each short inter-tap hop rides a flat on-board lane (row ~0.4),
  # so at every shared plate-load eyelet the deep (steep) arrival and the flat
  # (near-horizontal) departure diverge well past 18° — no two read as one wire.
  # Feeds the phase-inverter plates only; the preamp loads are all on B+4. =====
  - { from: C12.a, to: RLPA.a, via: [[2.4, 0.4], [5.2, 0.4], [5.2, 2.4], [17.6, 2.4]] }  # B+3 filter → PI hot plate load (jog off C12.a, dive below the 6V6 pins)
  - { from: RLPA.a, to: RLPB.a, via: [[18.5, 0.4], [19.5, 0.4]] }        # backbone hop (flat, on-board)
  - { from: RLR1.a, to: RLD1.a, via: [[47.5, 0.4], [51.5, 0.4]] }        # B+4: recovery → mix-driver plate loads (flat, on-board)
  - { from: RLD1.a, to: RLV2.a, via: [[52.485, 2.169], [64.3, 2.28]] }      # B+4: → vibrato 2nd-stage plate load
  - { from: C12.a, to: RD2.a, via: [[1.7, 0.75], [6.6, 0.75]] }          # B+3 filter → dropper node (jog off C12.a, own lane)
  - { from: RD1.b, to: RD2.a }                                       # B+1→B+3 dropper meets B+3 node (adjacent)

  # === B+4 net (node [D]): dropper output → every 100k preamp plate load — both
  # channel inputs, both 2nd stages (above), the recovery and the mix driver ======
  - { from: C13.a, to: RLV1.a, via: [[3.495, 1.189], [6, 2.44], [56.445, 2.44]] }  # B+4 → vibrato input plate load (steep dive right of the drops)
  - { from: RLV1.a, to: RLV2.a, via: [[57.799, 0.4], [63.5, 0.4]] }        # backbone hop (flat, on-board)
  - { from: RLV2.a, to: RLN1.a, via: [[64.5, 0.4], [68.5, 0.4]] }        # backbone hop (flat, on-board)
  - { from: C13.a, to: RD2.b, via: [[3.8, 0.35], [7.6, 0.7]] }           # B+4 filter → dropper output (flat right, clears the GZ34 lead)

  # === -35V bias rail: the two 6V6 grid leaks tie together (shallow bow) =========
  - { from: RGL1.b, to: RGL2.b, via: [[13.4, 1.15], [16.6, 1.15]] }

  # === filter-can negatives → ground bus =======================================
  - { from: C10.b, to: [1.45, 0] }
  - { from: C11.b, to: [1.45, 1] }
  - { from: C12.b, to: [1.45, 2] }
  - { from: C13.b, to: [1.45, 3] }

  # === output stage: 6V6 screens, grids (G61/G62), cathodes ====================
  - { from: RS1.b, to: V7.pin4, via: [[10.9, 1.62]] }               # screen stopper → V7 screen (approach pin4 from the left)
  - { from: RS2.b, to: V8.pin4, via: [[15.3, 1.62]] }               # screen stopper → V8 screen
  - { from: C1.b, to: V7.pin5, via: [[11.9, 1.5]] }                 # coupler → V7 grid (G61), approach pin5 from upper-right
  - { from: C2.b, to: V8.pin5, via: [[16.668, 1.55]] }                # coupler → V8 grid (G62)
  - { from: V7.pin8, to: [1.45, 11.5], via: [[11.468, 1.7]] }         # V7 cathode → ground (land clear of the screen lead)
  - { from: V8.pin8, to: [1.45, 14.5], via: [[14.7, 1.5]] }         # V8 cathode → ground (land clear of the green SPK lead)

  # === phase inverter: plates→couplers, cathodes→tail, grid leaks→junction =====
  - { from: RLPA.b, to: V6.pin1, via: [[19.7, 1.5]] }               # hot plate load → V6 plate (PPIA), jog off RTAIL.a
  - { from: V6.pin1, to: C1.a, via: [[20, 2.55], [12.323, 2.55]] }    # PPIA → hot coupler (deep sub-lane below the SPK jack + 6V6 pins)
  - { from: RLPB.b, to: V6.pin6, via: [[20.3, 1.7]] }              # cold plate load → V6 plate (PPIB), leave down-left off col21
  - { from: V6.pin6, to: C2.a, via: [[19.088, 2.65], [16, 2.65]] }    # PPIB → cold coupler (deep sub-lane below the SPK jack + 6V6 pins)
  - { from: RGPA.a, to: V6.pin2, via: [[21.13, 1.5]] }             # hot grid leak → V6 grid (GPIA), jog off RGPA.b
  - { from: RGPB.a, to: V6.pin7, via: [[22.4, 1.57]] }             # cold grid leak → V6 grid (GPIB), jog off RGPB.b
  - { from: V6.pin3, to: RTAIL.a, via: [[20.4, 2.35], [18.5, 2.35], [18.5, 1.5]] } # V6 cathode(u1) → tail (KPI), below the ring, up the left
  - { from: V6.pin8, to: RTAIL.a, via: [[19.3, 1.85]] }           # V6 cathode(u2) → tail top (KPI), from below
  - { from: RTAIL.b, to: RT2.a, via: [[20.4, 1.4], [21.5, 1.1]] }  # tail → junction (JPI), flat from the left (clear of RGPA.b)
  - { from: RGPA.b, to: RT2.a, via: [[23, 1.55]] }               # hot grid leak → junction, from lower-left
  - { from: RGPB.b, to: RT2.a, via: [[24.5, 2], [24.9, 1.5]] }    # cold grid leak → junction, from lower-right (clear of RGRD.b)
  - { from: RT2.b, to: [1.45, 24] }                                 # tail 22k → ground
  - { from: CPIA.b, to: RGPA.a, via: [[22.95, 1.1], [20.895, 0.256]] }            # .001 → hot grid (GPIA)
  - { from: CPIB.a, to: RGPB.a, via: [[27.5, 0.4], [23.5, 0.4]] }  # .1-200 → cold grid (GPIB)
  - { from: RNF2.b, to: [1.45, 29.3] }                          # 47 → ground
  - { from: SPK.tip, to: RNFB.a, via: [[18.2, 2.9], [26.8, 2.9]] }  # speaker hot → the 820
  - { from: CCN2.b, to: RMN2.a, via: [[67.6, -0.2], [25.2, -0.2]] } # link X: .047 → the Normal 220k
  - { from: CCD1.b, to: RMD1.a, via: [[52.6, -0.32], [27.2, -0.32]] } # link Y: .1 → the Vibrato 220k

  # === reverb driver V4 (paralleled): plates, grids, cathodes ==================
  - { from: V4.pin6, to: V4.pin1, via: [[32.3, 2.577]] }              # tie the two plates (PRD), shallow loop
  - { from: V4.pin1, to: T4.blue, via: [[36, 2.195], [37.211, 0.937]] } # plates → reverb-trans primary (PRD)
  - { from: V4.pin7, to: V4.pin2, via: [[32.8, 2.5], [32.5, 3.2]] }   # tie the two grids (GRD), deep loop clear of pin8
  - { from: V4.pin7, to: RGRD.a, via: [[32.956, 2], [31.674, 1.44]] } # grids → 1M leak (leave pin7 below pin6, approach RGRD.a off col25)
  - { from: RGRD.b, to: [1.45, 31.2] }                            # grid leak → ground (land between the junction + leak leads)
  - { from: V4.pin8, to: RKRD.a, via: [[34.2, 2]] }              # cathode(u1) → 2.2k (KRD), leave pin8 rightward off pin7
  - { from: V4.pin3, to: RKRD.a, via: [[32.2, 1.4]] }           # cathode(u2) → 2.2k (KRD), from lower-left
  - { from: CKRD.a, to: [1.45, 32] }                             # bypass → ground
  - { from: RKRD.b, to: [1.45, 33.4], via: [[33.2, 1.5]] }         # 2.2k → ground
  - { from: T4.green, to: [1.45, 36.4] }                         # reverb-trans secondary → tank (annotation)

  # === reverb recovery V3b (unit 2 of V3, pins 1/2/3 — the layout page's +170 V plate
  # is pin 1): plate, grid, cathode ============================================
  - { from: RLR1.b, to: V3.pin1, via: [[48, 1.62]] }             # plate load → V3 plate (PR1)
  - { from: V3.pin1, to: CCR1.b }                                 # recovery plate → the .003
  - { from: CCR1.a, to: VRREV.lug3, via: [[54, -0.4], [49.3, -0.4]] } # .003 → Reverb pot top
  - { from: VRREV.lug2, to: RMR.a, via: [[49, -0.62], [55, -0.62]] } # Reverb pot wiper → 470k
  - { from: V3.pin2, to: JRO.tip, via: [[51.607, 2.089]] }                                # recovery grid ← tank return (GR1)
  - { from: V3.pin8, to: RKR1.a, via: [[50.55, 1.62], [50.551, 0.498]] }          # cathode → 820Ω (KR1)
  - { from: CKR1.a, to: [1.45, 49] }                            # bypass → ground
  - { from: RKR1.b, to: [1.45, 50], via: [[50.218, 1.5]] }        # 820Ω → ground

  # === mix driver V3a (unit 1 of V3, pins 6/7/8 — the layout page's +180 V plate is
  # pin 6): plate, grid, cathode =================================================
  - { from: RLD1.b, to: V3.pin6, via: [[52.53, 1.8]] }             # plate load → V3 plate (PD1)
  - { from: RGD2.a, to: V3.pin7, via: [[51.6, 1.62]] }         # 220k grid return → V3 grid (GD1)
  - { from: RMR.b, to: V3.pin7 }                                # 470k reverb mix → V3 grid (GD1)
  - { from: RGD1.a, to: RMR.b }                                 # 3.3M onto the grid node
  - { from: CBD1.b, to: RGD1.a }                                # 10 pF across the 3.3M
  - { from: CCV2.b, to: RGD1.b, via: [[64.5, 1.25], [56.5, 1.25]] } # the .02's far side → the dry path
  - { from: RGD1.b, to: CRS.a, via: [[55.6, 2.36], [34.6, 2.36]] }  # the .02's far side → the reverb send
  - { from: CRS.b, to: RGRD.a, via: [[33.342, 1.305]] }             # 500 pF → the paralleled driver grids (GRD)
  # === tremolo (V5): unit 2 (pins 1/2/3) is the oscillator, unit 1 (6/7/8) the lamp driver ===
  - { from: T4.red, to: RTO2.a }                                 # +415 V to the tremolo plate feeds
  - { from: RTO2.a, to: RTO10.a }                                # +415 V → the lamp-driver feeds
  - { from: RTOG2.b, to: CTO1.a }                                # the ladder's outer node (P1)
  - { from: CTO1.a, to: V5.pin7 }                                # outer node → lamp-driver grid
  - { from: RTOG3.b, to: V5.pin2, via: [[39.056, 1.487]] }                               # → oscillator grid
  - { from: RTO2.b, to: V5.pin1, via: [[40.386, 0.969]] }                                # oscillator plate
  - { from: RTO10.b, to: V5.pin6 }                               # lamp-driver plate
  - { from: RKTO2.a, to: V5.pin8 }                               # lamp-driver cathode
  - { from: RKTO1.a, to: V5.pin3, via: [[39.637, 1.429]] }                               # oscillator cathode
  - { from: CKTO2.a, to: [1.45, 35] }
  - { from: RKTO2.b, to: [1.45, 36.3] }
  - { from: CKTO1.a, to: [1.45, 45] }
  - { from: RKTO1.b, to: [1.45, 46.3] }
  - { from: RTOG.b, to: JVP.tip, via: [[36.695, 1.994]] }                                # pedal node → the vibrato footswitch
  - { from: CTO2.a, to: VRSPD.lug1 }                             # the ladder's middle node → Speed
  - { from: VRSPD.lug2, to: VRSPD.lug3 }                         # Speed as a rheostat; its 100k (RTO1) is on the pot
  - { from: VRINT.lug3, to: CCD1.b, via: [[50.031, -0.098]] }                             # Intensity top ← the mix output (TREM, link Y)
  - { from: VRINT.lug1, to: [1.45, 43.6] }                       # Intensity bottom → ground
  - { from: RGD2.b, to: [1.45, 52] }                           # grid leak → ground (straight down off RGD2.b, clear of the grid lead)
  - { from: V3.pin3, to: RKR1.a, via: [[51.32, 2.35], [50.39, 1.88]] }  # cathode → the shared 820Ω (box [E], KE)

  # === vibrato input V2a (unit1 of V2): plate, grid, cathode ===================
  - { from: RLV1.b, to: V2.pin1, via: [[58.4, 1.62], [58.9, 2.35]] }           # plate load → V2 plate (PV1)
  - { from: JV.tip, to: V2.pin2, via: [[58.07, -0.4], [63.634, 1.275]] } # jack → V2a grid (GV1)
  - { from: V2.pin3, to: RKV1.a } # cathode → 1.5k (KV1)
  - { from: CKV1.a, to: [1.45, 62] }
  - { from: RKV1.b, to: [1.45, 63] }                           # 1.5k → ground (straight down, between the cathode riser and the jack lead)

  # === vibrato 2nd stage V2b (unit2 of V2): plate, grid, cathode ===============
  - { from: RLV2.b, to: V2.pin6 }           # plate load → V2 plate (PV2)
  - { from: VRVV.lug2, to: V2.pin7, via: [[58, -0.55], [63.5, -0.55], [63.5, 1.5], [64.3, 1.75]] } # vibrato-vol wiper → V2b grid (GV2)
  - { from: V2.pin8, to: RKV2.a, via: [[64.4, 2.2], [66.6, 1.8]] }  # cathode → the shared 820Ω (box [A], KA)
  - { from: CKV2.a, to: [1.45, 66] }
  - { from: RKV2.b, to: [1.45, 67.5], via: [[67.3, 1.4]] }      # 820Ω → ground (drop right, clear of the cathode ascent)

  # === normal input V1a (unit1 of V1): plate, grid, cathode ====================
  - { from: RLN1.b, to: V1.pin1, via: [[69.6, 1.3], [69.9, 2.35]] }         # plate load → V1 plate (PN1)
  - { from: JN.tip, to: V1.pin2, via: [[70.09, 1.18], [69.9, 2.046]] } # jack → V1a grid (GN1)
  - { from: V1.pin3, to: RKN1.a, via: [[70.437, 1.55], [75.5, 1.25]] }        # cathode → 1.5k (KN1)
  - { from: RLN2.b, to: V1.pin6, via: [[74.203, 1.465]] }                             # V1b plate load → V1 plate (PN2)
  - { from: VRVN.lug2, to: V1.pin7, via: [[69, -0.55], [70.5, -0.55], [70.5, 0.279], [75.2, 1.458]] }                          # normal-vol wiper → V1b grid (GN2)
  - { from: V1.pin8, to: V2.pin8, via: [[75.3, 2.35], [74.4, 2.6], [64.3, 2.6]] }                            # V1b cathode → V2b cathode: box [A], one lead on to RKV2 (KA)
  - { from: CKN1.a, to: [1.45, 70.5] }                       # bypass → ground (angle left, diverge from the jack lead)
  - { from: RKN1.b, to: [1.45, 75.7], via: [[75.5, 1.4]] }    # 1.5k → ground (drop right, clear of the cathode ascent)

  # === Vibrato tone stack: the Treble pot's top takes the 250 pF, its bottom the Bass
  # node (the 0.1 and the Bass rheostat), its wiper the Volume's top; the Bass foot carries the 0.047 ===
  - { from: RSV.b, to: CBV2.a, via: [[58.5, 1.3]] }  # slope foot → the 0.047
  - { from: CTV.b, to: VRTV.lug1 }                              # 250 pF → Treble top
