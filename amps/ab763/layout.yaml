  - { from: V4.pin5, to: V5.pin4, style: twisted, via: [[33, 3.64], [39, 3.64]] }
  - { from: V5.pin5, to: V3.pin4, style: twisted, via: [[39, 3.64], [51, 3.64]] }
  - { from: V3.pin5, to: V2.pin4, style: twisted, via: [[51, 3.64], [63, 3.64]] }
  - { from: V2.pin5, to: V1.pin4, style: twisted, via: [[63, 3.64], [74, 3.64]] }
  - { from: V1.pin4, to: V1.pin5, style: twisted }

# net_map — reviewable reconciliation of the drawn wiring with the DC netlist
# (netlist.cir) for pipeline/verify_layout_nets.py. See docs/layout-schema.md.
net_map:
  # The push-pull OT primary and the reverb-transformer primary: the netlist omits
  # winding DCR, so each transformer's B+ side sits at its rail node. The OT primary
  # (both 6V6 plate leads + centre tap) collapses to B+1; the reverb-driver plates
  # (PRD) reach B+1 through the reverb transformer's RTR4 primary DCR (declared
  # unplaced below), so its B+ lead is anchored to B+1.
  # The tremolo oscillator tube is a running phase-shift oscillator with no static
  # DC operating point (excluded from netlist.cir — see notes.md), so it cannot be
  # a quiescent stage the equivalence check verifies. Declared here so its socket is
  # an annotation-layer exclusion (printed loudly, like the rectifier), never a
  # silently-dropped tube: an UNdeclared unmodelled signal tube still hard-fails.
  excluded_tubes:
    V5: "12AX7 tremolo oscillator and lamp driver — a running phase-shift oscillator with no static DC operating point (excluded from netlist.cir). Its ladder, cathode networks and plate feeds are drawn on the board beside the roach, where the layout page places them; their wiring is annotation, checked sheet-vs-board and never DC-checked."
  anchors:
    T3.red:   BP1    # OT primary centre tap → B+1
    T3.blue:  BP1    # OT primary, V7 plate lead → B+1
    T3.brown: BP1    # OT primary, V8 plate lead → B+1
    T4.red:   BP1    # reverb-transformer primary, B+ side → B+1
    SPK: "0"         # speaker jack — OT-secondary DCR folded into ground (NFB return reads as ground at DC)
  # DC-transparent parts the netlist omits (no DC grid current) — none placed on
  # the board here (the 68k input grid stoppers mount at the jacks, off the board).
  # Netlist elements with no discrete same-named board part — reported in coverage,
  # never a failure (their nodes still have to check out):
  netlist_unplaced:
    RTR4: "reverb transformer T4 primary DCR (~200Ω) — the winding, not a discrete board resistor; its B+ lead anchors to B+1 and its plate lead lands on the paralleled V4 plates (PRD)"
    RGN1: "1M normal-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV1: "1M vibrato-channel input grid leak — mounted at the input jacks, not on the eyelet board"
    RGV2: "vibrato volume pot VRVV — the netlist models its DC grid return as one grid-leak (GV2→0)"
    RGN2: "normal volume pot VRVN — the netlist models its DC grid return as one grid-leak (GN2→0)"
    RGR1: "220 kΩ reverb-recovery grid return — mounted at the reverb-pedal jack, which the layout page wires to the tank-return (REVERB OUTPUT) jack; off the eyelet board (GR1→0)"
  # Parts the sheet draws that this board neither places nor wires — each
  # read off the cited layout drawing (sheet ↔ board gate, 2026-09-10).
  not_on_board:
    T2: "filter choke — a chassis part the AB763 Deluxe Reverb layout (C-FD, page 1, read at 6026 × 3650) does not draw: the +420 V and +415 V eyelets at the board's left end run by dashed leads to chassis holes. On this board it is only the off-board choke stub (kind: choke), which the sheet ↔ board gate has no two-lead vocabulary for"
    CBRV: "47 pF vibrato bright cap — lettered '47PF' inside the Vibrato channel's Volume 1M-A pot outline on the layout: mounted on the pot, not on the eyelet board"
    RTO1: "100 kΩ speed-network series resistor — lettered '100K' inside the Speed 3.0M-RA pot's outline on the layout: mounted at the pot, not on the eyelet board"
    CDEATH: ".047-600 ground-switch capacitor — drawn at the GROUND SWITCH on the layout's mains row, off the board"
    DBIAS: "bias rectifier diode — drawn in the layout's small bias sub-box (470-1W → diode → 25|50 cap), a separate board beside the pilot light, not on the main eyelet board"
    RBIAS: "470 Ω · 1 W bias feed — the '470-1W' in the layout's bias sub-box, not on the main eyelet board"
    CB1: "25 µF bias filter — the '25' half of the '25|50' can in the layout's bias sub-box, not on the main eyelet board"
    CB2: "50 µF bias filter — the '50' half of the '25|50' can in the layout's bias sub-box, not on the main eyelet board"
    VRBAL: "10K-L bias control — a chassis-mounted pot drawn beside the bias sub-box on the layout (its '-35V' lug lettered), not on the eyelet board"
    RBAL: "10 kΩ bias-divider leg — lettered '10K' inside the 10K-L bias pot's outline on the layout, the way the Twin's 27K and the AB165's 15K are lettered inside theirs: a resistor mounted on the pot, off the board (the schematic hangs it from the pot's end to ground)"

# Board-scope rules for the sheet ↔ board gate: parts the sheet draws that
# this board deliberately does not, by designator glob, each with where the
# cited layout drawing mounts them (2026-09-10).
scope:
  not_drawn:
    - { match: "R[12][nv]", why: "68 kΩ input grid stoppers — the AB763 layout hangs a 68K pair from each channel's Normal and Vibrato jacks beside the 1 MΩ leak, at the jacks and not on the eyelet board" }
    - { match: "RSL[NV]", why: "6.8 kΩ tone-stack bleeds — lettered '6800' inside each channel's Bass 250K-A pot outline on the layout: mounted on the pots, not on the eyelet board" }
