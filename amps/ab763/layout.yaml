  - { from: CBV.b, to: VRBV.lug1, via: [[54.978, -0.207]] }                              # Bass node → Bass top
  - { from: VRBV.lug1, to: VRBV.lug2 }                            # Bass wired as a rheostat
  - { from: CBV2.b, to: VRBV.lug3 }                             # 0.047 → Bass foot (its 6.8k is on the pot)
  - { from: VRTV.lug2, to: VRVV.lug3, via: [[55.825, -1.384]] }                              # Treble wiper → Volume top
  # === Normal tone stack: the Treble pot's top takes the 250 pF, its bottom the Bass
  # node (the 0.1 and the Bass rheostat), its wiper the Volume's top; the Bass foot carries the 0.047 ===
  - { from: RSN.b, to: CBN2.a, via: [[70.5, 1.3]] }  # slope foot → the 0.047
  - { from: CTN.b, to: VRTN.lug1 }                              # 250 pF → Treble top
  - { from: CBN.b, to: VRTN.lug3 }                              # Bass node → Treble bottom
  - { from: CBN.b, to: VRBN.lug1, via: [[66.981, -0.015]] }                              # Bass node → Bass top
  - { from: VRBN.lug1, to: VRBN.lug2 }                            # Bass wired as a rheostat
