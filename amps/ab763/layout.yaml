  - { ref: RGPB, a: [0, 23], b: [1, 23] }  # 1M cold grid leak (GPIB→JPI)
  - { ref: RTAIL, a: [1, 19], b: [1, 20] } # 470Ω tail (KPI→JPI)
  - { ref: RT2, a: [0, 24], b: [1, 24] }  # 22k tail junction → ground (JPI→0)
  # --- the phase inverter's input and feedback networks, beside it as the layout page draws them ---
  - { ref: RMN2, a: [0, 25], b: [0, 26] }  # 220k Normal mixing resistor: a ← the .047 (link X), b = the mix node
  - { ref: RMD1, a: [0, 27], b: [0, 26] }  # 220k Vibrato mixing resistor: a ← the .1 (link Y), b = the mix node
  - { ref: CPIA, a: [0, 26], b: [1, 26] }  # .001: the mix node → the PI hot grid
  - { ref: RNFB, a: [1, 27], b: [1, 28] }  # 820 negative feedback: a ← the speaker hot, b = the feedback node
  - { ref: CPIB, a: [0, 28], b: [1, 28] }  # .1-200: the PI cold grid → the feedback node
  - { ref: RNF2, a: [1, 28], b: [1, 29] }  # 47: the feedback node → ground
  # --- reverb driver (V4 12AT7, both sections paralleled) ---
  - { ref: RGRD, a: [0, 31], b: [1, 31] }  # 1M grid leak (GRD→0)
  - { ref: CKRD, a: [0, 32], b: [0, 33] }  # 25µF cathode bypass (shares KRD eyelet)
  - { ref: RKRD, a: [0, 33], b: [1, 33] }  # 2.2k shared cathode (KRD→0)
  # --- reverb recovery (V3b half) ---
  - { ref: RLR1, a: [0, 47], b: [0, 48] }  # 100k plate load (BD→PR1)
  - { ref: CKR1, a: [0, 49], b: [0, 50] }  # 25µF cathode bypass (shares KR1)
  - { ref: RKR1, a: [0, 50], b: [1, 50] }  # 820Ω cathode (KE→0) — box [E]: the one network, shared with the mix driver
  # --- vibrato/reverb mix driver (V3a half) ---
  - { ref: RGD2, a: [1, 51], b: [1, 52] }  # 220k mix-driver grid return (GD1→0): the fan's 220K to ground on the layout page
  - { ref: RLD1, a: [0, 52], b: [0, 53] }  # 100k plate load (BD→PD1)
  - { ref: CCD1, a: [0, 53], b: [1, 53] }  # .1 coupler: a on V3a's plate eyelet (with RLD1), b → link Y
  # --- reverb level network: the layout page takes the recovery plate through the .003 to the
  # Reverb pot's top, and its wiper through the 470K to the mix-driver grid node ---
  - { ref: CCR1, a: [0, 54], b: [1, 54] }  # .003 coupler: b ← recovery plate (PR1), a → Reverb pot top (lug 3)
  - { ref: RMR, a: [0, 55], b: [1, 55] }  # 470k reverb mix: a ← Reverb pot wiper (lug 2), b → mix-driver grid (GD1)
  # --- the dry path: the vibrato channel's .02 out of V2b's plate eyelet, into the reverb
  # send (500 pF) and, through 3.3M ‖ 10 pF, onto the mix-driver grid node ---
  - { ref: RGD1, a: [0, 56], b: [1, 56] }  # 3.3M dry-path mixing resistor: a on the grid node, b on the .02's far side
  - { ref: CBD1, a: [1, 56], b: [1, 57] }  # 10 pF across RGD1: a on the .02's far side, b tied back to RGD1.a
  - { ref: CCV2, a: [0, 65], b: [1, 65] }  # .02 coupler, sharing RLV2's plate eyelet as the layout page draws it
  - { ref: CRS, a: [0, 34], b: [1, 34] }  # 500 pF reverb send: a ← the .02's far side, b → the driver grid
  # --- tremolo (V5 12AX7): oscillator ladder, lamp driver and their cathode networks, on the
