  - { ref: RSV, a: [0, 58], b: [1, 58] }  # 100k slope: plate → the slope foot
  - { ref: CBV, a: [1, 58], b: [1, 59] }  # 0.1: slope foot → the Treble bottom / Bass node
  - { ref: CBV2, a: [1, 60], b: [1, 61] }  # 0.047: slope foot → the Bass foot (the 6.8k on the pot)
