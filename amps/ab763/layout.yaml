  - { from: VRTN.lug2, to: VRVN.lug3, via: [[68.231, -1.236]] }                              # Treble wiper → Volume top

  # === pot grounds (island controls) ==========================================
  - { from: VRVN.lug1, to: [1.45, 68.5] }
