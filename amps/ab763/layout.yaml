  - { ref: RKTO1, a: [0, 46], b: [1, 46] }  # 2.7k oscillator cathode (+2.1 V on the chart)
  # --- vibrato channel input (V2a half) ---
  - { ref: RLV1, a: [0, 57], b: [0, 58] }  # 100k plate load (BD→PV1)
  # --- Vibrato tone stack, beside the plate loads as the layout page groups it: the
