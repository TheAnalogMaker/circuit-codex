  # so this wiring is annotation: not DC-checked, but checked sheet-vs-board ---
  - { ref: CKTO2, a: [0, 35], b: [0, 36] }  # 25 µF lamp-driver cathode bypass (shares the cathode eyelet)
  - { ref: RKTO2, a: [0, 36], b: [1, 36] }  # 100k lamp-driver cathode (+17 V on the chart)
  - { ref: RTOG,  a: [0, 37], b: [0, 38] }  # 2.2M: the vibrato-pedal node → the raw bias supply (its lead leaves the board for the bias box)
  - { ref: RTOG3, a: [0, 38], b: [1, 38] }  # 1M: pedal node → the oscillator grid
  - { ref: RTOG2, a: [0, 38], b: [0, 39] }  # 1M: pedal node → the ladder's outer node
  - { ref: CTO1, a: [1, 39], b: [1, 38] }  # .01: outer node → oscillator grid
  - { ref: CTO2, a: [1, 40], b: [1, 39] }  # .01: middle node → outer node
  - { ref: CTO3, a: [1, 41], b: [1, 40] }  # .02: oscillator plate → middle node
  - { ref: RTO2, a: [0, 41], b: [1, 41] }  # 220k oscillator plate load from +415 V
  - { ref: RTO10, a: [0, 42], b: [1, 42] }  # 10M lamp-driver plate feed from +415 V
  - { ref: RLAMP, a: [0, 42], b: [0, 43] }  # 100k from +415 V to the neon lamp's far lead
