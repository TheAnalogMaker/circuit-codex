# Board layout — redrawn from the published Fender AB763 Deluxe Reverb-Amp layout
# drawing. Part refs are the shared key into bom.yaml; the renderer reads each
# value and part type from there. A legible, schematic-style redraw of the board's
# principal components in the order the drawing shows them — never a trace or a
# dimensioned reproduction.
#
# The board reads left→right: power / rectifier / output at the left end, the
# phase inverter and reverb/tremolo tubes in the middle, the vibrato and normal
# preamp stages at the right — matching the tube row on the drawing
# (GZ34 · 6V6 · 6V6 · 12AT7 PI · 12AT7 reverb · 12AX7 trem · 12AX7 · 12AX7 · 12AX7).
#
# Machine-checked equivalence: the point-to-point wiring drawn below has been
# verified electrically equivalent to the simulated netlist (netlist.cir) by
# pipeline/verify_layout_nets.py — see the net_map block at the foot of this file
# and docs/layout-schema.md. Heaters, the pilot lamp, the tremolo oscillator, and
# the PT/rectifier AC side are an excluded annotation layer (not in netlist.cir).
wiring_claim: verified

board:
  rows: 2
  cols: 76
  title: "AB763 · eyelet board layout"

# The heater circuits this drawing establishes against the amplifier's own
# sheet — the 5 V rectifier filament only. The C-FD layout page draws that
# winding lead by lead (two YELLOW leads from TR1 to the GZ34 socket) but only
# ARROWS the 6.3 V chain, "TO ALL 6.3 V. HEATERS AND PILOT LIGHT", and its
# 6V6GT sockets carry no heater lead at all — so the 6.3 V daisy below stays
# undeclared and the drawing keeps its "not established" markers for it.
heaters:
  - id: h5
    volts: 5.0
    winding: "5 V rectifier-filament secondary — the transformer's yellow pair"
    grounded_leg: none
    source: >-
      C-FD layout page: TR1's leads fan to the GZ34 socket lettered YELLOW to
      pin 2, RED 330 V AC to pin 4, RED 330 V AC to pin 6, YELLOW to pin 8,
      with the RED B+ lead leaving pin 8 alongside the second yellow. The
      schematic page draws the same winding as a two-terminal secondary whose
      ends are the rectifier's two heater connections, +420 V taken from the
      end carrying the cathode. The GZ34's cathode is strapped to the heater at
      pin 8 inside the envelope (Mullard letters that pin "h,k"), so the
      winding floats at B+ and neither leg is grounded.
    sockets:
      V9: { feed: [2], return: [8] }   # GZ34 — 5 V across the two heater pins, B+ out of 8
caption: "Redrawn from the published Fender AB763 Deluxe Reverb-Amp layout drawing — the board's components, in the order the drawing shows them: both tone stacks beside their channels' plate loads, the reverb send and mix, the phase inverter's input and feedback networks, and the tremolo network beside the roach. The roach itself, a four-lead part, is not drawn; the 68 kΩ input stoppers, the 6.8 kΩ tone-stack bleeds and the 47 pF bright cap sit at the jacks and on the pots, and the bias supply on its own small board, as the drawing mounts them. The GZ34's own 5 V filament winding is drawn as the sheet letters it — two yellow transformer leads to the rectifier's heater pins 2 and 8, the B+ leaving pin 8 beside them (the rectifier is indirectly heated, but its cathode is strapped to the heater inside the envelope). The 6.3 V heater chain (green twisted pair, PT → pilot lamp → the two 6V6 output tubes → 12AT7 PI → 12AT7 reverb driver → 12AX7 tremolo → the three 12AX7 preamp tubes) is drawn in the conventional daisy order and is NOT established: the sheet arrows it \"TO ALL 6.3 V. HEATERS AND PILOT LIGHT\" and draws no heater lead at any socket. Not a trace or a dimensioned reproduction."
source:
  desc: "Fender 'Deluxe Reverb-Amp AB763' layout drawing (C-FD), page 1"
  url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_reverb_ab763.pdf"

