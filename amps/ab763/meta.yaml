# Circuit Codex metadata — schema: docs/schema.md (v1)
id: "ab763"
name_style: "Blackface Deluxe Reverb-style"
family: blackface
era:
  start: 1964   # the AB763 revision's own window. The blackface Deluxe Reverb
  end: 1967     # arrives in 1963 under the AA763 designation (a history-tier row
                # in history/families/deluxe-reverb.yaml); field guides that date
                # 'the AB763 schematic' 1963-1967 are dating the whole blackface era.
wattage: 22
tubes: [12AX7, 12AX7, 12AX7, 12AT7, 12AX7, 12AT7, 6V6GT, 6V6GT, GZ34]
topology:
  rectifier: { kind: tube, type: "GZ34" }
  bias: fixed
  phase_inverter: long-tailed-pair
  tone_stack: tb
lineage:
  derived_from: ["6g3"]   # the brown 6G3 Deluxe: fixed bias, GZ34, long-tailed pair, negative feedback
  influenced: []
conventions:
  designators: functional   # designators carry a role code (RD1 dropper, RL4 plate load, CK1 cathode bypass)
sources:
  - desc: "Fender, \"Deluxe Reverb-Amp AB763\" schematic and layout (drawing code C-FD). Supplies every component value and the printed voltage chart. The sheet's notice: values ±20%, read to ground with an electronic voltmeter. The preamp tubes are labelled 7025 (an equivalent of the 12AX7). The drawing's boxed node [A] means the Normal and Vibrato second stages share one 820 Ω / 25 µF cathode network; boxed node [E] does the same for the mix driver and the reverb recovery. All six 100 kΩ preamp plate loads return to node [D], which carries no printed voltage. Not reproduced here; archived at EL34World."
    url: "https://el34world.com/charts/Schematics/files/Fender/Fender_deluxe_reverb_ab763.pdf"
  - desc: "RCA, 12AT7 data sheet (March 1, 1954). Supplies the tabulated Class A1 characteristics for the site's open (CC0) 12AT7 tube model, built only from published data: Va = 250 V with 200 Ω cathode bias gives Ia = 10 mA, gm = 5500 µmho and µ = 60; a second point, Va = 100 V with 270 Ω, gives 3.7 mA and 4000 µmho. Basing 9A. Used for the reverb driver and the phase inverter."
    url: "https://frank.pocnet.net/sheets/049/1/12AT7.pdf"
verification:
  status: verified
  date: 2026-07-19
  max_deviation_pct: 13.6   # worst gated node (KA and KE, the two shared 820 Ω cathodes at boxes [A] and [E], tol 20%); the tremolo oscillator is a documented exclusion (see notes.md), reported not gated
sections:   # valve sections the tube complement supplies that the netlist does not instantiate (pipeline/check_sections.py)
  V5: "excluded — the tremolo bottle: a running phase-shift oscillator and its lamp driver; neither has a static operating point, and their plate loads return to box [B], the driven node BP1, so no gated node moves"
contributors: [TheAnalogMaker]
