name: production-revision

# Is circuitcodex.com serving main? The build stamps /version.json with its source
# revision (site/scripts/write-version.mjs). This job compares that with main's head.
#
# Why: until 2026-09-29, every branch build in Workers Builds deployed to production,
# and an unmerged PR was served for hours while every check on main stayed green.
# A successful build is not evidence of what production serves; this job reads it.
#
# - push to main: wait for the deploy, and fail if production has not caught up
#   within 20 minutes.
# - schedule: fail when production serves anything other than main's head, once
#   that head is more than 20 minutes old (a deploy in flight is not a failure).
# Never runs for pull requests: a PR build must not be expected in production.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the served revision with main
        env:
          MAIN_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ "$EVENT" != "push" ]; then
            MAIN_SHA=$(gh api "repos/$REPO/commits/main" -q .sha)
          fi
          committed=$(gh api "repos/$REPO/commits/$MAIN_SHA" -q .commit.committer.date)
          age=$(( $(date +%s) - $(date -d "$committed" +%s) ))
          served() { curl -sf --max-time 20 "https://circuitcodex.com/version.json?t=$(date +%s)" \
                       | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))' 2>/dev/null; }
          wait=0; [ "$EVENT" = "push" ] && wait=1200
          deadline=$(( $(date +%s) + wait ))
          while :; do
            s=$(served || true)
            [ "$s" = "$MAIN_SHA" ] && { echo "production serves main ${MAIN_SHA:0:7}"; exit 0; }
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 30
          done
          if [ "$EVENT" != "push" ] && [ "$age" -lt 1200 ]; then
            echo "main ${MAIN_SHA:0:7} is ${age}s old; production serves '${s:0:7}' (deploy may be in flight)"
            exit 0
          fi
          echo "::error::circuitcodex.com serves '${s:-no version.json}', not main ${MAIN_SHA}"
          exit 1
