name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml kiutils
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ngspice
      - run: python pipeline/validate.py
      - run: python pipeline/fit_models.py && git diff --exit-code models/
      - run: python pipeline/test_models.py
      - run: python pipeline/verify_amps.py
      # Also prints the connectivity report: every symbol pin whose net holds
      # nothing else, with the gap a fixer has to close. Report-only for now
      # (CX_CONNECTIVITY=error, or --connectivity=error, makes it block) while
      # the per-amp drawing repairs land.
      - run: python pipeline/check_schematics.py
      # The .kicad_sch files are generated by pipeline/draw_*.py and committed,
      # so a committed sheet can quietly stop being what its generator draws —
      # the AA864 shipped a title block reading "draft" for three weeks after
      # meta.yaml said verified, and nothing could see it. Element ids are
      # content-derived (schematic_lib._u), so regenerating an unchanged drawing
      # reproduces its file byte for byte and this diff is empty. Same drift
      # gate as models/ and loadlines.yaml.
      - run: for f in draw_*.py; do python "$f" > /dev/null; done
        working-directory: pipeline
      - run: git diff --exit-code -- ../amps
        working-directory: pipeline
      # The site serves copies of the sheets; regenerate must be followed by the
      # sync or the copies drift from the corpus (caught here, not after the build).
      - run: node scripts/sync-assets.mjs
        working-directory: site
      - run: git diff --exit-code -- site/public/schematics
      # The tone-stack lab plots a fixed network and fills its values from each
      # amp's BOM by reference designator. This rebuilds the nets the schematic
      # actually draws and fails if a drawing wires those designators into a
      # different circuit from the one the page plots.
      - run: python check_tonestack_wiring.py
        working-directory: pipeline
      # The sheet-style render letters each part's value on its body in the era
      # shorthand. This gates that formatter against the documented cases and
      # against every value in every BOM: each one is either lettered to the
      # same physical quantity or left in house units verbatim.
      - run: python pipeline/test_era_values.py
      # A part states its value on up to four surfaces (schematic symbol, BOM,
      # layout label, era sheet lettering). validate.py proves the designators
      # line up; this proves the quantities do. The self-test runs first because
      # a gate that cannot fail proves nothing: it pushes 29 planted pairs — a
      # decade slip, a unit slip, a wattage and a working-voltage clash, a wrong
      # valve, part number and impedance ratio — through the same normalisers.
      # --strict fails on disagreements only. UNSTATED and UNLINKED rows are
      # printed but never gated: they are the archive declining to invent a
      # figure its source never printed, and gating them would reward inventing
      # one.
      - run: python pipeline/check_value_consistency.py --selftest
      - run: python pipeline/check_value_consistency.py --strict
      # Each tube page's used_in list must be the circuits that letter that
      # tube (name, slug, or also_known_as). A hand list said the 6SJ7 was
      # unused while the 5C1 listed one.
      - run: python pipeline/check_tube_used_in.py --selftest
      - run: python pipeline/check_tube_used_in.py
      # Renders and lints BOTH published drawings of every board (layout.svg and
      # layout-sheet.svg): staleness, well-formedness, wiring collisions, and the
      # label checks against each style's own type.
      - run: python pipeline/check_layouts.py
      # Every amp page's link-preview card carries a crop of that amp's own
      # layout drawing, so a changed layout, meta.yaml or card renderer leaves a
      # committed card showing a board the corpus no longer draws. --check needs
      # no rasteriser: it rebuilds each card's SVG and compares digests.
      - run: python pipeline/render_og.py --check
      # Layout <-> netlist electrical-equivalence gate. The self-test proves the
      # gate catches planted wiring faults (a gate that can't is decoration); the
      # main run hard-fails any amp whose layout.yaml claims wiring_claim: verified
      # but whose drawn wiring is not equivalent to netlist.cir.
      - run: python pipeline/verify_layout_nets.py
      # Schematic <-> netlist electrical-equivalence gate, the schematic-side twin
      # of verify_layout_nets. The self-test proves the gate catches planted wiring
      # faults; the main run hard-fails any sheet whose sch_map.yaml claims
      # schematic_claim: verified. Report-only until a sheet earns that claim.
      - run: python pipeline/verify_schematic_nets.py --selftest
      - run: python pipeline/verify_schematic_nets.py --selftest
      - run: python pipeline/verify_layout_nets.py
      # reference/loadlines.yaml is generated from the netlists and simulated, so it
      # can go stale silently the moment a netlist changes. Same drift gate as models/.
      - run: python pipeline/export_loadlines.py --check
      # The load-line explorer solves the same Koren equations in the browser that
      # ngspice solves here. This runs the page's own module against the simulated
      # operating points and fails if the two ever stop agreeing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: site
      - run: node scripts/check-loadline-parity.mjs
        working-directory: site
      # The tone-stack lab's browser solver is checked against ngspice AC sweeps
      # of the same element lists, and every dB figure the tone-stack wiring
      # study quotes is re-derived from that solver — so the study's published
      # numbers cannot drift from the code that produced them.
      - run: node scripts/check-tonestack-spice.mjs
        working-directory: site
      # The lineage caption gate reads the built page and proves the prose still
      # names every derivation arrow the SVG draws. INDEXNOW=0 so a slow
      # search-engine ping cannot fail CI (the ping is not a corpus claim).
      - run: INDEXNOW=0 npm run build
        working-directory: site
      - run: node scripts/check-lineage-caption.mjs
        working-directory: site
      # The build's first step is sync-assets.mjs, which copies every amps/<id>/
      # schematic.kicad_sch to the copy KiCanvas actually serves. Both copies are
      # committed, so this proves the published one is the corpus's one.
      - run: git diff --exit-code -- site/public/schematics
