tube: kt66
name: KT66
also_known_as: []
role: >-
  British beam-power tetrode from GEC / M-O Valve Co. — the output tube of the
  JTM45, the amplifier that carried the 6L6-class Bassman topology across the
  Atlantic. Its higher plate dissipation and different drive give the JTM45 its
  louder, firmer character.
model:
  file: models/kt66.inc
  anchor: "Va=250 V, Vg2=250 V, Vg1=-15 V → Ia=85 mA, gm=7000 µmho (gm test point)"
  anchor_source: "GEC / M-O Valve Co. KT66 data sheet, Issue 4, April 1963"
  anchor_source_url: https://frank.pocnet.net/sheets/084/k/KT66_GEC.pdf
  note: >-
    µ is the grid-No.1-to-grid-No.2 amplification factor (9.5), from the
    triode-connection gm·ra on the same sheet. KG2 is anchored on the Class AB1
    push-pull quiescent point (Vg2=300 V, Vg1=-27 V → Ig2=2.5 mA).
max_ratings:
  note: >-
    GEC prints two columns — a design maximum and an absolute maximum. The design
    figures are the ones a circuit is laid out against; the absolute column is the
    line beyond which the valve is out of specification. The 25 W design anode
    dissipation is what lets the KT66 sit where a 6V6 could not.
  items:
    - { label: "Anode voltage", value: "500 V design · 550 V absolute" }
    - { label: "Screen (grid No.2) voltage", value: "500 V design · 550 V absolute" }
    - { label: "Peak negative grid-No.1 voltage", value: "200 V" }
    - { label: "Cathode current", value: "200 mA" }
    - { label: "Anode dissipation", value: "25 W design · 30 W absolute" }
    - { label: "Screen dissipation", value: "3.5 W design · 4.5 W absolute" }
    - { label: "Anode + screen dissipation", value: "27 W design · 32 W absolute" }
    - { label: "Grid-No.1 circuit resistance", value: "1 MΩ cathode bias · 250 kΩ fixed bias (Pa+g2 ≤ 27 W)" }
  limits:
    plate_dissipation_w: 25
    plate_dissipation_absolute_w: 30
    screen_dissipation_w: 3.5
    plate_voltage_v: 500
    screen_voltage_v: 500
    cathode_current_ma: 200
  rating_system: design-maximum
  source: "GEC / M-O Valve Co. KT66 data sheet, Issue 4, April 1963 — maximum ratings (design column)"
  source_url: https://frank.pocnet.net/sheets/084/k/KT66_GEC.pdf
basing:
  code: 7AC
  base: octal
  view: bottom
  source: >-
    GEC / M-O Valve Co. KT66 data sheet, Issue 4 — "Base Connections",
    view from underside of base (International Octal, B8-0). The arrangement is
    the standard 7AC beam-tetrode base; pin 1 is an internal connection.
  pins:
    1: { element: internal-connection }
    2: { element: heater }
    3: { element: plate, hv: true }
    4: { element: screen-grid, hv: true }
    5: { element: grid }
    6: { element: nc }
    7: { element: heater }
    8: { element: cathode }
used_in: [jtm45, jtm100]
datasheets:
  - publisher: GEC / M-O Valve Co.
    designation: KT66
    url: https://frank.pocnet.net/sheets/084/k/KT66_GEC.pdf
    confidence: high
