tube: "6973"
name: "6973"
also_known_as: []
role: >-
  RCA beam power tube in a 9-pin miniature bottle — the output valve of the
  Supro and Valco amplifiers, and the reason those amps sound the way they do.
  It delivers roughly 6L6-class drive sensitivity from an EL84-sized envelope
  with only 12 W of plate dissipation, so it runs close to its ceiling in normal
  service and lets go early and hard. Grid No.1 and grid No.2 each come out on
  two pins.
model:
  file: models/6973.inc
  anchor: "Va=250 V, Vg2=250 V, Vg1=-15 V → Ia=46 mA, Ig2=3.5 mA, gm=4800 µmho"
  anchor_source: "RCA 6973 data sheet, 10-60 — Characteristics, Class A1 Amplifier"
  anchor_source_url: https://frank.pocnet.net/sheets/049/6/6973.pdf
  note: >-
    µ=9.479 is SOLVED, not read. Neither the data sheet nor the RCA Receiving
    Tube Manual RC-30 entry for this tube prints an amplification factor of any
    kind — no grid-No.1-to-grid-No.2 figure and no triode-connection figure — and
    µ is the one Koren parameter a single operating point cannot fix, because it
    only ever appears as Vg2/µ + Vg1. What the sheet does publish is a push-pull
    fixed-bias table that runs the screen at three different voltages, and those
    rows measure it. µ is fitted to them by least squares on relative error
    (pipeline/fit_models.py, solve_pentode_mu) with the Class-A1 anchor above
    still reproduced exactly, which is what CI gates. EX=1.5 and KVB=30 (pentode)
    are project defaults per METHODOLOGY.md.
  corroboration: >-
    Two checks the fit was not given. First, the anchor's own gm/Ia ratio puts a
    hard floor under µ in this model form — below 8.51 the tabulated
    transconductance is unreachable at the tabulated plate current — and the
    solved 9.479 sits above it. Second, RC-30 prints plate-characteristic
    families for this tube at Vg2=250 V; read against them the model lands within
    the width of the printed curves at Vg1=-10 V (model 79 mA). The model's plate
    resistance at the anchor, 67 kΩ, comes out near the sheet's printed 73 kΩ
    without KVB having been fitted to it.
  known_limitation: >-
    The three fixed-bias rows µ was fitted to are not reproduced exactly — that
    is what a least-squares fit means. Halved from the sheet's "values are for 2
    tubes" convention, they are 250/250/-15 V → 46 mA and 3.5 mA screen (the
    anchor, exact), 350/280/-22 V → 29 mA and 1.75 mA (model +12.0% plate,
    +7.9% screen) and 400/290/-25 V → 25 mA and 1.25 mA (model +6.4% plate,
    -3.4% screen). Separately, the sheet's cut-off datum — grid No.1 at about
    -40 V for 100 µA of plate current at Vg2=250 V — is beyond anything this
    model form can show: its plate current reaches exactly zero at -26.4 V and
    stays there, with no soft tail below cut-off.
max_ratings:
  note: >-
    Design-maximum values for push-pull Class AB1 service. Twelve watts of plate
    dissipation is the number that matters: it is barely more than an EL84's, in
    a tube asked to make 20 W from a pair, so a 6973 output stage has very little
    thermal margin and its screen grid — 2 W, and only 330 V — has less. The
    separate 410 V ceiling applies when the screens are taken from taps on the
    output transformer primary rather than from their own supply.
  items:
    - { label: "Plate voltage", value: "440 V" }
    - { label: "Grid-No.2 (screen-grid) voltage", value: "330 V" }
    - { label: "Grid-No.2 input", value: "2 W" }
    - { label: "Plate dissipation", value: "12 W" }
    - { label: "Plate and grid-No.2 supply voltage, screens tapped on the OT primary", value: "410 V" }
    - { label: "Peak heater-cathode voltage", value: "200 V, either polarity" }
    - { label: "Bulb temperature at the hottest point", value: "250 °C" }
    - { label: "Grid-No.1 circuit resistance", value: "0.5 MΩ fixed bias · 1 MΩ cathode bias" }
  limits:
    plate_dissipation_w: 12
    screen_dissipation_w: 2
    plate_voltage_v: 440
    screen_voltage_v: 330
  rating_system: design-maximum
  source: "RCA 6973 data sheet, 10-60 — Push-Pull AF Power Amplifier, Class AB1, maximum ratings (design-maximum values)"
  source_url: https://frank.pocnet.net/sheets/049/6/6973.pdf
basing:
  code: 9EU
  base: noval-b9a
  view: bottom
  source: >-
    RCA 6973 data sheet, 10-60 — "Base: Small-Button Noval 9-Pin (JEDEC No.
    E9-1), Basing Designation for BOTTOM VIEW 9EU", with the pin list reproduced
    below. The same list appears on the earlier 8-57 tentative-data issue of the
    sheet and in the RCA Receiving Tube Manual RC-30 entry. Grid No.1 is brought
    out on pins 3 and 6 and grid No.2 on pins 1 and 8; the suppressor shares the
    cathode pin.
  pins:
    1: { element: screen-grid, hv: true, note: "g2 — also on pin 8" }
    2: { element: nc }
    3: { element: grid, note: "g1 — also on pin 6" }
    4: { element: heater }
    5: { element: heater }
    6: { element: grid, note: "g1 — also on pin 3" }
    7: { element: cathode, note: "k and g3 — the suppressor is tied to the cathode internally" }
    8: { element: screen-grid, hv: true, note: "g2 — also on pin 1" }
    9: { element: plate, hv: true }
