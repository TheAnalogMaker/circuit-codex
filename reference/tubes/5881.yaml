tube: 5881
name: "5881"
also_known_as: [6L6WGB]
role: >-
  The ruggedized member of the 6L6 beam-power line — Tung-Sol's premium-quality
  6L6, and the output tube the tweed 5F6-A Bassman is drawn around. It shares the
  family's 7AC octal basing and its Class A1 characteristics with the 6L6GC, but
  not its ratings: 23 W on a 400 V ceiling against the 6L6GC's 30 W on 500 V. A
  circuit is bound to the model whose name its drawing prints, so the amps
  lettered 6L6GC use reference/tubes/6l6gc.yaml and only the ones lettered 5881
  are here; where a drawing letters the older 6L6G, this model stands in for it
  (5E5-A, 5E6-A, 5F4 — documented on those entries).
model:
  file: models/5881.inc
  anchor: "Va=250 V, Vg2=250 V, Vg1=-14 V → Ia=72 mA, Ig2=5 mA, gm=6000 µmho"
  anchor_source: "RCA Receiving Tube Manual RC-19, 1959, average characteristics (6L6GC)"
  note: >-
    5881/6L6WGB is treated as 6L6GC-class at these ratings. µ is the
    grid-No.1-to-grid-No.2 amplification factor (8, RC-19).
max_ratings:
  note: >-
    Design-center maximums for the 5881 as printed by Tung-Sol. The 5881's rugged
    construction trades the 6L6GC's higher ceiling for durability: it is rated below the
    6L6GC on both plate dissipation and voltage (23 W / 400 V against 30 W / 500 V),
    which is why a 6L6GC drops into a 5881 socket with margin to spare while a 5881 run
    at 6L6GC voltages sits near its limit.
  items:
    - { label: "Plate dissipation", value: "23 W" }
    - { label: "Plate voltage", value: "400 V" }
    - { label: "Screen (grid No.2) voltage", value: "400 V" }
    - { label: "Screen dissipation", value: "3 W" }
  limits:
    plate_dissipation_w: 23
    screen_dissipation_w: 3
    plate_voltage_v: 400
    screen_voltage_v: 400
  rating_system: design-centre
  source: "Tung-Sol 5881 datasheet (design-center system)"
  source_url: https://frank.pocnet.net/sheets/127/5/5881.pdf
basing:
  code: 7AC
  base: octal
  view: bottom
  source: >-
    RCA 6L6GC data sheet ("Basing Designation for Bottom View ... 7AC");
    cross-checked against the Tung-Sol 5881 bottom-view basing diagram (JEDEC 7AC).
  pins:
    1: { element: nc }
    2: { element: heater }
    3: { element: plate, hv: true }
    4: { element: screen-grid, hv: true }
    5: { element: grid }
    6: { element: nc }
    7: { element: heater }
    8: { element: cathode }
used_in: ["5e5a", "5e6a", "5f4", "5f6", "5f6a", "6g6b"]
