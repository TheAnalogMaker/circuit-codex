tube: 12ax7
name: 12AX7
also_known_as: [ECC83, "7025", 12AX7A]
role: >-
  High-mu (µ=100) dual triode — the universal gain stage, cathode follower, and
  phase inverter of guitar amplification. It appears in nearly every circuit in
  this archive.
model:
  file: models/12ax7.inc
  anchor: "Va=250 V, Vg=-2 V → Ia=1.2 mA, gm=1600 µmho, µ=100"
  anchor_source: "RCA Receiving Tube Manual RC-19, 1959, average characteristics"
  note: >-
    Two-point fit (adopted 2026-07-18 from the calibration study below): the plate-current curve is held at both tabulated operating points — 250 V/−2 V and 100 V/−1 V — which all four manufacturers print identically. The low-plate-voltage behaviour of this tube was the
    subject of the 12AX7 calibration study.
study: 12ax7-calibration
max_ratings:
  note: >-
    Design-centre values, each section. One watt is a small budget, but a 12AX7 gain
    stage idles at well under a milliamp — a 100 kΩ plate load and 1.5 kΩ cathode
    resistor put roughly 0.2 W into the plate, a fifth of the ceiling.
  items:
    - { label: "Plate voltage", value: "300 V" }
    - { label: "Positive DC grid voltage", value: "0 V" }
    - { label: "Negative DC grid voltage", value: "50 V" }
    - { label: "Plate dissipation", value: "1 W" }
    - { label: "Heater-cathode voltage", value: "180 V either polarity" }
  limits:
    plate_dissipation_w: 1.0
    plate_voltage_v: 300
  rating_system: design-centre
  source: "GE 12AX7 data sheet ET-T509B (June 1953), design-centre values, each section"
  source_url: https://frank.pocnet.net/sheets/093/1/12AX7.pdf
basing:
  code: 9A
  base: noval-b9a
  view: bottom
  source: >-
    RCA 12AX7-A data sheet — "Basing Designation for Bottom View ... 9A";
    cross-checked against the Philips ECC83 connections diagram (identical).
  pins:
    1: { element: plate, unit: 2, hv: true }
    2: { element: grid, unit: 2 }
    3: { element: cathode, unit: 2 }
    4: { element: heater }
    5: { element: heater }
    6: { element: plate, unit: 1, hv: true }
    7: { element: grid, unit: 1 }
    8: { element: cathode, unit: 1 }
    9: { element: heater-ct }
# The heater supplies the sheet permits, and the CONNECTION GROUPS each one
# uses. This valve is the reason the grouping has to be data: a centre-tapped
# heater wires the same three pins two different ways, and the pin labels
# cannot tell them apart. A layout's `heaters:` block declares which supply its
# source shows and pipeline/check_heaters.py proves it against this block.
# Each `legs` entry is one leg of the supply, as pin numbers.
heater:
  supplies:
    - volts: 6.3
      current_a: 0.3
      legs: [[4, 5], [9]]
      note: >-
        Parallel: the two heater ends are strapped together as one leg and the
        centre tap is the other. Both halves then sit across 6.3 V.
    - volts: 12.6
      current_a: 0.15
      legs: [[4], [5]]
      unused: [9]
      note: >-
        Series: the two ends are the supply legs and the halves sit in series
        across 12.6 V. The centre tap carries no supply leg (a drawing may
        still take a hum-balance or elevation reference off it).
  source: >-
    GE 12AX7 data sheet ET-T509B (June 1953), page 1 — "A center-tapped heater
    permits operation of the tube from either a 6.3-volt or a 12.6-volt heater
    supply"; heater voltage 12.6 series / 6.3 parallel at 0.15 / 0.3 A, with
    the RETMA 9A basing diagram showing the heater across pins 4 and 5 tapped
    at pin 9. Cross-checked against the RCA 12AX7-A sheet.
  source_url: https://frank.pocnet.net/sheets/093/1/12AX7.pdf
