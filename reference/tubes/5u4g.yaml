tube: 5u4g
name: 5U4G
also_known_as: [5U4GB, 5U4GA]
role: >-
  Directly-heated high-current full-wave rectifier — the supply rectifier of the
  larger tweed amps such as the 5F4 Super, where the 5Y3 could not pass enough
  current.
model:
  file: models/5u4g.inc
  anchor: "tube voltage drop ~50 V at Ia=200 mA per plate"
  anchor_source: "RCA Receiving Tube Manual RC-19, 1959, average characteristics"
  note: >-
    Child's-law diode (I = PERV·V^1.5); one plate unit, instantiate twice.
    amps/5e6a runs TWO physical 5U4GA tubes in parallel (four diode-plate
    units total) rather than one — like every rectifier in this corpus, they
    are not instantiated in the DC netlist at all (the rectifier + PT is
    modeled as an ideal B+ source; see amps/5e6a/netlist.cir header).
basing:
  code: 5T
  base: octal
  view: bottom
  source: >-
    RCA 5U4-GB data sheet — "Basing Designation for Bottom View" (printed
    "G-5T"; the EIA arrangement is 5T, shared with the 5Y3GT). Directly heated:
    the filament is the cathode and floats at B+ with the plates.
  pins:
    1: { element: nc }
    2: { element: filament, hv: true, note: "also the cathode — B+ output" }
    3: { element: nc }
    4: { element: diode-plate, unit: 2, hv: true }
    5: { element: nc }
    6: { element: diode-plate, unit: 1, hv: true }
    7: { element: nc }
    8: { element: filament, hv: true, note: "also the cathode — B+ output" }
# A directly-heated rectifier sits on its own 5 V winding, never on the 6.3 V
# heater chain, and the winding floats at B+ because the filament IS the
# cathode. The two filament pins are the two supply legs.
heater:
  supplies:
    - volts: 5.0
      current_a: 3.0
      legs: [[2], [8]]
      note: >-
        Its own 5 V secondary. Both legs sit at the rectified B+, so neither
        may be grounded — the winding floats with the filament.
  source: >-
    RCA 5U4-GB data sheet (November 5, 1954), page 1 — "Filament, Coated:
    Voltage 5 ac volts, Current 3 amp"; terminal connections "Pin 2 —
    Filament", "Pin 8 — Filament" on the G-5T bottom-view basing diagram.
  source_url: https://frank.pocnet.net/sheets/049/5/5U4GB.pdf
used_in: ["5e4a", "5e5a", "5e6a", "5f4", "5g9", "aa1164"]
datasheets:
  - publisher: RCA
    designation: 5U4GB
    url: https://frank.pocnet.net/sheets/049/5/5U4GB.pdf
    confidence: medium
