tube: 12ay7
name: 12AY7
also_known_as: ["6072"]
role: >-
  Medium-mu (µ=44) dual triode — a lower-gain, lower-noise first stage. It fronts
  the tweed high-power amps (5F6-A Bassman, 5E3 Deluxe) where a 12AX7 would be too
  hot and too noisy.
model:
  file: models/12ay7.inc
  anchor: "Va=250 V, Vg=-4 V → Ia=3.0 mA, gm=1750 µmho, µ=44"
  anchor_source: "RCA Receiving Tube Manual RC-19, 1959, average characteristics"
max_ratings:
  note: >-
    Design-centre values, each unit. The 10 mA cathode-current ceiling is generous
    next to the 3 mA a tweed input stage actually draws.
  items:
    - { label: "Plate voltage", value: "300 V" }
    - { label: "Negative grid bias", value: "50 V" }
    - { label: "Positive grid bias", value: "0 V" }
    - { label: "Plate dissipation", value: "1.5 W" }
    - { label: "Cathode current", value: "10 mA" }
    - { label: "Peak heater-cathode voltage", value: "90 V either polarity" }
  limits:
    plate_dissipation_w: 1.5
    plate_voltage_v: 300
    cathode_current_ma: 10
  rating_system: design-centre
  source: "RCA 12AY7 data sheet, 1 April 1953 (tentative data), design-centre values, each unit"
  source_url: https://frank.pocnet.net/sheets/049/1/12AY7.pdf
basing:
  code: 9A
  base: noval-b9a
  view: bottom
  source: >-
    RCA 12AY7 data sheet — "Basing Designation for Bottom View ... 9A";
    same dual-triode base as the 12AX7 / ECC83.
  pins:
    1: { element: plate, unit: 2, hv: true }
    2: { element: grid, unit: 2 }
    3: { element: cathode, unit: 2 }
    4: { element: heater }
    5: { element: heater }
    6: { element: plate, unit: 1, hv: true }
    7: { element: grid, unit: 1 }
    8: { element: cathode, unit: 1 }
    9: { element: heater-ct }
# Centre-tapped, so the same valve runs from either supply — and the two
# supplies wire the SAME three pins into different connection groups. A layout's
# `heaters:` block declares which one its source shows, and
# pipeline/check_heaters.py proves it against this block. Each `legs` entry is
# one leg of the supply, as pin numbers.
heater:
  supplies:
    - volts: 6.3
      current_a: 0.3
      legs: [[4, 5], [9]]
      note: >-
        Parallel: the two heater ends are strapped together as one leg and the
        centre tap is the other. Both halves then sit across 6.3 V.
    - volts: 12.6
      current_a: 0.15
      legs: [[4], [5]]
      unused: [9]
      note: >-
        Series: the two ends are the supply legs and the halves sit in series
        across 12.6 V. The centre tap carries no supply leg (a drawing may
        still take a hum-balance or elevation reference off it).
  source: >-
    RCA 12AY7 data sheet, General Data — "Heater Arrangement: Series /
    Parallel", 12.6 / 6.3 V AC or DC at 0.15 / 0.3 A, on the 9A basing whose
    heater spans pins 4 and 5 with the centre tap at pin 9.
  source_url: https://frank.pocnet.net/sheets/049/1/12AY7.pdf
used_in: ["5d3", "5e3", "5e4a", "5e5a", "5e6a", "5f4", "5f6", "5f6a", "5f8a", "5g9"]
